[project]
name = "ee-skills"
version = "0.1.0"
description = "Sourced circuit-design best practices as Claude Code skills, with a rule catalog and KiCad verification harness"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"
dependencies = ["pyyaml>=6", "numpy>=1.26"]

[project.optional-dependencies]
dev = ["pytest>=8"]
urls = ["httpx>=0.27"]

[tool.pytest.ini_options]
testpaths = ["tests"]
