# Catalog rule id -> function in geometry.py. ``params`` entries resolve to thresholds:
#   "param_name"                        catalog parameters[].name of the rule itself
#   {param, op?, scale?}                same, with an op override (e.g. the catalog's '==' read as a floor) or a multiplier
#   {rule: ID, param: name}             a parameter of another catalog rule
#   {design: key}                       project_thresholds[key] in design/<board>.yaml (catalog says "project-set / empirical")
#   {text, op, value, unit}             a threshold that only exists in the rule / verify.check prose (no number in parameters[])
# ``flags`` pass fixed switches to the function.

DFM-FLR-006:
  fn: smd_pad_edge_distance
  params:
    pad: component_pad_to_board_edge
    fiducial: fiducial_clearance_to_board_edge
    fiducial_zone_diameter: {rule: DFM-PLC-003, param: fiducial_copper_free_diameter}

DFM-PLC-003:
  fn: fiducials
  params:
    count: fiducial_count_min
    diameter: fiducial_copper_diameter
    opening: fiducial_mask_opening_diameter
    free: fiducial_copper_free_diameter
    edge: fiducial_edge_clearance

DFM-MFG-009:
  fn: test_points
  params:
    signal: tp_pad_diameter_signal_min
    power: tp_pad_diameter_power_min
    pitch: tp_center_pitch_min
    body: tp_to_component_body
    edge: tp_to_board_edge

DFM-RTE-002:
  fn: via_in_smd_pad
  params:
    zero: {text: "no via centre inside an SMD pad (heat-sink pads exempt) -- catalog verify.check: hits fail", op: "==", value: 0, unit: count}

DFM-LIB-002:
