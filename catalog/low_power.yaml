# 低功耗 / 电池供电 / IoT 最佳实践（domain: low_power）
# 约定：电源拓扑 / LDO / 开关电源设计规则属于 power 域；这里只写「功耗」相关规则。

- id: LPW-ARC-001
  title: 先建立分状态的平均电流与电荷预算
  domain: low_power
  stage: architecture
  severity: should
  rule: "选型前把整机拆成状态（深睡、唤醒启动、传感、无线 TX/RX、电机等），用 I_avg = Σ(I_state × t_state) / T 计算平均电流和每周期电荷，并找出占比最大的状态；占空比极低时，睡眠态电荷往往超过发射态。"
  rationale: "电池寿命取决于电荷的时间积分而不是峰值电流。TI 案例里 6 小时一次、10 µA 的测量期，其电荷是 250 mA × 0.4 s 发射期的两倍以上，所以优化重点在待机而不是峰值。"
  applies_to: [battery, iot, duty-cycled]
  parameters:
    - name: standby_to_tx_charge_ratio_case_study
      op: ">"
      value: 2
      unit: ratio
      note: "SLVAER8A 案例：10 µA × 21600 s 与 250 mA × 0.4 s 两段的输入电荷比约 2.16；只是示例，不是阈值"
  verify:
    - method: bom_check
      tool: "Python 或电子表格能量预算脚本（输入：每个状态的电流、时长、每日事件数；输出：I_avg、各状态电荷占比、电池寿命）"
      check: "Q_cycle = Σ I_state × t_state；I_avg = Q_cycle / T；寿命 = 修正后电池容量 / I_avg。列出电荷占比 > 20% 的状态逐个审查，占比数值是评审用的经验线，不是出处数值"
      automatable: partial
    - method: bench
      tool: "Joulescope JS220 / Nordic PPK2 / Qoitech Otii，覆盖完整占空周期"
      check: "实测一个完整周期的累计电荷，与模型对比；偏差大于仪表精度（PPK2 平均值 ±10%）时回查哪个状态被低估"
      automatable: partial
  sources:
    - title: "SLVAER8A Extending Battery Life With Low Quiescent Current and Dynamic Voltage Scaling"
      url: "https://www.ti.com/lit/an/slvaer8a/slvaer8a.pdf"
      publisher: "Texas Instruments"
      kind: app_note
      section: "§2 Case Study, Table 2-2"
    - title: "Overcoming Low-IQ Challenges in Low-Power Applications (SLYY203)"
      url: "https://www.ti.com/lit/pdf/slyy203"
      publisher: "Texas Instruments"
      kind: app_note
      section: "Equation 2"
    - title: "High pulse drain impact on CR2032 coin cell battery capacity"
      url: "https://devzone.nordicsemi.com/cfs-file/__key/communityserver-discussions-components-files/4/0842.High-pulse-drain-impact-on-CR2032-coin-cell-battery-capacity.pdf"
      publisher: "Nordic Semiconductor / Energizer"
      kind: app_note
      section: "Summary item 5"
  confidence: high
  tags: [cat-feeder]

- id: LPW-ARC-002
  title: 用输入端折算公式核算常开轨待机电流
  domain: low_power
  stage: architecture
  severity: should
  rule: "常开轨的电池侧待机电流按 I_standby = I_Q,VIN + I_leak + (V_OUT / (V_IN·η)) × (I_Q,VOUT + I_FB + I_LOAD) 计算，寿命 = 容量 / (I_standby + I_电池自放电)；不能只拿稳压器数据手册上的 Iq 代表整条轨。"
  rationale: "稳压器 Iq 只是其中一项：反馈分压、电容和二极管漏电、VOUT 端的 Iq 与负载都要折算到输入端。TI 的例子里 TPS61099 的 VIN 侧 400 nA 与 VOUT 侧 600 nA 并不能直接相加，实际无负载输入电流约 1.3 µA。一次性锂电池自身也有自放电。"
  applies_to: [battery, ldo, buck, boost, always-on-rail]
  parameters:
    - name: coin_cell_self_discharge
      op: "=="
      value: 1
      unit: "%/year"
      note: "Energizer CR2032 数据手册 ~1%/年；按 235 mAh 约合 0.27 µA（自行折算）"
  verify:
    - method: bom_check
      tool: "能量预算脚本（见 LPW-NET-001）"
      check: "对常开轨逐项求 I_standby；VOUT 侧电流除以 (V_IN·η/V_OUT) 折算到输入；η 取待机负载点的数据手册效率曲线值；寿命公式里加上电池自放电项"
      automatable: partial
    - method: bench
      tool: "Joulescope / PPK2 / SMU 串在电池与整板之间"
      check: "整板进入最低睡眠态后测电池侧电流，与脚本计算值比较，差值需能被某项已知漏电解释"
      automatable: manual
  sources:
    - title: "Overcoming Low-IQ Challenges in Low-Power Applications (SLYY203)"
      url: "https://www.ti.com/lit/pdf/slyy203"
      publisher: "Texas Instruments"
      kind: app_note
      section: "Equations 1 and 2 (p.4)"
    - title: "3 Quiescent-current (Iq) Specifications to Understand (SSZT118)"
      url: "https://www.ti.com/lit/pdf/sszt118"
      publisher: "Texas Instruments"
      kind: app_note
    - title: "Energizer CR2032 product datasheet"
      url: "https://data.energizer.com/pdfs/cr2032.pdf"
      publisher: "Energizer"
      kind: datasheet
  confidence: high
  tags: [cat-feeder]

- id: LPW-ARC-003
  title: 按真实负载曲线、终止电压和温度降额电池容量
  domain: low_power
  stage: architecture
  severity: should
  rule: "不要直接使用数据手册标称容量（Energizer CR2032：235 mAh，条件 15 kΩ、21 °C、到 2.0 V）；用你的脉冲/连续负载、FEP 终止电压和工作温度下的有效容量，寿命 = 修正容量 / 最坏工作模式下的 I_avg。"
  rationale: "电池内阻造成瞬时压降，化学极化又随脉冲时长累积，高倍率下可用容量显著下降。Energizer 与 Nordic 的测试：500 µA 以下可用约 240 mAh，2.5 mA 连续放电到 2.0 V 只剩 175 mAh，30 mA 脉冲每 10 ms 一次约 125 mAh。TI 实测六家 CR2032 供应商，个别品牌只有标称的约 50%。"
  applies_to: [coin-cell, primary-lithium, battery]
  parameters:
    - name: cr2032_capacity_continuous_2p5mA_fep2p0
      op: "=="
      value: 175
      unit: mAh
      note: "Energizer/Nordic 图 3：2.5 mA 连续、FEP 2.0 V"
    - name: cr2032_capacity_30mA_pulse_10ms_period_fep2p0
      op: "=="
      value: 125
      unit: mAh
      note: "Energizer/Nordic 图 5(A)：30 mA 脉冲每 10 ms 一次"
    - name: cr2032_operating_temperature
      op: range
      value: [-30, 60]
      unit: degC
      note: "Energizer 数据手册工作温度；容量仅在 21 °C 标称，没有给低温降额"
    - name: capacity_loss_peak_15_to_30mA
      op: "=="
      value: 9
      unit: "%"
      note: "SWRA349：峰值 15 mA 升到 30 mA 的平均有效容量损失，六家供应商平均"
  conflicts: "Energizer/Nordic 给出峰值 < 30 mA 且 FEP ≤ 2.0 V 时约 175–185 mAh；TI SWRA349 实测发现部分品牌/无牌电池只有标称的约 50%，且电池间离散大。取舍：设计按最差供应商或实测样品降额，不要信任单一厂商曲线；低温下内阻更高，SWRA349 只作了「可能更严重」的推测，需要自己实测。"
  verify:
    - method: bench
      tool: "可编程电阻网络/电子负载按真实脉冲曲线放电（参考 SWRA349 的开关电阻网络），恒温箱 −10 / 25 / 45 °C"
      check: "记录电池端电压降到 FEP 时的累计 mAh，取最差样品作为设计容量"
      automatable: manual
    - method: bom_check
      tool: "能量预算脚本"
      check: "容量查表（负载电流、FEP、温度三维）取最差值；寿命 = 修正容量 / 最坏模式 I_avg，其中最坏模式取电池寿命内可能进入的最短脉冲周期"
      automatable: partial
  sources:
    - title: "High pulse drain impact on CR2032 coin cell battery capacity"
      url: "https://devzone.nordicsemi.com/cfs-file/__key/communityserver-discussions-components-files/4/0842.High-pulse-drain-impact-on-CR2032-coin-cell-battery-capacity.pdf"
      publisher: "Nordic Semiconductor / Energizer"
      kind: app_note
      section: "Figures 3, 5, 9; Summary"
    - title: "SWRA349 Coin cells and peak current draw"
      url: "https://www.ti.com/lit/wp/swra349/swra349.pdf"
      publisher: "Texas Instruments"
      kind: app_note
      section: "§3, §5"
    - title: "Energizer CR2032 product datasheet"
      url: "https://data.energizer.com/pdfs/cr2032.pdf"
      publisher: "Energizer"
      kind: datasheet
  confidence: high

- id: LPW-ARC-004
  title: 全板最高的最低工作电压决定电池终止电压
  domain: low_power
  stage: architecture
  severity: should
  rule: "汇总电池轨上所有器件的最低工作电压，取最大者作为 FEP（功能终止电压），用它来读取电池可用容量；即使该器件在无线发射脉冲期间处于空闲，也要计入。"
  rationale: "Energizer/Nordic 的数据：FEP 2.0 V 时峰值 ≤ 30 mA 可得 175–185 mAh；FEP 提高到 2.4 V，峰值 10 mA 仍有约 175 mAh，30 mA 峰值只剩约 100 mAh。空闲器件在电压过低时配置也可能丢失，所以同样会限定 FEP。"
  applies_to: [battery, coin-cell]
  parameters:
    - name: cr2032_capacity_fep2p4_30mA_peak
      op: "=="
      value: 100
      unit: mAh
      note: "Energizer/Nordic 图 9：FEP 2.4 V、峰值约 30 mA、25 ms 周期"
    - name: esp32c3_min_supply_voltage
      op: ">="
      value: 3.0
      unit: V
      note: "ESP32-C3 VDDA/VDD3P3/VDD3P3_RTC 推荐范围 3.0–3.6 V（数据手册表 5-2），因此不能让 CR2032 放电到 2.0 V 再维持射频"
  verify:
    - method: bom_check
      tool: "Python：读 BOM + 器件参数表（LPW-LIB-001 的 V_min_operating 字段）"
      check: "FEP = max(各器件 V_min)，输出决定 FEP 的器件；FEP 必须 ≤ 电池在最坏负载、最低温度下的预期电压"
      automatable: full
    - method: review
      tool: "评审清单"
      check: "确认每个电池轨器件的 V_min 取自数据手册推荐工作范围而非绝对最大值"
      automatable: manual
  sources:
    - title: "High pulse drain impact on CR2032 coin cell battery capacity"
      url: "https://devzone.nordicsemi.com/cfs-file/__key/communityserver-discussions-components-files/4/0842.High-pulse-drain-impact-on-CR2032-coin-cell-battery-capacity.pdf"
      publisher: "Nordic Semiconductor / Energizer"
      kind: app_note
      section: "Battery capacity vs. peak currents; Figure 9"
    - title: "ESP32-C3 Series Datasheet v2.4"
      url: "https://documentation.espressif.com/esp32-c3_datasheet_en.pdf"
      publisher: "Espressif"
      kind: datasheet
      section: "Table 5-2 Recommended Operating Conditions"
  confidence: high

- id: LPW-ARC-005
  title: 按实际待机负载选稳压器，而不是只看标称 Iq
  domain: low_power
  stage: architecture
  severity: should
  rule: "稳压器以「目标待机负载点的电池侧输入电流」选型：Iq 只是无负载、不开关、已使能状态下的开销，需同时看无负载输入电流曲线、目标负载点效率，并确认 power-save 模式已使能；睡眠态负载为几十 µA 以上时 Iq 的影响迅速减弱。"
  rationale: "TI 指出 IQ 不等于无负载输入电流：TPS61221 的 IQ 为 0.5 µA（VIN）+5 µA（VOUT），但 1.2 V→3.3 V 时无负载输入电流约 20 µA。TPS62120 带 100 µA 待机负载时效率只有 60%，IQ 不再是主导。另一方面，IQ 从 300 nA 降到 75 nA 在 TI 的案例里让寿命延长 9%。"
  applies_to: [buck, boost, buck-boost, ldo, battery]
  parameters:
    - name: example_buck_iq_typ
      op: "=="
      value: 60
      unit: nA
      note: "TPS62840 工作 IQ 典型值；1 µA 负载（3.6 V→1.8 V）效率 80%，数据手册首页"
    - name: iq_reduction_case_life_gain
      op: "=="
      value: 9
      unit: "%"
      note: "SLVAER8A：IQ 75 nA 对 300 nA，寿命延长 9%（固定系统电压，6 h 10 µA + 0.4 s 250 mA 的负载曲线）"
  verify:
    - method: bom_check
      tool: "Python 读器件参数表 + 数据手册效率曲线数字化数据"
      check: "I_in = V_out × I_out / (V_in × η(I_out))，在睡眠负载点与 TX 负载点分别计算；记录 Iq 的测试条件（是否开关、VIN、VOUT、温度）"
      automatable: partial
    - method: spice
      tool: "厂商 PSpice/TINA 模型（含 power-save）"
      check: "无负载与待机负载下的稳态输入电流平均值，与数据手册曲线对照"
      automatable: partial
    - method: bench
      tool: "Joulescope / SMU"
      check: "把负载固定在待机电流（电子负载或实际睡眠 MCU）测输入电流，换算效率"
      automatable: manual
  sources:
    - title: "IQ: What it is, what it isn't, and how to use it (SLYT412)"
      url: "https://www.ti.com/lit/an/slyt412/slyt412.pdf"
      publisher: "Texas Instruments"
      kind: app_note
      section: "What IQ is / What IQ isn't / How to use IQ"
    - title: "SLVAER8A Extending Battery Life With Low Quiescent Current and Dynamic Voltage Scaling"
      url: "https://www.ti.com/lit/an/slvaer8a/slvaer8a.pdf"
      publisher: "Texas Instruments"
      kind: app_note
      section: "Table 2-1, Table 2-2"
    - title: "TPS62840 1.8-V to 6.5-V, 750-mA, 60-nA IQ Step-Down Converter"
      url: "https://www.ti.com/lit/ds/symlink/tps62840.pdf"
      publisher: "Texas Instruments"
      kind: datasheet
  confidence: high
  tags: [cat-feeder]

- id: LPW-ARC-006
  title: 线性稳压器的 Iq 是睡眠电流的下限
  domain: low_power
  stage: architecture
  severity: should
  rule: "把 LDO 的静态电流计入睡眠预算：AMS1117-3.3 典型 5 mA、最大 10 mA，比 ESP32-C3 深睡 5 µA 高三个数量级。睡眠电流或待机能耗有要求时，改用 µA/nA 级 Iq 的 LDO（如 TPS7A02 25 nA）或开关稳压器，或用 EN/负载开关把该稳压器断开。"
  rationale: "LDO 的静态电流与输出负载无关，直接叠加在 MCU 之上。以 AMS1117 的 5 mA 为底，整板睡眠电流不可能低于这个值，所以 MCU 深睡的 5 µA 毫无意义。市面开发板深睡电流远高于芯片数据手册值，常见原因就是 AMS1117 一类的 LDO、电源 LED 和 USB 串口桥。"
  applies_to: [ldo, battery, esp32-c3, always-on-rail]
  parameters:
    - name: ams1117_quiescent_current_typ
      op: "=="
      value: 5
      unit: mA
      note: "AMS1117 固定电压版，VIN ≤ 12 V，IOUT = 0 mA；最大 10 mA。AMS1117 另标最小负载电流 5 mA 典型、10 mA 最大（可调版）"
    - name: ams1117_quiescent_current_max
      op: "<="
      value: 10
      unit: mA
      note: "同上。另一个版本和 JLCPCB 博客写 11 mA 最大，见 conflicts"
    - name: esp32c3_deep_sleep_current_typ
      op: "=="
      value: 5
      unit: uA
      note: "ESP32-C3 数据手册表 5-9：RTC 定时器 + RTC 内存"
    - name: tps7a02_iq_typ
      op: "=="
      value: 25
      unit: nA
      note: "TPS7A02 典型 IQ（关断 3 nA 典型），数据手册首页，可作为替换参照"
  conflicts: "AMS1117 不同厂商/版本的数据手册 Iq 不一致：本次读到的 Advanced Monolithic 版本为 5 mA 典型/10 mA 最大；JLCPCB 博客引用的是 5/11 mA；搜索结果里还看到个别克隆厂商的页面标得更低（未打开确认）。取舍：按 BOM 实际料号的数据手册取最大值做预算，并用实测校验。"
  verify:
    - method: bom_check
      tool: "Python：遍历 BOM 中的 LDO/稳压器，读取 Iq_max（工作温度、VIN）"
      check: "Σ Iq_max（常开稳压器）≤ 睡眠预算的 50%（比例为设计经验，不是出处数值）；超出则要求换件或增加断电路径"
      automatable: partial
    - method: bench
      tool: "SMU 或 Joulescope 串在 5 V 输入端"
      check: "MCU 进入深睡后测 5 V 输入电流；该电流减去 MCU 实测值应落在 LDO 的 Iq 范围内"
      automatable: manual
  sources:
    - title: "AMS1117 1A Low Dropout Voltage Regulator datasheet"
      url: "https://www.rcscomponents.kiev.ua/datasheets/AMS1117-datasheet.PDF"
      publisher: "Advanced Monolithic Systems (distributor mirror)"
      kind: datasheet
      section: "Electrical Characteristics: Quiescent Current, Minimum Load Current"
    - title: "ESP32-C3 Series Datasheet v2.4"
      url: "https://documentation.espressif.com/esp32-c3_datasheet_en.pdf"
      publisher: "Espressif"
      kind: datasheet
      section: "Table 5-9 Current Consumption in Low-Power Modes"
    - title: "TPS7A02 Nanopower IQ, 25-nA, 200-mA LDO"
      url: "https://www.ti.com/lit/ds/symlink/tps7a02.pdf"
      publisher: "Texas Instruments"
      kind: datasheet
    - title: "ESP32 Power Consumption: Modes, Deep Sleep & Battery Life"
      url: "https://jlcpcb.com/blog/esp32-power-consumption-explained"
      publisher: "JLCPCB"
      kind: blog
  confidence: high
  tags: [cat-feeder]

- id: LPW-ARC-007
  title: 用负载开关划分电源域，切断高漏电子系统
  domain: low_power
  stage: architecture
  severity: should
  rule: "把待机漏电或静态电流超出预算的子系统（无线模块、传感器、放大器、HX711 加称重桥这类模拟前端）放入可切断电源域，用关断电流低的负载开关或 P-MOS 高端开关断电，常开域只留 MCU、RTC 和唤醒电路。选型用 I_avg = D·(I_load + I_Q) + (1−D)·I_SD 比较，Iq 与 Isd 都随 VIN 和温度升高。"
  rationale: "许多模块即使在自己的关断模式下也有 mA 级漏电，负载开关能把它降到 µA 以下。TI 例：5 V 轨下模块待机漏电 1 mA，经负载开关降到 1 µA 以下，功耗降为千分之一；Nordic 也建议给高漏电传感器加 GPIO 控制的高端 P-MOS 来降低 SYSTEM_OFF 电流。"
  applies_to: [load-switch, p-mosfet, power-gating, sensor, radio-module]
  parameters:
    - name: example_load_switch_off_current_max
      op: "<="
      value: 100
      unit: nA
      note: "TPS22916 关断电流 ISD：典型 10 nA，−40~85 °C 最大 100 nA；导通 IQ 典型 0.5 µA、最大 1 µA；ON 引脚带 750 kΩ 智能下拉"
    - name: example_leakage_reduction_factor
      op: "=="
      value: 1000
      unit: x
      note: "SLVA652A §5.2：1 mA 待机漏电经负载开关降到 < 1 µA"
  verify:
    - method: bom_check
      tool: "Python 能量预算脚本"
      check: "每个可切断域：ISD_max(Tmax, VIN) + 域内仍然上电器件的反灌电流 ≤ 该域的关断预算；对导通态占空比 D 高的域改比 Iq"
      automatable: partial
    - method: bench
      tool: "Joulescope / SMU 串在电池侧"
