      tool: "Python：睡眠状态表（YAML）+ KiCad 网表 XML"
      check: "对每个 GPIO 网络，列出外部电阻到哪个电源/地；若睡眠态驱动电平与外部电阻方向相反，或睡眠态为高阻且网络无外部拉电阻，则报告"
      automatable: partial
    - method: bench
      tool: "Joulescope + 示波器/万用表测各 GPIO 睡眠电平"
      check: "深睡中逐个测 GPIO 的电压是否等于状态表预期，且无半电平"
      automatable: manual
  sources:
