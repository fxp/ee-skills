- id: LPW-ARC-009
  title: Wi-Fi 保持连接还是深睡重连，按平均电流预算选
  domain: low_power
  stage: architecture
  severity: consider
  rule: "联网设备按响应延迟与平均电流预算选策略：ESP32-C3 屏蔽箱实测，Modem-sleep 平均约 20–21 mA（开 DFS 约 10–11 mA）；Auto Light-sleep 平均 1.4 mA（DTIM1）、0.62 mA（DTIM3）、0.31 mA（DTIM10）；Deep-sleep 断开 Wi-Fi 约 4.8 µA。路由器 DTIM 越短越耗电。"
  rationale: "保持连接的代价比深睡高 2–3 个数量级。主要等待指令的设备适合 Auto Light-sleep，而 CPU 要持续运行的场景才用 Modem-sleep + DFS。"
  applies_to: [esp32-c3, wifi, iot]
  parameters:
    - name: auto_light_sleep_avg_current_dtim1
      op: "=="
      value: 1.4
      unit: mA
      note: "160 MHz，屏蔽箱测量；DTIM3 0.62 mA，DTIM10 0.31 mA"
    - name: modem_sleep_avg_current_dtim1
      op: "=="
      value: 21.47
      unit: mA
      note: "未开 DFS；开 DFS 为 11.35 mA"
    - name: deep_sleep_avg_current_wifi_disconnected
      op: "=="
      value: 4.8
      unit: uA
      note: "与数据手册 5 µA 一致，但 Wi-Fi 连接断开"
  verify:
    - method: bench
      tool: "Joulescope / PPK2，目标 AP，抓取至少 10 个 DTIM 周期以上的平均值"
      check: "在目标路由器的真实 DTIM 设置下测平均电流，与预算比较；换路由器后复测，因为 DTIM 由 AP 决定"
      automatable: partial
    - method: review
      tool: "评审清单"
      check: "确认应用不需要广播/多播包，否则 Max Modem 的 listen interval 会丢包"
      automatable: manual
  sources:
    - title: "Wi-Fi Low Power Guidance - ESP32-C3 - ESP-IDF Programming Guide"
      url: "https://docs.espressif.com/projects/esp-idf/en/stable/esp32c3/api-guides/low-power-mode/low-power-mode-wifi.html"
      publisher: "Espressif"
      kind: vendor_guide
      section: "Average Current by Mode; Application Tips"
  confidence: high
  tags: [cat-feeder]

- id: LPW-ARC-010
  title: 睡眠预算要计入 Flash 待机电流
  domain: low_power
  stage: architecture
  severity: consider
  rule: "Light-sleep 下 SPI Flash 默认仍供电，待机约 10–30 µA；可配置 Deep Power-Down（常低于 1 µA，需要 Flash 支持）。esp_deep_sleep_start() 总会让 Flash 掉电；不建议在 Light-sleep 里直接断 Flash 供电，掉电时间可能超过 300 ms，滤波电容会让它更长。"
  rationale: "Flash 的待机电流在 Light-sleep 的 130 µA 里占相当比例；Deep-sleep 路径由 ESP-IDF 处理，但 Light-sleep 需要显式选择 DPD。"
  applies_to: [esp32-c3, flash, light-sleep]
  parameters:
    - name: spi_flash_standby_current
      op: range
      value: [10, 30]
      unit: uA
      note: "ESP-IDF 文档描述：保持 Flash 供电约 10–30 µA，常见乐鑫 SPI Flash 低于 30 µA"
    - name: spi_flash_dpd_current
      op: "<"
      value: 1
      unit: uA
      note: "多数 Flash 的 DPD 电流，需查具体型号数据手册"
  verify:
    - method: bom_check
      tool: "读取模块/Flash 数据手册"
      check: "确认 Flash 型号是否支持 DPD 命令，把 standby 与 DPD 电流写入器件参数表"
      automatable: partial
    - method: bench
      tool: "Joulescope / PPK2"
      check: "Light-sleep 下开/关 CONFIG_ESP_SLEEP_SET_FLASH_DPD 各测一次，对比差值"
      automatable: manual
  sources:
    - title: "Sleep Modes - ESP32-C3 - ESP-IDF Programming Guide"
      url: "https://docs.espressif.com/projects/esp-idf/en/stable/esp32c3/api-reference/system/sleep_modes.html"
      publisher: "Espressif"
      kind: vendor_guide
      section: "Flash in sleep; Minimizing power consumption"
  confidence: high
