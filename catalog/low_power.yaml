- id: LPW-ARC-011
  title: RTC 备份与超级电容容量必须计入漏电
  domain: low_power
  stage: architecture
  severity: should
  rule: "备份时间按 t = C·ΔV / (I_load + I_leak) 计算，ΔV = 备份源电压 − 负载最低保持电压；超级电容漏电（µA 级）通常远大于 RTC 自身电流，必须相加；超级电容 ESR 在 nA 级负载下可忽略，但有突发电流时不能；并按电压和温度降额以保证寿命。"
  rationale: "Abracon 例：RTC 最大 330 nA，超级电容漏电 4 µA，总放电电流 4.33 µA，漏电是备份能量损失的主因。Micro Crystal 也指出，大容量电容的漏电可轻易超过 RTC 的工作电流。超级电容标称寿命约 1000–2000 小时，降额后可到多年。"
  applies_to: [rtc, supercap, backup, always-on-rail]
  parameters:
    - name: supercap_leakage_example
      op: "=="
      value: 4
      unit: uA
      note: "Abracon 例；同一系列最佳情况 3 µA，RTC 负载最大 330 nA"
    - name: supercap_rated_life_hours
      op: range
      value: [1000, 2000]
      unit: hours
      note: "行业标称寿命，降额电压与温度后延长到数年"
    - name: supercap_longevity_end_of_life
      op: qualitative
      value: null
      note: "容量下降 30% 或 ESR 升到 2 倍视为寿命终点（Abracon）"
  verify:
    - method: bom_check
      tool: "电子表格/脚本"
      check: "C_min = (I_load + I_leak_max) × t_backup / (V_backup − V_min_RTC)，I_leak 取最高温度下数据手册值；再乘容量公差和寿命末期 70% 容量"
      automatable: partial
    - method: bench
      tool: "充满后断开主电源，用数据采集器记录 VBACKUP 衰减"
      check: "在最高工作温度、24 h 以上保持，电压不低于 RTC 保持电压；首次上电的数十小时内漏电更高，需要稳定后再取值"
      automatable: manual
  sources:
    - title: "Using Supercapacitors as RTC Power Backup"
      url: "https://abracon.com/uploads/resources/Abracon-Application-Note-Using-Supercapacitors-as-RTC-Power-Backup.pdf"
      publisher: "Abracon"
      kind: app_note
      section: "Standard Capacitors vs. Supercapacitors; Capacitor Selection and Calculations"
    - title: "RV-1805-C3 Application Note: RTC Capacitor Backup"
      url: "https://www.microcrystal.com/fileadmin/Media/Products/RTC/Whitepapers/RV-1805-C3_App-Note_Cap_Backup.pdf"
      publisher: "Micro Crystal"
      kind: app_note
      section: "§3.2 Capacitor characteristics"
  confidence: high

- id: LPW-ARC-012
  title: 无线突发电流下电源内阻不能把电压拉到下限以下
  domain: low_power
  stage: architecture
  severity: must
  rule: "对每个电源（电池、LDO、5 V 输入）校核 V_open − I_peak × (R_int + R_path) − ΔV_ripple ≥ V_min。ESP32-C3 要求外部电源在 3.0–3.6 V 下至少能给 500 mA，Wi-Fi TX 峰值 276–335 mA，TX 时纹波峰值应小于 80 mV（802.11n MCS7）或 120 mV（11 Mbps）。CR2032 一类高内阻电池不能直接给 Wi-Fi 射频供电。"
  rationale: "电池内阻（随放电快速上升，TI 测得 30 mA 峰值时可承受的内阻上限约 30 Ω）乘以射频电流就是压降。电压掉到 3.0 V 以下会触发复位或掉电，电源纹波还会直接恶化 TX 性能。"
  applies_to: [esp32-c3, wifi, ble, battery, ldo]
  parameters:
    - name: esp32c3_external_supply_current_min
      op: ">="
      value: 500
      unit: mA
      note: "原理图检查表 Power Supply；模块数据手册表 6-2 IVDD 最小值 0.5 A"
    - name: esp32c3_supply_voltage_range
      op: range
      value: [3.0, 3.6]
      unit: V
      note: "数据手册表 5-2"
    - name: esp32c3_wifi_tx_peak_current
      op: "=="
      value: 335
      unit: mA
      note: "表 5-7：802.11b 1 Mbps @21 dBm 峰值，100% 占空；MCS7 为 276 mA"
    - name: tx_ripple_peak_mcs7
      op: "<"
      value: 80
      unit: mV
      note: "802.11n MCS7 发射时"
    - name: tx_ripple_peak_11mbps
      op: "<"
      value: 120
      unit: mV
      note: "11 Mbps 发射时"
    - name: coin_cell_internal_resistance_limit_30mA_peak
      op: "<="
      value: 30
      unit: ohm
      note: "SWRA349：30 mA 峰值负载下电路能承受的电池内阻上限约 30 Ω（15 mA 约 60 Ω），属 BLE 级别负载，Wi-Fi 的 300 mA 级峰值远超此范围"
  verify:
    - method: spice
      tool: "ngspice/LTspice：电池（V_open + R_int）+ 路径电阻 + 去耦电容 + 突发电流源（TX 脉冲波形）"
      check: "最坏情况（低温、老化高内阻、低电量）下负载端电压最小值 ≥ 3.0 V，TX 期间纹波峰值满足上表；电容复充时间小于睡眠间隔"
      automatable: partial
    - method: bom_check
      tool: "Python"
      check: "R_int_max × I_peak < V_open_min − V_min，其中 R_int 取电池寿命末期值；LDO 取其最大输出电流（AMS1117 限流 900–1500 mA）是否 ≥ 500 mA"
      automatable: full
  sources:
    - title: "Schematic Checklist - ESP32-C3 - ESP Hardware Design Guidelines"
      url: "https://docs.espressif.com/projects/esp-hardware-design-guidelines/en/latest/esp32c3/schematic-checklist.html"
      publisher: "Espressif"
      kind: vendor_guide
      section: "Power Supply"
    - title: "ESP32-C3 Series Datasheet v2.4"
      url: "https://documentation.espressif.com/esp32-c3_datasheet_en.pdf"
      publisher: "Espressif"
      kind: datasheet
      section: "Tables 5-2, 5-7"
    - title: "ESP32-C3-WROOM-02 Datasheet"
      url: "https://documentation.espressif.com/esp32-c3-wroom-02_datasheet_en.pdf"
      publisher: "Espressif"
      kind: datasheet
      section: "Table 6-2 Recommended Operating Conditions"
    - title: "ESP32-C3 Wireless Adventure: Guidelines for Power Supply Design"
      url: "https://espressif.github.io/esp32-c3-book-en/chapter_5/5.3/5.3.5.html"
      publisher: "Espressif"
      kind: vendor_guide
    - title: "SWRA349 Coin cells and peak current draw"
      url: "https://www.ti.com/lit/wp/swra349/swra349.pdf"
      publisher: "Texas Instruments"
      kind: app_note
      section: "§3 Testing peak currents"
  confidence: high
  tags: [cat-feeder]

- id: LPW-ARC-013
  title: 定时唤醒精度要求决定 RTC 慢时钟来源
  domain: low_power
  stage: architecture
  severity: consider
  rule: "需要跨睡眠的定时精度（如喂食计划）时，明确 RTC 慢时钟来源：内部 RC 的精度较差、频率偏差较大，外部 32.768 kHz 晶振精度高但要占用 GPIO0/GPIO1（XTAL_32K_P/N）；对精度不敏感的场景，用内部 RC 并做周期校准或联网校时。"
  rationale: "Deep-sleep 唤醒时间由 RTC 慢时钟计时。ESP-IDF 文档说明内部 RC 源精度和频偏都不如外部晶振；GPIO0、GPIO1 又是 Deep-sleep 可用的唤醒引脚，占用后要权衡引脚分配。"
  applies_to: [esp32-c3, rtc, deep-sleep]
  parameters:
    - name: rtc_slow_clock_rc_frequency
      op: qualitative
      value: null
      note: "ESP-IDF 睡眠文档按约 136 kHz 估算周期，低功耗文档写约 150 kHz；以所用芯片版本的数据手册为准，且需要出厂校准或运行时校准"
  verify:
    - method: bench
      tool: "逻辑分析仪或示波器测 GPIO 翻转时间，Joulescope 记录唤醒时刻"
      check: "连续 24 h 睡眠/唤醒周期，统计唤醒时间漂移，与应用允许误差对比；高/低温下各测一次"
      automatable: partial
    - method: review
      tool: "评审清单"
      check: "GPIO0/GPIO1 是否已被晶振占用，Deep-sleep 唤醒按键是否仍有可用的 RTC 域引脚"
      automatable: manual
  sources:
    - title: "Low Power Mode - SoC - ESP32-C3 - ESP-IDF Programming Guide"
      url: "https://docs.espressif.com/projects/esp-idf/en/stable/esp32c3/api-guides/low-power-mode/low-power-mode-soc.html"
      publisher: "Espressif"
      kind: vendor_guide
      section: "Recommended configuration: RTC slow clock"
    - title: "Sleep Modes - ESP32-C3 - ESP-IDF Programming Guide"
      url: "https://docs.espressif.com/projects/esp-idf/en/stable/esp32c3/api-reference/system/sleep_modes.html"
      publisher: "Espressif"
      kind: vendor_guide
      section: "GPIO wakeup timing (RC_SLOW / XTAL32K periods)"
