      url: "https://cdn.sparkfun.com/datasheets/Sensors/ForceFlex/hx711_english.pdf"
      publisher: "Avia Semiconductor"
      kind: datasheet
      section: "Features; Electrical characteristics; Reset and Power-Down, Fig.3"
    - title: "Sleep Modes - ESP32-C3 - ESP-IDF Programming Guide"
      url: "https://docs.espressif.com/projects/esp-idf/en/stable/esp32c3/api-reference/system/sleep_modes.html"
      publisher: "Espressif"
      kind: vendor_guide
      section: "Pull-ups, pulldowns, and hold behavior"
  confidence: high
