- id: LPW-SCH-008
  title: 指示灯是睡眠电流大户，要由 GPIO 驱动并在睡眠中熄灭
  domain: low_power
  stage: schematic
  severity: should
  rule: "常亮的电源/状态 LED 要么去掉，要么由 MCU GPIO 驱动并在睡眠前熄灭，要么改成脉冲点亮；限流电阻按 I = (V_rail − Vf)/R 核算。避免用 gpio_hold 把 LED 引脚保持在会使 LED 导通的电平。"
  rationale: "3.3 V 轨、Vf 2.0 V、1 kΩ 限流的电源 LED 约 1.3 mA，是 ESP32-C3 深睡 5 µA 的 260 倍。多篇开发板测量文章都把电源 LED、LDO 和 USB 串口桥列为实测深睡电流远高于数据手册的主因；Qoitech 的测量里，对驱动 LED 的 GPIO 调用 gpio_deep_sleep_hold_en 后读数是 461 µA，去掉该调用后降到 41.6 µA。"
  applies_to: [led, indicator, esp32-c3]
  parameters:
    - name: example_power_led_current
      op: "=="
      value: 1.3
      unit: mA
      note: "JLCPCB 博客例：(3.3 V − 2.0 V) / 1 kΩ"
  verify:
    - method: bom_check
      tool: "Python 读网表"
      check: "找出阳极/阴极经电阻连到常开轨且无晶体管/GPIO 控制的 LED 支路，I = (V_rail − Vf)/R 累加；有则报告"
      automatable: full
    - method: bench
      tool: "Joulescope"
      check: "睡眠中拆/断 LED 前后对比电流"
      automatable: manual
  sources:
