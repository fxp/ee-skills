- id: LPW-SCH-007
  title: 电池电压监测不要用常通分压
  domain: low_power
  stage: schematic
  severity: should
  rule: "电池或轨电压监测用可开关的分压：低端 N-MOS（或 GPIO 在采样时拉低、平时高阻），或高端 P-MOS 加小 N-MOS 驱动，仅在采样时导通；若必须常通，总阻值至少 MΩ 级并把它的电流计入预算。采样节点加小电容以满足 ADC 采样保持，并用串联电阻限制经保护二极管的电流。"
  rationale: "100 kΩ + 100 kΩ 分压接在 4.2 V 电池上就是 21 µA，比 ESP32-C3 深睡大四倍；Nordic 建议对高漏电的电路用 GPIO 控制的高端 P-MOS 开关切断。阻值过大又会因 ADC 源阻抗读低，所以要配合开关与滤波电容。"
  applies_to: [battery-monitor, voltage-divider, adc, p-mosfet, n-mosfet]
  parameters:
    - name: divider_standby_current
      op: minimize
      value: null
      unit: uA
      note: "关断状态应只剩开关漏电（nA 级）；具体上限取决于睡眠预算"
  verify:
    - method: spice
      tool: "ngspice .op / .tran"
      check: "开关关断时电池侧电流 ≈ 开关漏电；开关导通后采样节点稳定时间 < 采样窗口，ADC 读数误差 < 目标精度"
      automatable: partial
    - method: bench
      tool: "Joulescope + 示波器"
      check: "采样前后测电池电流，确认关断态无分压电流；扫采样延时观察读数收敛"
      automatable: manual
  sources:
    - title: "Optimizing Power on nRF52 Designs"
      url: "https://devzone.nordicsemi.com/nordic/nordic-blog/b/blog/posts/optimizing-power-on-nrf52-designs"
