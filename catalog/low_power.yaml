      url: "https://devzone.nordicsemi.com/nordic/nordic-blog/b/blog/posts/optimizing-power-on-nrf52-designs"
      publisher: "Nordic Semiconductor"
      kind: blog
      section: "LFCLK crystal (nRF52 only; saves 2-10%)"
  confidence: medium
  tags: [cat-feeder]

- id: LPW-SCH-001
  title: 核算常开轨上每条电阻支路的静态电流（V/R）
  domain: low_power
  stage: schematic
  severity: should
  rule: "对常开轨上每个电阻支路按 I = V/R 计算睡眠期电流：对端在睡眠期被拉低或接地的上拉、分压器、反馈分压器。睡眠期会被拉低的线不接上拉，或把上拉接到可关断的轨，或取更大阻值；I2C 上拉取速度允许的最大值 R_p(max) = t_r / (0.8473 × C_b)。"
  rationale: "10 kΩ 上拉在 3.3 V 下被拉低时是 330 µA，比 ESP32-C3 的 5 µA 深睡大 60 倍；片内 45 kΩ 弱上拉对着外部低电平也有约 73 µA。几 µA 级的待机负载下，稳压器反馈分压器的电流也占可观比例（TI 的 TPS63900 用上电时读取的设置电阻来避免这一项）。"
  applies_to: [pull-up, voltage-divider, i2c, feedback-divider, always-on-rail]
  parameters:
    - name: i2c_fast_mode_rise_time_max
      op: "<="
      value: 300
      unit: ns
      note: "SLVA689 表 2-1：Fast mode；标准模式 1000 ns，Fm+ 120 ns"
    - name: i2c_bus_capacitance_max
      op: "<="
      value: 400
      unit: pF
      note: "标准/快速模式；Fm+ 为 550 pF"
    - name: esp32c3_internal_pull_resistance
      op: "=="
      value: 45
      unit: kohm
      note: "数据手册表 5-4，典型值，上拉和下拉相同"
  verify:
    - method: bom_check
      tool: "Python 读 KiCad 网表 XML + BOM（阻值）"
      check: "对每个一端接常开轨的电阻，另一端若是 GND 或睡眠期被驱动/拉低的网络，累加 V_rail / R；输出贡献排名；比较总和与睡眠预算（见 LPW-NET-001）。静态分压器（轨到地）可全自动判定，GPIO 状态相关的需要睡眠状态表"
      automatable: partial
    - method: spice
      tool: "ngspice .op"
      check: "把睡眠态的 GPIO 电平写成电压源，读轨电流"
      automatable: partial
  sources:
    - title: "SLVA689 I2C Bus Pullup Resistor Calculation"
      url: "https://www.ti.com/lit/an/slva689/slva689.pdf"
      publisher: "Texas Instruments"
      kind: app_note
