- id: LPW-SCH-009
  title: 外设用自带掉电模式或断电，并保证睡眠中保持该状态（HX711）
  domain: low_power
  stage: schematic
  severity: should
  rule: "睡眠前把每个外设置于最低功耗态或断其电源。HX711 正常工作约 1.4 mA（模拟，含片内稳压器）+0.1 mA（数字），PD_SCK 保持高电平超过 60 µs 即进入掉电（合计小于 1 µA），拉低后复位并回到通道 A、增益 128；掉电时片内稳压器关闭，称重桥激励也随之关断。MCU 在深睡中 GPIO 是高阻，所以 PD_SCK 要靠外部上拉或 gpio_hold 保持在高电平，并确认所用模块板的默认电平。"
  rationale: "称重放大器是典型的常开大户：1.5 mA 相当于 ESP32-C3 深睡的 300 倍。掉电模式由 PD_SCK 控制，MCU 睡眠时如果该脚浮空或被拉低，HX711 会醒着。"
  applies_to: [hx711, adc, sensor, load-cell]
  parameters:
    - name: hx711_normal_analog_current
      op: "=="
      value: 1400
      unit: uA
      note: "含片内稳压器，典型值；数字部分 100 µA"
    - name: hx711_power_down_current
      op: "<"
      value: 1
      unit: uA
      note: "数据手册首页：power down < 1 µA（模拟 0.3 µA + 数字 0.2 µA）"
    - name: hx711_pd_sck_high_time
      op: ">"
      value: 60
      unit: us
      note: "PD_SCK 由低变高并保持高超过 60 µs 进入掉电"
  verify:
    - method: netlist_diff
      tool: "Python 读网表"
      check: "HX711 的 PD_SCK 网络必须有睡眠期的确定高电平来源：外部上拉到 3V3，或 GPIO 在 RTC 域并启用 hold；否则判失败"
      automatable: partial
    - method: bench
      tool: "Joulescope"
      check: "分别在 HX711 工作和掉电时测 3V3 轨电流，差值应约 1.4–1.5 mA；掉电中确认 DT/SCK 线上没有倒灌电流"
      automatable: manual
  sources:
