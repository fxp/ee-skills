- id: LPW-VER-002
  title: 平均电流用整个占空周期的累计电荷来测
  domain: low_power
  stage: verification
  severity: should
  rule: "测量窗口覆盖完整占空周期（睡眠、唤醒、联网、最长事件），用仪表的电荷/能量累计功能得出平均电流，并按状态分段积分；最坏模式（连接重建、报警、频繁短周期）也要测，电池寿命取最坏模式的平均电流。"
  rationale: "瞬时读数无法代表占空比极低的系统。Energizer 与 Nordic 指出，应用寿命周期内可能进入的最短脉冲周期才是寿命估算要用的模式，即使它只占很小比例，也会在电池容量接近耗尽时让系统复位。"
  applies_to: [measurement, duty-cycle, battery-life]
  verify:
    - method: bench
      tool: "Joulescope / PPK2 / Otii，软件导出 CSV"
      check: "脚本按 GPIO 标记（睡眠/TX/传感）分段积分，输出每段电荷、总平均电流、最大电流、与 LPW-ARC-001 预算表逐项对比"
      automatable: partial
    - method: review
      tool: "评审清单"
      check: "确认测试覆盖最坏模式（例如周期最短的连接事件、失联重连），并记录测试持续时间 ≥ 若干个完整周期"
      automatable: manual
  sources:
    - title: "High pulse drain impact on CR2032 coin cell battery capacity"
      url: "https://devzone.nordicsemi.com/cfs-file/__key/communityserver-discussions-components-files/4/0842.High-pulse-drain-impact-on-CR2032-coin-cell-battery-capacity.pdf"
      publisher: "Nordic Semiconductor / Energizer"
      kind: app_note
      section: "Battery capacity vs. pulse duty cycle; Summary items 3 and 5"
    - title: "Power Profiler Kit II User Guide v1.0.1"
      url: "https://mm.digikey.com/Volume0/opasdata/d220001/medias/docus/7735/PPK2_User_Guide.pdf"
      publisher: "Nordic Semiconductor"
      kind: tool_doc
      section: "§1 (accumulative measurements: average, maximum, charge)"
    - title: "EFM32 Energy Optimization (mirror of Silicon Labs AN0027 §4)"
      url: "http://efm32.blogspot.com/2016/10/efm32-energy-optimization.html"
      publisher: "Silicon Labs EFM32 Playground (blog)"
      kind: blog
      section: "energyAware Profiler time-span average"
  confidence: high
  tags: [cat-feeder]

- id: LPW-VER-003
  title: 在真实板、真实固件、真实电压下验收睡眠电流
  domain: low_power
  stage: verification
  severity: must
  rule: "芯片数据手册的 Deep-sleep 值只适用于芯片本身（3.3 V、25 °C、RTC 定时器加 RTC 内存）。验收值必须在目标板、目标固件、目标供电电压（使板载稳压器有足够裕量）下测量，并断开调试器和串口桥后重新上电；设定睡眠电流门限并保存测试日志。"
  rationale: "Qoitech 实测 XIAO ESP32-C3 开发板 deep-sleep 为 41.6 µA（芯片 5 µA、Seeed 标称 44 µA），一次对驱动 LED 的 GPIO 调用 gpio_deep_sleep_hold_en 就让读数变成 461 µA；他们为让板载 LDO 工作把电源设在 3.8 V，而不是数据手册的 3.3 V。Nordic 与 Silicon Labs 都提醒调试接口连接或日志串口会增加电流。"
  applies_to: [measurement, esp32-c3, firmware, board-level]
  parameters:
    - name: esp32c3_deep_sleep_chip_typ
      op: "=="
      value: 5
      unit: uA
      note: "数据手册表 5-9"
    - name: example_board_level_deep_sleep
      op: "=="
      value: 41.6
      unit: uA
      note: "Qoitech 实测 XIAO ESP32-C3，板载 LDO、电池管理、USB 桥、Flash 等"
  verify:
    - method: bench
      tool: "Joulescope/PPK2 + 脚本断言"
      check: "刷入量产固件，断开调试器，上电后进入深睡，稳定若干秒后取至少 15 s 平均值，≤ 睡眠预算；输出 CSV 与固件版本、供电电压、温度一同归档"
      automatable: partial
  sources:
    - title: "ESP32-S3 Deep Sleep Power: vs C3 vs C6, Measured"
      url: "https://www.qoitech.com/blog/esp32-s3-c3-c6-sleep-power-consumption/"
