- id: LPW-SCH-003
  title: 未用引脚不得悬空，按芯片规定处理
  domain: low_power
  stage: schematic
  severity: should
  rule: "未用的 MCU 引脚不能让使能的输入缓冲悬空：ESP32-C3 复位后 GPIO2、GPIO8 是使能输入但无内部上下拉的高阻，未接电路时要外加上下拉或在软件里使能内部上下拉；STM32 设为模拟输入（或接地/电源，或输出低）；EFM32 设为 Disabled；nRF52 保持复位默认的断开输入缓冲。上电默认状态不同的引脚（调试脚）要按数据手册单独处理。"
  rationale: "悬空的输入缓冲会因噪声反复翻转，额外耗电；模拟/禁用模式关掉施密特触发器和输出驱动，消耗为零。ESP32-C3 每脚输入漏电最大 50 nA，22 个引脚全部悬空/漏电最坏也有 µA 量级。"
  applies_to: [mcu, esp32-c3, stm32, efm32, nrf52]
  parameters:
    - name: esp32c3_gpio_input_leakage_max
      op: "<="
      value: 50
      unit: nA
      note: "数据手册表 5-4，I_IH/I_IL 每引脚最大值"
  conflicts: "TI SCBA004 提到交流供电系统可用上拉解决悬空，但不推荐用于电池设备（电阻消耗电流），建议用 bus-hold；乐鑫检查表和 ST/Silicon Labs 的做法则是加上下拉或软件关输入。取舍：只要引脚不需要读，首选让输入缓冲关闭（模拟/Disabled/断开）；必须读且外部可能高阻时，用最大可行阻值的上下拉或 bus-hold，并确认对端不会长期对抗它。"
  verify:
    - method: erc
      tool: "KiCad ERC（引脚未连接、输入未被驱动）"
      check: "对 MCU 引脚启用「未连接引脚」检查，未用脚必须放置 no-connect 标记并在固件配置表里有对应的处理方式"
      automatable: partial
    - method: netlist_diff
      tool: "Python：对照固件 GPIO 初始化表与网表"
      check: "网表中没有任何连接的 GPIO，在固件初始化表里必须是 analog/disabled/pull 之一；ESP32-C3 的 GPIO2、GPIO8 必须有外部或软件上下拉"
      automatable: partial
  sources:
