      url: "https://docs.espressif.com/projects/esp-idf/en/stable/esp32c3/api-reference/system/sleep_modes.html"
      publisher: "Espressif"
      kind: vendor_guide
      section: "Pull-ups, pulldowns, and hold behavior"
    - title: "GPIO - ESP32-C3 - ESP-IDF Programming Guide"
      url: "https://docs.espressif.com/projects/esp-idf/en/stable/esp32c3/api-reference/peripherals/gpio.html"
      publisher: "Espressif"
      kind: vendor_guide
      section: "Pad hold and sleep functions"
    - title: "Schematic Checklist - ESP32-C3 - ESP Hardware Design Guidelines"
      url: "https://docs.espressif.com/projects/esp-hardware-design-guidelines/en/latest/esp32c3/schematic-checklist.html"
      publisher: "Espressif"
      kind: vendor_guide
      section: "GPIO (power-up glitches)"
