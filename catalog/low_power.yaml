- id: LPW-SCH-010
  title: INA199 没有关断脚，睡眠预算要含其 Iq 与 1 MΩ 泄漏路径
  domain: low_power
  stage: schematic
  severity: should
  rule: "INA199 无 shutdown 引脚，IQ 典型 65 µA、最大 100 µA（−40~125 °C 最大 115 µA）；睡眠时要么由 GPIO/开关为其供电，要么把这段电流写进预算。其关断状态下，分流电阻两端各有略大于 1 MΩ 的路径通向 OUT 与 REF，泄漏约为共模电压/1 MΩ，具体取决于 REF 和输出下游处于地、有源还是高阻；上电时共模电压 ≥ 3 V 还会在每个输入端多出近恒定的约 25 µA。"
  rationale: "65–100 µA 的常开电流是深睡 5 µA 的 13–20 倍，也是 AMS1117 之外下一个大项。数据手册第 7.4.2 节专门说明了用逻辑门或晶体管开关给它供电，并要考虑关断时从分流回路漏出去的电流。"
  applies_to: [ina199, current-sense, high-side-sense]
  parameters:
    - name: ina199_quiescent_current_typ
      op: "=="
      value: 65
      unit: uA
      note: "VSENSE = 0 mV，TA 25 °C；最大 100 µA，全温度范围最大 115 µA"
    - name: ina199_shutdown_input_path_resistance
      op: "=="
      value: 1
      unit: Mohm
      note: "略大于 1 MΩ（1 MΩ 反馈电阻 + 5 kΩ 输入电阻）；共模 5 V 时约 5 µA 为自行折算"
    - name: ina199_input_bias_when_powered_cm_above_3V
      op: "=="
      value: 25
      unit: uA
      note: "每个输入端，近恒定且匹配；共模低于 2 V 时只剩 1 MΩ 电阻的影响"
  verify:
    - method: bom_check
      tool: "Python 读网表"
      check: "对每个 INA199，检查电源脚是否经开关/GPIO 供电；若常通，把 Iq_max 加入睡眠预算；对关断状态，累加 V_CM / 1 MΩ（两个输入）并检查 REF、OUT 下游是否有源"
      automatable: partial
    - method: spice
      tool: "ngspice：INA199 关断状态用 1 MΩ 网络建模"
      check: "在电机/负载电压下计算分流回路泄漏"
      automatable: partial
    - method: bench
      tool: "Joulescope"
      check: "INA199 供电开/关两种睡眠态测整板电流"
      automatable: manual
  sources:
    - title: "INA199 Bidirectional, Low- and High-Side Current Sense Amplifier (SBOS469H)"
      url: "https://www.ti.com/lit/ds/symlink/ina199.pdf"
      publisher: "Texas Instruments"
      kind: datasheet
      section: "§6 Electrical characteristics (IQ); §7.4.2 Shutting Down the INA199 Series"
  confidence: high
  tags: [cat-feeder]

- id: LPW-SCH-011
  title: 电池反接保护用低压降 FET，不用串联二极管
  domain: low_power
  stage: schematic
  severity: should
  rule: "电池路径上的反接保护优先用低 Rds(on) 的 N-MOS（地回路）或 P-MOS（电源路径），体二极管方向与正常电流同向；不要在低压电池路径上串二极管。要核算最低电池电压下的 Vgs、Rds(on)×I_peak 压降与电池寿命末期余量。"
  rationale: "串联二极管的压降缩小可用电压范围：TI 例，两节碱性电池 1.8 V 经 0.6 V 二极管只剩 1.2 V，后级升压效率也变差；肖特基的约 0.3 V 对 3 V 电池也是约 10% 的损失。小封装 FET 在 1.8–2.7 V 栅压下 Rds(on) 可到 50–85 mΩ。"
  applies_to: [battery, reverse-polarity, p-mosfet, n-mosfet]
  parameters:
    - name: series_diode_drop_example
      op: "=="
      value: 0.6
      unit: V
      note: "SLVA139 例：1.8 V 电池包减去 0.6 V 余 1.2 V"
    - name: fet_rds_on_example_max
      op: "<="
      value: 85
      unit: mohm
      note: "SLVA139 表 1 的 SOT-23 示例，PMOS 85 mΩ @2.7 V，NMOS 51–80 mΩ @1.8–2.7 V；器件较老，选型时看现行器件"
  verify:
    - method: bom_check
      tool: "Python"
      check: "V_drop = I_peak × Rds(on)_max(Vgs_min, Tmax)，要求 V_battery_min − V_drop ≥ FEP；Vgs_min 取电池放电终点电压"
      automatable: full
    - method: spice
      tool: "ngspice"
      check: "反接电池（−3 V）下整板电流 < 1 µA 且无导通路径；正接时 FET 完全导通"
      automatable: partial
  sources:
    - title: "SLVA139 Reverse Current/Battery Protection Circuits"
      url: "https://www.ti.com/lit/an/slva139/slva139.pdf"
      publisher: "Texas Instruments"
      kind: app_note
      section: "Using a Diode; Using a FET; Table 1"
    - title: "nPM2100 + nRF54L15 capacitor bank design (Nordic DevZone)"
      url: "https://devzone.nordicsemi.com/f/nordic-q-a/129254/npm2100-nrf54l15-capacitor-bank-design-for-cr2032-cr2450-and-ble-operation/571568"
      publisher: "Nordic Semiconductor DevZone"
      kind: forum
      section: "Schottky ~300 mV drop wastes ~10% of a 3 V battery (community reply)"
  confidence: high

- id: LPW-SCH-012
  title: 一次性锂电池的反向充电电流不得超过 1 µA
  domain: low_power
  stage: schematic
  severity: must
  rule: "不要给一次性锂电池（Li/MnO2 纽扣电池）反向充电：Energizer CR2032 规定最大反向充电电流为 1 µA。与电池并联的任何电源路径（备份电容或超级电容、外部电源 OR-ing、经 ESD 二极管灌入的 I/O 电流）都要有二极管/理想二极管/开关阻断，并按最坏情况核算电池端的反向电流。"
  rationale: "对一次电池充电可能导致漏液、过热甚至起火；TI 也提示电池供电系统里 I/O 过压把电源抬高可能令电池爆炸或燃烧。"
  applies_to: [coin-cell, primary-lithium, battery, supercap]
  parameters:
    - name: primary_cell_max_reverse_charge
      op: "<="
      value: 1
      unit: uA
      note: "Energizer CR2032 数据手册 Max Rev Charge"
  verify:
    - method: spice
      tool: "ngspice：外部电源接入且高于电池，电池支路接 0 V 电流探针"
      check: "全温度范围内电池支路的反向电流 ≥ −1 µA（含二极管反向漏电与体二极管）"
      automatable: partial
    - method: bench
      tool: "µA 级电流表串联电池"
      check: "外部电源接入、电池装入，测电池端电流方向和大小"
      automatable: manual
  sources:
    - title: "Energizer CR2032 product datasheet"
      url: "https://data.energizer.com/pdfs/cr2032.pdf"
      publisher: "Energizer"
      kind: datasheet
      section: "Specifications: Max Rev Charge"
    - title: "SLAA689 ESD Diode Current Specification"
      url: "https://www.ti.com/lit/pdf/slaa689"
      publisher: "Texas Instruments"
      kind: app_note
      section: "§3 WARNING"
  confidence: high

- id: LPW-SCH-013
  title: 缓慢升降或不稳定的电源要用电压监控器复位
  domain: low_power
  stage: schematic
  severity: should
  rule: "电源缓慢上升/下降（电池放电或充电中）、频繁通断或不稳定（光伏）时，仅靠 CHIP_EN 上的 RC 延时不够，应加阈值约 3.0 V 的电源监控芯片驱动复位；CHIP_EN 不得悬空。电源稳定后到 CHIP_EN 拉高至少 50 µs，复位低电平至少 50 µs；RC 参考 R = 10 kΩ、C = 1 µF。监控芯片自身的 Iq 要计入睡眠预算。"
  rationale: "乐鑫指出缓慢升降、频繁通断或不稳定电源下 RC 本身可能不足；电压缓慢爬过 ESP32-C3 的 3.0 V 下限时，复位时序得不到保证（半运行状态或写入中断属于推断的后果，需要用扫描测试确认）。"
  applies_to: [esp32-c3, supervisor, reset, battery, brown-out]
  parameters:
    - name: supervisor_threshold
      op: "=="
      value: 3.0
      unit: V
      note: "乐鑫检查表：阈值约 3.0 V 的电源监控芯片"
    - name: chip_en_stable_time_min
      op: ">="
      value: 50
      unit: us
      note: "tSTBL，电源稳定后到 CHIP_EN 拉高"
    - name: chip_en_reset_time_min
      op: ">="
      value: 50
      unit: us
      note: "tRST，CHIP_EN 低于 VIL_nRST"
    - name: chip_en_rc_delay
      op: qualitative
      value: null
      note: "R = 10 kΩ，C = 1 µF，需按实际上电时序调整"
  verify:
    - method: bench
      tool: "可编程电源 + 示波器"
      check: "以 1 mV/s 到 1 V/s 的斜率扫描电源上升/下降，反复循环 100 次，复位输出无抖动，重启后无 Flash/NVS 损坏"
      automatable: partial
    - method: spice
      tool: "ngspice"
      check: "RC + 监控器模型，慢斜率 VDD 下 CHIP_EN 在 VDD ≥ 3.0 V 且稳定 ≥ 50 µs 后才拉高"
      automatable: partial
  sources:
    - title: "Schematic Checklist - ESP32-C3 - ESP Hardware Design Guidelines"
      url: "https://docs.espressif.com/projects/esp-hardware-design-guidelines/en/latest/esp32c3/schematic-checklist.html"
      publisher: "Espressif"
      kind: vendor_guide
      section: "Chip Power-up and Reset Timing"
    - title: "ESP32-C3-WROOM-02 Datasheet"
      url: "https://documentation.espressif.com/esp32-c3-wroom-02_datasheet_en.pdf"
      publisher: "Espressif"
      kind: datasheet
      section: "Peripheral Schematics: EN RC delay"
  confidence: high
  tags: [cat-feeder]

- id: LPW-SCH-014
  title: 常开轨和备份轨上的大电容要计漏电，优先低漏电类型
  domain: low_power
  stage: schematic
  severity: should
  rule: "常开轨与备份轨上的大容量电容（铝电解、钽、超级电容、大容量 MLCC）要把绝缘电阻/漏电流纳入睡眠预算，µA 以下的系统优先低漏电类型；漏电要在实际电压、温度和长时间稳定后测量，不要靠短时 IR 测试，也不要随意通断大电容组。"
  rationale: "大容量电容的漏电可轻易超过 nA 级 RTC 的工作电流。MLCC 的 IR 测试受介质吸收影响，漏电下降很慢，短时测试偏悲观；Nordic 员工提醒电池侧电容必须是低漏电类型，并且切换电容组会从电池抽出很大的脉冲电流。"
  applies_to: [capacitor, always-on-rail, backup, bulk-capacitor]
  parameters:
    - name: capacitor_leakage_budget
      op: minimize
      value: null
      unit: uA
      note: "量值取决于电容类型、电压和温度，需查所选电容的数据手册（IR 的 MΩ 或 ΩF 规格，或漏电流公式）"
  verify:
    - method: bom_check
      tool: "Python：器件参数表中增加 C_leak(V, T) 字段"
      check: "对常开轨上所有 ≥ 10 µF 电容，取数据手册最大漏电并求和，计入 LPW-NET-001 的预算"
      automatable: partial
    - method: bench
      tool: "SMU 或 Joulescope"
      check: "电容充到工作电压后稳定至少数小时，再测电压保持下的漏电；高温复测"
      automatable: manual
  sources:
    - title: "RV-1805-C3 Application Note: RTC Capacitor Backup"
      url: "https://www.microcrystal.com/fileadmin/Media/Products/RTC/Whitepapers/RV-1805-C3_App-Note_Cap_Backup.pdf"
      publisher: "Micro Crystal"
      kind: app_note
      section: "§3.2 Capacitor characteristics"
    - title: "nPM2100 + nRF54L15 capacitor bank design (Nordic DevZone)"
      url: "https://devzone.nordicsemi.com/f/nordic-q-a/129254/npm2100-nrf54l15-capacitor-bank-design-for-cr2032-cr2450-and-ble-operation/571568"
      publisher: "Nordic Semiconductor DevZone"
      kind: forum
    - title: "Overcoming Low-IQ Challenges in Low-Power Applications (SLYY203)"
      url: "https://www.ti.com/lit/pdf/slyy203"
      publisher: "Texas Instruments"
      kind: app_note
      section: "Contributors to IQ"
  confidence: medium
  tags: [cat-feeder]

- id: LPW-NET-001
  title: 用 BOM 加网表脚本核算常开轨漏电与 Iq 总和
  domain: low_power
  stage: netlist
  severity: should
  rule: "在网表上标注电源域（常开 / 可切断），用脚本遍历常开轨：器件 Iq/漏电（数据手册最大值，最高工作温度）、电阻支路 V/R、LED 支路、电容漏电、可能的反灌路径，求和后与睡眠预算比较，并输出前 10 名贡献者。每次改板都跑一次。"
  rationale: "芯片级 5 µA 与板级数十至数百 µA 的差距几乎全来自外围：稳压器 Iq、LED、上拉、分压器、外设。靠人工翻原理图容易漏项，脚本化后每次改板都能自动复核。TI 的输入端折算公式正是这种求和的数学形式。"
  applies_to: [netlist, bom, always-on-rail, budget]
  parameters:
    - name: sleep_budget_margin
      op: qualitative
      value: null
      note: "预算余量由项目决定；建议至少预留一项未建模泄漏的空间（经验，不是出处数值）"
  verify:
    - method: bom_check
      tool: "Python：kicad-cli sch export netlist（XML）+ BOM CSV + 器件参数表（LPW-LIB-001 字段）"
      check: "1) 按网络类把每个器件分入常开/可切断域；2) 对每个器件取 Iq_max(Tmax)、漏电，对电阻取 V_rail/R（对端睡眠态为低/地时），对 LED 取 (V−Vf)/R；3) 求和 ≤ 预算；4) 输出 CSV 贡献表。例（示例板 rev B 的 BOM，fxp/cat-feeder）：ESP32-C3-WROOM-02 深睡 5 µA + AMS1117-3.3 Iq ≤ 10 mA + INA199 ≤ 100 µA + LED 支路 + 10 kΩ 上拉×5"
      automatable: partial
    - method: bench
      tool: "Joulescope / PPK2"
      check: "实测睡眠电流与脚本合计值之差必须能被某项未建模泄漏解释，否则补充模型"
      automatable: manual
  sources:
    - title: "Overcoming Low-IQ Challenges in Low-Power Applications (SLYY203)"
      url: "https://www.ti.com/lit/pdf/slyy203"
      publisher: "Texas Instruments"
      kind: app_note
      section: "Equation 1 and 'Contributors to IQ'"
    - title: "IQ: What it is, what it isn't, and how to use it (SLYT412)"
      url: "https://www.ti.com/lit/an/slyt412/slyt412.pdf"
      publisher: "Texas Instruments"
      kind: app_note
    - title: "ESP32-S3 Deep Sleep Power: vs C3 vs C6, Measured"
      url: "https://www.qoitech.com/blog/esp32-s3-c3-c6-sleep-power-consumption/"
      publisher: "Qoitech"
      kind: blog
      section: "XIAO ESP32-C3 41.6 uA vs 5 uA datasheet"
  confidence: medium
  tags: [cat-feeder]

- id: LPW-LIB-001
  title: 在符号或 BOM 里记录低功耗参数及其测试条件
  domain: low_power
  stage: library
  severity: should
  rule: "为每个器件的符号/BOM 增加字段：Iq_typ、Iq_max、Isd（关断电流）、漏电、V_min_operating，以及对应条件（VIN、温度、是否无负载/不开关/使能）；Iq、地脚电流、无负载输入电流、关断电流是不同参数，不要混用。"
  rationale: "脚本核算（LPW-NET-001）依赖这些字段。TI 指出 Iq 的标准定义是无负载、不开关、已使能；开关式稳压器还有「开关 IQ」，LDO 则用地脚电流；Isd 与 Iq 都随 VIN 和温度变化，只记一个数字会让预算失真。"
  applies_to: [library, bom, symbol]
  verify:
    - method: bom_check
      tool: "Python 检查 BOM/符号字段"
      check: "所有常开轨上的有源器件和电容都必须有 Iq_max、Isd、V_min 字段和条件字符串；缺失即失败"
      automatable: full
  sources:
    - title: "3 Quiescent-current (Iq) Specifications to Understand (SSZT118)"
      url: "https://www.ti.com/lit/pdf/sszt118"
      publisher: "Texas Instruments"
      kind: app_note
    - title: "IQ: What it is, what it isn't, and how to use it (SLYT412)"
      url: "https://www.ti.com/lit/an/slyt412/slyt412.pdf"
      publisher: "Texas Instruments"
      kind: app_note
      section: "What IQ is"
    - title: "SLVA757 Quiescent Current vs Shutdown Current for Load Switch Power Consumption"
      url: "https://www.ti.com/lit/pdf/slva757"
      publisher: "Texas Instruments"
      kind: app_note
      section: "§3, §5"
  confidence: medium

- id: LPW-PLC-001
  title: 突发负载的大电容放在电池或电源入口侧，按总电荷定容
  domain: low_power
  stage: placement
  severity: should
  rule: "为抑制无线 TX 对电池的峰值电流，在电池或电源入口侧并联低漏电低 ESR 的大电容，让电池只看到平均电流；就近放置，每个电容的地焊盘旁打地过孔。容量按总消耗的电荷而不是峰值定：C = ΔQ / (V_max − V_min)，ΔQ = Q_dis − (V_min / R_i) × t_tot，并校验复充时间 t = R_i × C × ln((V_p − V_min)/(V_p − V_max)) 小于睡眠时间。"
  rationale: "SWRA349 例：R_i 取 1 kΩ、V_max 2.6 V、V_min 2.0 V，BLE 突发（8 mA×4 ms + 30 mA×1 ms）算出约 87 µF，复充约 169 ms；实际 BLE 可小 2–5 倍。并联电容让有效容量提升超过 40%（差的电池）。Nordic 员工的建议同样是把大电容放在 VBAT 侧以减小内阻损耗。ESP32-C3 参考设计在电源入口放 ESD 二极管和至少 10 µF。"
  applies_to: [coin-cell, battery, bulk-capacitor, ble, wifi]
  parameters:
    - name: coin_cell_bulk_cap_example
      op: "=="
      value: 87
      unit: uF
      note: "SWRA349 附录 A 算例，高内阻 1 kΩ 假设；SWRA349 实测时用 100 µF"
    - name: power_entrance_capacitor_min
      op: ">="
      value: 10
      unit: uF
      note: "乐鑫 ESP32-C3 检查表：电源入口至少 10 µF，另加 ESD 二极管"
    - name: capacitor_recharge_time_limit
      op: "<"
      value: 1
      unit: sleep_interval
      note: "复充时间必须小于睡眠间隔"
  verify:
    - method: spice
      tool: "ngspice/LTspice：电池 R_i（取寿命末期值）+ 电容 + 突发负载"
      check: "负载端最低电压 ≥ V_min；睡眠间隔内电容电压恢复到 V_max 以上"
      automatable: partial
    - method: geometry_script
      tool: "pcbnew Python（参见 ee-pcb-verify 的 geometry 检查器）"
      check: "量大电容正极焊盘到电池连接器/电源入口焊盘的走线长度，并算走线电阻，R_trace × I_peak 计入突发压降预算"
      automatable: partial
    - method: bench
      tool: "示波器测电池端和模块端电压"
      check: "TX 突发期间电池端电流脉冲峰值显著低于负载峰值，模块端电压满足 LPW-ARC-012"
      automatable: manual
  sources:
    - title: "SWRA349 Coin cells and peak current draw"
      url: "https://www.ti.com/lit/wp/swra349/swra349.pdf"
      publisher: "Texas Instruments"
      kind: app_note
      section: "§4, Appendix A"
    - title: "nPM2100 + nRF54L15 capacitor bank design (Nordic DevZone)"
      url: "https://devzone.nordicsemi.com/f/nordic-q-a/129254/npm2100-nrf54l15-capacitor-bank-design-for-cr2032-cr2450-and-ble-operation/571568"
      publisher: "Nordic Semiconductor DevZone"
      kind: forum
    - title: "PCB Layout Design - ESP32-C3 - ESP Hardware Design Guidelines"
      url: "https://docs.espressif.com/projects/esp-hardware-design-guidelines/en/latest/esp32c3/pcb-layout-design.html"
      publisher: "Espressif"
      kind: vendor_guide
      section: "Power Supply"
  confidence: high
  tags: [cat-feeder]

- id: LPW-RTE-001
  title: nA 级高阻节点要短走线并用双面保护环
  domain: low_power
  stage: routing
  severity: consider
  rule: "对 nA 级及以下的高阻节点（MΩ 级分压器、保持电容节点、传感前端、备份电容）：走线尽量短，周围用连到同电位低阻点的保护环/保护线包围，保护环两面都做，并远离高压差网络和易污染的区域。"
  rationale: "TI 的 AN-241 指出保护环能吸收来自板上其他点的漏电，使表面漏电几乎消除；单面保护效果有限，双面保护对体漏电只能降约一个数量级，取决于板厚和保护环宽度。绝缘材料、表面污染、清洗和涂层对结果的影响不亚于器件本身。"
  applies_to: [high-impedance-node, guard-ring, sense-net]
  parameters:
    - name: bulk_leakage_reduction_double_sided_guard
      op: "=="
      value: 10
      unit: x
      note: "AN-241：双面保护环对体漏电约降一个数量级（约值，取决于板厚与环宽）"
  verify:
    - method: geometry_script
      tool: "pcbnew Python"
      check: "对标注为 HiZ 的网络，枚举其焊盘与走线周围的相邻铜：除保护网络外，邻接铜的最小间距须不小于板厂工艺下限且最好大于其余信号间距；检查保护环在顶底层是否闭合、是否与 HiZ 网络同电位"
      automatable: partial
    - method: drc
      tool: "KiCad DRC 自定义规则（.kicad_dru）"
      check: "对 HiZ 网络类设置较大间距规则，具体数值由项目按 LPW-MFG-001 的工艺条件决定（不是出处数值）"
      automatable: partial
    - method: bench
      tool: "SMU 或皮安表，做 85%RH 前后对比"
      check: "测节点对相邻网络的漏电阻，保护环有无的对比"
      automatable: manual
  sources:
    - title: "AN-241 Working with High Impedance Op Amps (LM11)"
      url: "https://www.ti.com/lit/an/snoa664/snoa664.pdf"
      publisher: "Texas Instruments / National Semiconductor"
      kind: app_note
      section: "Electrical Guarding"
    - title: "Layout for Precision Op Amps"
      url: "https://www.analog.com/en/technical-articles/layout-for-precision-op-amps.html"
      publisher: "Analog Devices"
      kind: app_note
      section: "(仅在搜索摘要中看到，页面抓取超时，未读原文)"
  confidence: medium

- id: LPW-RTE-002
  title: 突发电流路径要核算走线与过孔的 IR 压降
  domain: low_power
  stage: routing
  severity: should
  rule: "电源入口到模块供电脚的走线、过孔电阻与电池内阻、稳压器压降一同计入突发压降预算：V_droop = I_peak × (R_batt + R_trace + R_via + R_ESR)。乐鑫参考布局：3.3 V 主电源线宽不小于 25 mil，VDD3P3 不小于 20 mil，其他电源线 10 mil；主电源线换层至少 2 个过孔。"
  rationale: "按 R = ρL/(w·t) 自行计算，100 mm 长、0.25 mm 宽的 1 oz 铜线约 0.19 Ω，500 mA 突发就是约 0.1 V，对 3.0 V 的下限和 80 mV 的纹波限值是可观的占用。"
  applies_to: [power-trace, burst-load, esp32-c3]
  parameters:
    - name: main_3v3_trace_width_min
      op: ">="
      value: 25
      unit: mil
      note: "乐鑫 ESP32-C3 布局指南的芯片级参考；模块设计可作为上限参考"
    - name: vdd3p3_trace_width_min
      op: ">="
      value: 20
      unit: mil
      note: "同上"
    - name: power_trace_layer_change_vias_min
      op: ">="
      value: 2
      unit: pcs
      note: "主电源线换层"
  verify:
    - method: geometry_script
      tool: "pcbnew Python（读取网络走线段/过孔，按铜厚与宽度算电阻）"
      check: "对 5 V 入口→稳压器→3V3→模块脚路径求 Σ R，I_peak = 500 mA 时压降 ≤ 预算（预算 = 3.0 V 下限余量 − 纹波限值，由 LPW-ARC-012 给出）"
      automatable: full
    - method: bench
      tool: "示波器 + 4 线测量"
      check: "TX 突发期间测路径两端电压差，与计算值对比"
      automatable: manual
  sources:
    - title: "PCB Layout Design - ESP32-C3 - ESP Hardware Design Guidelines"
      url: "https://docs.espressif.com/projects/esp-hardware-design-guidelines/en/latest/esp32c3/pcb-layout-design.html"
      publisher: "Espressif"
      kind: vendor_guide
      section: "Power Supply: trace width, layer change"
    - title: "ESP32-C3 Series Datasheet v2.4"
      url: "https://documentation.espressif.com/esp32-c3_datasheet_en.pdf"
      publisher: "Espressif"
      kind: datasheet
      section: "Table 5-2 (cumulative input current 0.5 A)"
  confidence: medium
  tags: [cat-feeder]

- id: LPW-MFG-001
  title: 对 nA 级高阻节点规定清洗与涂覆工艺并验证
  domain: low_power
  stage: manufacturing
  severity: consider
  rule: "板上若有 nA 级以下的高阻节点（见 LPW-RTE-001），装配说明要明确清洗（去除助焊剂残留）和涂覆/灌封要求，并用清洗前后、高湿前后的漏电对比来验证；潮湿环境用涂层作防潮屏障。"
  rationale: "TI 的 AN-241 指出，绝缘材料、表面污染、清洗工艺、表面涂层和灌封对高阻电路的影响不亚于元件本身，阻抗越高越重要。ADI 也建议清洁绝缘表面去除助焊剂残留，湿度大的环境加表面涂层。"
  applies_to: [cleaning, conformal-coating, flux-residue, high-impedance-node]
  verify:
    - method: review
      tool: "装配图纸/工艺文件评审"
      check: "确认工艺文件有清洗与涂覆条款；与 SMT 厂商（如 JLC）确认其默认助焊剂类型和是否清洗，其默认工艺本次未查证"
      automatable: manual
    - method: bench
      tool: "SMU/皮安表 + 恒温恒湿箱"
      check: "测高阻节点对邻网络的漏电阻，清洗前后、25 °C/50%RH 与 40 °C/85%RH 各一次，比较是否满足睡眠预算"
      automatable: manual
  sources:
    - title: "AN-241 Working with High Impedance Op Amps (LM11)"
      url: "https://www.ti.com/lit/an/snoa664/snoa664.pdf"
      publisher: "Texas Instruments / National Semiconductor"
      kind: app_note
      section: "Reliability"
    - title: "Layout for Precision Op Amps"
      url: "https://www.analog.com/en/technical-articles/layout-for-precision-op-amps.html"
      publisher: "Analog Devices"
      kind: app_note
      section: "(仅在搜索摘要中看到，页面抓取超时，未读原文)"
  confidence: medium

- id: LPW-MFG-002
  title: 预留可单独测量睡眠电流的断点或测试点
  domain: low_power
  stage: manufacturing
  severity: should
  rule: "在电池/电源入口或 MCU 电源轨预留可串入电流表的跳线、0 Ω 焊盘或断点，以及可隔离其他电路的方法，使整板或 MCU 的睡眠电流可单独测量；调试口和串口桥要能断电。"
  rationale: "Nordic 指出，与其他电路共用电源会让测量失去意义，应提供单独测 SoC 电流的方法；调试接口连接时外设会保持开启、增加电流。没有这类断点，板级睡眠验证（LPW-VER-003）只能靠拆件。"
  applies_to: [test-point, current-measurement, jumper]
  verify:
    - method: review
      tool: "原理图/PCB 评审"
      check: "检查电源入口和 MCU 3V3 轨是否有串联断点；电源 LED、串口桥是否可断开；断点后寄生路径（USB 串口、调试器）不会反灌"
      automatable: manual
    - method: bom_check
      tool: "Python 读 BOM/网表"
      check: "检查 3V3 主轨与 5 V 入口上是否存在标注为 CURRENT_BREAK 的跳线/测试点位号；缺失则报告"
      automatable: full
  sources:
    - title: "Optimizing Power on nRF52 Designs"
      url: "https://devzone.nordicsemi.com/nordic/nordic-blog/b/blog/posts/optimizing-power-on-nrf52-designs"
      publisher: "Nordic Semiconductor"
      kind: blog
      section: "Measurement"
    - title: "EFM32 Energy Optimization (mirror of Silicon Labs AN0027 §4)"
      url: "http://efm32.blogspot.com/2016/10/efm32-energy-optimization.html"
      publisher: "Silicon Labs EFM32 Playground (blog)"
      kind: blog
      section: "Measurement Tips: debugger effects"
  confidence: medium
  tags: [cat-feeder]

- id: LPW-VER-001
  title: 选对测睡眠电流的仪表：burden 电压、量程与分辨率
  domain: low_power
  stage: verification
  severity: should
  rule: "测睡眠电流要同时看三点：1) 串联仪表的压降（burden voltage）小到不影响被测电路（Joulescope 把分流电阻上的压降控制在约 20 mV，1 A 时总压降 25 mV；普通万用表压降大得多）；2) 分辨率和精度够用：PPK2 在 200 nA–50 µA 分辨率 0.2 µA、平均值精度 ±10%，极低静态电流下读数不准，nA 级用 Joulescope（最低 0.5 nA 分辨率）、Otii（0.4 nA 分辨率）或 SMU；3) 量程切换为先接通后断开，切换时间满足 t ≳ C·ΔV/ΔI。"
  rationale: "量程切换的压降和瞬态会让被测电路复位或读数偏高；低量程的分流电阻大（Joulescope 18 µA 量程为 1111 Ω），电流突增时压降随之增大。PPK2 的用户指南把测量范围写成 500 nA 到 1 A，同时说明能准确测到约 200 nA，指南内部也有不一致，nA 级结论需要用更高分辨率仪表复核。"
  applies_to: [measurement, sleep-current, power-profiler]
  parameters:
    - name: shunt_burden_voltage_target
      op: "<="
      value: 20
      unit: mV
      note: "Joulescope JS220 的设计目标（分流电阻上的最大压降），可作为自选仪表的参考，不是标准值"
    - name: ppk2_resolution_200nA_to_50uA
      op: "=="
      value: 0.2
      unit: uA
      note: "PPK2 用户指南表 8；精度 ±10% 读平均值，偏置 ±2%"
    - name: joulescope_js220_resolution
      op: "=="
      value: 0.5
      unit: nA
      note: "Joulescope JS220 用户指南；18 µA 量程分流电阻 1111 Ω"
  verify:
    - method: bench
      tool: "Joulescope JS220 / Nordic PPK2 / Qoitech Otii / SMU"
      check: "测前用已知电流源（如 1 µA、10 µA 的恒流源或精密电阻 + 电压源）校核仪表读数；记录量程切换点上是否出现复位或读数突变；仪表误差大于睡眠电流的 10% 时换更高分辨率仪表"
      automatable: manual
  sources:
    - title: "Joulescope JS220 User's Guide"
      url: "https://download.joulescope.com/products/JS220/JS220-K000/users_guide/Joulescope%20JS220%20User's%20Guide.pdf"
      publisher: "Jetperch"
      kind: tool_doc
      section: "§2, §7.5, §10.1 Ammeter and Autoranging"
    - title: "Power Profiler Kit II User Guide v1.0.1"
      url: "https://mm.digikey.com/Volume0/opasdata/d220001/medias/docus/7735/PPK2_User_Guide.pdf"
      publisher: "Nordic Semiconductor"
      kind: tool_doc
      section: "§1, §8.3.2, §8.3.3"
    - title: "Optimizing Power on nRF52 Designs"
      url: "https://devzone.nordicsemi.com/nordic/nordic-blog/b/blog/posts/optimizing-power-on-nrf52-designs"
      publisher: "Nordic Semiconductor"
      kind: blog
      section: "Measurement (PPK readings inaccurate at very low static current)"
    - title: "ESP32-S3 Deep Sleep Power: vs C3 vs C6, Measured"
      url: "https://www.qoitech.com/blog/esp32-s3-c3-c6-sleep-power-consumption/"
      publisher: "Qoitech"
      kind: blog
      section: "Measurement setup (Otii Ace Pro, 0.4 nA resolution)"
  confidence: high
