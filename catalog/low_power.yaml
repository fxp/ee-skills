- id: LPW-ARC-008
  title: 按唤醒源与保持内容选 MCU 睡眠模式（ESP32-C3）
  domain: low_power
  stage: architecture
  severity: should
  rule: "为每种场景在睡眠状态表里指定模式与唤醒源。ESP32-C3：Deep-sleep 约 5 µA，只保留 RTC 定时器和 RTC 内存，唤醒后 CPU 上下文丢失、重新走 bootloader；Light-sleep 约 130 µA，保留 CPU 与外设状态；Modem-sleep 13–28 mA。Deep-sleep 的 GPIO 唤醒只能用 GPIO0–GPIO5（VDD3P3_RTC 域），按键和传感器中断必须接在这些脚上；GPIO 唤醒信号至少保持 3 个 RTC 慢时钟周期。"
  rationale: "睡眠模式的电流差三个数量级，保持内容与唤醒延迟需要权衡。Light-sleep 下任意 GPIO 都可唤醒，但 Deep-sleep 下只有 RTC 域的 IO 可用，硬件连线选错就无法唤醒。"
  applies_to: [esp32-c3, mcu, wake-source, rtc]
  parameters:
    - name: esp32c3_deep_sleep_current_typ
      op: "=="
      value: 5
      unit: uA
      note: "数据手册表 5-9，RTC 定时器 + RTC 内存，3.3 V、25 °C"
    - name: esp32c3_light_sleep_current_typ
      op: "=="
      value: 130
      unit: uA
      note: "同表，VDD_SPI 与 Wi-Fi 掉电，所有 GPIO 高阻"
    - name: esp32c3_modem_sleep_current
      op: range
      value: [13, 28]
      unit: mA
      note: "表 5-8，80/160 MHz、CPU 空闲/运行、外设时钟关/开"
    - name: deep_sleep_wake_gpio_set
      op: qualitative
      value: null
      note: "GPIO0–GPIO5；其余 GPIO 只能在 Light-sleep 唤醒"
    - name: gpio_wake_min_pulse
      op: ">="
      value: 3
      unit: "RTC slow-clock cycles"
      note: "约 7.4 µs（RC_SLOW ~136 kHz）或约 30.5 µs（XTAL32K）"
  verify:
    - method: netlist_diff
      tool: "Python 读 KiCad 网表 XML 与睡眠状态表（YAML）"
      check: "每个标记为 deep_sleep_wake 的网络必须连到 ESP32-C3 的 GPIO0–GPIO5 引脚；否则判失败。再检查唤醒网络在睡眠期的静态电平与有效边沿方向一致"
      automatable: full
    - method: bench
      tool: "Joulescope / PPK2"
      check: "分别在 Deep-sleep、Light-sleep、Modem-sleep 下测整板电流并与表 5-8、5-9 对照，实际唤醒一次验证 GPIO 脉宽下限"
      automatable: manual
  sources:
