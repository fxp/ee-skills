- id: LPW-SCH-004
  title: 外部逻辑 IC 的输入不得悬空或长期处于半电平
  domain: low_power
  stage: schematic
  severity: should
  rule: "外部 CMOS/BiCMOS 逻辑、缓冲、移位器的每个未用输入都要接到轨或地；会进入高阻的总线要有确定电平（电池设备优先用 bus-hold，而不是上拉电阻）。输入电压在 0.8–2 V 的阈值区停留时间长，会让 ICC 增加到每个输入几 mA。"
  rationale: "输入级在阈值区 P 管 N 管同时导通，形成 VCC 到 GND 的电流通路。TI 估算：18 位收发器的 36 个 I/O 悬空在阈值区时，VCC 电流可达 150–200 mA，约 1 W，造成过热。"
  applies_to: [cmos-logic, level-shifter, bus, open-drain]
  parameters:
    - name: threshold_region
      op: range
      value: [0.8, 2.0]
      unit: V
      note: "TTL 兼容 CMOS/BiCMOS 系列的阈值区；ICC 在 VI 约 1.5 V 达到峰值，每个输入可达几 mA"
  conflicts: "TI SCBA004 说用上拉确保定义电平适用于交流供电系统，电池设备不推荐，应使用 bus-hold；乐鑫、ST 等 MCU 文档则建议用上下拉。取舍见 LPW-SCH-003：器件带 bus-hold 时优先 bus-hold，否则用尽量大的电阻值并让对端不要长期对抗。"
  verify:
    - method: erc
      tool: "KiCad ERC：输入引脚未被驱动、引脚未连接"
      check: "所有逻辑 IC 的输入引脚类型必须有驱动源或显式的拉电阻；ERC 零警告"
      automatable: full
    - method: bom_check
      tool: "Python 读网表"
      check: "对「只连接输入类引脚且无拉电阻」的网络报告；对三态总线报告有无 bus-hold 或拉电阻"
      automatable: partial
  sources:
    - title: "SCBA004 Implications of Slow or Floating CMOS Inputs"
      url: "https://www.ti.com/lit/pdf/scba004"
      publisher: "Texas Instruments"
      kind: app_note
      section: "§1, §2, §5, §6"
  confidence: high

- id: LPW-SCH-005
  title: 掉电域的信号要隔离，防止经 I/O 二极管反向供电
  domain: low_power
  stage: schematic
  severity: must
  rule: "任何会被关断或可能先于其他域掉电的器件（负载开关后的模块、外部电压域的传感器、电平转换器）不得有来自常开域的信号去驱动它的 I/O：在断电前把信号驱动到低或高阻，用串联电阻限流，或选用带 Ioff/部分掉电保护的器件。"
  rationale: "I/O 内部 ESD 二极管会把高于电源 0.3 V 以上的信号电压反灌到本已断电的电源轨，造成不可预期的行为，严重时损坏器件，还让负载开关的节能失效。TI 在电池供电场合明确警告：I/O 过压抬升电源电压可能导致电池爆炸或起火。"
  applies_to: [power-gating, load-switch, level-shifter, mixed-voltage]
  parameters:
    - name: backpower_pin_voltage_threshold
      op: ">"
      value: 0.3
      unit: V
      note: "SLAA689：电源为 0 V 时引脚电压高于 0.3 V 即可能经 ESD 二极管反向供电（MSP430 文档，原理对所有 CMOS 器件通用）"
    - name: esd_diode_continuous_current_max
      op: "<="
      value: 2
      unit: mA
      note: "SLAA689 以 MSP430FR5969 为例，每引脚连续电流 ±2 mA；其他器件查各自绝对最大额定值"
  verify:
    - method: bom_check
      tool: "Python 读网表 + 电源域标注（常开/可切）"
      check: "对每个可切域内的器件，列出连接到常开域驱动器的信号网络，检查是否有串联电阻、Ioff 属性（器件参数表字段）或睡眠前拉低的固件约束；无则报告"
      automatable: partial
    - method: spice
      tool: "ngspice：可切轨设为 0 V，驱动源设为 VDD"
      check: "测从信号流入被断电域的电流及被断电轨的反向电压，要求被断电轨 < 0.3 V 且电流小于该域关断预算"
      automatable: partial
    - method: bench
      tool: "示波器/万用表"
      check: "关断该域后测其轨电压，应接近 0 V，不应出现半电平"
      automatable: manual
  sources:
    - title: "SLAA689 ESD Diode Current Specification"
      url: "https://www.ti.com/lit/pdf/slaa689"
      publisher: "Texas Instruments"
      kind: app_note
      section: "§1, §3 (WARNING)"
    - title: "SLVA652A Load Switches: Basics and Applications"
      url: "https://www.ti.com/lit/an/slva652a/slva652a.pdf"
      publisher: "Texas Instruments"
      kind: app_note
      section: "§2.3"
  confidence: high
  tags: [cat-feeder]

- id: LPW-SCH-006
  title: 使能与栅极控制线在复位和深睡期间要有确定电平
  domain: low_power
  stage: schematic
  severity: must
  rule: "MCU GPIO 控制的负载开关 EN、LDO EN、MOSFET 栅极（包括电机驱动管）、外设供电开关，都要有外部上拉/下拉到关断电平。ESP32-C3 复位和 Deep-sleep 期间数字 GPIO（6–21）为高阻，RTC GPIO（0–5）除非启用 hold 也是高阻；上电时部分引脚还有毛刺。需要在深睡中保持电平时，用 gpio_hold_en() + gpio_deep_sleep_hold_en()，并注意被保持为高电平的 LED 或负载会持续耗电。"
  rationale: "高阻的栅极或使能端会随漏电和干扰浮动，可能让电机管半导通或让外设意外上电，既耗电又有安全风险。乐鑫列出的上电毛刺：GPIO18 约 50 µs 高电平，MTCK、MTDO、GPIO10、U0RXD 约 5 ns 低电平。"
  applies_to: [esp32-c3, mosfet-gate, load-switch, enable-pin, motor-driver]
  parameters:
    - name: gpio18_powerup_high_glitch
      op: "=="
      value: 50000
      unit: ns
      note: "原理图检查表 GPIO 一节；约值"
    - name: other_pins_powerup_low_glitch
      op: "=="
      value: 5
      unit: ns
      note: "MTCK、MTDO、GPIO10、U0RXD"
    - name: gate_pull_resistor_value
      op: qualitative
      value: null
      note: "阻值（常见 10–100 kΩ）取决于栅极漏电与对关断电平的要求，数值为设计经验，不是出处数值；越大越省电，需不被漏电抬起"
  verify:
    - method: bom_check
      tool: "Python 读网表"
      check: "找出所有 MOSFET 栅极、负载开关 EN 和 LDO EN 网络，检查是否有一个电阻连接到关断电平（N-MOS 到 GND、P-MOS 到源极），并在睡眠状态表里记录该网络的默认电平；缺失即失败"
      automatable: full
    - method: bench
      tool: "示波器 + Joulescope"
      check: "上电复位、深睡进入与唤醒期间监视栅极和 EN 线，确认无意外脉冲；深睡中测其电平"
      automatable: manual
  sources:
