- id: LPW-VER-004
  title: 睡眠电流要在高低温下复测，并按最坏温度做预算
  domain: low_power
  stage: verification
  severity: should
  rule: "Iq、关断电流和漏电随温度和电压上升，常常是非线性的，睡眠预算用数据手册最大值（最高工作温度和存放温度），并在温箱里于最低、常温、最高温度各测一次睡眠电流。"
  rationale: "TI 的 SLVA757 显示负载开关的 Iq 与 ISD 随温度和 VIN 增大（图 2–4，-40 到 105 °C）；SSZT118 提到货架或仓库的高温环境会加速电池自放电。TPS22916 的 ISD 典型 10 nA、−40~85 °C 最大 100 nA，相差十倍。"
  applies_to: [measurement, temperature, leakage, battery-life]
  parameters:
    - name: example_isd_typ_vs_max_ratio
      op: "=="
      value: 10
      unit: x
      note: "TPS22916 ISD：典型 10 nA，−40~85 °C 最大 100 nA"
  verify:
    - method: bench
      tool: "恒温箱 + Joulescope"
      check: "−10 / 25 / 60 °C（或产品额定温度）各稳定 30 min 后测睡眠电流，对比预算；记录是否出现非线性拐点"
      automatable: partial
    - method: spice
      tool: "ngspice 温度扫描 .step temp（使用带温度特性的器件模型）"
      check: "漏电类器件模型的 ISD 随温度变化趋势与数据手册曲线一致，总和满足预算"
      automatable: partial
  sources:
    - title: "SLVA757 Quiescent Current vs Shutdown Current for Load Switch Power Consumption"
      url: "https://www.ti.com/lit/pdf/slva757"
      publisher: "Texas Instruments"
      kind: app_note
      section: "§3, §5, §9 Key Takeaways"
    - title: "3 Quiescent-current (Iq) Specifications to Understand (SSZT118)"
      url: "https://www.ti.com/lit/pdf/sszt118"
      publisher: "Texas Instruments"
      kind: app_note
      section: "Shutdown Current"
    - title: "TPS22916 Ultra-Low Leakage Load Switch"
      url: "https://www.ti.com/lit/ds/symlink/tps22916.pdf"
      publisher: "Texas Instruments"
      kind: datasheet
  confidence: high

- id: LPW-VER-005
  title: 无线突发时在负载端实测电压跌落与纹波
  domain: low_power
  stage: verification
  severity: must
  rule: "在最差电池状态（低温、老化高内阻、低电量）下，用示波器在模块供电脚测 TX 突发期间的最低电压和纹波：最低电压不低于 3.0 V（ESP32-C3 下限），TX 时纹波峰值低于 80 mV（MCS7）或 120 mV（11 Mbps）；复位/BOR 事件为 0。仿真时用电池内阻加电容加突发负载阶跃。"
  rationale: "电压跌落造成复位或掉电；电源纹波会直接恶化 TX 性能。Energizer 与 Nordic 也指出：大的电源瞬态正好出现在接收包期间时会破坏接收，表现为射频距离差而不稳定。"
  applies_to: [wifi, ble, burst-load, esp32-c3]
  parameters:
    - name: min_rail_voltage_during_tx
      op: ">="
      value: 3.0
      unit: V
      note: "ESP32-C3 推荐电压下限"
    - name: tx_ripple_peak_mcs7
      op: "<"
      value: 80
      unit: mV
      note: "802.11n MCS7 发射"
    - name: tx_ripple_peak_11mbps
      op: "<"
      value: 120
      unit: mV
      note: "11 Mbps 发射"
  verify:
    - method: bench
      tool: "示波器（带宽 ≥ 100 MHz，带 20 MHz 带宽限制与接地弹簧）+ 可调 V_bat/源阻抗的电池模拟器"
      check: "触发在 TX 起点，记录 3V3 引脚最小电压与纹波峰值；遍历最差电源条件和各 TX 速率；记录复位次数"
      automatable: partial
    - method: spice
      tool: "ngspice"
      check: "按 LPW-ARC-012 的模型，TX 阶跃下负载端最小电压满足上表"
      automatable: partial
  sources:
    - title: "Schematic Checklist - ESP32-C3 - ESP Hardware Design Guidelines"
      url: "https://docs.espressif.com/projects/esp-hardware-design-guidelines/en/latest/esp32c3/schematic-checklist.html"
      publisher: "Espressif"
      kind: vendor_guide
      section: "Power Supply"
    - title: "ESP32-C3 Series Datasheet v2.4"
      url: "https://documentation.espressif.com/esp32-c3_datasheet_en.pdf"
      publisher: "Espressif"
      kind: datasheet
      section: "Tables 5-2, 5-7"
    - title: "High pulse drain impact on CR2032 coin cell battery capacity"
      url: "https://devzone.nordicsemi.com/cfs-file/__key/communityserver-discussions-components-files/4/0842.High-pulse-drain-impact-on-CR2032-coin-cell-battery-capacity.pdf"
      publisher: "Nordic Semiconductor / Energizer"
      kind: app_note
      section: "Battery capacity vs. peak currents"
  confidence: high
  tags: [cat-feeder]

- id: LPW-VER-006
  title: 电池寿命模型要与实测对账，厂商工具只作初估
  domain: low_power
  stage: verification
  severity: consider
  rule: "可用 TI Battery Lifetime Calculator、Nordic Online Power Profiler 等做初估，但模型必须覆盖转换器效率、电池内阻与容量降额、温度，并用实测对账；偏差超过仪表精度时回查模型假设。换到其他 SoC 时不要沿用别的芯片的工具结果。"
  rationale: "Nordic 员工说明，Online Power Profiler 针对 nRF52832，用于 nRF52840 时可能有偏差，建议用 PPK 实测；TI 的 Battery Lifetime Calculator 能导入电池放电曲线、转换器参数和负载曲线，但仍是模型。"
  applies_to: [battery-life, modeling, spreadsheet, spice]
  verify:
    - method: bom_check
      tool: "Python/电子表格模型（效率曲线、电池曲线、负载曲线）"
      check: "模型与实测累计电荷偏差 ≤ 仪表精度的两倍，超出则输出差异项（哪个状态、哪个器件）"
      automatable: partial
    - method: review
      tool: "评审清单"
      check: "确认模型使用的容量是降额后容量，使用的是最坏温度与最坏模式"
      automatable: manual
  sources:
    - title: "SLVAER8A Extending Battery Life With Low Quiescent Current and Dynamic Voltage Scaling"
      url: "https://www.ti.com/lit/an/slvaer8a/slvaer8a.pdf"
      publisher: "Texas Instruments"
      kind: app_note
      section: "§2 (Battery Lifetime Calculator)"
    - title: "Estimation of battery life while only advertising (Nordic DevZone)"
      url: "https://devzone.nordicsemi.com/f/nordic-q-a/35072/estimation-of-battery-life-while-only-advertising"
      publisher: "Nordic Semiconductor DevZone"
      kind: forum
  confidence: medium
