- id: LPW-SCH-002
  title: 睡眠期 GPIO 电平与外部上下拉必须一致
  domain: low_power
  stage: schematic
  severity: should
  rule: "为每个 GPIO 建立睡眠状态表（输出高/低/高阻、内部上下拉、外部网络），保证 MCU 和外部电路在睡眠中不互相对抗：不要把引脚拉低去顶上拉，或拉高去顶下拉。ESP32-C3 默认启用睡眠内部电阻（ESP_SLEEP_GPIO_ENABLE_INTERNAL_RESISTORS），使用外部电阻时要关闭，低电平唤醒时要加外部上拉。"
  rationale: "ESP-IDF 文档指出部分 IO 默认带内部上下拉，Deep-sleep 中若外部电路驱动它们，电流会增加。ST 的 AN4899 也提醒复用带上下拉的调试脚时不要对着拉。Deep-sleep 中数字 GPIO 是高阻，RTC GPIO 除非 hold 也是高阻，所以对外部电路的默认电平要靠硬件决定。"
  applies_to: [esp32-c3, stm32, gpio, always-on-rail]
  parameters:
    - name: esp32c3_deep_sleep_digital_gpio_state
      op: qualitative
      value: null
      note: "GPIO6–GPIO21 高阻；GPIO0–GPIO5（RTC IO）除非 hold 否则高阻（ESP-IDF 睡眠文档）"
  verify:
