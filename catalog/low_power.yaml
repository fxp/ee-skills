      url: "https://documentation.espressif.com/esp32-c3_datasheet_en.pdf"
      publisher: "Espressif"
      kind: datasheet
      section: "Table 4-1, Tables 5-8 and 5-9, Table 2-1 (VDD3P3_RTC pins)"
    - title: "Sleep Modes - ESP32-C3 - ESP-IDF Programming Guide"
      url: "https://docs.espressif.com/projects/esp-idf/en/stable/esp32c3/api-reference/system/sleep_modes.html"
      publisher: "Espressif"
      kind: vendor_guide
      section: "Wakeup sources; GPIO wakeup timing"
    - title: "GPIO - ESP32-C3 - ESP-IDF Programming Guide"
      url: "https://docs.espressif.com/projects/esp-idf/en/stable/esp32c3/api-reference/peripherals/gpio.html"
      publisher: "Espressif"
      kind: vendor_guide
      section: "Pad hold and sleep functions"
  confidence: high
