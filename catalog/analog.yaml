      op: "<="
      value: 1
      unit: nF
      note: "INA199 无持续振荡的最大容性负载"
    - name: esp32_adc_pad_bypass
      op: "=="
      value: 100
      unit: nF
      note: "Espressif 文档建议的 ADC 输入端旁路电容（陶瓷）"
  verify:
    - method: spice
      tool: "ngspice/TINA-TI：INA199 官方宏模型 + Rs + 100 nF"
      check: "输出小信号阶跃响应无振铃、过冲 < 预算；Rs 取标称和 ±5%"
      automatable: partial
    - method: bench
      tool: "示波器：阶跃负载电流 + 探头接 OUT 与 ADC 引脚"
