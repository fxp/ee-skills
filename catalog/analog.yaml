    - method: netlist_diff
      tool: "Python 读网表（KiCad netlist/pcb）"
      check: "对网络 CS_P/CS_N 列出所有焊盘：必须只有 {shunt sense pad, amp IN+/IN-, 滤波 R/C 的焊盘}，不含功率网络的焊盘；原理图与 PCB 的网表一致"
      automatable: full
    - method: drc
      tool: "KiCad DRC + 自定义规则 (.kicad_dru)"
      check: "为 CS_P/CS_N 设网络类，限制走线宽度不小于工艺下限、间距大于与功率网络的最小间距"
      automatable: partial
  sources:
