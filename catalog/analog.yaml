- id: ANA-MFG-001
  title: "出厂/首次上电做零点与增益两点校准"
  domain: analog
  stage: manufacturing
  severity: should
  rule: "测量链的零点和增益误差在生产或首次上电时用已知输入校准：先在零输入（电机停、空秤）读偏移，再用已知量（标准砝码、已知电流）求增益，把系数保存在非易失存储里；校准点之外的线性度假设要在验证里确认。"
  rationale: "失调和增益误差是确定性的，校准比提高器件等级便宜；INA199 最大增益误差达 ±1.5%，HX711 称重传感器还有零点漂移和灵敏度偏差。"
  parameters:
    - name: ina199_gain_error_max
      op: "<="
      value: 1.5
      unit: "%"
      note: "INA199 版本 A/B，VSENSE = ±5 mV，-40 到 125 degC；版本 C 为 1%"
  verify:
    - method: bench
      tool: "标准砝码 / 可编程直流电流源 / 固件"
      check: "校准后在校准点之间的 ≥ 3 个点（如 25%、50%、75% 量程）上测量，误差落在预算内；记录零点和增益系数随温度的漂移"
      automatable: partial
    - method: review
      tool: "固件评审"
      check: "校准流程是否分零点、增益两步；系数是否写入 NVS 并有校验；是否有恢复默认的路径"
      automatable: manual
