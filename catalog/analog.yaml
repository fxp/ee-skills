      publisher: "Espressif"
      kind: tool_doc
    - title: "ESP32-C3 Series Datasheet"
      url: "https://documentation.espressif.com/esp32-c3_datasheet_en.pdf"
      publisher: "Espressif"
      kind: datasheet
      section: "Table 5-5 ADC Characteristics (100 nF condition)"
