- id: ANA-SCH-011
  title: "未使用的运放通道接成跟随器"
  domain: analog
  stage: schematic
  severity: should
  rule: "多通道运放里不用的通道接成电压跟随器（输出接反相输入），同相输入接到共模范围内的固定电平（单电源可用等值电阻分压到中点）；如果该运放不是单位增益稳定的，就用两个电阻设成稳定的增益。"
  rationale: "悬空输入会让通道处于不确定的噪声状态；输入饱和后恢复慢，还可能耦合到同封装的其他通道；不满足单位增益稳定的运放接成跟随器会振荡。"
  verify:
