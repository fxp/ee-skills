- id: ANA-RTE-004
  title: "高阻抗节点用保护环，且不要覆盖阻焊"
  domain: analog
  stage: routing
  severity: consider
  rule: "对源阻抗很高、偏置电流很小的节点（如皮安级光电二极管、电化学传感器、高阻分压），用接在同电位低阻抗点上的保护环围住该节点和与它相连的所有顶层铜，保护环上不盖阻焊，两面板的两层都要做；通孔、飞线连接的高阻节点同样要围。不需要时（源阻抗低）不要多此一举。保护环要配合工艺：焊接后用异丙醇清洗残留并吹干，必要时涂覆阻湿涂层。"
  rationale: "表面污染（湿气、助焊剂残留、灰尘）让相邻不同电位的铜之间形成漏电通路：AN1258 给出的典型寄生电阻在低湿度洁净时约 1000 Gohm，高湿度污染时约 1 Gohm。保护环与敏感节点同电位，漏电电流流进保护环而不是进入敏感节点，可降低约 1000 倍。"
  parameters:
    - name: surface_leakage_resistance_clean
      op: "=="
      value: 1000
      unit: Gohm
      note: "AN1258 典型寄生电阻，低湿度、洁净"
    - name: surface_leakage_resistance_humid
      op: "=="
      value: 1
      unit: Gohm
      note: "AN1258 典型寄生电阻，高湿度、污染"
    - name: leakage_reduction_with_guard
      op: "=="
      value: 1000
      unit: ratio
      note: "AN1258 在单位增益缓冲器、同相放大器示例里给出的典型降低倍数"
  verify:
    - method: geometry_script
