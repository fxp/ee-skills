      tool: "原理图与 PCB 评审"
      check: "检查转换器的 AGND 和 DGND 焊盘是否通过过孔直接连到同一块地铜，没有串联磁珠或细走线（除非数据手册对高数字电流转换器另有要求）"
      automatable: partial
    - method: geometry_script
      tool: "pcbnew (KiCad bundled Python)"
      check: "AGND 焊盘与 DGND 焊盘之间的铜路径长度 <= 设定值；数字电源去耦电容的回路面积 <= 设定值"
      automatable: partial
