- id: ANA-VER-005
  title: "实测 HX711 的 PD_SCK 时序，别触发掉电"
  domain: analog
  stage: verification
  severity: must
  rule: "用逻辑分析仪在真实固件运行（含 Wi-Fi/BLE 活动）下抓 PD_SCK：读数期间每个高电平 ≤ 50 us、低电平 ≥ 0.2 us，脉冲数只能是 25、26 或 27，每个转换周期内不得有其他数目；PD_SCK 任何一次高电平持续超过 60 us 都会让 HX711 掉电并复位，复位后默认回到通道 A、增益 128。"
  rationale: "数据手册规定 PD_SCK 高电平保持超过 60 us 即进入掉电，ESP32 在 Wi-Fi 中断或任务调度下，如果读数期间被打断，会在读数中途让 SCK 停在高电平，导致数据错误或每次读数后都复位。"
  parameters:
    - name: pd_sck_high_time_max
      op: "<="
      value: 50
      unit: us
      note: "T3，数据手册时序表的最大值"
    - name: pd_sck_power_down_threshold
      op: ">"
      value: 60
      unit: us
      note: "PD_SCK 高电平超过 60 us 进入掉电；回到低电平后复位并回到通道 A 增益 128"
    - name: pd_sck_pulses_per_conversion
      op: range
      value: [25, 27]
      unit: pulses
      note: "25 = 通道 A 增益 128，26 = 通道 B 增益 32，27 = 通道 A 增益 64"
  verify:
    - method: bench
      tool: "逻辑分析仪（≥ 8 MS/s）+ 固件跑 Wi-Fi 流量"
      check: "抓 ≥ 1000 次读数，统计 PD_SCK 高电平最大宽度（要求 <= 50 us）和脉冲数；同时检查增益是否稳定（读数的建立时间没有周期性重启）"
      automatable: partial
    - method: review
      tool: "固件评审"
      check: "读数的 24 个移位周期是否在关中断或临界区内完成，或用硬件外设（SPI/RMT）产生时序"
      automatable: manual
  sources:
