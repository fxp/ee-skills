- id: ANA-PLC-002
  title: "电流检测放大器的旁路电容贴脚且不打孔"
  domain: analog
  stage: placement
  severity: should
  rule: "0.1 uF 旁路电容（INA199 §10.1 推荐值）放在放大器 V+ 与 GND 引脚旁边，同一层，二者之间不放过孔；噪声大或高阻抗电源可以再加去耦。"
  rationale: "INA199 的电源旁路电容是稳定性要求；带过孔的连接增加电感，削弱去耦。"
  parameters:
    - name: bypass_capacitance
      op: "=="
      value: 0.1
      unit: uF
      note: "INA199 §10.1 文字明确写“TI recommends ... 0.1 uF”，Figure 7-1、8-1、8-3 的 CBYPASS 也是 0.1 uF。0.01–0.1 uF 这个范围在手册里出现两处：§7.4.5 的输入瞬态保护滤波电容文字，以及 Figure 7-4 与 Figure 7-7 里 V+ 引脚旁路电容的标注（所以它不只是输入滤波电容，也被标作电源旁路的可用范围）。本条取 §10.1 的明文推荐值 0.1 uF（二次审计更正：上一版更正称该范围“不是电源旁路电容”，与 Figure 7-4/7-7 不符）"
    - name: decap_to_pin_distance
      op: minimize
      value: null
      note: "原文是 as close as possible，没有数值"
  verify:
    - method: geometry_script
      tool: "pcbnew (KiCad bundled Python)"
      check: "找出 V+ 引脚网络上最近的电容，量焊盘中心距，并检查电容焊盘到引脚焊盘的路径上是否有过孔；距离阈值按本板设定（建议 <= 3 mm）"
      automatable: full
  sources:
    - title: "INA199 datasheet (SBOS469H)"
      url: "https://www.ti.com/lit/ds/symlink/ina199.pdf"
      publisher: "Texas Instruments"
      kind: datasheet
      section: "§7.3.1; §10.1"
    - title: "ADS1113/4/5 datasheet (SBAS444E)"
      url: "https://www.ti.com/lit/ds/symlink/ads1115.pdf"
      publisher: "Texas Instruments"
      kind: datasheet
      section: "§11.1 (no vias between bypass capacitors and the device)"
  confidence: high
  applies_to: [ina199, current_sense]
