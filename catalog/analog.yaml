- id: ANA-VER-001
  title: "SPICE 做最坏情况 + Monte Carlo + 温度扫描对账"
  domain: analog
  stage: verification
  severity: should
  rule: "把误差预算（ANA-ARC-001）里的每一项在 SPICE 里用实际容差建模：电阻容差与 TCR、放大器失调和偏置电流（带温度）、基准误差；跑最坏情况、Monte Carlo（高斯分布，3-sigma 对应容差）和 -40/25/85 degC 三个温度，仿真得到的总误差必须不超过预算。"
  rationale: "手算预算会漏掉元件间的相互作用（如输入串联电阻 + 偏置电流）；多数参数近似高斯分布，最坏情况过于悲观，RSS/Monte Carlo 给出统计上的合理范围。"
  parameters:
    - name: monte_carlo_runs
      op: ">="
      value: 200
      unit: runs
      note: "经验值，不是出处的数值；足以估计 3-sigma 的粗略范围，高良率要求时增加"
  verify:
    - method: spice
      tool: "ngspice：用 .param + 随机函数（agauss/unif）或 .control 里的 repeat 循环；.temp / .options temp 做温度扫描"
      check: "N 次运行后，统计输出的均值和标准差，换算为满量程的百分比；同时用元件极限值跑一次最坏情况；两者都不超过预算"
      automatable: partial
    - method: bom_check
      tool: "Python 脚本：与 SPICE 同参数的解析式"
      check: "解析式的 RSS 结果与 Monte Carlo 的 1-sigma 偏差 < 20%，不一致时先查模型"
      automatable: partial
  sources:
    - title: "AN1177 Op Amp Precision Design: DC Errors"
      url: "https://ww1.microchip.com/downloads/en/appnotes/01177a.pdf"
      publisher: "Microchip"
      kind: app_note
      section: "Process and Environmental Variations: worst case vs RSS"
    - title: "Ngspice User's Manual"
      url: "https://ngspice.sourceforge.io/docs/ngspice-html-manual/manual.xhtml"
      publisher: "ngspice"
      kind: tool_doc
      section: "§18.5 Monte-Carlo Simulation; §18.2 random parameters; §13.6 Control Structures; §1.3.2 temperature"
  confidence: medium
  applies_to: [error_budget, op_amp, current_sense]
  tags: [cat-feeder]

- id: ANA-VER-002
  title: "SPICE 噪声分析：积分噪声与 LSB 对比"
  domain: analog
  stage: verification
  severity: should
  rule: "用 SPICE 的 .noise 分析求输入参考噪声和输出噪声，对感兴趣的带宽积分得到 rms 噪声，与 ADC 的 1 LSB 或要求的有效分辨率比较；仿真前用 1 kohm 电阻在 25 degC 的热噪声（约 4 nV/rtHz，16e-18 V^2/Hz）核对仿真器输出单位。"
  rationale: "不同仿真器输出的是电压密度还是其平方，单位错一级会误判；电阻模型不含 1/f 噪声，运放宏模型的噪声参数必须正确，否则结果没有意义。"
  parameters:
    - name: reference_thermal_noise_1k_25c
      op: "=="
      value: 4
      unit: "nV/rtHz"
      note: "1 kohm，25 degC；平方形式为 1.6e-17 V^2/Hz，用于核对仿真器输出单位"
  verify:
    - method: spice
      tool: "ngspice：.noise V(out) Vin dec ... 后用 noise 绘图/积分"
      check: "先用一个 1 kohm 电阻验证单位；然后对实际电路积分 fL 到 fH 的噪声（注意限带滤波器的等效噪声带宽 NPBW），结果 rms 值 <= 预算份额；用 effective resolution = log2(FSR/en_rms) 换算"
      automatable: partial
    - method: bench
      tool: "示波器或 ADC 数据采集：输入短路"
      check: "把仿真噪声与 ANA-VER-004 的实测对比，差 > 2 倍时检查模型"
      automatable: manual
  sources:
    - title: "AN1228 Op Amp Precision Design: Random Noise"
      url: "https://ww1.microchip.com/downloads/en/appnotes/01228a.pdf"
      publisher: "Microchip"
      kind: app_note
      section: "Appendix B: Computer Aids (B.1 Noise Simulations)"
