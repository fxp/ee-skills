- id: ANA-SCH-006
  title: "放大器输入保护：按手册限流（1–10 mA），注意钳位漏电"
  domain: analog
  stage: schematic
  severity: should
  rule: "运放输入端有二极管钳位到电源轨时，输入电压可能超出电源轨 0.3 V 以上就要串电阻把电流限制在数据手册给出的值以内（各器件不同：OPA333 绝对最大表为 ±1 mA、同页脚注与 §7.3.2 为 10 mA，INA199 为 5 mA，数据手册之间与自身都不一致时取较严的值）；外加的钳位二极管/TVS 在最高工作温度下的漏电要和运放偏置电流、源阻抗一起算进误差。INA199 输入可耐 26 V，高于 26 V 的共模瞬变用齐纳型吸收器加小电阻。"
  rationale: "ESD 二极管导通后的电流可能很大，不限流会损坏器件；二极管漏电随温度翻倍增长，高阻节点上外加钳位的漏电会直接变成失调。"
  parameters:
    - name: opa333_input_current_footnote
      op: "<="
      value: 10
      unit: mA
      note: "OPA333 §6.1 注 (2)：输入端超出电源轨 0.3 V 以上时限流到 10 mA 或更小；§7.3.2 同样说瞬时过压在 10 mA 限流下可承受。注意同一表里 Signal input terminals 的电流绝对最大值写的是 ±1 mA（见下一条）"
