- id: ANA-FLR-002
  title: "精密元件远离热源和板边气流"
  domain: analog
  stage: floorplan
  severity: should
  rule: "放大器输入电阻、匹配电阻对、基准、热电偶端子和冷端传感器放在远离稳压器、MOSFET、分流电阻等发热元件的位置，也远离板边和气流；热源产生的温度梯度要沿着这些元件的等温线方向，而不是穿过它们。"
  rationale: "PCB 上元件焊点、铜走线与焊料形成许多塞贝克结，温度梯度会在其两端产生热电势：AN1258 的例子中 10 degC/inch 的梯度在一个 1206 电阻上产生约 38 uV。零漂运放的失调只有几 uV，这种热电势可以与之相当。"
  parameters:
    - name: example_gradient
      op: "=="
      value: 10
      unit: "degC/inch"
      note: "AN1258 的示例：梯度 10 degC/inch，1206 电阻两端约 -38 uV；PCB 结的塞贝克系数通常低于 ±100 uV/degC"
    - name: thermoelectric_voltage_per_degc
      op: ">="
      value: 0.1
      unit: "uV/degC"
      note: "OPA333 手册：结两侧温度不同时的热电势可达 0.1 uV/degC 或更高，取决于材料"
  verify:
    - method: geometry_script
      tool: "pcbnew (KiCad bundled Python)"
      check: "给精密元件和热源元件打标签；计算两类元件焊盘中心的最小距离、精密元件到板边的距离，距离阈值由热仿真给出（出处无固定数值）"
      automatable: partial
    - method: thermal_sim
      tool: "热阻网络估算或稳态热仿真"
      check: "满载下读精密元件两端的温度差，乘以热电势系数 (<= 100 uV/degC 的上限) 对照失调预算"
      automatable: partial
    - method: bench
      tool: "热成像仪 + 万用表"
      check: "满载运行直到温度稳定，记录精密元件区域温度梯度和输出漂移"
      automatable: manual
  sources:
    - title: "AN1258 Op Amp Precision Design: PCB Layout Techniques"
      url: "https://ww1.microchip.com/downloads/en/appnotes/01258b.pdf"
      publisher: "Microchip"
      kind: app_note
      section: "Thermocouple Junction Behavior; Preventing Large Thermoelectric Voltages"
    - title: "OPA333/OPA2333 datasheet (SBOS351E)"
      url: "https://www.ti.com/lit/ds/symlink/opa333.pdf"
      publisher: "Texas Instruments"
      kind: datasheet
      section: "§7.3 Feature Description"
  confidence: high
  applies_to: [precision_analog, thermocouple, matched_resistors]
