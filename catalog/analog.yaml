- id: ANA-SCH-001
  title: "SAR ADC 输入 RC：C ≥ 20 倍采样电容，用 C0G"
  domain: analog
  stage: schematic
  severity: should
  rule: "SAR ADC 输入端的飞轮（charge-bucket）滤波电容 CFILT 取 ADC 内部采样电容 CSH 的 20 倍以上（SBOA443 式 7 与 ADS8860 手册的说法；例：CSH = 59 pF 则 CFILT >= 1180 pF，见 conflicts），介质用 C0G/NP0；串联电阻 RFILT 取使 RC 在采样时间内建立到 n 位精度的最大值，并留意它与放大器稳定性和失真的折中，电阻容差优于 1%。"
  rationale: "采样开关闭合时 CFILT 供应大部分充电电荷，放大器只补充一小部分，因此对放大器带宽的要求降低；C0G 在电压、频率、温度下容值稳定，不引入非线性失真。n 位建立需要 ln(2^n) 个时间常数。"
  parameters:
    - name: c_filt_over_c_sh
      op: ">="
      value: 20
      unit: ratio
      note: "SBOA443 式 7（CFILT = 20 x CSH）在 4 V 量程、允许 100 mV 跌落的假设下推出；量程或允许跌落不同，比值要重算。SBOA443 表 4-2（ADS8860，CSH = 59 pF）给出下限 10 x = 590 pF、标称 20 x = 1180 pF、上限 30 x = 1770 pF，所以 >= 20 是标称值而不是 SBOA443 的绝对下限"
    - name: time_constants_for_n_bit_settling
      op: qualitative
      value: null
      note: "tau = t_acq / ln(2^n)；12 位约需 8.3 tau，16 位约需 11 tau"
    - name: rflt_example_ads8860
      op: "<="
      value: 22
      unit: ohm
      note: "ADS8860（CSH = 59 pF）的示例，不是通用上限；RFLT 过大增加失真，过小影响放大器稳定"
    - name: filter_resistor_tolerance
      op: "<"
      value: 1
      unit: "%"
      note: "ADS8860 要求两路输入电阻容差 < 1% 以保持平衡"
  verify:
    - method: spice
      tool: "ngspice/TINA-TI：放大器 + RFILT + CFILT + ADC 采样开关与 CSH 的模型"
      check: "在最大采样率下做瞬态，要求采样结束时输入节点距最终值 < 0.5 LSB，且放大器输出无振荡（相位裕度见 ANA-ARC-006）"
      automatable: partial
    - method: bom_check
      tool: "脚本：读 ADC 数据手册 CSH 与 BOM 里的滤波电容"
      check: "C >= 20*CSH；介质字段为 C0G/NP0；电阻容差 <= 1%"
      automatable: full
  sources:
    - title: "Current Sense Amplifier Considerations for Driving SAR ADCs (SBOA443)"
      url: "https://www.ti.com/lit/an/sboa443/sboa443.pdf"
      publisher: "Texas Instruments"
      kind: app_note
      section: "§3.1 The Filter Capacitor, Eq. 7"
    - title: "ADS8860 16-bit 1-MSPS SAR ADC datasheet (SBAS569B)"
      url: "https://www.ti.com/lit/ds/symlink/ads8860.pdf"
      publisher: "Texas Instruments"
      kind: datasheet
      section: "§10.1.2.2 Charge-Kickback Filter; §12.1"
    - title: "TI Precision Labs - Driving SAR and Delta-Sigma ADC Inputs"
      url: "https://www.ti.com/lit/ml/sprpeo2/sprpeo2.pdf"
      publisher: "Texas Instruments"
      kind: vendor_guide
  confidence: high
  applies_to: [sar_adc, adc_driver]
  conflicts: "ADS8860 手册 §10.1.2.2 写“至少 20 倍采样电容”，同段又写 CSH = 59 pF 故 CFLT > 590 pF，而 590 pF 只是 10 倍（20 倍应为 1180 pF），手册自相矛盾。SBOA443 表 4-2 的 590 pF 也标为 CFILT,MIN = 10 x CSH。本条以 20 倍（1180 pF）为标称，590 pF 只当作绝对下限（审计更正）。"

- id: ANA-SCH-002
  title: "Σ-Δ ADC 差分输入：Cdiff ≥ 10 × Ccm，R < 1 kΩ"
  domain: analog
  stage: schematic
  severity: should
  rule: "Σ-Δ ADC 的差分输入做一阶 RC 低通时，差分电容 CDIFF 至少是两个共模电容 CCM 的 10 倍，滤波电阻 < 1 kohm，电容用 C0G，电阻用 0.1% 金属膜；若同时滤波基准，信号和基准滤波器的时间常数要匹配。"
  rationale: "CCM1/CCM2 的失配会把共模噪声转换成差模噪声，CDIFF 大一个数量级可压低这种转换；滤波电阻上有输入电流，阻值大就带来增益误差。"
  parameters:
    - name: cdiff_over_ccm
      op: ">="
      value: 10
      unit: ratio
      note: "ADS1115 数据手册 §9.2.2.6；TI Precision Labs 的建议是 CCM = CDIFF 的 1/10"
    - name: filter_resistor_max
      op: "<"
      value: 1
      unit: kohm
      note: "ADS1115 的限制；INA199 输入端另有 10 ohm 限制，见 ANA-SCH-003"
  verify:
    - method: bom_check
      tool: "脚本：识别 ADC 差分输入上的 RC 网络"
      check: "C_DIFF/C_CM >= 10；R 总和 < 1 kohm；C 介质为 C0G；两路输入电阻值相同"
      automatable: full
    - method: spice
      tool: "ngspice：AC 分析，CCM1/CCM2 取 ±5% 失配"
      check: "在 1 kHz 到 1 MHz 范围内比较共模到差模转换（CMRR 劣化量）是否在预算内"
      automatable: partial
  sources:
    - title: "ADS1113/4/5 datasheet (SBAS444E)"
      url: "https://www.ti.com/lit/ds/symlink/ads1115.pdf"
      publisher: "Texas Instruments"
      kind: datasheet
      section: "§9.2.2.6 First-Order RC Filter Considerations; §11.1"
    - title: "TI Precision Labs - Driving SAR and Delta-Sigma ADC Inputs"
      url: "https://www.ti.com/lit/ml/sprpeo2/sprpeo2.pdf"
      publisher: "Texas Instruments"
      kind: vendor_guide
      section: "Σ-Δ input recommendations"
    - title: "ADS1235 datasheet (SBAS824)"
      url: "https://www.ti.com/lit/ds/symlink/ads1235.pdf"
      publisher: "Texas Instruments"
      kind: datasheet
      section: "§8.3.4.1 External Reference (match filter time constants)"
  confidence: high
  applies_to: [delta_sigma_adc, bridge_sensor, differential_input]

- id: ANA-SCH-003
  title: "INA199 输入滤波：串联电阻 ≤ 10 Ω"
  domain: analog
  stage: schematic
  severity: should
  rule: "在 INA199 输入引脚前加差分 RC 滤波时，两个串联电阻各不超过 10 ohm，并按内部输入电阻 RINT（±30% 容差）算增益误差：gain error = 100 - 100*1250*RINT/(1250*RS + 1250*RINT + RS*RINT)。如果要更强的滤波，改到放大器输出端做。"
  rationale: "INA199 内部偏置网络使两个输入端的偏置电流在有差分电压时不相等，外部串联电阻会把这个不对称变成差分误差，表现为增益误差；RINT 随增益档为 20/10/5 kohm。"
  parameters:
    - name: series_resistor_max
      op: "<="
      value: 10
      unit: ohm
      note: "INA199 §7.4.1；INA240 数据手册给出同样的 10 ohm"
    - name: gain_error_10ohm_x2
      op: "=="
      value: 0.89
      unit: "%"
      note: "INA199x2（RINT = 10 kohm），RS = 10 ohm 的增益误差；手册里 x1 的数值也写作 0.84%"
    - name: rint_by_gain
      op: qualitative
      value: null
      note: "INA199x1 = 20 kohm，x2 = 10 kohm，x3 = 5 kohm；内部电阻容差 ±30%"
  verify:
    - method: bom_check
      tool: "脚本：从网表取输入串联电阻和电容"
      check: "两个串联电阻相等且 <= 10 ohm；用上式算增益误差并计入预算"
      automatable: full
    - method: spice
      tool: "ngspice：INA199 用 RINT + 偏置电流源 + 理想放大器建模"
      check: "扫描 RS = 0 到 20 ohm、RINT ±30%，输出对分流电压的增益偏差与公式一致"
      automatable: partial
  sources:
    - title: "INA199 datasheet (SBOS469H)"
      url: "https://www.ti.com/lit/ds/symlink/ina199.pdf"
      publisher: "Texas Instruments"
      kind: datasheet
      section: "§7.4.1 Input Filtering, Eq. 1-2, Tables 7-1/7-2"
    - title: "INA240 datasheet (SBOS662C)"
      url: "https://www.ti.com/lit/ds/symlink/ina240.pdf"
      publisher: "Texas Instruments"
      kind: datasheet
      section: "§9.1.1 Input Filtering"
    - title: "Current Sense Amplifiers: Input and Output Filtering"
      url: "https://www.onsemi.com/company/news-media/blog/industrial/en-us/current-sense-amplifiers-input-and-output-filtering"
      publisher: "onsemi"
      kind: blog
