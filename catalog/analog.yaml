- id: ANA-VER-003
  title: "稳定性签核：环路增益 + 阶跃，覆盖角点条件"
  domain: analog
  stage: verification
  severity: must
  rule: "每个驱动电容负载或带反馈的运放/放大器级，在仿真中用环路增益（Aol 与 1/beta 的闭合速率、相位裕度）和小信号阶跃响应两种方式签核：相位裕度 >= 45 deg（目标 60 deg），闭合速率 20 dB/decade，覆盖最大电容、最差温度和元件容差。使用厂商提供的宏模型并确认其输出阻抗模型。"
  rationale: "电容负载造成的稳定性问题在台面上才发现代价高；阶跃响应的振铃与环路增益的裕度互为印证，只看一个可能漏掉问题。"
