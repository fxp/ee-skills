- id: ANA-SCH-009
  title: "NTC 热敏电阻：限制激励避免自热"
  domain: analog
  stage: schematic
  severity: should
  rule: "用热敏电阻测温时，激励功率不能超过封装的耗散能力，保持电阻-温度（零功率）工作状态；恒流激励时电流通常低于 100 uA，最好 20 uA 左右；线性化网络的电阻用 1% 或更好的金属膜。"
  rationale: "热敏电阻通电自热后电阻下降，读数比实际温度偏高，且误差随气流和安装方式变化。"
  parameters:
    - name: ntc_excitation_current
      op: "<"
      value: 100
      unit: uA
      note: "AN685 的建议：通常低于 100 uA，最好 20 uA（10 kohm NTC 示例）；以热敏电阻耗散常数为准重新验算"
  verify:
