- id: ANA-SCH-012
  title: "模拟电源与数字电源之间加滤波"
  domain: analog
  stage: schematic
  severity: consider
  rule: "混合信号板上，模拟电源和数字电源用 RC 或低 Q 铁氧体磁珠隔开，数字电源入口先接数字区，再经滤波或稳压给模拟区供电；转换器的数字供电脚在本地放去耦电容，让数字瞬态电流在本地小回路里流动。"
  rationale: "数字瞬态电流如果经模拟电源或模拟地返回，会叠加到敏感信号上；本地去耦把返回电流限制在小环路里。"
