- id: ANA-SCH-013
  title: "外部基准：先带限滤波，再用大电容去耦"
  domain: analog
  stage: schematic
  severity: should
  rule: "给 SAR ADC 外部基准时，基准输出先经截止频率几百 Hz 的低通滤波以去掉宽带噪声，再用基准缓冲器驱动 REF 脚；REF 脚按数据手册配大电容（ADS8860 为 10 uF 以上，X7R，不额外并联小电容）。Σ-Δ ADC 的基准输入跨接电容，且基准滤波的时间常数要与信号输入滤波匹配。"
  rationale: "多数基准的宽带输出噪声有几百 uV rms，不限带宽会直接劣化 ADC 噪声；转换期间 REF 脚有动态电流，需要足够的电容保持电压在 1 LSB 以内。"
  parameters:
    - name: reference_filter_cutoff
      op: qualitative
      value: null
      note: "ADS8860 手册原文是 a few hundred hertz 量级的低通，没有给出精确数值"
    - name: ads8860_cref
      op: range
      value: [10, 22]
      unit: uF
      note: "ADS8860 推荐 10 uF 或更大，Recommended Operating Conditions 给出 10 到 22 uF；X7R、0805、额定电压 >= 10 V"
  verify:
    - method: bom_check
      tool: "脚本：读 ADC 数据手册对 REF 去耦电容的要求"
      check: "REF 脚电容值、介质、额定电压满足手册；没有多个不同容值并联在 REF 上"
      automatable: partial
    - method: spice
      tool: "ngspice/TINA-TI"
      check: "基准滤波器 + 缓冲器 + CREF + ADC 动态电流源：转换开始时 REF 电压跌落 < 1 LSB，缓冲器稳定"
      automatable: partial
  sources:
