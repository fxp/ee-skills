      publisher: "Texas Instruments"
      kind: datasheet
      section: "§10.1.1 ADC Reference Driver; §12.1 Layout Guidelines"
    - title: "ADS1235 datasheet (SBAS824)"
      url: "https://www.ti.com/lit/ds/symlink/ads1235.pdf"
      publisher: "Texas Instruments"
      kind: datasheet
      section: "§8.3.4.1 External Reference"
  confidence: high
  applies_to: [sar_adc, delta_sigma_adc, voltage_reference]

- id: ANA-NET-001
  title: "分流电阻的 sense 抽头用独立网络"
  domain: analog
  stage: netlist
  severity: must
  rule: "分流电阻到电流检测放大器输入的两条 sense 线必须是独立网络（如 CS_P、CS_N），只连接分流电阻的 sense 焊盘、放大器输入引脚和必要的滤波元件；不得与大电流的源极/地/电机网络在其他位置相连。"
  rationale: "sense 线一旦在别处与载流网络短接，大电流就会流过它的走线电阻，产生本该由开尔文连接避免的误差；独立网络也是后续 DRC 约束它的前提。"
