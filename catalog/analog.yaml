- id: ANA-ARC-001
  title: "选型前先做误差预算（失调/漂移/增益/容差）"
  domain: analog
  stage: architecture
  severity: should
  rule: "在选放大器、分流电阻、增益电阻之前，先把失调、失调温漂、增益误差、电阻容差/温漂、基准误差、噪声列成预算表，按最坏情况和 RSS 两种方式求和，并让每一项不超过总误差目标分到的份额。"
  rationale: "失调类误差与被测电流大小无关，会在小信号端主导误差；增益类误差与信号成比例。不先量化各项，就无法判断该换更好的器件还是放宽要求。"
  parameters:
    - name: per_term_error_target
      op: "<="
      value: 0.1
      unit: "%"
      note: "SLYT762 的示例：满量程 ±50 mV 的分流检测，每一项误差贡献不超过 ±0.1%。数值随系统要求缩放，不是通用阈值"
    - name: amp_offset_for_example
      op: "<="
      value: 100
      unit: "uV"
      note: "同一示例要求放大器失调 ≤ 100 uV"
    - name: amp_offset_drift_for_example
      op: "<="
      value: 1
      unit: "uV/degC"
      note: "同一示例要求失调温漂 ≤ 1 uV/degC"
    - name: gain_resistor_tc_for_example
      op: "<="
      value: 10
      unit: "ppm/degC"
      note: "同一示例要求增益电阻和分流电阻容差 0.1%、温漂 ≤ 10 ppm/degC"
  verify:
    - method: bom_check
      tool: "Python/表格脚本：读取 BOM 里每个模拟器件的数据手册最大/最小值（Vos、dVos/dT、增益误差、电阻容差和 TCR、基准精度）"
      check: "按最坏情况（全部取极限）和 RSS 两种方式求和，折算到满量程的百分比以及最小工作电流点的百分比；任何单项超过分配份额或总和超过目标即不通过"
      automatable: partial
    - method: spice
      tool: "ngspice：容差 Monte Carlo + 温度扫描（.temp / .options temp）"
      check: "对关键传递函数（Vout/Iin 或 码值/Vin）做 ≥ 200 次 Monte Carlo，并在 -40/25/85 degC 各一轮，统计 3-sigma 误差并与预算表对账"
      automatable: partial
  sources:
    - title: "Selecting amplifiers for shunt-based current sensing in 3-phase motor drives (SLYT762)"
      url: "https://www.ti.com/lit/pdf/slyt762"
      publisher: "Texas Instruments"
      kind: app_note
      section: "Accuracy / error example"
    - title: "AN1177 Op Amp Precision Design: DC Errors"
      url: "https://ww1.microchip.com/downloads/en/appnotes/01177a.pdf"
      publisher: "Microchip"
      kind: app_note
      section: "Process and Environmental Variations (worst case vs RSS)"
  confidence: high
  applies_to: [current_sense, bridge_sensor, adc_frontend, op_amp]
  tags: [cat-feeder]

- id: ANA-ARC-002
  title: "按失调与量程选分流电阻阻值"
  domain: analog
  stage: architecture
  severity: should
  rule: "分流电阻的满量程压降要足够大，使放大器失调（INA199 最大 ±150 uV）在最小关心电流处仍远小于信号；同时压降乘以增益后不能超过放大器输出摆幅和 ADC 量程，且 I2R 功耗在电阻额定值内。"
  rationale: "失调是与电流无关的绝对误差，小电流时占比最大；压降大又会增加分流电阻功耗和发热。INA199 是零漂移结构，数据手册称在约 10 mV 满量程下就能达到传统 100 mV 满量程的精度。"
  parameters:
    - name: ina199_vos_max
      op: "<="
      value: 150
      unit: "uV"
      note: "INA199 输入失调最大值（典型 ±5 uV），温漂最大 0.5 uV/degC"
    - name: full_scale_sense_voltage
      op: ">="
      value: 10
      unit: "mV"
      note: "数据手册原话是 on the order of 10 mV 即可达到与 100 mV 相当的精度；上限由输出摆幅决定，例：3.3 V 供电的 INA199A1 可用 60 mV"
  verify:
    - method: bom_check
      tool: "脚本：从网表取 R_shunt、放大器型号（增益）、Imin/Imax、V+"
      check: "算 Vsense_min = Imin*R_shunt，要求 Vos_max/Vsense_min 小于预算分给失调的份额；算 Vsense_max*G <= V+ - 0.2 V；算 Imax^2*R_shunt 小于电阻额定功率的降额值（按电阻数据手册）"
      automatable: partial
    - method: spice
      tool: "ngspice：DC 扫描 Iin"
      check: "对 Vos 取 ±最大值，扫描 Imin 到 Imax，记录输出相对理想值的误差曲线，小电流端误差必须在预算内"
      automatable: partial
  sources:
    - title: "INA199 26-V, Bidirectional, Zero-Drift Current-Sense Amplifier datasheet (SBOS469H)"
      url: "https://www.ti.com/lit/ds/symlink/ina199.pdf"
      publisher: "Texas Instruments"
      kind: datasheet
      section: "§6.5 Electrical Characteristics, §7.3.2 Selecting RS"
    - title: "Selecting amplifiers for shunt-based current sensing in 3-phase motor drives (SLYT762)"
      url: "https://www.ti.com/lit/pdf/slyt762"
      publisher: "Texas Instruments"
      kind: app_note
      section: "offset is more critical at low current; shunt voltage typically ±25 to ±250 mV in motor drives"
  confidence: high
  applies_to: [current_sense, ina199, shunt]
  tags: [cat-feeder]
  conflicts: "SLYT762 说电机驱动里分流压降通常 ±25 到 ±250 mV，INA199 手册说 10 mV 量级就够。两者针对的放大器失调不同（零漂移 vs 普通），按所选放大器的失调反推，不要套用固定数值。示例板（猫咪喂食器）的 20 mohm 分流电阻在 100 mA 时只有 2 mV，最坏失调 150 uV 就是 7.5%（典型 5 uV 约 0.25%），需要在固件里做零点校准。"

- id: ANA-ARC-003
  title: "核对电流检测增益档和输出量程"
  domain: analog
  stage: architecture
  severity: must
  rule: "用数据手册的型号后缀与增益对照表算满量程输出 Vout_fs = Imax * Rshunt * G，要求 Vout_fs 同时不超过放大器输出上摆幅（V+ 减最大 0.2 V）和 ADC 能保证精度的量程；型号后缀与增益的对应关系必须以数据手册为准，不能凭记忆。"
  rationale: "INA199 的 x1/x2/x3 后缀分别是 50/100/200 V/V；如果增益被记错，满量程输出会饱和或超出 ADC 的精确区间，整个测量失效。"
  parameters:
    - name: ina199_gain_x1_x2_x3
      op: qualitative
      value: null
      unit: "V/V"
      note: "INA199x1 = 50，INA199x2 = 100，INA199x3 = 200（数据手册 Table 7-1 与 §6.5）"
    - name: output_swing_to_vplus_max_drop
      op: "<="
      value: 0.2
      unit: V
      note: "INA199，RL = 10 kohm，-40 到 125 degC 时 Swing to V+ 最大值（典型 0.05 V）"
    - name: esp32c3_adc_total_error_atten0_to_2
      op: "<="
      value: 10
      unit: mV
      note: "ESP32-C3 校准后总误差，量程 0 到 750/1050/1300 mV"
    - name: esp32c3_adc_total_error_atten3
      op: "<="
      value: 35
      unit: mV
      note: "ESP32-C3 校准后总误差，量程 0 到 2500 mV"
  verify:
    - method: bom_check
      tool: "脚本：读 BOM 的放大器完整型号、R_shunt 阻值、Imax，查数据手册增益表"
      check: "计算 Vout_fs；要求 Vout_fs <= V+ - 0.2 V 且 <= 选定 ADC 衰减档的量程；同时检查原理图注释中写的增益与数据手册表一致"
      automatable: full
    - method: spice
      tool: "ngspice：理想受控源建模放大器，DC 扫描 Iin 到 1.2*Imax"
      check: "输出在 Imax 之内必须是线性的，不能进入饱和或超出 ADC 量程"
      automatable: partial
  sources:
    - title: "INA199 datasheet (SBOS469H)"
      url: "https://www.ti.com/lit/ds/symlink/ina199.pdf"
      publisher: "Texas Instruments"
      kind: datasheet
      section: "§6.5 Electrical Characteristics; Table 7-1"
    - title: "ESP32-C3 Series Datasheet"
      url: "https://documentation.espressif.com/esp32-c3_datasheet_en.pdf"
      publisher: "Espressif"
      kind: datasheet
      section: "§5.5 ADC Characteristics, Table 5-6 ADC Calibration Results"
  confidence: high
  applies_to: [current_sense, ina199, esp32c3_adc]
  tags: [cat-feeder]
  conflicts: "示例板（猫咪喂食器）的原理图备注曾把 INA199A2 写成 50 V/V（1 V/A，0 到 2 A 对应 0 到 2.0 V）。数据手册里 x2 是 100 V/V（x1 才是 50 V/V），配 20 mohm 分流电阻是 2 V/A，2 A 时理论 4 V，超过 3.3 V 供电和 ADC 量程。型号后缀与增益的对应很容易记混，必须以数据手册为准。"

- id: ANA-ARC-004
  title: "按系统约束选择分流电阻位置"
  domain: analog
  stage: architecture
  severity: consider
  rule: "低边分流（电阻在开关管源极与地之间）共模电压接近 0 V，可用非隔离的低成本放大器，但只在低边开关导通期间能测到电流；高边或串联在电机线上可连续测量，但需要高共模电压和高 CMRR 的放大器并要面对 PWM 共模瞬变。按是否需要连续电流、共模范围和成本选择。"
  rationale: "分流位置决定共模电压、是否有 PWM 共模瞬变、什么时候能采样。选错会导致采样窗口丢失或放大器过载。"
  verify:
    - method: review
      tool: "架构评审清单"
      check: "列出：共模范围（含 -0.3 V/-0.1 V 地附近的下限）、是否需要电流连续采样、PWM 周期与最短导通时间、MCU 是否与功率地共地；确认所选放大器的共模范围覆盖实际共模电压"
      automatable: manual
    - method: spice
      tool: "ngspice"
      check: "仿真分流两端对地电压随 PWM 变化，确认共模电压始终落在放大器共模范围内（INA199 版本 A 下限 GND-0.3 V，版本 B/C 下限 GND-0.1 V）"
      automatable: partial
  sources:
    - title: "Selecting amplifiers for shunt-based current sensing in 3-phase motor drives (SLYT762)"
      url: "https://www.ti.com/lit/pdf/slyt762"
      publisher: "Texas Instruments"
      kind: app_note
      section: "Table 1; Placement No. 2 low-side shunts"
    - title: "INA199 datasheet (SBOS469H)"
      url: "https://www.ti.com/lit/ds/symlink/ina199.pdf"
      publisher: "Texas Instruments"
      kind: datasheet
      section: "§6.5 common-mode input range"
  confidence: high
  applies_to: [current_sense, motor_driver]
  tags: [cat-feeder]

- id: ANA-ARC-005
  title: "放大器带宽/建立时间要小于最短导通时间"
  domain: analog
  stage: architecture
  severity: should
  rule: "PWM 驱动下用低边分流检测时，放大器带宽和压摆率决定的建立时间必须小于低边开关的最短导通时间（对称采样时按其一半计），ADC 采样点放在导通窗口中央（SLYT762 Figure 2：低边分流的理想采样点在 PWM 中心）；如果不做逐周期采样，则用 RC 把 PWM 纹波滤到 ADC 分辨率以下后再平均（这一句是本库的工程补充，SLYT762 与 INA199 手册均未讨论，没有出处数值）。"
  rationale: "低边分流只在开关导通期间有电流，采样落在边沿附近会读到建立过程中的值。INA199 带宽仅 14 到 80 kHz、压摆率 0.4 V/us，PWM 频率高时尤其容易出错。"
  parameters:
    - name: ina199_bandwidth_x1
      op: "=="
      value: 80
      unit: kHz
      note: "INA199x1，CLOAD = 10 pF；x2 = 30 kHz，x3 = 14 kHz"
    - name: ina199_slew_rate
      op: "=="
      value: 0.4
      unit: "V/us"
      note: "INA199 典型压摆率"
    - name: settling_time_vs_min_on_time
      op: "<"
      value: 1
      unit: ratio
      note: "建立时间 / 最短导通时间 < 1；SLYT762 建议对称采样时按最短导通时间的一半来要求，所以实际目标是比值 < 0.5"
  verify:
    - method: spice
      tool: "ngspice：PULSE 电流源 + 放大器带宽/压摆限制的行为模型"
      check: "加最短占空比的电流脉冲，读 ADC 采样时刻的输出，要求与稳态值差小于 0.5 LSB（或预算份额）"
      automatable: partial
    - method: bench
      tool: "示波器：同时看分流电阻两端（差分探头）、放大器输出、ADC 采样触发信号"
      check: "在最小占空比和最大占空比下，确认采样触发落在输出已稳定的平台上"
      automatable: manual
  sources:
    - title: "Selecting amplifiers for shunt-based current sensing in 3-phase motor drives (SLYT762)"
      url: "https://www.ti.com/lit/pdf/slyt762"
      publisher: "Texas Instruments"
      kind: app_note
      section: "Placement No. 2: bandwidth and slew rate; ideal sampling at PWM center"
    - title: "INA199 datasheet (SBOS469H)"
      url: "https://www.ti.com/lit/ds/symlink/ina199.pdf"
      publisher: "Texas Instruments"
      kind: datasheet
      section: "§6.5 Frequency response"
  confidence: high
  applies_to: [current_sense, pwm, motor_driver]
  tags: [cat-feeder]

- id: ANA-ARC-006
  title: "运放相位裕度目标 ≥ 45°，容性负载用隔离电阻"
  domain: analog
  stage: architecture
  severity: should
  rule: "运放电路的环路增益相位裕度至少 45°，对过冲敏感的场合取 60°；驱动较大电容负载（如 ADC 基准或滤波电容）时，在运放输出与电容之间串隔离电阻 RISO，并按数据手册的 GBW 和开环输出阻抗 RO 计算，再用仿真确认。"
  rationale: "电容负载与运放开环输出阻抗形成额外极点，降低相位裕度；RISO 在环路里引入零点抵消该极点，把闭合速率拉回 20 dB/decade。RISO 越大相位裕度越高，但直流误差和建立时间变差。"
  parameters:
    - name: phase_margin_min
      op: ">="
      value: 45
      unit: deg
      note: "常用最低目标；要低过冲时取 60 deg"
    - name: rate_of_closure
      op: "=="
      value: 20
      unit: "dB/decade"
      note: "Aol 与 1/beta 交点处的闭合速率应为 20 dB/decade"
  verify:
    - method: spice
      tool: "ngspice/TINA：在反馈环里断环做 AC 分析（Aol*beta 的幅相图），再加小信号阶跃响应"
      check: "读单位增益交点处相位裕度 >= 45 deg（目标 60 deg），阶跃响应过冲符合要求，且在最大电容负载和最差温度下都成立"
      automatable: partial
    - method: bench
      tool: "示波器 + 信号源：小信号方波阶跃"
      check: "输出阶跃响应无持续振铃，过冲与仿真一致"
      automatable: manual
  sources:
    - title: "Determine Optimal Isolation Resistance for Driving Capacitive Load (SBOA418)"
      url: "https://www.ti.com/lit/pdf/sboa418"
      publisher: "Texas Instruments"
      kind: app_note
      section: "§1-§4, Equation 2"
    - title: "Do-it-yourself: Three Ways to Stabilize Op Amp Capacitive Loads (SSZT999)"
      url: "https://www.ti.com/lit/pdf/sszt999"
      publisher: "Texas Instruments"
      kind: app_note
  confidence: high
  applies_to: [op_amp, adc_driver, reference_buffer]

- id: ANA-ARC-007
  title: "ESP32-C3 内置 ADC 的误差与使用边界"
  domain: analog
  stage: architecture
  severity: should
  rule: "把 ESP32-C3 内置 ADC 当作约 12 位、总误差 ±10 mV（量程 ≤ 1300 mV）或 ±35 mV（量程 2500 mV）的粗测通道：只使用 ADC1（GPIO0 到 GPIO4；其中 GPIO2 同时是 strapping 引脚，见 GEN-SCH-006，接模拟前端时要保证复位期间的电平不影响启动），启用基于 eFuse 的 curve fitting 校准，把信号尽量放在低衰减档的精确区间，要求更高精度时改用外置 ADC。"
  rationale: "ADC 参考电压设计值 1100 mV，芯片间实际在 1000 到 1200 mV；ADC2 在部分芯片版本上不可用且没有出厂校准；高电压端误差明显变大，Espressif 的实测在 2890 mV 附近约 50 mV。"
  parameters:
    - name: dnl_inl
      op: "<="
      value: 12
      unit: LSB
      note: "DNL ±7 LSB，INL ±12 LSB，条件是外接 100 nF、直流输入、25 degC、Wi-Fi 关闭"
    - name: adc_reference_spread
      op: range
      value: [1000, 1200]
      unit: mV
      note: "芯片间 ADC 参考电压范围，设计值 1100 mV"
  verify:
    - method: bench
      tool: "可编程电压源/高精度万用表 + 固件"
      check: "在量程内取 ≥ 5 个点（含 0.1 V、1.0 V、2.0 V），每点平均 ≥ 64 次采样，校准后误差必须落在数据手册给出的 ±10/±35 mV 内；Wi-Fi 开启状态下再测一遍，记录退化量"
      automatable: partial
    - method: review
      tool: "固件评审"
      check: "确认使用 adc_cali_create_scheme_curve_fitting()；不在 ADC2 上做单次读；每个衰减档单独建校准句柄"
      automatable: manual
  sources:
    - title: "ESP32-C3 Series Datasheet"
      url: "https://documentation.espressif.com/esp32-c3_datasheet_en.pdf"
      publisher: "Espressif"
      kind: datasheet
      section: "§4.2.2.1 SAR ADC; §5.5 ADC Characteristics"
    - title: "ADC Calibration Driver - ESP32-C3 (ESP-IDF)"
      url: "https://docs.espressif.com/projects/esp-idf/en/v5.5.3/esp32c3/api-reference/peripherals/adc_calibration.html"
      publisher: "Espressif"
      kind: tool_doc
    - title: "Comparing ADC Performance of Espressif SoCs"
      url: "https://developer.espressif.com/blog/2025/08/adc-performance/"
      publisher: "Espressif"
      kind: blog
  confidence: high
  applies_to: [esp32c3, adc_frontend]
  tags: [cat-feeder]

- id: ANA-ARC-008
  title: "HX711 按需选数据率，并丢弃建立期数据"
  domain: analog
  stage: architecture
  severity: consider
  rule: "称重这类慢信号选 10 SPS（RATE = 0）以获得更低噪声；上电、复位、切换通道或增益之后，固件丢弃建立时间内的转换结果（10 SPS 约 400 ms，80 SPS 约 50 ms）再取数。"
  rationale: "HX711 在增益 128 时输入噪声 10 SPS 约 50 nV rms，80 SPS 约 90 nV rms；数据手册明确设定了建立时间，之前的输出不是有效数据。"
  parameters:
    - name: hx711_noise_10sps_gain128
      op: "=="
      value: 50
      unit: "nV rms"
      note: "RATE = 0，增益 128，输入噪声典型值；RATE = 1（80 SPS）为 90 nV rms"
    - name: hx711_settling_time_10sps
      op: "=="
      value: 400
      unit: ms
      note: "RATE = 0；RATE = DVDD 时 50 ms。适用于上电、复位、通道切换、增益切换"
  verify:
    - method: bench
      tool: "固件 + 串口日志"
      check: "上电或切换增益后连续读 ≥ 20 个样本，确认前 400 ms（80 SPS 时 50 ms）内的样本被固件丢弃，之后的样本标准差落到数据手册噪声量级"
      automatable: partial
    - method: review
      tool: "固件评审"
      check: "检查固件是否在 reset/增益切换后加了等待，且 RATE 引脚连接（模块上通常是焊盘或跳线）与固件假设的数据率一致"
      automatable: manual
  sources:
    - title: "HX711 24-Bit Analog-to-Digital Converter (ADC) for Weigh Scales"
      url: "https://cdn.sparkfun.com/datasheets/Sensors/ForceFlex/hx711_english.pdf"
      publisher: "Avia Semiconductor"
      kind: datasheet
