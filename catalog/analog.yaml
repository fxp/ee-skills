      publisher: "Texas Instruments"
      kind: datasheet
      section: "§10.1 Layout Guidelines"
    - title: "Shunt Resistor Layout Considerations (TI Precision Labs - Current Sense Amplifiers)"
      url: "https://www.ti.com/content/dam/videos/external-videos/en-us/4/3816841626001/6076326896001.mp4/subassets/current-sense-amplifiers-shunt-resistor-layout-presentation-quiz.pdf"
      publisher: "Texas Instruments"
      kind: vendor_guide
      section: "Rule 2 - use Kelvin connections"
  confidence: high
  applies_to: [current_sense, shunt]
  tags: [cat-feeder]

- id: ANA-STK-001
  title: "给模拟信号层配一层完整的地"
  domain: analog
  stage: stackup
  severity: consider
  rule: "要求高精度的模拟电路（16 位以上或 μV 级信号）尽量用 4 层板，把整层作为不被信号走线打断的地平面，关键元件放顶层并用短过孔接到该地；2 层板做不到时，底层尽量作为连续地，信号走线仅在必要时占用，空白处铺地。"
  rationale: "完整的地平面为信号提供最低电感的返回路径，并降低对外界干扰的敏感度；2 层板的地被信号割裂得越多，返回路径越长。"
  verify:
    - method: geometry_script
      tool: "pcbnew (KiCad bundled Python)"
      check: "统计底层（或地层）上非 GND 网络走线的总长度/面积和对模拟区地铜的割裂；输出地铜在模拟区下方的连续覆盖率"
      automatable: partial
    - method: review
      tool: "布局评审"
      check: "确认模拟元件下方的地铜没有槽、没有信号线穿过"
      automatable: manual
  sources:
    - title: "ADS8860 datasheet (SBAS569B)"
      url: "https://www.ti.com/lit/ds/symlink/ads8860.pdf"
      publisher: "Texas Instruments"
      kind: datasheet
      section: "§12.1 Layout Guidelines (at least four layers recommended)"
    - title: "ADS1235 datasheet (SBAS824)"
      url: "https://www.ti.com/lit/ds/symlink/ads1235.pdf"
      publisher: "Texas Instruments"
      kind: datasheet
      section: "§11.1 Layout Guidelines (dedicate an entire layer to ground)"
    - title: "ADS1113/4/5 datasheet (SBAS444E)"
      url: "https://www.ti.com/lit/ds/symlink/ads1115.pdf"
      publisher: "Texas Instruments"
      kind: datasheet
      section: "§11.1 (fill void areas with ground)"
  confidence: medium
  applies_to: [precision_adc, mixed_signal]
  tags: [cat-feeder]
  conflicts: "ADS8860 建议至少 4 层，ADS1235 也说专用地层，但同时承认受设备限制时不一定可行。示例板（猫咪喂食器）是 2 层、测量精度要求不高（ESP32-C3 ADC 本身误差 ±10 到 ±35 mV），取舍是在 2 层上做到连续底层地并把电机回流路径单独处理（见 ANA-PLN-003）。"

- id: ANA-FLR-001
  title: "把模拟区与数字/射频/开关区分开"
  domain: analog
  stage: floorplan
  severity: should
  rule: "板子分成模拟区和数字区：ADC、放大器、基准、模拟多路开关等放在模拟区；MCU、CPLD/FPGA、射频收发器（含 Wi-Fi 模组及其天线）、USB 收发器、开关稳压器放在数字区。转换器跨在两区的分界上，模拟信号只在模拟区走线，数字信号只在数字区走线（所有层）。"
  rationale: "数字部分的快速电流边沿和射频能量是对低电平模拟信号最主要的干扰源；只要走线纪律保持，数字回流电流会留在数字区地平面中，不会流进模拟区。"
