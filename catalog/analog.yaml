      tool: "KiCad ERC + 自定义检查脚本（读网表）"
      check: "对多单元运放的每个单元检查：输出与反相输入同网（或经反馈电阻），同相输入不悬空，直流电平在数据手册共模范围内"
      automatable: partial
    - method: review
      tool: "原理图评审"
      check: "确认该运放是否单位增益稳定，不稳定时用了增益网络"
