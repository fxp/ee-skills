- id: ANA-SCH-008
  title: "HX711 输入共模电压要落在允许范围内"
  domain: analog
  stage: schematic
  severity: should
  rule: "HX711 差分输入的共模电压必须在 AGND + 1.2 V 到 AVDD - 1.3 V 之内；换用不同的 AVDD（5 V 或 3.3 V）时重新核对电桥共模点（通常是激励的一半）是否仍在这个窗口内。"
  rationale: "共模超出范围时 PGA 输入级失去线性，输出数据错误但不一定饱和，很难从读数上发现。"
  parameters:
