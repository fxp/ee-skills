      url: "https://www.ti.com/lit/ds/symlink/ads8860.pdf"
      publisher: "Texas Instruments"
      kind: datasheet
      section: "§12.1 Layout Guidelines"
  confidence: high
  applies_to: [sar_adc, voltage_reference]

- id: ANA-PLC-004
  title: "匹配电阻同向、紧邻，沿等温线排布"
  domain: analog
  stage: placement
  severity: consider
  rule: "决定增益或比例精度的匹配电阻（反馈/增益电阻、差分放大器电阻对）选相同封装，同方向、相邻放置，并让电流方向沿着温度等值线（与热源方向垂直）；不能保证时，用两个串联或并联且对齐的电阻代替单个电阻，使热电势相互抵消。"
  rationale: "电阻两端焊点和端帽金属不同，温度梯度会在电阻两端产生热电势；同向对齐的两颗电阻产生的热电势极性相反，可以抵消。"
  verify:
    - method: geometry_script
      tool: "pcbnew (KiCad bundled Python)"
      check: "对标记为 matched 的电阻对：封装一致、旋转角相同、中心距 <= 设定上限、到热源的距离相等（差 <= 设定上限）"
      automatable: full
    - method: bench
      tool: "热成像仪 + 万用表"
      check: "按 AN1258 的做法，故意制造温度梯度（用热源元件），测输出变化，评价热电势残余"
      automatable: manual
  sources:
    - title: "AN1258 Op Amp Precision Design: PCB Layout Techniques"
      url: "https://ww1.microchip.com/downloads/en/appnotes/01258b.pdf"
      publisher: "Microchip"
      kind: app_note
      section: "Following Contour Lines; Cancellation of Thermoelectric Voltages"
  confidence: high
  applies_to: [matched_resistors, op_amp, difference_amplifier]

- id: ANA-RTE-001
  title: "分流电阻到放大器必须用开尔文（四线）走线"
  domain: analog
  stage: routing
  severity: must
  rule: "放大器输入引脚到分流电阻的两条走线必须直接接在分流电阻的 sense 焊盘上，大电流只经过电阻本体和粗的负载走线；任何一条 sense 线不得借道载流走线，否则两个输入引脚之间会多出一段载流铜阻。"
  rationale: "分流电阻阻值很小，任何额外的载流铜阻都会直接叠加到测量电压上。TI 示例：1 oz、0.25 mm 长、0.6 mm 宽的铜走线约 193 uOhm，在 8 mohm 分流、10 A 时多出 1.93 mV，相对 80 mV 约 2.4% 的误差。"
  parameters:
    - name: example_trace_resistance
      op: "=="
      value: 193
      unit: uohm
      note: "TI 示例：1 oz 铜，0.25 mm 长，0.6 mm 宽"
    - name: example_error
      op: "=="
      value: 2.4
      unit: "%"
      note: "8 mohm 分流电阻、10 A、多出 1.93 mV（80 mV 的 2.4%）"
  verify:
    - method: geometry_script
      tool: "pcbnew (KiCad bundled Python)"
      check: "读 CS_P/CS_N 网络的所有走线与过孔，确认它们在 PCB 上只连接到分流电阻的 sense 焊盘、放大器输入引脚和滤波元件的焊盘；并检查没有铜皮（灌铜）把 sense 焊盘与功率网络连起来"
      automatable: full
    - method: bench
      tool: "已知直流电流源 + 四线万用表"
      check: "用已知电流（如 1 A）测放大器输出，与 I*R_shunt*G 的差在增益误差预算内；差异超过预算要检查 sense 线是否借道载流铜"
      automatable: manual
  sources:
    - title: "Shunt Resistor Layout Considerations (TI Precision Labs - Current Sense Amplifiers)"
      url: "https://www.ti.com/content/dam/videos/external-videos/en-us/4/3816841626001/6076326896001.mp4/subassets/current-sense-amplifiers-shunt-resistor-layout-presentation-quiz.pdf"
      publisher: "Texas Instruments"
      kind: vendor_guide
      section: "Rule 2 - Kelvin connections, bad layout example"
    - title: "INA199 datasheet (SBOS469H)"
      url: "https://www.ti.com/lit/ds/symlink/ina199.pdf"
      publisher: "Texas Instruments"
      kind: datasheet
      section: "§10.1 Layout Guidelines"
    - title: "INA240 datasheet (SBOS662C)"
      url: "https://www.ti.com/lit/ds/symlink/ina240.pdf"
      publisher: "Texas Instruments"
      kind: datasheet
      section: "§9.3.2, Figure 9-7"
  confidence: high
  applies_to: [current_sense, shunt, kelvin]
  tags: [cat-feeder]

- id: ANA-RTE-002
  title: "两条 sense 线等长、等宽、同层并排"
  domain: analog
  stage: routing
  severity: should
  rule: "两条差分输入走线（sense 线）用相同的长度、宽度和层，并排走，保持短，减小两线围成的环路面积；差分输入对要在测量源方向上保持匹配。"
  rationale: "走线电阻不一致，加上输入偏置电流，会产生失调；环路面积大则电感和拾取的干扰也大；并排走使共模干扰同时耦合到两条线，由放大器的 CMRR 抑制。"
  parameters:
    - name: sense_trace_length_mismatch
      op: minimize
      value: null
      note: "出处只要求 matched / avoid unbalanced，没有数值；可按 I_bias*delta_R 小于失调预算份额反推"
  verify:
    - method: geometry_script
      tool: "pcbnew (KiCad bundled Python)"
      check: "对 CS_P 与 CS_N 网络：比较总长度（差 <= 设定值）、最小线宽（相同）、层（相同）、两线之间平均间距（<= 设定值），输出环路面积"
      automatable: full
  sources:
    - title: "Shunt Resistor Layout Considerations (TI Precision Labs - Current Sense Amplifiers)"
      url: "https://www.ti.com/content/dam/videos/external-videos/en-us/4/3816841626001/6076326896001.mp4/subassets/current-sense-amplifiers-shunt-resistor-layout-presentation-quiz.pdf"
      publisher: "Texas Instruments"
      kind: vendor_guide
      section: "Rule 1 - avoid unbalanced traces"
    - title: "ADS1113/4/5 datasheet (SBAS444E)"
      url: "https://www.ti.com/lit/ds/symlink/ads1115.pdf"
      publisher: "Texas Instruments"
      kind: datasheet
      section: "§11.1 (differential inputs must be matched; reduce loop area)"
  confidence: high
  applies_to: [differential_input, current_sense]
