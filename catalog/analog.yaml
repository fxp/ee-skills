- id: ANA-SCH-007
  title: "HX711 的数字电源跟随 MCU，模拟电源去耦"
  domain: analog
  stage: schematic
  severity: should
  rule: "HX711 的 DVDD 与 MCU 使用同一电源（本板是 3.3 V），DOUT 的摆幅才与 MCU 匹配；不用片内稳压器时 VFB 接 AGND、BASE 悬空、VSUP 接 AVDD 或 DVDD 中较高者，AVDD 按数据手册 Fig.1 配 10 uF 去耦（Fig.1 里的 0.1 uF 接在 VBG 基准旁路脚上，且手册写明不用片内稳压器时该电容不需要，不是 AVDD 去耦）；模块若按 5 V 供电，需做电平转换后再接 ESP32-C3。"
  rationale: "数据手册要求 DVDD 与 MCU 同电源；ESP32-C3 的 GPIO 按 3.3 V 供电，DOUT 若是 5 V 电平可能超出其绝对最大额定值（以 ESP32-C3 数据手册为准，本条未核对该数值）。AVDD 同时决定激励电压和满量程（±0.5*AVDD/增益），其噪声直接进入测量。"
  parameters:
