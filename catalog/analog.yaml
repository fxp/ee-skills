- id: ANA-PLN-001
  title: "整块地平面 + 分区走线，优先于分割 AGND/DGND"
  domain: analog
  stage: plane_pour
  severity: should
  rule: "混合信号板默认用一块完整的地平面，按模拟/数字分区并严格约束走线（模拟信号只在模拟区、数字信号只在数字区，所有层）；只有在法规/隔离要求或已无法保证走线纪律时才分割地，分割时只在转换器下方一点相连并让所有跨越信号走在该桥上，且不要在多个位置连接两块地。"
  rationale: "Ott 与 TI 指出：返回电流沿信号线正下方返回，数字电流不会进入分区的模拟区地；分割的地在走线跨越时有大环路和偶极子天线问题。"
  verify:
