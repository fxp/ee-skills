      op: ">="
      value: 1.2
      unit: V
      note: "共模输入下限 = AGND + 1.2 V"
    - name: hx711_cm_range_high_offset
      op: "<="
      value: 1.3
      unit: V
      note: "共模输入上限 = AVDD - 1.3 V；AVDD = 3.3 V 时窗口 1.2 到 2.0 V，AVDD = 5 V 时窗口 1.2 到 3.7 V"
  verify:
