      tool: "脚本：由分压网络和热敏电阻在最低电阻点（最高温度）算功耗"
      check: "P = I^2*R_ntc(Tmax)；P/耗散常数(mW/degC) 得到自热温升，要求小于温度误差预算份额"
      automatable: full
    - method: bench
      tool: "固定温度箱或恒温浴 + 万用表"
      check: "在激励通/断两种状态下测同一温度点的阻值，差值应在预算内"
      automatable: manual
  sources:
    - title: "AN685 Thermistors in Single Supply Temperature Sensing Circuits"
      url: "https://ww1.microchip.com/downloads/en/appnotes/00685b.pdf"
      publisher: "Microchip"
      kind: app_note
      section: "Current-Over-Time Mode; excitation discussion for Figure 4"
  confidence: high
  applies_to: [thermistor, temperature_sensing]

- id: ANA-SCH-010
  title: "热电偶前端：参考结与冷端传感器同处等温块"
  domain: analog
