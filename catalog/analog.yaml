- id: ANA-PLN-003
  title: "电机/大电流回路不穿过模拟地区"
  domain: analog
  stage: plane_pour
  severity: consider
  rule: "电机和 MOSFET 的回流电流从分流电阻的地侧直接回到电源入口，不要穿过 INA199、HX711、ADC 的模拟参考地所在的铜区；放大器的 GND、ADC/HX711 的 AGND 取自同一个无大电流流过的安静地节点，与功率地只在一点相连（靠近分流电阻地侧焊盘或电源入口）。"
  rationale: "回流电流在地铜上产生 I*R 压降（例如 2 A 流过 10 mohm 的地铜就有 20 mV），ADC 以自己的地为参考，这个压降会直接叠加到读数上，大于 ESP32-C3 ADC 的 ±10 mV 误差。这是由物理量级推出的推理，不是原文的数值。"
  verify:
    - method: geometry_script
      tool: "pcbnew (KiCad bundled Python)"
      check: "计算功率地回流路径（分流电阻地侧焊盘到电源入口）与模拟区多边形是否相交；估算两个参考点之间铜的直流电阻 R_gnd，乘以 Imax 对照 ADC 预算"
      automatable: partial
    - method: spice
      tool: "ngspice"
      check: "在功率地回流路径上插入由铜面积算出的 R_gnd，仿真电机电流下 INA199 输出和 ADC 引脚相对 MCU 地的误差"
      automatable: partial
    - method: bench
      tool: "毫伏表或示波器"
      check: "电机满载时，测分流电阻地侧焊盘与 ESP32 GND 焊盘之间的电压，应小于预算份额"
      automatable: manual
  sources:
