- id: ANA-PLC-003
  title: "ADC 基准与电源电容贴近引脚的距离上限"
  domain: analog
  stage: placement
  severity: should
  rule: "SAR ADC 的 REF 去耦电容放在距引脚 0.1 inch（2.54 mm）以内，用多个接地过孔；AVDD/DVDD 去耦电容放在 0.2 inch（5.08 mm）以内；引脚到电容之间不放过孔；输入飞轮 RC 紧挨输入引脚。"
  rationale: "转换期间 REF 脚和电源脚有动态电流，电容与引脚之间的电感越小去耦越有效：ADS8860 的目标是 REF 回路电感 < 2 nH、电源回路 < 5 nH。"
  parameters:
    - name: ref_cap_to_pin_distance
      op: "<="
      value: 2.54
      unit: mm
      note: "ADS8860 §12.1：0.1 inch，对应电感 < 2 nH，使用 20 mil 走线和多个 15 mil 接地过孔"
    - name: supply_cap_to_pin_distance
      op: "<="
      value: 5.08
      unit: mm
      note: "ADS8860 §12.1：0.2 inch，对应电感 < 5 nH，20 mil 走线和 15 mil 接地过孔"
  verify:
    - method: geometry_script
      tool: "pcbnew (KiCad bundled Python)"
      check: "对 REF、AVDD、DVDD 引脚找去耦电容，测焊盘中心距，分别 <= 2.54 mm、<= 5.08 mm；检查走线路径上无过孔"
      automatable: full
  sources:
