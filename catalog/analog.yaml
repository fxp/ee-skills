- id: ANA-ARC-009
  title: "称重电桥：排查引线电阻对比例测量的破坏"
  domain: analog
  stage: architecture
  severity: should
  rule: "电桥用 ADC 的基准同时作为激励（比例测量）时，激励线上的电阻会让电桥实际电压低于 ADC 基准电压。引线很短时用四线接法；引线长或精度要求高时用六线接法并把 sense 线接到电桥端，或把 ADC 放到电桥旁边。HX711 模块没有 sense 引脚，激励线要尽量短、电阻低。"
  rationale: "激励电流在引线电阻上产生压降，破坏 Vout 与基准的比例关系，表现为与线长、温度相关的增益误差。sense 线几乎不载流，所以不引入类似的误差。"
  parameters:
    - name: example_lead_error
      op: "=="
      value: 0.6
      unit: "%"
      note: "TI 示例：5 V 激励、350 ohm 电桥，激励线每根 1 ohm 就产生 0.6% 的测量误差"
  verify:
    - method: bench
      tool: "称重传感器 + 标准砝码 + 万用表"
      check: "在实际线长下测传感器端和 ADC 板端的激励电压，差值/激励电压超过误差预算份额则不通过；或用标准砝码在线长变化前后对比读数"
      automatable: manual
    - method: review
      tool: "接线评审"
      check: "确认线长和线规：算 R_lead_total*I_excitation / V_excitation，对照预算"
      automatable: manual
  sources:
    - title: "A Basic Guide to Bridge Measurements (SBAA532A)"
      url: "https://www.ti.com/lit/an/sbaa532a/sbaa532a.pdf"
      publisher: "Texas Instruments"
      kind: app_note
      section: "§3.1 Ratiometric Measurements, §3.2 Four-Wire Bridge, §3.3 Six-Wire Bridge"
  confidence: high
  applies_to: [bridge_sensor, load_cell, hx711]
