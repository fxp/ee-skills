- id: ANA-RTE-003
  title: "模拟输入走线远离开关节点和数字信号"
  domain: analog
  stage: routing
  severity: should
  rule: "模拟输入、基准和滤波元件的走线不要与数字线（SPI/I2C/时钟/PWM 栅极）和开关节点（MOSFET 漏极、续流二极管、电机端子）平行相邻，也不要从其下方穿过；数字线的走线保持在数字区。"
  rationale: "数字边沿通过电容和互感耦合到高阻抗或小信号模拟线上，转换器的噪声性能会下降；ADC 的 CAP 脚、基准脚尤其敏感。"
  parameters:
    - name: min_distance_analog_to_digital
      op: maximize
      value: null
      note: "出处只要求 away / avoid，没有数值；本板可按线宽倍数设定并用 DRC 自定义规则强制"
  verify:
    - method: drc
      tool: "KiCad DRC 自定义规则 (.kicad_dru)"
      check: "为模拟网络类与数字/开关网络类设定更大的间距规则；DRC 不得有该规则的违例"
      automatable: full
    - method: geometry_script
      tool: "pcbnew (KiCad bundled Python)"
      check: "对每条模拟网络走线，找到所有数字网络走线与它的平行段长度和最小间距；以及数字走线是否位于模拟元件焊盘的正下方（相邻层）"
      automatable: full
  sources:
