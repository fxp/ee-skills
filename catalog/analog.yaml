      automatable: manual
    - method: bench
      tool: "示波器：交流耦合，20 MHz 带宽限制"
      check: "在 Wi-Fi 发射突发时测模拟电源节点的纹波，与未开 Wi-Fi 时比较，增量应小于该节点的电源抑制预算"
