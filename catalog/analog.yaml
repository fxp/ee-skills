- id: ANA-PLN-002
  title: "转换器的 AGND/DGND 引脚在器件下方相连"
  domain: analog
  stage: plane_pour
  severity: should
  rule: "带 AGND 和 DGND 两个引脚的转换器，数字电流小时当作模拟器件处理：两个引脚用最短引线接到同一块低阻抗的模拟地平面，数字电源脚在本地用电容去耦到地，使数字瞬态电流只在 VDig - 电容 - DGND 的小回路里流动；数字电流大时才把 DGND 接数字地，并准备跳线对比。"
  rationale: "AGND/DGND 的名字描述的是芯片内部结构，不代表外部要分开；DGND 外部多一点阻抗，数字噪声就会经杂散电容更多地耦合到模拟电路。"
  verify:
