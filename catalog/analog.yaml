- id: ANA-SCH-004
  title: "REF 接地时给零电流区留死区余量"
  domain: analog
  stage: schematic
  severity: should
  rule: "单向测量把 INA199 的 REF 接地时，输出最低只能到 GND + 5 mV（典型）至 GND + 50 mV（最大，RL = 10 kohm），而失调乘增益后可达 ±15 mV（增益 100）；因此固件对低于该值的读数要当作死区，或把 REF 偏置到摆幅余量之上，并在固件里做零点校准。"
  rationale: "输出级不能真正到达 0 V，负失调会被截断，低电流段读数与实际不线性。"
  parameters:
    - name: swing_to_gnd_typ
      op: "=="
      value: 5
      unit: mV
      note: "INA199，RL = 10 kohm 到 GND"
    - name: swing_to_gnd_max
      op: "<="
      value: 50
      unit: mV
      note: "同上，-40 到 125 degC 最大值"
  verify:
    - method: bench
      tool: "分流电阻开路/电机停转 + 万用表 + 固件"
      check: "无电流时测 OUT 电压和 ADC 读数，记录零点；用 10 到 100 mA 小电流扫描，确认固件对死区以下数据的处理（报 0 或标记不可信）"
      automatable: manual
    - method: spice
      tool: "ngspice：带 Vos 和输出摆幅钳位的行为模型"
      check: "Vos = ±150 uV 时输出相对理想值的误差曲线，找出可信的最小电流"
      automatable: partial
  sources:
    - title: "INA199 datasheet (SBOS469H)"
      url: "https://www.ti.com/lit/ds/symlink/ina199.pdf"
      publisher: "Texas Instruments"
      kind: datasheet
      section: "§6.5 Voltage output: Swing to GND; Figure 6-6"
  confidence: high
  applies_to: [ina199, unidirectional_current_sense]
  tags: [cat-feeder]

- id: ANA-SCH-005
  title: "INA199 输出到 ADC 引脚：先串电阻再接 100 nF"
  domain: analog
  stage: schematic
  severity: should
  rule: "INA199 的最大容性负载是 1 nF（无持续振荡），而 ESP32-C3 ADC 引脚按 Espressif 建议要挂 100 nF；二者之间必须串一个电阻（RC 低通），电阻值用 SPICE/示波器确认无振铃，且 RC 转折频率高于被测电流带宽、低于 INA199 带宽。"
  rationale: "100 nF 直接接在输出缓冲上远超 1 nF 限制，会降低相位裕度甚至振荡；ESP32-C3 数据手册的 DNL/INL 指标也是在外接 100 nF 条件下给出的。"
  parameters:
