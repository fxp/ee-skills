      note: "AVDD、DVDD 均为 2.6 到 5.5 V"
    - name: hx711_psrr
      op: "=="
      value: 100
      unit: dB
      note: "增益 128、10 SPS 条件下的电源抑制比"
  verify:
    - method: review
      tool: "原理图评审"
      check: "追踪 HX711 模块的 DVDD/VCC 引脚网络，确认与 ESP32-C3 的 3V3 是同一网络；若是 5 V 则必须有电平转换"
      automatable: manual
    - method: bench
      tool: "示波器 + 万用表"
      check: "上电状态下量 DOUT 空闲高电平，必须 <= MCU 的 3.3 V 供电；在 Wi-Fi 发射突发时观察 AVDD 纹波"
