- id: AUD-ARC-001
  title: "按功率、负载和损耗反推 Class-D 供电电压与限流"
  domain: audio
  stage: architecture
  severity: should
  rule: >-
    用目标无削波功率、扬声器阻抗、回路总串联电阻 R_T（负载 + 输出管 RDS(on) + 电感 DCR + 走线与电源内阻，按最高结温取值）和最大占空比 M_max 反推最低 PVCC：
    BTL 时 Vcc(min) = sqrt(2·P·R_T²/R_load)/M_max，标称电压再除以 (1 - 电源容差)；并要求芯片过流阈值 ≥ Vcc(min)·M_max/R_T。
  rationale: >-
    Class-D 的输出摆幅受供电电压和占空比上限约束，实际无削波功率低于理想值；限流过低会在峰值处提前削波、抬高失真，供电不足则达不到 THD+N=10% 的标称功率。
  applies_to: [class-d, speaker-amplifier, btl]
  parameters:
    - name: btl_unclipped_power
      op: qualitative
      value: null
      note: "P = (Vcc·M_max)²/(2·R_T²)·R_load（EDN）；TPA3116D2 数据手册 Eq.2 写作 P = (R_L/(R_L+2·R_S)·V_P)²/(2·R_L)，R_S 含 RDS(on) 与滤波器电阻"
    - name: power_10pct_thd_over_unclipped
      op: "=="
      value: 1.25
      unit: ratio
      note: "TPA3116D2 数据手册：POUT(10% THD) = 1.25 × POUT(unclipped)；核算无削波功率时不要拿 10% THD 功率当目标"
    - name: supply_voltage_nominal
      op: qualitative
      value: null
      note: "Vcc(nom) = Vcc(min)/(1 - 容差)。EDN 示例：50 W / 8 Ω、R_T = 8.3 Ω、M_max = 88%、±5% 容差，得 Vcc(min) = 33.3 V、标称 35.1 V；按 Eq.4 代入同一组数重算限流 ≥ 33.34×0.88/8.3 ≈ 3.53 A（EDN 原文印的是 3.72 A，与其自身输入不自洽，以公式为准；示例数字，不是通用阈值）"
  verify:
    - method: bom_check
      tool: "Python 小脚本或表格，读 BOM 与数据手册参数"
      check: >-
        输入目标功率、最小负载阻抗、RDS(on)@Tj_max、电感 DCR、电源最低电压与容差、器件 M_max，按上式算 Vcc(min) 与 I_limit(min)；
        通过判据：实际最低 PVCC ≥ Vcc(min)，器件过流阈值 ≥ I_limit(min)。
      automatable: partial
    - method: bench
      tool: "音频分析仪 + 可调电源 + 假负载"
      check: "把 PVCC 调到设计最低值、负载取最小标称阻抗，扫 1 kHz 的 THD+N-功率曲线，确认目标功率出现在削波拐点之前"
      automatable: manual
  sources:
    - title: "Understanding Class-D amplifier power supply requirements"
      url: "https://www.edn.com/understanding-class-d-amplifier-power-supply-requirements/"
      publisher: "EDN"
      kind: blog
      section: "Eq.1-4 及 BTL 50 W 示例"
    - title: "TPA3116D2 / TPA3118D2 / TPA3130D2 datasheet (SLOS708G)"
      url: "https://www.ti.com/lit/ds/symlink/tpa3116d2.pdf"
      publisher: "Texas Instruments"
      kind: datasheet
      section: "§7.3.4 PLIMIT Operation, Eq.2"
    - title: "How to Choose a Class-D Audio Amplifier (SLOA290)"
      url: "https://www.ti.com/lit/SLOA290"
      publisher: "Texas Instruments"
      kind: vendor_guide
      section: "§2-§4"
  confidence: high

- id: AUD-ARC-002
  title: "按功率、散热、续航和 EMI 预算选 Class-D 或线性功放"
  domain: audio
  stage: architecture
  severity: consider
  rule: >-
    功率较大、靠电池或散热受限时选 Class-D（峰值效率可达约 90%）；仅为耳机或线路级小功率、且对开关噪声敏感时可选线性（AB / DirectPath）放大器。选 Class-D 即同时规划输出滤波器、层数和 EMC 预算。
  rationale: >-
    Class-D 把损耗从功率级转成约 10% 的热量和 PWM 载波辐射，在低输出功率时效率最差；线性放大器没有调制，不产生开关谐波但发热大。
  applies_to: [class-d, class-ab, headphone-amplifier, speaker-amplifier]
  parameters:
    - name: switching_frequency
      op: range
      value: [200, 1500]
      unit: kHz
      note: "SLOA290：通常 200 kHz-1.5 MHz，个别车载器件到 2.1 MHz；频率越高对滤波器要求不同，也可能落入 AM 频段（540-1600 kHz）"
    - name: class_d_peak_efficiency
      op: qualitative
      value: null
      note: "SLOA290：效率最高约 90%，但随输出功率下降，低功率时最差；以数据手册效率-功率曲线为准"
  verify:
    - method: review
      tool: "架构评审清单"
      check: "列出目标功率、电池/散热预算、EMC 目标、是否有 AM/DAB 收音机共存要求，对照所选器件的效率曲线与待机电流判断"
      automatable: manual
    - method: bench
      tool: "功率计 + 假负载"
      check: "在典型使用功率（而非满功率）下测整机输入功率与输出功率，算效率与待机电流"
      automatable: manual
  sources:
    - title: "How to Choose a Class-D Audio Amplifier (SLOA290)"
      url: "https://www.ti.com/lit/SLOA290"
      publisher: "Texas Instruments"
      kind: vendor_guide
      section: "§2, §6, §7"
    - title: "TPA6132A2 25-mW DirectPath stereo headphone amplifier (SLOS597A)"
      url: "https://www.ti.com/lit/ds/slos597a/slos597a.pdf"
      publisher: "Texas Instruments"
      kind: datasheet
      section: "§8.1"
  confidence: medium

- id: AUD-ARC-003
  title: "音频指标带测试条件立项（THD+N、SNR、PSRR）"
  domain: audio
  stage: architecture
  severity: should
  rule: >-
    立项时为 THD+N、SNR、动态范围、PSRR 各给出带条件的目标：测试频率、电平、增益、负载和测量带宽（默认 20 kHz 平坦、不加权）；功率指标要写明是 1% 还是 10% THD+N、峰值还是连续。
  rationale: >-
    THD+N 把噪声也算进去，随带宽、电平和负载变化；不写条件的数字无法验证，也无法在器件之间比较。
  applies_to: [codec, preamp, speaker-amplifier]
  parameters:
    - name: measurement_bandwidth
      op: range
      value: [20, 22]
      unit: kHz
      note: "Rane：首选 20 kHz 或 22 kHz、平坦；80 kHz 可用于研发/产线暴露高频问题，必须随结果注明"
    - name: spec_conditions
      op: qualitative
      value: null
      note: "至少写明：频率、电平、增益（前级写最大增益）、负载、带宽/加权、功率点（1% 或 10% THD+N）"
  verify:
    - method: review
      tool: "需求文档评审"
      check: "逐条检查每个音频指标是否带齐上述条件；没有条件的指标退回补写"
      automatable: manual
    - method: bench
      tool: "音频分析仪或声卡"
      check: "按指标中写明的条件原样复测，结果与目标对比"
      automatable: partial
  sources:
    - title: "RaneNote 145: Audio Specifications"
      url: "https://www.ranecommercial.com/legacy/note145.html"
      publisher: "Rane"
      kind: vendor_guide
    - title: "How to Choose a Class-D Audio Amplifier (SLOA290)"
      url: "https://www.ti.com/lit/SLOA290"
      publisher: "Texas Instruments"
      kind: vendor_guide
      section: "§2, §5"
  confidence: high

- id: AUD-ARC-004
  title: "Codec 的 MCLK 取 256×fs 常用频率，避开内部 PLL"
  domain: audio
  stage: architecture
  severity: should
  rule: >-
    优先提供 256×fs 的主时钟（48 kHz 用 12.288 MHz，44.1 kHz 用 11.2896 MHz）以绕开 codec 内部 PLL；必须用 PLL 时严格按数据手册的 PLL 输入范围和最高内部时钟限制配置。
  rationale: >-
    PLL 参数越界会让 codec 噪声增大甚至产生失真，使用 256×fs 时钟还能省电流。
  applies_to: [codec, i2s, mclk]
  parameters:
    - name: mclk_over_fs
      op: "=="
      value: 256
      unit: ratio
      note: "12.288 MHz@48 kHz，11.2896 MHz@44.1 kHz（SLAA749）"
    - name: pll_clkin_over_p
      op: qualitative
      value: null
      note: "TLV320AIC3254 示例：D=0 时 PLL_CLKIN/P 在 512 kHz-20 MHz，D≠0 时在 10-20 MHz，且 PLL_CLK 不超过器件上限；具体以所用 codec 手册为准"
  verify:
    - method: bom_check
      tool: "脚本：读晶振/时钟源频率与 codec 采样率表"
      check: "计算 MCLK/fs，若 ≠ 256 则检查所选 PLL 分频系数满足手册范围与内部时钟上限"
      automatable: partial
    - method: bench
      tool: "音频分析仪"
      check: "PLL 开/关两种配置下测空载本底噪声与 THD+N，确认无劣化"
      automatable: manual
  sources:
    - title: "Common Noise Issues in Audio Codecs (SLAA749)"
      url: "https://www.ti.com/lit/an/slaa749/slaa749.pdf"
      publisher: "Texas Instruments"
      kind: app_note
      section: "§2.2"
  confidence: high

- id: AUD-LIB-001
  title: "MEMS 话筒封装库带声孔与垫圈尺寸"
  domain: audio
  stage: library
  severity: should
  rule: >-
    底部声孔（zero-height）MEMS 话筒的封装库里放一个非金属化（unplated）PCB 声孔，孔径取规格书给定范围；顶部声孔型号则在外壳/垫圈侧留声路，垫圈孔径比话筒声孔至少大 0.5 mm。
  rationale: >-
    声孔直径、镀铜和垫圈对位决定频响与是否漏声；孔内镀铜会让焊料爬入堵孔，垫圈孔过小则对位公差造成漏气和回声。
  applies_to: [mems-microphone, bottom-port, top-port]
  parameters:
    - name: pcb_acoustic_hole_diameter_mini_zero_height
      op: range
      value: [0.4, 0.9]
      unit: mm
      note: "Knowles Mini/SPK/SPA/SPY 零高度型号推荐范围，声孔本身 0.25 mm；其他型号以规格书为准"
    - name: pcb_acoustic_hole_diameter_ultra_mini_zero_height
      op: range
      value: [0.3, 0.6]
      unit: mm
      note: "Knowles Ultra Mini 零高度"
    - name: gasket_hole_oversize
      op: ">="
      value: 0.5
      unit: mm
      note: "垫圈孔径比话筒顶部声孔至少大 0.5 mm，用于吸收 x-y 公差"
  verify:
    - method: geometry_script
      tool: "pcbnew (KiCad bundled Python)"
      check: "遍历话筒封装的钻孔，确认存在 NPTH（非金属化）声孔，孔径落在上述范围；声孔周围无其他铜或过孔占用"
      automatable: full
    - method: review
      tool: "封装评审"
      check: "对照所选话筒规格书的推荐焊盘与声孔尺寸，核对 3D/机械对位"
      automatable: manual
  sources:
    - title: "SiSonic Design Guide, AN16 Rev 3.0"
      url: "https://media.digikey.com/pdf/data%20sheets/knowles%20acoustics%20pdfs/sisonic_design_guide.pdf"
      publisher: "Knowles"
      kind: app_note
      section: "§3.2, Table 4"
  confidence: high

- id: AUD-SCH-001
  title: "信号通路电容用 C0G 或薄膜，慎用 X7R/X5R"
  domain: audio
  stage: schematic
  severity: should
  rule: >-
    音频信号通路上承受明显交流电压的耦合/滤波电容用 C0G(NP0) 或薄膜；容量大时用 SMT 薄膜，或用已保证正偏压的钽/电解。必须用 X7R/X5R 时加大容量和/或提高串联阻抗，把高通转折频率压到通带以下约两个十年。
  rationale: >-
    高 K 钛酸钡介质的介电常数随电场下降，信号电压使电容随之变化并调制电流，失真在 -3 dB 转折频率附近最大且随电平上升；C0G 在整个工作温度范围内容量变化小于 ±30 ppm（EDN），其滤波器实验中失真在测量底噪以下，没有这个现象。
  applies_to: [ac-coupling, active-filter, line-input, preamp]
  parameters:
    - name: c0g_practical_max_capacitance
      op: "<="
      value: 1
      unit: uF
      note: "TI：C0G/NP0 不易买到大于 1 µF 的值，大容量耦合需要薄膜或其他方案"
    - name: hpf_corner_below_passband
      op: ">="
      value: 2
      unit: decade
      note: "仅当不得不用 MLCC 时的经验做法（电容大 100 倍）；TI 实测：4.7 µF X7R 0805 在 2.5 kΩ 输入时失真从约 400 Hz 起，峰值在约 13 Hz 的 -3 dB 点"
    - name: polarized_cap_dc_bias
      op: qualitative
      value: null
      note: "钽/电解做耦合时必须保证正偏压；无偏压或反偏时失真显著变差"
  verify:
    - method: bom_check
      tool: "脚本：用网表识别信号通路网络上的电容"
      check: "对串联在音频通路、或在有源滤波器反馈/接地支路上的电容，检查介质为 C0G/NP0/薄膜；报出 X5R/X7R/Y5V 及其容量与封装，由评审确认例外"
      automatable: partial
    - method: bench
      tool: "音频分析仪"
      check: "1 Vrms 下扫 20 Hz-20 kHz 的 THD+N，再做 500 Hz 的电平扫描；失真随电平上升说明是无源器件（通常是电容）引入"
      automatable: manual
  sources:
    - title: "Selecting Capacitors to Minimize Distortion in Audio Applications (SLYT796)"
      url: "https://www.ti.com/lit/pdf/slyt796"
      publisher: "Texas Instruments"
      kind: app_note
    - title: "Signal distortion from high-K ceramic capacitors"
      url: "https://www.edn.com/signal-distortion-from-high-k-ceramic-capacitors/"
      publisher: "EDN"
      kind: blog
    - title: "Single-Supply, Electret Microphone Pre-Amplifier Reference Design (TIDU765)"
      url: "https://www.ti.com/lit/pdf/tidu765"
      publisher: "Texas Instruments"
      kind: app_note
      section: "§3.1"
    - title: "AN1767 Solutions for Radio Frequency Electromagnetic Interference in Amplifier Circuits"
      url: "http://ww1.microchip.com/downloads/en/appnotes/00001767a.pdf"
      publisher: "Microchip"
      kind: app_note
      section: "External Filters"
  conflicts: >-
    部分论坛意见认为转折频率在个位数 Hz 时 X7R 的失真会被放大器自身失真淹没；TI 实测（1 Vrms、4.7 µF X7R）和 EDN 的滤波器实验都测到可辨失真，
    因此默认避免。对成本敏感且信号电平很低的通路可降级为 consider，但应保留 THD+N 实测。
  confidence: high

- id: AUD-SCH-002
  title: "按实际输入阻抗和有效容量核算 AC 耦合转折频率"
  domain: audio
  stage: schematic
  severity: should
  rule: >-
    转折频率 fc = 1/(2π·R_in·C_in)，R_in 取器件在所选增益下的真实输入阻抗（含 ±容差），C_in 取计入容差和直流偏压降额后的有效容量，并核对 fc 低于所需低频下限（如 20 Hz）。
  rationale: >-
    输入阻抗常随增益变化（TPA3116D2 在 20-36 dB 增益间为 60 kΩ-9 kΩ，且 ±20%），陶瓷电容在偏压下容量大幅下降，按标称值算会让低频提前衰减。
  applies_to: [ac-coupling, class-d, headphone-amplifier, codec]
  parameters:
    - name: hpf_corner_frequency
      op: "<="
      value: 20
      unit: Hz
      note: "以产品低频下限为准；示例：TPA6132A2 +6 dB 增益时 R_in = 13.2 kΩ，20 Hz 需 C ≥ 0.6 µF，取 0.68 µF X5R；TIDU765 的 R1 = 13.7 kΩ、5 Hz 取 2.2 µF"
    - name: input_resistance_tolerance
      op: qualitative
      value: null
      note: "TPA3116D2 输入电阻公差 ±20%，最小值按 ≥ 7.2 kΩ 计算；用最坏情况核算 fc"
  verify:
    - method: spice
      tool: "ngspice：.ac dec 20 1 100k"
      check: "用 R_in 的最大/最小值和电容容差/偏压降额后的有效容量各跑一次，读 -3 dB 点，要求最坏情况仍低于所需低频下限"
      automatable: partial
    - method: bom_check
      tool: "脚本：由 BOM 取电容值、封装、额定电压，按厂家 C-V 曲线降额"
      check: "有效容量 = 标称值 ×(1 - 容差) × 偏压降额，代入 fc 公式，与要求对比"
      automatable: partial
  sources:
    - title: "TPA6132A2 25-mW DirectPath stereo headphone amplifier (SLOS597A)"
      url: "https://www.ti.com/lit/ds/slos597a/slos597a.pdf"
      publisher: "Texas Instruments"
      kind: datasheet
      section: "§9.2.1.2.1"
    - title: "TPA3116D2 / TPA3118D2 / TPA3130D2 datasheet (SLOS708G)"
      url: "https://www.ti.com/lit/ds/symlink/tpa3116d2.pdf"
      publisher: "Texas Instruments"
      kind: datasheet
      section: "§7.3.2"
    - title: "Power supply decoupling and audio signal filtering for the Class-D audio power amplifier (SLYT199)"
      url: "https://www.ti.com/lit/pdf/slyt199"
      publisher: "Texas Instruments"
      kind: app_note
      section: "Input filter, Eq.5"
  confidence: high

- id: AUD-SCH-003
  title: "运放驱动容性负载时加隔离电阻并留相位裕度"
  domain: audio
  stage: schematic
  severity: should
  rule: >-
    运放输出直接带线缆、大滤波电容或参考电容时，在输出与负载电容之间串联隔离电阻 R_ISO（或做环内 R + Cf 补偿），阻值按数据手册的开环输出阻抗 R_O、GBW 和 C_load 估算，并用 SPICE 确认环路相位裕度 ≥ 45°。
  rationale: >-
    输出电容与运放开环输出电阻形成额外极点，使环路相位逼近 180° 而振荡；R_ISO 把输出与反馈节点隔开。音频输出需要低输出阻抗时，环内补偿比环外电阻更合适。
  applies_to: [opamp, line-output, headphone-amplifier, cable-load]
  parameters:
    - name: phase_margin
      op: ">="
      value: 45
      unit: deg
      note: "TI 以 45° 为常用下限，稳定电路在 AOL 与 1/β 交点处应有 20 dB/dec 闭合速率与 45°-90° 裕度"
  verify:
    - method: spice
      tool: "ngspice / TINA-TI：带 R_O 的运放宏模型 + R_ISO + C_load"
      check: "断开反馈环做 AC 扫描（或注入法），读 AOL·β 单位增益处相位裕度 ≥ 45°；再做小信号阶跃，输出无持续振铃"
      automatable: partial
    - method: bench
      tool: "示波器 + 方波发生器"
      check: "接真实线缆/负载电容，输出端 1 kHz 小幅方波，看过冲与振铃是否衰减"
      automatable: manual
  sources:
    - title: "Determine Optimal Isolation Resistance for Driving Capacitive Load (SBOA418)"
      url: "https://www.ti.com/lit/pdf/sboa418"
      publisher: "Texas Instruments"
      kind: app_note
      section: "§2-§3"
    - title: "Ask The Applications Engineer-25: Op Amps Driving Capacitive Loads"
      url: "https://www.analog.com/en/resources/analog-dialogue/articles/ask-the-applications-engineer-25.html"
      publisher: "Analog Devices"
      kind: app_note
    - title: "Ask The Application Engineer-32: Practical Techniques to Avoid Instability Due to Capacitive Loading"
      url: "https://www.analog.com/en/resources/analog-dialogue/articles/techniques-to-avoid-instability-capacitive-loading.html"
      publisher: "Analog Devices"
      kind: app_note
  confidence: high

- id: AUD-SCH-004
  title: "音频端口加 RF 低通：输入、BTL 输出和电源入口"
  domain: audio
  stage: schematic
  severity: should
  rule: >-
    每个音频输入（及模拟 BTL 功放输出、话筒线、电源入口）放 RF 低通：反相运放级的滤波电容接在两个等值电阻之间而不是直接接反相输入端，滤波带宽取信号带宽的 20-30 倍以上，电容用 NP0/C0G 或薄膜的低电感贴片。
  rationale: >-
    放大器输入的 ESD 二极管和 PN 结会对 RF 包络整流，把 GSM 的 217 Hz 帧率等突发调制变成带内失调和 buzz；音频走线在 2.4 GHz 附近长度约 3 cm 就是有效天线。
  applies_to: [opamp, line-input, btl-amplifier, wireless-coexistence]
  parameters:
    - name: filter_bandwidth_over_signal_bandwidth
      op: ">="
      value: 20
      unit: ratio
      note: "AN1767：为减小信号损失，滤波带宽至少为信号带宽的 20 或 30 倍"
    - name: rf_shunt_capacitor
      op: range
      value: [10, 39]
      unit: pF
      note: "SNAA033D：自谐振在 900/1800 MHz 附近的 10-39 pF 对音频影响可忽略；每个对 RF 敏感的输入、输出、电源引脚各放一只"
    - name: btl_output_lowpass_cutoff
      op: "=="
      value: 1
      unit: MHz
      note: "SNAA033D 案例：输出端磁珠 + 电容二阶低通，-3 dB 点 1 MHz，buzz 下降 30 dB（案例值，需按实际器件复核）"
  verify:
    - method: spice
      tool: "ngspice：.ac"
      check: "仿真 RC/磁珠+C 滤波后的响应，确认音频带内衰减可忽略、20-30 倍带宽以外开始衰减；反相级确认电容位置不在反相输入端上"
      automatable: partial
    - method: bench
      tool: "手机/Wi-Fi/BLE 发射源靠近 + 音频分析仪 FFT"
      check: "在最坏情况放置发射源，查 FFT 里 217 Hz 及谐波或无线包速率的音调，对比加/去滤波两种状态"
      automatable: manual
    - method: review
      tool: "原理图评审"
      check: "逐个音频输入/输出/话筒/电源入口检查是否有 RF 滤波，滤波电容靠近放大器引脚而不是连接器侧"
      automatable: manual
  sources:
    - title: "AN1767 Solutions for Radio Frequency Electromagnetic Interference in Amplifier Circuits"
      url: "http://ww1.microchip.com/downloads/en/appnotes/00001767a.pdf"
      publisher: "Microchip"
      kind: app_note
      section: "Classical solution for EMI reduction: External Filters"
    - title: "AN-1496 Noise, TDMA Noise, and Suppression Techniques (SNAA033D)"
      url: "https://www.ti.com/lit/an/snaa033d/snaa033d.pdf"
      publisher: "Texas Instruments"
      kind: app_note
    - title: "GSM RFI Suppression with EMI Filters"
      url: "https://www.johansondielectrics.com/tech-notes/gsm-rfi-suppression-with-emi-filters/"
      publisher: "Johanson Dielectrics"
      kind: vendor_guide
    - title: "AN-CS002 CODEC Printed Circuit Board Layout Considerations"
      url: "https://www.digikey.com/Site/Global/Layouts/DownloadPdf.ashx?pdfUrl=09748F6FB2B14376BFA057A887CFD3EF"
      publisher: "Nuvoton"
      kind: app_note
      section: "item C"
  confidence: high

- id: AUD-SCH-005
  title: "驻极体话筒偏置电阻、耦合电容和中点偏置滤波"
  domain: audio
  stage: schematic
  severity: should
  rule: >-
    偏置电阻 R1 = (Vcc - V_mic)/I_mic，取略小于计算值以容忍电源变化；R1 与耦合电容组成高通 fc = 1/(2π·R1·C)；运放中点偏置分压处并电容，使分压电阻并联值与该电容的 RC 角频率低于 20 Hz。
  rationale: >-
    R1 的热噪声和电源噪声会直接进入话筒通路，R1 越大越利于降低噪声增益和减小所需耦合电容；偏置滤波角频率低于音频带才不会让噪声落入带内。
  applies_to: [electret-microphone, preamp, single-supply]
  parameters:
    - name: bias_network_lowpass_corner
      op: "<"
      value: 20
      unit: Hz
      note: "TIDU765：R3 = R5 = 100 kΩ、C6 = 2.2 µF 时约 1.4 Hz"
    - name: coupling_cap_hpf_corner_example
      op: "=="
      value: 5
      unit: Hz
      note: "TIDU765 示例：R1 = 13.7 kΩ，5 Hz 角频率对应 C = 2.2 µF（公式 C = 1/(2π·R1·fc)）；产品低频下限不同则重算"
  verify:
    - method: spice
      tool: "ngspice：压控电流源 + 噪声电流源建模话筒"
      check: ".ac 核对 fc；.noise 在 20 Hz-20 kHz 积分得到输入参考噪声，与 ARC 噪声预算对比；偏置网络 RC 角频率 < 20 Hz"
      automatable: partial
    - method: bench
      tool: "示波器 + 音频分析仪"
      check: "静音环境测输出本底并在偏置电源上叠加小幅噪声，验证电源抑制"
      automatable: manual
  sources:
    - title: "Single-Supply, Electret Microphone Pre-Amplifier Reference Design (TIDU765)"
      url: "https://www.ti.com/lit/pdf/tidu765"
      publisher: "Texas Instruments"
      kind: app_note
      section: "§2.2, §2.3, §4"
  confidence: high

- id: AUD-SCH-006
  title: "模拟 MEMS 话筒供电去耦、RF 滤波和耦合电容"
  domain: audio
  stage: schematic
  severity: should
  rule: >-
    模拟 MEMS 话筒不需要上拉偏置电阻；VDD 就近并 0.1-10 µF，电源噪声大时串磁珠并在芯片侧对地加 10-100 pF RF 电容；输出经 0.1-1.0 µF 隔直电容接 codec（codec 自偏置时），话筒输出与 VDD 走线不得平行而中间无地。
  rationale: >-
    MEMS 话筒 PSRR 典型只有约 50 dB：10 mV rms 的电源噪声会变成约 30 µV rms 的输出，高于 11 µV rms 的本底噪声，相当于约 46 dB SPL 的声音输入。
  applies_to: [mems-microphone, codec-input]
  parameters:
    - name: supply_decoupling
      op: range
      value: [0.1, 10]
      unit: uF
      note: "Knowles 图 28 中的 Cpwr"
    - name: rf_shunt_capacitor
      op: range
      value: [10, 100]
      unit: pF
      note: "Crf，靠近器件、RF 特性好的电容；放在磁珠的 codec 一侧"
    - name: coupling_capacitor
      op: range
      value: [0.1, 1.0]
      unit: uF
      note: "与 codec 输入阻抗形成高通，目标 3 dB 点低于 100 Hz；codec 输入需外部直流偏置时参考 codec 手册"
  verify:
    - method: review
      tool: "原理图评审"
      check: "核对 V+ 去耦、磁珠/RF 电容位置和 codec 输入偏置方式是否与话筒、codec 手册一致"
      automatable: manual
    - method: bench
      tool: "音频分析仪"
      check: "静音环境测本底，再在话筒电源上注入已知小幅噪声（如 10 mV rms）看输出，核对约 50 dB 的 PSRR"
      automatable: manual
  sources:
    - title: "SiSonic Design Guide, AN16 Rev 3.0"
      url: "https://media.digikey.com/pdf/data%20sheets/knowles%20acoustics%20pdfs/sisonic_design_guide.pdf"
      publisher: "Knowles"
      kind: app_note
      section: "§4.1, §4.4, §4.6, Figure 28"
  confidence: high

- id: AUD-SCH-007
  title: "Codec 模拟电源独立稳压并滤波，MICBIAS 噪声同源"
  domain: audio
  stage: schematic
  severity: should
  rule: >-
    Codec 的 AVDD（及由它派生的 MICBIAS）由独立的低噪声稳压源或带 LC/磁珠滤波的支路供电，不与数字或功率级共用未滤波的轨；电源含高频噪声时在入口加低通/EMI 滤波。
  rationale: >-
    MICBIAS 可直接选为 AVDD，AVDD 的噪声于是直接加到话筒信号上；codec 内部所有模拟处理都以该电源为基准。
  applies_to: [codec, micbias, ldo]
  parameters:
    - name: codec_supply_decoupling_small
      op: "=="
      value: 0.1
      unit: uF
      note: "与 IC 同层、尽量靠近电源引脚（见 AUD-PLC-002）"
    - name: codec_supply_decoupling_bulk
      op: "=="
      value: 10
      unit: uF
      note: "同上"
  verify:
    - method: spice
      tool: "ngspice：LDO 输出阻抗/PSRR 宏模型 + 滤波器"
      check: "对 AVDD 滤波支路做 AC 扫描，读 217 Hz、1 kHz、20 kHz 与开关频率处的纹波衰减，与 codec 的 PSRR 规格叠加评估"
      automatable: partial
    - method: bench
      tool: "示波器（20 MHz 带宽限制与全带宽各一次）+ 音频分析仪"
      check: "测 AVDD/MICBIAS 噪声；在 AVDD 上注入纹波时看 ADC FFT 本底的变化"
      automatable: manual
    - method: review
      tool: "原理图评审"
      check: "确认 AVDD、DVDD、IOVDD、PVDD 各自来源和滤波路径，没有未滤波的数字/功率轨直接供电给 AVDD"
      automatable: manual
  sources:
    - title: "Common Noise Issues in Audio Codecs (SLAA749)"
      url: "https://www.ti.com/lit/an/slaa749/slaa749.pdf"
      publisher: "Texas Instruments"
      kind: app_note
      section: "§2.3"
    - title: "AN-CS002 CODEC Printed Circuit Board Layout Considerations"
      url: "https://www.digikey.com/Site/Global/Layouts/DownloadPdf.ashx?pdfUrl=09748F6FB2B14376BFA057A887CFD3EF"
      publisher: "Nuvoton"
      kind: app_note
      section: "items A, G"
  confidence: high

- id: AUD-SCH-008
  title: "Codec 线路输出接 Class-D 输入前加 RC 低通"
  domain: audio
  stage: schematic
  severity: should
  rule: >-
    Codec 线路输出驱动外部 Class-D 功放输入时，在两者之间加 RC 低通滤除 Σ-Δ 带外噪声；TI 示例为 1 kΩ + 4.7 nF，极点约 33 kHz。
  rationale: >-
    Σ-Δ 转换器的带外噪声虽然听不到，但 Class-D 放大后会抬高噪声和谐波，影响可听频段。
  applies_to: [codec, class-d, line-output]
  parameters:
    - name: series_resistor
      op: "=="
      value: 1
      unit: kOhm
      note: "TI 示例；需与功放输入阻抗一起算分压"
    - name: shunt_capacitor
      op: "=="
      value: 4.7
      unit: nF
      note: "C0G/NP0 为宜（见 AUD-SCH-001）"
    - name: lowpass_pole
      op: "=="
      value: 33
      unit: kHz
      note: "TI 原文写 33 kHz（SLAA749）；按 1/(2π·1 kΩ·4.7 nF) 实算为 ≈33.9 kHz，33 为原文取整。TI 称对音频应用合适；高采样率/超声应用需上移"
  verify:
    - method: spice
      tool: "ngspice：.ac"
      check: "含功放输入阻抗的实际 -3 dB 点，确认 20 kHz 处衰减在可接受范围，带外噪声被抑制"
      automatable: partial
    - method: bench
      tool: "音频分析仪（宽带 FFT，到 100 kHz 以上）"
      check: "有无该滤波两种状态下比较 Class-D 输出的带外噪声和 THD+N"
      automatable: manual
  sources:
    - title: "Common Noise Issues in Audio Codecs (SLAA749)"
      url: "https://www.ti.com/lit/an/slaa749/slaa749.pdf"
      publisher: "Texas Instruments"
      kind: app_note
      section: "§2.4, Figure 4"
  confidence: high

- id: AUD-SCH-009
  title: "抑制 pop/click：匹配输入网络、RC≤1 ms、使能时序"
  domain: audio
  stage: schematic
  severity: should
  rule: >-
    差分输入两端阻抗相同，输入网络 RC 时间常数尽量不超过约 1 ms，使耦合电容在上电窗口内充满；功放使能晚于音源稳定，关断（或进入 shutdown）先于音源和电源掉电。
  rationale: >-
    耦合电容没充满时对元件失配更敏感，会在启动时产生 pop；音源还在建立或已关闭时放大器仍使能，会把音源的瞬变直接放大。
  applies_to: [class-d, headphone-amplifier, ac-coupling]
  parameters:
    - name: input_rc_time_constant
      op: "<="
      value: 1
      unit: ms
      note: "TPA3116D2：使耦合电容在 10 ms 上电时间内充满"
    - name: enable_sequence
      op: qualitative
      value: null
      note: "TPA6132A2：音源激活并稳定后再使能功放，掉电时先关功放再关音源；TPA3116D2：断电前先拉低 SDZ 进入 shutdown"
  verify:
    - method: spice
      tool: "ngspice：.tran"
      check: "模拟上电时输入耦合电容经 R_in 充向偏置点的过程，确认 5×(R·C) 小于上电窗口，输出偏移无台阶"
      automatable: partial
    - method: bench
      tool: "示波器（AC 耦合，输出端直接探测）+ 耳听"
      check: "分别对上电、断电、SDZ/EN 开关、MUTE 切换抓输出瞬态，并在各种音源状态下重复；记录峰值并与产品要求比较"
      automatable: manual
    - method: review
      tool: "固件时序评审"
      check: "核对使能 GPIO 的上电/掉电顺序与音源（codec、DAC）启动时序是否符合上述规则"
      automatable: manual
  sources:
    - title: "TPA3116D2 / TPA3118D2 / TPA3130D2 datasheet (SLOS708G)"
      url: "https://www.ti.com/lit/ds/symlink/tpa3116d2.pdf"
      publisher: "Texas Instruments"
      kind: datasheet
      section: "§7.3.3, §7.3.7"
    - title: "TPA6132A2 25-mW DirectPath stereo headphone amplifier (SLOS597A)"
      url: "https://www.ti.com/lit/ds/slos597a/slos597a.pdf"
      publisher: "Texas Instruments"
      kind: datasheet
      section: "§8.3.2"
  confidence: high

- id: AUD-SCH-010
  title: "耳机输出：隔直电容容量，或无电容架构的接线"
  domain: audio
  stage: schematic
  severity: should
  rule: >-
    单电源耳机输出用隔直电容时 C_out = 1/(2π·fc·R_L)（16 Ω 负载、20 Hz 至少约 500 µF）；可用 DirectPath/双极性输出的放大器取消电容。以 VCOM 为参考的 capless 型放大器不得把耳机插座套筒接地。
  rationale: >-
    大隔直电容占面积、增加高度，且开关机时充放电会产生 pop；capless 输出以中点电压为参考，套筒接地会产生大电流，也不能接非耳机附件。
  applies_to: [headphone-amplifier, line-output, 3.5mm-jack]
  parameters:
    - name: dc_block_cap_16ohm_20hz
      op: ">="
      value: 500
      unit: uF
      note: "TPA6132A2 手册：16 Ω 耳机、20 Hz 截止至少 500 µF"
  verify:
    - method: erc
      tool: "KiCad ERC / 网表脚本"
      check: "对 capless 型号，检查插座 SLEEVE/SGND 网络不连接系统 GND；对带电容型号，检查 C_out 满足公式"
      automatable: partial
    - method: spice
      tool: "ngspice：.ac"
      check: "含耳机阻抗范围（16-32 Ω）的 -3 dB 点"
      automatable: partial
  sources:
    - title: "TPA6132A2 25-mW DirectPath stereo headphone amplifier (SLOS597A)"
      url: "https://www.ti.com/lit/ds/slos597a/slos597a.pdf"
      publisher: "Texas Instruments"
      kind: datasheet
      section: "§8.3.1, Eq.1-2"
  confidence: high

- id: AUD-SCH-011
  title: "Class-D 输出 LC 滤波器按二阶 Butterworth 设计"
  domain: audio
  stage: schematic
  severity: should
  rule: >-
    LC 滤波器取 Q = 0.707 的二阶 Butterworth：单端等效 L = √2·R_L/ω0、C = 1/(√2·R_L·ω0)；截止频率远高于 20 kHz、远低于开关频率，不允许明显峰化，并按扬声器阻抗的变化范围复核。
  rationale: >-
    欠阻尼滤波器在高频产生可听的刺耳峰值，还可能触发功放过流保护；过阻尼则吃掉高频音频内容。负载阻抗决定阻尼比，所以必须在阻抗范围内核算。
  applies_to: [class-d, lc-filter, btl]
  parameters:
    - name: q_factor
      op: "=="
      value: 0.707
      unit: ratio
      note: "SLAA701B Eq.5-6 的前提"
    - name: example_corner_4ohm_30khz
      op: qualitative
      value: null
      note: "SLYT199 表 1：4 Ω、fc = 30 kHz，每路 L = 15 µH，差分 C = 0.94 µF（老器件 TPA005D14）"
    - name: example_corner_tpa32xx
      op: "=="
      value: 73
      unit: kHz
      note: "SLAA701B：7 µH + 0.68 µF（或 10 µH + 0.47 µF）得 72.9/73.4 kHz，用于 600 kHz 开关频率的 TPA32xx；Type-1（AD 调制）与 Type-2（BD 调制）滤波器拓扑不同，按器件调制方式选"
  verify:
    - method: spice
      tool: "ngspice：.ac，负载用 R_e + L_e 的扬声器模型，并扫 R_L 的最小/最大值"
      check: "读 -3 dB 点与峰值：峰化小于约 1 dB、通带平坦到 20 kHz；在开关频率及其 ±10% 带内无谐振"
      automatable: partial
    - method: bench
      tool: "音频分析仪 / 网络分析"
      check: "实际扬声器负载下扫频响，看高频有无峰化，并确认过流保护不被误触发"
      automatable: manual
  sources:
    - title: "Class-D LC Filter Design (SLAA701B, formerly SLOA119)"
      url: "https://www.ti.com/lit/pdf/sloa119"
      publisher: "Texas Instruments"
      kind: app_note
      section: "§1.3, §1.5（73 kHz 示例在 §1.5）"
    - title: "Power supply decoupling and audio signal filtering for the Class-D audio power amplifier (SLYT199)"
      url: "https://www.ti.com/lit/pdf/slyt199"
      publisher: "Texas Instruments"
      kind: app_note
      section: "Output filter, Table 1"
  confidence: high

- id: AUD-SCH-012
  title: "LC 滤波器电感和电容选型：线性度与降额"
  domain: audio
  stage: schematic
  severity: should
  rule: >-
    电感的饱和电流必须高于直流 + 交流峰值电流并留裕度（不同厂家的 Isat 常定义在电感下降 30% 甚至更多，用到 Isat 会严重劣化 THD），选屏蔽、低 DCR 型；电容用金属化薄膜，用陶瓷时按电压降额，高功率输出时选额定电压 >150 V（推荐 250 V）、低 ESR。
  rationale: >-
    电感随电流饱和使电感量下降，阻抗越低的负载电流越大，失真越高；陶瓷电容 C ≈ C_rated·(1 - V/V_rated)，会让滤波器截止频率漂移，并带来电压系数失真。
  applies_to: [class-d, lc-filter, inductor, film-capacitor]
  parameters:
    - name: ceramic_rated_voltage_min
      op: ">"
      value: 150
      unit: V
      note: "SLAA701B §1.5：用陶瓷电容时额定电压 > 150 V 为强制，推荐 250 V（针对 TPA32xx 一类高功率 Class-D；5 V 级低功率器件不套用该数值，属本库的补充说明）"
    - name: capacitor_low_frequency_esr_peak
      op: "<="
      value: 1
      unit: Ohm
      note: "SLAA701B：低频峰值 ESR 建议不超过 1 Ω，频率越高越低"
    - name: film_capacitor_dvdt_min
      op: ">="
      value: 100
      unit: V/us
      note: "SLAA701B：50 Vpp、73 kHz 角频率约 23 V/µs，建议额定 dv/dt 取 100 V/µs 以留余量"
    - name: inductance_change_1a_to_20a_good_examples
      op: "<="
      value: 1.55
      unit: percent
      note: "SLAA701B 表 1-6：Würth 7443630700 为 0.94%，74436301000 为 1.38%，Coilcraft MA5173-AE 为 1.16%，MA5172-AE 为 1.55%（600 kHz 测试信号下的电感量平均变化，非通用门限）"
  verify:
    - method: bom_check
      tool: "脚本：读电感 Isat（含对应 ΔL% 定义）、DCR 与峰值电流"
      check: "峰值电流 = 峰值输出电压/R_L 加纹波，要求 Isat 对应的电感下降定义明确且峰值电流远低于它；电容额定电压、ESR、dv/dt 对照上述参数"
      automatable: partial
    - method: bench
      tool: "音频分析仪"
      check: "在最低阻抗负载下，对不同电感型号测 THD+N-功率曲线并比较"
      automatable: manual
  sources:
    - title: "Class-D LC Filter Design (SLAA701B, formerly SLOA119)"
      url: "https://www.ti.com/lit/pdf/sloa119"
      publisher: "Texas Instruments"
      kind: app_note
      section: "§1.4.1, §1.5"
    - title: "Power supply decoupling and audio signal filtering for the Class-D audio power amplifier (SLYT199)"
      url: "https://www.ti.com/lit/pdf/slyt199"
      publisher: "Texas Instruments"
      kind: app_note
      section: "Component selection"
  confidence: high

- id: AUD-SCH-013
  title: "免滤波 Class-D 的磁珠 EMI 滤波：电感性元件在前，禁止仅用电容"
  domain: audio
  stage: schematic
  severity: should
  rule: >-
    Filter-free 器件为过 EMC 时，每路输出先串铁氧体磁珠（或小电感），再接小电容到地；不得只用电容做输出滤波。滤波截止频率落在 1.5-10 MHz，磁珠额定电流留裕度，更换磁珠后重做 EMC 与 THD+N。
  rationale: >-
    输出边沿 dV/dt 约 0.7-2 V/ns，直接接电容会产生 I = C·dV/dt 的电流尖峰（250 pF × 2 V/ns ≈ 0.5 A），可能触发过流保护并增大损耗；磁珠还会影响 THD+N 并在高电流下饱和。
  applies_to: [class-d, filter-free, ferrite-bead]
  parameters:
    - name: ferrite_lc_corner
      op: range
      value: [1.5, 10]
      unit: MHz
      note: "下限来自 SLAA901/SLAA920（≥1.5 MHz，有利于减少本底噪声与误触发），上限来自 SLOA145（磁珠与电容构成的 LC 谐振应小于 10 MHz）；以器件手册为准"
    - name: bead_dc_current_fraction_of_rating
      op: "<="
      value: 0.6
      unit: ratio
      note: "SLOA145：低频最大电流应为额定 DC 电流的 30%-60%，避免电感量大幅下降"
    - name: capacitor_only_filter
      op: qualitative
      value: null
      note: "SLAA901：永远不建议只用电容；若用，容量取满足发射标准的最小值，且留 10-20% 的陶瓷工艺公差余量"
  verify:
    - method: spice
      tool: "ngspice：磁珠模型（R、L、并联 C）+ 输出电容"
      check: "AC 扫描找谐振点是否在 1.5-10 MHz；瞬态里 C·dV/dt 的尖峰电流低于器件过流阈值（含 ±20% 电容公差）"
      automatable: partial
    - method: emc_precompliance
      tool: "近场探头 + 频谱仪 / 预合规辐射扫描"
      check: "30 MHz-1 GHz，最长实际扬声器线缆下，对比有无磁珠及不同磁珠型号"
      automatable: manual
    - method: bench
      tool: "音频分析仪"
      check: "更换磁珠前后测 THD+N，磁珠在环外时高频失真会明显上升"
      automatable: manual
  sources:
    - title: "Filter-Free Class-D Audio Amplifiers (SLOA145)"
      url: "https://www.ti.com/lit/pdf/sloa145"
      publisher: "Texas Instruments"
      kind: app_note
      section: "§3 Ferrite Bead Filters, Table 2"
    - title: "Limitations of Capacitor Only EMI Filters on Class-D Amplifiers (SLAA901)"
      url: "https://www.ti.com/lit/pdf/slaa901"
      publisher: "Texas Instruments"
      kind: app_note
      section: "§3"
    - title: "TAS2563 Schematic and Layout Guidelines (SLAA920)"
      url: "https://www.ti.com/lit/an/slaa920/slaa920.pdf"
      publisher: "Texas Instruments"
      kind: app_note
      section: "§2.8"
    - title: "TPA3140D2 Design Considerations for EMC (SLOA216)"
      url: "https://www.ti.com/lit/an/sloa216/sloa216.pdf"
      publisher: "Texas Instruments"
      kind: app_note
      section: "§3.2"
  conflicts: >-
    低功率老器件用磁珠即可：SLOA145 图 5 为磁珠 + 1 nF，SLOA216 只给磁珠滤波、未给电容值；较新的智能功放（SLAA901、SLAA920）强调电感性元件在前且截止频率不低于 1.5 MHz。
    两者并不矛盾，参数取并集区间，具体仍以所用器件手册和实测为准。
  confidence: high

- id: AUD-SCH-014
  title: "自举电容按数据手册的容量、介质和耐压选"
  domain: audio
  stage: schematic
  severity: must
  rule: >-
    每个高边自举引脚（BSxx）跨接到对应输出（OUTxx）的陶瓷电容按数据手册选值：TPA3116D2 为 220 nF、X5R 或更好、额定 ≥16 V；该电容只连这两个节点。
  rationale: >-
    全 NMOS 桥的高边靠自举电容充当浮动电源维持栅源电压，容量或耐压不足会使高边无法可靠导通。
  applies_to: [class-d, h-bridge, bootstrap]
  parameters:
    - name: bootstrap_capacitance
      op: "=="
      value: 220
      unit: nF
      note: "TPA3116D2；其他器件按各自手册"
    - name: bootstrap_voltage_rating
      op: ">="
      value: 16
      unit: V
      note: "§7.3.6 写 ≥16 V，§8.2.2.5 的设计示例用 25 V X5R"
    - name: bootstrap_dielectric
      op: qualitative
      value: null
      note: "X5R 或更好"
  verify:
    - method: erc
      tool: "KiCad 网表脚本"
      check: "对每个 BSPx/BSNx 引脚，检查网络上仅有一个电容，另一端接到同通道的 OUTxx；容量/介质/额定电压与手册一致"
      automatable: full
    - method: bom_check
      tool: "BOM 检查"
      check: "电容规格（C、介质、V）满足上述参数，并计入直流偏压降额"
      automatable: full
  sources:
    - title: "TPA3116D2 / TPA3118D2 / TPA3130D2 datasheet (SLOS708G)"
      url: "https://www.ti.com/lit/ds/symlink/tpa3116d2.pdf"
      publisher: "Texas Instruments"
      kind: datasheet
      section: "§7.3.6, §8.2.2.5"
    - title: "PCB Layout Guidelines for TAS2xxx Series Class-D Non-boosted Audio Amplifier (SLAA902)"
      url: "https://www.ti.com/lit/pdf/slaa902"
      publisher: "Texas Instruments"
      kind: app_note
      section: "§2.6"
  confidence: high

- id: AUD-SCH-015
  title: "Class-D 电源引脚分级去耦和大容量电容"
  domain: audio
  stage: schematic
  severity: should
  rule: >-
    每个 PVCC 引脚配 220 pF-1 nF 的高频陶瓷和 100 nF-1 µF 的中频陶瓷（X5R 或更好），每侧另放 ≥100 µF 低 ESR 大电容；大电容按 C ≥ I_peak·T_D·D_max/V_ripple、ESR ≤ V_ripple/I_peak 核算。
  rationale: >-
    Class-D 的脉冲电流需要低阻抗电压源，PVCC 纹波会直接变成失真；纹波通常由 ESR 而不是容量主导。
  applies_to: [class-d, pvcc, decoupling]
  parameters:
    - name: hf_decoupling_capacitor
      op: range
      value: [220, 1000]
      unit: pF
      note: "TPA3116D2 §10.1；SLOA216 对 TPA3140D2 建议 1 nF"
    - name: mf_decoupling_capacitor
      op: range
      value: [0.1, 1]
      unit: uF
      note: "同上；SLOA216 建议 0.1 µF"
    - name: bulk_capacitor
      op: ">="
      value: 100
      unit: uF
      note: "TPA3116D2：每侧一个 100 µF/50 V 的低 ESR 电容；他处以 ESR 公式复核"
    - name: bulk_esr_limit
      op: qualitative
      value: null
      note: "SLYT199：ESR ≤ V_ripple/I_peak，并再留 30%-50% 余量（温度、ESL、老化）"
  verify:
    - method: bom_check
      tool: "脚本：按 PVCC 引脚统计去耦电容"
      check: "每个 PVCC 引脚旁都有高频、中频陶瓷；大电容容量与 ESR 满足上述公式（I_peak 取峰值功率对应的峰值电流，见 SLYT199 Eq.2）"
      automatable: partial
    - method: pi_sim
      tool: "PDN 阻抗仿真（含电容 ESL/ESR、安装电感）"
      check: "在开关频率及其谐波处 PDN 阻抗低于由允许纹波/峰值电流得到的目标"
      automatable: partial
    - method: bench
      tool: "示波器（短接地弹簧探头）"
      check: "满功率下测 PVCC 引脚处纹波和开关过冲"
      automatable: manual
  sources:
    - title: "TPA3116D2 / TPA3118D2 / TPA3130D2 datasheet (SLOS708G)"
      url: "https://www.ti.com/lit/ds/symlink/tpa3116d2.pdf"
      publisher: "Texas Instruments"
      kind: datasheet
      section: "§8.2.2.3-§8.2.2.4, §10.1"
    - title: "Power supply decoupling and audio signal filtering for the Class-D audio power amplifier (SLYT199)"
      url: "https://www.ti.com/lit/pdf/slyt199"
      publisher: "Texas Instruments"
      kind: app_note
      section: "Power supply decoupling, Eq.2-4"
    - title: "TPA3140D2 Design Considerations for EMC (SLOA216)"
      url: "https://www.ti.com/lit/an/sloa216/sloa216.pdf"
      publisher: "Texas Instruments"
      kind: app_note
      section: "§3.1"
  confidence: high

- id: AUD-SCH-016
  title: "平衡线路输入选高 CMRR 的差分接收器"
  domain: audio
  stage: schematic
  severity: consider
  rule: >-
    专业线路输入选激光修调的平衡线路接收器 IC（典型 CMRR 约 90 dB）或高共模输入阻抗/变压器方案；用分立运放差分级时需要四颗高度匹配的电阻，并评估源阻抗不平衡的影响。
  rationale: >-
    差分级的 CMRR 取决于电阻比例匹配；源端两路阻抗不平衡时，低共模输入阻抗会把共模转成差模，真实系统里的 CMRR 远低于实验室指标。
  applies_to: [balanced-input, line-receiver, pro-audio]
  parameters:
    - name: internal_resistor_ratio_match
      op: qualitative
      value: null
      note: "EDN/THAT：激光修调接收器内部电阻比例修调到约 0.005%，同片电阻匹配典型 0.5%（THAT1286 例），CMRR 约 90 dB；未修调需外部匹配电阻"
  verify:
    - method: spice
      tool: "ngspice 蒙特卡洛"
      check: "电阻公差取 1%、0.1% 以及源阻抗失配（例如 0-600 Ω）时，在 60 Hz 和 1 kHz 处的 CMRR 分布"
      automatable: partial
    - method: bench
      tool: "信号发生器 + 音频分析仪"
      check: "共模注入 1 Vrms，接入有失配的源阻抗，读差分输出，CMRR = 20·log(V_cm/V_out·增益)"
      automatable: manual
  sources:
    - title: "Audio line receiver impedance balancing using a 2nd diff amp"
      url: "https://edn.com/Home/PrintView?contentItemId=4406013"
      publisher: "EDN"
      kind: blog
    - title: "THAT 1200 Series balanced line receiver datasheet"
      url: "https://www.thatcorp.com/datashts/THAT_1200-Series_Datasheet.pdf"
      publisher: "THAT Corporation"
      kind: datasheet
    - title: "RaneNote 110: Sound System Interconnection"
      url: "https://www.ranecommercial.com/legacy/note110.html"
      publisher: "Rane"
      kind: vendor_guide
  confidence: medium

- id: AUD-NET-001
  title: "Class-D 输出、自举、Vsense 和电源分别设网络类"
  domain: audio
  stage: netlist
  severity: should
  rule: >-
    为 Class-D 输出（OUT_P/OUT_N）、自举、Vsense、功率与模拟电源、模拟输入和 I2S 时钟分别建 net class 并绑定约束：输出每路线宽 ≥30 mil（0.762 mm）并在两层并联、两路等长；Vsense 6 mil 差分；AVDD/VDD/IOVDD 用 20-30 mil 星形分发。
  rationale: >-
    这些网络的电流、开关特性和敏感度差异很大，不在网表阶段区分，后面的 DRC 和布线约束就无法自动检查。
  applies_to: [class-d, tas2xxx, net-class]
  parameters:
    - name: class_d_output_trace_width
      op: ">="
      value: 0.762
      unit: mm
      note: "30 mil，每层；两层并联等效 60 mil（SLAA902 §2.7）；表 3：30 mil/1 oz/62 mil FR4 约 3.18 A、9.68 mΩ/inch"
    - name: vsense_trace_width
      op: "=="
      value: 0.152
      unit: mm
      note: "6 mil 足够，且最好差分（SLAA902 §2.5）"
    - name: avdd_vdd_iovdd_trace_width
      op: range
      value: [0.508, 0.762]
      unit: mm
      note: "20-30 mil，从 PMIC/电源源头星形连接（SLAA902 §2）"
  verify:
    - method: drc
      tool: "KiCad 自定义规则 (.kicad_dru) + 网络类"
      check: "对 OUT*、BST*、VSNS* 等网络类设最小线宽与间距约束；DRC 报告中无违规"
      automatable: full
    - method: netlist_diff
      tool: "脚本：读网表与网络类分配"
      check: "所有连接 Class-D OUT/BST/VSNS 引脚的网络必须属于对应网络类，未分配即为失败"
      automatable: full
  sources:
    - title: "PCB Layout Guidelines for TAS2xxx Series Class-D Non-boosted Audio Amplifier (SLAA902)"
      url: "https://www.ti.com/lit/pdf/slaa902"
      publisher: "Texas Instruments"
      kind: app_note
      section: "§2, §2.5, §2.7, §3 Table 3"
    - title: "PCB Layout Guidelines for TAS2xxx Series Class-D Boosted Audio Amplifier (SLAA896)"
      url: "https://www.ti.com/lit/an/slaa896/slaa896.pdf"
      publisher: "Texas Instruments"
      kind: app_note
      section: "§2.6, §2.8"
  confidence: medium

- id: AUD-STK-001
  title: "含 Class-D 的音频板用 4-6 层，第二层整层做地"
  domain: audio
  stage: stackup
  severity: should
  rule: >-
    含 Class-D 或高性能 codec 的音频板优先 4-6 层，紧邻顶层的第二层整层做地、不走信号；两层板时底层几乎全做地，并把底层信号线缩到最短。
  rationale: >-
    紧邻器件的完整地层提供最短回流路径、减小环路电感，并为开关网络与其他信号之间提供屏蔽。
  applies_to: [class-d, codec, multilayer]
  parameters:
    - name: layer_count
      op: range
      value: [4, 6]
      unit: layers
      note: "TI SLAA902/SLAA896 的推荐；两层板为降级方案"
    - name: gnd_layer_index
      op: "=="
      value: 2
      unit: layer
      note: "紧邻顶层（SLAA920 §2.3：顶层下一层必须专用于地）"
  verify:
    - method: drc
      tool: "KiCad 叠层设置 + 脚本"
      check: "读取叠层定义，第二层类型为 plane/zone 且网络为 GND；Class-D 与 codec 器件投影区内第二层无非 GND 铜、无切割"
      automatable: partial
    - method: review
      tool: "叠层评审"
      check: "对照 Class-D 器件手册的叠层建议，核对层数、过孔类型（树脂塞孔）与板厂能力"
      automatable: manual
  sources:
    - title: "PCB Layout Guidelines for TAS2xxx Series Class-D Non-boosted Audio Amplifier (SLAA902)"
      url: "https://www.ti.com/lit/pdf/slaa902"
      publisher: "Texas Instruments"
      kind: app_note
      section: "§2"
    - title: "TAS2563 Schematic and Layout Guidelines (SLAA920)"
      url: "https://www.ti.com/lit/an/slaa920/slaa920.pdf"
      publisher: "Texas Instruments"
      kind: app_note
      section: "§2.3, §2.11"
    - title: "Circuit board layout guidelines for Class-D amplifiers"
      url: "https://www.edn.com/circuit-board-layout-guidelines-for-class-d-amplifiers/"
      publisher: "EDN"
      kind: blog
      section: "ground plane"
  confidence: high

- id: AUD-FLR-001
  title: "音频板分区：模拟输入、数字、Class-D 功率级各占一区"
  domain: audio
  stage: floorplan
  severity: should
  rule: >-
    把板分成模拟输入区（连接器、话筒、前级、codec 模拟侧）、数字区（MCU、I2S、I2C）和 Class-D 功率级加滤波器三个区；输入连接器紧邻前级，话筒及其走线远离天线、PA、电机、开关电源、扬声器和功率级滤波电感。
  rationale: >-
    数字回流和开关电流只会在布线越界时才闯入模拟区；功率级滤波电感的磁场、开关节点的电场都会耦合进输入级和话筒这类小信号。
  applies_to: [codec, class-d, microphone, mixed-signal]
  parameters:
    - name: analog_input_to_class_d_inductor_distance
      op: maximize
      value: null
      note: "无出处数值；SLYT199 只要求输入与输出（尤其是电感）分离以减小磁耦合，EDN 要求低压输入电路远离输出侧功率电路。用基线距离对比"
  verify:
    - method: review
      tool: "布局规划评审清单"
      check: "检查三个区的划分、连接器位置、话筒与噪声源（天线、电机、DC-DC、扬声器）的距离，以及声孔是否可用"
      automatable: manual
    - method: geometry_script
      tool: "pcbnew (KiCad bundled Python)，参见 ee-pcb-verify 的 geometry 检查器"
      check: "计算模拟输入/话筒器件到 Class-D 滤波电感、开关节点的最短距离并输出报告，用于版本间回归比较"
      automatable: partial
  sources:
    - title: "Power supply decoupling and audio signal filtering for the Class-D audio power amplifier (SLYT199)"
      url: "https://www.ti.com/lit/pdf/slyt199"
      publisher: "Texas Instruments"
      kind: app_note
      section: "Inputs and outputs"
    - title: "SiSonic Design Guide, AN16 Rev 3.0"
      url: "https://media.digikey.com/pdf/data%20sheets/knowles%20acoustics%20pdfs/sisonic_design_guide.pdf"
      publisher: "Knowles"
      kind: app_note
      section: "§3.1"
    - title: "AN-CS002 CODEC Printed Circuit Board Layout Considerations"
      url: "https://www.digikey.com/Site/Global/Layouts/DownloadPdf.ashx?pdfUrl=09748F6FB2B14376BFA057A887CFD3EF"
      publisher: "Nuvoton"
      kind: app_note
      section: "items B, E"
    - title: "Partitioning and Layout of a Mixed-Signal PCB"
      url: "https://www.eetimes.com/partitioning-and-layout-of-a-mixed-signal-pcb-3/"
      publisher: "EE Times (Henry Ott)"
      kind: paper
  confidence: high

- id: AUD-FLR-002
  title: "定 AGND/DGND 策略：默认单一地平面分区，按 codec 手册例外"
  domain: audio
  stage: floorplan
  severity: should
  rule: >-
    默认用整块连续地平面并按模拟/数字/功率分区布线，codec 的 AGND、DGND 引脚都接到该平面；仅当 codec 手册明确要求拆地时才拆，且只在一处用 0 Ω 或窄桥连接，所有跨区信号从桥上经过。
  rationale: >-
    回流电流沿信号线正下方的参考平面走，拆地后信号线跨缝会增大环路并带来辐射与串扰；数字电流混入模拟地的真正原因通常是布线越界，而不是平面本身。
  applies_to: [codec, adc, dac, mixed-signal]
  parameters:
    - name: split_plane_bridge_count
      op: "=="
      value: 1
      unit: count
      note: "仅在手册要求拆地时适用，桥位于 codec 下方，桥宽按 Ott 建议与器件同宽"
  verify:
    - method: review
      tool: "对照 codec 数据手册 Layout 章节"
      check: "记录手册的 AGND/DGND 要求（单平面 / 拆地 + 单点），并在设计文档里写明采用哪种及理由"
      automatable: manual
    - method: geometry_script
      tool: "pcbnew (KiCad bundled Python)"
      check: "若有拆地：统计穿越分割缝的信号走线数，除桥上以外必须为 0；若单平面：检查模拟区内无数字走线"
      automatable: full
    - method: bench
      tool: "音频分析仪"
      check: "Ott 的 A/B 做法：拆地版与每隔约 1/2 英寸用 0 Ω 跳线桥接的版本对比本底噪声与 EMC 预扫，择优"
      automatable: manual
  sources:
    - title: "Partitioning and Layout of a Mixed-Signal PCB"
      url: "https://www.eetimes.com/partitioning-and-layout-of-a-mixed-signal-pcb-3/"
      publisher: "EE Times (Henry Ott)"
      kind: paper
    - title: "Common Noise Issues in Audio Codecs (SLAA749)"
      url: "https://www.ti.com/lit/an/slaa749/slaa749.pdf"
      publisher: "Texas Instruments"
      kind: app_note
      section: "§2.1"
    - title: "AN-CS002 CODEC Printed Circuit Board Layout Considerations"
      url: "https://www.digikey.com/Site/Global/Layouts/DownloadPdf.ashx?pdfUrl=09748F6FB2B14376BFA057A887CFD3EF"
      publisher: "Nuvoton"
      kind: app_note
      section: "item H"
    - title: "MT-031 Grounding Data Converters and Solving the Mystery of AGND and DGND"
      url: "https://www.analog.com/mt-031?doc=cn288.pdf"
      publisher: "Analog Devices"
      kind: app_note
  conflicts: >-
    TI SLAA749 对 codec 建议拆成模拟、数字两块地并用 0 Ω 电阻或窄线连接，且模拟引脚/走线只放在模拟侧；Henry Ott、Nuvoton AN-CS002 和 ADI MT-031 主张单一连续地平面
    （ADI 要求把转换器的 AGND/DGND 都接模拟地），TI 的 Class-D 文档 SLYT199 也认为整块地平面效果不差于其他方案。取舍：
    默认单平面 + 严格分区布线；codec 手册明确要求拆地时服从手册并保证单点桥接；两种做法的共同要求是信号线不得跨越分割缝。
  confidence: high

- id: AUD-FLR-003
  title: "平衡接口屏蔽接机壳，信号地与机壳单点连接"
  domain: audio
  stage: floorplan
  severity: should
  rule: >-
    平衡音频连接器的屏蔽层（XLR pin 1）在进入外壳处接机壳而不是信号地，信号地与机壳每台设备只在一处相连，使屏蔽电流不流经音频地；板载插座只能接信号地时，用短线接到最近的机壳点。
  rationale: >-
    屏蔽上感应的电流会调制其端接点的地电位，而音频信号以该地为参考，于是变成嗡声和 buzz（所谓 pin 1 问题）。
  applies_to: [balanced-input, xlr, pro-audio, chassis-ground]
  parameters:
    - name: signal_ground_to_chassis_connections
      op: "=="
      value: 1
      unit: count
      note: "Rane note 151：每台设备一点"
  verify:
    - method: review
      tool: "连接器/机壳连接评审"
      check: "检查每个平衡连接器屏蔽的去向，信号地—机壳连接点数量，并避免使用地线断开(ground lift)开关"
      automatable: manual
    - method: bench
      tool: "音频分析仪 FFT"
      check: "与另一台设备互联后查 50/60 Hz 及其谐波；分别断开某条地连接来定位环路"
      automatable: manual
  sources:
    - title: "RaneNote 151: Grounding and Shielding Audio Devices"
      url: "https://www.ranecommercial.com/legacy/note151.html"
      publisher: "Rane"
      kind: vendor_guide
    - title: "RaneNote 110: Sound System Interconnection"
      url: "https://www.ranecommercial.com/legacy/note110.html"
      publisher: "Rane"
      kind: vendor_guide
  confidence: medium

- id: AUD-PLC-001
  title: "Class-D 去耦与自举电容紧贴引脚并控制回路电感"
  domain: audio
  stage: placement
  severity: must
  rule: >-
    最小的去耦电容放在引脚 1 mm 以内、顶层同层，较大者紧随其后；去耦电容地端用多个过孔就近接地层；自举电容以星形接到 OUT 引脚而不是挂在粗的输出走线上，并按数据手册给的回路电感预算复核。
  rationale: >-
    开关电流在寄生电感上产生的电压尖峰直接变成 EMI 和性能劣化，哪怕几个 nH 也足以让器件工作异常。
  applies_to: [class-d, qfn, tas2xxx, pvdd]
  parameters:
    - name: smallest_decap_to_pin_distance
      op: "<="
      value: 1
      unit: mm
      note: "SLAA902/SLAA896 §2.3；EDN 给出 100 nF 在 2 mm 以内"
    - name: bulk_cap_distance
      op: "<="
      value: 30
      unit: mm
      note: "EDN：大电容离功放不超过 30 mm，并以星形连接"
    - name: pvdd_pgnd_loop_inductance_total
      op: "<="
      value: 900
      unit: pH
      note: "TAS2770 (SLAA902 表 2) 的包含电容 ESL 的总回路预算；PVDD-PGND 900 pH（即本参数）、VDD-GND 900 pH，另有 BST-OUT 1400 pH、VBAT-GND 1000 pH、DREG-GND 1050 pH。TAS2562 (SLAA896)：VBST-BGND 750 pH，GREG-PVDD 800 pH。只对所列型号有效"
    - name: vbat_pin_to_decap_inductance
      op: "<"
      value: 500
      unit: pH
      note: "TAS2563 (SLAA920)：VBAT 引脚到去耦电容的寄生电感"
  verify:
    - method: geometry_script
      tool: "pcbnew (KiCad bundled Python)，参见 ee-pcb-verify 的 geometry 检查器"
      check: "对每个 Class-D 电源/自举引脚找最近的去耦/自举电容焊盘，测焊盘中心距并确认同层；最小电容 ≤1 mm（具体型号以手册为准）"
      automatable: full
    - method: em_sim
      tool: "FastHenry / openEMS / Elmer 做回路电感提取"
      check: "沿 引脚 → 电容 → 过孔 → GND 引脚 的环路提取电感，总值不超过器件手册的预算"
      automatable: partial
  sources:
    - title: "PCB Layout Guidelines for TAS2xxx Series Class-D Non-boosted Audio Amplifier (SLAA902)"
      url: "https://www.ti.com/lit/pdf/slaa902"
      publisher: "Texas Instruments"
      kind: app_note
      section: "§2.3, Table 2, §2.6"
    - title: "PCB Layout Guidelines for TAS2xxx Series Class-D Boosted Audio Amplifier (SLAA896)"
      url: "https://www.ti.com/lit/an/slaa896/slaa896.pdf"
      publisher: "Texas Instruments"
      kind: app_note
      section: "§2.3, Table 2"
    - title: "TAS2563 Schematic and Layout Guidelines (SLAA920)"
      url: "https://www.ti.com/lit/an/slaa920/slaa920.pdf"
      publisher: "Texas Instruments"
      kind: app_note
      section: "§2.2, §2.4"
    - title: "Circuit board layout guidelines for Class-D amplifiers"
      url: "https://www.edn.com/circuit-board-layout-guidelines-for-class-d-amplifiers/"
      publisher: "EDN"
      kind: blog
      section: "placement order, bypass"
  confidence: high

- id: AUD-PLC-002
  title: "Codec 去耦与 VREF/VAG 参考电容紧贴引脚"
  domain: audio
  stage: placement
  severity: should
  rule: >-
    Codec 每个供电引脚的 0.1 µF（及 10 µF）去耦与 VREF/VAG/CM 参考电容用最短走线接引脚、与 IC 同层；双面板上可直接放在芯片下方引脚之间，电容地端就近过孔接模拟地。
  rationale: >-
    VAG/VREF 是 codec 内部所有模拟处理的参考，其上的噪声会原样进入转换结果；走线的电感和电阻会让去耦失效。
  applies_to: [codec, adc, dac, vref]
  parameters:
    - name: decap_to_pin_trace_length
      op: minimize
      value: null
      note: "无 codec 级别的数值出处；Class-D 手册给的 ≤1 mm 可作为基线"
    - name: codec_decoupling_values
      op: qualitative
      value: null
      note: "0.1 µF + 10 µF（SLAA749）；VDD、VAG、VREF 到 VSS 的 0.1 µF 陶瓷（AN-CS002）"
  verify:
    - method: geometry_script
      tool: "pcbnew (KiCad bundled Python)"
      check: "对每个 AVDD/VREF/VAG 引脚找去耦电容焊盘，报告焊盘间距、是否同层、过孔到地层的数量，并与基线比较"
      automatable: partial
    - method: review
      tool: "布局评审"
      check: "对照 codec 手册布局示例核对电容位置"
      automatable: manual
  sources:
    - title: "Common Noise Issues in Audio Codecs (SLAA749)"
      url: "https://www.ti.com/lit/an/slaa749/slaa749.pdf"
      publisher: "Texas Instruments"
      kind: app_note
      section: "§2.3"
    - title: "AN-CS002 CODEC Printed Circuit Board Layout Considerations"
      url: "https://www.digikey.com/Site/Global/Layouts/DownloadPdf.ashx?pdfUrl=09748F6FB2B14376BFA057A887CFD3EF"
      publisher: "Nuvoton"
      kind: app_note
      section: "items A, F"
  confidence: high

- id: AUD-PLC-003
  title: "输出滤波器紧靠功放，电感相互隔开并远离输入"
  domain: audio
  stage: placement
  severity: should
  rule: >-
    铁氧体/LC 滤波器与 EMC 缓冲电路放在紧靠输出引脚处，使“输出 → 磁珠/电感 → 电容 → GND”的电流环最小；非屏蔽电感彼此相距 ≥7.5 mm（尤其是通道之间），输出滤波器靠近扬声器接口并远离输入电路。
  rationale: >-
    输出电流环的大小决定它作为天线的效率；电感的磁场耦合进相邻通道和输入级会引入串扰与失真。
  applies_to: [class-d, lc-filter, ferrite-filter]
  parameters:
    - name: unshielded_inductor_spacing
      op: ">="
      value: 7.5
      unit: mm
      note: "EDN；屏蔽电感可更近，但 SLYT199 建议用屏蔽电感以减小串扰"
    - name: filter_loop_area
      op: minimize
      value: null
      note: "TPA3116D2 §10.1：输出经磁珠和滤波电容回 GND 的电流环要小而紧"
  verify:
    - method: geometry_script
      tool: "pcbnew (KiCad bundled Python)"
      check: "测每路 OUT 引脚到滤波器第一个元件的路径长度，计算 OUT-L-C-GND 环路面积；非屏蔽电感中心距 ≥7.5 mm；滤波器到扬声器连接器距离"
      automatable: partial
    - method: emc_precompliance
      tool: "近场探头"
      check: "沿输出环路和电感上方扫描，对比改动前后的近场峰值"
      automatable: manual
  sources:
    - title: "TPA3116D2 / TPA3118D2 / TPA3130D2 datasheet (SLOS708G)"
      url: "https://www.ti.com/lit/ds/symlink/tpa3116d2.pdf"
      publisher: "Texas Instruments"
      kind: datasheet
      section: "§10.1"
    - title: "PCB Layout Guidelines for TAS2xxx Series Class-D Non-boosted Audio Amplifier (SLAA902)"
      url: "https://www.ti.com/lit/pdf/slaa902"
      publisher: "Texas Instruments"
      kind: app_note
      section: "§2.7"
    - title: "Circuit board layout guidelines for Class-D amplifiers"
      url: "https://www.edn.com/circuit-board-layout-guidelines-for-class-d-amplifiers/"
      publisher: "EDN"
      kind: blog
      section: "output filters"
    - title: "TPA3140D2 Design Considerations for EMC (SLOA216)"
      url: "https://www.ti.com/lit/an/sloa216/sloa216.pdf"
      publisher: "Texas Instruments"
      kind: app_note
      section: "§3.1"
  confidence: high

- id: AUD-RTE-001
  title: "Class-D 输出走线宽、短、成对并等长"
  domain: audio
  stage: routing
  severity: should
  rule: >-
    OUT+ 与 OUT- 各用 ≥30 mil 线宽、两层并联（每路等效 60 mil），尽量短；两路并行、间距最小以缩小环路面积，长度/电阻互相匹配，不同声道的输出线不要并排。
  rationale: >-
    输出线和扬声器线是最大的发射源；两路布线电阻不一致会让 THD+N 劣化，宽线还要承载峰值电流且不引入失真。
  applies_to: [class-d, btl, speaker-output]
  parameters:
    - name: output_trace_width_per_layer
      op: ">="
      value: 0.762
      unit: mm
      note: "30 mil，两层并联（SLAA902/SLAA896）；1 oz、62 mil FR4 下 30 mil 约 9.68 mΩ/inch、可载约 3.18 A"
    - name: output_pair_length_mismatch
      op: minimize
      value: null
      note: "SLAA902：为获得最佳 THD+N，两路输出长度匹配；无数值出处"
    - name: low_power_output_trace_current
      op: ">="
      value: 0.7
      unit: A
      note: "SLYT199（TPA005D14，约 2 W 器件）：至少 0.7 A rms、峰值 1 A；仅作低功率器件参考"
  verify:
    - method: drc
      tool: "KiCad DRC（网络类最小线宽）"
      check: "输出网络线宽 ≥0.762 mm，并检查是否在两层均有走线"
      automatable: full
    - method: geometry_script
      tool: "pcbnew (KiCad bundled Python)"
      check: "测 OUT_P、OUT_N 到滤波器之间走线长度差，并测两线并行段的平均间距；报告超出基线的项"
      automatable: full
  sources:
    - title: "PCB Layout Guidelines for TAS2xxx Series Class-D Non-boosted Audio Amplifier (SLAA902)"
      url: "https://www.ti.com/lit/pdf/slaa902"
      publisher: "Texas Instruments"
      kind: app_note
      section: "§2.7, §3 Table 3"
    - title: "Circuit board layout guidelines for Class-D amplifiers"
      url: "https://www.edn.com/circuit-board-layout-guidelines-for-class-d-amplifiers/"
      publisher: "EDN"
      kind: blog
      section: "output filters"
    - title: "TPA3140D2 Design Considerations for EMC (SLOA216)"
      url: "https://www.ti.com/lit/an/sloa216/sloa216.pdf"
      publisher: "Texas Instruments"
      kind: app_note
      section: "§3.1"
  confidence: high

- id: AUD-RTE-002
  title: "开关网络与其他信号在相邻层不平行重叠"
  domain: audio
  stage: routing
  severity: must
  rule: >-
    Class-D 输出、自举、Vsense（及升压 SW）这类持续开关的网络，在相邻层不得与其他信号线平行重叠，除非中间隔有完整地层；同层也要和其他信号保持距离。
  rationale: >-
    开关边沿通过层间电容耦合到相邻层信号，进入模拟或数字通路成为噪声；中间的地层把耦合截断。
  applies_to: [class-d, switching-node, multilayer]
  parameters:
    - name: adjacent_layer_parallel_overlap_without_ground
      op: "=="
      value: 0
      unit: mm
      note: "SLAA902 §2.4 的图 4-6；允许的情形：交叉很短，或中间有地层"
  verify:
    - method: geometry_script
      tool: "pcbnew (KiCad bundled Python)"
      check: "对开关网络类的每段铜，在相邻层查找非 GND 网络的铜段，计算平行重叠长度；中间无完整地层时必须为 0"
      automatable: full
  sources:
    - title: "PCB Layout Guidelines for TAS2xxx Series Class-D Non-boosted Audio Amplifier (SLAA902)"
      url: "https://www.ti.com/lit/pdf/slaa902"
      publisher: "Texas Instruments"
      kind: app_note
      section: "§2.4, Figures 4-6"
    - title: "PCB Layout Guidelines for TAS2xxx Series Class-D Boosted Audio Amplifier (SLAA896)"
      url: "https://www.ti.com/lit/an/slaa896/slaa896.pdf"
      publisher: "Texas Instruments"
      kind: app_note
      section: "§2.4"
  confidence: high

- id: AUD-RTE-003
  title: "音频输入走线短、过完整地、远离开关与 RF"
  domain: audio
  stage: routing
  severity: should
  rule: >-
    耦合电容到放大器输入的走线尽量短；音频走线在完整地平面上方，和时钟、射频、动态大电流走线保持距离，内层音频线两侧用带足够过孔的地线隔离；不让含 RF 或动态电流的走线从音频元件下方穿过，也不与其平行。
  rationale: >-
    小信号输入走线是接收天线，会拾取 RF、时钟谐波和开关噪声；地线 + 过孔围栏充当法拉第屏蔽。
  applies_to: [audio-input, microphone, codec-input]
  parameters:
    - name: input_trace_length
      op: minimize
      value: null
      note: "无统一数值出处，SLYT199 要求从耦合电容到放大器输入尽量短"
    - name: parallel_run_with_noisy_nets
      op: minimize
      value: null
      note: "SNAA033D：避免与含 RF 或大动态电流的走线平行，间距尽量大"
  verify:
    - method: geometry_script
      tool: "pcbnew (KiCad bundled Python)"
      check: "对音频输入网络类，测与时钟/开关/射频网络类的最小间距与平行段长度；检查线下方参考层为完整 GND"
      automatable: partial
    - method: bench
      tool: "音频分析仪 FFT + 近场探头"
      check: "空载输入本底，查时钟、开关频率谐波和无线突发频率在音频带内的混叠产物"
      automatable: manual
  sources:
    - title: "Power supply decoupling and audio signal filtering for the Class-D audio power amplifier (SLYT199)"
      url: "https://www.ti.com/lit/pdf/slyt199"
      publisher: "Texas Instruments"
      kind: app_note
      section: "Inputs and outputs"
    - title: "AN-1496 Noise, TDMA Noise, and Suppression Techniques (SNAA033D)"
      url: "https://www.ti.com/lit/an/snaa033d/snaa033d.pdf"
      publisher: "Texas Instruments"
      kind: app_note
    - title: "AN-CS002 CODEC Printed Circuit Board Layout Considerations"
      url: "https://www.digikey.com/Site/Global/Layouts/DownloadPdf.ashx?pdfUrl=09748F6FB2B14376BFA057A887CFD3EF"
      publisher: "Nuvoton"
      kind: app_note
      section: "items B, C, D"
    - title: "SiSonic Design Guide, AN16 Rev 3.0"
      url: "https://media.digikey.com/pdf/data%20sheets/knowles%20acoustics%20pdfs/sisonic_design_guide.pdf"
      publisher: "Knowles"
      kind: app_note
      section: "§4.6"
  confidence: high

- id: AUD-RTE-004
  title: "差分音频信号成对对称走线，并铺在模拟地之上"
  domain: audio
  stage: routing
  severity: should
  rule: >-
    差分话筒/线路输入的两根线并行等长、对称布局，两路滤波与耦合元件对称，间距约一倍线宽并走在模拟地平面之上；单端源接差分输入时，未用输入端经与信号端同值的电容在信号源处交流接地，使两个输入端看到的阻抗相同。
  rationale: >-
    差分接收只有在两根线拾取的噪声相同、阻抗相同时才抵消共模；不对称会把共模转成差模。
  applies_to: [differential-input, microphone, line-input]
  parameters:
    - name: pair_spacing
      op: "=="
      value: 1
      unit: trace_width
      note: "Knowles 图 28：差分走线相距一个线宽，并在模拟地平面上方（仅为该话筒应用图的标注）"
  verify:
    - method: geometry_script
      tool: "pcbnew (KiCad bundled Python)"
      check: "测差分对两线的长度差、平均间距，以及两路上滤波元件的位置对称性；参考层完整性"
      automatable: partial
    - method: bench
      tool: "信号发生器 + 音频分析仪"
      check: "共模注入测实际 CMRR，对比对称布局与不对称版本"
      automatable: manual
  sources:
    - title: "SiSonic Design Guide, AN16 Rev 3.0"
      url: "https://media.digikey.com/pdf/data%20sheets/knowles%20acoustics%20pdfs/sisonic_design_guide.pdf"
      publisher: "Knowles"
