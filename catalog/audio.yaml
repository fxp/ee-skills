- id: AUD-RTE-005
  title: "I2S/MCLK 时钟点对点、短、远离模拟引脚"
  domain: audio
  stage: routing
  severity: should
  rule: >-
    MCLK/BCLK/LRCK 从源到 codec 点对点走最短、下方为完整地，远离模拟输入、参考和 MICBIAS 走线，不留 stub；边沿快或线较长时在驱动端串小电阻阻尼反射。
  rationale: >-
    时钟翻转是 codec 内数字噪声耦合到模拟侧的主要根源；数字线本身也要当传输线对待，否则变成辐射源并污染电源与地。
  applies_to: [i2s, mclk, codec]
  parameters:
    - name: series_damping_resistor
      op: qualitative
      value: null
      note: "无厂商出处的数值；常见经验是几十欧，应以示波器或 SI 仿真在实际走线上确定，很短的线可省略"
    - name: clock_trace_length
      op: minimize
      value: null
      note: "越短越好；MCLK 为 24.576 MHz 级时边沿很快，需考虑反射"
  verify:
    - method: si_sim
      tool: "传输线/IBIS 仿真"
      check: "对 MCLK、BCLK 的驱动器 + 走线 + 接收器仿真，过冲/振铃在接收器输入范围内，边沿不过快"
      automatable: partial
    - method: geometry_script
      tool: "pcbnew (KiCad bundled Python)"
      check: "测时钟网络长度、与模拟网络类的最小间距和平行长度，检查其下方参考层无分割"
      automatable: partial
    - method: bench
      tool: "示波器 + 音频分析仪"
      check: "测 MCLK 过冲/振铃，并比较时钟走线改动前后的 codec 本底噪声"
      automatable: manual
  sources:
    - title: "Common Noise Issues in Audio Codecs (SLAA749)"
      url: "https://www.ti.com/lit/an/slaa749/slaa749.pdf"
      publisher: "Texas Instruments"
      kind: app_note
      section: "§2.1"
    - title: "AN-CS002 CODEC Printed Circuit Board Layout Considerations"
      url: "https://www.digikey.com/Site/Global/Layouts/DownloadPdf.ashx?pdfUrl=09748F6FB2B14376BFA057A887CFD3EF"
      publisher: "Nuvoton"
      kind: app_note
      section: "item D"
  confidence: medium

- id: AUD-PLN-001
  title: "器件下方保持完整地层，地引脚强连接，大电流回流不经输入地"
  domain: audio
  stage: plane_pour
  severity: should
  rule: >-
    Codec 与 Class-D 下方保持完整无割裂的地层（紧邻顶层）；所有地引脚（GND/PGND/AGND）在器件下方先短接再用多个过孔接地层，避免多重地环；每个电路的去耦、滤波电容接该电路最近的地引脚，输出滤波电容等大电流回流不得流经输入级的地连接。
  rationale: >-
    不同电源的回流路径由不同地引脚承担，任何一个地引脚连得弱都会在该电路里抬高地电位；大电流回流经过输入级的地连接，会把输出电流直接注入输入。
  applies_to: [class-d, codec, ground-plane]
  parameters:
    - name: ground_pin_parasitic_inductance
      op: "<="
      value: 150
      unit: pH
      note: "TAS2563 (SLAA920 §2.11) 对 BGND/GND/PGND 的建议，仅对该器件系列有效；TAS2xxx 其他型号以各自手册为准"
  verify:
    - method: geometry_script
      tool: "pcbnew (KiCad bundled Python)"
      check: "对每个 GND/PGND 引脚统计到地层的过孔数及距离；检查输出滤波电容地端连接到 PGND 而不经 AGND/输入地"
      automatable: partial
    - method: em_sim
      tool: "openEMS / Elmer / FastHenry"
      check: "提取 PGND → 滤波电容地 → PGND 回流路径，确认不穿越输入地网络；地引脚寄生电感不超过手册预算"
      automatable: partial
  sources:
    - title: "PCB Layout Guidelines for TAS2xxx Series Class-D Non-boosted Audio Amplifier (SLAA902)"
      url: "https://www.ti.com/lit/pdf/slaa902"
      publisher: "Texas Instruments"
      kind: app_note
      section: "§2.2"
    - title: "TAS2563 Schematic and Layout Guidelines (SLAA920)"
      url: "https://www.ti.com/lit/an/slaa920/slaa920.pdf"
      publisher: "Texas Instruments"
      kind: app_note
      section: "§2.11"
    - title: "Power supply decoupling and audio signal filtering for the Class-D audio power amplifier (SLYT199)"
      url: "https://www.ti.com/lit/pdf/slyt199"
      publisher: "Texas Instruments"
      kind: app_note
      section: "Ground plane"
    - title: "Circuit board layout guidelines for Class-D amplifiers"
      url: "https://www.edn.com/circuit-board-layout-guidelines-for-class-d-amplifiers/"
      publisher: "EDN"
      kind: blog
      section: "ground plane and vias"
  confidence: high

- id: AUD-PLN-002
  title: "信号线不得跨越或切割地平面"
  domain: audio
  stage: plane_pour
  severity: should
  rule: >-
    任何信号线都不得跨越地平面的分割缝，也不得在同层把地铜割断；若必须拆地，所有跨区信号都走在单点桥上，保证回流在其正下方，数字回流留在数字区。
  rationale: >-
    高频回流沿信号线正下方的参考平面走，跨缝使环路变大，辐射与串扰剧增；切割地平面使模拟区的地回流被迫绕行。
  applies_to: [mixed-signal, codec, ground-plane]
  parameters:
    - name: signals_crossing_ground_split
      op: "=="
      value: 0
      unit: count
      note: "桥上通过的信号除外"
  verify:
    - method: geometry_script
      tool: "pcbnew (KiCad bundled Python)"
      check: "提取 GND 铜区轮廓，找出缝隙和被走线切割的位置，数每条信号线与缝隙/切割的相交次数；桥以外必须为 0"
      automatable: full
  sources:
    - title: "Partitioning and Layout of a Mixed-Signal PCB"
      url: "https://www.eetimes.com/partitioning-and-layout-of-a-mixed-signal-pcb-3/"
      publisher: "EE Times (Henry Ott)"
      kind: paper
    - title: "AN-1496 Noise, TDMA Noise, and Suppression Techniques (SNAA033D)"
      url: "https://www.ti.com/lit/an/snaa033d/snaa033d.pdf"
      publisher: "Texas Instruments"
      kind: app_note
  confidence: high

- id: AUD-MFG-001
  title: "MEMS 话筒工艺：声孔不镀铜、钢网破环、回流后禁水洗"
  domain: audio
  stage: manufacturing
  severity: should
  rule: >-
    底部声孔话筒的 PCB 声孔做成非金属化孔，焊盘钢网用破环图形，防止焊料/助焊剂进孔；钢网厚度 0.127-0.178 mm，回流不超过 3 次，回流后禁止水洗、超声清洗和刷板，也不得对声孔抽真空或插入物体。
  rationale: >-
    声孔被焊料或助焊剂堵塞会让频响和灵敏度失常；清洗剂、超声和真空会直接损坏 MEMS 膜片。
  applies_to: [mems-microphone, smt-assembly]
  parameters:
    - name: stencil_thickness
      op: range
      value: [0.127, 0.178]
      unit: mm
      note: "Knowles 推荐范围"
    - name: reflow_passes
      op: "<="
      value: 3
      unit: count
      note: "Knowles：保证 3 次，建议不超过 3 次"
  verify:
    - method: review
      tool: "制造说明（fab notes / 贴片工艺卡）"
      check: "在装配备注中写明：声孔 NPTH、禁水洗、禁超声、禁刷板、禁抽真空于声孔，以及回流次数限制"
      automatable: manual
    - method: geometry_script
      tool: "pcbnew (KiCad bundled Python)"
      check: "检查话筒焊盘钢网图形是否为破环（对底部声孔型），声孔为 NPTH"
      automatable: partial
  sources:
    - title: "SiSonic Design Guide, AN16 Rev 3.0"
      url: "https://media.digikey.com/pdf/data%20sheets/knowles%20acoustics%20pdfs/sisonic_design_guide.pdf"
      publisher: "Knowles"
      kind: app_note
      section: "§3.5, §5.1, §5.3"
  confidence: high

- id: AUD-VER-001
  title: "按规范测 THD+N/SNR，并用 FFT 交叉验证"
  domain: audio
  stage: verification
  severity: should
  rule: >-
    报告 THD+N 时带上频率、电平、增益、负载和测量带宽（默认 20 kHz 平坦、不加权）；Class-D 或 Σ-Δ 输出在分析仪前加 20 kHz 带宽限制（AES17 滤波器）或无源低通；用陷波法和 FFT 后处理两种方法互相核对。
  rationale: >-
    PWM 与噪声整形的带外成分会使分析仪输入过载或让带宽限制滤波器放在链路太靠后，测出错误的 THD+N；FFT 能分解谐波、噪声整形、嗡声和互调。
  applies_to: [class-d, codec, amplifier]
  parameters:
    - name: measurement_bandwidth
      op: range
      value: [20, 22]
      unit: kHz
      note: "Rane 145；开关放大器见 SLAA114"
    - name: fft_length
      op: "=="
      value: 16384
      unit: samples
      note: "SLAA114 示例：fs = 44.1 kHz、Blackman-Harris 窗，bin 宽 2.69165 Hz，20 Hz-20 kHz 对应 bin 7-7430"
    - name: blackman_harris_window_correction
      op: "=="
      value: 0.7610
      unit: ratio
      note: "V_rms,noise = K·sqrt(sum(V_bin²))，窗修正 K（Hanning 0.8165，Hamming 0.8566，Bartlett 0.8660，无窗 1.0）"
  verify:
    - method: bench
      tool: "音频分析仪（AP 等，带 AES17 滤波器）或高质量声卡 + 差分输入"
      check: "按指标中的条件测 THD+N；同时抓 FFT 并按上式后处理得 20 Hz-20 kHz 噪声和 2-7 次谐波，两者误差应在仪器不确定度内"
      automatable: partial
  sources:
    - title: "Digital Audio Measurements (SLAA114)"
      url: "https://www.ti.com/lit/pdf/slaa114"
      publisher: "Texas Instruments"
      kind: app_note
      section: "How to Perform Measurements on a TDAA; FFT post-processing"
    - title: "RaneNote 145: Audio Specifications"
      url: "https://www.ranecommercial.com/legacy/note145.html"
      publisher: "Rane"
      kind: vendor_guide
    - title: "AES17 Standard method for digital audio engineering: Measurement of digital audio equipment"
      ref: "AES17 §4.2.1.1（经 TI SLAA114 引用）"
      publisher: "Audio Engineering Society"
      kind: standard
  confidence: high

- id: AUD-VER-002
  title: "Class-D 扬声器输出必须差分测量，输出端不接地"
  domain: audio
  stage: verification
  severity: must
  rule: >-
    BTL Class-D 的两个输出端对地都有以 PVCC/2 为中心的共模电压，测量用差分探头或平衡输入，且测量设备的共模抑制能力要高于输出级供电的一半；负端（黑端）绝不能接地或机壳；负载使用 4-8 Ω 假负载。
  rationale: >-
    把一个输出端接地等于短路桥臂，会损坏功放或仪器；非差分测量还会得到错误的失真与功率数值。
  applies_to: [class-d, btl, test-fixture]
  parameters:
    - name: measurement_cmrr_vs_supply
      op: qualitative
      value: null
      note: "SLAA114：测量设备共模抑制需大于输出级供电电压的一半"
  verify:
    - method: review
      tool: "测试夹具与流程检查表"
      check: "确认使用平衡输入或差分探头、假负载，黑端未接地/机壳，分析仪输入为浮地或平衡"
      automatable: manual
  sources:
    - title: "Digital Audio Measurements (SLAA114)"
      url: "https://www.ti.com/lit/pdf/slaa114"
      publisher: "Texas Instruments"
      kind: app_note
      section: "How should the balanced speaker output be handled?"
  confidence: high

- id: AUD-VER-003
  title: "用 ngspice 仿真耦合、偏置网络和滤波器的 AC 与噪声"
  domain: audio
  stage: verification
  severity: should
  rule: >-
    对每个模拟音频块（耦合高通、话筒偏置网络、前级、Class-D LC 滤波器）跑 .ac 与 .noise：核对转折频率、偏置分压低通小于 20 Hz、20 Hz-20 kHz 积分的输入参考噪声，以及 LC 滤波器在负载阻抗范围内的 Q 和峰化。
  rationale: >-
    这些网络的角频率和噪声由少数几个 R、C 决定，设计阶段仿真比等样板更快发现多数错误。
  applies_to: [preamp, ac-coupling, microphone, lc-filter]
  parameters:
    - name: bias_network_lowpass_corner
      op: "<"
      value: 20
      unit: Hz
      note: "TIDU765"
    - name: noise_integration_band
      op: range
      value: [20, 20000]
      unit: Hz
      note: "与 ARC-003 的测量带宽一致"
  verify:
    - method: spice
      tool: "ngspice：.ac dec 20 1 1Meg；.noise v(out) Vin dec 20 10 100k"
      check: "读 -3 dB 点、峰值、inoise_total/onoise_total（noise2 图），与设计值和噪声预算对比；.noise 的参考源需带 AC 幅度"
      automatable: partial
  sources:
    - title: "Ngspice User's Manual (.NOISE analysis)"
      url: "https://ngspice.sourceforge.io/docs/ngspice-html-manual/manual.xhtml"
      publisher: "ngspice"
      kind: tool_doc
    - title: "Single-Supply, Electret Microphone Pre-Amplifier Reference Design (TIDU765)"
      url: "https://www.ti.com/lit/pdf/tidu765"
      publisher: "Texas Instruments"
      kind: app_note
      section: "§4"
    - title: "Determine Optimal Isolation Resistance for Driving Capacitive Load (SBOA418)"
      url: "https://www.ti.com/lit/pdf/sboa418"
      publisher: "Texas Instruments"
      kind: app_note
      section: "§2"
  confidence: medium

- id: AUD-VER-004
  title: "向电源注入纹波测 PSRR 和电源耦合"
  domain: audio
  stage: verification
  severity: should
  rule: >-
    输入交流接地，在 PVCC/AVDD 上叠加 200 mVpp 纹波，分别取 217 Hz、1 kHz、开关频率等频点，用 FFT 读输出该频点幅度并换算 PSRR，和数据手册对比。
  rationale: >-
    电源纹波与负载电流脉冲会耦合进输出（GSM 的 217 Hz 就是电源和地纹波耦合的典型例子），不在板上实测就不知道布局与去耦是否达标。
  applies_to: [class-d, codec, mems-microphone, ldo]
  parameters:
    - name: injected_ripple
      op: "=="
      value: 200
      unit: mVpp
      note: "TPA3116D2 数据手册 PSRR 测试条件（1 kHz，增益 20 dB，输入交流接地）"
    - name: ripple_rejection_target
      op: "<="
      value: -70
      unit: dB
      note: "TPA3116D2 典型值；按所选器件手册替换"
  verify:
    - method: bench
      tool: "信号发生器 + 电源叠加（耦合变压器或 Bias-T）+ 音频分析仪 FFT"
      check: "输入端短接/交流接地，在电源叠加纹波，读输出该频点幅度，PSRR = 20·log(V_out/V_ripple)（折算增益）；达到手册指标"
      automatable: partial
    - method: spice
      tool: "ngspice：.ac"
      check: "对电源滤波网络与放大器 PSRR 宏模型扫频，预估纹波传递"
      automatable: partial
  sources:
    - title: "TPA3116D2 / TPA3118D2 / TPA3130D2 datasheet (SLOS708G)"
      url: "https://www.ti.com/lit/ds/symlink/tpa3116d2.pdf"
      publisher: "Texas Instruments"
      kind: datasheet
      section: "§6.6 AC Electrical Characteristics, KSVR"
    - title: "SiSonic Design Guide, AN16 Rev 3.0"
      url: "https://media.digikey.com/pdf/data%20sheets/knowles%20acoustics%20pdfs/sisonic_design_guide.pdf"
      publisher: "Knowles"
      kind: app_note
      section: "§4.1"
    - title: "AN-1496 Noise, TDMA Noise, and Suppression Techniques (SNAA033D)"
      url: "https://www.ti.com/lit/an/snaa033d/snaa033d.pdf"
      publisher: "Texas Instruments"
      kind: app_note
  confidence: high

- id: AUD-VER-005
  title: "静态本底 FFT：查工频谐波、217 Hz 和开关频率成分"
  domain: audio
  stage: verification
  severity: should
  rule: >-
    输入短路并端接、功放静音，做 FFT：50/60 Hz 及其谐波指向地环路或电源，217 Hz 及谐波指向 TDMA/无线突发，开关频率及边带指向滤波或去耦不足；用改变接地连接（断开或接入某条地线）来区分来源。
  rationale: >-
    不同来源在频谱上有不同特征，先看频谱再动手能快速定位而不是靠盲改。
  applies_to: [class-d, codec, preamp, grounding]
  parameters:
    - name: fft_span
      op: qualitative
      value: null
      note: "音频带内用 20 Hz-20 kHz；Class-D 需另外用宽带（到 1 MHz 以上）观察开关成分，注意分析仪过载（见 VER-001）"
  verify:
    - method: bench
      tool: "音频分析仪 / 声卡 FFT + 示波器"
      check: "空载本底下找峰值：50/60 Hz×n、217 Hz×n、开关频率；再做接地改动实验，记录哪个峰随之变化"
      automatable: partial
  sources:
    - title: "RaneNote 110: Sound System Interconnection"
      url: "https://www.ranecommercial.com/legacy/note110.html"
      publisher: "Rane"
      kind: vendor_guide
      section: "troubleshooting"
    - title: "AN-1496 Noise, TDMA Noise, and Suppression Techniques (SNAA033D)"
      url: "https://www.ti.com/lit/an/snaa033d/snaa033d.pdf"
      publisher: "Texas Instruments"
      kind: app_note
    - title: "Digital Audio Measurements (SLAA114)"
      url: "https://www.ti.com/lit/pdf/slaa114"
      publisher: "Texas Instruments"
      kind: app_note
      section: "FFT analysis"
  confidence: medium

- id: AUD-VER-006
  title: "Class-D 辐射预扫：最长喇叭线与最终磁珠/滤波器配置"
  domain: audio
  stage: verification
  severity: should
  rule: >-
    用最终的磁珠或 LC 滤波器、最长实际扬声器线缆（如 1 m）和典型输出功率预扫 30 MHz-1 GHz 辐射与传导发射；更换磁珠型号后重测；扬声器线与电源线分开放置。
  rationale: >-
    PWM 输出谐波延伸到数百 MHz，输出走线和喇叭线是最大发射源；磁珠的阻抗特性随型号差异大，不同批次/型号的结果不能互相代替。
  applies_to: [class-d, filter-free, ferrite-bead]
  parameters:
    - name: fcc_class_b_limit_30_88mhz
      op: "<="
      value: 40
      unit: dBuV/m
      note: "3 m；88-216 MHz 为 43，216-960 MHz 为 46（SLOA145 表 1 写作 213-960 MHz），960 MHz 以上 54"
    - name: speaker_cable_length_no_lc_filter
      op: "<="
