- id: EMC-SCH-012
  title: 电机端子并联陶瓷电容（跨端子 + 对外壳）
  domain: emc_esd
  stage: schematic
  severity: should
  rule: 刷式直流电机在电机壳体处焊 1–3 个无极性陶瓷电容：一个跨两端子，另两个分别从两端子到电机外壳；用 PWM 驱动时要使电容与电机电感的谐振频率远离 PWM 频率，并检查驱动器电流尖峰。
  rationale: 电刷换向产生宽带电弧噪声，高频电流经引线辐射；跨接电容给高频噪声提供短路路径而不影响电机功率，到外壳的电容进一步减小电刷电弧并降低辐射。电容过大与电机电感谐振，或在 PWM 下增加开关损耗。
  applies_to: [brushed-dc-motor, h-bridge, low-side-mosfet]
  parameters:
    - name: motor_terminal_cap_pololu
      op: "=="
      value: 0.1
      unit: uF
      note: "Pololu：1–3 个 0.1 µF 陶瓷电容，越靠近电机壳体越好，双向控制不要用极性电容"
    - name: motor_terminal_cap_pmd_range
      op: range
      value: [0.0001, 0.1]
      unit: uF
      note: "Precision Microdrives AB-005：100 pF–100 nF，取决于电机尺寸；用 PWM 时通常 10–100 pF"
  conflicts: "Pololu 建议 0.1 µF；Precision Microdrives 针对小型振动电机用 PWM 驱动时建议 10–100 pF，并要求谐振频率 f_r = 1/(2π√(Lm·Ce)) 远离 PWM 频率。差别来自电机尺寸与驱动方式。取舍：对 5 V、堵转 1 A 量级的小型减速电机，先按 Pololu 的 0.1 µF 起步，再用示波器看驱动器/ MOSFET 电流尖峰与 PWM 边沿，必要时降到更小值。"
  verify:
    - method: spice
      tool: "ngspice，电机用 R‖L + 反电势模型"
      check: "扫 Ce，求 f_r 并确认与 PWM 频率相差一个数量级以上（一个数量级为经验取值）；检查开关管峰值电流"
      automatable: partial
    - method: emc_precompliance
      tool: "近场探头 / 电流探头夹在电机引线上"
      check: "加装电容前后比较 30–300 MHz 的噪声峰值，目标下降"
      automatable: manual
  sources:
    - title: Dealing with Motor Noise (Pololu 3pi / Orangutan motor driver note, §9)
      url: https://www.pololu.com/docs/0J15/9
      publisher: Pololu
      kind: vendor_guide
    - title: "AB-005: EMC (EMI) for Vibe Motors"
      url: https://www.precisionmicrodrives.com/ab-005
      publisher: Precision Microdrives
      kind: app_note
  confidence: medium
  tags: [cat-feeder]

- id: EMC-SCH-013
  title: 感性负载必须有续流/钳位路径
  domain: emc_esd
  stage: schematic
  severity: should
  rule: 每个由开关管控制的感性负载（继电器线圈、电磁阀、直流电机）必须在关断时有续流路径：二极管反并联在负载上并贴近负载，或由 H 桥的体二极管/慢衰减提供；需要快速释放的继电器可在二极管上串 Zener 或电阻，但必须核对开关管 Vds 和元件功率。
  rationale: 电流不能瞬间归零，V = L·di/dt 会在开关管上产生尖峰；例如 10 nH、50 A 在数十 ns 内关断就可产生 50 V 的叠加电压。续流二极管把负载电压限制在二极管正向压降，但会延迟继电器释放。
  applies_to: [relay, solenoid, brushed-dc-motor, h-bridge]
  parameters:
    - name: freewheel_diode_clamp_voltage
      op: range
      value: [0.7, 1.5]
      unit: V
      note: "Wikipedia Flyback diode：电感电压被限制在二极管正向压降，约 0.7–1.5 V；肖特基更低，但会进一步延长继电器释放时间"
  verify:
    - method: erc
      tool: "KiCad 网络脚本"
      check: "对每个被开关管（MOSFET/BJT/驱动 IC 输出）驱动的线圈/电机节点，确认存在二极管反并联或驱动 IC 内部体二极管（见数据手册）"
      automatable: partial
    - method: spice
      tool: "ngspice"
      check: "仿真关断瞬态，读开关管 Vds 峰值，须低于其 Vds 额定并留裕量"
      automatable: full
    - method: bench
      tool: "示波器 + 差分探头"
      check: "在电机启动、堵转、反转时抓开关管漏极电压，峰值不超过器件额定"
      automatable: manual
  sources:
    - title: Flyback diode
      url: https://en.wikipedia.org/wiki/Flyback_diode
      publisher: Wikipedia
      kind: blog
    - title: DRV8833 Dual H-Bridge Motor Driver
      url: https://www.ti.com/lit/ds/symlink/drv8833.pdf
      publisher: Texas Instruments
      kind: datasheet
      section: "§8 recirculation current, fast/slow decay"
    - title: Selecting TVS Diodes in Hot-swap and ORing Applications (SSZT363)
      url: https://www.ti.com/lit/pdf/sszt363
      publisher: Texas Instruments
      kind: app_note
  confidence: medium
  tags: [cat-feeder]

- id: EMC-SCH-014
  title: 连接器金属壳/机壳地与信号地的连接方式要显式决定
  domain: emc_esd
  stage: schematic
  severity: consider
  rule: 对金属壳连接器（如 USB-C），原理图里明确选择一种方式并说明理由：壳体直接低电感接信号地；壳体接机壳地、机壳地经 R‖C 或磁珠接信号地；或悬空。无机壳地可用时优先直接接地，并预留 0 Ω 与 R/C 位置以便调试。
  rationale: TI 指出 TVS 的地与数字/模拟地之间隔以电感的机壳地对 ESD 很有效，但会让高速信号跨越多个地平面而很难布线，所以很多设计用同一个地；若没有机壳接地，紧耦合的多层地平面能让被保护 IC 处的地偏移保持较小。SZZA009 则要求有一个把稳压器、MCU、电池负极和机壳/屏蔽连起来的单点参考。
  applies_to: [usb-c, shielded-connector]
  conflicts: "SLVA680：分离的机壳地 ESD 效果很好但布线难，很多设计用公共地；SZZA009：屏蔽层接单点参考；论坛（仅见搜索摘要，未打开）转述的 USB 做法有三种：1 MΩ 并 4.7 nF 接信号地（据称来自 Cypress 与 Atmel AVR1017 §3.3.3）、壳体直接接地（据称为 Intel 做法）、经磁珠接地；另有一条 Linux 内核邮件列表（chipidea udc 内核崩溃，2016）报告把壳体经 1 MΩ‖1 nF 接保护地后 USB 不稳定，改接到与 USB 信号相同的 GND（并把 1 MΩ 换成 100 Ω）后问题未再出现。取舍：本板塑料外壳、无保护地，采用壳体直接接信号地且 TVS 地紧邻，并保留 R/C 焊盘，因为在没有机壳地时分离地没有 ESD 收益。"
  verify:
    - method: review
      tool: "原理图评审"
      check: "每个金属壳连接器的壳体网络有明确去向（直接地 / RC / 磁珠），并预留可换件的焊盘"
      automatable: manual
    - method: bench
      tool: "ESD 枪（接触放电打壳体）+ 示波器"
      check: "4 kV 接触放电打 USB 壳体，观察 EN、3V3 与 USB 链路有无复位/掉线；换不同的壳体接法对比"
      automatable: manual
  sources:
    - title: ESD Protection Layout Guide (SLVA680A)
      url: https://www.ti.com/lit/pdf/slva680
      publisher: Texas Instruments
      kind: app_note
      section: "§1, §2.4"
    - title: PCB Design Guidelines For Reduced EMI (SZZA009)
      url: https://www.ti.com/lit/an/szza009/szza009.pdf
      publisher: Texas Instruments
      kind: app_note
      section: "§2.2.1, §3.2"
    - title: USB device cable shield connection - grounding it or not?
      url: https://forum.allaboutcircuits.com/threads/usb-device-cable-shield-connection-grounding-it-or-not.58811/
      publisher: All About Circuits forum
      kind: forum
  confidence: medium
  tags: [cat-feeder]

- id: EMC-STK-001
  title: 两层板：栅格化地 + 电源地叠放，逼近四层效果
  domain: emc_esd
  stage: stackup
  severity: should
  rule: 没有整层地平面的两层板，要靠布局模拟四层板的效果：地做成栅格或整片并多点过孔互连，信号回流紧贴信号线下方，电源走线正对地线，MCU 下方做一块地岛并向器件外延伸约 1/4 英寸，去耦电容与晶振的地接到这块地岛；IC 到电压源的电源/地走线长宽比不超过 3:1。
  rationale: SZZA009 称做到这些后，两层板可达到四层板约 95% 的效果；回流路径紧贴信号线是缩小环路面积、控制辐射的最有效手段。需要更严格的发射或高速接口时再升到四层（信号/地/电源/信号）。
  applies_to: [two-layer, mcu-board]
  parameters:
    - name: power_ground_trace_length_to_width
      op: "<="
      value: 3
      unit: ratio
      note: "SZZA009 §2.1.1：两层板上 IC 与电压源之间的电源/地走线"
    - name: mcu_ground_island_extension
      op: ">="
      value: 6.35
      unit: mm
      note: "SZZA009 §2.1.3：地岛延伸出器件轮廓约 1/4 英寸（6.35 mm）；该数值为英制换算"
  verify:
    - method: geometry_script
      tool: "pcbnew Python"
      check: "采样每条周期性信号走线，检查走线下方（对层）或其两侧 1 mm 内（1 mm 为本库经验取值）是否有地铜；记录无地覆盖的长度占比，目标占比越低越好；检查电源走线与对应地走线是否上下重叠"
      automatable: partial
    - method: emc_precompliance
      tool: "近场探头 + 频谱仪"
      check: "对比改版前后近场峰值"
      automatable: manual
  sources:
    - title: PCB Design Guidelines For Reduced EMI (SZZA009)
      url: https://www.ti.com/lit/an/szza009/szza009.pdf
      publisher: Texas Instruments
      kind: app_note
      section: "§2.1.1–§2.1.4"
  confidence: high
  tags: [cat-feeder]

- id: EMC-STK-002
  title: 20H 规则有争议，不当作强制规则
  domain: emc_esd
  stage: stackup
  severity: consider
  rule: 不要把「电源平面缩进地平面 20H」作为必选项；只有在电源平面夹在两个地层之间、边沿很快的高速多层板（PCBWay 称通常 8 层及以上）上，且不影响过孔和供电连续性时，才考虑缩进，实用缩进量 0.5–1 mm，四周均匀。两层板没有电源平面，本规则不适用。
  rationale: 20H 的出发点是让边缘的边沿场被包住（H 为电源—地层间距）。Shim 和 Hubing 在两块 7"×9"（30 mil 厚）板上实测并建模，结论是近场虽更集中，但实现 20H 的板在谐振频率处辐射略高：解析估算最大场强 TM10 +3.6 dB、TM01 +4.4 dB，EMAP5 模型辐射功率约高 2–3 dB；实测峰值差随模式而异（TM10 约 7 dB，TM01 不足 1 dB），与简化模型吻合得不好，但方向一致（20H 板更高）。板厂文章称 20H 约保留 70% 边缘场、100H 约 98%，但均无实测依据，并承认只在特定条件下有效。
  applies_to: [multilayer, power-plane]
  parameters:
    - name: power_plane_setback_practical
      op: range
      value: [0.5, 1]
      unit: mm
      note: "PCBWay 文章的折衷建议：电源平面比地平面各边缩进约 0.5–1 mm；非来自测量"
    - name: setback_20h_for_1p6mm_two_layer
      op: "=="
      value: 32
      unit: mm
      note: "20 × 1.6 mm 的换算；说明 20H 在常见层距下并不现实"
  conflicts: "支持方：Montrose 的书与多家板厂文章（PCBWay 等）称 20H 能把约 70% 边缘电场约束在板内；反对方：Clemson/Missouri-Rolla 的 Shim & Hubing 论文用测试板和 EMAP5 数值模型得出 20H 不降低辐射反而略升。取舍：以有实测数据的论文为准，将 20H 降为 consider；板边辐射改用地环 + 缝合过孔和让快速信号远离板边处理。"
  verify:
    - method: em_sim
      tool: "openEMS / 腔体模型，对比有无缩进的板辐射功率"
      check: "对 TM10/TM01 谐振频率附近的辐射功率做对比；若缩进后更高则不采用"
      automatable: partial
    - method: emc_precompliance
      tool: "近场探头 / 暗室"
      check: "A/B 两版实测，同一 RBW 比较谐振频点峰值"
      automatable: manual
  sources:
    - title: 20-H Rule Modeling and Measurements (Shim, Hubing)
      url: https://cecas.clemson.edu/cvel/pdf/EMCS01-939.pdf
      publisher: Clemson CVEL / University of Missouri-Rolla
      kind: paper
    - title: Why Should Power Planes Be Smaller Than Ground Planes in PCB Design?
      url: https://www.pcbway.com/blog/PCB_Design_Layout/Why_Should_Power_Planes_Be_Smaller_Than_Ground_Planes_in_PCB_Design_351dcc7f.html
      publisher: PCBWay
      kind: blog
  confidence: medium
  tags: [cat-feeder]

- id: EMC-FLR-001
  title: 按功能分区，高速逻辑靠电源入口，模拟远离
  domain: emc_esd
  stage: floorplan
  severity: should
  rule: 把同类功能放在一起：高速逻辑与 MCU 靠近电源入口/稳压器，慢速器件次之，模拟电路最远；振荡器环路远离模拟、低速信号和连接器；成品里不要让线束折叠到振荡器或 MCU 上方。
  rationale: 这样高速逻辑污染其他信号线的机会最小；线缆会把拾取到的噪声带到别处。
  applies_to: [mcu-board]
  verify:
    - method: geometry_script
      tool: "pcbnew Python"
      check: "分别量 MCU/时钟、模拟采样（INA199、ADC 输入）、连接器之间的质心距离与路径，输出分区报告供评审"
      automatable: partial
    - method: review
      tool: "布局评审"
      check: "高速、慢速、模拟、I/O 各占一个连续区域且 I/O 不穿过高速区"
      automatable: manual
  sources:
    - title: PCB Design Guidelines For Reduced EMI (SZZA009)
      url: https://www.ti.com/lit/an/szza009/szza009.pdf
      publisher: Texas Instruments
      kind: app_note
      section: "§2.3, Figure 10"
  confidence: high
  tags: [cat-feeder]

- id: EMC-FLR-002
  title: 连接器集中在板边一侧，ESD 敏感电路放中央
  domain: emc_esd
  stage: floorplan
  severity: should
  rule: 把所有连接器和外接线放在 PCB 同一条边（或同一区域）；ESD 敏感电路放在板中央，远离板边、外接线、连接器和电源入口；噪声线、快速线不要布在板外缘。
  rationale: 外部线缆是主要的辐射天线和 ESD 入口，集中放置让保护与滤波集中在一处；板边的走线更容易辐射，也离放电点更近。
  applies_to: [connector, high-speed, esd]
  verify:
    - method: geometry_script
      tool: "pcbnew Python"
      check: "求所有连接器焊盘的外接矩形与它们所在板边；要求连接器分布在 ≤ 2 条相邻板边（来源只写「同一边或同一区域」，2 条为本库放宽的操作化判据）；列出距板边最近的 MCU/ADC 焊盘及其距离；记录所有时钟/PWM 网络走线到 Edge.Cuts 的最小距离"
      automatable: partial
  sources:
    - title: High-Speed Layout Guidelines for Reducing EMI for LVDS SerDes Designs (SNLA302)
      url: https://www.ti.com/lit/pdf/snla302
      publisher: Texas Instruments
      kind: app_note
      section: "§2, §3"
    - title: PCB Design Guidelines For Reduced EMI (SZZA009)
      url: https://www.ti.com/lit/an/szza009/szza009.pdf
      publisher: Texas Instruments
      kind: app_note
      section: "§2.4.1"
  confidence: high
  tags: [cat-feeder]

- id: EMC-FLR-003
  title: 连接器到 TVS 之间划 ESD 入口禁布区
  domain: emc_esd
  stage: floorplan
  severity: must
  rule: 从连接器引脚到 TVS 这段是 ESD 电流和辐射最强的区域，当作禁布区：禁止布入未受保护的走线或器件，已受保护的线也不要与未受保护线并行相邻；过孔穿过的各层同理。
  rationale: ESD 在这段产生很大的 dI/dt，会辐射并感应到邻近走线，感应电流若进入没有 TVS 的线路可直接损坏器件或把干扰带进内部。
  applies_to: [tvs, connector]
  verify:
    - method: geometry_script
      tool: "pcbnew Python"
      check: "取每个连接器引脚焊盘到对应 TVS 焊盘之间的走线包络，向外扩 2 mm（2 mm 为经验值，来源未给）；包络内不得出现不属于该受保护网络的铜（走线、过孔、焊盘），否则报错"
      automatable: full
    - method: drc
      tool: "KiCad 自定义规则 (.kicad_dru)，intersectsArea() 条件"
      check: "为每个 ESD 入口绘制规则区，写 (rule ... (constraint disallow track via) (condition \"A.intersectsArea('esd_zone')\")) 并对非受保护网络生效"
      automatable: partial
  sources:
    - title: ESD Protection Layout Guide (SLVA680A)
      url: https://www.ti.com/lit/pdf/slva680
      publisher: Texas Instruments
      kind: app_note
      section: "§2.2"
    - title: ESD Packaging and Layout Guide (SLVAEX9B)
      url: https://www.ti.com/lit/pdf/slvaex9
      publisher: Texas Instruments
      kind: app_note
      section: "§2.2"
    - title: Board design considerations for TVS diodes (ESD protection diodes)
