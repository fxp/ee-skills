- id: EMC-PLC-003
  title: 去耦电容贴电源脚，回路面积最小
  domain: emc_esd
  stage: placement
  severity: should
  rule: 去耦电容放在被供电的 IC 引脚旁，电容—电源脚—地脚构成的回路面积最小；电容的电源端直接连到电源脚，地端用不少于两个过孔（有平面时）或短而宽的地铜接地；去耦回路走线长宽比不超过 3:1；用 SMD 电容。
  rationale: IC 开关电流应由本地电容供给，回路电感越小，高频电流越不会向电源走线上跑；带引线电容约 80 MHz 即自谐振，之后呈感性。
  applies_to: [decoupling, mcu, ic-supply]
  parameters:
    - name: decoupling_trace_length_to_width
      op: "<="
      value: 3
      unit: ratio
      note: "SZZA009 §2.2.4：旁路回路走线的长宽比"
    - name: decoupling_cap_ground_vias
      op: ">="
      value: 2
      unit: count
      note: "TI SLLA284 §4.6：地端经两个过孔接地平面（用于有平面的板；两层板用短而宽的地铜代替）"
  verify:
    - method: geometry_script
      tool: "pcbnew Python"
      check: "对每个电源引脚找最近的去耦电容，量电容电源焊盘—电源脚、电容地焊盘—地脚（或最近地过孔）的距离，并估算回路面积；回路面积最小排序，最差 3 个输出供评审；检查连接走线长宽比 ≤ 3"
      automatable: full
    - method: pi_sim
      tool: "PDN 阻抗仿真（如 openEMS / 解析模型）"
      check: "在 10–500 MHz 检查 IC 处 PDN 阻抗，包含电容 ESL 和过孔电感"
      automatable: partial
  sources:
    - title: PCB Design Guidelines For Reduced EMI (SZZA009)
      url: https://www.ti.com/lit/an/szza009/szza009.pdf
      publisher: Texas Instruments
      kind: app_note
      section: "§1.2, §2.2.4"
    - title: Digital Isolator Design Guide (SLLA284)
      url: https://www.ti.com/lit/pdf/slla284
      publisher: Texas Instruments
      kind: app_note
      section: "§4.6 item 10"
    - title: ESP32-C3 Hardware Design Guidelines - PCB Layout Design
      url: https://docs.espressif.com/projects/esp-hardware-design-guidelines/en/latest/esp32c3/pcb-layout-design.html
      publisher: Espressif
      kind: vendor_guide
      section: "Decoupling Capacitors"
