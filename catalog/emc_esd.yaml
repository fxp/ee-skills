- id: EMC-SCH-008
  title: TVS 按 VRWM、VBR、VC、IPP、电容选型
  domain: emc_esd
  stage: schematic
  severity: must
  rule: TVS 的 VRWM 须不低于线路最大工作电压（含容差）；VBR 高于最大电源电压；在设计的 IPP 下 VC 须低于被保护器件的绝对最大值（再叠加布局电感的附加压降）；IPP 与脉冲功率须大于威胁电流；信号线的电容满足带宽预算；过零信号用双向器件；器件自身的 IEC 61000-4-2 等级不低于目标。
  rationale: VRWM 超出会造成漏电和误钳位；VC 取决于击穿电压加动态电阻与电感项；TVS 在威胁电流超过 IPP 时先短路失效。双向器件的工作电压范围通常对称（如 ±3.6 V、±5.5 V），单向器件仅正向但负向钳位更好。
  applies_to: [tvs, esd-diode, usb, power-input]
  parameters:
    - name: tvs_vrwm_vs_max_operating_voltage
      op: qualitative
      value: null
      note: "VRWM > 最大工作电压（Vishay Table 1：stand-off > operating）"
    - name: tvs_vc_vs_protected_abs_max
      op: qualitative
      value: null
      note: "VC@IPP < 被保护器件绝对最大额定（TI SSZT363）；来源未给统一裕量，由设计者定"
  verify:
    - method: bom_check
      tool: "BOM 脚本 + 数据手册参数表"
      check: "对每个 TVS 比较 VRWM ≥ V_max_op、VBR > V_supply_max、VC@IPP < 被保护引脚 Abs.Max（再叠加布局电感压降 (L2+L3)·dI/dt，见 EMC-VER-003；余量由设计者定，来源未给统一倍数）、IEC 等级 ≥ 目标；任何一条不满足即失败"
      automatable: partial
    - method: spice
      tool: "ngspice + 厂商 TVS 模型"
      check: "加 IEC 61000-4-2 8 kV 电流源（见 EMC-VER-003），读被保护引脚峰值电压"
      automatable: partial
  sources:
    - title: ESD Packaging and Layout Guide (SLVAEX9B)
      url: https://www.ti.com/lit/pdf/slvaex9
      publisher: Texas Instruments
      kind: app_note
      section: "§1.1–§1.5"
    - title: Selecting TVS Diodes in Hot-swap and ORing Applications (SSZT363)
      url: https://www.ti.com/lit/pdf/sszt363
      publisher: Texas Instruments
      kind: app_note
    - title: Failure Modes and Fusing of TVS Devices (AN 88440)
      url: https://www.vishay.com/docs/88440/failurem.pdf
      publisher: Vishay
      kind: app_note
      section: "Table 1"
  confidence: high
  tags: [cat-feeder]

- id: EMC-SCH-009
  title: 所有用户可触及端口和电源入口都要有 ESD 路径
  domain: emc_esd
  stage: schematic
  severity: must
  rule: 每个用户可触及的连接器引脚（USB-C 的 VBUS/CC/D±、电机、传感器口）、按键和外露导体都要有板级 ESD 路径；金属壳连接器的放电打在壳体上，壳体必须有低阻抗路径到地；主电源入口加 ESD 二极管和不小于 10 µF 的电容。
  rationale: IEC 61000-4-2 对带金属壳的连接器只对壳体做接触放电，对塑料壳连接器的引脚做空气放电；放电电流因此首先进入壳体接地路径，再经 PCB 地流向各器件。Espressif 建议在主电源入口加 ESD 二极管与至少 10 µF 电容。
  applies_to: [usb-c, button, connector, power-input]
  verify:
    - method: geometry_script
      tool: "读网表的脚本"
      check: "枚举连接器上每个信号/电源网络及按键网络，要求连通图上从连接器焊盘出发一跳内存在 TVS/ESD 阵列焊盘；金属壳焊盘必须连到地/机壳网络"
      automatable: partial
    - method: review
      tool: "ESD 路径评审清单"
      check: "对每个端口画出放电电流路径（接触点→壳体/TVS→地→返回），确认不穿过敏感电路"
      automatable: manual
  sources:
    - title: IEC 61000-4-2 Ed.2.0 (2008) ESD immunity test
      url: https://www.itu.int/en/ITU-D/Technology/Documents/Events2016/CI_Training_ARB_Tunis_April16/Session8/IEC_61000-4-2_2008.pdf
      publisher: IEC (copy hosted by ITU)
      kind: standard
      section: "§8.3.2, Table 4"
    - title: ESP32-C3 Hardware Design Guidelines - Schematic Checklist
      url: https://docs.espressif.com/projects/esp-hardware-design-guidelines/en/latest/esp32c3/schematic-checklist.html
      publisher: Espressif
      kind: vendor_guide
      section: "Power Supply"
    - title: "ESD Fundamentals Part 2: IEC 61000-4-2 Rating (SSZT871)"
      url: https://www.ti.com/lit/pdf/sszt871
      publisher: Texas Instruments
      kind: app_note
  confidence: high
