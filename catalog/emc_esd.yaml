- id: EMC-RTE-005
  title: 快沿/时钟走线要短，超过阈值要端接
  domain: emc_esd
  stage: routing
  severity: should
  rule: 时钟和快边沿走线尽量短；两层板上的快沿信号走线超过约 100 mm（4 英寸）会成为调频波段的辐射问题；超过约 300 mm（1 英尺）、去往出机壳的线缆、或出现振铃时要端接，MCU 系统优先用串联端接。
  rationale: 走线长度超过约 1/50 波长（消费/汽车两层板、无屏蔽）开始成为有效天线，FCC 限值下是 1/10 波长；串联端接功耗低、元件少，代价是增加延迟。CMOS 是欠阻尼的，必须防振铃与过冲。
  applies_to: [clock, fast-edge, two-layer]
  parameters:
    - name: trace_length_fm_band_concern
      op: ">"
      value: 101.6
      unit: mm
      note: "SZZA009 §2.4.2：4 英寸以上的走线对 FM 波段噪声可能构成问题（两层、无屏蔽的汽车/消费应用，1/50 波长准则）"
    - name: trace_length_termination_required
      op: ">"
      value: 304.8
      unit: mm
      note: "SZZA009 §2.4.3：走线超过 1 英尺、去往出机壳线缆、或有任何振铃时用某种端接"
  verify:
    - method: geometry_script
      tool: "pcbnew Python"
      check: "量每条时钟/快沿网络的走线总长，超过 101.6 mm 报警，超过 304.8 mm 要求存在串联端接电阻（由 EMC-SCH-001 检查）"
      automatable: full
    - method: si_sim
      tool: "ngspice / IBIS"
      check: "看接收端振铃和过冲，确认端接后单调"
      automatable: partial
  sources:
    - title: PCB Design Guidelines For Reduced EMI (SZZA009)
      url: https://www.ti.com/lit/an/szza009/szza009.pdf
      publisher: Texas Instruments
      kind: app_note
      section: "§2.4.2, §2.4.3"
  confidence: high
  tags: [cat-feeder]

- id: EMC-RTE-006
  title: ESD 路径和快沿线避免 90° 拐角（有条件）
  domain: emc_esd
  stage: routing
  severity: consider
  rule: 在 ESD 入口走线和边沿快的差分/时钟线上用 45° 或圆弧拐角；对低速、慢边沿的普通信号，不必为拐角牺牲布线空间。
  rationale: SLVA680 的仿真显示 8 kV ESD 下 90° 拐角电场集中、串扰耦合在 ESD 频段明显高于 45°和圆弧；TI SNLA302 与 SLLA284 也推荐避免直角（辐射和阻抗不连续）。
  applies_to: [esd, fast-edge]
  conflicts: "「90° 一定有害」流传很广，但来源里的依据是 ESD 瞬态与吉赫兹级差分线；本研究未读到针对低速板的实测证据，常见的反面说法（慢边沿下影响可忽略）未经核实。取舍：只对 ESD 路径与快边沿线要求，其他情况降为参考。"
  verify:
    - method: geometry_script
      tool: "pcbnew Python"
      check: "对 ESD 入口网络和被标记为快沿的网络，列出所有拐角角度，> 45° 者报警；其他网络仅统计不判失败"
      automatable: full
  sources:
    - title: ESD Protection Layout Guide (SLVA680A)
      url: https://www.ti.com/lit/pdf/slva680
      publisher: Texas Instruments
      kind: app_note
      section: "§2.2, Figure 2-3, Figure 2-4"
    - title: High-Speed Layout Guidelines for Reducing EMI for LVDS SerDes Designs (SNLA302)
      url: https://www.ti.com/lit/pdf/snla302
      publisher: Texas Instruments
      kind: app_note
      section: "§3"
    - title: Digital Isolator Design Guide (SLLA284)
      url: https://www.ti.com/lit/pdf/slla284
      publisher: Texas Instruments
      kind: app_note
      section: "§4.6 item 2"
  confidence: medium

- id: EMC-PLN-001
  title: 两层板地铺铜栅格化，消除只有一端连接的地岛
  domain: emc_esd
  stage: plane_pour
  severity: should
  rule: 两层板上尽量扩展地走线并铺满地铜，顶层与底层的地铜在走线交叉处用过孔连接；每块地铜至少两点接地，使其成为栅格中的导体而不是孤立的屏蔽片；不要出现仅一端连接的地走线或地岛。
  rationale: 只在一点接地的铜皮只是屏蔽，不是回流导体；栅格化地让每条信号线下方都有回流，同时降低 MCU 到稳压器的阻抗。SZZA009 称这是两层板最关键的设计技巧，用到所能容纳的所有过孔。
  applies_to: [two-layer, ground-pour]
  parameters:
    - name: ground_fill_connection_points
      op: ">="
      value: 2
      unit: count
      note: "SZZA009 §2.2.3：地铜连接两点或以上才算栅格的一部分"
  verify:
    - method: geometry_script
      tool: "pcbnew Python（已填充的 zone 多边形）"
      check: "对每块地 zone 统计与其他地铜（经过孔/焊盘）的独立连接点数，少于 2 或为孤立岛者报错；DRC 另开「未连接铜皮」检查"
      automatable: full
    - method: drc
      tool: "kicad-cli pcb drc"
      check: "确保 DRC 中不存在孤岛/未连接铜皮警告，或明确豁免"
      automatable: full
  sources:
    - title: PCB Design Guidelines For Reduced EMI (SZZA009)
      url: https://www.ti.com/lit/an/szza009/szza009.pdf
      publisher: Texas Instruments
      kind: app_note
      section: "§2.2.3, Figure 7, Figure 8"
  confidence: high
  tags: [cat-feeder]

- id: EMC-PLN-002
  title: 板边地环与缝合过孔间距小于 λ/20
  domain: emc_esd
  stage: plane_pour
  severity: consider
  rule: 需要抑制板边辐射或做过孔围栏时，缝合过孔间距小于最高关注频率波长的 1/20，槽与开孔的直径同样小于 λ/20；高速信号与噪声线不要靠近板边。
  rationale: 间距接近 λ/2 的缝隙或槽就成为有效的槽天线；λ/20 是把缝隙「电气上看不见」的常用准则，FR-4 中 1 GHz 的 λ 约 18 cm，对应小于 9 mm。
  applies_to: [board-edge, via-stitching]
  parameters:
    - name: stitching_via_spacing_at_1ghz
      op: "<"
      value: 9
      unit: mm
      note: "ProtoExpress：1 GHz 时（FR-4 λ≈18 cm）应小于 9 mm；按自己最高关注频率重算"
  conflicts: "AtlasPCB 博客给出的防护环参数（线宽 ≥ 0.5 mm、过孔间距 ≤ 5 mm、按 300 MHz ESD 频率）自身与 λ/20 换算不一致（300 MHz 的 λ/20 约 50 mm），仅作低可信度参考。板边处理与 20H 缩进（EMC-STK-002）的优劣在文献里也无定论。取舍：用 λ/20 作为间距上限，按需要取更密，并用近场对比验证收益。"
  verify:
    - method: geometry_script
      tool: "pcbnew Python"
      check: "沿板边地环统计相邻缝合过孔的中心距，最大值 < λ/20（λ 按 f_max 与 εr 估算，f_max 由需求给定）"
      automatable: full
    - method: emc_precompliance
      tool: "近场探头"
      check: "沿板边扫描，有无地环两版对比"
      automatable: manual
  sources:
    - title: 7 PCB Design Guidelines for EMI and EMC
      url: https://www.protoexpress.com/blog/7-pcb-design-tips-solve-emi-emc-issues/
      publisher: Sierra Circuits / Proto Express
      kind: blog
    - title: PCB ESD Protection Design - AtlasPCB
      url: https://www.atlaspcb.com/blog/pcb-esd-protection-tvs-guard-ring-layout/
      publisher: AtlasPCB
      kind: blog
    - title: PCB Design Guidelines For Reduced EMI (SZZA009)
      url: https://www.ti.com/lit/an/szza009/szza009.pdf
      publisher: Texas Instruments
      kind: app_note
      section: "§2.4.1, §3.4"
  confidence: low

- id: EMC-PLN-003
  title: 机壳/屏蔽地铜区：宽、短、至少两颗螺丝
  domain: emc_esd
  stage: plane_pour
  severity: should
  rule: 在连接器附近做一块与屏蔽/机壳相连的大面积地铜，作为 I/O 旁路电容和 TVS 地的返回点；到机壳的连接用宽铜（长宽比 ≤ 3:1），并用至少两颗螺丝牢固接地；机壳接地螺丝尽量靠近 TVS 地脚和连接器屏蔽。
  rationale: 噪声和 ESD 通过旁路电容到机壳再离开，路径阻抗越低，被保护 IC 处的地偏移越小；窄线会升高阻抗，使滤波失效。
  applies_to: [connector, chassis-ground, mounting-hole]
  parameters:
    - name: chassis_bonding_screws
      op: ">="
      value: 2
      unit: count
      note: "SZZA009 §2.5.5：最好两颗或更多螺丝"
    - name: chassis_connection_length_to_width
      op: "<="
      value: 3
      unit: ratio
      note: "SZZA009 §2.5.5 / §3.3"
  verify:
    - method: geometry_script
      tool: "pcbnew Python"
      check: "取与连接器屏蔽相连的地铜区，统计其中接地的安装孔数 ≥ 2（有机壳时），测最近安装孔到 TVS 地焊盘的距离并列出；测该铜区到主地的连接宽度与长度比 ≤ 3"
      automatable: partial
  sources:
    - title: PCB Design Guidelines For Reduced EMI (SZZA009)
      url: https://www.ti.com/lit/an/szza009/szza009.pdf
      publisher: Texas Instruments
      kind: app_note
      section: "§2.5.4, §2.5.5, §3.3, Figure 13"
    - title: ESD Protection Layout Guide (SLVA680A)
      url: https://www.ti.com/lit/pdf/slva680
      publisher: Texas Instruments
      kind: app_note
      section: "§2.4, Figure 2-8"
  confidence: high
  tags: [cat-feeder]

- id: EMC-VER-001
  title: 用 LISN 做传导发射预兼容，两根线分别扫
  domain: emc_esd
  stage: verification
  severity: should
  rule: 传导发射预兼容必须通过 LISN 测量，LISN 串在电源与被测板之间；分别扫 Line1 和 Line2 取较差者；用电池作安静的电源并串联保险丝，LISN 接频谱仪的 50 Ω 输入，切换通道或电源开关前先拆下频谱仪输入。
  rationale: LISN 提供一致的源阻抗和测量阻抗，使结果可重复；它同时用隔直电容保护频谱仪，但开关切换的阶跃会通过隔直电容耦合到输入端，可能损坏频谱仪。电池是低阻源，必须串保险丝防火。
  applies_to: [dc-input, switching-regulator, brushed-motor]
  parameters:
    - name: conducted_measurement_span
      op: range
      value: [0.01, 30]
      unit: MHz
      note: "TI AN-2162：监管测试的测量频率范围为 10 kHz 至 30 MHz（具体起点以适用标准为准）"
    - name: lisn_blocking_capacitor
      op: "=="
      value: 0.1
      unit: uF
      note: "AN-2162 所述 LISN 的隔直电容"
  verify:
    - method: emc_precompliance
      tool: "DC LISN + 频谱仪 + 电池电源 + 保险丝"
      check: "分别扫 Line1/Line2，记录准峰值与平均值曲线，与目标限值（见适用产品标准）比较；电机运行（启动、稳态、堵转）各扫一次"
      automatable: manual
  sources:
    - title: AN-2162 Simple Success With Conducted EMI From DC-DC Converters (SNVA489C)
      url: https://www.ti.com/lit/pdf/snva489
      publisher: Texas Instruments
      kind: app_note
      section: "§3 (10 kHz-30 MHz span), §6 LISN (incl. CAUTION box)"
  confidence: medium
  tags: [cat-feeder]

- id: EMC-VER-002
  title: ESD 测试：金属壳打壳体接触放电，绝缘件打空气放电
  domain: emc_esd
  stage: verification
  severity: must
  rule: ESD 抗扰测试只打正常使用中人可触及的点和面；带金属壳的连接器接触放电只打壳体（不打引脚），塑料壳连接器的引脚只做空气放电；每个选定点在最敏感极性下至少 10 次单次放电，间隔初值 1 s；空气放电要覆盖到规定等级以下的所有等级，接触放电只打规定等级。
  rationale: IEC 61000-4-2 §8.3.2 明确了可触及点、排除项和 Table 4 的六种连接器情形；放电电流因此首先进入壳体，再经 PCB 地到各器件，所以壳体到地路径的阻抗决定通过与否。
  applies_to: [usb-c, button, connector, enclosure]
  parameters:
    - name: esd_discharges_per_point
      op: ">="
      value: 10
      unit: count
      note: "§8.3.2：每个预选点在最敏感极性下至少 10 次单次放电；同步电路更多"
    - name: esd_interval_between_discharges
      op: ">="
      value: 1
      unit: s
      note: "§8.3.2：推荐初值 1 s，必要时更长以判定系统失效"
  verify:
    - method: bench
      tool: "ESD 枪（IEC 61000-4-2）+ 水平/垂直耦合板"
      check: "按测试计划打：USB-C 金属壳（接触）、塑料件缝隙与按键（空气）；记录每点结果、是否复位、是否通信中断、是否自动恢复"
      automatable: manual
    - method: emc_precompliance
      tool: "小型 ESD 笔/枪 + 示波器探 EN、3V3、USB"
      check: "开发阶段先用较低电平（2–4 kV）摸底，找出薄弱点后再提高"
      automatable: manual
  sources:
    - title: IEC 61000-4-2 Ed.2.0 (2008) ESD immunity test
      url: https://www.itu.int/en/ITU-D/Technology/Documents/Events2016/CI_Training_ARB_Tunis_April16/Session8/IEC_61000-4-2_2008.pdf
      publisher: IEC (copy hosted by ITU)
      kind: standard
      section: "§5, §8.3.2, Table 4"
  confidence: high
  tags: [cat-feeder]

- id: EMC-VER-003
  title: ESD 仿真：IEC 枪模型 + TVS + 寄生电感估算 VESD
  domain: emc_esd
  stage: verification
  severity: should
  rule: 布局完成后用 SPICE 仿真：IEC 61000-4-2 枪模型（150 pF / 330 Ω，8 kV）+ TVS 模型 + 由几何换算的寄生电感，读被保护引脚首峰电压并要求低于其 Abs.Max；寄生电感按 L = 0.2·l·(ln(2l/(w+t)) + 0.2235·(w+t)/l + 0.5) nH（l、w、t 单位 mm）估算。
  rationale: 首峰电压由 VBR、动态电阻和 L·dI/dt 决定，布局电感往往比器件本身更重要。ROHM 的仿真里 52 nH + 91 nH 的错误布局首峰 3.4 kV，TVS 完全没起作用；寄生电感降到 1 nH 后首峰降到 107 V。
  applies_to: [tvs, esd, spice]
  parameters:
    - name: esd_gun_series_resistance
      op: "=="
      value: 330
      unit: ohm
      note: "IEC 61000-4-2 Figure 1 注 3（典型值）"
    - name: esd_gun_storage_capacitance
      op: "=="
      value: 150
      unit: pF
      note: "IEC 61000-4-2 Figure 1 注 2（典型值）"
    - name: rohm_example_bad_layout_peak
      op: "=="
      value: 3400
      unit: V
      note: "ROHM 仿真：连接器—二极管 52 nH、连接器—IC 91 nH，首峰约 3.4 kV，二极管未钳位"
    - name: rohm_example_good_layout_peak
      op: "=="
      value: 107
      unit: V
      note: "ROHM 仿真：寄生电感 1 nH，首峰约 107 V；该值取决于所用 TVS 型号"
  verify:
