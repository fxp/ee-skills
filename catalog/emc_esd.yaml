- id: EMC-PLC-002
  title: 阻尼电阻贴驱动脚，I/O 旁路电容贴连接器
  domain: emc_esd
  stage: placement
  severity: should
  rule: 串联阻尼电阻及其 RC/LC 滤波件放在驱动（噪声源）引脚旁；到机壳/屏蔽地的 I/O 旁路电容和共模滤波件放在连接器处，噪声先被滤掉再进入板内。
  rationale: 噪声源侧的电阻让整条走线处于被阻尼的一侧；连接器处的旁路电容则让线缆拾取的噪声和板内传出的噪声在入口就被引到机壳，不在板上形成长环路。
