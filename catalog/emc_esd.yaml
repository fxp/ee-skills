- id: EMC-PLC-001
  title: TVS 紧靠连接器引脚，被保护 IC 远离 TVS
  domain: emc_esd
  stage: placement
  severity: must
  rule: TVS 放在设计规则允许的离连接器最近处，被保护 IC 离 TVS 的距离要明显大于 TVS 离连接器的距离，使 L4（TVS 到 IC）远大于 L1（连接器到 TVS），ESD 电流被「导向」TVS。
  rationale: 在 8 kV 接触放电下 dI/dt 约 4×10^10 A/s，0.25 nH 就产生约 10 V；布局电感把钳位变成摆设：ROHM 仿真中连接器到二极管 52 nH、到 IC 91 nH 的错误布局使首峰 3.4 kV 完全没被钳位，改为 1 nH 后首峰降到 107 V。Toshiba 称放在连接器附近比放在 IC 附近可使首峰钳位电压低近 10 V。
  applies_to: [tvs, esd-diode, connector]
  parameters:
    - name: tvs_to_connector_pin_distance
      op: minimize
      value: null
      note: "SLVA680：尽量近，来源未给距离；AtlasPCB 博客称 10 mm 内（低可信度，单一来源）"
    - name: tvs_to_ic_distance_vs_tvs_to_connector
      op: ">"
      value: 1
      unit: ratio
      note: "被保护 IC 到 TVS 的路径长度应大于 TVS 到连接器的路径长度（L4 >> L1）"
  verify:
    - method: geometry_script
      tool: "pcbnew Python"
      check: "对每个 ESD 保护网络：测连接器焊盘→TVS 信号焊盘的走线路径长度 d1，TVS 信号焊盘→被保护 IC 引脚的路径长度 d4，要求 d4 > d1，并输出 d1（越短越好，建议 d1 ≤ 10 mm 作评审阈值，该阈值为经验值）"
      automatable: full
    - method: spice
      tool: "ngspice，见 EMC-VER-003"
      check: "把 d1、d4 换算成电感后仿真首峰电压"
      automatable: partial
  sources:
    - title: ESD Protection Layout Guide (SLVA680A)
      url: https://www.ti.com/lit/pdf/slva680
      publisher: Texas Instruments
      kind: app_note
      section: "§2.1"
    - title: PCB Layout for TVS Diodes (No.66AN067E)
      url: https://fscdn.rohm.com/en/products/databook/applinote/discrete/diodes/pcb_layout_for_tvs_diodes_an-e.pdf
      publisher: ROHM
      kind: app_note
    - title: Board design considerations for TVS diodes (ESD protection diodes)
      url: https://toshiba.semicon-storage.com/ap-en/semiconductor/knowledge/faq/diode_tvs-diodes/board-design-considerations-for-tvs-diodes-esd-protection-diodes.html
      publisher: Toshiba
      kind: vendor_guide
    - title: PCB ESD Protection Design - AtlasPCB
      url: https://www.atlaspcb.com/blog/pcb-esd-protection-tvs-guard-ring-layout/
      publisher: AtlasPCB
      kind: blog
  confidence: high
