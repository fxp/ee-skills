- id: EMC-RTE-001
  title: 每条快速信号下方保持连续回流路径
  domain: emc_esd
  stage: routing
  severity: must
  rule: 每条周期性或快边沿信号（时钟、PWM、SPI/UART、开关节点）都必须有紧贴其下方（或紧邻）的连续地回流路径，回路面积最小；两层板上让地铜或地走线紧贴信号走线。
  rationale: 信号电流沿最低阻抗路径回到源头；信号与回流围成的环路就是天线，辐射随环路面积增大直到边长达到 1/4 波长。SZZA009 称在信号下方布置回流是减小环路面积最有效的办法，其中构造地栅格是布局规划之后最重要的事。
  applies_to: [clock, pwm, spi, uart, switch-node]
  parameters:
    - name: signal_loop_area
      op: minimize
      value: null
      note: "来源未给阈值；以覆盖率和面积相对排序评估"
    - name: quarter_wave_at_300mhz
      op: "=="
      value: 25
      unit: cm
      note: "SZZA009 §1.4.1：300 MHz 时 1/4 λ ≈ 25 cm（空气）；1 MHz 时 75 m"
  verify:
    - method: geometry_script
      tool: "pcbnew Python"
      check: "沿每条目标走线按 0.5 mm 步进取样点，判断对层或同层 1 mm 内是否有地铜（填充区已填充；0.5 mm、1 mm 均为本库经验取值，来源未给）；输出无地覆盖长度占比及位置，快速网络目标 100% 覆盖"
      automatable: full
    - method: em_sim
      tool: "openEMS / Elmer，或 2.5D 环路电感提取"
      check: "提取关键网络的环路电感，作为相对比较量"
      automatable: partial
  sources:
    - title: PCB Design Guidelines For Reduced EMI (SZZA009)
      url: https://www.ti.com/lit/an/szza009/szza009.pdf
      publisher: Texas Instruments
      kind: app_note
      section: "§1.4, §1.4.1, §2.1.4"
    - title: Digital Isolator Design Guide (SLLA284)
      url: https://www.ti.com/lit/pdf/slla284
      publisher: Texas Instruments
      kind: app_note
      section: "§4.5, Figure 4-8"
  confidence: high
  tags: [cat-feeder]

- id: EMC-RTE-002
  title: 不跨平面分割/槽走线，必须跨时加缝合电容
  domain: emc_esd
  stage: routing
  severity: should
  rule: 信号不要跨过地平面分割、槽或空洞；确实无法避免时，在跨越处尽量近的位置放不大于 1 µF 的缝合电容为高频电流提供回路。分割地平面时，连到 MCU 的信号必须完全位于数字地之上。
  rationale: 跨分割会迫使高频回流绕过分割，面积增大，造成过量辐射、串扰和延时；长槽还会聚焦槽天线辐射。
  applies_to: [multilayer, ground-plane, slot]
  parameters:
    - name: stitching_cap_max
      op: "<="
      value: 1
      unit: uF
      note: "SNLA302 §3：1 µF 或更小，尽量靠近平面跨越处"
  verify:
    - method: geometry_script
      tool: "pcbnew Python"
      check: "对每条走线的各段，检查其正下方参考层是否被分割线/槽/反焊盘阵列切断；有则列出，并确认附近 ≤ 1 µF 缝合电容"
      automatable: full
  sources:
    - title: High-Speed Layout Guidelines for Reducing EMI for LVDS SerDes Designs (SNLA302)
      url: https://www.ti.com/lit/pdf/snla302
      publisher: Texas Instruments
      kind: app_note
      section: "§3 Use a continuous ground plane"
    - title: PCB Design Guidelines For Reduced EMI (SZZA009)
      url: https://www.ti.com/lit/an/szza009/szza009.pdf
      publisher: Texas Instruments
      kind: app_note
      section: "§2.1.7"
  confidence: high

- id: EMC-RTE-003
  title: ESD 入口走线直通 TVS，无 stub、无过孔、拐角 ≤45°
  domain: emc_esd
  stage: routing
  severity: must
  rule: 受保护线从连接器直接走到 TVS 的保护引脚，不要有分叉（stub）；连接器到 TVS 之间不换层；必须换层时先经 TVS 再过孔；拐角用圆弧，做不到则不大于 45°。
  rationale: stub 或过孔的电感与 TVS 钳位并联，使被保护 IC 吃掉主要电流并多出 L·dI/dt 的压降；90° 拐角在 8 kV 时电场极高（SLVA680 估计至少 7 kV，半径小于约 2.6 mm 会电离空气）并有更强的串扰耦合。
  applies_to: [tvs, esd, connector]
  parameters:
    - name: tvs_path_corner_angle
      op: "<="
      value: 45
      unit: deg
      note: "SLVA680 §2.2：圆弧优先，最大 45°"
    - name: tvs_stub_length
      op: "=="
      value: 0
      unit: mm
      note: "SLVA680 §2.1：L2 stub 不应存在"
    - name: vias_between_connector_and_tvs
      op: "=="
      value: 0
      unit: count
      note: "SLVA680 §2.3：尽量无过孔；必须有时 TVS 先接，过孔后置（Case 1 最佳，Case 3 可接受，Case 2 应避免）"
  verify:
    - method: geometry_script
      tool: "pcbnew Python"
