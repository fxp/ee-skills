- id: EMC-VER-004
  title: EFT 抗扰测试：双极性、每端口不少于 1 分钟
  domain: emc_esd
  stage: verification
  severity: should
  rule: EFT/burst 抗扰测试要有测试计划，写明测试类型、等级、耦合方式、极性（两种极性都要）、每端口的测试时长（不少于 1 min，且不少于被测设备被充分运行并作出响应所需的时间）、重复频率（5 kHz 或 100 kHz）和被测端口。
  rationale: 脉冲波形为 5 ns 上升、50 ns 宽度（50 Ω 负载），突发为 5 kHz 时 15 ms、100 kHz 时 0.75 ms，周期 300 ms；能量低但上升快、重复率高，典型失效是复位、通信误码，而不是器件损坏。
  applies_to: [power-port, signal-port]
  parameters:
    - name: eft_test_duration_per_port
      op: ">="
      value: 1
      unit: min
      note: "IEC 61000-4-4 §8.3"
    - name: eft_burst_duration_5khz
      op: "=="
      value: 15
      unit: ms
      note: "±3 ms；100 kHz 时 0.75 ms ±0.15 ms；突发周期 300 ms ±60 ms；脉冲上升 5 ns ±1.5 ns，宽度 50 ns ±15 ns（50 Ω 负载）"
  verify:
    - method: bench
      tool: "EFT 发生器 + 容性耦合夹（信号线）/ CDN（电源）"
      check: "对电源口和信号线分别打；开发阶段在电机运行状态下重复，观察复位、掉线、ADC 异常"
      automatable: manual
  sources:
    - title: IEC 61000-4-4 Ed.3.0 (2012) Electrical fast transient/burst immunity test
      url: https://www.itu.int/en/ITU-D/Technology/Documents/Events2016/CI_Training_ARB_Tunis_April16/Session8/IEC_61000-4-4_2012.pdf
      publisher: IEC (copy hosted by ITU)
      kind: standard
      section: "§6.2, §8.3"
  confidence: high

- id: EMC-VER-005
  title: 电机启停/堵转时在板上抓供电、EN 和采样
  domain: emc_esd
  stage: verification
  severity: should
  rule: 电机启动、稳态、堵转、反转（含软件触发的反转清堵）时，用示波器同时抓 5 V 输入、3V3、CHIP_EN、电机端子和 INA199 输出，验证无欠压复位、EN 毛刺不进入复位区、采样噪声在软件滤波能力内；整套波形作为回归基线。
  rationale: 刷式电机的电刷换向、PWM 和堵转电流使供电和地出现 L·dI/dt 尖峰；SZZA009 指出最敏感的是复位、晶振和中断类脚，而 Espressif 明确 EN 线短才能避免外部干扰引起重启。这些问题在 EFT/ESD 认证前可以先用本测试暴露。
  applies_to: [brushed-dc-motor, esp32-c3, shunt-amplifier]
  parameters:
    - name: chip_en_low_level_max
      op: "<="
      value: 0.825
      unit: V
      note: "Espressif：VIL_nRST 上限 0.25×VDD（3.3 V 时 0.825 V）；毛刺的最低值须不低于此，否则可能触发复位"
  verify:
    - method: bench
      tool: "示波器（≥ 4 通道，≥ 200 MHz，带宽不要限到 20 MHz 以免漏掉高频尖峰）"
      check: "每种电机工况抓 20 次以上；记录 3V3 最低值（须高于模组最低工作电压）、EN 最小值、MCU 复位计数（读 reset reason），全部无异常"
      automatable: manual
  sources:
    - title: PCB Design Guidelines For Reduced EMI (SZZA009)
      url: https://www.ti.com/lit/an/szza009/szza009.pdf
      publisher: Texas Instruments
      kind: app_note
      section: "§2.6.2"
    - title: ESP32-C3 Hardware Design Guidelines - Schematic Checklist
      url: https://docs.espressif.com/projects/esp-hardware-design-guidelines/en/latest/esp32c3/schematic-checklist.html
      publisher: Espressif
      kind: vendor_guide
      section: "Chip Power-up and Reset Timing"
    - title: Electric Fast Transient (EFT) Application Note
      url: https://www.maxlinear.com/appnote/electric%20fast%20transient%20application%20note_301anr00.pdf
      publisher: MaxLinear
      kind: app_note
  confidence: medium
  tags: [cat-feeder]

- id: EMC-VER-006
  title: 样机阶段逐个拆装滤波件，只保留有实测收益的
  domain: emc_esd
  stage: verification
  severity: consider
  rule: 首批样机上，把 I/O 滤波电阻、电容、磁珠逐个拆掉或加回，在近场/预兼容环境下记录每个件对发射的贡献；量产只保留有实测收益的元件，其余改为不贴（DNP），并保留焊盘便于后续整改。
  rationale: SZZA009 指出这些规则会增加元件和占板面积，量产常不被接受；在屏蔽室里花一两小时逐个移除滤波件，就能确定哪些必需。Espressif 也建议为 SPI、USB 预留 0 Ω 与 RC 位置，初始不贴。
  applies_to: [filter, prototype, emc-tuning]
  verify:
    - method: emc_precompliance
      tool: "近场探头 + 频谱仪（或暗室）"
      check: "表格记录：元件位号、拆除后各问题频点的变化量（dB）；决定保留/DNP，保留的写出收益"
      automatable: manual
    - method: bom_check
      tool: "BOM 变体管理"
      check: "DNP 元件在 BOM 与装配文件中的状态一致，焊盘保留"
      automatable: partial
  sources:
    - title: PCB Design Guidelines For Reduced EMI (SZZA009)
      url: https://www.ti.com/lit/an/szza009/szza009.pdf
      publisher: Texas Instruments
      kind: app_note
      section: "§2.2.5"
    - title: ESP32-C3 Hardware Design Guidelines - Schematic Checklist
      url: https://docs.espressif.com/projects/esp-hardware-design-guidelines/en/latest/esp32c3/schematic-checklist.html
      publisher: Espressif
      kind: vendor_guide
      section: "SPI; USB"
  confidence: medium
  tags: [cat-feeder]
