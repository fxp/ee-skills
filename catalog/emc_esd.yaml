      tool: "pcbnew Python"
      check: "对 EMC-SCH-001 找到的串联 R，量其与 MCU 引脚焊盘的距离；对 EMC-SCH-006 的 I/O 电容，量其与连接器焊盘的距离，并列出最远者"
      automatable: partial
