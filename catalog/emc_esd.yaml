- id: EMC-SCH-007
  title: 线缆共模电流大时用共模扼流圈或磁环
  domain: emc_esd
  stage: schematic
  severity: consider
  rule: 当电流探头或近场扫描显示线缆共模电流是主要发射源时，在连接器入口加共模扼流圈，或给整条线缆套铁氧体磁环；扼流圈须在问题频段有足够共模阻抗、额定电流大于工作电流，且不得损伤差分信号完整性。电机引线也适用。
  rationale: 共模噪声的错误在板上的公共阻抗，线缆只是天线；能在源头降低公共阻抗最好，否则用磁环/扼流圈阻断共模电流。扼流圈对差模电流理想上无影响，但磁芯在大工作电流下会饱和。
  applies_to: [cable, motor-leads, connector]
  parameters:
    - name: cm_choke_impedance_at_problem_frequency
      op: maximize
      value: null
      note: "按实测共模电流的峰值频率选型；来源未给具体阻抗数值"
  verify:
    - method: emc_precompliance
      tool: "电流探头（夹在线缆上）+ 频谱仪"
      check: "加扼流圈前后测线缆共模电流谱，目标频点下降；差分信号眼图/时序不退化"
      automatable: manual
    - method: bom_check
      tool: "BOM 脚本"
      check: "扼流圈额定电流 ≥ 工作电流 × 1.0 且在该电流下的共模阻抗曲线可查"
      automatable: partial
  sources:
