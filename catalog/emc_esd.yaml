      url: https://www.vishay.com/docs/88440/failurem.pdf
      publisher: Vishay
      kind: app_note
    - title: Selecting TVS Diodes in Hot-swap and ORing Applications (SSZT363)
      url: https://www.ti.com/lit/pdf/sszt363
      publisher: Texas Instruments
      kind: app_note
    - title: "TPD1E6B06: Placement of TVS Diode and Fuse with ISO1044"
      url: https://e2e.ti.com/support/interface-group/interface/f/interface-forum/1433757/tpd1e6b06-placement-of-tvs-diode-and-fuse-with-iso1044
      publisher: TI E2E
      kind: forum
    - title: The correct order of TVS, filters and clamp diodes
      url: https://e2e.ti.com/support/amplifiers/f/amplifiers-forum/911201/the-correct-order-of-tvs-filters-and-clamp-diodes
      publisher: TI E2E
      kind: forum
