- id: EMC-RTE-004
  title: TVS 地脚接同层地铺铜，紧邻过孔缝合到相邻地层
  domain: emc_esd
  stage: routing
  severity: must
  rule: TVS 的地脚直接接到同层地铺铜，并在紧邻地脚处打过孔与相邻地层缝合（有多个地层时尽量都连）；过孔孔径和焊盘取大；地平面在该过孔附近不得被割断；被保护 IC 的接地不依赖长的地细线。连接到大地的机壳螺丝柱尽量靠近 TVS 地和连接器屏蔽。
  rationale: 被保护节点的电压 VESD = VBR + IESD·RDYN + (L2+L3)·dIESD/dt，L3（TVS 到地）是最主要的寄生项；8 kV 时 dIESD/dt ≈ 4×10^10 A/s，0.25 nH 就产生 10 V。两层板没有内层地，可用顶层地铺铜与底层地铺铜用紧邻过孔缝合。阳极侧同样要求，地平面应优先位于二极管正下方。
  applies_to: [tvs, esd-diode, two-layer]
  parameters:
    - name: tvs_ground_via_adjacent_to_pad
      op: ">="
      value: 1
      unit: count
      note: "SLVA680 §2.4：地脚旁紧邻 1 个缝合过孔，图 2-8 示例用 4 个；AtlasPCB（低可信度）建议每个 TVS 阵列至少 2 个"
    - name: esd_overshoot_per_nh
      op: "=="
      value: 40
      unit: V/nH
      note: "由 SLVA680 的 dI/dt = 30 A/0.8 ns ≈ 4×10^10 A/s 换算：每 1 nH 约 40 V"
  verify:
    - method: geometry_script
      tool: "pcbnew Python"
      check: "对每个 TVS 的地焊盘，量到最近地过孔的距离（目标 ≤ 焊盘间距的 1 倍，经验值）并统计 2 mm 内地过孔数；检查该焊盘是否直接连入同层地铺铜而非走细线（走线宽度 ≥ 0.5 mm 或直接铺铜；2 mm、0.5 mm 均为本库经验值，来源未给）"
      automatable: full
    - method: spice
      tool: "ngspice，L = 0.2·l·(ln(2l/(w+t)) + 0.2235·(w+t)/l + 0.5) nH（ROHM 公式，l、w、t 单位 mm）"
      check: "用该公式把地回路几何换成电感，代入 EMC-VER-003 的仿真，被保护引脚峰值须低于 Abs.Max"
      automatable: partial
  sources:
    - title: ESD Protection Layout Guide (SLVA680A)
      url: https://www.ti.com/lit/pdf/slva680
      publisher: Texas Instruments
      kind: app_note
      section: "§2.1, §2.4, Figure 2-8"
    - title: ESD Packaging and Layout Guide (SLVAEX9B)
      url: https://www.ti.com/lit/pdf/slvaex9
      publisher: Texas Instruments
      kind: app_note
      section: "§2.4"
    - title: PCB Layout for TVS Diodes (No.66AN067E)
      url: https://fscdn.rohm.com/en/products/databook/applinote/discrete/diodes/pcb_layout_for_tvs_diodes_an-e.pdf
      publisher: ROHM
      kind: app_note
  confidence: high
