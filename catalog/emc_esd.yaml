- id: EMC-SCH-010
  title: 保险丝与 TVS 的先后顺序要显式决定
  domain: emc_esd
  stage: schematic
  severity: should
  rule: 直流电源输入上，串联的保险丝/PPTC 放在 TVS 之前，使 TVS 失效短路后的跟随电流被切断，TVS 紧邻被保护电路并放在保险丝（串联电感/电阻）之后；纯信号线不加保险丝，TVS 直接放在连接器处。
  rationale: TVS 失效首选模式是短路，之后会把电源的工作电流导向地，成为安全隐患；Vishay 建议在电源与数据线上都在 TVS 之前串联熔断元件，板级保护时保险丝紧靠 TVS。TI 热插拔文章也指出 TVS 的最佳位置是在输入串联电感（如保险丝）之后。
  applies_to: [power-input, usb-vbus, tvs, fuse, pptc]
  conflicts: "Vishay AN 88440 与 TI SSZT363 主张保险丝在前。TI E2E 上的一条放大器论坛回答（仅见搜索摘要，未打开）主张连接器 → TVS（无限流电阻）→ 电子保险丝 → EMI 滤波的顺序，理由是 ESD 电流应先到 TVS；另一条 TI E2E 的 ISO1044 线程（仅见搜索摘要）称 TVS 放在保险丝后，因为放在连接器处的 TVS 遇到它无法承受的过压时会失效短路。取舍：电源口按安全优先——保险丝在前；若担心保险丝引线电感影响 ESD 钳位，选低电感（贴片）保险丝并让 TVS 紧邻其后；信号线无保险丝，不存在该冲突。"
  verify:
    - method: review
      tool: "原理图评审"
      check: "每个 DC 电源输入：连接器 → 保险丝/PPTC → TVS → 稳压；保险丝 I²t 低于 TVS 短路后可承受值（见 Vishay Fig.3），保持电流 ≥ 正常负载"
      automatable: manual
    - method: bench
      tool: "限流电源 + 示波器"
      check: "故障注入：升压到 TVS 击穿并短路，确认保险丝先于走线/PCB 过热断开；再做 IEC 8 kV 接触放电确认钳位与保险丝不动作"
      automatable: manual
  sources:
