- id: EMC-ARC-001
  title: 按源—路径—受害者拆解每个 EMC 问题
  domain: emc_esd
  stage: architecture
  severity: should
  rule: 对每个发射或抗扰问题先写出噪声源（哪个引脚/开关节点/时钟）、耦合路径（共模/差模、传导/辐射、公共阻抗、环路）和受害者，优先在源头压低（降边沿速率、缩回路、限频）；翻转速率低于 50 kHz 的引脚不必列入 EMI 滤波清单。
  rationale: SZZA009 把 MCU 板 RF 噪声来源按重要性排为 I/O 引脚、供电系统（稳压器与旁路电容）、振荡器；噪声沿最低阻抗路径回到源头，所以控制回路形状与阻抗就能控制传播，公共阻抗是最常见的共模来源。
  applies_to: [mcu-board]
  parameters:
    - name: emi_relevant_toggle_rate
      op: ">"
      value: 50
      unit: kHz
      note: "SZZA009 §1.3：只需关注翻转速率高于 50 kHz 的引脚，低于该速率的引脚贡献可忽略"
  verify:
    - method: review
      tool: "EMC 风险登记表（自建表格）"
      check: "对每个 > 50 kHz 的周期性网络（时钟、PWM、SPI/I2C、开关节点）写出 source / path / victim 三栏与采取的措施；任何一栏为空即不通过"
      automatable: manual
    - method: emc_precompliance
      tool: "近场探头 + 频谱仪"
      check: "对登记表中前 3 个噪声源做近场扫描，确认实测峰值频率与预期谐波（n×f_clk、n×f_PWM）对应，且措施后峰值下降"
      automatable: manual
  sources:
    - title: PCB Design Guidelines For Reduced EMI (SZZA009)
      url: https://www.ti.com/lit/an/szza009/szza009.pdf
      publisher: Texas Instruments
      kind: app_note
      section: "§1.1, §1.3, §1.4, §1.5"
  confidence: high
  tags: [cat-feeder]

- id: EMC-ARC-002
  title: ESD 目标等级按产品标准定，不靠 IC 的 HBM/CDM
  domain: emc_esd
  stage: architecture
  severity: must
  rule: 需求里为每个用户可触及端口写明 IEC 61000-4-2 目标等级（接触/空气放电 kV）。IC 数据手册的 HBM/CDM 额定值只说明产线可制造性，不能当作整机 ESD 保护；用户可触及端口必须有板级保护器件，且保护器件自身的 IEC 61000-4-2 等级不低于目标等级。
  rationale: IEC 61000-4-2 脉冲上升更快（8 kV 接触放电标称首峰 30 A、上升约 0.8 ns）、持续更长、能量远高于 HBM/CDM；TI 指出只有 HBM/CDM 额定值的器件很可能撑不过真实使用中的重复放电。
  applies_to: [usb-c, connector, button, external-interface]
  parameters:
    - name: esd_contact_test_voltage
      op: range
      value: [2, 8]
      unit: kV
      note: "IEC 61000-4-2 Table 1：等级 1–4 的接触放电 = 2 / 4 / 6 / 8 kV"
    - name: esd_air_test_voltage
      op: range
      value: [2, 15]
      unit: kV
      note: "IEC 61000-4-2 Table 1：等级 1–4 的空气放电 = 2 / 4 / 8 / 15 kV"
    - name: esd_first_peak_current_level4
      op: "=="
      value: 30
      unit: A
      note: "Table 3：8 kV 等级首峰 30 A（±15%），上升时间 0.8 ns（±25%），30 ns 处 16 A，60 ns 处 8 A"
    - name: esd_gun_series_resistance
      op: "=="
      value: 330
      unit: ohm
      note: "Figure 1（发生器简图）注 3：Rd 典型值 330 Ω；该处为典型值，标准不规定元件值，只规定 Table 2/3 的波形指标"
    - name: esd_gun_storage_capacitance
      op: "=="
      value: 150
      unit: pF
      note: "Figure 1 注 2：Cd + Cs 典型值 150 pF（同上，仅典型值）"
  verify:
    - method: review
      tool: "需求文档 / 测试计划"
      check: "每个外部端口都列有接触/空气放电目标等级；未列出的端口视为不通过"
      automatable: manual
    - method: bom_check
      tool: "BOM 脚本，读 TVS 数据手册参数表"
      check: "每个端口保护器件的 IEC 61000-4-2 接触/空气等级 ≥ 该端口目标等级，且额定值来自数据手册的 IEC 项而非 HBM/CDM 项"
      automatable: partial
  sources:
    - title: IEC 61000-4-2 Ed.2.0 (2008) ESD immunity test
      url: https://www.itu.int/en/ITU-D/Technology/Documents/Events2016/CI_Training_ARB_Tunis_April16/Session8/IEC_61000-4-2_2008.pdf
      publisher: IEC (copy hosted by ITU)
      kind: standard
      section: "Table 1, Figure 1 (notes 2-3), Table 3"
    - title: "ESD Fundamentals Part 2: IEC 61000-4-2 Rating (SSZT871)"
      url: https://www.ti.com/lit/pdf/sszt871
      publisher: Texas Instruments
      kind: app_note
  confidence: high
  tags: [cat-feeder]

- id: EMC-ARC-003
  title: 按端口确定 EFT 与浪涌等级和性能判据
  domain: emc_esd
  stage: architecture
  severity: should
  rule: 为每个电源口、信号/控制口在需求里写明 IEC 61000-4-4（EFT/burst）与 IEC 61000-4-5（浪涌）的等级和性能判据（A/B/C），并据此选择保护架构；板上继电器、电机等感性负载既是 EFT 类干扰的源，也要被当作受害者检查。
  rationale: EFT 模拟感性负载切断、继电器触点抖动等开关瞬变，特点是幅度高、上升时间短（5 ns）、重复频率高、能量低；浪涌模拟开关和雷击瞬变，用 1.2/50 µs 开路电压 / 8/20 µs 短路电流组合波、发生器等效内阻 2 Ω。两者的保护手段不同（EFT 靠滤波与布局，浪涌靠能量吸收器件）。
  applies_to: [power-port, signal-port, motor, relay]
  parameters:
    - name: eft_test_voltage_signal_ports
      op: range
      value: [0.25, 2]
      unit: kV
      note: "IEC 61000-4-4 Table 1：等级 1–4 的信号/控制口 = 0.25 / 0.5 / 1 / 2 kV"
    - name: eft_test_voltage_power_ports
      op: range
      value: [0.5, 4]
      unit: kV
      note: "IEC 61000-4-4 Table 1：等级 1–4 的电源口与 PE = 0.5 / 1 / 2 / 4 kV；重复频率 5 kHz 或 100 kHz，由产品标准定"
    - name: surge_test_voltage_line_to_ground
      op: range
      value: [0.5, 4]
      unit: kV
      note: "IEC 61000-4-5 Table 1：等级 1–4 的线—地 = 0.5 / 1 / 2 / 4 kV"
    - name: surge_test_voltage_line_to_line
      op: range
      value: [0.5, 2]
      unit: kV
      note: "IEC 61000-4-5 Table 1：等级 2–4 的线—线 = 0.5 / 1 / 2 kV（等级 1 无线—线项）"
    - name: surge_generator_effective_impedance
      op: "=="
      value: 2
      unit: ohm
      note: "IEC 61000-4-5 §6.2.1 与 Table 3：0.5 kV 开路 ↔ 0.25 kA 短路，即 2 Ω"
  verify:
    - method: review
      tool: "需求文档 / 测试计划"
      check: "每个端口有 EFT 等级、浪涌等级、重复频率和性能判据；电源口和带长线缆的口与产品标准逐项对照"
      automatable: manual
    - method: bench
      tool: "EFT/surge 发生器 + 耦合夹/CDN（认证实验室）"
      check: "按 IEC 61000-4-4 §8.3 / 61000-4-5 §8.3 的测试计划：两种极性、每端口不少于 1 min（EFT），浪涌从低等级逐级打到规定等级"
      automatable: manual
  sources:
    - title: IEC 61000-4-4 Ed.3.0 (2012) Electrical fast transient/burst immunity test
      url: https://www.itu.int/en/ITU-D/Technology/Documents/Events2016/CI_Training_ARB_Tunis_April16/Session8/IEC_61000-4-4_2012.pdf
      publisher: IEC (copy hosted by ITU)
      kind: standard
      section: "§4, §5 Table 1, §6.2"
    - title: IEC 61000-4-5 Ed.3.0 (2014) Surge immunity test
      url: https://www.itu.int/en/ITU-D/Technology/Documents/Events2016/CI_Training_ARB_Tunis_April16/Session8/IEC_61000-4-5_2014.pdf
      publisher: IEC (copy hosted by ITU)
      kind: standard
      section: "§5 Table 1, §6.2, Table 3"
    - title: Electric Fast Transient (EFT) Application Note
      url: https://www.maxlinear.com/appnote/electric%20fast%20transient%20application%20note_301anr00.pdf
      publisher: MaxLinear
      kind: app_note
  confidence: high
  tags: [cat-feeder]

- id: EMC-ARC-004
  title: 边沿速率与时钟频率取满足时序的最慢值
  domain: emc_esd
  stage: architecture
  severity: should
  rule: 对每条时钟、高速 GPIO、PWM 网络，把频率和驱动强度/边沿速率降到时序刚好满足的程度，输出端预留串联电阻位置；能降频就降频，能缩短走线或电缆就缩短。
  rationale: 差模辐射来自信号—回流环路，随边沿速率和频率上升；SZZA009 要求差模噪声降到「最慢允许的上升/下降时间、最小必要频率」，TI SNLA302 的开工清单也先问「能否用更低的频率」。Espressif 建议在 SPI 线上留 0 Ω 位置以调驱动强度、降低 RF 干扰。
  applies_to: [mcu, clock, gpio, pwm]
  verify:
    - method: review
      tool: "网络清单表（自建）：频率、驱动强度、上升时间"
      check: "每条 > 50 kHz 网络都记录频率、驱动强度设置、20–80% 上升时间；高于时序所需者要写出理由"
      automatable: manual
    - method: si_sim
      tool: "ngspice / IBIS 仿真"
      check: "用 IBIS 或驱动阻抗 + 串联 R + 走线电容估算接收端上升时间，确认时序裕量仍满足且上升时间不比必需值快 2 倍以上（2 倍为经验取值）"
      automatable: partial
    - method: emc_precompliance
      tool: "近场探头 + 频谱仪"
      check: "比较降低驱动强度/频率前后的近场峰值，目标是主谐波下降"
      automatable: manual
  sources:
    - title: PCB Design Guidelines For Reduced EMI (SZZA009)
      url: https://www.ti.com/lit/an/szza009/szza009.pdf
      publisher: Texas Instruments
      kind: app_note
      section: "§2.4.3, §2.5.1"
    - title: High-Speed Layout Guidelines for Reducing EMI for LVDS SerDes Designs (SNLA302)
      url: https://www.ti.com/lit/pdf/snla302
      publisher: Texas Instruments
      kind: app_note
      section: "§1 开工清单"
    - title: ESP32-C3 Hardware Design Guidelines - Schematic Checklist
      url: https://docs.espressif.com/projects/esp-hardware-design-guidelines/en/latest/esp32c3/schematic-checklist.html
      publisher: Espressif
      kind: vendor_guide
      section: "Flash (SPI)"
  confidence: high
  tags: [cat-feeder]

- id: EMC-ARC-005
  title: 展频时钟只降峰值不降总能量，先评估时序
  domain: emc_esd
  stage: architecture
  severity: consider
  rule: 对固定频率的时钟或开关电源，可启用展频（SSC，优先下展），调制深度须在抖动/时序预算内；收益要按实际测试的 RBW 和检波器评估，不能直接套用厂商 dB 数。
  rationale: 展频把窄带能量摊到更宽频带，总能量不变，只降低峰值；调制频率约取等于测试 RBW 才最有效，调制过大会增加输出纹波与周期抖动。低频时偏移量受系统约束，峰值降幅不会优于 10·log(RBW/2Δf)。
  applies_to: [clock-oscillator, switching-regulator, pll]
  parameters:
    - name: ssc_peak_reduction
      op: range
      value: [7, 20]
      unit: dB
      note: "Diodes AN-11 称辐射降 7–20 dB，取决于调制深度；属厂商宣称值，需按自己的 RBW 实测"
  verify:
    - method: emc_precompliance
      tool: "频谱仪（与认证相同的 RBW 与检波器）"
      check: "SSC 开/关各扫一次，比较峰值与准峰值降幅，并确认被调制的接口（USB、ADC 采样时钟等）在抖动与时序上仍满足规格"
      automatable: manual
  sources:
    - title: Application Note 11 - EMI Reduction Techniques
      url: https://www.diodes.com/assets/App-Note-Files/AN011-P.pdf
      publisher: Diodes Inc. (Pericom)
      kind: app_note
    - title: EMI Reduction Technique, Dual Random Spread Spectrum (SNVA974)
      url: https://www.ti.com/lit/pdf/snva974
      publisher: Texas Instruments
      kind: app_note
      section: "§2.1–§2.3"
  confidence: medium

- id: EMC-SCH-001
  title: MCU 输出/时钟脚串联阻尼电阻
  domain: emc_esd
  stage: schematic
  severity: should
  rule: MCU 数字输出脚串联 50–100 Ω、输入脚串联 35–50 Ω，电阻贴近芯片；不要加在晶振脚上。ESP32-C3 的 U0TXD 串 499 Ω，SPI 线预留 0 Ω 位置用于调驱动和抑制干扰。如同时加对地小电容，输出脚的电容放在电阻的接收端侧，输入脚的电容放在 MCU 侧。
  rationale: CMOS 输出欠阻尼，串联电阻同时抑制振铃并降低差模边沿能量，是 SZZA009 为 MCU 系统首选的端接方式；电阻放在芯片端能让大部分走线处于被阻尼的一侧。
  applies_to: [mcu, gpio, uart, spi]
  parameters:
    - name: series_r_output
      op: range
      value: [50, 100]
      unit: ohm
      note: "SZZA009 §2.2.5：每个输出脚；系统要求更大串联电阻时用更大值"
    - name: series_r_input
      op: range
      value: [35, 50]
      unit: ohm
      note: "SZZA009 §2.2.5：每个输入脚"
    - name: pin_bypass_cap
      op: "=="
      value: 1000
      unit: pF
      note: "SZZA009 §2.2.5：仅当信号需要的边沿不快于 100 ns 时才加；与电阻二选一时只保留电阻"
    - name: uart_tx_series_r
      op: "=="
      value: 499
      unit: ohm
      note: "Espressif ESP32-C3 原理图清单：U0TXD 串 499 Ω 抑制谐波"
  conflicts: "SZZA009 的阻值针对 CMOS 微控制器的低速 GPIO 引脚（原文未限定供电电压）。高速接口（数十 MHz 的 SPI、USB）的阻值必须由时序和阻抗决定，Espressif 给 USB D+/D− 的起始值是 22/33 Ω。取舍：低速 GPIO 用 SZZA009 区间作缺省，高速接口按器件手册。"
  verify:
    - method: geometry_script
      tool: "读 .kicad_sch/.kicad_pcb 网表的脚本"
      check: "对离开 PCB 的 MCU 输出网络（接到连接器的网络），沿连通图查找 MCU 引脚到连接器之间的串联电阻，缺失则报错；再量电阻焊盘到 MCU 引脚焊盘的距离并列出最远者供审阅"
      automatable: partial
    - method: si_sim
      tool: "ngspice"
      check: "加入驱动阻抗 + 串联 R + 走线/负载电容，确认接收端上升时间满足接口时序"
      automatable: partial
  sources:
    - title: PCB Design Guidelines For Reduced EMI (SZZA009)
      url: https://www.ti.com/lit/an/szza009/szza009.pdf
      publisher: Texas Instruments
      kind: app_note
      section: "§2.2.5, §2.4.3"
    - title: ESP32-C3 Hardware Design Guidelines - Schematic Checklist
      url: https://docs.espressif.com/projects/esp-hardware-design-guidelines/en/latest/esp32c3/schematic-checklist.html
      publisher: Espressif
      kind: vendor_guide
      section: "UART / SPI / USB"
  confidence: high
  tags: [cat-feeder]

- id: EMC-SCH-002
  title: EN/复位类敏感脚：短走线加 RC，不加大电容
  domain: emc_esd
  stage: schematic
  severity: should
  rule: 复位/EN、中断和晶振类对程序流有决定性影响的引脚按抗扰优先设计：CHIP_EN 走线尽量短并加 RC 延时（参考 10 kΩ + 1 µF），不得悬空；GPIO9 等 strapping 脚不加大电容；晶振脚不加串联滤波。
  rationale: 外场耦合到高阻输入后被整流成直流偏移，可使输入越过阈值，若是复位则器件反复复位，若是晶振则失去时钟；SZZA009 指出最关键的抗扰脚是晶振、复位、中断和分支输入。Espressif 明确要求 CHIP_EN 走线尽量短以免外部干扰引起重启。
  applies_to: [esp32-c3, reset, enable]
  parameters:
    - name: chip_en_rc_r
      op: "=="
      value: 10
      unit: kohm
      note: "Espressif 推荐 RC 延时示例，需按实际上电时序调整"
    - name: chip_en_rc_c
      op: "=="
      value: 1
      unit: uF
      note: "同上"
    - name: chip_en_low_level_max
      op: "<="
      value: 0.825
      unit: V
      note: "手册给 VIL_nRST 范围上限 0.25×VDD，3.3 V 供电时 0.825 V；EN 电压低于该值会被当作低电平（复位），噪声毛刺不得使 EN 跌到此值以下"
  verify:
    - method: erc
      tool: "KiCad ERC + 网络检查脚本"
      check: "CHIP_EN 网络有上拉电阻和对地电容，且无悬空；strapping 脚（GPIO9）上无「大电容」（Espressif 只写 high-value capacitors 未给数值，本检查取 ≥ 100 nF 报警，为本库经验阈值）"
      automatable: partial
    - method: geometry_script
      tool: "pcbnew Python"
      check: "输出 CHIP_EN 走线总长，并检查它与电机/开关节点网络的最小间距，供评审"
      automatable: partial
    - method: bench
      tool: "示波器（≥ 200 MHz）"
      check: "在 ESD 枪打 USB 壳体、电机启停/堵转时抓 EN 与 3V3，确认毛刺不跨过 VIL 门限、无复位"
      automatable: manual
  sources:
    - title: PCB Design Guidelines For Reduced EMI (SZZA009)
      url: https://www.ti.com/lit/an/szza009/szza009.pdf
      publisher: Texas Instruments
      kind: app_note
      section: "§2.2.5, §2.6.2"
    - title: ESP32-C3 Hardware Design Guidelines - Schematic Checklist
      url: https://docs.espressif.com/projects/esp-hardware-design-guidelines/en/latest/esp32c3/schematic-checklist.html
      publisher: Espressif
      kind: vendor_guide
      section: "Chip Power-up and Reset Timing; Strapping Pins"
  confidence: high
  tags: [cat-feeder]

- id: EMC-SCH-003
  title: IC 供电用磁珠 + 旁路电容做 π 型滤波
  domain: emc_esd
  stage: schematic
  severity: consider
  rule: 对高噪声 IC 的供电，在 +V 上串一个铁氧体磁珠（只加在电源线、不加在地线），旁路电容（0.1 µF 或 0.01 µF）放在磁珠的 IC 一侧，磁珠电源侧再并一个 1000 pF 电容构成 π 型滤波；四层板可省 1000 pF 但原理图先画上，EMI 测试后再删。
  rationale: IC 开关电流应由旁路电容供给而不是电源走线；磁珠阻止 RF 电流从电源线路获取，迫使 IC 只用磁珠内侧的储能，从而把 RF 噪声留在芯片附近。
  applies_to: [mcu, ldo-output, ic-supply]
  parameters:
    - name: bypass_cap_inside_bead
      op: range
      value: [0.01, 0.1]
      unit: uF
      note: "SZZA009 §2.2.4：0.1 µF 或 0.01 µF，放在磁珠的 IC 侧"
    - name: bypass_cap_outside_bead
      op: "=="
      value: 1000
      unit: pF
      note: "SZZA009 §2.2.4：磁珠外侧，接微控制器地；若该点噪声大，它可能把噪声耦回 +V"
  verify:
    - method: spice
      tool: "ngspice AC 扫描，磁珠用 R‖L‖C 模型"
      check: "在负载电流下扫 100 kHz–1 GHz，检查 IC 侧电源阻抗与磁珠—电容谐振峰（峰值须低于 0 dB 增益，见 EMC-SCH-005）"
      automatable: partial
    - method: emc_precompliance
      tool: "近场探头 + 频谱仪"
      check: "拆装 1000 pF 与磁珠做对比扫描，只保留有实测收益的元件"
      automatable: manual
