- id: EMC-FLR-005
  title: MCU 靠稳压器，稳压器靠供电入口，地在三者间单点参考
  domain: emc_esd
  stage: floorplan
  severity: should
  rule: MCU 紧挨稳压器，稳压器紧挨电源入口，三者之间用宽地铜或整片地连成一个参考点，屏蔽/机壳也接在这个点；高速或大面积数字区仍用连续地平面，不为单点而拆分。
  rationale: 单点参考让 RF 电流只在最短路径上流动，避免多点菊花链产生的公共阻抗耦合；SZZA009 称最佳方案是一个把稳压器地、MCU 地、电池负极和机壳/屏蔽连在一起的单点。
  applies_to: [mcu-board]
  conflicts: "SZZA009 面向低频微控制器板，建议对产生 RF 的器件用单点、其余用多点；SLLA284 与 SNLA302 面向高速接口，要求连续实心的地/电源平面且不要切割。取舍：在连续地平面（或栅格地）上，用器件摆放的顺序（电源入口 → 稳压器 → MCU）形成事实上的参考点，不靠切割地线实现单点。"
  verify:
    - method: geometry_script
      tool: "pcbnew Python"
      check: "计算电源入口连接器、稳压器、MCU 之间的直线距离与铜连接宽度；输出并要求这三者的路径总长最短且连接宽度符合长宽比 ≤ 3"
      automatable: partial
  sources:
    - title: PCB Design Guidelines For Reduced EMI (SZZA009)
      url: https://www.ti.com/lit/an/szza009/szza009.pdf
      publisher: Texas Instruments
      kind: app_note
      section: "§2.2.1, §2.2.2, §2.3, §3.2"
