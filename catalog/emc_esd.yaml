- id: EMC-SCH-011
  title: GDT/MOV/TVS/保险丝各司其职并配合使用
  domain: emc_esd
  stage: schematic
  severity: consider
  rule: 长线缆或市电口的浪涌保护按角色分层：GDT/MOV 承担大电流，TVS 作低钳位的后级，保险丝/PPTC 限制故障电流。GDT 在带电电源线上有续流风险，应选电源专用型号或串联 MOV；MOV 会因多次浪涌劣化并热失控，须选带热保护的 MOV 或加前级保险丝；TVS 不得超过其 IPP。保险丝的额定电压和分断能力必须高于系统故障源。
  rationale: GDT 击穿后形成电弧，导通续流时可能无法熄灭而过热；MOV 劣化后漏电升高并持续自热；TVS 钳位最低但耐浪涌能力有限（Littelfuse 用 1500 W 的 SMCJ 在 6 kV/3 kA 浪涌下演示过应力失效，并提醒走线也要按电流选宽度，否则会先熔断）。IEC 61000-4-5 的发生器等效内阻为 2 Ω，所以 0.5 kV 开路电压对应约 250 A 短路电流，选 IPP 时要按此估算威胁电流。
  applies_to: [mains-port, long-cable-port, surge]
  parameters:
    - name: surge_short_circuit_current_per_open_circuit_voltage
      op: "=="
      value: 0.5
      unit: kA/kV
      note: "IEC 61000-4-5 Table 3：0.5 kV ↔ 0.25 kA，1 kV ↔ 0.5 kA，2 kV ↔ 1 kA，4 kV ↔ 2 kA（发生器输出端，2 Ω）"
  verify:
    - method: spice
      tool: "ngspice，1.2/50 µs–8/20 µs 组合波源（Rs = 2 Ω）+ 保护网络模型"
      check: "在目标等级下读各级器件峰值电流与残压，确认 TVS 电流 < IPP、MOV/GDT 电流 < 其 8/20 µs 额定，被保护节点残压 < 绝对最大值"
      automatable: partial
    - method: bench
      tool: "浪涌发生器"
      check: "从低等级逐级打到规定等级，每级后复测 TVS 漏电和 MOV 参考电压是否漂移"
      automatable: manual
