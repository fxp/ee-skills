- id: EMC-FLR-004
  title: 电机/继电器/驱动区与 MCU 和模拟采样区分开
  domain: emc_esd
  stage: floorplan
  severity: should
  rule: 把电机驱动、继电器及其驱动器、电机接口放在板的一个区域，与 MCU、复位、晶振和电流检测放大器（INA199 一类）等敏感电路分开，大电流地与数字地分开走到单点；非噪声线远离继电器、继电器驱动器和连接器；电机引线走线短而粗，远离逻辑线。
  rationale: 电机驱动的开关电流、电刷电弧噪声和续流尖峰都经公共阻抗和空间耦合进入逻辑与采样电路；SZZA009 要求把高功率地与数字地隔离，并让非噪声线远离继电器及其驱动器。
  applies_to: [motor, relay, h-bridge, shunt-amplifier]
  verify:
    - method: geometry_script
      tool: "pcbnew Python"
      check: "计算电机驱动网络铜（开关节点、电机输出、VM）与 MCU/INA199 输入/EN/晶振网络之间的最小距离及并行长度，输出供评审；任何敏感网络与开关节点并行长度大于 10 mm 的标红（10 mm 为经验阈值）"
      automatable: partial
    - method: bench
      tool: "示波器"
      check: "电机启停/堵转时观察 INA199 输出和 ADC 读数是否被噪声污染"
      automatable: manual
