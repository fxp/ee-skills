- id: EMC-SCH-004
  title: 磁珠按直流偏置降额，不看 100 MHz 标称阻抗
  domain: emc_esd
  stage: schematic
  severity: should
  rule: 用于供电滤波的铁氧体磁珠，要在厂商 DC-bias 曲线上读取实际工作电流下、噪声频率处的阻抗；没有曲线时让工作电流不超过额定电流的约 20%。
  rationale: 数据手册通常只给零偏置、100 MHz 的阻抗；负载电流使磁芯趋于饱和，电感随之下降。ADI 的例子里，50% 额定电流时电感最多下降 90%，20% 额定电流时 6 A 磁珠电感剩约 30%、3 A 磁珠剩约 15%。额定电流是温升限值，不是滤波的工作点。
  applies_to: [ferrite-bead, power-filter]
  parameters:
    - name: bead_operating_current_fraction
      op: "<="
      value: 20
      unit: "%"
      note: "ADI AN-1368：约 20% 额定直流电流；该值针对其举例的 TDK MPZ1608 / Würth 742 792 系列，以所选型号的 DC-bias 曲线为准"
  conflicts: "Renesas AN-805 称接近额定值时阻抗「可能减半」，ADI AN-1368 的曲线显示 50% 额定电流时电感最多降 90%，Abracon 白皮书的例子是 300 mA 偏置下 100 MHz 阻抗由 650 Ω 降到约 110 Ω。降幅与型号相关；结论一致：零偏置阻抗偏乐观。取舍：采用更保守的 ADI 数据并读所选型号的实际曲线。"
  verify:
    - method: bom_check
      tool: "BOM 脚本 + 厂商曲线（Murata SimSurfing / TDK SEAT / Würth REDEXPERT）"
      check: "对每个磁珠，在 I_load 下读目标频率处阻抗 Z_bias，要求 Z_bias ≥ 滤波需求；无曲线时要求 I_load ≤ 0.2 × I_rated"
      automatable: partial
    - method: bench
      tool: "网络分析仪 + 偏置 T 或在线测量"
      check: "带实际负载电流测磁珠插入损耗，与零偏置结果对比"
      automatable: manual
  sources:
    - title: AN-1368 Ferrite Bead Demystified for power-supply filtering (mirror copy)
      url: https://docs.ampnuts.ru/analog.com.datasheet/adp5070/related_data/AN-1368.pdf
      publisher: Analog Devices
      kind: app_note
      section: "DC Bias Current Considerations, Figure 7"
    - title: AN-805 Recommended Ferrite Beads
      url: https://www.renesas.com/en/document/apn/805-recommended-ferrite-beads
      publisher: Renesas
      kind: app_note
    - title: Ferrite Beads Basic Operations and Key Parameters
      url: https://abracon.com/uploads/resources/Ferrite-Beads-White-Paper.pdf
      publisher: Abracon
      kind: vendor_guide
      section: "DC bias"
  confidence: high

- id: EMC-SCH-005
  title: 磁珠要在噪声频段呈电阻性，且与电容的 LC 需阻尼
  domain: emc_esd
  stage: schematic
  severity: should
  rule: 选磁珠时看 Z/R/X 随频率曲线，保证要滤除的噪声频率落在以电阻分量为主的频段；磁珠与去耦电容构成的低通 LC 谐振频率若落在磁珠仍呈电感的区域，必须加阻尼（磁珠自身 DCR、串联电阻或并联 RC），并仿真确认无谐振峰。
  rationale: 磁珠在低频是高 Q 电感，只有在电阻区才真正把噪声转成热；与高 Q 电容组成的欠阻尼滤波器会在谐振点放大噪声而不是衰减，常恰好落在 DC-DC 开关频率附近。
  applies_to: [ferrite-bead, dc-dc, ic-supply]
  parameters:
    - name: lc_resonance_typical_range
      op: range
      value: [0.1, 10]
      unit: MHz
      note: "ADI AN-1368：典型磁珠滤波器的 LC 谐振频率范围；开关频率 300 kHz–5 MHz 时需额外阻尼"
    - name: bead_resistive_region_start
      op: range
      value: [20, 30]
      unit: MHz
      note: "ADI AN-1368 对 TDK MPZ1608S101A 的实例：约 20–30 MHz 以上电阻分量才显著；其他型号请读自己的曲线"
  verify:
    - method: spice
      tool: "ngspice / LTspice，磁珠 R‖L‖C 模型，含 DCR 与负载电流下的电感"
      check: "AC 扫描 IC 侧电压对输入噪声的传递函数，任何频点增益不得 > 0 dB（无放大），并列出谐振频率"
      automatable: full
    - method: bench
      tool: "示波器 / 频谱仪"
      check: "在开关频率及其谐波处测滤波前后纹波，确认衰减而非放大"
      automatable: manual
  sources:
    - title: AN-1368 Ferrite Bead Demystified for power-supply filtering (mirror copy)
      url: https://docs.ampnuts.ru/analog.com.datasheet/adp5070/related_data/AN-1368.pdf
      publisher: Analog Devices
      kind: app_note
      section: "LC Resonance Effect, Damping Methods"
    - title: AN-805 Recommended Ferrite Beads
      url: https://www.renesas.com/en/document/apn/805-recommended-ferrite-beads
      publisher: Renesas
      kind: app_note
  confidence: high

- id: EMC-SCH-006
  title: 出机壳的线在连接器处加小电容到机壳/屏蔽地
  domain: emc_esd
  stage: schematic
  severity: should
  rule: 每根离开外壳的信号线，在连接器处加对机壳/屏蔽地的旁路电容（值小于 1000 pF，典型约 470 pF）或 RC/磁珠滤波，并按优先级从离开外壳的线、离开本板的线、板内高阻线逐级覆盖；电容必须不破坏该信号所需的边沿。
  rationale: 电容既滤掉板内向外传的噪声，也把线缆外部拾取的噪声和 ESD 能量旁路到屏蔽/机壳；小于 1000 pF 是为了在 50–500 MHz 保持低 ESR，SMD 比带引线电容好（带引线电容约 80 MHz 即自谐振）。
  applies_to: [connector, cable, io-port]
  parameters:
    - name: io_filter_cap_max
      op: "<"
      value: 1000
      unit: pF
      note: "SZZA009 §2.5.5 / §3.3：应小于 1000 pF，更可能取 470 pF 左右"
    - name: chassis_connection_length_to_width
      op: "<="
      value: 3
      unit: ratio
      note: "SZZA009 §3.3：到机壳的连接是 RF 路径，长宽比 3:1"
    - name: leaded_cap_self_resonance
      op: "=="
      value: 80
      unit: MHz
      note: "SZZA009 §1.2：带引线电容约 80 MHz 自谐振，之后呈感性"
  verify:
    - method: geometry_script
      tool: "pcbnew Python"
      check: "对每个连接器信号网络确认存在 R/C/磁珠滤波件，且电容另一端接到 chassis/shield 网络；量该连接铜皮的长/宽 ≤ 3"
      automatable: partial
    - method: spice
      tool: "ngspice"
      check: "RC 拐点与信号边沿/带宽对比，确认信号完整性不受损"
      automatable: partial
  sources:
    - title: PCB Design Guidelines For Reduced EMI (SZZA009)
      url: https://www.ti.com/lit/an/szza009/szza009.pdf
      publisher: Texas Instruments
      kind: app_note
      section: "§1.2, §2.2.5, §2.5.4, §2.5.5, §3.3, Figure 13"
  confidence: high
