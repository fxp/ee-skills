- id: EMC-FLR-006
  title: 线缆屏蔽层 360° 端接到壳体，禁用长辫子
  domain: emc_esd
  stage: floorplan
  severity: consider
  rule: 带屏蔽层的线缆，屏蔽层沿圆周 360° 端接到连接器金属壳/机壳，而不是用长辫子（pigtail）接到 PCB 地；确需辫子时尽量短并记录。屏蔽应当像一块断点最少、阻抗最小的 RF 导电面。
  rationale: 辫子带来额外电感，使屏蔽层的转移阻抗在高频升高。搜索结果中的二手资料给出的量级：25 mm 辫子约 25 nH，而 360° 端接小于 1 nH；In Compliance 一文称即便 5 mm 辫子在 1 MHz–1 GHz 也比 360° 端接差 10–20 dB（本次未能打开原文，数值仅供参考）。
  applies_to: [shielded-cable, connector]
  verify:
    - method: review
      tool: "机械/线束评审"
      check: "屏蔽线缆的端接图纸为 360° 压接或背壳，而非单根引出线"
      automatable: manual
    - method: emc_precompliance
      tool: "电流探头 + 近场探头"
      check: "比较屏蔽层端接前后线缆共模电流谱"
      automatable: manual
  sources:
