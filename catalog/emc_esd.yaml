- id: EMC-PLC-004
  title: 电机抑制电容和续流件贴电机/感性负载
  domain: emc_esd
  stage: placement
  severity: should
  rule: 电机的跨端子电容和对外壳电容焊在电机壳体上（越近越好）；PCB 上若还有一组，放在电机连接器焊盘旁；续流二极管物理上尽量靠近被开关的感性负载。
  rationale: 电刷电弧噪声在电机壳体处产生，电容离电机越近越能在噪声进入引线前将其旁路；二极管靠近电感可缩小流过高压尖峰的电路范围、降低辐射。
  applies_to: [brushed-dc-motor, relay, solenoid]
  parameters:
    - name: motor_cap_to_motor_distance
      op: minimize
      value: null
      note: "Pololu：尽量靠近电机壳体；PMD：尽量靠近电机；来源未给毫米数"
  verify:
    - method: review
      tool: "装配图/线束图评审"
      check: "电机壳上的电容在线束图中有明确焊接位置和尺寸；PCB 上有对应预留焊盘"
      automatable: manual
    - method: geometry_script
      tool: "pcbnew Python"
      check: "续流二极管焊盘到被钳位线圈/电机连接器焊盘的距离，输出并列最远者"
      automatable: partial
