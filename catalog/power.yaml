- id: PWR-SCH-001
  title: 保险丝（PPTC）放在 TVS 上游
  domain: power
  stage: schematic
  severity: should
  rule: 电源入口按「连接器 -> （反接保护）-> 保险丝/PPTC -> TVS 并联到地 -> 后级」排列，TVS 放在保险丝之后，使 TVS 短路失效时保险丝能把电路断开。
  rationale: TVS 过载通常先失效为短路，若无串联保险丝，电源会持续灌电流进入已短路的 TVS，可能起火；保险丝也提供串联电感，让 TVS 夹住保险丝/导线电感释放的反冲电压。
  applies_to: [power-entry, tvs, pptc, fuse]
  verify:
    - method: review
      tool: "原理图评审清单"
      check: "沿电源入口画出网络顺序，确认 TVS 的阳极接地、阴极接在保险丝之后；保险丝额定 I2t 小于 TVS 的耐受能力；PPTC 的 Vmax/Imax 大于电路最大电压和最大故障电流。"
      automatable: partial
    - method: spice
      tool: "ngspice 瞬态"
      check: "仿真 TVS 短路故障：电源内阻 + 线缆电阻下，保险丝/PPTC 应在规定时间内断开，TVS 平均功耗不超过额定。"
      automatable: partial
  sources:
    - title: "Failure Modes and Fusing of TVS Devices (App Note 88440)"
      url: "https://www.vishay.com/docs/88440/failurem.pdf"
      publisher: "Vishay General Semiconductor"
      kind: app_note
      section: "Fig. 2 Fuse location relative to TVS device"
    - title: "Selecting TVS Diodes in Hot-swap and ORing Applications"
      url: "https://www.ti.com/lit/pdf/sszt363"
      publisher: "Texas Instruments"
      kind: app_note
      section: "TVS placement after series inductance such as a fuse"
    - title: "TPD1E6B06: Placement of TVS Diode and Fuse with ISO1044 (E2E, 未能打开原文，仅见搜索摘要)"
      url: "https://e2e.ti.com/support/interface-group/interface/f/interface-forum/1433757/tpd1e6b06-placement-of-tvs-diode-and-fuse-with-iso1044"
      publisher: "TI E2E"
      kind: forum
  confidence: medium
  conflicts: "来源分歧：Vishay 与 TI SSZT363 把保险丝/串联电感放在 TVS 之前（保险丝上游，TVS 在其后）；另有 TI E2E 放大器论坛一个回帖（搜索摘要所见，未能打开原文）给出『连接器 -> TVS -> 电子保险丝 -> EMI 滤波』的顺序，其理由是 ESD/快速瞬态要在连接器处就被钳位。取舍：电源电压轨的浪涌+持续过流场景，保险丝在前（Vishay 为厂商应用笔记，且逻辑自洽：TVS 短路失效必须被保险丝清除）；信号线 ESD 才把 TVS 放最靠近连接器。若两者都需要，可在连接器处加小型 ESD 二极管，再接保险丝、再接大功率 TVS。"
  tags: [cat-feeder]

- id: PWR-SCH-002
  title: 提供真正串联的反接保护，并核算反接时的应力
  domain: power
  stage: schematic
  severity: should
  rule: 对用户可能接反的 DC 输入，在保险丝之后优先用串联元件阻断反向（肖特基二极管、高边 P-MOSFET 或理想二极管控制器）；若只靠并联 TVS 反向导通加保险丝熔断来「保护」，必须核算 TVS 正向浪涌能力和保险丝的断开时间。
  rationale: 串联二极管/P-FET 能让负电压根本进不到后级；并联方案要靠大电流熔断保险丝，期间 TVS 与走线承受大电流，PPTC 还要靠自热翻转，时间长。肖特基反向漏电随结温剧增，P-FET 本身不阻断反向电流。
  applies_to: [power-entry, reverse-polarity, tvs, pptc]
  verify:
    - method: spice
      tool: "ngspice 瞬态"
      check: "在输入加 -Vin，电源内阻按实际适配器输出能力建模，读 TVS 正向电流和 PPTC 翻转时间；要求 TVS 的正向非重复峰值电流额定（数据手册 IFSM）大于仿真峰值，且后级节点反向电压不超过其绝对最大负压。"
      automatable: partial
    - method: bench
      tool: "限流可调电源"
      check: "用限流电源反接，逐步提高限流，读后级节点电压和元件温度，确认无损坏。"
      automatable: manual
    - method: review
      tool: "原理图评审"
      check: "P-FET 方案须核对：体二极管方向与正常电流方向相同、Vgs 不超过 FET 最大 Vgs（必要时加稳压管钳位）。"
      automatable: manual
  sources:
    - title: "Reverse Current/Battery Protection Circuits (SLVA139)"
      url: "https://www.ti.com/lit/an/slva139/slva139.pdf"
      publisher: "Texas Instruments"
      kind: app_note
    - title: "Basics of Ideal Diodes (SLVAE57B)"
      url: "https://www.ti.com/lit/an/slvae57b/slvae57b.pdf"
      publisher: "Texas Instruments"
      kind: app_note
      section: "§2 Schottky; §4 P-channel MOSFET; §5 Reverse polarity vs reverse current blocking"
    - title: "Failure Modes and Fusing of TVS Devices (App Note 88440)"
      url: "https://www.vishay.com/docs/88440/failurem.pdf"
      publisher: "Vishay General Semiconductor"
      kind: app_note
  confidence: medium
  tags: [cat-feeder]

- id: PWR-SCH-003
  title: PPTC 按最高环境温度下的保持电流选型
  domain: power
  stage: schematic
  severity: should
  rule: 选 PPTC 时用最高工作温度的热降额曲线，使 Ihold(Tmax) 不低于正常工作电流（含电机启动/Wi-Fi 峰值的有效值），并确认器件 Vmax、Imax 高于电路最高电压和最大故障电流；最后在实机上试验。
  rationale: PPTC 的保持电流随温度下降，热态时可能在正常峰值负载下误翻转；而它还会在回路中引入电阻和压降，影响 LDO 压差裕量。
  applies_to: [pptc, power-entry]
  parameters:
    - name: trip_test_multiple
      op: "=="
      value: 5
      unit: "x Ihold"
      note: "Bourns MF-R 等系列数据手册的 Time to Trip 在 5 倍 Ihold、Vmax、23 C 下规定（其余系列在各自规定的电流下），不是所有系列都用 5 倍；翻转时间随故障电流变化，需查所选型号曲线。"
  verify:
    - method: bom_check
      tool: "Python 读 BOM + PPTC 降额表"
      check: "取 Tmax_ambient 对应的降额后 Ihold，要求 >= 1.2 倍的持续最大电流（1.2 为工程余量，非来源数值）；检查 Vmax >= 最高电源电压、Imax >= 电源最大短路电流。"
      automatable: partial
    - method: bench
      tool: "恒温箱 + 电流记录"
      check: "在最高环境温度下运行最重负载序列（电机启动、堵转 N 秒、Wi-Fi 发射）30 min，PPTC 不得翻转；另做堵转测试确认其在预期时间内翻转。"
      automatable: manual
  sources:
    - title: "Multifuse PTC Resettable Fuses Solutions Guide, Product Selection Worksheet"
      url: "https://www.bourns.com/pdfs/mfsolgd.pdf"
      publisher: "Bourns"
      kind: vendor_guide
      section: "Multifuse Product Selection Worksheet, steps 1-8"
  confidence: medium
  tags: [cat-feeder]

- id: PWR-SCH-004
  title: TVS 按击穿电压、钳位电压、峰值电流三条选型
  domain: power
  stage: schematic
  severity: should
  rule: 电源轨 TVS 须同时满足：反向击穿电压 VBR 大于该轨最高工作电压；钳位电压 VC（在峰值脉冲电流下）低于后级所有器件的绝对最大额定值；峰值脉冲电流额定 IPP 大于预期浪涌电流。
  rationale: VBR 太低会在正常波动时漏电发热；VC 过高保护不了后级；IPP 不足时 TVS 先于被保护器件失效。
  applies_to: [tvs, power-entry]
  verify:
    - method: bom_check
      tool: "Python 读 BOM 的 TVS 参数 + 后级绝对最大额定值表"
      check: "三条判据逐项比较：VBR_min > Vrail_max；VC_max@IPP < min(后级 Abs Max Vin)；IPP > 预期峰值电流。"
      automatable: full
    - method: spice
      tool: "ngspice，TVS 用分段模型"
      check: "在输入叠加预期浪涌波形，读后级节点电压最大值，要求低于后级绝对最大电压。"
      automatable: partial
  sources:
    - title: "Selecting TVS Diodes in Hot-swap and ORing Applications"
      url: "https://www.ti.com/lit/pdf/sszt363"
      publisher: "Texas Instruments"
      kind: app_note
      section: "How do you choose a TVS diode?"
    - title: "Failure Modes and Fusing of TVS Devices (App Note 88440)"
      url: "https://www.vishay.com/docs/88440/failurem.pdf"
      publisher: "Vishay General Semiconductor"
      kind: app_note
      section: "threat levels defined by peak current and waveform"
  confidence: high
  tags: [cat-feeder]

- id: PWR-SCH-005
  title: 线缆热插拔的输入端抑制陶瓷电容谐振过冲
  domain: power
  stage: schematic
  severity: should
  rule: 通过线缆/连接器热插拔带电电源时，若输入端只有低 ESR 陶瓷电容，需并联带 ESR 的大电容（电解/聚合物/钽），或给陶瓷电容串联小电阻，以阻尼电缆电感与陶瓷电容形成的 LC 谐振。
  rationale: 线缆电感与陶瓷输入电容构成低阻尼谐振，插入瞬间输入电压可冲到约 2 倍电源电压，超过稳压器绝对最大额定值；高 ESR 电容提供阻尼。
  applies_to: [power-entry, hot-plug, mlcc, buck, ldo]
  parameters:
    - name: hotplug_overshoot_ratio_worst
      op: "<="
      value: 2
      unit: "x Vsupply"
      note: "AN88 的转载版（EDN/Evertiq）与 ADI 搜索摘要一致：电压尖峰「可以轻易达到输入电压阶跃幅度的 2 倍」，即约 2 倍电源电压；ADI 官网 PDF 本次未能打开（超时），量级需自行用仿真确认。"
  verify:
    - method: spice
      tool: "ngspice 瞬态"
      check: "电源阶跃叠加线缆电感 0.5~2 uH 与 ESR 参数、输入陶瓷电容，读输入节点电压峰值，要求不超过稳压器 Vin 绝对最大额定值的 90%（90% 为工程余量，来源未给）。"
      automatable: partial
    - method: bench
      tool: "示波器 + 带电插拔"
      check: "用已上电的适配器反复热插入，捕获输入引脚上的最大电压，要求低于器件绝对最大额定值并留出余量。"
      automatable: manual
  sources:
    - title: "AN88 Ceramic Input Capacitors Can Cause Overvoltage Transients (未能打开原文，据搜索结果摘要)"
      url: "https://www.analog.com/media/en/technical-documentation/application-notes/an88f.pdf"
      publisher: "Analog Devices (Linear Technology)"
      kind: app_note
    - title: "Buck Converter - application guide (input LC filter damping)"
      url: "https://www.we-online.com/en/components/applicationguide/buck_converter"
      publisher: "Wurth Elektronik"
      kind: vendor_guide
      section: "Input filter / damping with high-ESR electrolytic"
  confidence: medium
