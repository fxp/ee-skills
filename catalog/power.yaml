- id: PWR-SCH-006
  title: 陶瓷电容按直流偏置、温度、公差降额后再核算
  domain: power
  stage: schematic
  severity: should
  rule: 任何依赖电容值的功能（LDO/降压输出和输入电容、保持电容）都要用有效电容值：由厂商直流偏置曲线、温度特性和公差逐项降额后，仍满足最小电容要求；介质用 X5R 或更好。
  rationale: 铁电陶瓷的电容随直流电压下降，TI SSZT654 案例中 10 uF/0603/X7R 在偏置下只剩约 7 uF，再经 125 C 高温（-15%）和 ±20% 公差，文中得约 3.5 uF（该文逐步算术并不严格自洽：7*0.85*0.8 约 4.8 uF，但结论相同，即不足标称值的一半）；大封装降额更小。
  applies_to: [mlcc, ldo, buck, boost]
  parameters:
    - name: capacitance_tolerance_assumed
      op: "=="
      value: 20
      unit: "%"
      note: "TI SSZT654 用 ±20% 公差做例子；TI SLYT670 用 10% 公差。以所选型号的实际公差为准。"
    - name: dielectric_minimum
      op: qualitative
      value: null
      note: "TI SLVA477：介质须为 X5R 或更好，否则偏置和温度下损失过大。"
  verify:
    - method: bom_check
      tool: "Python 读 BOM + 厂商直流偏置数据"
      check: "对每个对电容有下限要求的位置：C_eff = C_nom * f_bias(Vdc, 封装) * f_temp(Tmax) * (1 - tol)；要求 C_eff >= 稳压器数据手册的最小电容（或环路需要的值）。无偏置数据则按 C_eff <= 50% C_nom 保守处理（50% 为工程保守值，非来源数值）。"
      automatable: partial
    - method: spice
      tool: "ngspice，.step 电容值"
      check: "把电容设为 C_eff 的最坏值，复跑环路增益与负载阶跃，见 PWR-VER-001。"
      automatable: partial
  sources:
    - title: "LDO Basics: Capacitor vs. Capacitance (SSZT654)"
      url: "https://www.ti.com/lit/pdf/sszt654"
      publisher: "Texas Instruments"
      kind: vendor_guide
    - title: "Ceramic or electrolytic output capacitors in DC/DC converters - Why not both? (SLYT639)"
      url: "https://www.ti.com/lit/an/slyt639/slyt639.pdf"
      publisher: "Texas Instruments"
      kind: app_note
    - title: "How to select input capacitors for a buck converter (SLYT670)"
      url: "https://www.ti.com/lit/an/slyt670/slyt670.pdf"
      publisher: "Texas Instruments"
      kind: app_note
    - title: "Basic Calculation of a Buck Converter's Power Stage (SLVA477)"
      url: "https://www.ti.com/lit/pdf/slva477"
      publisher: "Texas Instruments"
      kind: app_note
      section: "§6-§7"
  confidence: high
  tags: [cat-feeder]

- id: PWR-SCH-007
  title: AMS1117 输出用满足 ESR 窗口的钽电容
  domain: power
  stage: schematic
  severity: must
  rule: AMS1117/LM1117 类 LDO 的输出电容用 >=10 uF 钽电容（或等效的电解），ESR 须落在数据手册给定窗口内；AMS1117 数据手册要求 ESR 不超过 0.5 ohm，TI LM1117 要求 0.3~22 ohm；不要在不验证的情况下换成纯陶瓷。
  rationale: 这类 LDO 靠输出电容 ESR 提供补偿零点（10 uF 钽 ESR 约 0.5 ohm，零点约 30 kHz）；10 uF 陶瓷 ESR 仅 5 mohm，零点在 3 MHz 以上，相位裕量不足，输出会振荡。
  applies_to: [ldo, ams1117, lm1117]
  parameters:
    - name: cout_min_tantalum
      op: ">="
      value: 10
      unit: uF
      note: "AMS1117 与 LM1117 数据手册均写：输出至少 10 uF 钽电容。"
    - name: cout_esr_max_ams1117
      op: "<="
      value: 0.5
      unit: ohm
      note: "AMS1117 数据手册 Output Capacitor 一节。"
    - name: cout_esr_range_lm1117
      op: range
      value: [0.3, 22]
      unit: ohm
      note: "TI LM1117 §9.2.2.1.3。"
  verify:
    - method: bom_check
      tool: "BOM 检查脚本"
      check: "输出电容类型为钽/聚合物时读其 100 kHz 下 ESR，要求落在 [0.3, 0.5] ohm（两份数据手册窗口的交集）；若为纯 MLCC，判不通过并要求加串联电阻或改型号。"
      automatable: partial
    - method: spice
      tool: "ngspice AC / 阶跃负载"
      check: "在输出端用 ESR(f) 模型的 Cout，做 10%~90% 负载阶跃，初始尖峰之后振铃不超过 4 次（SLVA115A：通常 4 个振铃以内表示相位裕量足够）；AC 相位裕量 >= 45 度（45 度为工程取值，非 SLVA115A 数值）。"
      automatable: partial
    - method: bench
      tool: "示波器 + MOSFET 开关负载阶跃"
      check: "按 TI SLVA115A 的阶跃负载方法（MOSFET 开关 + 函数发生器）观察输出振铃。"
      automatable: manual
  sources:
    - title: "AMS1117 datasheet (SLKOR copy) - Output Capacitor"
      url: "https://mm.digikey.com/Volume0/opasdata/d220001/medias/docus/8122/AMS11173.3SOT223.pdf"
      publisher: "Advanced Monolithic Systems / SLKOR"
      kind: datasheet
      section: "Application Information, Output Capacitor"
    - title: "LM1117 800-mA Low-Dropout Linear Regulator"
      url: "https://www.ti.com/lit/ds/symlink/lm1117.pdf"
      publisher: "Texas Instruments"
      kind: datasheet
      section: "§9.2.2.1.3 Output Capacitor"
    - title: "AN-1482 LDO Regulator Stability Using Ceramic Output Capacitors"
      url: "https://www.ti.com/lit/an/snva167a/snva167a.pdf"
      publisher: "Texas Instruments"
      kind: app_note
      section: "§5-§6"
  confidence: high
  conflicts: "两份数据手册说法不同：AMS1117 只给 ESR 上限 0.5 ohm（不给下限），LM1117 给 0.3~22 ohm；另有第三方博客声称 AMS1117 要求 0.3~22 ohm（未能核实到厂商原文）。取舍：按交集 0.3~0.5 ohm 选型最稳妥，再用阶跃负载实测；实际采购的『1117』克隆厂商版本之间差异大，务必看自己那一版数据手册。也有人在不加补偿时用陶瓷电容勉强工作，但属于不可靠的边际条件，不收为通过判据。"
  tags: [cat-feeder]

- id: PWR-SCH-008
  title: 限制 LDO 输出端并联的小陶瓷旁路电容
  domain: power
  stage: schematic
  severity: should
  rule: 对依赖 ESR 补偿的老式 LDO，输出节点附近不要堆放大量 0.01~0.1 uF 陶瓷旁路电容；各芯片 VCC 去耦应离 LDO 输出足够远，或经串联电感/磁珠隔离，并在整板装好后用负载阶跃验证。
  rationale: 并联在大钽电容旁的小陶瓷电容并不会被「淹没」，它和输出阻抗形成新的极点：TI 例中十个 0.1 uF（共 1 uF）使极点落在 370 kHz，相位裕量从 68 度掉到约 9 度。
  applies_to: [ldo, ams1117, decoupling]
  parameters:
    - name: problematic_bypass_cap_range
      op: range
      value: [0.01, 0.1]
      unit: uF
      note: "TI AN-1482 §8：此范围的陶瓷电容最容易出问题。"
    - name: example_total_ceramic_pole
      op: "=="
      value: 370
      unit: kHz
      note: "AN-1482 式 (10)：ROUT=0.43 ohm、C=1 uF 时的附加极点；该例子使相位裕量 68 度降为约 9 度。"
  verify:
    - method: spice
      tool: "ngspice AC"
      check: "LDO 输出节点接 Cout(含 ESR) 和全部陶瓷旁路电容总和（含各自走线电感 5~20 nH），读穿越频率处相位裕量，要求 >= 45 度。"
      automatable: partial
    - method: bench
      tool: "示波器 + 阶跃负载"
      check: "AN-1482 §8 方法：装好所有电容、拆掉被供电 IC，用等效电阻做 0->额定负载阶跃，输出若有明显振铃说明相位裕量低。"
      automatable: manual
  sources:
    - title: "AN-1482 LDO Regulator Stability Using Ceramic Output Capacitors"
      url: "https://www.ti.com/lit/an/snva167a/snva167a.pdf"
      publisher: "Texas Instruments"
      kind: app_note
      section: "§7-§8"
  confidence: high
  tags: [cat-feeder]

- id: PWR-SCH-009
  title: 降压输出电容按有效电容和穿越频率阻抗核算
  domain: power
  stage: schematic
  severity: should
  rule: 降压输出电容总量要满足纹波 dVout≈dIL*Zout(fsw) 和负载阶跃过冲 dV≈dIout*Zout(fc)，其中陶瓷电容用降额后的有效值；若混用电解/聚合物与陶瓷，要重新核对环路补偿。
  rationale: 陶瓷在偏置下常只剩不到一半的标称电容；输出电容的阻抗在环路穿越频率处决定了负载阶跃的过冲/下冲，而其 ESR 与容值也影响环路零极点。
  applies_to: [buck, boost]
  parameters:
    - name: crossover_over_fsw
      op: range
      value: [0.1, 0.2]
      unit: "fc/fsw"
      note: "TI SLYT639：穿越频率通常设为开关频率的 1/10；TI 补偿文章为 1/5~1/10。"
  verify:
    - method: spice
      tool: "ngspice 瞬态 + AC"
      check: "用 C_eff 与 ESR 扫描负载阶跃，读 Vout 过冲/下冲和稳态纹波，要求在系统允许的 dV 以内，并保持环路相位裕量。"
      automatable: partial
    - method: bom_check
      tool: "Python 计算"
      check: "按数据手册推荐的最小/最大输出电容范围核对 C_eff(降额后) 落入范围，内补偿芯片尤其要用推荐的 L、C 组合。"
      automatable: full
  sources:
    - title: "Ceramic or electrolytic output capacitors in DC/DC converters - Why not both? (SLYT639)"
      url: "https://www.ti.com/lit/an/slyt639/slyt639.pdf"
      publisher: "Texas Instruments"
      kind: app_note
      section: "Eq. 1-2 and surrounding text"
    - title: "Basic Calculation of a Buck Converter's Power Stage (SLVA477)"
      url: "https://www.ti.com/lit/pdf/slva477"
      publisher: "Texas Instruments"
      kind: app_note
      section: "§7 Output Capacitor Selection"
  confidence: high

- id: PWR-SCH-010
  title: 降压输入电容核算纹波有效值并并联高频旁路电容
  domain: power
  stage: schematic
  severity: should
  rule: 降压输入端除满足数据手册最小输入电容外，要用最坏占空比核算输入纹波电流有效值（约 Iout*sqrt(D*(1-D))，D=0.5 时最大）不超过陶瓷电容的纹波电流额定，并并联 0.1~0.47 uF 的 X5R/X7R 高频旁路电容。
  rationale: 降压变换器的输入电流是脉动的，输入电容要提供其交流分量；大容量电容高频特性差，快沿电流主要靠小电容。
  applies_to: [buck]
  parameters:
    - name: hf_bypass_capacitance
      op: range
      value: [0.1, 0.47]
      unit: uF
      note: "TI AN-1229 与 ROHM 60AN066E：X5R/X7R 贴片陶瓷。"
  verify:
    - method: bom_check
      tool: "Python 计算"
      check: "I_in_rms = Iout*sqrt(D*(1-D)) 在 Vin_max、Vin_min 两端取最大，对比所选电容在 fsw 下的额定纹波电流（按并联个数和降额）；同时用偏置曲线核有效电容。"
      automatable: full
    - method: spice
      tool: "ngspice"
      check: "满载稳态仿真，读输入电容电流有效值和输入电压纹波。"
      automatable: partial
  sources:
    - title: "How to select input capacitors for a buck converter (SLYT670)"
      url: "https://www.ti.com/lit/an/slyt670/slyt670.pdf"
      publisher: "Texas Instruments"
      kind: app_note
    - title: "PCB Layout Techniques of Buck Converter (60AN066E)"
      url: "https://fscdn.rohm.com/en/products/databook/applinote/ic/power/switching_regulator/converter_pcb_layout_appli-e.pdf"
      publisher: "ROHM"
      kind: app_note
      section: "§3 Placing of input capacitor and free-wheel diode"
    - title: "AN-1229 SIMPLE SWITCHER PCB Layout Guidelines"
      url: "https://www.ti.com/lit/an/snva054c/snva054c.pdf"
      publisher: "Texas Instruments"
      kind: app_note
      section: "§4"
  confidence: medium

- id: PWR-SCH-011
  title: 电机 MOSFET 栅极加下拉电阻和串联电阻
  domain: power
  stage: schematic
  severity: should
  rule: 由 MCU GPIO 驱动的电机 MOSFET，在栅极到源极间并联约 10 kohm 下拉电阻，使 GPIO 高阻（复位/启动阶段）时管子保持关断；栅极串联电阻按栅极回路阻尼选取，从 0 ohm 起加到振铃消失。
  rationale: 栅极悬空时 MOSFET 可能保持导通，电机在复位期间意外转动；栅极回路的寄生电感与 Ciss 谐振，需要串联电阻使品质因数 Q 落在 0.5~1。
  applies_to: [mosfet, motor-drive, gpio-drive]
  parameters:
    - name: gate_source_pulldown
      op: "=="
      value: 10
      unit: kohm
      note: "Infineon 栅极驱动应用笔记：kΩ 级，典型 10 kΩ，强烈建议。"
    - name: gate_loop_q_target
      op: range
      value: [0.5, 1]
      unit: Q
      note: "TI SLLA385：选择 RG 使 Q 在 0.5（临界阻尼）到 1（欠阻尼）之间；Q 越大开关越快。AO3400A 内部栅极电阻 Rg 典型 3 ohm、Ciss 典型 630 pF。"
  verify:
    - method: erc
      tool: "KiCad ERC + 自定义检查"
      check: "每个功率 MOSFET 的栅极网络都必须有到源极的下拉电阻，阻值在 4.7~100 kohm（来源只给 10 kohm 典型，范围为工程判断）。"
      automatable: full
    - method: spice
      tool: "ngspice 瞬态，含栅极回路电感 5~20 nH"
      check: "GPIO 阶跃驱动，读 Vgs 过冲，要求不超过 MOSFET 绝对最大 Vgs（AO3400A 为 ±12 V），且无多次开关式振荡。"
      automatable: partial
    - method: bench
      tool: "示波器"
      check: "复位和上电时观察栅极电压和电机端电压，确认复位期间管子保持关断。"
      automatable: manual
  sources:
    - title: "Gate drive for power MOSFETs in switching applications"
      url: "https://www.infineon.com/dgdl/Infineon-Gate_drive_for_power_MOSFETs_in_switchtin_applications-ApplicationNotes-v01_00-EN.pdf?fileId=8ac78c8c80027ecd0180467c871b3622"
      publisher: "Infineon"
      kind: app_note
      section: "gate drive circuit (RG and RGS)"
    - title: "External Gate Resistor Design Guide for Gate Drivers (SLLA385)"
      url: "https://www.ti.com/lit/pdf/slla385"
      publisher: "Texas Instruments"
      kind: app_note
    - title: "EiceDRIVER Gate resistor for power devices"
      url: "https://www.infineon.com/assets/row/public/documents/24/42/infineon-eicedriver-gate-resistor-for-power-devices-applicationnotes-en.pdf"
      publisher: "Infineon"
      kind: app_note
      section: "§3.4 Gate ringing"
  confidence: high
  tags: [cat-feeder]

- id: PWR-SCH-012
  title: 电机两端并联续流二极管并核算额定值
  domain: power
  stage: schematic
  severity: must
  rule: 单管开关的有刷直流电机必须在电机绕组两端反并联一个续流（flyback）二极管，阴极接电机正端；二极管的平均电流额定不低于电机堵转电流，反向耐压高于电源并留余量，并在布局上靠近电机接线端子。
  rationale: 关断时电机电感电流不能突变，没有续流路径时漏极电压会飙升并迫使 MOSFET 雪崩；MOSFET 体二极管不在这个方向上起保护作用，且额定值有限（AO3400A 体二极管连续电流仅 2 A）。
  applies_to: [motor-drive, brushed-dc-motor, low-side-switch, mosfet]
  parameters:
    - name: ao3400a_body_diode_current_max
      op: "<="
      value: 2
      unit: A
      note: "AO3400A 数据手册：体二极管最大连续电流 IS 2 A，Vsd 最大 1 V。"
  verify:
    - method: netlist_diff
      tool: "kicad-cli 网表 + Python"
      check: "对每个驱动电感性负载的 MOSFET，其漏极网络上必须存在一个二极管，阳极接漏极网络、阴极接电机正电源网络；缺失则报错。"
      automatable: full
    - method: geometry_script
      tool: "pcbnew Python"
      check: "测二极管焊盘到电机接线端子焊盘的距离，要求短于二极管到 MOSFET 的距离（来源未给数值，仅为方向性要求）。"
      automatable: partial
    - method: spice
      tool: "ngspice 瞬态，电机用 R-L-反电势模型"
      check: "堵转电流下关断，读漏极峰值电压，要求小于 MOSFET VDS 绝对最大额定值（AO3400A 为 30 V）并留余量。"
      automatable: partial
  sources:
    - title: "AO3400A 30V N-Channel MOSFET datasheet (Alpha & Omega, Rev 3)"
      url: "https://static.datasheets.com/doc/21789847-alpha-omega-ao3400a-ds.pdf"
      publisher: "Alpha & Omega Semiconductor"
      kind: datasheet
      section: "Electrical Characteristics (IS, VSD)"
    - title: "Gate drive for power MOSFETs in switching applications (freewheeling rectifier in inductive-load switching)"
      url: "https://www.infineon.com/dgdl/Infineon-Gate_drive_for_power_MOSFETs_in_switchtin_applications-ApplicationNotes-v01_00-EN.pdf?fileId=8ac78c8c80027ecd0180467c871b3622"
      publisher: "Infineon"
      kind: app_note
      section: "Gate input characteristics, Figure 9"
    - title: "Flyback Diode: Protecting Relay and Motor Driver Circuits (搜索结果所见，未深读)"
      url: "https://zbotic.in/flyback-diode-protecting-relay-and-motor-driver-circuits/"
      publisher: "Zbotic"
      kind: blog
    - title: "Back EMF protection diodes with inductive loads (搜索结果所见，未深读)"
      url: "https://picaxeforum.co.uk/threads/back-emf-protection-diodes-with-inductive-loads.23155/"
      publisher: "PICAXE forum"
      kind: forum
  confidence: medium
  tags: [cat-feeder]

- id: PWR-SCH-013
  title: 有刷电机接线端并联 0.1 uF 陶瓷电容
  domain: power
  stage: schematic
  severity: should
  rule: 有刷直流电机的两个接线端之间并联 1 个 0.1 uF 非极性陶瓷电容，必要时再从每个端子到电机外壳各加一个，电容就近焊在电机外壳处。
  rationale: 电刷弹跳与绕组电感会在电源线上产生大量噪声，并能耦合进邻近信号线，使电源电压凹陷导致 MCU 复位；电容就地吸收这些宽带噪声。
  applies_to: [motor-drive, brushed-dc-motor]
  parameters:
    - name: motor_terminal_capacitance
      op: "=="
      value: 0.1
      unit: uF
      note: "Pololu：一到三个 0.1 uF 陶瓷电容；正反转电机不能用有极性电容。"
    - name: motor_cap_count
      op: range
      value: [1, 3]
      unit: pcs
      note: "1 个跨端子；2 个各端子对外壳；3 个全部（噪声抑制最好）。"
  verify:
    - method: review
      tool: "原理图/板级评审"
      check: "电机接线端子旁(或电机外壳上)有跨端子的 0.1 uF 非极性电容；电容额定电压高于电源电压并留余量(来源未给倍数)。"
      automatable: partial
    - method: emc_precompliance
      tool: "近场探头 + 示波器"
      check: "电机运行时测 3.3 V 轨和 ADC/HX711 输入上的电刷噪声，加/不加电容对比；若 0.1 uF 效果不足，可试更大的容值（论坛上见到过 0.68 uF 的有效案例，未经证实）。"
      automatable: manual
  sources:
    - title: "Dealing with Motor Noise (Application Note: Using the Motor Driver on the 3pi Robot and Orangutan Robot Controllers)"
      url: "https://www.pololu.com/docs/0J15/9"
      publisher: "Pololu"
      kind: vendor_guide
      section: "§9 Dealing with Motor Noise"
  confidence: medium
  tags: [cat-feeder]

- id: PWR-SCH-014
  title: 上电复位时序：电源稳定后再使能，慢速斜坡加监控芯片
  domain: power
  stage: schematic
  severity: should
  rule: ESP32-C3 的 CHIP_EN 必须在 3.3 V 轨稳定至少 50 us 之后才拉高，不可悬空；用 RC 延时（典型 R=10 kohm，C=1 uF）保证时序，电源上升慢、反复通断或不稳定时，加阈值约 3.0 V 的电压监控芯片。
  rationale: 电源轨未稳定就使能会引起启动失败或 Flash 擦写失败；PPTC、长线缆和电机启动造成的电源波动都可能让 RC 延时电路不足。
  applies_to: [esp32-c3, power-sequencing, brown-out]
  parameters:
    - name: t_stbl_min
      op: ">="
      value: 50
      unit: us
      note: "Espressif 表：电源稳定到 CHIP_EN 拉高的最小时间。"
    - name: t_rst_min
      op: ">="
      value: 50
      unit: us
      note: "CHIP_EN 保持低电平复位的最小时间。"
    - name: chip_en_rc
      op: qualitative
      value: null
      note: "R=10 kohm、C=1 uF 为典型值，需按实际电源上升/下降特性调整。"
    - name: supervisor_threshold
      op: "=="
      value: 3.0
      unit: V
      note: "监控芯片阈值推荐约 3.0 V。"
  verify:
    - method: spice
      tool: "ngspice 瞬态，含 PPTC、LDO 软启动和 RC"
      check: "仿真上电斜坡(含慢斜坡 10 ms~100 ms)，读 3.3 V 轨达到 3.0 V 的时刻与 CHIP_EN 越过 VIH 的时刻，要求 CHIP_EN 晚至少 50 us 且 3.3 V 此后不再低于 3.0 V。"
      automatable: full
    - method: bench
      tool: "示波器双通道"
      check: "重复上电/掉电和电机堵转扰动，观察 3.3 V 与 CHIP_EN，确认无欠压下的误启动。"
      automatable: manual
  sources:
    - title: "ESP Hardware Design Guidelines - ESP32-C3, Chip Power-up and Reset Timing"
      url: "https://docs.espressif.com/projects/esp-hardware-design-guidelines/en/latest/esp32c3/esp-hardware-design-guidelines-en-master-esp32c3.pdf"
      publisher: "Espressif"
      kind: vendor_guide
      section: "§1.3.3"
  confidence: high
  tags: [cat-feeder]

- id: PWR-SCH-015
  title: 电源上的磁珠/LC 滤波器按偏置降额并阻尼
  domain: power
  stage: schematic
  severity: should
  rule: 在电源轨上串磁珠或电感做滤波时，直流偏置电流不得超过额定电流的约 30%~40%，核对偏置下的阻抗曲线；磁珠与后级电容的 LC 谐振要加阻尼，且不要放在大阶跃负载（如 Wi-Fi 发射）的供电路径上而不核算压降。ESP32-C3 的 VDD3P3 LC 滤波电感额定电流宜在 500 mA 以上。
  rationale: 磁珠饱和后电感下降 50% 以上、阻抗减半；磁珠与电容形成高 Q 谐振，在谐振点附近反而放大噪声，若恰在开关频率附近更糟。
  applies_to: [ferrite-bead, lc-filter, pdn, esp32-c3]
  parameters:
    - name: bead_bias_fraction_of_rated
      op: "<="
      value: 0.4
      unit: fraction
      note: "Weir：直流偏置超过额定电流的 30%~40% 时，等效电感可下降 50% 以上；越靠近额定电流阻抗越低（Renesas AN-805 也提到阻抗可减半）。"
    - name: lc_filter_inductor_rated_current
      op: ">="
      value: 500
      unit: mA
      note: "Espressif：VDD3P3 的 LC 电路，电感额定电流最好 500 mA 以上。"
    - name: dominant_pole_damping_cap_ratio
      op: "=="
      value: 5
      unit: "x C"
      note: "Weir：用 CDP = 5C 的阻尼电容(串联电阻 RDP)形成主极点，通常是好的折中。"
  verify:
    - method: spice
      tool: "ngspice AC，磁珠用偏置下实测或手册阻抗数据建模"
      check: "扫频读磁珠+电容滤波器的插入增益，谐振点附近的峰值须小于 3 dB(来源未给通过值，仅要求无明显放大)，并核对谐振点远离开关频率。"
      automatable: partial
    - method: bom_check
      tool: "Python 计算"
      check: "I_dc_load / I_rated <= 0.4；DCR 引起的压降使 3.3 V 轨最低值仍满足模块下限。"
      automatable: full
  sources:
    - title: "PDN Application of Ferrite Beads (Steve Weir)"
      url: "https://emcfastpass.com/wp-content/uploads/2017/04/PDN_Ferrite_Beads.pdf"
      publisher: "IPBLOX (DesignCon-style slides)"
      kind: paper
    - title: "AN-805 Recommended Ferrite Beads"
      url: "https://www.renesas.com/en/document/apn/805-recommended-ferrite-beads"
      publisher: "Renesas"
      kind: app_note
    - title: "ESP Hardware Design Guidelines - ESP32-C3, Analog Power Supply"
      url: "https://docs.espressif.com/projects/esp-hardware-design-guidelines/en/latest/esp32c3/esp-hardware-design-guidelines-en-master-esp32c3.pdf"
      publisher: "Espressif"
      kind: vendor_guide
      section: "§1.3.2"
    - title: "AN-1368 Ferrite Bead Demystified (未能打开原文，据搜索摘要：磁珠+电容谐振峰值约 10-15 dB)"
      url: "https://www.analog.com/en/resources/app-notes/an-1368.html"
      publisher: "Analog Devices"
      kind: app_note
  confidence: medium
  tags: [cat-feeder]

- id: PWR-SCH-016
  title: 反馈分压与基准容差下的输出电压最坏情况
  domain: power
  stage: schematic
  severity: should
  rule: 对可调稳压器按 Vout=Vref*(1+R2/R1)+Iadj*R2，用基准容差、电阻容差(建议 1% 或更好)、Iadj 与线性/负载调整率做最坏情况或蒙特卡洛计算，输出必须落在负载允许的电压范围内；固定输出型号则直接用数据手册的输出容差。
  rationale: 3.3 V 轨容差叠加后若越出 MCU 的 3.0~3.6 V 范围，会造成欠压复位或器件损伤；分压电阻容差和基准容差直接乘到输出。
  applies_to: [ldo, buck, boost, adjustable-regulator]
  parameters:
    - name: ams1117_vref_tolerance
      op: "=="
      value: 2
      unit: "%"
      note: "AMS1117 数据手册：基准/输出电压 ±2%；3.3 V 固定版 3.234~3.366 V(Vin=Vout+2 V、10 mA~1 A、25 C)。"
    - name: ams1117_load_regulation_max
      op: "<="
      value: 0.5
      unit: "%"
      note: "同上数据手册：Vin-Vout=2 V、10 mA~1 A 下负载调整率最大 0.5%；线性调整率最大 0.3%，条件是 Vout+1.5 V<=Vin<=12 V、Iout=10 mA（与负载调整率的测试条件不同）。"
    - name: esp32c3_vdd_range
      op: range
      value: [3.0, 3.6]
      unit: V
      note: "Espressif：VDD3P3_CPU 等数字电源 3.0 V~3.6 V。"
  verify:
    - method: spice
      tool: "ngspice .step / Monte Carlo"
      check: "对 Vref、R1、R2 取容差极值或蒙特卡洛 1000 次，读 Vout 的最小/最大，要求落在 [3.0, 3.6] V 内并留一定余量。"
      automatable: full
    - method: bom_check
      tool: "Python 计算"
      check: "固定输出：Vout_min=Vnom*(1-tol-load_reg-line_reg) 与 Vout_max 对比负载限值。"
      automatable: full
  sources:
