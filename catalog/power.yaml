# 电源与功率领域最佳实践（power）：开关电源、LDO、电机驱动、大电流铜、输入保护、PDN、可仿真属性
# 来源以 TI / ROHM / Infineon / Espressif / Bourns / Vishay 等厂商原文为主；未能打开原文的来源在 note 或 confidence 中说明。

- id: PWR-ARC-001
  title: 3.3 V 主电源按模块峰值电流留足裕量
  domain: power
  stage: architecture
  severity: should
  rule: 给 ESP32-C3 这类 Wi-Fi 模块供电的 3.3 V 稳压器，输出能力不得低于 Espressif 推荐的 500 mA，并按 Wi-Fi 发射峰值而不是平均电流选型。
  rationale: 射频发射时电流突增，电源轨若跌落会导致掉电复位或射频性能变差；稳压器额定电流太小时，峰值期间会进入限流或热关断。
  applies_to: [ldo, buck, esp32-c3, wifi-module]
  parameters:
    - name: rail_output_current_capability
      op: ">="
      value: 500
      unit: mA
      note: "Espressif ESP32-C3 硬件设计指南 §1.3.2：单电源供电时推荐 3.3 V、输出电流不小于 500 mA。示例板原理图注释写的 Wi-Fi 峰值约 0.35 A，低于该推荐值，选型时应以 500 mA 为准。"
    - name: ldo_current_limit_ams1117
      op: ">="
      value: 1
      unit: A
      note: "AMS1117 数据手册 Current limit 最小 1 A（VIN-VOUT=2 V），满足 500 mA，但散热见 PWR-ARC-002。"
  verify:
    - method: bom_check
      tool: "BOM / 数据手册参数表检查脚本"
      check: "读出 3.3 V 稳压器的额定输出电流 I_rated，与模块推荐电流 500 mA 比较，要求 I_rated >= 500 mA；同时检查稳压器输入侧上游器件（PPTC 保持电流、连接器额定电流）不小于 5 V 侧总电流。"
      automatable: partial
    - method: bench
      tool: "示波器 + 电流探头"
      check: "跑 Wi-Fi 连接和发射满功率，测 3.3 V 轨的最低电压，要求不低于模块下限 3.0 V，且无复位。"
      automatable: manual
  sources:
    - title: "ESP Hardware Design Guidelines - ESP32-C3, Power Supply"
      url: "https://docs.espressif.com/projects/esp-hardware-design-guidelines/en/latest/esp32c3/esp-hardware-design-guidelines-en-master-esp32c3.pdf"
      publisher: "Espressif"
      kind: vendor_guide
      section: "§1.3.2 Power Supply"
  confidence: high
  tags: [cat-feeder]

- id: PWR-ARC-002
  title: 按最坏耗散核算 LDO 结温（SOT-223 AMS1117）
  domain: power
  stage: architecture
  severity: must
  rule: 对每个线性稳压器计算 P=(Vin_max-Vout)*Iout_max 和 Tj=Ta_max+P*RthetaJA，要求 Tj 低于数据手册的工作结温上限（AMS1117 为 125 C）；热阻必须取该型号数据手册、对应封装和实际铜面积的数值。
  rationale: LDO 的压降全部变成热量，SOT-223 封装的热阻很高，5 V 转 3.3 V 的 0.35 A 就接近极限；超温会进入热关断，输出周期性掉电。
  applies_to: [ldo, sot-223, ams1117]
  parameters:
    - name: tj_max
      op: "<="
      value: 125
      unit: C
      note: "AMS1117 数据手册 Thermal Protection：器件功能只保证到 125 C，热关断点约 150 C。"
    - name: rtheta_ja_sot223_ams1117_datasheet
      op: "=="
      value: 150
      unit: "C/W"
      note: "DigiKey 托管的 AMS1117-3.3 SOT-223 数据手册（SLKOR 版本）；同一数据手册给出 SOT-223 最大耗散 PD=600 mW。TI LM1117 的 SOT-223 RthetaJA 为 61.6 C/W（JEDEC 板），两者差一倍以上，取决于铜面积与厂商，不能互相套用。"
    - name: pd_max_sot223_ams1117_datasheet
      op: "<="
      value: 600
      unit: mW
      note: "同一份数据手册的绝对最大额定值表。"
  verify:
    - method: bom_check
      tool: "Python 计算脚本读 BOM + 网络表"
      check: "对每个 LDO：Vin_max 取上游最大电压（如 5.25 V），Iout_max 取各负载峰值之和，算 P 和 Tj；要求 Tj <= 125 C 且 P <= 数据手册 PD。示例板的算例：(5-3.3)*0.35 A=0.595 W，按 150 C/W 温升 89 C，环境 40 C 时 Tj 约 129 C，超限，需换大铜面积、LM1117 类低热阻器件，或改用开关稳压器。"
      automatable: full
    - method: thermal_sim
      tool: "热阻网络估算或 PCB 热仿真"
      check: "用实际 SOT-223 散热焊盘（VOUT 引脚相连的 tab）铜面积修正 RthetaJA，重算 Tj。"
      automatable: partial
    - method: bench
      tool: "热电偶或热像仪"
      check: "满载运行至热平衡，测封装壳温，反推 Tj，要求低于 125 C。"
      automatable: manual
  sources:
    - title: "AMS1117 1A Low Dropout Voltage Regulator datasheet (SLKOR copy, SOT-223)"
      url: "https://mm.digikey.com/Volume0/opasdata/d220001/medias/docus/8122/AMS11173.3SOT223.pdf"
      publisher: "Advanced Monolithic Systems / SLKOR"
      kind: datasheet
      section: "Absolute Maximum Ratings; Thermal Protection"
    - title: "LM1117 800-mA Low-Dropout Linear Regulator"
      url: "https://www.ti.com/lit/ds/symlink/lm1117.pdf"
      publisher: "Texas Instruments"
      kind: datasheet
      section: "§7.4 Thermal Information"
  confidence: high
  conflicts: "SOT-223 热阻在不同来源差异很大：AMS1117 副本数据手册 150 C/W，TI LM1117 61.6 C/W（JEDEC 板）。取舍：必须按你实际采购的 1117 厂商数据手册和实际铜面积算；拿不准时用较大值，并实测壳温。LDO 效率可近似为 Vout/Vin（再加静态电流项），5 V 转 3.3 V 最多约 66%。"
  tags: [cat-feeder]

- id: PWR-ARC-003
  title: LDO 输入电压保持高于压差并留裕量
  domain: power
  stage: architecture
  severity: must
  rule: 在最低输入电压、最大负载电流和最高/最低温度下，应满足 Vin_min - Vout >= 数据手册最大压差 Vdo；Vin_min 要扣除连接器、线缆、PPTC 及其他串联电阻上的压降和电源容差。
  rationale: 压差不够时 LDO 退出稳压，输出随输入下降，MCU 在电机启动或线缆压降大时掉电复位。
  applies_to: [ldo, ams1117, input-protection]
  parameters:
    - name: dropout_voltage_max_1A
      op: "<="
      value: 1.4
      unit: V
      note: "AMS1117 副本数据手册：Iout=1 A 时压差典型 1.30 V，最大 1.40 V。电流越小压差越低，请按实际电流读曲线；LM1117 数据手册首页给出 800 mA 时 1.2 V。"
    - name: vin_min_minus_vout_nom
      op: ">="
      value: 1.4
      unit: V
      note: "按 1 A 满载的保守取值；5 V 轨若容差 -5% 并经 PPTC、连接器压降，则 3.3 V 输出下的裕量需要核算，不是默认满足。"
  verify:
    - method: spice
      tool: "ngspice/LTspice，带电机启动/堵转负载的 5 V 源模型"
      check: "5 V 源串入线缆电阻、PPTC 冷态/热态电阻（数据手册最大值）、TVS 漏电，扫描负载 0.05~1 A，取 LDO 输入电压最小值 Vin_min，要求 Vin_min - 3.3 V >= 对应电流的 Vdo(max)。"
      automatable: partial
    - method: bench
      tool: "示波器"
      check: "电机启动和堵转时同时测 LDO 的 VIN 和 VOUT，VOUT 不得跌落，VIN-VOUT 不得低于 Vdo。"
      automatable: manual
  sources:
    - title: "AMS1117 1A Low Dropout Voltage Regulator datasheet (SLKOR copy, SOT-223)"
      url: "https://mm.digikey.com/Volume0/opasdata/d220001/medias/docus/8122/AMS11173.3SOT223.pdf"
      publisher: "Advanced Monolithic Systems / SLKOR"
      kind: datasheet
      section: "Electrical Characteristics, Dropout voltage"
    - title: "LM1117 800-mA Low-Dropout Linear Regulator"
      url: "https://www.ti.com/lit/ds/symlink/lm1117.pdf"
      publisher: "Texas Instruments"
      kind: datasheet
      section: "§9.2.3 Application Curve"
  confidence: high
  tags: [cat-feeder]

- id: PWR-ARC-004
  title: 全陶瓷输出场合选「陶瓷稳定」型 LDO
  domain: power
  stage: architecture
  severity: should
  rule: 若输出电容打算只用 MLCC，选数据手册明确声明可用陶瓷输出电容、且给出最小电容的 LDO；依赖电解/钽电容 ESR 补偿的老式 LDO（如 1117 系列）不要直接配陶瓷。
  rationale: 老式 PNP/PMOS 调整管 LDO 靠输出电容 ESR 产生补偿零点；陶瓷 ESR 仅几 mΩ，零点跑到 3 MHz 以上，相位裕量不足会振荡。新型 LDO 把补偿零点做在片内。
  applies_to: [ldo]
  parameters:
    - name: esr_stable_range_electrolytic_ldo
      op: range
      value: [0.1, 10]
      unit: ohm
      note: "TI AN-1482：典型『电解稳定』LDO 的稳定 ESR 范围约 0.1~10 ohm（具体以所选型号稳定区曲线为准）。"
    - name: esr_max_ceramic_stable_ldo
      op: "<="
      value: 0.5
      unit: ohm
      note: "TI AN-1482：片内加零点的『陶瓷稳定』LDO 下限可到 0 ohm，但 ESR 上限可能低至约 0.5 ohm，取决于负载电流与 Cout。"
  verify:
    - method: bom_check
      tool: "选型表脚本"
      check: "对每个 LDO 记录数据手册的 Cout 类型/最小电容/ESR 窗口；输出电容实际 ESR（取 100 kHz~1 MHz 下的最小值）必须落在窗口内；窗口含 0 ohm 的才允许纯 MLCC。"
      automatable: partial
    - method: spice
      tool: "ngspice AC 分析，LDO 用厂商模型或宏模型"
      check: "放入 Cout 及其 ESR(f)，看环路增益穿越频率处相位裕量 >= 45 度。"
      automatable: partial
  sources:
    - title: "AN-1482 LDO Regulator Stability Using Ceramic Output Capacitors"
      url: "https://www.ti.com/lit/an/snva167a/snva167a.pdf"
      publisher: "Texas Instruments"
      kind: app_note
      section: "§5-§6"
    - title: "ESR, Stability, and the LDO Regulator (SLVA115A)"
      url: "https://www.ti.com/lit/pdf/slva115"
      publisher: "Texas Instruments"
      kind: app_note
  confidence: high
  tags: [cat-feeder]

- id: PWR-ARC-005
  title: 降压电感按纹波比与峰值电流选型
  domain: power
  stage: architecture
  severity: should
  rule: 降压变换器电感取值使纹波电流约为最大输出电流的 20%~40%，并要求电感饱和电流和开关管/二极管额定电流大于 Iout_max + dIL/2。
  rationale: 纹波太小电感过大、动态慢；太大则峰值电流高、输出纹波大。电感饱和会使电流失控而烧管。
  applies_to: [buck]
  parameters:
    - name: inductor_ripple_ratio
      op: range
      value: [0.2, 0.4]
      unit: "dIL/Iout"
      note: "TI SLVA477 对未选定电感时的纹波估计。"
    - name: inductor_isat_minimum
      op: ">="
      value: 1
      unit: "x (Iout_max + dIL/2)"
      note: "SLVA477 式 (4)：此峰值电流是电感、开关管和外部二极管都必须承受的。"
  verify:
    - method: bom_check
      tool: "Python 脚本读 BOM 电感参数"
      check: "dIL=(Vin-Vout)*D/(L*fsw)；检查 Isat_min(温度降额后) >= Iout_max + dIL/2，且 dIL/Iout_max 位于 0.2~0.4。"
      automatable: full
    - method: spice
      tool: "ngspice 瞬态"
      check: "满载与启动时电感电流峰值不超过 Isat，且不触发限流。"
      automatable: partial
  sources:
    - title: "Basic Calculation of a Buck Converter's Power Stage (SLVA477)"
      url: "https://www.ti.com/lit/pdf/slva477"
      publisher: "Texas Instruments"
      kind: app_note
      section: "§2-§3"
  confidence: high

- id: PWR-ARC-006
  title: 3.3 V 栅极驱动选用逻辑电平 MOSFET
  domain: power
  stage: architecture
  severity: must
  rule: 由 3.3 V GPIO 直接驱动的功率 MOSFET，必须在数据手册中保证 Rds(on) 的测试条件 Vgs 不高于实际可得的栅极电压（如 2.5 V 或 3.3 V），不能只看 Vgs(th)。
  rationale: Vgs(th) 只是开始导通的门槛（测试电流 250 uA），不代表完全增强；若 Rds(on) 只在 10 V 下给出，3.3 V 驱动时阻值大幅升高，MOSFET 发热甚至烧毁。
  applies_to: [mosfet, motor-drive, gpio-drive]
  parameters:
    - name: rds_on_spec_vgs_max
      op: "<="
      value: 3.3
      unit: V
      note: "需要数据手册在不高于栅极实际电压处保证 Rds(on)。AO3400A 在 Vgs=2.5 V、Id=3 A 时 Rds(on) 最大 48 mohm，Vgs(th) 0.65~1.45 V，Vgs 最大 ±12 V。"
  verify:
    - method: bom_check
      tool: "器件参数脚本"
      check: "取驱动电平 Vdrive_min（如 GPIO VOH 最低值），查找数据手册中 Vgs<=Vdrive_min 的 Rds(on) 最大值 Rds_max；用 Id_max^2*Rds_max 估损耗并检查结温（见 PWR-ARC-007）。数据手册没有对应 Vgs 的 Rds(on) 则判不通过。"
      automatable: partial
    - method: spice
      tool: "ngspice，用厂商 MOSFET 模型"
      check: "栅极电压设为 Vdrive_min，扫描漏极电流，读 Vds，换算 Rds(on)，与手册比较。"
      automatable: partial
  sources:
    - title: "AO3400A 30V N-Channel MOSFET datasheet (Alpha & Omega, Rev 3)"
      url: "https://static.datasheets.com/doc/21789847-alpha-omega-ao3400a-ds.pdf"
      publisher: "Alpha & Omega Semiconductor"
      kind: datasheet
      section: "Product Summary; Electrical Characteristics"
    - title: "Gate drive for power MOSFETs in switching applications"
      url: "https://www.infineon.com/dgdl/Infineon-Gate_drive_for_power_MOSFETs_in_switchtin_applications-ApplicationNotes-v01_00-EN.pdf?fileId=8ac78c8c80027ecd0180467c871b3622"
      publisher: "Infineon"
      kind: app_note
      section: "gate input characteristics (logic-level devices)"
  confidence: high
  tags: [cat-feeder]

- id: PWR-ARC-007
  title: 电机 MOSFET 按堵转电流核算导通损耗和结温
  domain: power
  stage: architecture
  severity: should
  rule: 对电机低边/高边开关管，用堵转电流和实际驱动 Vgs 下、热态的 Rds(on) 计算 P=I^2*Rds(on)，再乘数据手册的 RthetaJA 校核 Tj<150 C；RthetaJA 要采用与你的实际铜面积相符的值。
  rationale: SOT-23 封装的数据手册电流值常基于 1 平方英寸 2 oz 铜的测试板，实际板上的稳态热阻更大；Rds(on) 随温度上升约 40%。
  applies_to: [mosfet, motor-drive, sot-23]
  parameters:
    - name: rtheta_ja_steady_state_ao3400a
      op: "<="
      value: 125
      unit: "C/W"
      note: "AO3400A 稳态最大 125 C/W、典型 100 C/W，测试条件为 1 in2 FR-4、2 oz 铜、静止空气；实际板铜面积更小时会更高。数据手册的 PD 额定（脚注 B）按 t<=10 s 的 RthetaJA（典型 70、最大 90 C/W）给出，持续堵转要用稳态值。"
    - name: rds_on_hot_over_cold
      op: "=="
      value: 1.43
      unit: ratio
      note: "AO3400A 在 Vgs=10 V 下，Tj=125 C 最大 38 mohm 对 25 C 最大 26.5 mohm，即 38/26.5。"
    - name: tj_max_ao3400a
      op: "<="
      value: 150
      unit: C
      note: "AO3400A 结温上限。"
  verify:
    - method: bom_check
      tool: "Python 计算脚本"
      check: "Tj=Ta_max+Istall^2*Rds_on(Vgs,Tj_hot)*RthetaJA；要求 Tj <= 150 C 并留出降额；同时检查 Istall 不超过数据手册连续漏极电流（AO3400A: 5.7 A@25 C，4.7 A@70 C，均为 1 in2 2 oz 铜）。"
      automatable: full
    - method: thermal_sim
      tool: "热阻网络"
      check: "在 PCB 实际铜面积下修正 RthetaJA。"
      automatable: partial
  sources:
    - title: "AO3400A 30V N-Channel MOSFET datasheet (Alpha & Omega, Rev 3)"
      url: "https://static.datasheets.com/doc/21789847-alpha-omega-ao3400a-ds.pdf"
      publisher: "Alpha & Omega Semiconductor"
      kind: datasheet
      section: "Absolute Maximum Ratings; Thermal Characteristics notes A-F"
  confidence: high
  tags: [cat-feeder]

- id: PWR-LIB-001
  title: 1117 类 SOT-223 的散热 tab 必须接 VOUT
  domain: power
  stage: library
  severity: must
  rule: AMS1117/LM1117 的 SOT-223 封装中，散热 tab 与输出引脚内部相连，封装库里 tab 焊盘必须映射到 VOUT 网络（不是 GND），并给其足够的铜面积做散热。
  rationale: tab 与芯片壳体电连接到输出；误接到 GND 会短路输出。很多 SOT-23/SOT-223 通用符号把 tab 当作 GND 或 NC。
  applies_to: [ldo, ams1117, lm1117, sot-223]
  verify:
    - method: netlist_diff
      tool: "kicad-cli 导出网表 + Python 对比"
      check: "找所有 1117 类器件，tab 焊盘(通常是第 4 号焊盘)的网络名必须等于该器件引脚 2 的网络名，否则报错。"
      automatable: full
    - method: erc
      tool: "KiCad ERC + 符号库审阅"
      check: "核对符号的引脚 2 / tab 同为 power output 类型，没有出现 tab 为 power input 或 GND。"
      automatable: partial
  sources:
    - title: "LM1117 Pin Functions table"
      url: "https://www.ti.com/lit/ds/symlink/lm1117.pdf"
      publisher: "Texas Instruments"
      kind: datasheet
      section: "§6 Table 6-1 (VOUT: 2, 4, TAB for SOT-223)"
    - title: "AMS1117 datasheet - Thermal Consideration"
      url: "https://mm.digikey.com/Volume0/opasdata/d220001/medias/docus/8122/AMS11173.3SOT223.pdf"
      publisher: "Advanced Monolithic Systems / SLKOR"
      kind: datasheet
      section: "Thermal Consideration (case electrically connected to output)"
  confidence: high
  tags: [cat-feeder]

- id: PWR-LIB-002
  title: 四端子开尔文分流电阻封装要分开力端与感测端
  domain: power
  stage: library
  severity: should
  rule: 分流电阻（如 20 mohm 四端子 R10）的封装库必须把大电流焊盘和感测焊盘做成独立焊盘并映射到不同网络，感测焊盘只接电流检测放大器输入，不承载负载电流。
  rationale: 毫欧级分流电阻上，任何多出来的大电流路径电阻都会直接变成测量误差；TI 要求开尔文四线连接，使两个输入脚之间只检测到分流电阻本身的阻抗。
  applies_to: [shunt, current-sense, ina199]
  verify:
    - method: netlist_diff
      tool: "kicad-cli 网表 + Python"
      check: "分流电阻的两个感测焊盘网络只能出现在 INA199 的 IN+/IN- 以及少量滤波元件上，不允许连到负载电流所在的铜皮。"
      automatable: full
    - method: review
      tool: "封装库评审清单"
      check: "检查封装焊盘形状：力端焊盘与感测焊盘之间不互连，感测焊盘靠近电阻本体。"
