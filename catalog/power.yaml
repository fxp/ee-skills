- id: PWR-FLR-001
  title: 电机/开关电源功率区与模拟、射频区分区
  domain: power
  stage: floorplan
  severity: should
  rule: 把电机驱动（MOSFET、续流二极管、分流电阻、电机接线端子）和开关变换器集中在板上一个功率区，远离 HX711/ADC 等模拟前端和天线区；功率区的开关电流回路和电机引线不得穿过模拟区下方或旁边。
  rationale: 电机引线和开关节点会把噪声感应到邻近信号线，Pololu 实测在一台噪声电机附近的独立电路里感应出高达 20 V 的尖峰；开关电流回路必须与安静走线隔开。
  applies_to: [motor-drive, buck, boost, mixed-signal]
  parameters:
    - name: induced_spike_observed
      op: qualitative
      value: null
      note: "Pololu 观测到电机附近独立电路感应出高达 20 V 的尖峰，无距离数值，距离需自行用实测确定。"
  verify:
    - method: geometry_script
      tool: "pcbnew Python"
      check: "取电机驱动网络(MOTOR_*、分流电阻网络)与 SW 节点铜皮的外包矩形，与模拟网络(HX711、ADC 输入)及天线禁布区的最小距离，要求大于所设阈值(建议 >= 10 mm，作为初值待实测校准，来源未给数值)。"
      automatable: partial
    - method: review
      tool: "布局评审"
      check: "确认电机引线和开关节点不平行靠近敏感走线，确认功率区与模拟区之间有连续地平面隔开。"
      automatable: manual
  sources:
    - title: "Dealing with Motor Noise (Pololu)"
      url: "https://www.pololu.com/docs/0J15/9"
      publisher: "Pololu"
      kind: vendor_guide
      section: "§9 items 2-4"
    - title: "AN-1229 SIMPLE SWITCHER PCB Layout Guidelines"
      url: "https://www.ti.com/lit/an/snva054c/snva054c.pdf"
      publisher: "Texas Instruments"
      kind: app_note
      section: "§5 Routing the Traces (keep switching traces away from quiet traces)"
  confidence: medium
  tags: [cat-feeder]

- id: PWR-FLR-002
  title: 电源入口按防护、储能、稳压顺序布局
  domain: power
  stage: floorplan
  severity: should
  rule: 电源接口附近依次排布保险丝、ESD/TVS（并联到地，位于保险丝之后，见 PWR-SCH-001）、至少 10 uF 的入口电容，再到稳压器；入口电容与靠近射频电源引脚的 10 uF 电容可合并为一个。
  rationale: Espressif 建议在主电源入口放 ESD 保护二极管和至少 10 uF 电容，以吸收射频发射时的瞬时电流和入口瞬态；防护器件靠近入口才能在能量扩散到板上之前钳位。
  applies_to: [power-entry, esp32-c3]
  parameters:
    - name: entry_capacitor
      op: ">="
      value: 10
      unit: uF
      note: "Espressif §1.3.2：主电源入口至少 10 uF。"
  verify:
    - method: geometry_script
      tool: "pcbnew Python"
      check: "沿电源网络从接口焊盘出发，测 TVS、保险丝、入口电容、稳压器输入的先后顺序和到接口焊盘的距离，顺序须符合：接口 < 保险丝 < TVS/入口电容 < 稳压器；入口电容到稳压器 VIN 距离尽量短。"
      automatable: partial
    - method: review
      tool: "布局评审"
      check: "确认入口电容容值 >= 10 uF 且有效容值(见 PWR-SCH-006)满足。"
      automatable: manual
  sources:
    - title: "ESP Hardware Design Guidelines - ESP32-C3, Power Supply"
      url: "https://docs.espressif.com/projects/esp-hardware-design-guidelines/en/latest/esp32c3/esp-hardware-design-guidelines-en-master-esp32c3.pdf"
      publisher: "Espressif"
      kind: vendor_guide
      section: "§1.3.2 and §1.4.2"
  confidence: high
  tags: [cat-feeder]

- id: PWR-PLC-001
  title: 先识别开关热回路，输入电容紧贴 IC 并最小化环路
  domain: power
  stage: placement
  severity: must
  rule: 对每种拓扑先画出开关导通与关断两种电流路径，其差值（电流突变的路径）就是热回路（降压为：输入电容 -> 高边管 -> SW -> 低边管/续流二极管 -> 输入电容地）；布局时先放输入电容和续流器件，使热回路面积最小，不经过过孔。
  rationale: 热回路上的 di/dt 与走线寄生电感（约 20 nH/英寸）产生电压尖峰，可导致控制器误动作、EMI 变差、效率下降甚至损坏。AN-1229 估算：1 英寸走线、1 A 在 30 ns 内切换产生约 0.7 V。
  applies_to: [buck, boost, flyback, buck-boost]
  parameters:
    - name: trace_inductance_rule
      op: "=="
      value: 20
      unit: "nH per inch"
      note: "TI AN-1229 的经验值，约 0.8 nH/mm。"
    - name: hot_loop_area
      op: minimize
      value: null
      note: "SW、VIN、GND 引脚到输入电容、续流器件的距离在制造规则允许下尽量短；ROHM 称哪怕缩短 1 mm 都值得。"
  verify:
    - method: geometry_script
      tool: "pcbnew Python，参见 ee-pcb-verify 的 geometry 检查器"
      check: "按网络表找出 CIN 正极焊盘 -> VIN 引脚 -> SW 引脚 -> 续流二极管/低边管 -> CIN 地焊盘构成的多边形，计算铜路径围成的环路面积和总长度；估算电感 L≈0.8 nH/mm*总长，与基线布局(如数据手册推荐布局)比较，不得更差。"
      automatable: partial
    - method: em_sim
      tool: "openEMS/Elmer 或 PEEC 估计 (可选)"
      check: "提取热回路寄生电感，与 SW 节点振铃频率对照。"
      automatable: partial
    - method: bench
      tool: "示波器 + 差分探头"
      check: "按 PWR-VER-007 测 SW 节点振铃，作为布局效果判据。"
      automatable: manual
  sources:
    - title: "AN-1229 SIMPLE SWITCHER PCB Layout Guidelines"
      url: "https://www.ti.com/lit/an/snva054c/snva054c.pdf"
      publisher: "Texas Instruments"
      kind: app_note
      section: "§3 AC and DC Current Paths; §4"
    - title: "Five steps to a great PCB layout for a step-down converter (SLYT614)"
      url: "https://www.ti.com/lit/pdf/slyt614"
      publisher: "Texas Instruments"
      kind: app_note
      section: "Step #1"
    - title: "PCB Layout Techniques of Buck Converter (60AN066E)"
      url: "https://fscdn.rohm.com/en/products/databook/applinote/ic/power/switching_regulator/converter_pcb_layout_appli-e.pdf"
      publisher: "ROHM"
      kind: app_note
      section: "§1 Current Path; §3"
  confidence: high

- id: PWR-PLC-002
  title: 高频旁路电容紧贴 VIN/GND，大电容可稍远
  domain: power
  stage: placement
  severity: should
  rule: 高频旁路陶瓷电容（0.1~0.47 uF）放在 IC 的 VIN 与 GND 引脚上，与 IC 同层；大容量输入电容在旁路电容已经就近的前提下可离开约 2 cm 以内，且不要与输出电容共用一小段地。
  rationale: 快沿电流主要由旁路电容提供，大容量电容寄生参数较大，只补充较慢分量。ROHM：若连旁路电容也放到背面经过孔连接，过孔电感会产生电压噪声，不要这样布局（图 3-d）；仅大容量 CIN 因空间不够放到背面经过孔时，噪声风险可避免，但大电流下纹波会因过孔电阻而增大（图 3-c）。ROHM 还指出 CIN 与 CO 的地需拉开 1~2 cm，避免输入地上的数百 MHz 噪声串到输出。
  applies_to: [buck, boost]
  parameters:
    - name: cin_bulk_to_bypass_distance
      op: "<="
      value: 20
      unit: mm
      note: "ROHM 60AN066E：旁路电容靠近 IC 时，CIN 可相隔约 2 cm；TI AN-1229 称大电容可再往外移约 1 英寸(25 mm)。"
    - name: cin_cout_ground_separation
      op: ">="
      value: 10
      unit: mm
      note: "ROHM：CIN 与 CO 的地至少相距 1 cm~2 cm。"
    - name: cbypass_same_layer
      op: qualitative
      value: null
      note: "旁路电容与 IC 同层，禁止通过过孔连接 (AN-1229、ROHM)。"
  verify:
    - method: geometry_script
      tool: "pcbnew Python"
      check: "测 CBYPASS 焊盘到 IC VIN/GND 引脚焊盘中心距离(要求尽量小，建议小于 2 mm 作为合格初值)；CBYPASS 与 IC 同层；CIN 到 CBYPASS 距离 <= 20 mm；CIN 地焊盘与 CO 地焊盘中心距 >= 10 mm。"
      automatable: full
    - method: drc
      tool: "KiCad 自定义规则 .kicad_dru"
      check: "对 CBYPASS 到 IC 引脚之间的走线加『禁止过孔』约束。"
      automatable: partial
  sources:
    - title: "PCB Layout Techniques of Buck Converter (60AN066E)"
      url: "https://fscdn.rohm.com/en/products/databook/applinote/ic/power/switching_regulator/converter_pcb_layout_appli-e.pdf"
      publisher: "ROHM"
      kind: app_note
      section: "§3, Figures 3-a to 3-d"
    - title: "AN-1229 SIMPLE SWITCHER PCB Layout Guidelines"
      url: "https://www.ti.com/lit/an/snva054c/snva054c.pdf"
      publisher: "Texas Instruments"
      kind: app_note
      section: "§4"
  confidence: high

- id: PWR-PLC-003
  title: 续流二极管与 IC 同层，短而宽直连 SW 和 GND
  domain: power
  stage: placement
  severity: must
  rule: 非同步降压的续流（catch）二极管必须与 IC 在同一层，紧挨 IC，用短而宽的走线直接连到 SW 引脚和 GND 引脚，不经过过孔，也不放到背面。
  rationale: 二极管到 IC 的走线电感会在 SW 上叠加尖峰，并传导到输出；过孔电感（0.4 mm 孔、1.6 mm 板厚约 1.2 nH）使问题更糟。
  applies_to: [buck, non-synchronous]
  verify:
    - method: geometry_script
      tool: "pcbnew Python"
      check: "二极管阴极焊盘 -> IC SW 焊盘、二极管阳极焊盘 -> IC GND 焊盘的铜路径：层必须相同，过孔数 = 0，路径长度尽量短(建议 < 5 mm 作为合格初值，来源未给数值)。"
      automatable: full
  sources:
    - title: "AN-1229 SIMPLE SWITCHER PCB Layout Guidelines"
      url: "https://www.ti.com/lit/an/snva054c/snva054c.pdf"
      publisher: "Texas Instruments"
      kind: app_note
      section: "§4"
    - title: "PCB Layout Techniques of Buck Converter (60AN066E)"
      url: "https://fscdn.rohm.com/en/products/databook/applinote/ic/power/switching_regulator/converter_pcb_layout_appli-e.pdf"
      publisher: "ROHM"
      kind: app_note
      section: "§3, Figures 3-e/3-f"
  confidence: high

- id: PWR-PLC-004
  title: 电感靠近 IC 但不必比输入电容更近，SW 铜皮最小
  domain: power
  stage: placement
  severity: should
  rule: 电感放在 IC 附近，优先级低于输入电容和续流器件；通过旋转电感使 SW 节点铜皮最小，并便于连到输出电容；优先选闭磁路（封闭磁芯、屏蔽式）电感，开磁路电感则远离低功率走线并使磁极垂直于 PCB。
  rationale: SW 节点是最主要的 EMI 源，所有连在其上的铜都是对周围节点的寄生电容板；开磁路（棒状）电感发射的磁场最强。
  applies_to: [buck, boost, flyback]
  verify:
    - method: geometry_script
      tool: "pcbnew Python"
      check: "电感 SW 侧焊盘到 IC SW 引脚的铜路径长度和 SW 网络总铜面积，与同类参考布局比较，面积只允许承载电流所需；检查电感下方和端子间是否有敏感走线(见 PWR-PLN-001)。"
      automatable: partial
    - method: bom_check
      tool: "BOM 参数检查"
      check: "电感类型为屏蔽/闭磁路；未屏蔽时在评审记录中说明为何可接受。"
      automatable: partial
  sources:
    - title: "Five steps to a great PCB layout for a step-down converter (SLYT614)"
      url: "https://www.ti.com/lit/pdf/slyt614"
      publisher: "Texas Instruments"
      kind: app_note
      section: "Step #2"
    - title: "AN-1149 Layout Guidelines for Switching Power Supplies"
      url: "https://www.ti.com/lit/an/snva021c/snva021c.pdf"
      publisher: "Texas Instruments"
      kind: app_note
      section: "§1 Inductor"
    - title: "PCB Layout Techniques of Buck Converter (60AN066E)"
      url: "https://fscdn.rohm.com/en/products/databook/applinote/ic/power/switching_regulator/converter_pcb_layout_appli-e.pdf"
      publisher: "ROHM"
      kind: app_note
      section: "§2 item 3"
  confidence: high

- id: PWR-PLC-005
  title: RC 缓冲电路跨接在 SW 与 GND 引脚上并按振铃频率定值
  domain: power
  stage: placement
  severity: consider
  rule: 只在振铃超标且布局已优化后才加 RC 缓冲；缓冲电路放在 IC 的 SW 与 GND 引脚之间、环路最短，而不是跨在二极管两端；先测振铃频率，用加电容使频率减半的方法估计寄生 Lp、Cp，取 Rs≈0.5*sqrt(Lp/Cp)（SLUA851A 式 (6)，阻尼系数 ξ=1）。
  rationale: 缓冲电路的作用是吸收走线电感引起的尖峰和 SW 寄生谐振，位置在 IC 引脚处才能旁路热回路；功耗约为 C*V^2*fsw 量级，电容过大只增加损耗。
  applies_to: [buck, boost]
  parameters:
    - name: snubber_resistance_simple_switcher
      op: range
      value: [10, 100]
      unit: ohm
      note: "TI AN-1229 §4：低电感类型电阻。"
    - name: snubber_capacitance_simple_switcher
      op: range
      value: [0.47, 2.2]
      unit: nF
      note: "AN-1229：陶瓷电容 470 pF~2.2 nF；更大电容损耗不可接受。"
    - name: snubber_cap_to_parasitic_ratio
      op: "=="
      value: 3
      unit: "x Cp"
      note: "TI SLUA851A：Cs 通常取寄生电容 Cp 的约 3 倍；其 14 A 例中 Rs=1.54 ohm、Cs=1 nF 使 SW 峰值从 26 V 降到 17.5 V。"
  verify:
    - method: bench
      tool: "差分探头(>=500 MHz)，示波器"
      check: "按 SLUA851A 步骤：测无缓冲的振铃频率 f1，加小电容 Cs0 使频率降为 f1/2，据式 (4)(5) 求 Lp=(T2^2-T1^2)/(4π^2*Cs0)（T=1/f）、Cp≈1/(4π^2*f1^2*Lp)，设 Rs=0.5*sqrt(Lp/Cp)（式 (6)，ξ=1），Cs≈3Cp；再测峰值、效率变化；缓冲电阻功耗 P≈Cs*Vin^2*fsw 不得超过电阻额定。"
      automatable: manual
    - method: spice
      tool: "ngspice，含 Lp、Coss 寄生"
      check: "用估计的 Lp、Cp 仿真有/无缓冲的 SW 峰值，确认阻尼。"
      automatable: partial
  sources:
    - title: "Minimizing Switch Ringing on TPS53318 and TPS53319 Family of Devices (SLUA851A)"
      url: "https://www.ti.com/lit/pdf/slua851"
      publisher: "Texas Instruments"
      kind: app_note
      section: "§3.1 Method of RC Snubber Designing; §4"
    - title: "AN-1229 SIMPLE SWITCHER PCB Layout Guidelines"
      url: "https://www.ti.com/lit/an/snva054c/snva054c.pdf"
      publisher: "Texas Instruments"
      kind: app_note
      section: "§4"
    - title: "PCB Layout Techniques of Buck Converter (60AN066E)"
      url: "https://fscdn.rohm.com/en/products/databook/applinote/ic/power/switching_regulator/converter_pcb_layout_appli-e.pdf"
      publisher: "ROHM"
      kind: app_note
      section: "§3, Figures 3-g/3-h"
  confidence: high
  conflicts: "SLUA851A §3.1 正文说缓冲电阻『等于寄生谐振回路的特征阻抗』（即 sqrt(Lp/Cp)），但同节式 (6)（ξ=1 时 Rs=0.5*sqrt(Lp/Cp)）和 14 A 算例（Lp=2.43 nH、Cp≈261 pF，sqrt(Lp/Cp)≈3.05 ohm，算得 Rs=1.53 ohm）给出的都是特征阻抗的一半。取舍：以式 (6) 和算例为准；实际再用示波器按峰值与效率微调。"

- id: PWR-PLC-006
  title: 升压变换器先放输出电容，再放电感和输入电容
  domain: power
  stage: placement
  severity: should
  rule: 升压变换器布局顺序为：先放输出电容并短而宽地连到 IC；再放电感（SW 铜皮在满足载流前提下最小）；最后放输入电容，其地靠近 IC 的 PGND 引脚。需要用过孔连输出电容时，每安培电流至少一个过孔。
  rationale: 升压的输出电容电流是脉动的，输出电容到 IC 的寄生电感使 SW 产生尖峰和振铃；输入电流连续，输入电容位置要求较宽松。
  applies_to: [boost]
  parameters:
    - name: output_cap_via_count_per_amp
      op: ">="
      value: 1
      unit: "via per A"
      note: "TI SLVA773 §1：如需过孔，建议每安培一个过孔；TI AN-1149 另说每 200 mA 一个过孔，见 PWR-RTE-006 的冲突说明。"
  verify:
    - method: geometry_script
      tool: "pcbnew Python"
      check: "输出电容正极焊盘到 IC VOUT/SW 引脚、地焊盘到 PGND 引脚的铜路径长度和宽度；输出电容到 IC 的总路径应短于输入电容到 IC 的路径；输出电容路径上的过孔数 >= 电流(A)。"
      automatable: partial
  sources:
    - title: "Five Steps to a Good PCB Layout of a Boost Converter (SLVA773)"
      url: "https://www.ti.com/lit/an/slva773/slva773.pdf"
      publisher: "Texas Instruments"
      kind: app_note
      section: "Steps 1-3"
    - title: "AN-1229 SIMPLE SWITCHER PCB Layout Guidelines"
      url: "https://www.ti.com/lit/an/snva054c/snva054c.pdf"
      publisher: "Texas Instruments"
      kind: app_note
      section: "§4 (boost: output capacitor current is pulsed)"
  confidence: high

- id: PWR-PLC-007
  title: LDO 输入输出电容靠近引脚，负载走线宽
  domain: power
  stage: placement
  severity: should
  rule: 1117 类 LDO 的输入电容和输出电容（补偿用的 ESR 电容）紧贴稳压器引脚，承载负载电流的走线加宽以降低寄生电感；可调版从 VOUT 到 ADJ 的反馈环路尽量短，ADJ 旁路电容紧靠 IC；输出分压上端直接接 VOUT 引脚。
  rationale: 走线电感会影响调整率和瞬态；可调版分压上端若不直接接输出引脚，负载调整率会变差。
  applies_to: [ldo, ams1117, lm1117]
  verify:
    - method: geometry_script
      tool: "pcbnew Python"
      check: "测输入/输出电容正极焊盘到 VIN/VOUT 引脚焊盘的路径长度和宽度；要求路径 < 10 mm 且宽度不小于负载电流所需(见 PWR-RTE-005)，10 mm 为初值，来源未给数值。"
      automatable: partial
  sources:
