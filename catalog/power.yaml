- id: PWR-RTE-001
  title: SW 节点铜皮只留够载流的最小面积
  domain: power
  stage: routing
  severity: must
  rule: SW 节点（电感、续流管、开关管连接处）的铜皮只保留承载电流所需的最小面积，不要为散热而铺大片 SW 铜，也不要在对面层做同形状的 SW 铜岛；其他走线不得从 SW 铜皮下面穿过。
  rationale: SW 节点电压剧烈摆动，任何与之相连的铜都是天线和对邻近节点的寄生电容板；对面层镜像铜岛会割裂地平面。
  applies_to: [buck, boost, flyback, buck-boost]
  parameters:
    - name: sw_node_copper_area
      op: minimize
      value: null
      note: "AN-1229、SLYT614、SLVA773、ROHM 均给方向性要求，无数值。"
  verify:
    - method: geometry_script
      tool: "pcbnew Python"
      check: "统计 SW 网络在所有层的铜面积(焊盘+走线+铺铜)，与载流所需面积比较(宽度按 PWR-RTE-005)；检查 SW 铜皮正下方、正对面层是否有其他网络的走线或被割开的地平面。"
      automatable: full
    - method: drc
      tool: "KiCad 自定义规则"
      check: "对 SW 网络设置最大铜铺宽度或禁止 zone fill。"
      automatable: partial
  sources:
    - title: "AN-1229 SIMPLE SWITCHER PCB Layout Guidelines"
      url: "https://www.ti.com/lit/an/snva054c/snva054c.pdf"
      publisher: "Texas Instruments"
      kind: app_note
      section: "§5 Routing the Traces; §6.3 Thermal Management"
    - title: "Five steps to a great PCB layout for a step-down converter (SLYT614)"
      url: "https://www.ti.com/lit/pdf/slyt614"
      publisher: "Texas Instruments"
      kind: app_note
      section: "Step #2"
    - title: "Five Steps to a Good PCB Layout of a Boost Converter (SLVA773)"
      url: "https://www.ti.com/lit/an/slva773/slva773.pdf"
      publisher: "Texas Instruments"
      kind: app_note
      section: "Step 2"
  confidence: high
  conflicts: "热与 EMI 的取舍：AN-1229 §6.3 指出非同步降压续流二极管的阴极/散热片就是 SW 节点，散热要求大铜皮与 EMI 要求小铜皮冲突；建议选阳极接散热片的器件，或对地做电气隔离（不隔热）的外部散热。AN-1229 也提到有人建议在对面层做同形状 SW 铜岛并用过孔连接以增加散热、抑制串扰，但会割裂地平面，AN-1229 不赞成。取舍：以小铜皮为准，散热靠同步整流、选低损耗器件或把热引到接地的散热焊盘。"

- id: PWR-RTE-002
  title: 热回路走线不经过孔，必须时并联多孔
  domain: power
  stage: routing
  severity: must
  rule: 输入旁路电容、续流二极管、功率开关到 IC 的热回路连接不使用过孔；若无法避免（如通孔器件），用多个过孔并联，并优先加大孔径。
  rationale: 一个 0.4 mm 孔、1.6 mm 板厚的过孔电感约 1.2 nH，几乎是同样尺寸导线的两倍；高 di/dt 下会产生可观的电压尖峰，TI 观察到旁路电容经过孔连接的高速降压 IC 会出现偶发现场问题。
  applies_to: [buck, boost, flyback, buck-boost]
  parameters:
    - name: via_inductance_example
      op: "=="
      value: 1.2
      unit: nH
      note: "AN-1229：0.4 mm 孔径、1.6 mm 板厚；式 (1) 与孔高、孔径相关。"
    - name: hot_loop_via_count
      op: "=="
      value: 0
      unit: pcs
      note: "SLYT614 Step #3：功率元件之间不应使用过孔；ROHM 同。"
  verify:
    - method: geometry_script
      tool: "pcbnew Python"
      check: "列出热回路路径(CIN+ -> VIN -> SW -> 续流管 -> CIN-)上的所有过孔，要求数量为 0；若 > 0 则输出并联数量与孔径，作为需要评审的例外。"
      automatable: full
    - method: drc
      tool: "KiCad 自定义规则(.kicad_dru)"
      check: "对热回路网络段设置禁止放置过孔的约束区域(rule area)。"
      automatable: partial
  sources:
    - title: "AN-1229 SIMPLE SWITCHER PCB Layout Guidelines"
      url: "https://www.ti.com/lit/an/snva054c/snva054c.pdf"
      publisher: "Texas Instruments"
      kind: app_note
      section: "§5 Routing the Traces, Eq. 1"
    - title: "Five steps to a great PCB layout for a step-down converter (SLYT614)"
      url: "https://www.ti.com/lit/pdf/slyt614"
      publisher: "Texas Instruments"
      kind: app_note
      section: "Step #3"
    - title: "PCB Layout Techniques of Buck Converter (60AN066E)"
      url: "https://fscdn.rohm.com/en/products/databook/applinote/ic/power/switching_regulator/converter_pcb_layout_appli-e.pdf"
      publisher: "ROHM"
      kind: app_note
      section: "§3, Figure 3-d"
  confidence: high
  conflicts: "SLYT614 的「特殊考虑」章节说明某些具体封装可在 SW 连接上用过孔（本次未读到该节细节）。取舍：默认零过孔，有具体器件数据手册推荐的过孔布局时以数据手册为准。"

- id: PWR-RTE-003
  title: 反馈线短、远离 SW 与电感，取样点在输出电容处
  domain: power
  stage: routing
  severity: must
  rule: 反馈（FB/VOS）走线尽量短并远离 SW 节点、电感、续流二极管，不从电感或二极管下方穿过，不与功率走线平行；输出电压取样点接在输出电容之后（或其两端）的安静位置；分压电阻紧靠 IC 的 FB 引脚；如有可能，反馈线走在与电感相对的另一层并以地平面隔开。
  rationale: FB 引脚是误差放大器的高阻输入，拾取噪声会造成输出电压误差、抖动甚至不稳定；若一端是低阻节点则不易耦合，因此分压电阻靠近 IC 是更优的布线方式。
  applies_to: [buck, boost, flyback, ldo-adjustable]
  verify:
    - method: geometry_script
      tool: "pcbnew Python"
      check: "计算 FB 网络所有走线段、焊盘到 SW 网络铜皮、电感本体外框的最小间距，并检测 FB 走线是否位于电感/续流管封装外框正下方(任一层)、是否与功率网络平行并行超过 3 mm(平行长度阈值为初值，来源未给数值)；要求最小间距尽量大，作为评审项设下限。"
      automatable: partial
    - method: review
      tool: "布局评审"
      check: "确认取样点位于输出电容之后，FB 走线不跨越开关环路；FB 分压电阻到 FB 引脚 < 5 mm(初值)。"
      automatable: manual
  sources:
    - title: "AN-1229 SIMPLE SWITCHER PCB Layout Guidelines"
      url: "https://www.ti.com/lit/an/snva054c/snva054c.pdf"
      publisher: "Texas Instruments"
      kind: app_note
      section: "§8 Signal Traces: Feedback, Figure 5"
    - title: "PCB Layout Techniques of Buck Converter (60AN066E)"
      url: "https://fscdn.rohm.com/en/products/databook/applinote/ic/power/switching_regulator/converter_pcb_layout_appli-e.pdf"
      publisher: "ROHM"
      kind: app_note
      section: "§5 Feedback route, Figure 7"
    - title: "Five steps to a great PCB layout for a step-down converter (SLYT614)"
      url: "https://www.ti.com/lit/pdf/slyt614"
      publisher: "Texas Instruments"
      kind: app_note
      section: "Step #3 (VOS pin), Step #4 (FB node)"
    - title: "AN-1149 Layout Guidelines for Switching Power Supplies"
      url: "https://www.ti.com/lit/an/snva021c/snva021c.pdf"
      publisher: "Texas Instruments"
      kind: app_note
      section: "§2 Feedback"
  confidence: high
  conflicts: "AN-1149 说反馈线要「尽量直接且稍粗」，但与「远离电感和噪声源」冲突时以远离为优先；AN-1229 则指出反馈线可以故意绕长一点以避开噪声源，或把分压电阻放在 IC 旁使其两端都是低阻节点。取舍：远离噪声源优先于最短。"

- id: PWR-RTE-004
  title: 自举电容回路短，IC 地引脚走线同样要短
  domain: power
  stage: routing
  severity: should
  rule: 自举（BOOT/BST）电容紧靠 BOOT 与 SW 引脚，走线短；IC 的 GND 引脚走线也要短，输入旁路电容紧靠 VIN/GND；需要降低 SW 振铃时可在自举电容串联一个小电阻（TI 试验 0~3 ohm）。
  rationale: 驱动高边 MOSFET 栅极的尖峰电流来自自举电容，其刷新电流通过 IC 的 GND 引脚，GND 引脚阻抗过大会造成地弹和控制器误动作；串联自举电阻放慢高边导通，降低 SW 峰值，以略降效率为代价。
  applies_to: [buck, synchronous-buck]
  parameters:
    - name: bootstrap_resistor_tested
      op: range
      value: [0, 3.01]
      unit: ohm
      note: "TI SLUA851A（TPS53319，12 V 入 1.5 V 出、14 A、500 kHz）：Rbst 从 0 增到 3.01 ohm，SW 峰值由 24.5 V 降到 18 V，效率 90.67% 降到 90.37%。"
  verify:
    - method: geometry_script
      tool: "pcbnew Python"
      check: "测 BOOT 电容两焊盘到 IC BOOT 与 SW 引脚的路径长度，以及 IC GND 引脚到地平面过孔/CIN 地的距离，要求均小于数据手册参考布局的长度。"
      automatable: partial
    - method: bench
      tool: "差分探头，示波器"
      check: "分别用 0 ohm 与 1.5~3 ohm 自举电阻测 SW 峰值，选满足绝对最大额定值余量且效率可接受的值。"
      automatable: manual
  sources:
    - title: "AN-1229 SIMPLE SWITCHER PCB Layout Guidelines"
      url: "https://www.ti.com/lit/an/snva054c/snva054c.pdf"
      publisher: "Texas Instruments"
      kind: app_note
      section: "§3 (ground pin carries bootstrap refresh current)"
    - title: "Minimizing Switch Ringing on TPS53318 and TPS53319 Family of Devices (SLUA851A)"
      url: "https://www.ti.com/lit/pdf/slua851"
      publisher: "Texas Instruments"
      kind: app_note
      section: "§5 Adding Bootstrap Resistor"
  confidence: high

- id: PWR-RTE-005
  title: 大电流走线按 IPC-2152 和温升目标定宽
  domain: power
  stage: routing
  severity: must
  rule: 每条承载稳态或周期性大电流的走线，宽度要由 IPC-2152 数据（或其计算器）按目标温升（通常 10~20 C）、铜厚、是否有相邻平面、局部板温来确定，并取走线最窄处校核；不能直接套用 IPC-2221 的外层曲线。
  rationale: IPC-2221 的曲线源自上世纪 50 年代对孤立表层走线的数据，内层曲线是外层的粗略折半，已被 IPC-2152 实测数据取代；邻近平面可大幅降低温升，邻近发热器件和平行走线会抬高局部板温。
  applies_to: [power-routing, motor-drive, high-current, dc-power-distribution]
  parameters:
    - name: temperature_rise_target
      op: range
      value: [10, 20]
      unit: C
      note: "AN-1229 称军标要求最大温升 20 C，30~40 C 也常见；IPC-2152 示例以 10 C 为例；同时 FR4 板面应保持 120 C 以下。"
    - name: width_per_amp_1oz_an1229
      op: ">="
      value: 12
      unit: "mil per A"
      note: "AN-1229：温升 < 30 C、电流 < 5 A、1 oz 铜至少 12 mil/A（0.3 mm/A）；2 oz 为 7 mil/A。"
    - name: width_per_amp_1oz_an1149
      op: ">="
      value: 15
      unit: "mil per A"
      note: "AN-1149 §5：标准 PCB 上走线「绝对最小」15 mil/A（0.381 mm/A）；原文未指明铜厚（参数名中的 1oz 是本库按常用铜厚的假设，不是原文条件）。"
    - name: width_per_amp_1oz_rohm
      op: ">="
      value: 1
      unit: "mm per A"
      note: "ROHM 60AN066E：1 oz 铜 1 mm/A 以上，2 oz 为 0.7 mm/A 以上（受周围发热影响，较保守）。"
  verify:
    - method: geometry_script
      tool: "pcbnew Python，读各功率网络最小线宽 + 电流表"
      check: "对每个标注电流 I 的网络，取全部铜路径(走线、过孔、焊盘颈部)中最窄处宽度 W，按所选铜厚和 IPC-2152 数据换算温升 dT，要求 dT <= 20 C(默认)；同时 W >= 保守经验值(取 AN-1149 的 15 mil/A，作为快速筛选)。"
      automatable: full
    - method: tline_calc
      tool: "IPC-2152 计算器(UltraCAD 等)"
      check: "输入电流、铜厚、板厚、邻近平面距离与面积，读温升；与几何脚本结果交叉核对。"
      automatable: partial
    - method: thermal_sim
      tool: "热仿真(可选)"
      check: "高电流密集区域用热仿真核对局部板温。"
      automatable: partial
  sources:
    - title: "Determining Circuit Board Current Carrying Capability (IPC-2152 how-to)"
      url: "https://frontdoor.biz/PCBportal/HowTo2152.pdf"
      publisher: "Jack Olson, CID+"
      kind: paper
    - title: "UltraCAD PCB Trace Current/Temperature Calculator Operator's Manual"
      url: "https://ultracad.com/calculators/ucadpcb4operatormanual.pdf"
      publisher: "UltraCAD Design"
      kind: tool_doc
    - title: "AN-1229 SIMPLE SWITCHER PCB Layout Guidelines"
      url: "https://www.ti.com/lit/an/snva054c/snva054c.pdf"
      publisher: "Texas Instruments"
      kind: app_note
      section: "§6.1 Current Handling Capability"
    - title: "IPC-2152 Standard for Determining Current Carrying Capacity in Printed Board Design"
      ref: "IPC-2152 (August 2009); IPC-2221B Fig. 6-4"
      publisher: "IPC"
      kind: standard
  confidence: high
  conflicts: "1) IPC-2221 与 IPC-2152 不一致：Olson 指出旧图表（IPC-2221 图 6-4，1950 年代仅有表层走线数据）的内层值据信是把外层值折算（承载能力折半）得来的，并无实验依据；Olson 与 UltraCAD 均指出 IPC-2152 实测显示静止空气下内层走线反而比外层更凉（FR4 导热优于空气）；Olson 还指出旧外层曲线只对大于 3x3 英寸且带平面的板偏安全，所以 IPC-2152 去掉了旧外层曲线。也有博客与计算器网站（AtlasPCB 等，未能核实原文）声称 2152 给内层更低的载流量，与前两者矛盾，取舍：以 Olson/UltraCAD 对 IPC-2152 的解读为准，并用 2152『保守图』作下限。2) 经验宽度各源不同：TI AN-1229 为 12 mil/A（约 0.3 mm/A，仅 1 oz 外层、温升 < 30 C、电流 < 5 A）、TI AN-1149 为 15 mil/A（0.381 mm/A，未指明铜厚）、ROHM 为 1 mm/A，差约 3 倍；取舍：快速筛选取较保守的 15 mil/A，精确核算用 IPC-2152；AN-1229 的 4 A、20 C 温升、1 oz 外层例得 54 mil（1.4 mm，即 0.35 mm/A），与 IPC-2221 外层拟合公式 I=0.048*dT^0.44*A^0.725（A 单位 mil^2，1 oz 厚 1.378 mil；公式出自计算器网站对 IPC-2221 的转述，未读到标准原文）的计算结果（约 52 mil）一致。3) 这些每安培经验值针对外层走线（AN-1229 明说只考虑外层/双层板），不要直接套用到内层。"
  tags: [cat-feeder]

- id: PWR-RTE-006
  title: 换层大电流路径按电流估算并联过孔数量
  domain: power
  stage: routing
  severity: should
  rule: 大电流走线换层时按电流确定过孔数量，并联多个过孔，不要用单个过孔；主电源走线换层至少两个过孔。
  rationale: 过孔是镀铜筒，截面积只有几十平方密尔，电阻和温升在大电流下不可忽略；多孔并联同时降低电感。
  applies_to: [power-routing, motor-drive, boost, buck]
  parameters:
    - name: vias_per_amp_slva773
      op: ">="
      value: 1
      unit: "vias per A"
      note: "TI SLVA773 §1：每安培一个过孔。"
    - name: vias_per_amp_an1149
      op: ">="
      value: 5
      unit: "vias per A"
      note: "TI AN-1149 §5：每 200 mA 一个标准过孔，即 5 个/A。"
    - name: main_power_trace_min_vias
      op: ">="
      value: 2
      unit: pcs
      note: "Espressif §1.4.2：主电源走线换层至少两个过孔。"
  verify:
    - method: geometry_script
      tool: "pcbnew Python"
      check: "对每条标注电流 I 的网络，找出所有换层位置，统计并联过孔数 N，要求 N >= max(2, ceil(I / 1 A))(采用 SLVA773 的较宽松值，保守者取 ceil(I/0.2 A))；输出 N 与电流。"
      automatable: full
    - method: tline_calc
      tool: "IPC-2152 过孔计算(镀层厚度按 20~25 um 估计，为工程假设；ROHM 图 12/14 用 15~18 um)"
      check: "按过孔筒壁截面积 π*t*(d+t) 估算每孔载流，与 N 交叉验证。"
      automatable: partial
  sources:
    - title: "Five Steps to a Good PCB Layout of a Boost Converter (SLVA773)"
      url: "https://www.ti.com/lit/an/slva773/slva773.pdf"
      publisher: "Texas Instruments"
      kind: app_note
      section: "Step 1"
    - title: "AN-1149 Layout Guidelines for Switching Power Supplies"
      url: "https://www.ti.com/lit/an/snva021c/snva021c.pdf"
      publisher: "Texas Instruments"
      kind: app_note
      section: "§5 Traces and Ground Plane"
    - title: "PCB Layout Techniques of Buck Converter (60AN066E)"
      url: "https://fscdn.rohm.com/en/products/databook/applinote/ic/power/switching_regulator/converter_pcb_layout_appli-e.pdf"
      publisher: "ROHM"
      kind: app_note
      section: "§10-3 Allowable Current of Via, Figure 14"
    - title: "ESP Hardware Design Guidelines - ESP32-C3, Power Supply (four-layer PCB)"
      url: "https://docs.espressif.com/projects/esp-hardware-design-guidelines/en/latest/esp32c3/esp-hardware-design-guidelines-en-master-esp32c3.pdf"
      publisher: "Espressif"
      kind: vendor_guide
      section: "§1.4.2"
  confidence: medium
  conflicts: "两份 TI 文档相差 5 倍：SLVA773（SLYT614 也同样写）每安培一个过孔，AN-1149 每 200 mA 一个过孔。ROHM 60AN066E §10-3 图 14 给出按 1.6 mm 板厚、约 15~18 um 镀层、线宽按 2 mm/A 折算的单孔允许电流：0.3 mm 孔约 0.4 A、0.4 mm 孔约 0.6 A、0.8 mm 孔约 1.2 A，折合 0.3 mm 孔约 2.5 个/A、0.4 mm 孔约 1.7 个/A，介于 SLVA773 的 1 个/A 与 AN-1149 的 5 个/A 之间。取舍：连续大电流路径取保守值（每 0.2~0.5 A 一个），短时电流和并联众多时可放宽；并且应让并联过孔均匀分布，以免电流集中。"
  tags: [cat-feeder]

- id: PWR-RTE-007
  title: 电流检测放大器输入走开尔文线接到分流电阻焊盘
  domain: power
  stage: routing
  severity: must
  rule: INA199 等分流监测器的 IN+ 与 IN- 用独立的开尔文（四线）走线直接连到分流电阻两端的感测焊盘，尽量靠近电阻本体，不经过负载电流的铜皮；两根感测线平行靠近走线。
  rationale: 毫欧级分流上，任何额外的大电流路径电阻都会直接计入测量，造成显著误差；感测线与功率线共享铜皮就把功率路径压降当作信号。
  applies_to: [shunt, current-sense, ina199, motor-drive]
  verify:
    - method: geometry_script
      tool: "pcbnew Python"
      check: "检查 IN+/IN- 网络：每个网络仅连接到分流电阻的一个感测焊盘和放大器引脚(及滤波元件)，铜路径不与大电流网络共用铜皮；两线长度差小于 20%(阈值为初值，来源未给)。"
      automatable: full
    - method: bench
      tool: "毫伏表/示波器"
      check: "施加已知电流(如 1 A)，量分流两端电压与放大器输入电压是否一致，偏差应小于分流电阻容差。"
      automatable: manual
  sources:
    - title: "INA199 Voltage-Output, Current-Shunt Monitor"
      url: "https://www.ti.com/lit/ds/symlink/ina199.pdf"
      publisher: "Texas Instruments"
      kind: datasheet
      section: "§10.1 Layout Guidelines; §7.3.1 Basic Connections"
  confidence: high
  tags: [cat-feeder]

- id: PWR-RTE-008
  title: 3.3 V 电源走线按 Espressif 最小线宽
  domain: power
  stage: routing
  severity: should
  rule: ESP32-C3 的 3.3 V 主电源走线宽度不小于 25 mil，VDD3P3 走线不小于 20 mil，其他电源走线建议 10 mil，电源走线周围用接地铜包围；电源经星形分支到各引脚，每个电源引脚就近放去耦电容并在电容地焊盘旁加地过孔。
  rationale: 射频发射时电流突增，细走线的压降和电感会使供电塌陷；星形分支减小引脚间耦合。
  applies_to: [esp32-c3, power-routing]
  parameters:
    - name: main_3v3_trace_width_min
      op: ">="
      value: 25
      unit: mil
      note: "Espressif §1.4.2（该节针对推荐的四层板设计，两层板可参照但需自行核算载流与压降）。"
    - name: vdd3p3_trace_width_min
      op: ">="
      value: 20
      unit: mil
      note: "Espressif §1.4.2。"
    - name: other_power_trace_width
      op: "=="
      value: 10
      unit: mil
      note: "推荐值。"
  verify:
    - method: geometry_script
      tool: "pcbnew Python"
      check: "对 +3V3 网络从稳压器到模块各电源引脚的全路径取最窄处，要求 >= 25 mil(0.635 mm)；VDD3P3 对应网络段 >= 20 mil；输出列表。"
      automatable: full
  sources:
    - title: "ESP Hardware Design Guidelines - ESP32-C3, Power Supply"
      url: "https://docs.espressif.com/projects/esp-hardware-design-guidelines/en/latest/esp32c3/esp-hardware-design-guidelines-en-master-esp32c3.pdf"
      publisher: "Espressif"
      kind: vendor_guide
      section: "§1.4.2"
  confidence: high
  tags: [cat-feeder]

- id: PWR-PLN-001
  title: 变换器热回路下方保持连续地平面
  domain: power
  stage: plane_pour
  severity: should
  rule: 双层或多层板上，变换器及其热回路正下方的一层保持完整连续的地平面，不被切割、不开槽；SW 节点铜皮不要叠在地平面的同一位置之外制造割裂；电感正下方应避免地铜和敏感信号线。
  rationale: 回流电流高频时紧贴信号路径下方，连续地平面使环路面积最小、电感最低；割裂的地平面像缝隙天线。但电感下方的地铜会产生涡流使电感量和 Q 下降，并可能把开关噪声耦合到其他层。
  applies_to: [buck, boost, flyback, two-layer, four-layer]
  verify:
    - method: geometry_script
      tool: "pcbnew Python"
      check: "取热回路多边形(见 PWR-PLC-001)在地层上的投影，检查该区域内地铜覆盖率 >= 95%(阈值为初值，来源未给)，且无槽/开口穿过；检测电感封装外框正下方各层是否存在地铜或非 SW 信号线，输出供评审。"
      automatable: partial
    - method: drc
      tool: "KiCad zone 填充 + 自定义规则"
      check: "地铜皮 zone 的最小宽度、被切断的孤岛数为 0。"
      automatable: partial
  sources:
    - title: "AN-1229 SIMPLE SWITCHER PCB Layout Guidelines"
      url: "https://www.ti.com/lit/an/snva054c/snva054c.pdf"
      publisher: "Texas Instruments"
      kind: app_note
      section: "§5, §7 Ground Plane"
    - title: "PCB Layout Techniques of Buck Converter (60AN066E)"
      url: "https://fscdn.rohm.com/en/products/databook/applinote/ic/power/switching_regulator/converter_pcb_layout_appli-e.pdf"
      publisher: "ROHM"
      kind: app_note
      section: "§5 (no ground layer directly below the inductor, Figure 6-c)"
    - title: "AN-1149 Layout Guidelines for Switching Power Supplies"
      url: "https://www.ti.com/lit/an/snva021c/snva021c.pdf"
      publisher: "Texas Instruments"
      kind: app_note
      section: "§5 Traces and Ground Plane"
  confidence: medium
  conflicts: "来源冲突：TI AN-1229/AN-1149 要求地平面连续（AN-1149 建议两面都铺地以吸收电感辐射的 EMI）；ROHM 60AN066E 则指出电感正下方不要放地层（涡流使电感量和 Q 下降），也不要在电感下方走线，必须时用闭磁路电感。取舍：整个变换器区域保持连续地平面，但在电感本体正下方避免走敏感线；使用屏蔽/闭磁路电感时地铜可保留。"
  tags: [cat-feeder]

- id: PWR-PLN-002
  title: 信号地与功率地在 IC 地点单点汇合
  domain: power
  stage: plane_pour
  severity: should
  rule: 把功率元件（输入/输出电容、电感、IC 的 PGND）的地与小信号元件（FB 分压、软启动、补偿、AGND）的地分区布局，在 IC 的 PGND/散热焊盘附近单点连接，使功率电流不流过信号地；输入电容地与输出电容地之间拉开 1~2 cm。这种分区应通过布局和走线实现，不是把地平面切断。
  rationale: 功率地电流若流过信号地，会把噪声耦合进控制电路，导致输出电压调整差、限流不准；散热焊盘处汇合还提供最佳散热路径。
  applies_to: [buck, boost, flyback, mixed-signal]
  parameters:
    - name: cin_cout_ground_separation
      op: ">="
      value: 10
      unit: mm
      note: "ROHM 60AN066E：CIN 与 CO 的地至少相隔 1~2 cm。"
  verify:
    - method: geometry_script
      tool: "pcbnew Python"
      check: "追踪 AGND 网络(FB 分压下端等)到地平面的连接点：只允许一个连接点，距离 IC PGND/散热焊盘 < 3 mm(初值，来源未给)；确认 AGND 路径上没有输入电容、输出电容地电流。"
      automatable: partial
    - method: netlist_diff
      tool: "kicad-cli 网表"
      check: "若设计中把 AGND、PGND 分为不同网络，必须通过唯一的 0 ohm/网桥或在 IC 下方的铜连接。"
      automatable: full
  sources:
    - title: "Five steps to a great PCB layout for a step-down converter (SLYT614)"
      url: "https://www.ti.com/lit/pdf/slyt614"
      publisher: "Texas Instruments"
      kind: app_note
      section: "Step #5"
    - title: "Five Steps to a Good PCB Layout of a Boost Converter (SLVA773)"
      url: "https://www.ti.com/lit/an/slva773/slva773.pdf"
      publisher: "Texas Instruments"
      kind: app_note
      section: "Step 5"
    - title: "PCB Layout Techniques of Buck Converter (60AN066E)"
      url: "https://fscdn.rohm.com/en/products/databook/applinote/ic/power/switching_regulator/converter_pcb_layout_appli-e.pdf"
      publisher: "ROHM"
      kind: app_note
      section: "§3"
  confidence: high
  conflicts: "AN-1229 §7 认为低功率 SIMPLE SWITCHER 用一个完整单地平面即可（高功率多层板才拆分功率地与信号地平面），并强调不要割裂平面；SLYT614/SLVA773 要求功率地与信号地分开、再单点汇合。取舍：两者可兼得：在同一连续地平面上，通过元件分区与电流路径控制，让功率电流不经过信号地区域，并在 PGND/散热焊盘处汇合；不要靠挖槽分割平面。"

- id: PWR-PLN-003
  title: 降压 IC 散热焊盘用 0.3 mm 小孔阵列接地
  domain: power
  stage: plane_pour
  severity: should
  rule: 开关稳压器底部散热焊盘（QFN/HTSOP 等）下用小孔径（约 0.3 mm 钻孔）、约 1.0~1.2 mm 中心距的过孔阵列接到地平面；孔不要过大，必要时靠近而非完全位于焊盘正下方，以免焊料被吸走造成虚焊。
  rationale: 热过孔绕过 FR4 把热量传到另一面，可使热阻降低 50%~70%；孔径过大会在回流焊中吸锡。
  applies_to: [buck, boost, qfn, htsop, thermal-pad]
  parameters:
    - name: thermal_via_drill
      op: range
      value: [0.3, 0.33]
      unit: mm
      note: "TI AN-1229：0.3~0.33 mm 桶径，使孔在镀铜后几乎被填满；ROHM 内径 0.3 mm。"
    - name: thermal_via_pitch
      op: range
      value: [1.0, 1.2]
      unit: mm
      note: "AN-1229：1~1.2 mm；ROHM 约 1.2 mm。"
    - name: thermal_resistance_reduction_with_vias
      op: range
      value: [50, 70]
      unit: "%"
      note: "AN-1229 §6.3：使用热过孔可降热阻 50%~70%。"
  verify:
    - method: geometry_script
      tool: "pcbnew Python"
      check: "对每个带散热焊盘的电源 IC：统计焊盘内过孔数、孔径、相邻中心距；要求孔径 0.3~0.33 mm，间距 1.0~1.2 mm，过孔连接到地平面且无热隔离(thermal relief)。"
      automatable: full
    - method: drc
      tool: "KiCad DRC + 板厂工艺能力"
      check: "确认板厂对焊盘内过孔(via-in-pad)的工艺要求(是否需要树脂塞孔/盖油)，避免吸锡。"
      automatable: manual
  sources:
    - title: "AN-1229 SIMPLE SWITCHER PCB Layout Guidelines"
      url: "https://www.ti.com/lit/an/snva054c/snva054c.pdf"
      publisher: "Texas Instruments"
      kind: app_note
      section: "§6.3 Thermal Management"
    - title: "PCB Layout Techniques of Buck Converter (60AN066E)"
      url: "https://fscdn.rohm.com/en/products/databook/applinote/ic/power/switching_regulator/converter_pcb_layout_appli-e.pdf"
      publisher: "ROHM"
      kind: app_note
      section: "§4 Introduce Thermal Via, Figure 4"
    - title: "Five steps to a great PCB layout for a step-down converter (SLYT614)"
      url: "https://www.ti.com/lit/pdf/slyt614"
      publisher: "Texas Instruments"
      kind: app_note
      section: "Step #5"
  confidence: high

- id: PWR-PLN-004
  title: 电机电流回路用独立地铜，单点接到逻辑地
  domain: power
  stage: plane_pour
  severity: should
  rule: 电机电流（FET 源极、分流电阻、续流二极管、母线电容地端）的回路用一块独立的地铜或宽走线，在一个点（如分流电阻远端或母线电容地）接到逻辑/模拟地平面，使电机电流不流过 MCU、HX711、INA199 参考点的地区域；INA199 的 REF/GND 接在无大电流的安静地点。
  rationale: 电机电流在地平面上产生的压降会直接叠加到逻辑地和 ADC 参考上；开尔文分流只能消除分流本身以外的压降，不能消除参考点漂移。
  applies_to: [motor-drive, mixed-signal, current-sense]
  verify:
    - method: geometry_script
      tool: "pcbnew Python"
      check: "提取电机回路地网络的铜区域，确认其与逻辑地区域只有一个窄连接点；测从该连接点到 MCU/INA199 GND 引脚的路径不穿过电机电流回路铜皮。"
      automatable: partial
    - method: bench
      tool: "示波器"
      check: "电机启停与堵转时测 INA199 REF 与 MCU GND 之间的电压差，应远小于 ADC 1 LSB 对应电压。"
      automatable: manual
  sources:
    - title: "Five Steps to a Good PCB Layout of a Boost Converter (SLVA773)"
      url: "https://www.ti.com/lit/an/slva773/slva773.pdf"
      publisher: "Texas Instruments"
      kind: app_note
      section: "Step 5 (no large power current through Signal-Ground)"
    - title: "INA199 Voltage-Output, Current-Shunt Monitor"
      url: "https://www.ti.com/lit/ds/symlink/ina199.pdf"
      publisher: "Texas Instruments"
      kind: datasheet
      section: "§10.1 Layout Guidelines"
    - title: "Dealing with Motor Noise (Pololu)"
      url: "https://www.pololu.com/docs/0J15/9"
      publisher: "Pololu"
      kind: vendor_guide
  confidence: medium
  tags: [cat-feeder]

- id: PWR-STK-001
  title: 按电流选外层铜厚并确认板厂实际铜厚
  domain: power
  stage: stackup
  severity: consider
  rule: 电流较大的双层板按电流和可用走线宽度选择外层铜厚（1 oz 或 2 oz），2 oz 约使所需线宽减半；同时向板厂确认成品铜厚（含孔镀铜后外层有效铜厚会增大）。
  rationale: 外层 1 oz 铜经过孔金属化后实际更接近 1.4 oz；铜越厚，同一线宽载流越大，但最小线宽/线距受工艺限制。
  applies_to: [two-layer, high-current, motor-drive]
  parameters:
    - name: copper_weight_width_ratio_2oz_vs_1oz
      op: "=="
      value: 0.5
      unit: ratio
      note: "AN-1229：2 oz 板所需线宽恰为 1 oz 的一半；ROHM：2 oz 为 0.7 mm/A、1 oz 为 1 mm/A，比值 0.7。"
  verify:
    - method: review
      tool: "与板厂确认叠层与成品铜厚；PCB 订单检查"
      check: "订单上的铜厚规格与 PWR-RTE-005 核算时所用铜厚一致；若按 1 oz 核算过，不得被改成 0.5 oz。"
      automatable: manual
    - method: tline_calc
      tool: "IPC-2152 计算器"
      check: "用成品铜厚重算最窄功率走线温升。"
      automatable: partial
  sources:
    - title: "AN-1229 SIMPLE SWITCHER PCB Layout Guidelines"
      url: "https://www.ti.com/lit/an/snva054c/snva054c.pdf"
      publisher: "Texas Instruments"
      kind: app_note
      section: "§6.1"
    - title: "PCB Layout Techniques of Buck Converter (60AN066E)"
      url: "https://fscdn.rohm.com/en/products/databook/applinote/ic/power/switching_regulator/converter_pcb_layout_appli-e.pdf"
      publisher: "ROHM"
      kind: app_note
      section: "§5 and Figure 5"
  confidence: medium
  tags: [cat-feeder]

- id: PWR-VER-001
  title: 开关电源环路增益相位裕量与穿越频率签核
  domain: power
  stage: verification
  severity: must
  rule: 对每个带反馈环的开关变换器，用 SPICE AC 分析（或实测波特图）确认环路增益穿越频率处相位裕量 >= 45 度（目标 60 度），增益裕量至少 6 dB（10 dB 为好），穿越频率约为开关频率的 1/10~1/5，穿越点斜率约 -20 dB/十倍频；并在输出电容容值/ESR 的降额与公差极值、最小/最大负载、最低/最高输入电压的各角落重复。
  rationale: 相位裕量不足会振铃甚至振荡；输出陶瓷电容的实际容值随偏置显著下降，补偿网络按标称值设计会在极值角落失稳。
  applies_to: [buck, boost, flyback, buck-boost]
  parameters:
    - name: phase_margin_min
      op: ">="
      value: 45
      unit: deg
      note: "TI Sheehan & Diana：45 度及以上为设计目标；MaxLinear ANP-16 要求大于 45 度；TI SLVA432 指出 60 度是通常的目标。"
    - name: phase_margin_target
      op: "=="
      value: 60
      unit: deg
      note: "TI SLVA432：非陶瓷输出电容因老化 ESR 增大，目标可再高一些。"
    - name: gain_margin_min
      op: ">="
      value: 6
      unit: dB
      note: "TI：至少 -6 dB，-10 dB 为好。"
    - name: crossover_over_fsw
      op: range
      value: [0.1, 0.2]
      unit: "fc/fsw"
      note: "TI：开关频率的 1/5~1/10；MaxLinear ANP-16：fs/10 < fc < fs/5；SLVA432 以 1/5 为实践目标。"
  verify:
    - method: spice
      tool: "ngspice/LTspice 平均模型或厂商模型，插入断环注入电阻做 AC 扫描"
      check: "读增益 0 dB 的频率 fc 与此处相位裕量 PM、相位 -180 度处的增益裕量 GM；用 .step 扫描 Cout(C_eff，见 PWR-SCH-006)、ESR、Iload、Vin 的所有极值角落，全部满足 PM >= 45 度、GM >= 6 dB、fc 在 [fsw/10, fsw/5] 内。"
      automatable: full
    - method: bench
      tool: "网络分析仪 + 注入变压器，或负载阶跃测试"
      check: "实测环路增益，或观察负载阶跃响应的阻尼，对照 SPICE。"
      automatable: manual
  sources:
    - title: "Switch-mode power converter compensation made easy (Sheehan, Diana)"
      url: "https://e2e.ti.com/cfs-file/__key/communityserver-discussions-components-files/196/switchingpower_5F00_compensation.pdf"
      publisher: "Texas Instruments"
      kind: app_note
      section: "Phase and gain-margin definitions"
    - title: "ANP-16 Loop Compensation of Voltage-Mode Buck Converters"
      url: "https://www.maxlinear.com/appnote/anp-16_typeiiiloopcomp_101206.pdf"
      publisher: "MaxLinear (Sipex)"
      kind: app_note
    - title: "Power Topology - Buck Converter (SLVA432)"
      url: "https://www.ti.com/lit/an/slva432/slva432.pdf"
      publisher: "Texas Instruments"
      kind: app_note
      section: "Type-III compensation design"
  confidence: high
  conflicts: "相位裕量目标不一：45 度（TI Sheehan、MaxLinear）与 60 度（TI SLVA432）。取舍：45 度为下限，设计目标取 60 度并在容差角落仍不低于 45 度。"

- id: PWR-VER-002
  title: 负载阶跃响应与 LDO 稳定性的 SPICE 与实测
  domain: power
  stage: verification
  severity: must
  rule: 每个稳压器（LDO 和开关电源）都要做负载阶跃（如 10%->90% 额定电流）的仿真和实测，观察输出过冲/下冲幅度和振铃衰减；LDO 要在整板装好所有输出旁路电容后，拆掉被供电 IC、用等效电阻做阶跃，振铃明显说明相位裕量不足。
  rationale: 阶跃响应是相位裕量的直接可观察量。过冲/下冲约等于阶跃电流乘输出阻抗，LDO 电源上遗漏的陶瓷旁路电容会使相位裕量骤降而 AC 仿真漏掉。
  applies_to: [ldo, buck, boost, ams1117]
  parameters:
    - name: load_step_overshoot_formula
      op: qualitative
      value: null
      note: "TI SLYT639：dV ≈ dIout × Zout(fc)；纹波 ≈ dIL × Zout(fsw)。"
  verify:
    - method: spice
      tool: "ngspice 瞬态，含 Cout(ESR、ESL、降额)、旁路电容及走线电感"
      check: "10%->90% 阶跃，上升/下降时间 <= 1 us(初值)，读 Vout 最大偏差 dV 与稳定时间，要求 dV 在系统允许范围内且初始尖峰之后振铃不超过 4 次（SLVA115A：通常 4 个振铃以内表示相位裕量足够）；扫描 Cout 极值。"
      automatable: full
    - method: bench
      tool: "MOSFET 开关 + 函数发生器 + 示波器(TI SLVA115A 图 3 的方法)"
      check: "在整板条件下做阶跃，记录 Vout，阻尼比不足(明显振铃)判不通过；LDO 需拆掉被供电 IC，用电阻代替负载。"
      automatable: manual
  sources:
    - title: "ESR, Stability, and the LDO Regulator (SLVA115A)"
      url: "https://www.ti.com/lit/pdf/slva115"
      publisher: "Texas Instruments"
      kind: app_note
      section: "Figure 3 load transient setup"
    - title: "AN-1482 LDO Regulator Stability Using Ceramic Output Capacitors"
      url: "https://www.ti.com/lit/an/snva167a/snva167a.pdf"
      publisher: "Texas Instruments"
      kind: app_note
      section: "§8"
    - title: "Ceramic or electrolytic output capacitors in DC/DC converters - Why not both? (SLYT639)"
      url: "https://www.ti.com/lit/an/slyt639/slyt639.pdf"
      publisher: "Texas Instruments"
      kind: app_note
  confidence: high
  tags: [cat-feeder]

- id: PWR-VER-003
  title: 上电浪涌电流与热插拔电压过冲仿真
  domain: power
  stage: verification
  severity: should
  rule: 仿真并实测上电或负载接入时对总电容充电的浪涌电流 I=C*dV/dt，及电源热插入时输入电压最大值；浪涌电流必须小于连接器、PPTC 保持电流之外的限制与电源能力，输入电压峰值必须低于稳压器 Vin 绝对最大额定值。
  rationale: 浪涌电流可能超过连接器和走线的载流能力，使电源轨跌出稳压、系统进入异常状态；陶瓷输入电容与线缆电感还会产生过冲（见 PWR-SCH-005）。
  applies_to: [power-entry, ldo, buck, hot-plug]
  parameters:
    - name: inrush_formula
      op: qualitative
      value: null
      note: "TI SLVA670A：I_INRUSH = C_LOAD × dV/dt；示例 3.3 V、22 uF、限 600 mA，需约 121 us 上升时间。"
  verify:
    - method: spice
      tool: "ngspice 瞬态"
      check: "电源阶跃(上升时间 10 us~10 ms 的角落)，串入线缆电阻/电感，读入口电流峰值和稳压器输入电压峰值；要求峰值电流 < PPTC 保持电流与连接器额定电流，Vin 峰值 < 稳压器绝对最大额定值。"
      automatable: full
    - method: bench
      tool: "电流探头 + 示波器"
      check: "反复热插拔和上电，捕获入口电流与 Vin 峰值。"
      automatable: manual
  sources:
    - title: "Managing Inrush Current (SLVA670A)"
      url: "https://www.ti.com/lit/an/slva670a/slva670a.pdf"
      publisher: "Texas Instruments"
      kind: app_note
      section: "§1 What is Inrush Current?"
    - title: "AN88 Ceramic Input Capacitors Can Cause Overvoltage Transients (未能打开原文，据搜索摘要)"
      url: "https://www.analog.com/media/en/technical-documentation/application-notes/an88f.pdf"
      publisher: "Analog Devices (Linear Technology)"
      kind: app_note
  confidence: medium
  tags: [cat-feeder]

- id: PWR-VER-004
  title: 电机启动/堵转期间核算电源轨跌落与欠压余量
  domain: power
  stage: verification
  severity: must
  rule: 仿真并实测电机启动、堵转（和刚上电同时 Wi-Fi 发射）时的最坏电源跌落：5 V 输入经线缆、PPTC、连接器后的最低电压，LDO 输出最低电压；要求 3.3 V 轨不低于 3.0 V（模块下限、监控芯片阈值），且 LDO 压差余量仍成立。母线电容要足够吸收电机电流突变。
  rationale: 电机电流突变在电源内阻上造成电压凹陷，会使 LDO 掉出稳压而让 MCU 复位。Pololu 提示用足够大的去耦电容隔离噪声，并说明电机噪声可使 MCU 电源电压凹陷而复位。
  applies_to: [motor-drive, ldo, esp32-c3, brown-out]
  parameters:
    - name: min_3v3_rail
      op: ">="
      value: 3.0
      unit: V
      note: "Espressif：数字电源 3.0~3.6 V；监控芯片阈值推荐约 3.0 V。"
    - name: bulk_cap_motor_supply
      op: qualitative
      value: null
      note: "Pololu 建议在需隔离噪声的电子器件旁放至少几百 uF 的电解电容，额定电压至少 2 倍输入电压（针对其电机驱动板，原文无单一数值）。示例板用的 100 uF 低于该建议量级，不是来源数值，应以仿真/实测为准而不是照搬。"
  verify:
    - method: spice
      tool: "ngspice 瞬态，电机用 R-L-反电势或恒流堵转源"
      check: "5 V 源内阻 + 线缆 + PPTC(热态最大电阻) + 母线电容(降额)；电机堵转 1 s，同时 Wi-Fi 脉冲 0.35 A，读 3.3 V 最低值与 LDO 的 Vin-Vout，要求 >= 3.0 V 且 Vin-Vout >= 压差(PWR-ARC-003)。"
      automatable: full
    - method: bench
      tool: "示波器 4 通道"
      check: "实测上述工况下 5 V 入口、LDO 输入、3.3 V 输出、复位线，确认无复位且最低值满足。"
      automatable: manual
  sources:
    - title: "Dealing with Motor Noise (Pololu)"
      url: "https://www.pololu.com/docs/0J15/9"
      publisher: "Pololu"
      kind: vendor_guide
      section: "§9 intro and item 4"
    - title: "ESP Hardware Design Guidelines - ESP32-C3, Power-up and Reset Timing"
      url: "https://docs.espressif.com/projects/esp-hardware-design-guidelines/en/latest/esp32c3/esp-hardware-design-guidelines-en-master-esp32c3.pdf"
      publisher: "Espressif"
      kind: vendor_guide
      section: "§1.3.2-§1.3.3"
  confidence: medium
  tags: [cat-feeder]

- id: PWR-VER-005
  title: PDN 目标阻抗与电容网络反谐振检查
  domain: power
  stage: verification
  severity: should
  rule: 对负载瞬态大的电源轨，先按 Z_target = (Vdd × 允许纹波%) / I_transient 确定目标阻抗，再用 PDN 仿真或阻抗测量确认从 DC 到所需带宽的阻抗都低于目标；多种容值并联时检查电容间的反谐振峰，不要不检查就添加电容。
  rationale: 不同容值电容的 ESL 与另一电容的容值形成并联谐振，产生阻抗尖峰，可能比任一电容单独时还高；安装电感常常主导高频阻抗，因此过孔和焊盘布局比标称容值更重要。
  applies_to: [pdn, decoupling, mcu, esp32-c3]
  parameters:
    - name: target_impedance
      op: qualitative
      value: null
      note: "Z_target = ΔV / I_transient；JLCPCB 示例：1.0 V 轨、5% 纹波、10 A 瞬态对应 5 mohm。MCU 轨上的 ΔV 与 I 需按数据手册电压范围(如 3.0~3.6 V)与射频发射电流估算。"
  verify:
    - method: pi_sim
      tool: "PDN 阻抗仿真(如 ngspice 阻抗模型或厂商 PDN 工具)"
      check: "建立稳压器输出阻抗、各电容(含 ESR、ESL 和安装电感)和平面电容模型，扫频 1 kHz~100 MHz，读阻抗曲线，对照 Z_target，找反谐振峰高度。"
      automatable: partial
    - method: bench
      tool: "VNA 2 端口并联直通法(亚毫欧)"
      check: "实测电源轨阻抗；1 端口反射法无法分辨亚毫欧阻抗。"
      automatable: manual
  sources:
    - title: "AN2018_1 The Target Impedance Approach to PDN Design"
      url: "https://www.icd.com.au/articles/TargetZ_Design007-Feb2018.pdf"
      publisher: "In-Circuit Design (Barry Olney)"
      kind: paper
    - title: "Mastering PDN Impedance for Stable Power Delivery in PCBs"
      url: "https://jlcpcb.com/blog/pdn-impedance-high-performance-pcb"
      publisher: "JLCPCB"
      kind: blog
    - title: "PDN Application of Ferrite Beads (Steve Weir)"
      url: "https://emcfastpass.com/wp-content/uploads/2017/04/PDN_Ferrite_Beads.pdf"
      publisher: "IPBLOX"
      kind: paper
  confidence: medium
  conflicts: "JLCPCB 博客本身的算例存在数值不一致（把 50 mV 说成 1.0 V 轨的 3%），取其公式而不取其算例；MCU 小板上 Z_target 的 I_transient 缺少公认估算法，需依数据手册和实测定。"

- id: PWR-VER-006
  title: 以正确探测方法测量 SW 节点振铃并核对余量
  domain: power
  stage: verification
  severity: should
  rule: 测量 SW 节点尖峰和振铃时用带宽 >= 500 MHz 的探头，最好用 1 GHz 差分探头并探在 SW 引脚与散热焊盘/GND 之间的最近处，以最短地线；读到的峰值要低于 IC 引脚的绝对最大额定值并留出余量。
  rationale: 单端探头的长地线环路会拾取噪声并使峰值虚高或虚低：TI 的例子中同一块板单端测得 21.76 V，差分测得 18.4 V。
  applies_to: [buck, boost, synchronous-buck]
  parameters:
    - name: probe_bandwidth_min
      op: ">="
      value: 500
      unit: MHz
      note: "TI SLUA851A：电压探头带宽 500 MHz 以上；推荐 1 GHz 差分探头。"
  verify:
    - method: bench
      tool: "1 GHz 差分探头 + 示波器；板上预留 SW 与 GND 测试点(地簧针焊盘)"
      check: "满载及负载阶跃下测 SW 峰值，并检查 dV/dt；峰值须低于 IC SW 引脚绝对最大额定值，余量建议 >= 20%(初值，来源未给)。"
      automatable: manual
    - method: spice
      tool: "ngspice，含寄生 Lp/Coss"
      check: "与实测比较，校准寄生参数，再用于改版预测。"
      automatable: partial
  sources:
    - title: "Minimizing Switch Ringing on TPS53318 and TPS53319 Family of Devices (SLUA851A)"
      url: "https://www.ti.com/lit/pdf/slua851"
      publisher: "Texas Instruments"
      kind: app_note
      section: "§2 Proper Measurement Method of Switch Ringing"
  confidence: high

- id: PWR-VER-007
  title: 估算效率与损耗预算并与热限比较
  domain: power
  stage: verification
  severity: consider
  rule: 对每个稳压器给出损耗预算：LDO 的效率约为 Vout/Vin（再计入静态电流），降压按导通、开关、电感、二极管损耗逐项估算；非同步降压的二极管损耗按平均电流 Iout×(1-D)×Vf 计；总损耗与封装/铜面积决定的热限比较。
  rationale: 损耗直接决定温升，也是选 LDO 还是开关电源的依据；二极管损耗取决于平均电流而不是负载电流。
  applies_to: [ldo, buck, boost]
  parameters:
    - name: ams1117_quiescent_current_max
      op: "<="
      value: 10
      unit: mA
      note: "AMS1117 数据手册：静态电流典型 3 mA、最大 10 mA。"
  verify:
    - method: spice
      tool: "ngspice 瞬态平均功耗，.meas"
      check: "稳态仿真下统计 Pin、Pout，算 η=Pout/Pin 与各器件耗散；与元件热限比较(见 PWR-ARC-002)。"
      automatable: partial
    - method: bom_check
      tool: "Python 计算"
      check: "LDO：P=(Vin-Vout)*Iout+Vin*Iq；二极管：P=Iout*Vf*(1-D)，如 AN-1229 的例子 5 A、Vf=0.5 V、D=0.4 时 1.5 W。"
      automatable: full
  sources:
    - title: "AN-1229 SIMPLE SWITCHER PCB Layout Guidelines"
      url: "https://www.ti.com/lit/an/snva054c/snva054c.pdf"
      publisher: "Texas Instruments"
      kind: app_note
      section: "§6.3 (diode dissipation example)"
    - title: "AMS1117 datasheet (SLKOR copy) - Electrical Characteristics"
      url: "https://mm.digikey.com/Volume0/opasdata/d220001/medias/docus/8122/AMS11173.3SOT223.pdf"
      publisher: "Advanced Monolithic Systems / SLKOR"
      kind: datasheet
      section: "Quiescent current; Thermal Protection"
  confidence: medium
  tags: [cat-feeder]
