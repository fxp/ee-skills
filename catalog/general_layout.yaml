- id: GEN-PLN-004
  title: 2 层板用地网格 / 整面地铺铜并多打缝合过孔
  domain: general
  stage: plane_pour
  severity: should
  rule: 2 层板把两层所有空白处都铺 GND 铜并连成网格，在顶层走线与底层走线交叉处、地铜的连接处尽量多打地过孔；每块地铜至少两处与其他地铜连接，避免只有一端连的地线或铺铜。
  rationale: 网格化让每条信号线下方都有地回流，近似 4 层板的地平面；只在一点连接的铺铜只是一个屏蔽层，连接在两点以上才成为导体，成为地网格的一部分。
  verify:
    - method: geometry_script
      tool: "pcbnew"
      check: "取每层所有 GND 填充连通区，统计每个连通区被过孔 / 其他层 GND 铜连接的点数；通过判据：每个面积大于项目设定值的 GND 区域连接点数 ≥ 2；另检查顶层信号线与底层信号线交叉点旁 3 mm 内是否有 GND 过孔（经验阈值）"
      automatable: full
    - method: drc
      tool: "KiCad DRC"
      check: "“Isolated copper fill”类（孤岛）违规数 = 0；“Via is not connected or is connected on only one layer” = 0"
      automatable: full
  sources:
    - title: "PCB Design Guidelines For Reduced EMI (SZZA009)"
      url: "https://www.ti.com/lit/an/szza009/szza009.pdf"
      publisher: "Texas Instruments"
      kind: app_note
      section: "§2.2.3 Gridding to Create Planes"
    - title: "Hardware design with RP2040"
      url: "https://pip.raspberrypi.com/documents/RP-008279-DS-hardware-design-with-rp2040.pdf"
      publisher: "Raspberry Pi"
      kind: vendor_guide
      section: "§2.4.1 USB（底层几乎整层是地）"
  confidence: high
  applies_to: [2_layer]
  parameters:
    - name: ground_fill_connection_points
      op: ">="
      value: 2
      unit: count
      note: "TI SZZA009：地铜连接在两处以上才算网格的一部分"
  tags: [cat-feeder]

- id: GEN-PLN-005
  title: MCU 下方做地岛，去耦和晶振的地接在上面
  domain: general
  stage: plane_pour
  severity: should
  rule: 2 层板在 MCU 下方的底层做一块与 MCU 地连接的地岛，范围超出器件外轮廓约 1/4 英寸（≈6.35 mm）；去耦电容、电源滤波和晶振电容的地都接到这块地岛，使环路面积（俯视）最小。
  rationale: MCU 的噪声电流集中在其电源 / 地引脚与旁路电容之间；让这些回路在同一块地上闭合，噪声不会外泄到更大的地网络。
  verify:
    - method: geometry_script
      tool: "pcbnew"
      check: "取 MCU（或模块 GND 焊盘区）外包框向外扩 6.35 mm 形成矩形，计算其内底层 GND 填充面积占比，通过判据 ≥ 90%（占比阈值为经验值）；检查去耦电容 GND 焊盘是否位于该矩形内"
      automatable: full
  sources:
    - title: "PCB Design Guidelines For Reduced EMI (SZZA009)"
      url: "https://www.ti.com/lit/an/szza009/szza009.pdf"
      publisher: "Texas Instruments"
      kind: app_note
      section: "§2.1.2–2.1.3 Microcomputer Grounds in One- and Two-Layer Designs"
  confidence: medium
  applies_to: [2_layer, mcu]
  parameters:
    - name: ground_island_margin_beyond_device
      op: ">="
      value: 6.35
      unit: mm
      note: "TI：about 1/4 inch outside the outline of the device"
  conflicts: "模块板的天线端下方必须无铜（见 GEN-PLN-009），地岛只覆盖模块的接地焊盘区而不覆盖天线区。"
  tags: [cat-feeder]

- id: GEN-PLN-006
  title: 地铜用缝合过孔连接，间距不超过 λ/20
  domain: general
  stage: plane_pour
  severity: should
  rule: 顶底层（及内层）地铜之间用地缝合过孔连接，沿板周边、射频 / 天线地周围、信号过孔旁和 TVS 地引脚旁布置；过孔间距小于所关心最高频率的 λ/20。
  rationale: 地铜之间距离过孔太远，铜皮本身会在高频下成为谐振结构或缝隙；板周边的缝合过孔与两个地平面一起能构成法拉第笼，TVS 旁的缝合过孔降低 ESD 回流电感。
  verify:
    - method: geometry_script
      tool: "pcbnew"
      check: "取 GND 过孔坐标，对射频区域和板周边路径（沿板边内缩 1 mm 的多边形）上相邻 GND 过孔的最大间距，通过判据 ≤ λ_eff/20（λ_eff = c / (f·√εeff)，εeff 取 2.8，f 取最高关注频率；2.45 GHz 时约 3.7 mm）。该 εeff 与 Sierra 示例（1 GHz→9 mm）反推一致，为推导值"
      automatable: full
    - method: emc_precompliance
      tool: "近场探头 + 频谱仪"
      check: "对比加缝合过孔前后的板边近场强度，通过判据：关注频点下降 ≥ 3 dB（经验判据）"
      automatable: manual
  sources:
    - title: "7 PCB Design Guidelines for EMI and EMC"
      url: "https://www.protoexpress.com/blog/7-pcb-design-tips-solve-emi-emc-issues/"
      publisher: "Sierra Circuits"
      kind: blog
      section: "stitching vias; via fence"
    - title: "PCB Stack-Up, Part 2 (Henry Ott Consultants)"
      url: "https://hott.shielddigitaldesign.com/techtips/pcb-stack-up-2.html"
      publisher: "Henry Ott Consultants"
      kind: paper
      section: "Fig. 3b"
    - title: "ESD Protection Layout Guide (SLVA680A)"
      url: "https://www.ti.com/lit/an/slva680/slva680.pdf"
      publisher: "Texas Instruments"
      kind: app_note
      section: "§2.4"
  confidence: medium
  applies_to: [2_layer, 4_layer, rf]
  parameters:
    - name: via_fence_spacing_wavelength_fraction
      op: "<"
      value: 0.05
      unit: "wavelength"
      note: "Sierra：小于 λ/20（示例：1 GHz 时小于 9 mm）。λ/20 是经验公式，非标准；2.45 GHz 的 3.7 mm 为本库按同一 εeff 推算"
  conflicts: "λ/20 来自二手博客并无标准出处；Ott 只说两个地平面可以沿板边缝合形成法拉第笼，没有给间距；TI SLVA680A 的例子是在 TVS 地焊盘旁放 1~4 个缝合过孔。RF 领域的天线地缝合细节归 RF 文件。"
  tags: [cat-feeder]

- id: GEN-PLN-007
  title: 去掉死铜和孤岛，不让铺铜悬空
  domain: general
  stage: plane_pour
  severity: should
  rule: 铺铜区设置“移除孤岛（Remove islands）”为 Always（或设最小面积阈值），DRC 中“Isolated copper fill”类违规数为 0；确需保留的悬空铜必须接地。
  rationale: 没有连到任何同网络铜的孤岛是悬空导体，可成为耦合 / 辐射的“天线”，也可能是铜渣；地铺铜只有一端连时只相当于屏蔽层而不是导体。
  verify:
    - method: drc
      tool: "kicad-cli pcb drc --format json"
      check: "违规类型“Isolated copper fill”（孤岛）数 = 0，“Copper sliver”数 = 0；注意 KiCad 只对至少有一处电气连接的区域去孤岛，完全未连接的区域不会被去掉"
      automatable: full
    - method: geometry_script
      tool: "pcbnew：zone.GetFilledPolysList() 取连通块"
      check: "对每个 zone 的每个填充连通块，检查是否至少含一个同网络焊盘 / 过孔 / 走线；通过判据：无孤块"
      automatable: full
  sources:
    - title: "KiCad 9.0 PCB Editor — Zone properties; Miscellaneous DRC checks"
      url: "https://docs.kicad.org/9.0/en/pcbnew/pcbnew.html"
      publisher: "KiCad"
      kind: tool_doc
      section: "Remove islands; Isolated copper fill; Copper sliver"
    - title: "PCB Design Guidelines For Reduced EMI (SZZA009)"
      url: "https://www.ti.com/lit/an/szza009/szza009.pdf"
      publisher: "Texas Instruments"
      kind: app_note
      section: "§2.2.3 Gridding to Create Planes"
  confidence: medium
  applies_to: [kicad]
  conflicts: "“悬空铜是天线”的说法是常见经验；本次调研读到的是 KiCad 对孤岛的处理方式和 TI 对只有一点连接的铺铜的说明，没有找到孤岛辐射的量化来源，所以置信度 medium。"
  tags: [cat-feeder]

- id: GEN-PLN-008
  title: 通孔焊盘用热焊盘，SMD 地焊盘和去耦地直接连
  domain: general
  stage: plane_pour
  severity: should
  rule: 铺铜与焊盘的连接：通孔焊盘（便于手工焊接）用热焊盘（thermal relief），SMD 地焊盘（去耦电容、EPAD 等）与地铜实心连接而不是经细线；每个热焊盘至少保留 2 条辐条。
  rationale: 热焊盘增大焊盘到铜皮的热阻，便于焊接但增大了连接电感；去耦地焊盘需要最短的回流，Espressif 要求地焊盘直接接触地铜而不是经走线。
  verify:
    - method: drc
      tool: "KiCad 自定义规则 + DRC"
      check: "(rule smd_gnd_solid (condition \"A.Pad_Type == 'SMD' && A.NetName == 'GND'\") (constraint zone_connection solid)) 与 (rule pth_gnd_relief (condition \"A.Pad_Type == 'Through-hole' && A.NetName == 'GND'\") (constraint zone_connection thermal_reliefs)) 与 (rule min_spokes (constraint min_resolved_spokes 2))；DRC 里“Thermal relief connection to zone incomplete”数 = 0"
      automatable: full
    - method: bench
      tool: "手工焊接试焊 / 回流后目检"
      check: "通孔地焊盘能被普通烙铁正常焊透、不出现冷焊；小型 SMD 地焊盘回流后无立碑（墓碑）"
      automatable: manual
  sources:
    - title: "KiCad 9.0 PCB Editor — Zone properties (Pad connection) and custom rules"
      url: "https://docs.kicad.org/9.0/en/pcbnew/pcbnew.html"
      publisher: "KiCad"
      kind: tool_doc
      section: "Pad connection; Thermal relief connection to zone incomplete; min_resolved_spokes"
    - title: "ESP32-C3 Hardware Design Guidelines — PCB Layout Design"
      url: "https://docs.espressif.com/projects/esp-hardware-design-guidelines/en/latest/esp32c3/pcb-layout-design.html"
      publisher: "Espressif"
      kind: vendor_guide
      section: "Power Supply（Ground pads should contact the ground copper directly）"
  confidence: medium
  applies_to: [kicad, smd, tht]
  parameters:
    - name: min_thermal_spokes
      op: ">="
      value: 2
      unit: count
      note: "KiCad 文档示例规则要求 4（全部辐条）；2 为本库取的下限（经验值）"
  conflicts: "热焊盘与“最低电感”矛盾：KiCad 的 Reliefs for PTH 选项让通孔用热焊盘、SMD 用实心；对大电流焊盘（电机、功率 MOSFET 源极）改用实心以提高载流是常见经验做法（无来源，需结合热设计）。"
  tags: [cat-feeder]

- id: GEN-PLN-009
  title: 天线下方和周围所有铜层禁布，铺铜前先画禁布区
  domain: general
  stage: plane_pour
  severity: must
  rule: 模块的 PCB 天线下方和周围在所有铜层都不放铜（线、过孔、铺铜），先画好禁布区（keep-out / 规则区域）再铺铜，避免地铺铜填进去；天线下方有底板时要挖空；靠近天线的底板地铜加密集地过孔。
  rationale: 天线周围的铜会使天线失谐、降低增益；铺铜忘记避让是常见的“发射正常、接收灵敏度差”原因。
  verify:
    - method: drc
      tool: "KiCad 规则区域（禁布：铜、过孔、走线）+ DRC"
      check: "天线区建规则区域，勾选禁止 tracks / vias / copper fill；DRC 的“Items not allowed”数 = 0"
      automatable: full
    - method: geometry_script
      tool: "pcbnew，参见 ee-pcb-verify 的 geometry 检查器 的天线禁布检查"
      check: "取所有铜层的走线、过孔、焊盘与区域填充多边形，检查是否有任何顶点 / 线段落入天线禁布矩形；通过判据：数量 = 0"
      automatable: full
    - method: bench
      tool: "路由器 RSSI / 吞吐量测试，VNA（若有天线测试口）"
      check: "在最终外壳内测同一位置的 RSSI 与吞吐量，对比官方开发板；通过判据：RSSI 差 ≤ 3 dB（经验判据）"
      automatable: manual
  sources:
    - title: "ESP32-C3 Hardware Design Guidelines — PCB Layout Design"
      url: "https://docs.espressif.com/projects/esp-hardware-design-guidelines/en/latest/esp32c3/pcb-layout-design.html"
      publisher: "Espressif"
      kind: vendor_guide
      section: "General Principles of PCB Layout for Modules"
    - title: "PCB Editor — rule areas (keepout) and Items not allowed"
      url: "https://docs.kicad.org/9.0/en/pcbnew/pcbnew.html"
      publisher: "KiCad"
      kind: tool_doc
      section: "Miscellaneous DRC checks: Items not allowed"
  confidence: high
  applies_to: [wifi_module, esp32, antenna]
  parameters:
    - name: antenna_keepout_layers
      op: qualitative
      value: null
      unit: "-"
      note: "Espressif：天线下方和周围任何层都没有铜；具体禁布尺寸以所用模块数据手册为准，本库不给数值"
  tags: [cat-feeder]

- id: GEN-PLN-010
  title: 晶振下方做完整地参考，区域内不放其他网络的铜
  domain: general
  stage: plane_pour
  severity: should
  rule: 晶振及其时钟走线下方的相邻层是完整的地平面（或连到最近 MCU 地的局部地平面），区域内不放别的网络的铜、不开孔；金属壳晶振的外壳不接振荡器地。
  rationale: 完整的地给振荡回路一个紧贴的低阻回流并屏蔽相邻信号的耦合，同时没有别的网络的铜进入杂散电容敏感区。
  verify:
    - method: geometry_script
      tool: "pcbnew"
      check: "取晶振 courtyard 外扩 1 mm，检查相邻层 GND 填充覆盖率 ≥ 100%（无反焊盘 / 槽 / 他网络铜），且各层中无非 GND 非 OSC 网络的铜；通过判据：违规 = 0"
      automatable: full
    - method: bench
      tool: "频率计 / 示波器（时钟输出引脚）"
      check: "冷启动 50 次，振荡启动成功率 100%，启动时间 ≤ 数据手册最大值；改动地参考前后对比"
      automatable: manual
  sources:
    - title: "ESP32-C3 Hardware Design Guidelines — PCB Layout Design"
      url: "https://docs.espressif.com/projects/esp-hardware-design-guidelines/en/latest/esp32c3/pcb-layout-design.html"
      publisher: "Espressif"
      kind: vendor_guide
      section: "Crystal; General Principles for the Chip"
    - title: "AN2867 Oscillator design guide for STM8AF/AL/S, STM32 MCUs and MPUs"
      url: "https://www.st.com/resource/en/application_note/an2867-guidelines-for-oscillator-design-on-stm8afals-and-stm32-mcusmpus-stmicroelectronics.pdf"
      publisher: "STMicroelectronics"
      kind: app_note
      section: "§7.1（Rev 13）"
  confidence: high
  applies_to: [crystal]
  conflicts: "ST：晶振下用专用局部地平面（与应用板地分开，仅连到最近 MCU 地，且仅在晶振附近需要）；Espressif：整个芯片 / RF / 晶振下是完整的 GND 平面。两者都要求紧邻的完整地，差别是否与大地分开。取舍：多层板按 Espressif（整块地），2 层板在地岛（GEN-PLN-005）内满足 ST 的局部地即可。"

- id: GEN-PLN-011
  title: 芯片底部接地焊盘用多个过孔接地平面
  domain: general
  stage: plane_pour
  severity: should
  rule: QFN 等带底部接地焊盘（EPAD）的芯片：EPAD 通过至少 9 个地过孔接地平面；模块 EPAD 用方格网分割焊盘、锡膏印在方格间隙内，过孔打在间隙里。
  rationale: 底部焊盘是芯片唯一（或主要）的地连接，同时承担散热；过孔数不足会增大地电感和热阻。
  verify:
    - method: geometry_script
      tool: "pcbnew"
      check: "取每个 EPAD 焊盘的外包框，统计落在其中的 GND 过孔数；通过判据：芯片 EPAD ≥ 9（ESP32-C3 QFN 芯片），模块 EPAD 按模块数据手册；另检查 EPAD 与地铜的实心连接（GEN-PLN-008）"
      automatable: full
    - method: thermal_sim
      tool: "热阻网络估算 / 热像仪"
      check: "满载下测芯片壳温，通过判据：结温 ≤ 数据手册最大值 − 20 °C（余量为经验值）"
      automatable: manual
  sources:
    - title: "ESP32-C3 Hardware Design Guidelines — PCB Layout Design"
      url: "https://docs.espressif.com/projects/esp-hardware-design-guidelines/en/latest/esp32c3/pcb-layout-design.html"
      publisher: "Espressif"
      kind: vendor_guide
      section: "Power Supply（four-layer）"
  confidence: high
  applies_to: [qfn, esp32, module]
  parameters:
    - name: epad_ground_vias_chip
      op: ">="
      value: 9
      unit: count
      note: "Espressif：芯片底部地焊盘至少 9 个地过孔（该条出现在四层板章节，两层板章节沿用同一地连接原则）"
  tags: [cat-feeder]
