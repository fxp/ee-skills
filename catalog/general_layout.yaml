- id: GEN-PLC-003
  title: 去耦电容地焊盘就近接地，用过孔或直连地铜
  domain: general
  stage: placement
  severity: should
  rule: 去耦电容的地焊盘直接连到地平面 / 地铺铜——通过紧贴焊盘的过孔（多层板可用 2~3 个），或在离 IC 地引脚足够近时直接连到地引脚；不通过一段细线再去找地。
  rationale: 电容的接地端电感和电源端一样重要；一段细线会把电容的有效频带拉低。
  verify:
    - method: geometry_script
      tool: "pcbnew"
      check: "对每个去耦电容的 GND 焊盘，找最近的 GND 过孔或 GND 铺铜连接，量焊盘边缘到过孔边缘距离和连接线长；通过判据：连接线长 ≤ 焊盘宽度的 1 倍（经验阈值）或焊盘与 GND 铜直连（thermal relief 的辐条数 ≥ 2，见 GEN-PLN-008）"
      automatable: full
    - method: drc
      tool: "KiCad 自定义规则"
      check: "(rule decap_gnd_direct (condition \"A.Type == 'Pad' && A.Reference == 'C*' && A.NetName == 'GND'\") (constraint connection_width (min 0.3mm))) —— 检查与地铜连接足够宽；距离判据用 geometry_script"
      automatable: partial
  sources:
    - title: "High-Speed Layout Guidelines (SCAA082A)"
      url: "https://www.ti.com/lit/pdf/scaa082"
      publisher: "Texas Instruments"
      kind: app_note
      section: "§2.4 Decoupling Capacitors"
    - title: "ESP32-C3 Hardware Design Guidelines — PCB Layout Design"
      url: "https://docs.espressif.com/projects/esp-hardware-design-guidelines/en/latest/esp32c3/pcb-layout-design.html"
      publisher: "Espressif"
      kind: vendor_guide
      section: "Power Supply（去耦电容地焊盘旁要有接地过孔）"
  confidence: high
  applies_to: [2_layer, 4_layer]
  parameters:
    - name: ground_vias_per_decap
      op: range
      value: [1, 3]
      unit: count
      note: "TI 对多层板写“2~3 个过孔”；2 层 0402 空间不足时 1 个紧贴焊盘的过孔或直连地铜"
  tags: [cat-feeder]

- id: GEN-PLC-004
  title: 电源电流必须穿过去耦电容焊盘再到引脚
  domain: general
  stage: placement
  severity: should
  rule: 电源走线先到电容的电源焊盘、再从该焊盘出到 IC 引脚，不允许从电源线上 T 形分支出一条带电容的短桩；电容与引脚之间不加过孔。
  rationale: 电容挂在分支末端时，高频电流仍可经主电源线流向引脚，电容起不到应有的旁路作用，分支也增加回路面积。
  verify:
    - method: geometry_script
      tool: "pcbnew：按网络建铜连通图"
      check: "对每个去耦电容的电源焊盘和对应 IC 电源引脚，检查电源网络从稳压器 / 入口到该引脚的最短铜路径是否经过该电容焊盘（或与电容焊盘距离 ≤ 焊盘宽度）；该电容与引脚之间的连接中过孔数应为 0；违规则报告"
      automatable: partial
    - method: review
      tool: "布局评审"
      check: "对照 SCAA082A 图 12（Poor / Good Bypassing）逐个电源引脚检查"
      automatable: manual
  sources:
    - title: "High-Speed Layout Guidelines (SCAA082A)"
      url: "https://www.ti.com/lit/pdf/scaa082"
      publisher: "Texas Instruments"
      kind: app_note
      section: "§2.4 Decoupling Capacitors, Figure 12"
  confidence: medium
  applies_to: [mcu, qfn]
  tags: [cat-feeder]

- id: GEN-PLC-005
  title: 电源入口和稳压器处放大电容，模块进线前放 10 µF
  domain: general
  stage: placement
  severity: should
  rule: 外部电源进入板子的连接器引脚旁放大容量电容（含一个 10 µF 级电容并联 100 nF）；稳压器输入输出各放其数据手册要求的电容；电源走线进入 MCU / 模块前再放一个 10 µF；入口离模块电源脚较远时，两处都要放 10 µF。
  rationale: 大电容吸收电缆上的瞬变和负载阶跃，防止电源线上的电流瞬变沿线传导；入口与芯片之间走线的电感使远端的小电容不足以应付芯片的瞬时需求。
  verify:
    - method: geometry_script
      tool: "pcbnew"
      check: "取电源入口连接器电源焊盘，找同网络最近的 ≥ 10 µF 电容，量焊盘间距离，通过判据 ≤ 项目设定值（建议 ≤ 10 mm，经验阈值）；对模块 / MCU 的电源引脚同样检查是否有 10 µF 在其入口"
      automatable: full
    - method: bench
      tool: "示波器 + 电子负载 / 电机启动"
      check: "在电机堵转 / 启动或 Wi-Fi 发射峰值时测 3V3 与 VIN 的最低值，通过判据：3V3 最低值 ≥ MCU / 模块数据手册规定的最低供电电压 + 余量"
      automatable: manual
  sources:
    - title: "ESP32-C3 Hardware Design Guidelines — PCB Layout Design"
      url: "https://docs.espressif.com/projects/esp-hardware-design-guidelines/en/latest/esp32c3/pcb-layout-design.html"
      publisher: "Espressif"
      kind: vendor_guide
      section: "Power Supply: 10 µF before the power trace enters the chip"
    - title: "PCB Design Guidelines For Reduced EMI (SZZA009)"
      url: "https://www.ti.com/lit/an/szza009/szza009.pdf"
      publisher: "Texas Instruments"
      kind: app_note
      section: "§2.2.4; §2.3 Board Zoning"
  confidence: medium
  applies_to: [mcu_board, ldo]
  parameters:
    - name: entry_bulk_capacitor
      op: ">="
      value: 10
      unit: uF
      note: "Espressif：芯片电源入口前 10 µF，可并联 0.1 或 1 µF"
  tags: [cat-feeder]

- id: GEN-PLC-006
  title: 晶振贴近 MCU，走线短且对称，周围有地环
  domain: general
  stage: placement
  severity: should
  rule: 晶振和负载电容尽量贴近 MCU 的 OSC 引脚，两条走线短而对称（两个负载电容相对称），晶振及其走线周围用接地保护环（guard ring）包围；金属壳晶振外壳不接振荡器地。
  rationale: 长走线既是天线又增加杂散电容，影响起振与频率稳定；保护环减少外来噪声耦合；这是 EMC 测试里常见的失败点。
  verify:
    - method: geometry_script
      tool: "pcbnew"
      check: "取 OSC_IN / OSC_OUT 两条网络的走线长度 L1、L2 与过孔数；通过判据：L1、L2 ≤ 项目设定值（建议 ≤ 10 mm，经验阈值）且 |L1−L2| ≤ 20%（经验阈值），过孔数 = 0；检查 CL1 / CL2 到晶振的距离对称"
      automatable: full
    - method: bench
      tool: "示波器 + 低电容探头（10 MΩ / <1 pF）或频率计"
      check: "测上电到振荡稳定的启动时间与输出频率偏差，通过判据：启动时间 ≤ 数据手册典型值，频率偏差在晶振 ppm 容差内；探头不要直接挂振荡引脚，用时钟输出引脚代替"
      automatable: manual
  sources:
    - title: "AN2867 Oscillator design guide for STM8AF/AL/S, STM32 MCUs and MPUs"
      url: "https://www.st.com/resource/en/application_note/an2867-guidelines-for-oscillator-design-on-stm8afals-and-stm32-mcusmpus-stmicroelectronics.pdf"
      publisher: "STMicroelectronics"
      kind: app_note
      section: "§7.1 PCB design guidelines（读的是 Rev 13；该节针对 32 kHz 振荡器，同样适用于一般晶振）"
    - title: "ESP32-C3 Hardware Design Guidelines — PCB Layout Design"
      url: "https://docs.espressif.com/projects/esp-hardware-design-guidelines/en/latest/esp32c3/pcb-layout-design.html"
      publisher: "Espressif"
      kind: vendor_guide
      section: "Crystal"
    - title: "Hardware design with RP2040"
      url: "https://pip.raspberrypi.com/documents/RP-008279-DS-hardware-design-with-rp2040.pdf"
      publisher: "Raspberry Pi"
      kind: vendor_guide
      section: "§2.3 Crystal oscillator"
  confidence: high
  applies_to: [crystal, mcu]
  conflicts: "本板用 ESP32-C3 模块，晶振在模块内，板上没有 OSC 走线；本条为板上有分立晶振时的基线。ST 的“保护环”与 Espressif 的“时钟走线周围密地过孔 / 地铜”是同一思路。"

- id: GEN-PLC-007
  title: 晶振周围留出隔离区，不放无关元件
  domain: general
  stage: placement
  severity: consider
  rule: 晶振 / 振荡回路周围不放无关元件（尤其电感、磁珠、开关器件、高速信号），晶振下方不走任何信号；EMI 关键的 2 层板上，无关元件离晶振至少 25.4 mm（1 英寸）。
  rationale: 多数晶振相关的 EMI 串扰问题出在受扰线离晶振太近；晶振谐波可以耦合到附近的电感和其他元件上并传播出去。
  verify:
    - method: geometry_script
      tool: "pcbnew"
      check: "对每个晶振，枚举所有与它无电气关联的元件，量晶振外包框到其外包框最短距离，并检查晶振 courtyard 内是否有他网络的走线 / 过孔；通过判据：没有他网络走线 / 过孔进入晶振 courtyard，无关元件间距 ≥ 项目设定值（TI 给 25.4 mm，紧凑板按评估放宽）"
      automatable: full
    - method: drc
      tool: "KiCad 自定义规则"
      check: "(rule xtal_keepout (condition \"A.intersectsCourtyard('Y1') && !A.hasNetclass('Clock')\") (constraint disallow track via zone)) —— Y1 为晶振位号；Clock 网络类包含 OSC 网络"
      automatable: full
  sources:
    - title: "PCB Design Guidelines For Reduced EMI (SZZA009)"
      url: "https://www.ti.com/lit/an/szza009/szza009.pdf"
      publisher: "Texas Instruments"
      kind: app_note
      section: "§1.1 RF Sources; §2.4.1"
    - title: "ESP32-C3 Hardware Design Guidelines — PCB Layout Design"
      url: "https://docs.espressif.com/projects/esp-hardware-design-guidelines/en/latest/esp32c3/pcb-layout-design.html"
      publisher: "Espressif"
      kind: vendor_guide
      section: "Crystal"
  confidence: medium
  applies_to: [crystal]
  parameters:
    - name: unrelated_component_to_crystal
      op: ">="
      value: 25.4
      unit: mm
      note: "TI SZZA009 §2.4.1，针对 EMI 严格的 2 层板；紧凑板难以满足，需评估后放宽"
  conflicts: "TI 的 1 英寸（25.4 mm）距离出自 1999 年的 2 层板指南，现代小板几乎做不到；Espressif 与 ST 只要求走线短、周围地铜、下方无信号，不给无关元件的最小距离。取舍：禁布线 / 过孔进入晶振区按 should 严执行，25.4 mm 作为可放宽的目标。"

- id: GEN-PLC-008
  title: 串联电阻靠近驱动端放置
  domain: general
  stage: placement
  severity: consider
  rule: 为抑制振铃或降低边沿速率加的串联电阻（SPI 时钟、UART TX、MCU 输出口），放在驱动端 IC 引脚旁，尽量压在 MCU 地铜上；通向电缆或超过 1 英尺的走线、出现振铃的信号必须有串联端接。
  rationale: 串联端接要在源端起作用，电阻离驱动越远，电阻前面那段走线就越长地承载未衰减的快边沿；放在远端则起不到阻尼作用。
  verify:
    - method: geometry_script
      tool: "pcbnew"
      check: "对每个标记为串联端接的电阻（值 22~100 Ω，位于 MCU 输出网络上），量它的 MCU 侧焊盘到驱动引脚焊盘的距离，通过判据 ≤ 项目设定值（建议 ≤ 5 mm，经验阈值）；该电阻 MCU 侧不得再分叉出其他负载"
      automatable: full
    - method: si_sim
      tool: "IBIS 或 ngspice：驱动 + 走线 + 输入电容"
      check: "对 > 1 英尺的走线或通向电缆的信号做瞬态仿真，过冲 / 下冲 ≤ 器件绝对最大额定值裕量"
      automatable: partial
  sources:
    - title: "PCB Design Guidelines For Reduced EMI (SZZA009)"
      url: "https://www.ti.com/lit/an/szza009/szza009.pdf"
      publisher: "Texas Instruments"
      kind: app_note
      section: "§2.2.5 Keeping Noise Close to the Chip; §2.4.3 Series Termination"
    - title: "ESP32-C3 Hardware Design Guidelines — PCB Layout Design"
      url: "https://docs.espressif.com/projects/esp-hardware-design-guidelines/en/latest/esp32c3/pcb-layout-design.html"
      publisher: "Espressif"
      kind: vendor_guide
      section: "Flash; UART（串联电阻靠近芯片）"
    - title: "High-Speed Layout Guidelines (SCAA082A)"
      url: "https://www.ti.com/lit/pdf/scaa082"
      publisher: "Texas Instruments"
      kind: app_note
      section: "§1.3.2 Characteristic Impedance, Reflections, and Termination"
  confidence: medium
  applies_to: [mcu_board]
  parameters:
    - name: output_series_resistance
      op: range
      value: [50, 100]
      unit: ohm
      note: "TI SZZA009 §2.2.5：每个输出脚串 50~100 Ω，输入脚 35~50 Ω；该节明确不要用于振荡器引脚；会增加元件数，按需选择"
