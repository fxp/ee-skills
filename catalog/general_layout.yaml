- id: GEN-PLC-002
  title: 每个电源引脚一个去耦电容，小容值最近
  domain: general
  stage: placement
  severity: should
  rule: 每个 IC 电源引脚配一个 100 nF 去耦电容（共用引脚的情况可例外），把容值最小的电容放在最靠近该引脚的位置；电容与引脚之间的走线长宽比 ≤ 3:1。
  rationale: 去耦电容要在时钟沿提供瞬时电流，回路电感越小越有效；小容值电容自谐振频率高但对走线电感最敏感，必须最近。ADI 的 ADC 讲义甚至给出某款 ADC 去耦电容必须在 2.5 mm 以内否则丢码的实例。
  verify:
    - method: geometry_script
      tool: "pcbnew，参见 ee-pcb-verify 的 geometry 检查器"
      check: "对每个 IC 的每个电源引脚，找同网络、值为 100 nF（或最小容值）的电容，量引脚焊盘中心到电容电源焊盘中心的距离 d，及两者间走线的长度 / 宽度比；通过判据：d ≤ 项目设定值（建议 ≤ 3 mm，经验阈值，按封装调整）且长宽比 ≤ 3；每个电源引脚都存在这样的电容，共用的需在 note 登记"
      automatable: full
    - method: spice
      tool: "ngspice：PDN 简化模型"
      check: "用 ESL（含走线电感）扫描去耦电容到引脚的电感（0.5 / 1 / 2 / 4 nH），看 100 MHz 处 PDN 阻抗 vs 目标阻抗，确认目标距离下仍满足"
      automatable: partial
    - method: bench
      tool: "示波器（带宽 ≥ 200 MHz，短地弹簧）"
      check: "在 MCU 电源引脚旁测 IO 全速翻转时的 VDD 跌落 / 尖峰，通过判据：尖峰峰峰值 < 芯片 VDD 容差的 1/2 或项目设定值"
      automatable: manual
  sources:
    - title: "High-Speed Layout Guidelines (SCAA082A)"
      url: "https://www.ti.com/lit/pdf/scaa082"
      publisher: "Texas Instruments"
      kind: app_note
      section: "§2.4 Decoupling Capacitors"
    - title: "Hardware design with RP2040"
      url: "https://pip.raspberrypi.com/documents/RP-008279-DS-hardware-design-with-rp2040.pdf"
      publisher: "Raspberry Pi"
      kind: vendor_guide
      section: "§2.1.2 Decoupling capacitors"
    - title: "PCB Design Guidelines For Reduced EMI (SZZA009)"
      url: "https://www.ti.com/lit/an/szza009/szza009.pdf"
      publisher: "Texas Instruments"
      kind: app_note
      section: "§2.2.4 Bypassing and Ferrite Beads"
    - title: "Grounding Analog-Digital Converters (J. Bryant, ADI lecture, mirror)"
      url: "http://www.hit.bme.hu/~papay/edu/Acrobat/GndADCs.pdf"
      publisher: "Analog Devices"
      kind: app_note
      section: "SUPPLY DECOUPLING"
  confidence: high
  applies_to: [mcu, qfn, module]
  parameters:
