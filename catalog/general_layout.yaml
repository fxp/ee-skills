# general 领域 · 布局环节（stackup / floorplan / placement / routing / plane_pour）
# 数模混合 MCU 板基线。领域专有细节（电源、RF、音频、模拟、高速、EMC、DFM、热）见各自文件。
# 调研日期 2026-10-20。读过原文的来源标 high；二手 / 博客来源最高 medium。

# ───────────────────────── stackup ─────────────────────────

- id: GEN-STK-001
  title: 按最高频率与辐射风险选层数，2 层板要补偿
  domain: general
  stage: stackup
  severity: should
  rule: 板上有 ≥10~15 MHz 的时钟 / 快边沿、RF 或敏感模拟时优先 4 层（信号-地-电源-信号）；只有成本迫使用 2 层时，必须用整面地铺铜 / 地网格、电源与地并行走线来替代平面。
  rationale: 完整平面给每条走线一个紧贴正下方的低电感回流路径并降低地阻抗；2 层板要靠布局手段（地网格、回流贴着信号线）才能逼近这个效果。
  verify:
    - method: geometry_script
      tool: "pcbnew (KiCad bundled Python)，参见 ee-pcb-verify 的 geometry 检查器"
      check: "读 board.GetCopperLayerCount()；若为 2，统计底层 GND 铜覆盖率（填充区面积 / 板面积）与顶层信号线正下方底层有 GND 铜的线长占比；覆盖率 < 70% 或占比 < 90% 报警（70% / 90% 为经验阈值，需按板调整）"
      automatable: partial
    - method: emc_precompliance
      tool: "近场探头 + 频谱仪 / 示波器"
      check: "2 层样板在主时钟及其谐波、电机 PWM 边沿处做近场扫描，与整改前对比；任何频点超过项目 EMC 目标限值（或余量不足 6 dB，6 dB 为经验余量）则考虑升 4 层"
      automatable: manual
  sources:
    - title: "PCB Stack-Up, Part 1 (Henry Ott Consultants)"
      url: "https://hott.shielddigitaldesign.com/techtips/pcb-stack-up-1.html"
      publisher: "Henry Ott Consultants"
      kind: paper
      section: "two-layer vs. multi-layer"
    - title: "PCB Design Guidelines For Reduced EMI (SZZA009)"
      url: "https://www.ti.com/lit/an/szza009/szza009.pdf"
      publisher: "Texas Instruments"
      kind: app_note
      section: "§2.1.2 Two-Layer vs Four-Layer Boards"
    - title: "Hardware design with RP2040"
      url: "https://pip.raspberrypi.com/documents/RP-008279-DS-hardware-design-with-rp2040.pdf"
      publisher: "Raspberry Pi"
      kind: vendor_guide
      section: "§2 minimal design (2 layer) vs §4 four-layer example"
  confidence: medium
  applies_to: [mcu_board, 2_layer, 4_layer]
  parameters:
    - name: multilayer_consider_above_clock
      op: ">="
      value: 10
      unit: MHz
      note: "Ott：约 10~15 MHz 以上通常应考虑多层板；2 层板在 20~25 MHz、无屏蔽外壳下也有成功先例（属例外）"
    - name: four_vs_two_layer_radiation_reduction
      op: "=="
      value: 15
      unit: dB
      note: "Ott 经验值：其他条件相同，4 层板辐射比 2 层低约 15 dB（非实测数据）"
  conflicts: "TI SZZA009 §2.1.2 称 2 层板模仿 4 层板的做法（地在电源下方、电源地网格化、回流在信号线正下方、MCU 下方实心地）可达到 4 层板约 95% 的效果；Ott 则给出 4 层比 2 层低约 15 dB 的经验值并建议 10~15 MHz 以上用多层。两者不矛盾于方向，分歧在 2 层板的上限。取舍：默认 4 层；2 层板必须满足 TI 列出的四条补偿做法并过预兼容扫描。"
  tags: [cat-feeder]

- id: GEN-STK-002
  title: 4 层板信号层贴近邻接平面，两平面间用厚芯板
  domain: general
  stage: stackup
  severity: should
  rule: 4 层板（信号-GND-PWR-信号）里，外层信号到其邻接平面的介质厚度 < 0.254 mm（10 mil），中间两个平面之间的芯板 > 1.016 mm（40 mil）。
  rationale: 信号与回流平面越近，回流环路面积越小、辐射越低（Ott 称 0.005 in 间距可比等间距叠层减少 10 dB 以上的环路辐射）；电源 / 地平面间距大时电容耦合弱，但换来信号-平面紧耦合，是 4 层板的折中。
  verify:
    - method: geometry_script
      tool: "pcbnew：board.GetDesignSettings().GetStackupDescriptor() 遍历介质层"
      check: "取 F.Cu 与 In1.Cu 之间介质厚度 d1、B.Cu 与 In2.Cu 之间 d3、In1 与 In2 之间 d2；通过判据 d1 < 0.254 mm 且 d3 < 0.254 mm 且 d2 > 1.016 mm"
      automatable: full
    - method: tline_calc
      tool: "2D 场求解器 / 阻抗计算器"
      check: "用上述叠层计算 50 Ω 微带线宽度；确认在板厂可做的线宽范围内（JLC04161H-7628 外层到 L2 介质 0.2104 mm）"
      automatable: partial
  sources:
    - title: "PCB Stack-Up, Part 2 (Henry Ott Consultants)"
      url: "https://hott.shielddigitaldesign.com/techtips/pcb-stack-up-2.html"
      publisher: "Henry Ott Consultants"
      kind: paper
      section: "Fig. 2 four-layer stack-up"
    - title: "JLCPCB impedance control stackups (JLC04161H-7628)"
      url: "https://jlcpcb.com/impedance"
      publisher: "JLCPCB"
      kind: vendor_guide
      section: "4-layer JLC04161H-7628"
  confidence: high
  applies_to: [4_layer]
  parameters:
    - name: signal_to_plane_dielectric
      op: "<"
      value: 0.254
      unit: mm
      note: "Ott：<0.010 in"
    - name: plane_to_plane_core
      op: ">"
      value: 1.016
      unit: mm
      note: "Ott：>0.040 in。JLC04161H-7628：prepreg 0.2104 mm，芯板 1.065 mm，满足该判据"
  conflicts: "TI SCAA082A 表 3 把 SIG-GND-PWR-SIG（其 Model 2）的 EMC 评为 Bad、去耦评为 Good，与 Ott 把它视为 4 层板的改进方案不同；Ott 的前提是外层贴近平面并拉大中间芯板。本条按 Ott；若需要更好 EMC，Ott 的 Fig. 3b（两外层为地、电源走线）是 4 层板能做到的最好方案，但元件焊盘会割裂外层地。"

- id: GEN-STK-003
  title: 每个走线层邻接参考平面，高频线埋在两平面之间
  domain: general
  stage: stackup
  severity: should
  rule: 凡布高频 / 开关信号的层，紧邻必须有完整的 GND（或 PWR）平面；6 层板避免 SIG-SIG-GND-PWR-SIG-SIG，优先 SIG-GND-SIG-SIG-PWR-SIG（Ott Fig. 6，最常见）或 GND-SIG-GND-PWR-SIG-GND（Ott Fig. 8，仅 2 个走线层）这类让高频层夹在平面之间的叠层。
  rationale: 回流电流走阻抗最低的路径，也就是信号正下方 / 正上方的相邻平面；没有相邻平面的走线层回流只能绕远路，环路面积大。两平面夹住的埋层还能屏蔽辐射。
  verify:
    - method: geometry_script
      tool: "pcbnew 读叠层 + 各层 zone 填充"
      check: "遍历叠层，对每个含 ≥1 条走线的铜层，判断上或下相邻铜层是否为 GND / PWR 平面层；对 6 层板判断是否出现相邻两信号层且外侧无平面（SIG-SIG-PLANE-PLANE-SIG-SIG 模式）"
      automatable: full
    - method: review
      tool: "叠层评审清单"
      check: "对照 Ott 五条目标逐条打勾：①信号层邻平面 ②信号与平面紧耦合 ③电源地平面紧耦合 ④高速线埋层 ⑤多地平面；记录哪几条被牺牲"
      automatable: manual
  sources:
    - title: "PCB Stack-Up, Part 1 (Henry Ott Consultants)"
      url: "https://hott.shielddigitaldesign.com/techtips/pcb-stack-up-1.html"
      publisher: "Henry Ott Consultants"
      kind: paper
      section: "five EMC objectives"
    - title: "PCB Stack-Up, Part 3 (Henry Ott Consultants)"
      url: "https://hott.shielddigitaldesign.com/techtips/pcb-stack-up-3.html"
      publisher: "Henry Ott Consultants"
      kind: paper
      section: "six-layer, Fig. 5 (avoid) and Fig. 6-8"
    - title: "High-Speed Layout Guidelines (SCAA082A)"
      url: "https://www.ti.com/lit/pdf/scaa082"
      publisher: "Texas Instruments"
      kind: app_note
      section: "§2.2 Board Stackup, Table 4"
  confidence: high
  applies_to: [4_layer, 6_layer]
  conflicts: "TI SCAA082A 表 4 把 6 层 Model 1（SIG-SIG-VCC-GND-SIG-SIG）EMC 评为 Bad，与 Ott 的 Fig. 5 结论一致；对 3 号 / 4 号模型的评分与 Ott 的排序略有差异，但都支持“高频信号层夹在平面之间”。无冲突，仅评分细节不同。"

- id: GEN-STK-004
  title: 2 层板：底层做地参考，元件只放顶层
  domain: general
  stage: stackup
  severity: should
  rule: 2 层 MCU 板把底层几乎整面留给 GND 铺铜，底层不放元件、尽量不走线；重要信号（时钟、高速 IO、射频）下方的底层必须是连续地，不被其他走线切断。
  rationale: 2 层板没有内层平面，把底层当地平面是能提供“紧贴正下方的回流路径”的最接近做法；单面贴装也降低装配成本。
  verify:
    - method: geometry_script
      tool: "pcbnew"
      check: "统计 B.Cu 上非 GND 网络的走线总长与焊盘数（应接近 0，仅允许少量必要跳线）；对每条顶层高速 / 时钟网络采样（每 1 mm 一点），检查该点正下方 B.Cu 是否落在 GND 填充区内，通过判据 ≥ 95% 的采样点在 GND 铜内（95% 为经验阈值）"
      automatable: full
    - method: drc
      tool: "KiCad 自定义规则 .kicad_dru"
      check: "(rule \"no_bottom_parts\" (layer B.Cu) (constraint disallow footprint)) 禁止底层元件；底层走线统计用 geometry_script"
      automatable: full
  sources:
    - title: "ESP32-C3 Hardware Design Guidelines — PCB Layout Design"
      url: "https://docs.espressif.com/projects/esp-hardware-design-guidelines/en/latest/esp32c3/pcb-layout-design.html"
      publisher: "Espressif"
      kind: vendor_guide
      section: "General Principles of PCB Layout for the Chip: Two-layer"
    - title: "Hardware design with RP2040"
      url: "https://pip.raspberrypi.com/documents/RP-008279-DS-hardware-design-with-rp2040.pdf"
      publisher: "Raspberry Pi"
      kind: vendor_guide
      section: "§2 Minimal design example; §2.4.1 USB"
    - title: "PCB Design Guidelines For Reduced EMI (SZZA009)"
      url: "https://www.ti.com/lit/an/szza009/szza009.pdf"
      publisher: "Texas Instruments"
      kind: app_note
      section: "§2.1.2, §2.2.3"
  confidence: high
  applies_to: [2_layer, mcu_board]
  tags: [cat-feeder]

- id: GEN-STK-005
  title: 按板厂能力设板级约束，不贴着极限设计
  domain: general
  stage: stackup
  severity: must
  rule: 在 Board Setup 里把最小线宽 / 线距 / 过孔 / 环宽 / 铜到板边设成板厂可制造的值，并通用网络用高于最小值的推荐值；JLC 2 层 1 oz：线宽 / 线距 ≥ 0.10 / 0.10 mm，过孔孔径 ≥ 0.15 mm 且过孔外径 ≥ 0.25 mm，铜到铣边 ≥ 0.2 mm。
  rationale: 低于板厂能力的设计会被拒收或加价；设计规则一旦与板厂能力对齐，DRC 才等于“可投板”的判据。
  verify:
    - method: drc
      tool: "kicad-cli pcb drc --format json（项目 .kicad_pro 的 board_setup 约束）"
      check: "确认 .kicad_pro 中 min_track_width ≥ 0.10 mm、min_clearance ≥ 0.10 mm（2 层 1 oz）、min_via_diameter ≥ 0.25 mm、min_through_hole_diameter ≥ 0.15 mm、min_copper_edge_clearance ≥ 0.2 mm；DRC 0 error"
      automatable: full
    - method: review
      tool: "板厂在线 DFM / 报价页"
      check: "上传 Gerber 看板厂 DFM 报告无 trace / space / annular ring 违规"
      automatable: manual
  sources:
    - title: "JLCPCB PCB Manufacturing & Assembly Capabilities"
      url: "https://jlcpcb.com/capabilities/pcb-capabilities"
      publisher: "JLCPCB"
      kind: vendor_guide
      section: "1-2 layer 与 multilayer 列"
    - title: "KiCad 9.0 PCB Editor — Board Setup constraints and DRC"
      url: "https://docs.kicad.org/9.0/en/pcbnew/pcbnew.html"
      publisher: "KiCad"
      kind: tool_doc
      section: "Board Setup > Constraints; Design for manufacturing DRC checks"
  confidence: high
  applies_to: [jlc, 2_layer]
  parameters:
    - name: min_track_width_1oz_2layer
      op: ">="
      value: 0.10
      unit: mm
      note: "JLC 1-2 层 1 oz；4-6 层为 0.09 mm；2 oz 2 层为 0.16 mm"
    - name: min_clearance_1oz_2layer
      op: ">="
      value: 0.10
      unit: mm
      note: "JLC 1-2 层 1 oz；2 oz 为 0.16 mm"
    - name: min_via_hole
      op: ">="
      value: 0.15
      unit: mm
      note: "JLC 页面写明 0.1 mm 仅限板厚 ≤1 mm 且 ENIG/OSP；常规按 0.15 mm"
    - name: min_via_outer_diameter
      op: ">="
      value: 0.25
      unit: mm
      note: "JLC；同上条件可 0.2 mm"
    - name: min_pth_annular_ring_2layer_1oz
      op: ">="
      value: 0.18
      unit: mm
      note: "JLC 绝对最小；推荐 0.25 mm"
    - name: copper_to_routed_edge
      op: ">="
      value: 0.2
      unit: mm
      note: "JLC 铣边；V-cut 边为 0.4 mm"
  tags: [cat-feeder]

- id: GEN-STK-006
  title: 网络类宽度只是默认值，必须用自定义规则落成 DRC
  domain: general
  stage: stackup
  severity: should
  rule: 为 Power / Signal / Clock 等网络类定义线宽、间距、过孔尺寸后，再用 .kicad_dru 里的 track_width / clearance / via_diameter 约束把它们变成可检查的下限；否则手动改线宽不会触发 DRC。
  rationale: KiCad 的网络类线宽只是布线器默认值；文档明确说除非用自定义规则设最小 / 最大值，否则不会报告违规。
  verify:
    - method: drc
      tool: "KiCad 自定义规则 .kicad_dru + kicad-cli pcb drc"
      check: "加入 (version 1) (rule power_width (layer outer) (condition \"A.hasNetclass('Power')\") (constraint track_width (min 0.5mm))) 与 (rule power_via (condition \"A.hasNetclass('Power') && A.Type == 'Via'\") (constraint via_diameter (min 0.6mm)))；DRC 0 error。数值按 GEN-STK-007 的电流计算替换"
      automatable: full
  sources:
    - title: "KiCad 9.0 PCB Editor — Custom design rules; Track width violation"
      url: "https://docs.kicad.org/9.0/en/pcbnew/pcbnew.html"
      publisher: "KiCad"
      kind: tool_doc
      section: "Advanced topics > Custom design rules; DRC > Track width"
  confidence: high
  applies_to: [kicad]
  tags: [cat-feeder]

- id: GEN-STK-007
  title: 按电流和温升算线宽，IPC-2221 作保守下限
  domain: general
  stage: stackup
  severity: should
  rule: 载流线宽用 IPC-2221 公式 I = k·ΔT^0.44·A^0.725 估算（A 单位 mil²，外层 k=0.048，内层 k=0.024），ΔT 取 10 °C；有明确叠层且走线邻近铜平面时可用 IPC-2152 放宽，但同一块板不要混用两套标准。
  rationale: 线宽太窄会过热、压降大；IPC-2221 图表来自 1950 年代的有限数据，偏保守，IPC-2152（2009）用较新的测试并引入平面等修正，但各二手资料对其外 / 内层结论不一致。
  verify:
    - method: tline_calc
      tool: "Python 按公式计算（1 oz = 1.378 mil 厚）"
      check: "对每条载流网络取峰值 / RMS 电流 I，反解 A=(I/(k·ΔT^0.44))^(1/0.725)，宽度=A/铜厚；板上该网络最窄处宽度 ≥ 计算值。例（本调研按公式算出）：1 oz 外层 ΔT=10 °C：1 A→0.30 mm，3 A→1.37 mm，5 A→2.77 mm；同条件内层 k=0.024：1 A→0.78 mm，3 A→3.56 mm"
      automatable: full
    - method: geometry_script
      tool: "pcbnew：遍历 PCB_TRACK，按网络取 GetWidth() 最小值；铜皮用 zone 填充最窄颈宽"
      check: "对每个电源 / 电机网络，最窄走线宽度 ≥ 上一条算出的宽度；过窄处报警"
      automatable: full
    - method: bench
      tool: "热电偶或热像仪 + 可调电流源"
      check: "对最窄的载流段通额定峰值电流（稳态）10 分钟，测相对环境温升，通过判据 ≤ 设计 ΔT（10 °C）；同时四线法测压降"
      automatable: manual
  sources:
    - title: "Optimize your PCB trace using IPC-2152 standard"
      url: "https://www.protoexpress.com/blog/how-to-optimize-your-pcb-trace-using-ipc-2152-standard/"
      publisher: "Sierra Circuits"
      kind: blog
    - title: "IPC-2221 vs IPC-2152: Which PCB Trace Standard Should You Use?"
      url: "https://semiconductor.tools/blogs/07-ipc-2221-vs-ipc-2152"
      publisher: "semiconductor.tools"
      kind: blog
    - title: "PCB Trace Width and Current Capacity"
      url: "https://www.atlaspcb.com/blog/pcb-trace-width-current-capacity/"
      publisher: "AtlasPCB"
      kind: blog
    - title: "IPC-2221B 与 IPC-2152"
      ref: "IPC-2221B §6（导体载流图表）；IPC-2152（2009）"
      kind: standard
  confidence: medium
  applies_to: [power_nets, motor_driver]
  parameters:
    - name: ipc2221_k_external
      op: "=="
      value: 0.048
      unit: "-"
      note: "I = k·ΔT^0.44·A^0.725，A 为 mil²"
    - name: ipc2221_k_internal
      op: "=="
      value: 0.024
      unit: "-"
      note: "同上；内层 k 减半，同电流下所需截面积约为外层的 2.6 倍（因 0.725 指数）"
    - name: design_temp_rise
      op: "<="
      value: 10
      unit: degC
      note: "常用基线；semiconductor.tools 建议高可靠 5 °C、非关键最多 20 °C；Wevolver 称 10 °C→20 °C 约可减窄 25~30%（二手数字）"
  conflicts: "二手资料对 IPC-2221 与 IPC-2152 的差异说法不一：Sierra Circuits、semiconductor.tools 等称 IPC-2221 整体偏保守、内层尤甚（内层 k 减半），IPC-2152 显示内外层相差不大；AtlasPCB 却称 IPC-2221 对外层偏保守、对内层常不保守，IPC-2152 对外层允许更大电流、对内层更小。另有博客给出的 IPC-2221 示例宽度（3 A 外层 46 mil）与按公式实算的 54 mil 不符。取舍：公式常数以 Sierra 页面为准并已自行验算；设计时 IPC-2221 当保守下限，只有叠层已知且邻近平面时才用 IPC-2152 缩窄，并用热测量验证。没有读到 IPC 标准原文，故置信度 medium。"
  tags: [cat-feeder]

- id: GEN-STK-008
  title: 载流层间过孔至少两个，并按孔壁截面估算电流
  domain: general
  stage: stackup
  severity: should
  rule: 电源 / 地 / 电机电流跨层时至少打 2 个过孔并联；单个过孔载流按孔壁铜截面（π·(D+t)·t）代入 IPC-2221 估算，并留余量，大电流网络用过孔阵列。
  rationale: 过孔桶壁铜很薄（常见 25 µm），单个过孔的载流和电感都有限；并联过孔降低电阻与电感，也避免单点失效。
  verify:
    - method: geometry_script
      tool: "pcbnew：遍历电源 / 地网络的 PCB_VIA，按“连接同一对铜区域的过孔数”分组"
      check: "每个电源 / 地 / 电机网络的每个跨层连接点，并联过孔数 ≥ 2；大电流网络用 I / I_via_max 向上取整得到所需数量，I_via_max 取下面 note 估算的保守值"
      automatable: partial
    - method: drc
      tool: "KiCad 自定义规则 via_count"
      check: "(rule min_two_vias (condition \"A.hasNetclass('Power')\") (constraint via_count (min 2))) —— 注意 via_count 统计的是整网过孔总数，只能粗筛；逐连接点检查用 geometry_script"
      automatable: partial
    - method: bench
      tool: "毫欧表 / 四线法 + 热像仪"
      check: "对最大电流路径通额定电流测过孔段压降与温升，温升 ≤ 设计 ΔT"
      automatable: manual
  sources:
    - title: "ESP32-C3 Hardware Design Guidelines — PCB Layout Design"
      url: "https://docs.espressif.com/projects/esp-hardware-design-guidelines/en/latest/esp32c3/pcb-layout-design.html"
      publisher: "Espressif"
      kind: vendor_guide
      section: "Power Supply（四层板：主电源跨层至少两个过孔）"
    - title: "Trace Width vs Current in PCB Design"
      url: "https://www.wevolver.com/article/trace-width-vs-current-in-pcb-design"
      publisher: "Wevolver"
      kind: blog
      section: "via current capacity"
    - title: "PCB Trace Width and Current Capacity"
      url: "https://www.atlaspcb.com/blog/pcb-trace-width-current-capacity/"
      publisher: "AtlasPCB"
      kind: blog
      section: "via current estimate from barrel area"
  confidence: medium
  applies_to: [power_nets, motor_driver]
  parameters:
    - name: min_parallel_vias_power_transition
      op: ">="
      value: 2
      unit: count
      note: "Espressif：主电源走线跨层至少两个过孔"
  conflicts: "单个过孔的载流数字各来源差异大：Wevolver 称“典型过孔约 0.5 A”、5 A 网络要 5~10 个过孔，AtlasPCB 按 0.3 mm 孔、25 µm 镀铜的桶壁截面估算给 ≈1.2 A（10 °C 温升）；按 IPC-2221 常数自行算同一过孔桶壁截面（≈39.6 mil²）：外层 k 得 ≈1.9 A，内层 k 得 ≈0.95 A。取舍：没有标准原文，不把任何单一数字写进 parameters；设计取 ≤0.5 A / 过孔的保守值并用热测量验证，且最少 2 个。"
  tags: [cat-feeder]

# ───────────────────────── floorplan ─────────────────────────

- id: GEN-FLR-001
  title: 按功能和噪声等级分区，快逻辑靠近电源、模拟最远
  domain: general
  stage: floorplan
  severity: should
  rule: 布局前先画功能分区图（电源入口、稳压、数字 / MCU、慢速 IO、模拟、RF、连接器），同一功能的器件及走线放在一起；高速逻辑靠近电源，慢速器件更远，模拟器件最远。
  rationale: 噪声源靠近供电点可缩短高频电流环路，同时给敏感电路留出隔离距离；分区后各子系统的走线不需要穿过彼此的区域，也就不需要分割地平面。
  verify:
    - method: review
      tool: "分区图评审清单"
      check: "检查：每个功能块有明确矩形区域；MCU / 时钟在靠近稳压器一侧；模拟前端、称重 / 采样输入远离电机驱动与开关节点；分区图随 PCB 评审一起存档"
      automatable: manual
    - method: geometry_script
      tool: "pcbnew：按元件 sheet / 组分类取质心"
      check: "给每个功能块定义元件集合，计算块间质心距离与块外包矩形重叠；通过判据：任意两个块的外包矩形重叠面积 = 0，且噪声块（电机驱动、稳压器）与敏感块（采样输入、晶振）的最小间距 ≥ 设计设定值（项目自定，例如 10 mm）"
      automatable: partial
  sources:
    - title: "PCB Design Guidelines For Reduced EMI (SZZA009)"
      url: "https://www.ti.com/lit/an/szza009/szza009.pdf"
      publisher: "Texas Instruments"
      kind: app_note
      section: "§2.3 Board Zoning"
    - title: "High-Speed Layout Guidelines (SCAA082A)"
      url: "https://www.ti.com/lit/pdf/scaa082"
      publisher: "Texas Instruments"
      kind: app_note
      section: "§2 Practical PCB Design Rules（功能框图）"
    - title: "Partitioning and Layout of a Mixed-Signal PCB (H. Ott)"
      url: "https://www.edn.com/partitioning-and-layout-of-a-mixed-signal-pcb-3/"
      publisher: "EDN / Printed Circuit Design"
      kind: paper
  confidence: high
  applies_to: [mcu_board, mixed_signal]
  tags: [cat-feeder]

- id: GEN-FLR-002
  title: 电源入口、稳压器、MCU 依次相邻，地在三者间单点汇合
  domain: general
  stage: floorplan
  severity: should
  rule: 把 MCU 放在稳压器旁边、稳压器放在电源入口旁边，三者之间用实心（或网格化）地连成一个单点地参考，外壳 / 屏蔽也接在这一点。
  rationale: 电源路径越短、越像单点连接，共阻抗耦合越小；MCU 的高频电流应当来自它身边的去耦电容，而不是长长的电源线。
  verify:
    - method: geometry_script
      tool: "pcbnew，参见 ee-pcb-verify 的 geometry 检查器"
      check: "计算 电源入口连接器焊盘→稳压器输入电容→稳压器→MCU 供电引脚 的走线总长与折线长度，通过判据：稳压器到 MCU 的直线距离不超过板对角线的 1/3（经验阈值，按板调整），且这条路径上无其他功能块的元件插入"
      automatable: partial
    - method: bench
      tool: "示波器（20 MHz 带宽限制关闭，短地弹簧）"
      check: "在 MCU 供电引脚处测 VDD 纹波与 IO 翻转时的瞬态跌落，通过判据：跌落 < 芯片数据手册允许的 VDD 容差的一半"
      automatable: manual
  sources:
    - title: "PCB Design Guidelines For Reduced EMI (SZZA009)"
      url: "https://www.ti.com/lit/an/szza009/szza009.pdf"
      publisher: "Texas Instruments"
      kind: app_note
      section: "§2.3 Board Zoning; §2.2.1 Single-Point vs Multipoint Distribution"
  confidence: medium
  applies_to: [mcu_board, ldo]
  tags: [cat-feeder]

- id: GEN-FLR-003
  title: 各子系统的走线只在自己的分区内，跨区只走指定通道
  domain: general
  stage: floorplan
  severity: should
  rule: 模拟信号只在模拟区、数字信号只在数字区布线（所有层）；确需跨区的信号（如 ADC 的数字接口）走预先指定的一条通道，ADC / 带 ADC 的器件跨在分区边界上。
  rationale: 分区的目的是让数字回流电流不进入模拟区。只要有一条数字线布进模拟区，下方的回流路径就会穿过模拟区，破坏分区。
  verify:
    - method: geometry_script
      tool: "pcbnew：按网络类 / 网络名分类"
      check: "为每个分区定义矩形；对每条网络类为 Analog 的走线与过孔，检查是否落在数字区矩形内，对 Digital 网络反之；通过判据：违规线段数 = 0（指定通道内的跨区信号列入白名单）"
      automatable: full
    - method: drc
      tool: "KiCad 规则区域 + 自定义规则"
      check: "在数字区画规则区域 'dig_zone'，加 (rule no_analog_in_digital (condition \"A.intersectsArea('dig_zone') && A.hasNetclass('Analog')\") (constraint disallow track via))，反向再建一条 'ana_zone' 规则"
      automatable: full
  sources:
    - title: "Partitioning and Layout of a Mixed-Signal PCB (H. Ott)"
      url: "https://www.edn.com/partitioning-and-layout-of-a-mixed-signal-pcb-3/"
      publisher: "EDN / Printed Circuit Design"
      kind: paper
    - title: "High-Speed Layout Guidelines (SCAA082A)"
      url: "https://www.ti.com/lit/pdf/scaa082"
      publisher: "Texas Instruments"
      kind: app_note
      section: "§2.3, Figure 9"
  confidence: high
  applies_to: [mixed_signal]
  tags: [cat-feeder]

- id: GEN-FLR-004
  title: 大电流路径和开关环路远离敏感小信号
  domain: general
  stage: floorplan
  severity: should
  rule: 电机驱动 / MOSFET、分流电阻回路等大电流和快边沿路径及其地回流，布在与称重 / 采样输入、复位、晶振分开的区域；大功率地与数字 / 模拟地只在单点汇合。
  rationale: 数字地和大功率地承载需要被限制的射频电流，且高 di/dt 会通过公共地阻抗耦合进敏感电路；不相关的低噪声线靠近继电器 / 电机驱动器等会拾取噪声。
  verify:
    - method: geometry_script
      tool: "pcbnew"
      check: "取大电流网络（网络类 Power / Motor）的所有走线与焊盘，对敏感网络（采样输入、晶振、复位、EN）的每条走线计算两者最小间距，通过判据 ≥ 项目设定值（建议 ≥ 5 mm，经验阈值）；同时检查电机回流电流路径是否经过模拟区"
      automatable: partial
    - method: bench
      tool: "示波器 + 称重 / 采样通道静态读数"
      check: "电机 PWM 运行与停转两种状态下，记录采样通道读数的噪声（峰峰值 / 标准差）；通过判据：运行时噪声增量 < 采样分辨率的 1 LSB RMS 或项目指定值"
      automatable: manual
  sources:
    - title: "PCB Design Guidelines For Reduced EMI (SZZA009)"
      url: "https://www.ti.com/lit/an/szza009/szza009.pdf"
      publisher: "Texas Instruments"
      kind: app_note
      section: "§2.1.5 Analog vs Digital vs High Power; §2.4.1 Capacitive and Inductive Crosstalk"
    - title: "Grounding Analog-Digital Converters (J. Bryant, ADI lecture, mirror)"
      url: "http://www.hit.bme.hu/~papay/edu/Acrobat/GndADCs.pdf"
      publisher: "Analog Devices"
      kind: app_note
  confidence: medium
  applies_to: [motor_driver, mixed_signal]
  tags: [cat-feeder]

- id: GEN-FLR-005
  title: 连接器集中在板边，噪声源与晶振远离连接器
  domain: general
  stage: floorplan
  severity: should
  rule: 外部连接器（电源、电机、传感器、调试口）成组放在板边同一区域，I/O 的滤波 / ESD 器件放在连接器附近；晶振回路、开关器件、时钟线远离连接器和电缆走向，不设计会折叠到振荡器 / MCU 上方的线缆。
  rationale: 电缆是主要辐射体和注入通道；噪声线靠近连接器会被耦合到电缆上，外部电缆干扰也更容易进入时钟、复位。
  verify:
    - method: geometry_script
      tool: "pcbnew"
      check: "取所有连接器 footprint 的外包框到最近板边距离（应 ≤ 5 mm，经验阈值）与连接器所在边集合（≤ 2 条边）；取晶振 / 时钟网络走线到最近连接器焊盘的距离，通过判据 ≥ 项目设定值（建议 ≥ 15 mm）"
      automatable: partial
    - method: emc_precompliance
      tool: "电流探头 / 近场探头"
      check: "连接电缆后，用共模电流探头测电缆上的共模电流谱，对比拔掉电缆的基线"
      automatable: manual
  sources:
    - title: "PCB Design Guidelines For Reduced EMI (SZZA009)"
      url: "https://www.ti.com/lit/an/szza009/szza009.pdf"
      publisher: "Texas Instruments"
      kind: app_note
      section: "§2.3 Board Zoning; §2.4.1; §2.5 Cables and Connectors"
    - title: "7 PCB Design Guidelines for EMI and EMC"
      url: "https://www.protoexpress.com/blog/7-pcb-design-tips-solve-emi-emc-issues/"
      publisher: "Sierra Circuits"
      kind: blog
      section: "connectors and I/O"
  confidence: medium
  applies_to: [mcu_board]
  tags: [cat-feeder]

- id: GEN-FLR-006
  title: 带板载天线的模块放在板边，天线区空出
  domain: general
  stage: floorplan
  severity: should
  rule: 带 PCB 天线的 Wi-Fi / BLE 模块把天线端放在板边外侧或贴边，馈点尽量靠近板边；天线下方和周围所有层不放铜与器件，不要让模块四周都被挖空；外壳内天线周围各方向至少留 15 mm。
  rationale: 天线周围的铜和器件会失谐并降低增益；贴边放置是让天线辐射区远离主板铜的最简单办法。
  verify:
    - method: geometry_script
      tool: "pcbnew，参见 ee-pcb-verify 的 geometry 检查器 的天线区检查"
      check: "取模块 footprint 天线端的外包框，通过判据：天线禁布区内（所有铜层）元件数 = 0，且天线端到最近板边距离 ≤ 馈点到板边距离的 +2 mm；板边外侧悬出时检查机械可行性"
      automatable: partial
    - method: bench
      tool: "路由器 / 手机 RSSI 或吞吐量测试"
      check: "在最终外壳里测同一距离、同一环境下的 RSSI 与吞吐量，对比模块官方开发板；通过判据：RSSI 差 ≤ 3 dB"
      automatable: manual
  sources:
    - title: "ESP32-C3 Hardware Design Guidelines — PCB Layout Design"
      url: "https://docs.espressif.com/projects/esp-hardware-design-guidelines/en/latest/esp32c3/pcb-layout-design.html"
      publisher: "Espressif"
      kind: vendor_guide
      section: "General Principles of PCB Layout for Modules"
  confidence: high
  applies_to: [wifi_module, esp32]
  parameters:
    - name: antenna_clearance_in_housing
      op: ">="
      value: 15
      unit: mm
      note: "Espressif：外壳内天线周围各方向"
  conflicts: "“RSSI 差 ≤ 3 dB” 是本条验证的经验通过判据，不是 Espressif 数值；RF 领域细节由 RF 文件负责。"
  tags: [cat-feeder]

- id: GEN-FLR-007
  title: 板框闭合，铜到板边满足板厂最小间距
  domain: general
  stage: floorplan
  severity: must
  rule: Edge.Cuts 板框必须是闭合不自交的轮廓；铜（线、焊盘、铺铜）到铣边 ≥ 0.2 mm、到 V-cut 边 ≥ 0.4 mm（JLC）。
  rationale: 板框不闭合板厂无法加工；铜离板边太近会被铣刀切到而短路或露铜。
  verify:
    - method: drc
      tool: "kicad-cli pcb drc --format json"
      check: "项目设 min_copper_edge_clearance=0.2 mm（V-cut 板 0.4 mm）；DRC 里“Board has malformed outline”和“Board edge clearance violation”必须为 0；自定义规则 (rule edge_all (constraint edge_clearance (min 0.3mm))) 可给余量"
      automatable: full
    - method: geometry_script
      tool: "pcbnew"
      check: "对 Edge.Cuts 取闭合多边形，计算所有铜对象（线、焊盘、铺铜填充）到其最小距离，通过判据 ≥ 0.2 mm"
      automatable: full
  sources:
    - title: "JLCPCB PCB Manufacturing & Assembly Capabilities"
      url: "https://jlcpcb.com/capabilities/pcb-capabilities"
      publisher: "JLCPCB"
      kind: vendor_guide
    - title: "KiCad 9.0 PCB Editor — Design for manufacturing DRC checks"
      url: "https://docs.kicad.org/9.0/en/pcbnew/pcbnew.html"
      publisher: "KiCad"
      kind: tool_doc
      section: "Board edge clearance violation; Board has malformed outline"
  confidence: high
  applies_to: [jlc]
  parameters:
    - name: copper_to_routed_edge
      op: ">="
      value: 0.2
      unit: mm
      note: "JLC 铣边"
    - name: copper_to_vcut_edge
      op: ">="
      value: 0.4
      unit: mm
      note: "JLC V-cut"
  tags: [cat-feeder]

- id: GEN-FLR-008
  title: 安装孔预先定位，孔径和孔距满足板厂，并留地回流接点
  domain: general
  stage: floorplan
  severity: consider
  rule: 在布局初期定好安装孔位置；非镀铜孔（NPTH）孔径 ≥ 0.5 mm，孔与孔边到边 ≥ 0.45 mm；靠近 I/O 连接器的安装孔需要做机壳地回流时用镀铜孔接 GND，并尽量靠近连接器外壳地和 ESD 器件地。
  rationale: 机壳螺钉紧邻 TVS 地和连接器屏蔽地，是为 ESD 电流提供低阻抗回流的做法；孔位晚定会反过来推翻布局。
  verify:
    - method: drc
      tool: "kicad-cli pcb drc；自定义规则"
      check: "(rule mount_hole_size (condition \"A.Type == 'Pad' && A.Pad_Type == 'NPTH, mechanical'\") (constraint hole_size (min 0.5mm))) 与 (rule hole2hole (constraint hole_to_hole (min 0.45mm)))；DRC 0 error"
      automatable: full
    - method: review
      tool: "机械装配核对"
      check: "与外壳 3D / 图纸叠合，检查螺钉头、塑料柱与元件、走线的干涉；螺钉头禁布半径按实际螺钉定，不在本库给数值"
      automatable: manual
  sources:
    - title: "JLCPCB PCB Manufacturing & Assembly Capabilities"
      url: "https://jlcpcb.com/capabilities/pcb-capabilities"
      publisher: "JLCPCB"
      kind: vendor_guide
    - title: "ESD Protection Layout Guide (SLVA680A)"
      url: "https://www.ti.com/lit/an/slva680/slva680.pdf"
      publisher: "Texas Instruments"
      kind: app_note
      section: "§1, §2.4"
  confidence: medium
  applies_to: [mcu_board, jlc]
  parameters:
    - name: min_npth_hole
      op: ">="
      value: 0.5
      unit: mm
      note: "JLC 最小 NPTH 孔"
    - name: min_hole_to_hole
      op: ">="
      value: 0.45
      unit: mm
      note: "JLC 焊盘孔到孔最小间距"
  tags: [cat-feeder]

# ───────────────────────── placement ─────────────────────────

- id: GEN-PLC-001
  title: 先放固定件，再放 MCU 链，最后放去耦与外围
  domain: general
  stage: placement
  severity: consider
  rule: 布局顺序：①位置被机械固定的件（连接器、安装孔、天线模块、按键）→ ②电源入口→稳压器→MCU 这条链（见 GEN-FLR-002）→ ③紧贴 IC 引脚的去耦电容、晶振及负载电容 → ④其余外围；每一步完成后再进下一步，后一步不得推翻前一步的位置。
  rationale: 去耦、晶振等对距离最敏感的件必须贴着 IC，所以要在 IC 位置定下后立刻放，而不是留到最后见缝插针。
  verify:
    - method: review
      tool: "布局评审清单"
      check: "检查：连接器和安装孔位置与外壳一致；MCU 周围每个电源引脚都有去耦电容在最近位置；没有因后加外围而把去耦电容挤远（对照 GEN-PLC-002 的距离检查）"
      automatable: manual
  sources:
    - title: "PCB Design Guidelines For Reduced EMI (SZZA009)"
      url: "https://www.ti.com/lit/an/szza009/szza009.pdf"
      publisher: "Texas Instruments"
      kind: app_note
      section: "§2.3 Board Zoning (prioritizing component placement)"
    - title: "ESP32-C3 Hardware Design Guidelines — PCB Layout Design"
      url: "https://docs.espressif.com/projects/esp-hardware-design-guidelines/en/latest/esp32c3/pcb-layout-design.html"
      publisher: "Espressif"
      kind: vendor_guide
      section: "General Principles of PCB Layout for Modules"
  confidence: low
  applies_to: [mcu_board]
