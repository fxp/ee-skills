      op: "=="
      value: 1
      unit: count
      note: "RP2040 指南：每个电源引脚 100 nF，个别空间受限引脚可共用"
    - name: decap_loop_trace_length_to_width
      op: "<="
      value: 3
      unit: ratio
      note: "TI SZZA009：旁路回路中的走线长宽比"
    - name: decap_value_nearest_pin
