      unit: "multiple of h"
      note: "Ott：x/h=5 时约 87%；x/h=10→94%，20→97%"
  tags: [cat-feeder]

- id: GEN-RTE-002
  title: 信号线不得跨越参考平面的分割槽或缝隙
  domain: general
  stage: routing
  severity: must
  rule: 任何信号线都不得跨越其参考地 / 电源平面上的分割、槽或缺口；无法避免的跨越必须走在桥接位置上方或改用隔离 / 差分方式。跨越分割的电源平面时，走线所在层必须邻接完整地平面。
  rationale: 跨槽使回流无法贴着信号走，形成大环路并把噪声注入另一个平面，辐射和串扰急剧增大；槽本身还会成为缝隙天线。
  verify:
    - method: geometry_script
      tool: "pcbnew：参考层 zone 填充 + 走线几何"
      check: "对所有非电源网络的每个走线段，取其中点所在位置在参考层的填充：若不在任何 GND 填充内（或线段穿越填充边界），则标为“跨槽”；通过判据：跨槽线段数 = 0（桥接位置白名单除外）"
      automatable: full
    - method: bench
      tool: "示波器 / 近场探头，对比实验"
      check: "Ott 建议的对比：先按“不跨槽”布出分割地板，再用 0 Ω 电阻或跳线（约每 1/2 英寸一个）把两块地连起来，测功能与 EMC，对比分割 / 不分割的结果"
      automatable: manual
  sources:
    - title: "Partitioning and Layout of a Mixed-Signal PCB (H. Ott)"
      url: "https://www.edn.com/partitioning-and-layout-of-a-mixed-signal-pcb-3/"
      publisher: "EDN / Printed Circuit Design"
      kind: paper
    - title: "High-Speed Layout Guidelines (SCAA082A)"
      url: "https://www.ti.com/lit/pdf/scaa082"
      publisher: "Texas Instruments"
      kind: app_note
      section: "§1.6; §2.3 Power and Ground Planes"
    - title: "7 PCB Design Guidelines for EMI and EMC"
      url: "https://www.protoexpress.com/blog/7-pcb-design-tips-solve-emi-emc-issues/"
      publisher: "Sierra Circuits"
      kind: blog
  confidence: high
  applies_to: [2_layer, 4_layer, mixed_signal]
  tags: [cat-feeder]

- id: GEN-RTE-003
  title: 信号换层时在过孔旁放地过孔提供回流
  domain: general
  stage: routing
  severity: should
  rule: 信号线换层且参考平面随之改变（或经过孔穿过地铜）时，在该信号过孔旁就近加地过孔（缝合过孔）；若信号过孔穿过的是连续不间断的同一参考平面，则不需要。
  rationale: 换层使回流需要在不同平面间跳转，没有紧邻的地过孔就得绕远路，形成环路；地过孔相当于同轴结构的外导体。
  verify:
    - method: geometry_script
      tool: "pcbnew"
      check: "对每个信号类过孔（非 GND、非电源），找最近的 GND 过孔，量中心距；通过判据：距离 ≤ 项目设定值（建议 ≤ 2.5 mm，经验阈值）；若过孔两端参考同一平面（2 层板上底层为 GND 铺铜时，信号过孔打穿地铜形成孔洞，也要在旁补地过孔）则豁免条件另行登记"
      automatable: partial
  sources:
    - title: "High-Speed Layout Guidelines (SCAA082A)"
      url: "https://www.ti.com/lit/pdf/scaa082"
      publisher: "Texas Instruments"
      kind: app_note
      section: "§2.5 Traces, Vias, and Other PCB Components（Figure 14）"
    - title: "7 PCB Design Guidelines for EMI and EMC"
      url: "https://www.protoexpress.com/blog/7-pcb-design-tips-solve-emi-emc-issues/"
      publisher: "Sierra Circuits"
      kind: blog
      section: "Stitching vias"
  confidence: medium
  applies_to: [4_layer, 2_layer]
  tags: [cat-feeder]

- id: GEN-RTE-004
  title: 电源线与地线并行贴近，环路长宽比不超过 3:1
  domain: general
  stage: routing
  severity: should
  rule: 2 层板上电源与地并行布线，让电源走线正好在地线（或地铜）的正上方；IC 到电源之间的电源和地走线，长度与宽度之比不超过 3:1。
  rationale: 电感随长度增加、随宽度缓慢减小；电源线的电感在开关电流下产生会传播和辐射的压降。电源与地重叠减小环路面积。
  verify:
    - method: geometry_script
      tool: "pcbnew"
      check: "对每个 IC 的电源网络，沿从稳压器 / 去耦电容到 IC 电源引脚的连接取每段走线的长度 / 宽度比（宽度取该段最窄处），通过判据 ≤ 3；并检查该段正下方相邻层有无 GND 铜（≥ 90% 长度，经验阈值）"
      automatable: full
  sources:
    - title: "PCB Design Guidelines For Reduced EMI (SZZA009)"
      url: "https://www.ti.com/lit/an/szza009/szza009.pdf"
      publisher: "Texas Instruments"
      kind: app_note
      section: "§2.1.1 Inductance"
  confidence: high
  applies_to: [2_layer, mcu_board]
  parameters:
    - name: power_ground_trace_length_to_width
      op: "<="
      value: 3
      unit: ratio
      note: "TI：两层板，IC 到电压源之间的电源和地走线"
  tags: [cat-feeder]

- id: GEN-RTE-005
  title: 电源分配单点或星形，别串成菊花链
  domain: general
  stage: routing
  severity: should
  rule: 电源从稳压器 / 入口大电容出发，用各自独立的支路分别供给 MCU、模块与电机等负载，在源头单点汇合；不让一个负载的电源走线串联穿过另一个负载。
  rationale: 菊花链（多点）让后级共用前级的走线阻抗，噪声通过共阻抗耦合；单点最佳，星形次之，多点最差（对信号线则星形最优）。
  verify:
    - method: geometry_script
      tool: "pcbnew：按网络建铜连通图"
      check: "以稳压器输出 / 入口电容为根，构造电源网络的树；对每个负载（MCU 电源、电机驱动、传感器）取从根到它的路径；通过判据：不同负载的路径只在根（入口电容焊盘）处共享，共享走线段长度 ≤ 1 个走线宽度；噪声负载（电机驱动）与敏感负载（MCU、模拟）不共用走线"
      automatable: partial
    - method: bench
      tool: "示波器"
      check: "电机启动时测 MCU 3V3 引脚电压跌落，对比星形与链式；通过判据：跌落 < MCU 供电容差的一半"
      automatable: manual
  sources:
    - title: "PCB Design Guidelines For Reduced EMI (SZZA009)"
      url: "https://www.ti.com/lit/an/szza009/szza009.pdf"
      publisher: "Texas Instruments"
      kind: app_note
      section: "§2.2.1 Single-Point vs Multipoint; §2.2.2 Star Distribution, Figure 6"
  confidence: high
  applies_to: [mcu_board, motor_driver]
  conflicts: "TI 的 Figure 6 对“电源线”认为单点最佳、星形次之、多点最差，对“信号线”认为星形最佳。本条只讨论电源。实际 2 层小板上完全单点难做到，TI 也建议“产生 RF 的器件单点、其余多点”的折中。"
  tags: [cat-feeder]

- id: GEN-RTE-006
  title: MCU 供电走线按厂商给的最小宽度
  domain: general
  stage: routing
  severity: consider
  rule: 以 ESP32-C3 厂商指南为例：3.3 V 主电源走线宽度 ≥ 25 mil（0.635 mm），VDD3P3 走线 ≥ 20 mil（0.508 mm），其他电源走线推荐 10 mil（0.254 mm）；电源走线跨层至少 2 个过孔。其他 MCU 以各自指南为准，不低于按电流算出的宽度（GEN-STK-007）。
  rationale: 无线类芯片的发射瞬间电流大，供电走线阻抗过高会拉低芯片引脚电压，造成复位或射频性能变差。
  verify:
    - method: geometry_script
      tool: "pcbnew"
      check: "对 3V3 主网络的走线段最窄宽度取 min，应 ≥ 0.635 mm（模块板为 3V3 到模块电源引脚之间的走线）；其它电源网络 ≥ 0.254 mm；跨层处并联过孔 ≥ 2"
      automatable: full
    - method: drc
      tool: "KiCad 自定义规则"
      check: "(rule v3p3_width (condition \"A.hasNetclass('Power3V3')\") (constraint track_width (min 0.635mm)))"
      automatable: full
  sources:
    - title: "ESP32-C3 Hardware Design Guidelines — PCB Layout Design"
      url: "https://docs.espressif.com/projects/esp-hardware-design-guidelines/en/latest/esp32c3/pcb-layout-design.html"
      publisher: "Espressif"
      kind: vendor_guide
      section: "Power Supply"
  confidence: high
  applies_to: [esp32, wifi_module]
  parameters:
    - name: main_3v3_trace_width
      op: ">="
      value: 0.635
      unit: mm
      note: "Espressif：3.3 V main power traces at least 25 mil（四层板章节；2 层板章节未给宽度）"
    - name: vdd3p3_trace_width
      op: ">="
      value: 0.508
      unit: mm
      note: "Espressif：20 mil"
    - name: other_power_trace_width
      op: ">="
      value: 0.254
      unit: mm
      note: "Espressif：推荐 10 mil"
  conflicts: "这些宽度出自 ESP32-C3 芯片的四层板章节；cat-feeder 板用的是 ESP32-C3-WROOM-02 模块 + 2 层板，模块内部已含芯片供电，板上只需把 3V3 以不低于该宽度送到模块电源脚。"
  tags: [cat-feeder]

- id: GEN-RTE-007
  title: 拐角默认用 45° 或圆弧，90° 并非一概有害
  domain: general
  stage: routing
  severity: consider
  rule: 默认用 45° 或圆弧拐角（无额外成本）；对射频、可控阻抗快速线、ESD 保护路径（连接器到 TVS）严格禁用 90° 拐角；对普通低速 MCU 信号，90° 拐角不是信号完整性问题。拐角是否影响信号：线宽（mil）> 5 × 上升时间（ps）时才值得担心。
  rationale: 拐角处多出约半个方块的金属，附加约 2 fF/mil × 线宽的电容，产生微小反射；对 4~8 mil 线宽和纳秒级边沿几乎不可见。但在 ESD 这种 ~800 ps 上升沿、数十 A 的路径上，90° 拐角处场强集中，辐射明显更强。
  verify:
    - method: geometry_script
      tool: "pcbnew：遍历相连的 PCB_TRACK 对"
      check: "对每对共端点的线段计算方向变化角，转角 ≥ 80° 视为 90° 拐角；通过判据（严格集合：RF / 快速 / ESD 路径网络类）：90° 拐角数 = 0；普通网络仅报告数量不判失败"
      automatable: full
    - method: drc
      tool: "KiCad 自定义规则 track_angle 约束"
      check: "(rule no_right_angle (condition \"A.hasNetclass('ESD_Path') || A.hasNetclass('RF')\") (constraint track_angle (min <阈值>deg))) —— KiCad 文档未定义“角度”的取值惯例（直线是 180° 还是 0°），先用含已知 90° 拐角的测试板确认惯例再填阈值"
      automatable: partial
    - method: bench
      tool: "TDR（上升时间 ≤ 40 ps）"
      check: "Bogatin 用 40 ps 上升时间的 TDR 在 60 mil 线的拐角上测得附加电容约 96 fF（经验公式估算 120 fF）；在自己板上做同样测量可验证 5×rise 判据"
      automatable: manual
  sources:
    - title: "When to worry about trace corners: Rule of Thumb #24 (E. Bogatin)"
      url: "https://www.edn.com/when-to-worry-about-trace-corners-rule-of-thumb-24/"
      publisher: "EDN"
      kind: paper
    - title: "ESD Protection Layout Guide (SLVA680A)"
      url: "https://www.ti.com/lit/an/slva680/slva680.pdf"
      publisher: "Texas Instruments"
      kind: app_note
      section: "§2.2 Limiting EMI from ESD"
    - title: "High-Speed Layout Guidelines (SCAA082A)"
      url: "https://www.ti.com/lit/pdf/scaa082"
      publisher: "Texas Instruments"
      kind: app_note
      section: "§2.5（Figure 13）"
    - title: "PCB Routing Angle Myths: 45-degree Angle Vs 90-degree Angle"
      url: "https://resources.altium.com/p/pcb-routing-angle-myths-45-degree-angle-versus-90-degree-angle"
      publisher: "Altium"
      kind: blog
  confidence: high
  applies_to: [routing]
  parameters:
    - name: corner_excess_capacitance
      op: "=="
      value: 2
      unit: "fF per mil of line width"
      note: "Bogatin 经验值（推导得 1.6 fF/mil，取整为 2）；60 mil 线的拐角估算约 120 fF，其 TDR 实测约 96 fF"
    - name: corner_matters_when
      op: qualitative
      value: null
      unit: "-"
      note: "线宽(mil) > 5 × 上升时间(ps)。例：10 ps 上升时 50 Ω 线宽 > 50 mil 才受影响；100 ps → 500 mil"
    - name: esd_path_max_corner
      op: "<="
      value: 45
      unit: deg
      note: "TI SLVA680A：连接器到 TVS 路径若必须拐弯，优先圆弧，最大 45°"
  conflicts: "TI SCAA082A 建议避免直角（至少两个 45° 或圆弧）；Bogatin 和 Altium 指出对普通数字线它们只是约几 fF 的电容，不值得担心；TI SLVA680A 又把 ESD 路径上的 90° 拐角描述为强辐射源（电场在拐角集中，8 kV 下半径小于约 2.6 mm 会电离）。三者前提不同：普通低速线 / 高速可控阻抗线 / ESD 大 di/dt 路径。取舍：默认 45° 或圆弧，仅对后两类严格；不把“90° 一律有害”当规则。"
  tags: [cat-feeder]

- id: GEN-RTE-008
  title: 快信号避免 T 形分支和长残桩
  domain: general
  stage: routing
  severity: should
  rule: 时钟和快速信号做成点对点或链式（干线上只有极短的引出），不使用 T 形分支；同一信号经过多层过孔时，不要留下穿过整板的过孔残桩。
  rationale: 分支处发生阻抗突变和反射，分支到各器件的延时也不同；过孔穿过的多余部分相当于开路传输线，在 1/4 波长处造成零点。
  verify:
    - method: geometry_script
      tool: "pcbnew：按网络建连通图"
      check: "对 Clock 类网络计算图中度 ≥ 3 的节点（分支点），并量每个引出段长度；通过判据：时钟网络分支点数 = 0，或引出段长度 ≤ 项目设定值（建议 ≤ 2 mm，经验阈值）"
      automatable: full
    - method: si_sim
      tool: "ngspice / IBIS 瞬态"
      check: "对多负载时钟仿真，各接收端的过冲和单调性满足输入阈值，且最慢边沿时间满足建立 / 保持"
      automatable: partial
  sources:
    - title: "High-Speed Layout Guidelines (SCAA082A)"
      url: "https://www.ti.com/lit/pdf/scaa082"
      publisher: "Texas Instruments"
      kind: app_note
      section: "§2.6 Clock Distribution; §2.5（Figure 16 via stub）"
    - title: "ESP32-C3 Hardware Design Guidelines — PCB Layout Design"
      url: "https://docs.espressif.com/projects/esp-hardware-design-guidelines/en/latest/esp32c3/pcb-layout-design.html"
      publisher: "Espressif"
      kind: vendor_guide
      section: "RF（走线无分支）"
  confidence: high
  applies_to: [clock, fast_signals]

- id: GEN-RTE-009
  title: 敏感信号和时钟尽量不打过孔
  domain: general
  stage: routing
  severity: should
  rule: 时钟、晶振、复位、射频、模拟小信号等敏感网络尽量全程同层布线、不打过孔；晶振时钟输入 / 输出走线上不放过孔。
  rationale: 过孔引入电感和电容、造成阻抗突变和反射，并增加走线长度，还会让回流换层。
  verify:
    - method: drc
      tool: "KiCad 自定义规则 via_count"
      check: "(rule no_via_clock (condition \"A.hasNetclass('Clock') || A.hasNetclass('Sensitive')\") (constraint via_count (max 0))) —— 个别确需换层的网络在规则里按网络名排除，并配套执行 GEN-RTE-003"
      automatable: full
    - method: geometry_script
      tool: "pcbnew"
      check: "统计各敏感网络的过孔数，晶振 OSC 网络必须为 0"
      automatable: full
  sources:
    - title: "High-Speed Layout Guidelines (SCAA082A)"
      url: "https://www.ti.com/lit/pdf/scaa082"
      publisher: "Texas Instruments"
      kind: app_note
      section: "§2.5 Tips for routing traces and the use of vias"
    - title: "ESP32-C3 Hardware Design Guidelines — PCB Layout Design"
      url: "https://docs.espressif.com/projects/esp-hardware-design-guidelines/en/latest/esp32c3/pcb-layout-design.html"
      publisher: "Espressif"
      kind: vendor_guide
      section: "Crystal; RF"
  confidence: high
  applies_to: [clock, crystal, sensitive_analog]
  parameters:
    - name: vias_on_crystal_clock_traces
      op: "=="
      value: 0
      unit: count
      note: "Espressif：Do not place vias on the clock input and output traces"

- id: GEN-RTE-010
  title: 干扰源与敏感线间距至少 3 倍线宽
  domain: general
  stage: routing
  severity: should
  rule: 时钟、PWM、开关等干扰线与敏感线（复位、采样输入、模拟小信号）平行走线时，边到边间距 ≥ 3 倍线宽（3W）；平行长度很短或参考平面很近时可小于 3W，但不低于 2 倍线宽。
  rationale: 串扰随平行长度、频率、电压摆幅增大，随间距增大而减小；3W 是偏保守的经验值，适合走线与地平面距离较大的板子。
  verify:
    - method: drc
      tool: "KiCad 自定义规则 clearance"
      check: "按网络类写规则，例如 0.2 mm 线宽的 Clock 网络类：(rule clock_3w (condition \"A.hasNetclass('Clock') && !B.hasNetclass('Clock')\") (constraint clearance (min 0.6mm)))；DRC 0 error"
      automatable: full
    - method: geometry_script
      tool: "pcbnew：计算平行段"
      check: "对 Clock / PWM 网络与 Sensitive 网络的每对走线，找平行（夹角 < 10°）且间距 < 3W 的段，累计长度；通过判据：累计长度 ≤ 项目设定值（建议 ≤ 5 mm，经验阈值）"
      automatable: full
    - method: bench
      tool: "示波器"
      check: "让干扰线持续翻转，测受害线上的串扰幅度，通过判据：串扰峰值 < 受害输入的噪声容限的 1/4（经验判据）"
      automatable: manual
  sources:
    - title: "High-Speed Layout Guidelines (SCAA082A)"
      url: "https://www.ti.com/lit/pdf/scaa082"
      publisher: "Texas Instruments"
      kind: app_note
      section: "§1.4 Crosstalk; §2.5 tips"
    - title: "Crosstalk Analysis, Reduction, and Elimination Techniques in PCB Design"
      url: "https://resources.altium.com/p/crosstalk-elimination-techniques-in-altium-designer"
      publisher: "Altium"
      kind: blog
    - title: "Handling Crosstalk in High-Speed PCB Design"
      url: "https://www.protoexpress.com/blog/crosstalk-high-speed-pcb-design/"
      publisher: "Sierra Circuits"
      kind: blog
  confidence: medium
  applies_to: [mcu_board, mixed_signal]
  parameters:
    - name: aggressor_victim_spacing
      op: ">="
      value: 3
      unit: "multiple of trace width"
      note: "Altium / Sierra Circuits 的 3W；边到边口径较保守（中心到中心 3W 仅约 2W 净间距）"
    - name: absolute_min_spacing
      op: ">="
      value: 2
      unit: "multiple of trace width"
      note: "TI SCAA082A：至少 2 倍线宽；§2.5 提示取 2~3 倍"
    - name: critical_traces_guarded_spacing
      op: ">="
      value: 3
      unit: "multiple of trace width"
      note: "Sierra：关键线之间 3W~5W（取 3~5）并配合接地保护线"
  conflicts: "3W 的度量口径各来源不同：多数说边到边，有说中心到中心；Altium 指出板子参考平面更近（介质更薄）时可以小于 3W，而间距实际取决于走线到平面的距离。取舍：边到边 3W 作保守值，平面很近时可降到不低于 2W（TI），并以仿真 / 实测验证。"
  tags: [cat-feeder]

- id: GEN-RTE-011
  title: 相邻走线层垂直布线，但 2 层板优先保证回流
  domain: general
  stage: routing
  severity: consider
  rule: 两个相邻走线层之间有或没有平面时分别处理：中间隔着完整平面的相邻层，让走线方向相互垂直以减小层间耦合；没有平面的 2 层板，则以“回流紧贴信号”优先，底层主要做地铜，不为垂直而牺牲地。
  rationale: 平行走线在相邻层之间耦合，垂直布线最小；但 2 层板本身没有平面，垂直网格会让返回路径离开信号线正下方。
  verify:
    - method: geometry_script
      tool: "pcbnew"
      check: "仅对双面都走信号的板：统计顶层与底层平行（夹角 < 10°）且重叠（正投影重叠宽度 > 0）的信号段长度，通过判据：重叠长度 ≤ 项目设定值；同时对高速 / 时钟线保留回流检查（GEN-RTE-001）"
      automatable: partial
  sources:
    - title: "High-Speed Layout Guidelines (SCAA082A)"
      url: "https://www.ti.com/lit/pdf/scaa082"
      publisher: "Texas Instruments"
      kind: app_note
      section: "§2.5 Tips for routing traces and the use of vias"
    - title: "PCB Design Guidelines For Reduced EMI (SZZA009)"
      url: "https://www.ti.com/lit/an/szza009/szza009.pdf"
      publisher: "Texas Instruments"
      kind: app_note
      section: "§2.2.3 Gridding to Create Planes"
  confidence: medium
  applies_to: [2_layer, 4_layer]
  conflicts: "SCAA082A 建议相邻层垂直布线以减少串扰；SZZA009 §2.2.3 却指出：顶层走线多为竖向、底层多为横向，这本来就与“让回流直接在信号线正下方”相悖。前者面向有平面的高速板，后者面向 2 层板。取舍：有平面时垂直，2 层板以回流为先。"
  tags: [cat-feeder]

- id: GEN-RTE-012
  title: 噪声走线不放在板子最外沿
  domain: general
  stage: routing
  severity: consider
  rule: 时钟、PWM 等噪声大的走线不走在板子最外沿，离板边留出距离；可能成为受害者的线远离连接器、晶振、继电器 / 电机驱动。
  rationale: 板边的走线更容易向外辐射、边缘处回流平面也不完整；靠近连接器的线最容易拾取或传出噪声。
  verify:
    - method: geometry_script
      tool: "pcbnew"
      check: "取 Clock / PWM / Switching 网络走线到 Edge.Cuts 的最短距离，通过判据 ≥ 项目设定值（建议 ≥ 3 mm，经验阈值）；回流平面（GND 铜）应延伸到走线外至少 2h（见 GEN-RTE-001）"
      automatable: full
  sources:
    - title: "PCB Design Guidelines For Reduced EMI (SZZA009)"
      url: "https://www.ti.com/lit/an/szza009/szza009.pdf"
      publisher: "Texas Instruments"
      kind: app_note
      section: "§2.4.1 Capacitive and Inductive Crosstalk"
    - title: "7 PCB Design Guidelines for EMI and EMC"
      url: "https://www.protoexpress.com/blog/7-pcb-design-tips-solve-emi-emc-issues/"
      publisher: "Sierra Circuits"
      kind: blog
  confidence: medium
  applies_to: [mcu_board]
  conflicts: "只有 TI 的定性表述（“绝不让噪声线跑在板子外沿”），没有给距离；板边距离是本库的经验阈值。20H 一类规则属 EMC 文件范围。"

- id: GEN-RTE-013
  title: 晶振下方不走信号，时钟走线周围用地包裹
  domain: general
  stage: routing
  severity: should
  rule: 晶振下方不走任何信号线（最好完全不走线）；时钟走线两侧和附近用地铜包围并加地过孔，电源过孔离时钟线尽量远；高频信号（USB、UART、SPI 时钟）远离晶振走线；晶振和时钟网络上不挂测试点。
  rationale: 晶振信号微弱且杂散电容敏感，旁边的快边沿会耦合进来；测试点和长引线增加杂散电容与天线效应，ST 在其坏例子里就把“测试点太多”列为问题。
  verify:
    - method: geometry_script
      tool: "pcbnew"
      check: "取晶振 courtyard 区域，检查所有层中是否存在非 OSC / GND 网络的走线、过孔、铜皮；检查 OSC 网络上的测试点焊盘（Fabrication_Property == 'Test point pad' 或位号 TP*）数量必须为 0；通过判据：违规项 = 0"
      automatable: full
    - method: drc
      tool: "KiCad 自定义规则"
      check: "(rule xtal_no_signals (condition \"A.intersectsCourtyard('Y1') && !A.hasNetclass('Clock') && A.NetName != 'GND'\") (constraint disallow track via)) —— Y1 为晶振位号"
      automatable: full
  sources:
    - title: "ESP32-C3 Hardware Design Guidelines — PCB Layout Design"
      url: "https://docs.espressif.com/projects/esp-hardware-design-guidelines/en/latest/esp32c3/pcb-layout-design.html"
      publisher: "Espressif"
      kind: vendor_guide
      section: "Crystal"
    - title: "AN2867 Oscillator design guide for STM8AF/AL/S, STM32 MCUs and MPUs"
      url: "https://www.st.com/resource/en/application_note/an2867-guidelines-for-oscillator-design-on-stm8afals-and-stm32-mcusmpus-stmicroelectronics.pdf"
      publisher: "STMicroelectronics"
      kind: app_note
      section: "§7.1–7.2（Rev 13）"
  confidence: high
  applies_to: [crystal]
  conflicts: "ST AN2867 §7.1 要求晶振下有专用的局部地平面（与应用板地分开、连到最近的 MCU 地），Espressif 则要求晶振下方是整片完整 GND 平面且周围 clean ground；两者对“下方铺地”一致，差别在是否与大地分开。见 GEN-PLN-010。"

- id: GEN-RTE-014
  title: 连接器先到 TVS 再到 IC，路径短直无桩无过孔
  domain: general
  stage: routing
  severity: should
  rule: 受保护信号从连接器直接走到 TVS 保护引脚，再去被保护 IC；连接器到 TVS 之间不打过孔、不接桩线、拐角不超过 45°（优先圆弧），不让未受保护的走线紧邻这段路径；TVS 地焊盘直接接同层地铜，并在紧邻其地引脚处加过孔缝合到相邻地层。
  rationale: ESD 脉冲 di/dt 极大，路径上每一点电感都变成钳位电压的一部分；TVS 前的路径是主要辐射源，旁边的未保护线会被感应出电流而损坏器件；先到 TVS 再经过孔才能保证电流先被引向 TVS。
  verify:
    - method: geometry_script
      tool: "pcbnew"
      check: "对每个 ESD 网络：①连接器焊盘→TVS 焊盘之间过孔数 = 0 且线段无分叉；②其间拐角 ≤ 45°；③距离该路径 2 mm 内无其他网络的走线（未保护网络）；④TVS 地焊盘到最近 GND 过孔距离 ≤ 焊盘宽度（经验阈值）；通过判据：四项全满足"
      automatable: full
    - method: emc_precompliance
      tool: "ESD 枪 + 示波器"
      check: "接触放电 ±4 kV 起，对比 TVS 前后波形；受保护 IC 引脚钳位峰值 < 其绝对最大额定值"
      automatable: manual
  sources:
    - title: "ESD Protection Layout Guide (SLVA680A)"
      url: "https://www.ti.com/lit/an/slva680/slva680.pdf"
      publisher: "Texas Instruments"
      kind: app_note
      section: "§2.1–2.4"
  confidence: high
  applies_to: [connector, tvs, esd]
  parameters:
    - name: connector_to_tvs_vias
      op: "=="
      value: 0
      unit: count
      note: "SLVA680A：尽量避免；必须换层时，先到 TVS 再过孔（Case 1）"
    - name: connector_to_tvs_max_corner
      op: "<="
      value: 45
      unit: deg
      note: "SLVA680A：优先圆弧，45° 为可接受的最大角"
  tags: [cat-feeder]

- id: GEN-RTE-015
  title: 快速信号走线长度限制在约 1/50 波长以内
  domain: general
  stage: routing
  severity: consider
  rule: 无屏蔽的消费 / 汽车类 2 层板上，时钟及其他快边沿线的走线长度应小于约 1/50 波长（例如超过 4 英寸 ≈ 100 mm 的线对 FM 频段噪声就可能成为问题）；超长时缩短或加串联端接。
  rationale: 走线和环路的辐射效率随长度增大，直到 1/4 波长；对商用限值走线长于 λ/10 开始重要，对更严的车规和无屏蔽 2 层板，λ/50 就开始重要。
  verify:
    - method: geometry_script
      tool: "pcbnew"
      check: "取 Clock / PWM / 快边沿网络的走线总长，通过判据 ≤ 101.6 mm；超出的网络需登记串联端接（见 GEN-PLC-008）或豁免理由"
      automatable: full
    - method: emc_precompliance
      tool: "近场探头 + 频谱仪"
      check: "对超长线在 FM 频段（88~108 MHz）及其谐波做扫描，通过判据：低于目标限值"
      automatable: manual
  sources:
    - title: "PCB Design Guidelines For Reduced EMI (SZZA009)"
      url: "https://www.ti.com/lit/an/szza009/szza009.pdf"
      publisher: "Texas Instruments"
      kind: app_note
      section: "§1.4.1 Proportionality of Loops and Dipoles; §2.4.2 Antenna Factor Length Rules"
  confidence: high
  applies_to: [mcu_board, 2_layer]
  parameters:
    - name: fast_trace_max_length
      op: "<="
      value: 101.6
      unit: mm
      note: "TI：消费 / 汽车类 2 层板 λ/50 起重要，对应 FM 频段超过 4 英寸的线"
  conflicts: "TI 的阈值来自 1999 年的 2 层板指南并以 FM 频段为例；FCC 用 λ/10、军标 λ/20~λ/30。不同产品应以实际 EMC 目标频段重算。"

