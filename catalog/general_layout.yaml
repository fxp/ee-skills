- id: GEN-PLN-001
  title: 先保证完整地平面，地层不走线、不被过孔排切成槽
  domain: general
  stage: plane_pour
  severity: should
  rule: 地参考层（4 层板的 L2，2 层板的底层）除不可避免的极短跳线外不走信号线；平面上的孔、反焊盘、引脚排不得连成长槽——相邻孔 / 反焊盘之间保留铜桥，必须埋线时绕板周边走或放在电源平面里。
  rationale: 平面上的缺口增大回流环路面积；一排 100 mil 间距的通孔会把平面割成槽，既增加环路又聚焦槽缝辐射。
  verify:
    - method: geometry_script
      tool: "pcbnew"
      check: "①在地参考层统计非 GND 网络的走线长度，4 层板通过判据 = 0，2 层板 ≤ 项目登记的跳线总长；②对该层所有过孔 / 通孔焊盘，计算相邻两个反焊盘（孔径 + 2×间隙）之间的铜桥宽度，通过判据 ≥ 0.3 mm（经验阈值），并检查 GND 填充多边形的最窄颈宽"
      automatable: full
    - method: drc
      tool: "KiCad 区域设置 + 自定义规则"
      check: "GND 区域的 Minimum width 设 ≥ 0.2 mm 以去掉窄颈；加 (rule no_sig_in_gnd_layer (layer In1.Cu) (condition \"A.NetName != 'GND'\") (constraint disallow track)) —— In1.Cu 为 4 层板的地层"
      automatable: full
  sources:
    - title: "PCB Design Guidelines For Reduced EMI (SZZA009)"
      url: "https://www.ti.com/lit/an/szza009/szza009.pdf"
      publisher: "Texas Instruments"
      kind: app_note
      section: "§2.1.7 Power Plane Do's and Don'ts for Four-Layer Boards, Figure 5"
    - title: "High-Speed Layout Guidelines (SCAA082A)"
      url: "https://www.ti.com/lit/pdf/scaa082"
      publisher: "Texas Instruments"
      kind: app_note
      section: "§2.5（Figure 15）"
  confidence: high
  applies_to: [4_layer, 2_layer]
  tags: [cat-feeder]

- id: GEN-PLN-002
  title: 默认用一整块地平面，靠分区而不是分割隔离模拟数字
  domain: general
  stage: plane_pour
  severity: should
  rule: 数模混合 MCU 板默认只用一个连续的地平面（GND），通过 GEN-FLR-003 的分区让数字回流不进模拟区；只有低漏电医疗设备、带大功率噪声输出的工业设备，或已经布得很差的板子才考虑分割。
  rationale: 数字回流本来就停留在数字走线正下方，不会自己跑进模拟区；分割地平面本身并不阻止回流，反而在有信号跨越时造成大环路。
  verify:
    - method: geometry_script
      tool: "pcbnew"
      check: "统计每个铜层上名为 GND / AGND / DGND 的区域数量与是否互相断开，通过判据：每层地区域只有 1 块连通体（允许因为走线造成的次要岛状碎片，另见 GEN-PLN-007）"
      automatable: full
    - method: bench
      tool: "示波器 + 近场探头"
      check: "Ott 的对比实验：先留出连接两块地的位置（约每 1/2 英寸一个 0 Ω 电阻），先断开后连接，比较 ADC 噪声与 EMC，预期连接后更好"
      automatable: manual
  sources:
    - title: "Partitioning and Layout of a Mixed-Signal PCB (H. Ott)"
      url: "https://www.edn.com/partitioning-and-layout-of-a-mixed-signal-pcb-3/"
      publisher: "EDN / Printed Circuit Design"
      kind: paper
    - title: "High-Speed Layout Guidelines (SCAA082A)"
      url: "https://www.ti.com/lit/pdf/scaa082"
      publisher: "Texas Instruments"
      kind: app_note
      section: "§2.3 Power and Ground Planes, Figure 9"
    - title: "Grounding Analog-Digital Converters (J. Bryant, ADI lecture, mirror)"
      url: "http://www.hit.bme.hu/~papay/edu/Acrobat/GndADCs.pdf"
      publisher: "Analog Devices"
      kind: app_note
  confidence: high
  applies_to: [mixed_signal, mcu_board]
  conflicts: "分歧：Ott 认为“几乎总是只用单一参考平面更好”，仅在三种场合考虑分割；TI SCAA082A 说数据转换器厂商常建议分开模拟地和数字地，但自己倾向连续平面（分割时要满足 GEN-PLN-003）；ADI Bryant 讲义写道混合信号系统常有分开的模拟 / 数字地平面，在靠近电源处的星形点汇合，但转换器的 AGND 和 DGND 引脚应一起接到模拟地平面（耗流小于 30 mA 或不含大计算的器件），大 DSP 带编解码器是例外（DGND 瞬态 > 100 mA）。三者并不矛盾：关键是不让数字回流进模拟区。本板的 MCU + HX711 模块 + 电机，采用单一地平面 + 分区 + 大电流回流单点（GEN-FLR-004）。"
  tags: [cat-feeder]

- id: GEN-PLN-003
  title: 必须分割地时，只在一点连接，信号只能走桥
  domain: general
  stage: plane_pour
  severity: should
  rule: 确需分割地时：两块地只在一个位置连接（桥），所有跨区信号都从桥上方经过，使每条线下方都有回流；每个子系统的回流不流经另一个子系统；电源平面只参考自己的地，不与别的地重叠；不在电源平面与无关的地之间接旁路电容。
  rationale: 多点连接形成地环路并增加辐射；信号越过缺口则回流绕远路，形成大环路并把噪声串入另一个地。
  verify:
    - method: geometry_script
      tool: "pcbnew"
      check: "①两地之间的连接点（0 Ω / 磁珠 / 铜桥）数 = 1；②所有跨越两地边界的信号走线段的中点都落在桥的 ±(桥宽/2) 范围内；③每个电源平面的投影与其他地平面的重叠面积 = 0；④检查旁路电容两端是否在同一地域内。通过判据：①~④全部满足"
      automatable: partial
    - method: erc
      tool: "KiCad ERC 与网络类检查"
      check: "原理图中 AGND / DGND 之间只有一个连接元件（0 Ω 或磁珠或网络标签）；旁路电容的 GND 引脚与其所在电源同域"
      automatable: partial
  sources:
    - title: "Partitioning and Layout of a Mixed-Signal PCB (H. Ott)"
      url: "https://www.edn.com/partitioning-and-layout-of-a-mixed-signal-pcb-3/"
      publisher: "EDN / Printed Circuit Design"
      kind: paper
    - title: "High-Speed Layout Guidelines (SCAA082A)"
      url: "https://www.ti.com/lit/pdf/scaa082"
      publisher: "Texas Instruments"
