- id: GEN-RTE-001
  title: 每条信号线下方保持连续的回流参考铜
  domain: general
  stage: routing
  severity: should
  rule: 对时钟、PWM、SPI、开关节点等快边沿信号，沿整条走线在其正下方（相邻层）保持连续的 GND（或 PWR）铜，参考铜向走线两侧至少延伸 2h、推荐 5h（h 为走线到参考平面的介质厚度）。
  rationale: 高频回流走阻抗最低路径，即信号线正下方的平面；回流电流分布在走线两侧，约 70% 在 ±2h 内，87% 在 ±5h 内，94% 在 ±10h 内。回流被切断就必须绕行，形成大环路，辐射与串扰随环路面积增大。
  verify:
    - method: geometry_script
      tool: "pcbnew：取参考层 zone 填充多边形（zone.GetFilledPolysList）"
      check: "对 Clock / PWM / 高速网络的每个走线段每 0.5 mm 取采样点，在其参考层（2 层板为对面铜层；多层板为相邻平面层）查点是否落在 GND 填充内，且以采样点为中心 ±2h 范围的填充覆盖率 ≥ 90%；通过判据：违规采样点占比 ≤ 5%（占比阈值为经验值）。h 取叠层介质厚度（JLC 1.6 mm 2 层板约 1.5 mm）"
      automatable: full
    - method: emc_precompliance
      tool: "近场磁场探头 + 频谱仪"
      check: "沿时钟 / PWM 走线扫描磁场，回流不连续处（跨槽、过孔处）出现的局部强点即问题位置；整改前后对比降低量 ≥ 6 dB 视为有效（经验判据）"
      automatable: manual
  sources:
    - title: "Partitioning and Layout of a Mixed-Signal PCB (H. Ott)"
      url: "https://www.edn.com/partitioning-and-layout-of-a-mixed-signal-pcb-3/"
      publisher: "EDN / Printed Circuit Design"
      kind: paper
      section: "return-current distribution (x/h table)"
    - title: "High-Speed Layout Guidelines (SCAA082A)"
      url: "https://www.ti.com/lit/pdf/scaa082"
      publisher: "Texas Instruments"
      kind: app_note
      section: "§1.6 Return Current and Loop Areas"
    - title: "PCB Design Guidelines For Reduced EMI (SZZA009)"
      url: "https://www.ti.com/lit/an/szza009/szza009.pdf"
      publisher: "Texas Instruments"
      kind: app_note
      section: "§1.4 Basic Loops; §2.1.4 Signal Return Grounds"
  confidence: high
  applies_to: [2_layer, 4_layer]
  parameters:
    - name: return_plane_margin_70pct
      op: ">="
      value: 2
      unit: "multiple of h"
      note: "Ott：x/h=2 时约 70% 回流在 ±x 内"
    - name: return_plane_margin_87pct
