- id: GEN-PLC-009
  title: ESD / TVS 器件紧靠连接器，保护对象放得更远
  domain: general
  stage: placement
  severity: should
  rule: TVS / ESD 阵列放在设计规则允许的最靠近连接器处，被保护的 IC 离 TVS 比 TVS 离连接器远得多；信号线先到 TVS 保护引脚、再去 IC。
  rationale: ESD 电流 di/dt 极大（8 kV 接触放电约 30 A / 0.8 ns），每 0.25 nH 电感就多出约 10 V；让连接器到 TVS 的电感远小于 TVS 到 IC 的电感，电流自然被引向 TVS，也把辐射限制在连接器附近。
  verify:
    - method: geometry_script
      tool: "pcbnew"
      check: "对每个被 TVS 保护的连接器信号，量 d1 = 连接器焊盘到 TVS 信号焊盘距离，d2 = TVS 信号焊盘到被保护 IC 引脚距离；通过判据：d1 ≤ 项目设定值（建议 ≤ 5 mm，经验阈值）且 d2 ≥ 3×d1（比例为经验阈值，SLVA680 只要求 d2 远大于 d1）"
      automatable: full
    - method: emc_precompliance
      tool: "ESD 模拟枪（IEC 61000-4-2），示波器 / 电流靶"
      check: "对连接器接触放电 ±4 kV 起逐级测试，观察受保护引脚的钳位波形与系统是否复位 / 损坏；通过判据：系统无损坏，钳位尖峰 < IC 引脚绝对最大额定值"
      automatable: manual
  sources:
    - title: "ESD Protection Layout Guide (SLVA680A)"
      url: "https://www.ti.com/lit/an/slva680/slva680.pdf"
      publisher: "Texas Instruments"
      kind: app_note
      section: "§2.1 Optimizing Impedance for Dissipating ESD"
  confidence: high
  applies_to: [connector, tvs, esd]
  parameters:
    - name: tvs_to_connector_distance
      op: minimize
      value: null
      unit: mm
      note: "SLVA680A：尽可能近；0.25 nH 约 10 V（8 kV IEC 61000-4-2：30 A / 0.8 ns）"
  conflicts: "EMC / ESD 文件会写更详细的规则；本条只覆盖通用 MCU 板的布局基线。"
  tags: [cat-feeder]

