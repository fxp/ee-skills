# ───────────────────────── routing ─────────────────────────
- id: DFM-RTE-001
  title: 片式元件两端的铜连接要热平衡
  domain: dfm
  stage: routing
  severity: should
  rule: 0402/0603 等小片式元件，两个焊盘的引出走线宽度一致；不要把一个焊盘直接并入大面积铜皮（必须并入时用热焊盘 / 花焊盘），也不要只在一个焊盘上放过孔。
  rationale: 一端接大铜皮而另一端接细线时，细线端先到熔点，表面张力把元件拉起（立碑）；元件越小越轻，越容易发生。
  applies_to: [chip-resistor, chip-capacitor, "0402", "0603"]
  verify:
    - method: geometry_script
      tool: "pcbnew Python"
      check: "对每个 2 焊盘片式封装，比较两焊盘各自连接的铜面积（走线宽度 + 直接相连的铜皮）；一端为铜皮而另一端不是且没有热焊盘的，报警；一个焊盘内有过孔而另一个没有的，报警"
      automatable: partial
    - method: drc
      tool: "KiCad 自定义规则 zone_connection / min_resolved_spokes"
      check: "对小封装焊盘的 zone_connection 设为 thermal relief，且 min_resolved_spokes ≥ 2"
      automatable: partial
  sources:
    - {title: "PCB Tombstoning: Causes, Prevention & Fixes", url: "https://jlcpcb.com/blog/pcb-tombstone", publisher: JLCPCB, kind: vendor_guide, section: "Causes: thermal imbalance; Prevention: thermal relief, trace width"}
    - {title: "PCB Tombstoning and its Impact on PCB Assembly", url: "https://www.sierraassembly.com/blog/tombstoning-in-pcbs-and-impact-on-pcb-assembly/", publisher: "Sierra Assembly", kind: blog}
  confidence: medium
  conflicts: "与热设计冲突：大功率路径需要焊盘与铜皮实连以散热（见 thermal 库）。取舍：信号 / 小电流的片式元件用热焊盘，功率散热焊盘实连并评估立碑风险。"
  tags: [cat-feeder]

- id: DFM-RTE-002
  title: 2 层板不要在 SMD 焊盘里放开口过孔
  domain: dfm
  stage: routing
  severity: must
  rule: 焊盘内（除 QFN 等散热焊盘内按设计放置的小孔外）不放开口过孔；确需过焊盘孔时，用环氧或铜浆填平并电镀盖帽（IPC-4761 Type VII）；JLC 能力页只写 6 层及以上默认提供，设计规则博客把 1–2 层标为不支持，所以 2 层板按不可用处理，改为从焊盘引出过孔。
  rationale: 开口过孔会把焊料吸走，造成虚焊或焊点空洞；油墨塞孔对焊盘内的孔做不了，盖油过孔又不适合焊盘上的有源过孔。
  applies_to: [2-layer, jlc-pcb, via-in-pad]
  verify:
    - method: geometry_script
      tool: "pcbnew Python"
      check: "遍历所有过孔，检查中心是否落在任一 SMD 焊盘轮廓内（除白名单：QFN 等散热焊盘）；命中则失败"
      automatable: full
    - method: drc
      tool: "KiCad 自定义规则：对 via 与 SMD pad 的 physical_clearance / 条件表达式"
      check: "用条件表达式使焊盘内的过孔报错"
      automatable: partial
  sources:
    - {title: "Via Covering: Tented, Untented, Plugged, Epoxy-Filled and Copper-epoxy-filled", url: "https://jlcpcb.com/help/article/pcb-via-covering", publisher: JLCPCB, kind: vendor_guide, section: "Notes: holes in pad / vias < 0.35 mm from a pad cannot be ink-plugged, use epoxy or copper"}
    - {title: "PCB Design Rules and Guidelines: A Complete Best Practices Guide", url: "https://jlcpcb.com/blog/pcb-design-rules-best-practices", publisher: JLCPCB, kind: vendor_guide, section: "DFM and DFA: capability table (Via-in-Pad row: 1-2 layer Not Supported)"}
    - {title: "Via hole protection", url: "https://www.ncabgroup.com/blog/via-hole-protection/", publisher: NCAB, kind: blog}
    - {title: "SLUA271 QFN and SON PCB Attachment", url: "https://www.ti.com/lit/an/slua271d/slua271d.pdf", publisher: "Texas Instruments", kind: app_note, section: "§3.4.1 Thermal Pad Via Design"}
    - {title: "JLCPCB PCB Capabilities", url: "https://jlcpcb.com/capabilities/pcb-capabilities", publisher: JLCPCB, kind: vendor_guide, section: "Vias: via-in-pad"}
  confidence: medium
  conflicts: "JLC 能力页写 via-in-pad（环氧 / 铜浆填充并盖帽）6 层及以上默认提供；博客《PCB Design Rules and Guidelines》（页面标 2026-09-07）的能力表把 1–2 层标为不支持。via covering 帮助页没有按层数区分，只说焊盘内的孔不能用油墨塞，可用环氧或铜浆。2 层板是否可选填平盖帽要在下单页确认，本规则保守按不可用处理。"
  tags: [cat-feeder]

- id: DFM-RTE-003
  title: QFN 1 脚旁保留走线与过孔禁区
  domain: dfm
  stage: routing
  severity: should
  rule: 所有 QFN 封装的 1 脚附近保留走线与过孔禁区，不要在封装下方 1 脚区域放过孔。
  rationale: 部分 QFN 的 1 脚在封装底部有外露金属特征，若下方有过孔会短路；保留禁区也让更换供应商时封装更宽容。
  applies_to: [qfn]
  verify:
    - method: review
      tool: "布局评审，对照 TI SLUA271 Figure 3-5"
      check: "每个 QFN 的 1 脚区域内没有过孔与非本脚走线"
      automatable: manual
  sources:
    - {title: "SLUA271 QFN and SON PCB Attachment", url: "https://www.ti.com/lit/an/slua271d/slua271d.pdf", publisher: "Texas Instruments", kind: app_note, section: "§3.5 Solder Mask"}
  confidence: medium

- id: DFM-RTE-004
  title: 过孔覆盖方式与孔径、间距要匹配
  domain: dfm
  stage: routing
  severity: should
  rule: 盖油（tented）过孔孔径理想 ≤ 0.4 mm、最大 0.5 mm；塞孔 / 填孔过孔孔径 ≤ 0.5 mm；喷锡面的开窗（untented）过孔与其它裸铜至少 0.2 mm（更小用沉金）；离通孔焊盘不足 0.35 mm 的过孔无法油墨塞孔。
  rationale: 孔太大盖不住或填不满，且板厂对此类投诉不予受理；开窗过孔离裸铜太近喷锡后会桥连。
  applies_to: [jlc-pcb, via]
  parameters:
    - {name: tented_via_drill_ideal, op: "<=", value: 0.4, unit: mm}
    - {name: tented_via_drill_max, op: "<=", value: 0.5, unit: mm}
    - {name: plugged_or_filled_via_drill_max, op: "<=", value: 0.5, unit: mm}
    - {name: untented_via_to_exposed_copper_hasl, op: ">=", value: 0.2, unit: mm}
    - {name: ink_plug_via_to_th_pad_min, op: ">=", value: 0.35, unit: mm}
  verify:
    - method: drc
      tool: "KiCad DRC hole_size / 自定义规则 via_diameter"
      check: "所有过孔钻孔 ≤ 0.4 mm（盖油），超过 0.5 mm 的过孔列表为零；untented 过孔到其它裸铜的距离 ≥ 0.2 mm"
      automatable: full
  sources:
    - {title: "Via Covering: Tented, Untented, Plugged, Epoxy-Filled and Copper-epoxy-filled", url: "https://jlcpcb.com/help/article/pcb-via-covering", publisher: JLCPCB, kind: vendor_guide, section: "Hole size limits; Clearances and spacing"}
    - {title: "JLCPCB PCB Capabilities", url: "https://jlcpcb.com/capabilities/pcb-capabilities", publisher: JLCPCB, kind: vendor_guide, section: "Vias: plugged vias"}
  confidence: high
  tags: [cat-feeder]

# ───────────────────────── plane_pour ─────────────────────────
- id: DFM-PLN-001
  title: 铜皮与走线到板边、V-cut 线的距离
  domain: dfm
  stage: plane_pour
  severity: must
  rule: 铜（含铺铜）距铣边 / 铣槽 ≥ 0.2 mm；距 V-cut 中心线 ≥ 0.4 mm（推荐 1.0 mm）；邮票孔拼板中非邮票孔的边同为 ≥ 0.2 mm。
  rationale: 铣刀和 V-cut 刀有位置公差，铜太近会被切到露铜、翘边或短路。
  applies_to: [jlc-pcb, zone]
  parameters:
    - {name: copper_to_routed_edge, op: ">=", value: 0.2, unit: mm}
    - {name: copper_to_vcut_centerline, op: ">=", value: 0.4, unit: mm, note: "推荐 1.0 mm"}
  verify:
    - method: drc
      tool: "KiCad DRC：copper_edge_clearance，自定义约束 edge_clearance"
      check: "全局 Board Setup 的 Copper to edge clearance ≥ 0.2 mm（V-cut 板 ≥ 0.4 mm）；零违规"
      automatable: full
  sources:
    - {title: "JLCPCB PCB Capabilities", url: "https://jlcpcb.com/capabilities/pcb-capabilities", publisher: JLCPCB, kind: vendor_guide, section: "Board Outline and Routing; V-Cut; Mouse Bite Panelization"}
    - {title: "Technical Guidance: V-Cut Panelization Standards", url: "https://jlcpcb.com/blog/v-cut-panelization-standards", publisher: JLCPCB, kind: vendor_guide}
  confidence: high
  tags: [cat-feeder]

- id: DFM-PLN-002
  title: 铺铜上的焊盘用热焊盘，散热焊盘除外
  domain: dfm
  stage: plane_pour
  severity: should
  rule: 通孔焊盘和需要手工焊接 / 易立碑的焊盘连接铜皮时使用热焊盘（花焊盘）；承担散热的焊盘（如散热焊盘上的过孔）则实连，不用热焊盘。
  rationale: 铜皮会把焊盘热量带走，造成冷焊或两端受热不均；而散热路径上用热焊盘会显著增加热阻。
  applies_to: [zone, thermal-relief, through-hole]
  verify:
    - method: drc
      tool: "KiCad 自定义规则 zone_connection、thermal_spoke_width、min_resolved_spokes"
      check: "通孔焊盘、片式焊盘 zone_connection = thermal relief，至少 2 根有效辐条；散热焊盘上过孔 zone_connection = solid"
      automatable: partial
  sources:
    - {title: "A Comprehensive Guide for Optimal Results (JLCPCB PCB design rules)", url: "https://jlcpcb.com/blog/a-comprehensive-guide-for-optimal-results", publisher: JLCPCB, kind: vendor_guide, section: "Non-numeric DFM guidance: thermal pads"}
    - {title: "PowerPAD Thermally Enhanced Package", url: "https://www.ti.com/lit/an/slma002h/slma002h.pdf", publisher: "Texas Instruments", kind: app_note, section: "§2.4 Thermal Vias"}
  confidence: medium
  conflicts: "焊接性（热焊盘）与散热（实连）互相冲突：JLC 建议散热焊盘用铜皮 + 过孔阵列并考虑热焊盘改善可焊性；TI 明确说散热过孔不要用热焊盘。取舍：散热过孔 / 散热焊盘实连，其余焊盘用热焊盘。"

# ───────────────────────── manufacturing ─────────────────────────
- id: DFM-MFG-001
  title: Gerber 输出集合完整、带 X2 属性、单位为 mm
  domain: dfm
  stage: manufacturing
  severity: must
  rule: 出图含铜层、阻焊、丝印、Edge.Cuts（板框，单独文件、闭合轮廓），贴片订单加焊膏层；开启 X2 扩展格式与网络属性，坐标用 mm 且小数位 ≥ 5（KiCad 默认 4.6）；全部文件同一原点、1:1、不镜像；用单个 zip 打包（JLCPCB 的 KiCad 9 出图指南写上传只接受 .zip 或 .rar，不接受 7z 等其他格式）；出图前重新填充所有铺铜。
  rationale: Gerber 规范要求制造数据集必须有 FileFunction 与 FilePolarity 属性和独立的板框文件；层数错位、缺层、旧铺铜会直接导致板厂做错板或拒单。
  applies_to: [gerber, kicad]
  parameters:
    - {name: gerber_mm_decimals, op: ">=", value: 5, unit: digits, note: "Ucamco 规定 mm 单位至少 5 位小数，推荐 6 位；KiCad 默认 4.6"}
  verify:
    - method: geometry_script
      tool: "Python 解析 Gerber 文件头（或 gerbonara / pygerber）"
      check: "每个文件有 %TF.FileFunction 与 %TF.FilePolarity；存在 FileFunction=Profile 的文件且为闭合轮廓；MO 为 MM，FS 小数位 ≥ 5；所有文件原点一致；层数与板子叠层一致；zip 内无嵌套目录"
      automatable: full
    - method: review
      tool: "KiCad 绘图对话框设置"
      check: "「Check zone fills before plotting」勾选；不画钻孔标记；缩放 1:1；使用 X2 格式并包含网络属性"
      automatable: manual
  sources:
    - {title: "The Gerber File Format Specification, Revision 2020.09", url: "https://www.ucamco.com/files/downloads/file_en/399/the-gerber-file-format-specification-revision-2020-09_en.pdf", publisher: Ucamco, kind: standard, section: "§4.1 FS/MO; §5 attributes; §6 PCB Fabrication Data"}
    - {title: "How to Generate Gerber and Drill Files From KiCad 9", url: "https://jlcpcb.com/help/article/how-to-generate-gerber-and-drill-files-in-kicad-9", publisher: JLCPCB, kind: vendor_guide}
  confidence: high
  tags: [cat-feeder]

- id: DFM-MFG-002
  title: 钻孔文件按 PTH / NPTH 分开并用成品孔径
  domain: dfm
  stage: manufacturing
  severity: must
  rule: 钻孔文件用 Excellon，mm 单位、十进制零，原点为绝对坐标；金属化（PTH）和非金属化（NPTH）分两个文件；孔径是电镀后的成品孔径；长圆孔使用「alternate drill mode」。
  rationale: Gerber 规范要求 PTH 与 NPTH 分开，钻孔图像表示成品孔径；混在一起或孔径当作钻头径，会让孔径偏小或把安装孔金属化。
  applies_to: [drill, kicad]
  verify:
    - method: geometry_script
      tool: "Python 解析 Excellon / 读文件名"
      check: "存在 *-PTH.drl 与 *-NPTH.drl 两个文件；单位 METRIC；孔径集合与 .kicad_pcb 里焊盘 / 过孔的成品孔径一致"
      automatable: full
  sources:
    - {title: "How to Generate Gerber and Drill Files From KiCad 9", url: "https://jlcpcb.com/help/article/how-to-generate-gerber-and-drill-files-in-kicad-9", publisher: JLCPCB, kind: vendor_guide, section: "Excellon drill options"}
    - {title: "The Gerber File Format Specification, Revision 2020.09", url: "https://www.ucamco.com/files/downloads/file_en/399/the-gerber-file-format-specification-revision-2020-09_en.pdf", publisher: Ucamco, kind: standard, section: "§6.1.6 Drill/rout files"}
  confidence: high
  tags: [cat-feeder]

- id: DFM-MFG-003
  title: BOM 文件格式与内容
  domain: dfm
  stage: manufacturing
  severity: must
  rule: BOM 至少含 Comment、Designator、Footprint 三列并加 LCSC Part # 列，文件为 csv / xls / xlsx；同一种零件一行，位号用逗号拼接；只包含要贴的零件；位号用大写，不靠大小写区分。
  rationale: JLC 按这些列做零件匹配，只有匹配到的才会被贴；多余或缺失的行会让订单卡在人工确认。
  applies_to: [jlc-smt]
  verify:
    - method: bom_check
      tool: "自写脚本读 bom.csv"
      check: "表头恰好含 Comment、Designator、Footprint、LCSC Part #；每行 LCSC 料号匹配 ^C[0-9]+$；位号无重复、全大写；不含 DNP 零件"
      automatable: full
  sources:
    - {title: "Bill of Materials (BOM) File for PCB Assembly", url: "https://jlcpcb.com/help/article/bill-of-materials-for-pcb-assembly", publisher: JLCPCB, kind: vendor_guide}
    - {title: "How To Export BOM and CPL Files From KiCad", url: "https://jlcpcb.com/help/article/how-to-generate-the-bom-and-centroid-file-from-kicad", publisher: JLCPCB, kind: vendor_guide}
    - {ref: "作者首单 JLC SMT 的实测记录（2026-10-19，未公开笔记）", title: "作者 SMT 实测：Excel 表头行被当作一个器件", publisher: "作者实测", kind: blog}
  confidence: medium
  tags: [cat-feeder]

- id: DFM-MFG-004
  title: CPL 坐标文件的列、单位与方向
  domain: dfm
  stage: manufacturing
  severity: must
  rule: CPL 列为 Designator、Mid X、Mid Y、Layer（Top / Bottom）、Rotation；坐标单位为 mm，旋转角为度、逆时针为正；坐标原点和 Y 方向要与 JLC 一致（作者实测过：原点在板左下角、+Y 向上，KiCad 的 Y 向下需翻转）。
  rationale: JLC 只规定列、单位和旋转方向，原点未明文规定；原点或 Y 方向错误会让所有元件整体偏移或镜像，而 DRC 看不出来。
  applies_to: [jlc-smt, cpl]
  verify:
    - method: geometry_script
      tool: "自写脚本：由 .kicad_pcb 重新生成期望 CPL 并与 positions.csv 逐行对比"
      check: "同一位号的 X、Y 差 ≤ 0.01 mm，旋转差 0（mod 360），层一致"
      automatable: full
  sources:
    - {title: "Pick & Place File for PCB Assembly", url: "https://jlcpcb.com/help/article/pick-place-file-for-pcb-assembly", publisher: JLCPCB, kind: vendor_guide}
    - {ref: "作者首单 JLC SMT 的实测记录（2026-10-19，未公开笔记）", title: "作者 SMT 实测：CPL 原点与 Y 方向", publisher: "作者实测", kind: blog}
  confidence: medium
  conflicts: "JLC 的 CPL 页面未规定原点与 Y 方向；这里的原点约定来自作者第一次真实 SMT 下单的实测，不是 JLC 的公开规则。"
  tags: [cat-feeder]

- id: DFM-MFG-005
  title: 逐个核对 JLC 库与 KiCad 封装的旋转差
  domain: dfm
  stage: manufacturing
  severity: must
  rule: JLC 库里部分封装的零度方向与 KiCad 不同，CPL 要加按封装的旋转偏移；用 Fabrication Toolkit 的旋转表或自己的偏移表，并在 JLC BOM 匹配页的放置预览里逐一核对所有有极性 / 方向的器件（1 脚、阴极、天线端）。
  rationale: 旋转错误对 DRC 不可见，贴出来的整批板都是反的；JLC 提供的预览是下单前唯一的拦截点。
  applies_to: [jlc-smt, cpl, polarized]
  parameters:
    - {name: sot23_sot223_rotation_offset, op: "==", value: 180, unit: deg, note: "作者实测：JLC 库的 SOT-23（3 脚）与 SOT-223 与 KiCad 差 180°；其它封装未验证"}
  verify:
    - method: review
      tool: "JLC BOM 匹配页的 2D / 3D 放置预览"
      check: "点开每个有方向的位号，对照 1 脚圆点、+/− 标记、模块天线方向，与 KiCad 3D 视图一致；发现反的就调整偏移并重新生成 CPL"
      automatable: manual
    - method: bom_check
      tool: "自写脚本读 CPL 与偏移表"
      check: "每个封装类别在偏移表中有明确条目（0 也要显式写出）；没有条目的封装类别被列出供人工核对"
      automatable: partial
  sources:
    - {title: "Fabrication Toolkit (JLCPCB plugin for KiCad)", url: "https://github.com/bennymeg/Fabrication-Toolkit", publisher: "bennymeg (GitHub)", kind: tool_doc, section: "Rotation and position corrections"}
    - {title: "How To Export BOM and CPL Files From KiCad", url: "https://jlcpcb.com/help/article/how-to-generate-the-bom-and-centroid-file-from-kicad", publisher: JLCPCB, kind: vendor_guide, section: "Apply automatic component translations"}
    - {ref: "作者首单 JLC SMT 的实测记录（2026-10-19，未公开笔记）", title: "作者 SMT 实测：SOT-23 / SOT-223 需 +180°", publisher: "作者实测", kind: blog}
  confidence: medium
  tags: [cat-feeder]

- id: DFM-MFG-006
  title: 不贴的零件和通孔件同时移出 BOM 与 CPL
  domain: dfm
  stage: manufacturing
  severity: should
  rule: 不让 JLC 贴的零件（DNP、排针、需要自己焊的通孔件）不放进 BOM 和 CPL；要 JLC 手工焊的通孔件在零件库里选「波峰焊 / 手工」类并接受额外费用与工期；未选用的通孔焊盘会被保护，保持开孔供后焊。
  rationale: JLC 只贴匹配到的 BOM 行；通孔件手工焊要加人工费和工期，且被误当 SMD 贴会报「不可贴」异常。
  applies_to: [jlc-smt, through-hole, dnp]
  parameters:
    - {name: hand_solder_fee_per_order, op: "==", value: 3.5, unit: USD, note: "手工焊人工费（FAQ），另按焊点收费约 0.0173 USD / 点，工期 +1 天"}
  verify:
    - method: bom_check
      tool: "自写脚本"
      check: "原理图中 DNP / 通孔手焊标记的位号既不在 BOM 也不在 CPL 中；订单备注里列出这些位号及后续处理"
      automatable: full
  sources:
    - {title: "PCB Assembly FAQs", url: "https://jlcpcb.com/help/article/pcb-assembly-faqs", publisher: JLCPCB, kind: vendor_guide, section: "Through-hole components; BOM and CPL requirements"}
    - {title: "PCB Assembly Capabilities", url: "https://jlcpcb.com/capabilities/pcb-assembly-capabilities", publisher: JLCPCB, kind: vendor_guide, section: "Through-Hole and Manual Work"}
