- id: DFM-MFG-007
  title: 丝印文字与线宽达到可制造下限
  domain: dfm
  stage: manufacturing
  severity: should
  rule: 丝印字高 ≥ 1.0 mm（高精度字体下限 0.8 mm）、线宽 ≥ 0.15 mm（推荐 ≥ 0.2 mm）、宽高比约 1:6；镂空字体笔画 ≥ 0.2 mm、字高 ≥ 1.5 mm；字符间距 ≥ 0.15 mm（推荐 ≥ 0.2 mm）。需要的位号、极性标记、板名与版本号都用这个尺寸以上。
  rationale: 低于下限的笔画会模糊、断笔或丢失；极性标记一旦丢失，人工返修和目检都会出错。
  applies_to: [silkscreen, jlc-pcb]
  parameters:
    - {name: silk_text_height_min, op: ">=", value: 1.0, unit: mm, note: "高精度字体可到 0.8 mm"}
    - {name: silk_line_width_min, op: ">=", value: 0.15, unit: mm, note: "推荐 ≥ 0.2 mm"}
    - {name: silk_char_gap_min, op: ">=", value: 0.15, unit: mm}
    - {name: silk_hollow_font_stroke_min, op: ">=", value: 0.2, unit: mm}
  verify:
    - method: drc
      tool: "KiCad DRC 约束 text_height、text_thickness"
      check: "text_height min 1.0 mm、text_thickness min 0.15 mm，针对 F.Silkscreen / B.Silkscreen，零违规"
      automatable: full
  sources:
    - {title: "Technical Guidance: Character Design Specifications", url: "https://jlcpcb.com/blog/character-design-specifications", publisher: JLCPCB, kind: vendor_guide}
    - {title: "JLCPCB PCB Capabilities", url: "https://jlcpcb.com/capabilities/pcb-capabilities", publisher: JLCPCB, kind: vendor_guide, section: "Silkscreen (Legend)"}
  confidence: high
  tags: [cat-feeder]

- id: DFM-MFG-008
  title: 为序列号 / 二维码预留位置，不再用 JLCJLCJLCJLC
  domain: dfm
  stage: manufacturing
  severity: consider
  rule: 不要在丝印层加「JLCJLCJLCJLC」来指定订单号位置；需要序列号或二维码时，选「指定位置」并在丝印层放一个等大的实心方块（二维码 5×5 / 8×8 / 10×10 mm，仅编号 2×10 mm），远离走线、孔和其它丝印；不指定则放在空白处，空间不够可能打不上。板名、版本号、日期码自己放在丝印里。
  rationale: JLC 帮助页明确说订单号标记方式已变，旧的文字占位法不再适用；没有对应实心方块时，二维码 / 序列号不会出现在指定位置。
  applies_to: [jlc-pcb, silkscreen, labelling]
  parameters:
    - {name: qr_square_sizes, op: qualitative, value: null, note: "5×5、8×8 或 10×10 mm，方块要与所选二维码大小一致"}
    - {name: serial_number_square, op: qualitative, value: null, note: "仅编号：2×10 mm 实心方块"}
  verify:
    - method: review
      tool: "板文件丝印层 + JLC 下单页「指定位置」选项"
      check: "丝印层存在尺寸匹配的实心方块；周围无走线 / 孔；丝印里有板名 + 版本号 + 日期"
      automatable: manual
  sources:
    - {title: "How to remove order number from your PCB?", url: "https://jlcpcb.com/help/article/how-to-mark-on-pcb", publisher: JLCPCB, kind: vendor_guide}
  confidence: medium
  conflicts: "网上论坛和旧文章仍写用「JLCJLCJLCJLC」占位；JLC 当前帮助页明确要求不要添加。取官方帮助页。"
  tags: [cat-feeder]

- id: DFM-MFG-009
  title: 测试点的尺寸、间距与可达性
  domain: dfm
  stage: manufacturing
  severity: consider
  rule: 要做探针测试（飞针 / 针床）的板，信号测试点焊盘直径 ≥ 0.8 mm（推荐 1.0–1.27 mm）、电源 / 地 ≥ 1.0 mm（推荐 1.5–2.0 mm），中心距 ≥ 1.27 mm（推荐 2.54 mm），到元件本体 ≥ 0.5 mm（推荐 1.0 mm）、到高于 6.4 mm 的元件 ≥ 2.0 mm、到板边 ≥ 3.2 mm，全部放在同一面，焊盘开阻焊窗，丝印不压焊盘。
  rationale: 探针需要足够的接触面积与机械余量；双面针床夹具昂贵，低于 100 mil 间距要用导向板；测试点被阻焊盖住或丝印覆盖则无法探到。
  applies_to: [test-point, ict, flying-probe]
  parameters:
    - {name: tp_pad_diameter_signal_min, op: ">=", value: 0.8, unit: mm, note: "推荐 1.0–1.27 mm"}
    - {name: tp_pad_diameter_power_min, op: ">=", value: 1.0, unit: mm, note: "推荐 1.5–2.0 mm"}
    - {name: tp_center_pitch_min, op: ">=", value: 1.27, unit: mm, note: "推荐 2.54 mm"}
    - {name: tp_to_component_body, op: ">=", value: 0.5, unit: mm, note: "推荐 1.0 mm"}
    - {name: tp_to_tall_component, op: ">=", value: 2.0, unit: mm, note: "元件高度 > 6.4 mm；推荐 5.0 mm"}
    - {name: tp_to_board_edge, op: ">=", value: 3.2, unit: mm, note: "推荐 3.8 mm"}
  verify:
    - method: geometry_script
      tool: "pcbnew Python 读测试点封装（名称含 TP）"
      check: "焊盘直径、两两中心距、到最近元件本体 / 板边距离满足上述阈值；所有测试点在同一铜层；焊盘存在阻焊开口（无阻焊覆盖）"
      automatable: full
  sources:
    - {title: "Maximizing PCB Reliability with Test Points & DFT Guide", url: "https://jlcpcb.com/blog/pcb-test-points-and-smart-dft", publisher: JLCPCB, kind: vendor_guide}
  confidence: medium
  conflicts: "不同来源的探针净空数字差异很大（例如到元件 0.5–1.27 mm、到板边 3.0–3.8 mm）。这里取 JLC 博客的数字，该博客的数据比较系统但是营销性质的文章；量产前以夹具厂的规格为准。"
  tags: [cat-feeder]

- id: DFM-MFG-010
  title: 每个电源轨与关键信号至少有一个探测点
  domain: dfm
  stage: manufacturing
  severity: should
  rule: 每个独立的电源轨和地都要有可达的测试点（理想 ≥ 2 个）；固件下载与复位涉及的 UART TX/RX、CHIP_EN、下载脚也引出到测试焊盘；关键模拟节点（例如电流检测输出）留一个探测焊盘。
  rationale: 没有探测点，整板贴片后无法在不拆件的前提下定位电源、复位和烧录问题；多点电源 / 地用于检测接触与压降。
  applies_to: [dft, bring-up]
  verify:
    - method: netlist_diff
      tool: "自写脚本读网表"
      check: "每个电源 / 地网络至少有 1 个（推荐 2 个）TestPoint 封装；列出没有测试点的网络"
      automatable: full
    - method: review
      tool: "原理图评审"
      check: "CHIP_EN、UART0 TX/RX、GPIO9、3V3、5V、GND、电流检测输出各有测试焊盘或排针"
      automatable: manual
  sources:
    - {title: "Maximizing PCB Reliability with Test Points & DFT Guide", url: "https://jlcpcb.com/blog/pcb-test-points-and-smart-dft", publisher: JLCPCB, kind: vendor_guide, section: "Coverage"}
    - {title: "ESP32-C3 Hardware Design Guidelines: Schematic Checklist", url: "https://docs.espressif.com/projects/esp-hardware-design-guidelines/en/latest/esp32c3/schematic-checklist.html", publisher: Espressif, kind: vendor_guide, section: "UART0; CHIP_EN"}
  confidence: medium
  tags: [cat-feeder]

- id: DFM-MFG-011
  title: 细间距或需平整焊盘的器件选 ENIG / OSP
  domain: dfm
  stage: manufacturing
  severity: should
  rule: 超细间距器件（JLC 博客以 0.4 mm 间距 BGA 为例）、BGA 焊盘 0.2–0.25 mm（JLC 能力页要求 ENIG），或对 MARK 点识别要求高时，表面处理选 ENIG（或 OSP）而不是喷锡；一般标准 SMT 设计用喷锡即可（JLC 博客）。本库暂以「引脚间距 ≤ 0.5 mm」作触发线，这个阈值是经验取值，JLC 和 TI 都没有给出具体的间距数字。
  rationale: 喷锡表面呈球冠形、反光，锡膏印刷不均、相机识别也更难；ENIG / OSP 平整、低反光。
  applies_to: [fine-pitch, bga, qfn]
  parameters:
    - {name: finish_flat_pitch_threshold, op: qualitative, value: null, unit: mm, note: "出处没有给间距阈值：JLC 博客只举 0.4 mm 间距 BGA 为例，TI §3.6 只说 OSP / ENIG 可接受、要求焊盘平整；本库经验触发线为 ≤ 0.5 mm"}
    - {name: bga_pad_requires_enig_min, op: range, value: [0.2, 0.25], unit: mm, note: "JLC 能力页：BGA 焊盘直径 0.2–0.25 mm 需要 ENIG"}
  verify:
    - method: bom_check
      tool: "自写脚本读 BOM 封装库"
      check: "取全板最小引脚间距；≤ 0.5 mm（本库经验阈值）时核对订单表面处理为 ENIG 或 OSP；BGA 焊盘 0.2–0.25 mm 时必须是 ENIG"
      automatable: partial
  sources:
    - {title: "Fiducial Marks in PCB and SMT Assembly", url: "https://jlcpcb.com/blog/fiducial-marks", publisher: JLCPCB, kind: vendor_guide, section: "Surface finish"}
    - {title: "SLUA271 QFN and SON PCB Attachment", url: "https://www.ti.com/lit/an/slua271d/slua271d.pdf", publisher: "Texas Instruments", kind: app_note, section: "§3.6 Surface Finishes"}
    - {title: "JLCPCB PCB Capabilities", url: "https://jlcpcb.com/capabilities/pcb-capabilities", publisher: JLCPCB, kind: vendor_guide, section: "BGA"}
  confidence: low
  conflicts: "JLC 的 Fiducial 博客（页面标 2026-09-09 更新）只说 ENIG / OSP 适合超细间距，喷锡「对大多数标准 SMT 设计可接受」，没有给间距阈值；JLC 能力页只对 BGA 焊盘 0.2–0.25 mm 给出 ENIG 要求。≤ 0.5 mm 是本库的经验线，不是出处数值。"
  tags: [cat-feeder]

- id: DFM-MFG-012
  title: 钢网开孔：QFN 散热焊盘开窗，细间距缩小
  domain: dfm
  stage: manufacturing
  severity: should
  rule: 钢网（0.100–0.150 mm，QFN 典型 0.125 mm）上，散热焊盘的锡膏覆盖约 50–70% 并开成窗格；引脚间距 ≤ 0.5 mm 的 QFN/SON 引脚开孔可缩小约 20%；开孔面积比 ≥ 0.66、宽厚比 > 1.5。JLC 不直接用客户 Gerber 出钢网，钢网由其工程师按封装库优化，有特殊锡膏量要求要写在订单备注里。
  rationale: 1:1 的大散热焊盘锡量过多会使器件浮起、产生开路和大空洞；细间距开孔过大则桥连；面积比低于 0.66 的开孔脱模差。
  applies_to: [qfn, son, fine-pitch, stencil]
  parameters:
    - {name: ep_paste_coverage, op: range, value: [50, 70], unit: "%", note: "TI 推荐；JLC footprint 博客写 60–70% 缩减"}
    - {name: stencil_thickness, op: range, value: [0.100, 0.150], unit: mm, note: "0.5 mm 间距 QFN 典型 0.125 mm"}
    - {name: fine_pitch_aperture_reduction, op: "==", value: 20, unit: "%", note: "间距 ≤ 0.5 mm 的 QFN/SON 引脚，需关注面积比"}
    - {name: stencil_area_ratio_min, op: ">=", value: 0.66, unit: ratio, note: "更低需电铸（nickel formed）钢网，TI 称实验到 0.57"}
    - {name: stencil_aspect_ratio_min, op: ">", value: 1.5, unit: ratio, note: "孔宽 / 钢网厚度，IPC-7525"}
  verify:
    - method: geometry_script
      tool: "pcbnew Python 读 F.Paste 开孔"
      check: "对每个带散热焊盘的封装，计算 F.Paste 开孔总面积 / 散热焊盘面积，落在 50–70%；对间距 ≤ 0.5 mm 的引脚开孔，按钢网厚度算面积比 ≥ 0.66"
      automatable: partial
    - method: review
      tool: "JLC 订单备注与 SMT 工程确认"
      check: "特殊锡膏量或阶梯钢网需求已在订单备注写明"
      automatable: manual
  sources:
    - {title: "SLUA271 QFN and SON PCB Attachment", url: "https://www.ti.com/lit/an/slua271d/slua271d.pdf", publisher: "Texas Instruments", kind: app_note, section: "§4.2–4.4"}
    - {title: "How Is SMT Stencil Data Prepared for JLCPCB SMT Orders?", url: "https://jlcpcb.com/help/article/smt-stencil-data-prepared-for-smt-orders", publisher: JLCPCB, kind: vendor_guide}
    - {title: "Mastering PCB Footprints: Design Best Practices", url: "https://jlcpcb.com/blog/pcb-footprint-design-practices", publisher: JLCPCB, kind: vendor_guide, section: "Paste and stencil"}
  confidence: high

# ───────────────────────── verification ─────────────────────────
- id: DFM-VER-001
  title: 用板厂能力而不是 EDA 默认值跑 DRC
  domain: dfm
  stage: verification
  severity: must
  rule: 把板厂能力表（线宽线距、孔径、孔环、阻焊桥、铜到边、丝印字高）写进板级设计规则 / .kicad_dru，出图前 kicad-cli pcb drc 的错误数为 0，并且「未连接」与「封装与原理图不一致」也为 0。
  rationale: EDA 默认规则与板厂能力无关；通过默认 DRC 并不代表能被板厂制造。
  applies_to: [kicad, jlc-pcb]
  verify:
    - method: drc
      tool: "kicad-cli pcb drc --format json --output drc.json board.kicad_pcb"
      check: "JSON 中 violations 与 unconnected_items 均为空；加载的 .kicad_dru 含 DFM-STK-001..004 的数值"
      automatable: full
  sources:
    - {title: "A Comprehensive Guide for Optimal Results (JLCPCB PCB design rules)", url: "https://jlcpcb.com/blog/a-comprehensive-guide-for-optimal-results", publisher: JLCPCB, kind: vendor_guide, section: "Non-numeric DFM guidance"}
    - {title: "JLCPCB PCB Capabilities", url: "https://jlcpcb.com/capabilities/pcb-capabilities", publisher: JLCPCB, kind: vendor_guide}
  confidence: high
  tags: [cat-feeder]

- id: DFM-VER-002
  title: 用独立查看器重新读一遍出图结果
  domain: dfm
  stage: verification
  severity: should
  rule: 在上传前用与 KiCad 无关的 Gerber 查看器（如 Ucamco 的 Reference Gerber Viewer 或 JLC 在线查看）打开最终 zip，核对层数、板框、钻孔、阻焊 / 丝印极性、各层对齐。
  rationale: 生成器和 CAM 对属性、极性、单位的理解可能不同；只有独立读回才能发现层缺失、镜像或原点漂移。
  applies_to: [gerber]
  verify:
    - method: review
      tool: "Reference Gerber Viewer / JLC 在线 Gerber 查看"
      check: "层数与叠层一致；板框闭合且尺寸正确；钻孔位置与焊盘重合；各层在同一坐标下叠合；丝印未压焊盘"
      automatable: manual
    - method: geometry_script
      tool: "gerbonara / pygerber 读回并与 .kicad_pcb 比较"
      check: "板框外接矩形与 .kicad_pcb 的 Edge.Cuts 一致（±0.01 mm）；钻孔数量与板文件一致"
      automatable: partial
  sources:
    - {title: "The Gerber File Format Specification, Revision 2020.09", url: "https://www.ucamco.com/files/downloads/file_en/399/the-gerber-file-format-specification-revision-2020-09_en.pdf", publisher: Ucamco, kind: standard, section: "Introduction: Reference Gerber Viewer; §6 PCB Fabrication Data"}
  confidence: medium

- id: DFM-VER-003
  title: 下单前核对 CPL 与板文件的几何一致
  domain: dfm
  stage: verification
  severity: must
  rule: 用脚本由板文件重算每个位号的中心坐标与旋转，对比 positions.csv；所有位号落在板框内；Top / Bottom 与封装实际所在层一致。
  rationale: 坐标 / 旋转 / 层错误在 JLC 预览里只能逐个肉眼发现，脚本可全量检查；这是 CPL 生成链路上的最后一道自动防线。
  applies_to: [jlc-smt, cpl]
  verify:
    - method: geometry_script
      tool: "pcbnew Python + csv"
      check: "对每个位号：|X−X'| ≤ 0.01 mm、|Y−Y'| ≤ 0.01 mm、旋转一致（含偏移表）；点在 Edge.Cuts 多边形内；Layer 与封装层一致"
