# DFM / DFA / DFT 规则库（面向 JLCPCB 2 层板 + SMT 贴片）。
# 数值来自 2026-10 实际读到的 JLCPCB 公开页面、TI 应用笔记、Ucamco Gerber 规范等；JLC 页面会更新，下单前以 JLC DFM 为准。

# ───────────────────────── architecture ─────────────────────────
- id: DFM-ARC-001
  title: 按所选 JLC 贴片档位的能力边界选型
  domain: dfm
  stage: architecture
  severity: must
  rule: 确定 Economic 还是 Standard PCBA 后，所有器件封装、引脚间距、板厚、层数、面数都必须落在该档位能力内；超出该档能力表的范围就不能用该档下单（JLC 页面没有写具体的处理方式）。
  rationale: Economic 档只做单面、2/4/6 层、0.8–1.6 mm 板厚、最小 0402 / 0.40 mm 引脚间距，且回流温度更高；这些在架构阶段就决定了能否便宜地做出来。
  applies_to: [jlc-smt, economic-pcba]
  parameters:
    - {name: eco_min_ic_lead_pitch, op: ">=", value: 0.40, unit: mm, note: "Economic PCBA；Standard 为 0.35 mm"}
    - {name: eco_min_bga_ball_pitch, op: ">=", value: 0.50, unit: mm, note: "Economic；Standard 为 0.30 mm"}
    - {name: eco_pcb_thickness, op: range, value: [0.8, 1.6], unit: mm, note: "Economic PCBA 板厚范围"}
    - {name: eco_order_quantity, op: range, value: [2, 50], unit: pcs, note: "Economic PCBA 订单数量"}
    - {name: eco_reflow_peak, op: "==", value: 255, unit: "°C", note: "能力页「Reflow temperature」一行：Economic 255 ±5 °C 且不可调，Standard 240 ±5 °C；页面没有说这是峰值还是炉温设定"}
  verify:
    - method: bom_check
      tool: "自写脚本读 BOM + 板文件 + JLC 能力表"
      check: "逐个器件取封装最小尺寸与引脚间距，对照所选档位的下限；检查板厚、层数、是否单面贴片；任一不满足即失败"
      automatable: partial
    - method: review
      tool: "JLC 在线 SMT 下单页（上传 BOM/CPL 后的匹配与报价页）"
      check: "下单前确认报价页显示的档位与预期一致，没有被自动升级为 Standard"
      automatable: manual
  sources:
    - {title: "JLCPCB PCB Assembly Capabilities", url: "https://jlcpcb.com/capabilities/pcb-assembly-capabilities", publisher: JLCPCB, kind: vendor_guide, section: "Economic vs Standard PCBA feature table; PCB Specs for Economic PCB Assembly"}
  confidence: high
  conflicts: "JLC 自己的页面数字不一致：设计规则博客《Mastering PCB Design Rules》（页面标 2026-10-16 更新）写 Standard PCBA 最小器件 0201、最小 BGA 间距 0.35 mm，能力页与 FAQ 写 01005 和 0.30 mm（能力页）。这里取能力页。能力页的 Reflow temperature 行没有说是峰值，DFM-ARC-004 按 260 °C 保守处理。"
  tags: [cat-feeder]

- id: DFM-ARC-002
  title: 优先选 JLC 基础库 / Preferred 器件
  domain: dfm
  stage: architecture
  severity: should
  rule: Economic 档每用一个 Extended 器件，JLC 加收一次上料费（FAQ 写每个 Extended 器件 3 美元，价格页 Economic 列写 3.07 美元）；Economic 档下 Preferred Extended 免此费。Standard 档价格页改列 Feeder Loading 1.53 美元，写明 Basic 和 Extended 都要收。能用基础库或 Preferred 的位置不要选普通 Extended。
  rationale: 基础库器件常驻贴片机料站；Extended 要人工装料，所以收上料费。两个页面都没有明说按料种还是按用量计，这里按每个需要上料的料种理解，小批量时占总价比例很高。
  applies_to: [jlc-smt]
  parameters:
    - {name: extended_part_loading_fee, op: minimize, value: null, unit: USD, note: "Economic：FAQ 写 3 美元、价格页写 3.07 美元（页面注明会随汇率浮动）；Standard：价格页 1.53 美元 Basic/Extend。计费口径（按种类还是按个数）页面未明写"}
  verify:
    - method: bom_check
      tool: "自写脚本：按 LCSC 编号查 JLC 零件库类别（Basic / Preferred / Extended）"
      check: "列出所有 Extended 行并统计种类数，乘 3 USD 得上料费；同功能有 Basic / Preferred 替代时标红"
      automatable: partial
  sources:
    - {title: "PCB Assembly FAQs", url: "https://jlcpcb.com/help/article/pcb-assembly-faqs", publisher: JLCPCB, kind: vendor_guide, section: "Basic vs extended parts"}
    - {title: "PCB Assembly Cost: What Does the Price Include?", url: "https://jlcpcb.com/help/article/pcb-assembly-price", publisher: JLCPCB, kind: vendor_guide, section: "Fee table: Feeder Loading; Fee Details and Explanations"}
  confidence: medium
  conflicts: "上面是 jlcpcb.com（美元）的口径。国内嘉立创（jlc.com / jlc-smt.com，人民币）的页面上是「换料费」：作者 2026-10 的一次经济型报价里整盘预订前 ¥340、预订后 ¥85，与美元口径的 3 美元 / 种不是同一套计费，不要直接套用。"
  tags: [cat-feeder]

- id: DFM-ARC-003
  title: 下单前核对每个料号的库存与封装匹配
  domain: dfm
  stage: architecture
  severity: should
  rule: 每个贴片器件都要有 LCSC 编号；下单时核对该料号封装与自己的封装一致，且库存大于「片数 × 每板用量 + 损耗」；库存不足时换料而不是赌补货。
  rationale: JLC 只贴 BOM 里匹配到库的零件；缺料会让订单卡在备料，或被迫改成客供料。封装不一致则贴出来对不上焊盘。
  applies_to: [jlc-smt]
  verify:
    - method: bom_check
      tool: "自写脚本调用 LCSC/JLC 零件库查询"
      check: "对每个 LCSC 编号取库存、封装名、基础库/扩展库；库存 < 片数×用量×(1+损耗) 或封装名与 BOM Footprint 不符则失败"
      automatable: partial
    - method: review
      tool: "JLC BOM 匹配选型页（BOM 表 + 右侧 2D/3D 放置预览）"
      check: "逐行看「C 编号匹配」、库存、用量是否满足；全部 N/N 核对完才点下一步"
      automatable: manual
  sources:
    - {title: "PCB Assembly FAQs", url: "https://jlcpcb.com/help/article/pcb-assembly-faqs", publisher: JLCPCB, kind: vendor_guide, section: "BOM and CPL requirements / Parts stock"}
    - {title: "How to Prevent PCBA LED Failure After Soldering", url: "https://jlcpcb.com/help/article/how-to-prevent-pcba-led-failure-after-soldering", publisher: JLCPCB, kind: vendor_guide, section: "§2.1 Specify accurate part numbers; §2.2 Use the JLCPCB Parts Library"}
    - {ref: "作者首单 JLC SMT 的实测记录（2026-10-19，未公开笔记）", title: "首单 SMT 实测记录（库存与用量核对）", publisher: "作者实测", kind: blog}
  confidence: medium
  tags: [cat-feeder]

- id: DFM-ARC-004
  title: 器件必须耐受 JLC 回流峰值并核对 MSL
  domain: dfm
  stage: architecture
  severity: must
  rule: 选型时确认每个器件的数据手册允许的回流峰值不低于所选档位的峰值（Economic 255 ±5 °C，即按 260 °C 考虑），并读出 MSL 等级；MSL 3 及以上的器件（例如 LED；模块以其数据手册的 MSL 为准）要选 JLC 的 Component Baking 服务或在 PCBA 备注里写明烘烤要求。
  rationale: 回流峰值过高会损坏电解电容、连接器、塑料件和 LED；吸潮的器件在回流时蒸汽膨胀会开裂（popcorn）。JLC 存储并追踪暴露时间，但需要设计者说明特殊要求。
  applies_to: [jlc-smt, reflow]
  parameters:
    - {name: part_max_reflow_temp, op: ">=", value: 260, unit: "°C", note: "由能力页 Economic「Reflow temperature 255 ±5 °C」推出的上界（页面没有说它是峰值，这里按峰值保守处理）；以器件数据手册的 J-STD-020 Tp 为准"}
    - {name: msl3_floor_life, op: "==", value: 168, unit: h, note: "MSL 3 在 30 °C / 60 %RH 下的车间寿命，超过要烘烤"}
  verify:
    - method: bom_check
      tool: "BOM 脚本 + 数据手册表（人工录入 Tp 与 MSL）"
      check: "表中每个器件 Tp ≥ 260 °C（Economic）或 ≥ 245 °C（Standard）；MSL ≥ 3 的器件列入订单备注清单"
      automatable: partial
  sources:
    - {title: "PCB Assembly Capabilities", url: "https://jlcpcb.com/capabilities/pcb-assembly-capabilities", publisher: JLCPCB, kind: vendor_guide, section: "Placement, Reflow, and Inspection"}
    - {title: "Moisture Sensitivity Level (MSL) for Electronic Parts", url: "https://jlcpcb.com/help/article/moisture-sensitivity-level-msl-for-electronic-parts", publisher: JLCPCB, kind: vendor_guide, section: "§2 MSL table (MSL 3 = 168 h at 30 °C/60 %RH)"}
    - {title: "How to Prevent PCBA LED Failure After Soldering", url: "https://jlcpcb.com/help/article/how-to-prevent-pcba-led-failure-after-soldering", publisher: JLCPCB, kind: vendor_guide, section: "§2 Engineering note; §3.2 Component Baking (60 °C, 48 h)"}
    - {title: "Manufacturing Insights: Reflow Soldering Principles and Precautions", url: "https://jlcpcb.com/help/article/reflow-soldering-principles-and-precautions", publisher: JLCPCB, kind: vendor_guide}
    - {title: "J-STD-020 / J-STD-033 (MSL classification and handling)", ref: "IPC/JEDEC J-STD-020, J-STD-033", publisher: "IPC/JEDEC", kind: standard}
  confidence: medium
  tags: [cat-feeder]

- id: DFM-ARC-005
  title: 默认按 IPC Class 2 订板，Class 3 另行评估
  domain: dfm
  stage: architecture
  severity: consider
  rule: 消费 / 工业类产品按 IPC-6012 Class 2 下单；若需要 Class 3（孔铜更厚、环宽无破环），必须与板厂书面确认，JLC 标准产线是商业工艺而不是预认证的 Class 3 线。
  rationale: Class 2 孔壁铜平均 20 µm（最薄点 18 µm），Class 3 为 25 µm（最薄 20 µm），外层环宽要求也更严；JLC 公开的平均孔铜是 18 µm，略低于 Class 2 平均值，说明不能默认等同 Class 3。
  applies_to: [fabrication]
  parameters:
    - {name: class2_hole_plating_avg, op: ">=", value: 20, unit: um, note: "IPC-6012 Class 2 孔壁铜平均"}
    - {name: class3_hole_plating_avg, op: ">=", value: 25, unit: um, note: "IPC-6012 Class 3 孔壁铜平均"}
    - {name: jlc_avg_hole_plating, op: "==", value: 18, unit: um, note: "JLC 能力页公布的平均孔铜"}
  verify:
    - method: review
      tool: "订单备注 / 与板厂确认记录"
      check: "产品需求文档写明所需 IPC 等级；高可靠项目在下单前取得板厂对 Class 3 的书面答复"
      automatable: manual
  sources:
    - {title: "Understanding IPC-6012 Standards for PCB Quality", url: "https://jlcpcb.com/blog/ipc-6012-standards", publisher: JLCPCB, kind: vendor_guide}
    - {title: "JLCPCB PCB Capabilities", url: "https://jlcpcb.com/capabilities/pcb-capabilities", publisher: JLCPCB, kind: vendor_guide, section: "Drilling: Average hole plating"}
    - {title: "IPC-6012 Qualification and Performance Specification for Rigid Printed Boards", ref: "IPC-6012 (class 1/2/3 definitions)", publisher: IPC, kind: standard}
  confidence: medium
  conflicts: "二手资料对 Class 2 / 3 的外层环宽数字不一致（有写 Class 2 外层 50 µm 最小，也有写 Class 2 允许破环 90°）。这里只收孔壁铜厚度（JLC 文章与多个板厂资料一致）；环宽以 JLC 能力页数值和实际 IPC-6012 版本为准。另外 JLC 自己的口径也不一致：同一篇 IPC-6012 博客（页面标 2026-09-28）写 JLC 的镀铜指南把孔壁铜控制在 20–25 µm，而能力页写平均孔铜 18 µm；这里取能力页的 18 µm（更保守）。"

# ───────────────────────── library ─────────────────────────
- id: DFM-LIB-001
  title: 封装按 IPC-7351 密度等级选，默认 Nominal
  domain: dfm
  stage: library
  severity: should
  rule: 回流量产默认用 IPC-7351 Level B（Nominal，后缀 N）；手工焊接、返修多或高可靠场合用 Level A（Most）；Level C（Least）只在板面极度紧张且有成熟工艺控制时用。courtyard 外扩按所选等级取值。
  rationale: 三个等级是三套焊点圆角目标（趾、跟、侧）加三个 courtyard 外扩值，不是质量等级；盲目用 Least 会让焊盘变小、可返修性变差。
  applies_to: [footprint, smd]
  parameters:
    - {name: courtyard_excess_most, op: "==", value: 0.5, unit: mm, note: "Level A / M，每边"}
    - {name: courtyard_excess_nominal, op: "==", value: 0.25, unit: mm, note: "Level B / N，每边；默认"}
    - {name: courtyard_excess_least, op: "==", value: 0.1, unit: mm, note: "Level C / L，每边"}
  verify:
    - method: geometry_script
      tool: "pcbnew Python：读取封装库，对每个封装计算 courtyard 到焊盘 / 本体外沿的距离"
      check: "courtyard 到最外焊盘边的距离应等于所选等级的外扩值（±0.05 mm）；封装名后缀 M/N/L 与项目约定等级一致"
      automatable: partial
    - method: review
      tool: "库评审清单"
      check: "非 Nominal 等级的封装在库里注明理由"
      automatable: manual
  sources:
    - {title: "PCB Land Pattern Design: IPC-7351B Footprint Standards", url: "https://www.atlaspcb.com/blog/pcb-land-pattern-design-ipc-7351b-footprint-standards/", publisher: AtlasPCB, kind: vendor_guide}
    - {title: "Mastering PCB Footprints: Design Best Practices", url: "https://jlcpcb.com/blog/pcb-footprint-design-practices", publisher: JLCPCB, kind: vendor_guide, section: "IPC-7351 density levels"}
    - {title: "IPC-7351B Generic Requirements for Surface Mount Design and Land Pattern Standard", ref: "IPC-7351B", publisher: IPC, kind: standard}
  confidence: medium

- id: DFM-LIB-002
  title: 两端片式元件的两个焊盘必须完全对称
  domain: dfm
  stage: library
  severity: must
  rule: 0201–1206 等两端片式元件的封装，两个焊盘的长、宽、阻焊开口、钢网开口必须一致，且相对本体中心对称。
  rationale: 焊盘不对称导致两端锡膏量和润湿面积不同，熔化先后不同，表面张力把轻小元件拉起（立碑）；元件越小越轻越敏感。
  applies_to: [chip-resistor, chip-capacitor, "0402", "0603"]
  verify:
    - method: geometry_script
      tool: "pcbnew Python 遍历所有 2 焊盘封装"
      check: "比较两焊盘尺寸、形状、阻焊边距、钢网边距，并检查两焊盘中心关于封装原点对称；任何差异（> 0.01 mm）报错"
      automatable: full
  sources:
    - {title: "PCB Tombstoning: Causes, Prevention & Fixes", url: "https://jlcpcb.com/blog/pcb-tombstone", publisher: JLCPCB, kind: vendor_guide, section: "Prevention rules: Pad symmetry"}
    - {title: "PCB Tombstoning and its Impact on PCB Assembly", url: "https://www.sierraassembly.com/blog/tombstoning-in-pcbs-and-impact-on-pcb-assembly/", publisher: "Sierra Assembly", kind: blog}
  confidence: medium
  tags: [cat-feeder]

- id: DFM-LIB-003
  title: QFN/SON 焊盘按 TI 的趾跟宽与间隙建立
  domain: dfm
  stage: library
  severity: should
  rule: QFN/SON 引脚焊盘外伸（趾）至少比封装引脚长 0.1 mm，内伸（跟）0.05 mm，宽度至少比引脚宽 0.05 mm（每边 0.025 mm）；0.5 mm 间距焊盘宽 ≤ 0.28 mm，0.4 mm 间距焊盘宽 0.2 mm；中心散热焊盘做成与封装散热焊盘等大；引脚焊盘与散热焊盘间距 ≥ 0.2 mm。
  rationale: 趾端焊点圆角决定可检视性与强度；焊盘过宽或间距过小在引脚间距小时容易桥连；散热焊盘与引脚太近同样桥连。
  applies_to: [qfn, son, exposed-pad]
  parameters:
    - {name: qfn_pad_toe_extension, op: ">=", value: 0.1, unit: mm, note: "焊盘比封装引脚长出的最小量；TI 典型值取封装本体外 0.4 mm 作为起点"}
    - {name: qfn_pad_heel_extension, op: ">=", value: 0.05, unit: mm}
    - {name: qfn_pad_width_extra, op: ">=", value: 0.05, unit: mm, note: "总宽度比引脚宽（每边 0.025 mm）"}
    - {name: qfn_pad_width_pitch_0p5, op: "<=", value: 0.28, unit: mm, note: "0.5 mm 间距；基于引脚最大宽 0.3 mm"}
    - {name: qfn_pad_width_pitch_0p4, op: "==", value: 0.2, unit: mm, note: "0.4 mm 间距，焊盘间隙 0.2 mm"}
    - {name: qfn_lead_to_thermal_pad_gap, op: ">=", value: 0.2, unit: mm}
  verify:
    - method: geometry_script
      tool: "pcbnew Python 读封装焊盘几何，与数据手册 / TI 推荐尺寸对表"
      check: "对每个 QFN/SON 封装检查引脚焊盘长宽、焊盘到焊盘间隙、引脚焊盘到中心焊盘间隙，不满足上述阈值即失败"
      automatable: partial
  sources:
    - {title: "SLUA271 QFN and SON PCB Attachment", url: "https://www.ti.com/lit/an/slua271d/slua271d.pdf", publisher: "Texas Instruments", kind: app_note, section: "§3.3 lead pads (0.1/0.05/0.025 mm, 0.28 mm); §3.4 exposed pad (0.2 mm gap); §4.3 (0.4 mm pitch, 0.2 mm pad). 该 URL 下的 PDF 页脚标 SLUA271C（2023-12）"}
  confidence: high

- id: DFM-LIB-004
  title: 细间距 QFN 的阻焊开口要成组并圆角
  domain: dfm
  stage: library
  severity: should
  rule: QFN/SON 引脚间距 ≥ 0.65 mm 时每个焊盘单独开阻焊，开口尺寸比引脚焊盘大 0.1–0.14 mm（NSMD；TI 原文写 larger than the lead finger pad size，没有说是每边还是总量）；0.5 mm 间距时在每一侧把所有焊盘开成一个整窗，窗边到焊盘 ≤ 0.05 mm；窗口内角做圆角。优先 NSMD（铜定义）焊盘。
  rationale: 铜腐蚀精度高于阻焊对位精度，NSMD 焊点几何更稳定且焊料被限制在开口内；细间距下焊盘间阻焊桥做不出来时，整窗开口比留残缺的阻焊桥更可靠。
  applies_to: [qfn, son, fine-pitch]
  parameters:
    - {name: qfn_mask_opening_over_pad, op: range, value: [0.1, 0.14], unit: mm, note: "NSMD，引脚间距 ≥ 0.65 mm；TI 写作「比引脚焊盘大 0.1–0.14 mm」"}
    - {name: qfn_mask_gang_clearance_pitch_0p5, op: "<=", value: 0.05, unit: mm, note: "0.5 mm 间距，成组开窗"}
  verify:
    - method: drc
      tool: "KiCad DRC：solder_mask_bridge 违规 + 自定义规则"
      check: "对 QFN 封装启用阻焊桥检查，0.5 mm 间距器件若出现 solder_mask_bridge 违规，应改成成组开窗，而不是接受零碎阻焊桥"
      automatable: partial
    - method: review
      tool: "对照 TI SLUA271 Figure 3-5 评审封装"
      check: "内角圆角、整窗开口、无阻焊残渣风险"
      automatable: manual
  sources:
    - {title: "SLUA271 QFN and SON PCB Attachment", url: "https://www.ti.com/lit/an/slua271d/slua271d.pdf", publisher: "Texas Instruments", kind: app_note, section: "§3.1, §3.5"}
  confidence: high

- id: DFM-LIB-005
  title: 通孔封装的孔径按引脚加余量并满足孔环
  domain: dfm
  stage: library
  severity: should
  rule: 通孔焊盘的成品孔径取引脚对角线（或直径）加 0.1–0.3 mm；金属化孔径尽量 ≥ 0.5 mm；2 层 1 oz 板的孔环建议 ≥ 0.25 mm（绝对下限 0.18 mm）。
  rationale: 孔径余量过小插不进，过大焊料填充不足、手焊时也容易虚焊；孔环不足在钻孔偏移后会破环。JLC 建议 ≥ 0.5 mm 以免孔内被阻焊或锡堵。
  applies_to: [through-hole, pin-header, connector]
  parameters:
    - {name: pth_hole_over_lead, op: range, value: [0.1, 0.3], unit: mm, note: "成品孔径比引脚大的量"}
    - {name: pth_recommended_min_hole, op: ">=", value: 0.5, unit: mm}
    - {name: pth_annular_ring_recommended_2layer_1oz, op: ">=", value: 0.25, unit: mm}
    - {name: pth_annular_ring_absolute_min_2layer_1oz, op: ">=", value: 0.18, unit: mm}
  verify:
    - method: geometry_script
      tool: "pcbnew Python 读通孔焊盘"
      check: "孔径 ≥ 0.5 mm；(焊盘外径 − 孔径)/2 ≥ 0.25 mm；与数据手册引脚尺寸比对孔径余量在 0.1–0.3 mm"
      automatable: partial
    - method: drc
      tool: "KiCad DRC annular_width"
      check: "annular_width 约束 min 0.25 mm（硬限 0.18 mm 作 error 下限）"
      automatable: full
  sources:
    - {title: "JLCPCB PCB Capabilities", url: "https://jlcpcb.com/capabilities/pcb-capabilities", publisher: JLCPCB, kind: vendor_guide, section: "Drilling / Annular Rings"}
    - {title: "Mastering PCB Footprints: Design Best Practices", url: "https://jlcpcb.com/blog/pcb-footprint-design-practices", publisher: JLCPCB, kind: vendor_guide, section: "Pads, holes, and annular rings"}
  confidence: medium
  conflicts: "JLC 的 footprint 文章写通孔孔环建议 0.15–0.3 mm，能力页写 PTH 孔环 ≥ 0.20 mm 且 2 层 1 oz 建议 0.25 mm（下限 0.18 mm）。取能力页数值，因为它是板厂的官方能力表。"
  tags: [cat-feeder]

- id: DFM-LIB-006
  title: 封装必须与数据手册极性一致并有可见的 1 脚 / 极性标记
  domain: dfm
  stage: library
  severity: must
  rule: 有极性或方向的器件（LED、二极管、电解电容、IC、模块）的封装焊盘编号必须与数据手册引脚定义一致，丝印或装配层上要有贴装后仍可见的 1 脚 / 阳极 / 负极标记；不要用通用的「LED」封装。
  rationale: 极性 / 封装错位是 LED 回流后失效最常见的根因；极性错误无法被 DRC 发现，只能靠库评审和放置预览。
  applies_to: [led, diode, polarized-capacitor, ic, module]
  verify:
    - method: review
      tool: "库评审 + 3D 查看器 + JLC BOM 匹配页的 2D/3D 放置预览"
      check: "逐个有极性器件对照数据手册引脚图，确认焊盘号、丝印标记位置、3D 模型 1 脚方向，三者一致"
      automatable: manual
    - method: geometry_script
      tool: "pcbnew Python"
      check: "每个极性封装的 F.Silkscreen / F.Fab 上存在 1 脚标记图形，且不与焊盘重叠（距焊盘 ≥ 0.15 mm）"
      automatable: partial
  sources:
    - {title: "PCBA LED Not Working After Soldering: How to Prevent Failure", url: "https://jlcpcb.com/help/article/how-to-prevent-pcba-led-failure-after-soldering", publisher: JLCPCB, kind: vendor_guide, section: "§1.1 Verify Polarity and Footprint Compatibility"}
    - {title: "Mastering PCB Footprints: Design Best Practices", url: "https://jlcpcb.com/blog/pcb-footprint-design-practices", publisher: JLCPCB, kind: vendor_guide}
  confidence: medium
  tags: [cat-feeder]

- id: DFM-LIB-007
  title: 丝印与焊盘保持间距
  domain: dfm
  stage: library
  severity: should
  rule: 丝印字符 / 线条距任何焊盘边缘 ≥ 0.15 mm（板厂下限），建议 ≥ 0.25 mm；落在裸铜上的丝印会被板厂默认删除，不要依赖它。
  rationale: 丝印油墨上焊盘会污染焊接面；板厂 CAM 会自动裁掉焊盘上的丝印，导致极性标记缺失。
  applies_to: [footprint, silkscreen]
  parameters:
    - {name: silk_to_pad_clearance_min, op: ">=", value: 0.15, unit: mm}
    - {name: silk_to_pad_clearance_recommended, op: ">=", value: 0.25, unit: mm}
  verify:
    - method: drc
      tool: "KiCad DRC：silk_over_copper / silk_overlap / 自定义 silk_clearance 约束"
      check: "设置 silk_clearance min 0.15 mm（建议 0.25 mm），要求 0 个丝印压焊盘违规"
      automatable: full
  sources:
    - {title: "Technical Guidance: Character Design Specifications", url: "https://jlcpcb.com/blog/character-design-specifications", publisher: JLCPCB, kind: vendor_guide}
    - {title: "JLCPCB PCB Capabilities", url: "https://jlcpcb.com/capabilities/pcb-capabilities", publisher: JLCPCB, kind: vendor_guide, section: "Silkscreen (Legend)"}
  confidence: high
  tags: [cat-feeder]

# ───────────────────────── schematic ─────────────────────────
- id: DFM-SCH-001
  title: 原理图符号里带 LCSC 料号字段和 DNP 标记
  domain: dfm
  stage: schematic
  severity: should
  rule: 每个要贴片的符号都带一个 LCSC 料号字段（如「LCSC Part #」），格式为 C 加数字；不贴的器件在原理图里标 DNP / 排除 BOM，而不是靠导出后手工删行。
  rationale: JLC BOM 需要 Comment、Designator、Footprint 和 LCSC 料号；导出工具按固定字段名读取，字段缺失会让整行匹配失败，手工改 BOM 又会和原理图漂移。
  applies_to: [kicad, jlc-smt]
  verify:
    - method: bom_check
      tool: "kicad-cli sch export bom 或 Python 读 .kicad_sch"
      check: "对每个未标 DNP 且封装为 SMD 的符号，LCSC 字段匹配正则 ^C[0-9]+$；DNP 符号的 exclude_from_bom 为真"
      automatable: full
  sources:
    - {title: "How To Export BOM and CPL Files From KiCad", url: "https://jlcpcb.com/help/article/how-to-generate-the-bom-and-centroid-file-from-kicad", publisher: JLCPCB, kind: vendor_guide}
    - {title: "Fabrication Toolkit (JLCPCB plugin for KiCad)", url: "https://github.com/bennymeg/Fabrication-Toolkit", publisher: "bennymeg (GitHub)", kind: tool_doc, section: "LCSC field names; DNP and exclusion attributes"}
  confidence: medium
  tags: [cat-feeder]

- id: DFM-SCH-002
  title: 在原理图里预留固件下载与调试入口
  domain: dfm
  stage: schematic
  severity: should
  rule: 板子上要有不拆件就能烧录和复位的入口：对 ESP32-C3 至少引出 UART0（GPIO20/GPIO21）、CHIP_EN 和下载模式用的 GPIO9，做成排针或测试焊盘；不要把这些脚固定占用或加大电容。
  rationale: ESP32-C3 默认用 UART0 下载与打印日志，GPIO9 低电平 + GPIO2/GPIO8 高电平进入下载模式；GPIO9 上加大电容会意外进入下载模式；整板贴片后没有入口就只能靠 USB 或飞线。
  applies_to: [esp32-c3, programming, dft]
  parameters:
    - {name: gpio9_capacitor, op: qualitative, value: null, note: "GPIO9 不要加大容量电容，否则芯片可能进入下载模式"}
    - {name: u0txd_series_resistor, op: "==", value: 499, unit: ohm, note: "Espressif 建议 U0TXD 串 499 Ω 抑制谐波"}
  verify:
    - method: review
      tool: "原理图评审清单"
      check: "UART0 TX/RX、CHIP_EN、GPIO9、3V3、GND 都有可接触的焊盘或排针，丝印标明名称"
      automatable: manual
    - method: erc
      tool: "KiCad ERC + 自定义检查脚本"
      check: "检查 GPIO9 / CHIP_EN 网络上没有超过规定值的电容、CHIP_EN 不悬空"
      automatable: partial
  sources:
    - {title: "ESP32-C3 Hardware Design Guidelines: Schematic Checklist", url: "https://docs.espressif.com/projects/esp-hardware-design-guidelines/en/latest/esp32c3/schematic-checklist.html", publisher: Espressif, kind: vendor_guide, section: "Strapping pins, UART0, CHIP_EN"}
  confidence: medium
  conflicts: "Espressif 该页没有规定测试点 / 排针的物理形式，「预留下载入口」是本库根据下载引脚事实做出的推断，因此 confidence 只给 medium。"
  tags: [cat-feeder]

# ───────────────────────── netlist ─────────────────────────
- id: DFM-NET-001
  title: BOM、CPL 与 PCB 必须一一对应
  domain: dfm
  stage: netlist
  severity: must
  rule: 每个位号在 BOM 里恰好出现一次，且在 CPL 里有坐标；不贴的器件同时从 BOM 和 CPL 中去掉；CPL 里没有 BOM 中不存在的位号。
  rationale: JLC 按 BOM 匹配零件、按 CPL 放置；两边不一致会出现缺料、无坐标或多出一行「位号未找到」，且这类错误 DRC 看不到。
  applies_to: [jlc-smt]
  verify:
    - method: netlist_diff
      tool: "自写脚本：对比 .kicad_pcb 的封装集合、bom.csv、positions.csv"
      check: "三个位号集合应相等（扣除标记 DNP / 排除的）；任何一边多或少都失败；位号需大写比较"
      automatable: full
  sources:
    - {title: "PCB Assembly FAQs", url: "https://jlcpcb.com/help/article/pcb-assembly-faqs", publisher: JLCPCB, kind: vendor_guide, section: "BOM and CPL requirements"}
    - {title: "Fabrication Toolkit (JLCPCB plugin for KiCad)", url: "https://github.com/bennymeg/Fabrication-Toolkit", publisher: "bennymeg (GitHub)", kind: tool_doc, section: "Exclude from BOM / Exclude from position files"}
  confidence: medium
  tags: [cat-feeder]

- id: DFM-NET-002
  title: 位号不得靠大小写区分
  domain: dfm
  stage: netlist
  severity: must
  rule: 同一块板上 R1 与 r1 这类仅大小写不同的位号不允许存在。
  rationale: JLC 生产时会把位号字母全部转成大写，大小写不同的两个位号会合并成同一个，造成漏贴或冲突。
  applies_to: [jlc-smt]
  verify:
    - method: netlist_diff
      tool: "Python 读网表"
      check: "把所有位号转大写后检查是否有重复"
      automatable: full
  sources:
    - {title: "Bill of Materials (BOM) File for PCB Assembly", url: "https://jlcpcb.com/help/article/bill-of-materials-for-pcb-assembly", publisher: JLCPCB, kind: vendor_guide}
  confidence: high

# ───────────────────────── stackup / board rules ─────────────────────────
- id: DFM-STK-001
  title: DRC 的线宽线距不低于板厂能力并留余量
  domain: dfm
  stage: stackup
  severity: must
  rule: 2 层板按铜厚设置最小线宽 / 线距：1 oz 0.10 / 0.10 mm，2 oz 0.16 / 0.16 mm，2.5 oz 0.20 / 0.20 mm；4 层以上 1 oz 为 0.09 / 0.09 mm。实际设计取这些下限的 1.5 倍以上，除非必须。
  rationale: 这是 JLC 的制造能力下限，不是设计目标；线宽公差 ±20%，铜越厚蚀刻侧蚀越大，下限随铜厚增加。贴着下限做良率低，且小批量板厂可能直接按 DFM 拒单。
  applies_to: [2-layer, jlc-pcb]
  parameters:
    - {name: min_trace_width_2layer_1oz, op: ">=", value: 0.10, unit: mm, note: "同时线距 ≥ 0.10 mm"}
    - {name: min_trace_width_2layer_2oz, op: ">=", value: 0.16, unit: mm, note: "同时线距 ≥ 0.16 mm"}
    - {name: min_trace_width_2layer_2p5oz, op: ">=", value: 0.20, unit: mm}
    - {name: min_trace_width_multilayer_1oz, op: ">=", value: 0.09, unit: mm, note: "4 层及以上"}
    - {name: trace_width_tolerance, op: "==", value: 20, unit: "%", note: "JLC 公布的线宽公差 ±20%"}
  verify:
    - method: drc
      tool: "KiCad DRC，自定义规则 .kicad_dru 的 track_width 与 clearance 约束"
      check: "把 min track width / min clearance 设为上述数值（或 1.5 倍余量），kicad-cli pcb drc 零违规"
      automatable: full
  sources:
    - {title: "JLCPCB PCB Capabilities", url: "https://jlcpcb.com/capabilities/pcb-capabilities", publisher: JLCPCB, kind: vendor_guide, section: "Traces and Spacing"}
    - {title: "A Comprehensive Guide for Optimal Results (JLCPCB PCB design rules)", url: "https://jlcpcb.com/blog/a-comprehensive-guide-for-optimal-results", publisher: JLCPCB, kind: vendor_guide, section: "DFM guidance: set DRC to manufacturer capabilities"}
    - {title: "PCB Design Rules and Guidelines: A Complete Best Practices Guide", url: "https://jlcpcb.com/blog/pcb-design-rules-best-practices", publisher: JLCPCB, kind: vendor_guide, section: "DFM and DFA: capability table (1-2 layer column)"}
  confidence: high
  conflicts: "JLC 博客《PCB Design Rules and Guidelines》（blog/pcb-design-rules-best-practices，页面标 2026-09-07 更新）的能力表把 1–2 层最小线宽线距写成 5 mil（0.127 mm）；能力页写 4 mil（0.10 mm）。上面第一个 design rules 来源（A Comprehensive Guide，页面标 2026-10-16）现在只写 1 oz 多层 0.09 / 0.09 mm，与能力页一致。取能力页，同时建议按 1.5 倍余量设计，这样两种说法都满足。"
  tags: [cat-feeder]

- id: DFM-STK-002
  title: 钻孔、过孔与孔环的最小值
  domain: dfm
  stage: stackup
  severity: must
  rule: 过孔 / 钻孔至少 0.15 mm（推荐过孔钻孔 ≥ 0.2 mm），过孔焊盘直径至少比孔大 0.1 mm（推荐 0.15 mm）；金属化孔环 ≥ 0.20 mm，2 层 1 oz 板推荐 0.25 mm、绝对下限 0.18 mm；孔到孔间距过孔 ≥ 0.2 mm、焊盘孔 ≥ 0.45 mm。
  rationale: 钻孔位置公差 ±0.075 mm、孔径公差 +0.13/−0.08 mm，加上对位误差，孔环不足会破环导致开路；孔距过小会钻孔断刀或孔壁崩裂。
  applies_to: [2-layer, jlc-pcb, via, pth]
  parameters:
    - {name: min_drill, op: ">=", value: 0.15, unit: mm, note: "2 层及以上；0.1 mm 需板厚 ≤ 1 mm 且 ENIG/OSP，额外加价"}
    - {name: preferred_via_drill, op: ">=", value: 0.2, unit: mm}
    - {name: via_pad_over_hole, op: ">=", value: 0.1, unit: mm, note: "推荐 0.15 mm"}
    - {name: pth_annular_ring, op: ">=", value: 0.20, unit: mm, note: "2 层 1 oz 推荐 0.25 mm，绝对下限 0.18 mm"}
    - {name: via_hole_to_hole, op: ">=", value: 0.2, unit: mm}
    - {name: pad_hole_to_hole, op: ">=", value: 0.45, unit: mm}
  verify:
    - method: drc
      tool: "KiCad DRC 约束 hole_size、via_diameter、annular_width、hole_to_hole"
      check: "hole_size min 0.2 mm（过孔）、annular_width min 0.20–0.25 mm、hole_to_hole min 0.45 mm（焊盘孔）/ 0.2 mm（过孔），零违规"
      automatable: full
  sources:
    - {title: "JLCPCB PCB Capabilities", url: "https://jlcpcb.com/capabilities/pcb-capabilities", publisher: JLCPCB, kind: vendor_guide, section: "Drilling / Vias / Annular Rings"}
    - {title: "PCB Design Rules and Guidelines: A Complete Best Practices Guide", url: "https://jlcpcb.com/blog/pcb-design-rules-best-practices", publisher: JLCPCB, kind: vendor_guide, section: "DFM and DFA: capability table (1-2 layer column)"}
  confidence: high
  conflicts: "JLC 博客《PCB Design Rules and Guidelines》（blog/pcb-design-rules-best-practices，页面标 2026-09-07 更新）的能力表列出 1–2 层最小过孔孔径 0.3 mm、最小孔环 0.13 mm，与能力页（2 层钻孔 0.15 mm、孔环 ≥ 0.20 mm）不同；能力页的 0.3 mm 只对应 1 层板（仅 NPTH），博客把 1 层和 2 层并成一列。取能力页的数值。另外能力页同时写「过孔焊盘比孔大 0.1 mm」（等于孔环 0.05 mm）和「PTH 孔环 ≥ 0.20 mm」，页面没有说过孔适用哪一条；用 KiCad annular_width 约束时过孔可能被误报，需要对过孔单独设规则。"
  tags: [cat-feeder]

- id: DFM-STK-003
  title: 焊盘与走线、孔与走线的间距下限
  domain: dfm
  stage: stackup
  severity: must
  rule: SMD 焊盘到焊盘（不同网络）≥ 0.15 mm；焊盘到走线 ≥ 0.10 mm（1 oz）；过孔孔壁到走线 ≥ 0.2 mm；金属化通孔到走线 ≥ 0.28 mm（推荐 0.35 mm）；非金属化孔到走线 ≥ 0.2 mm；最小 SMD 焊盘 0.25 × 0.25 mm。
  rationale: 这些是板厂 CAM 的最小蚀刻与钻孔对位余量；低于下限会短路或被工程师改线。
  applies_to: [jlc-pcb]
  parameters:
    - {name: smd_pad_to_pad, op: ">=", value: 0.15, unit: mm, note: "不同网络"}
    - {name: pad_to_track_1oz, op: ">=", value: 0.10, unit: mm}
    - {name: via_hole_to_track, op: ">=", value: 0.2, unit: mm}
    - {name: pth_to_track, op: ">=", value: 0.28, unit: mm, note: "推荐 0.35 mm"}
    - {name: npth_to_track, op: ">=", value: 0.2, unit: mm}
    - {name: min_smd_pad_size, op: ">=", value: 0.25, unit: mm, note: "0.25 × 0.25 mm"}
  verify:
    - method: drc
      tool: "KiCad DRC 约束 clearance、hole_clearance、physical_hole_clearance"
      check: "自定义规则按上述数值设置，零违规；SMD 焊盘尺寸用 pcbnew 脚本扫描最小边 ≥ 0.25 mm"
      automatable: full
  sources:
    - {title: "JLCPCB PCB Capabilities", url: "https://jlcpcb.com/capabilities/pcb-capabilities", publisher: JLCPCB, kind: vendor_guide, section: "Traces and Spacing"}
  confidence: high
  tags: [cat-feeder]

- id: DFM-STK-004
  title: 阻焊桥与阻焊开口的最小值
  domain: dfm
  stage: stackup
  severity: must
  rule: 相邻焊盘间的阻焊桥宽度 1 oz 板绿 / 红 / 黄 / 蓝 / 紫油 ≥ 0.10 mm，黑 / 白油 ≥ 0.13 mm，2 oz 板任何颜色 ≥ 0.20 mm；阻焊开口到相邻走线 ≥ 0.09 mm。桥宽做不出来的细间距焊盘改成整窗开口，不要留残缺阻焊桥。
  rationale: 阻焊桥太窄在显影时会脱落，焊接时失去防桥连作用；板厂可能自动把相邻开口合并。
  applies_to: [jlc-pcb, fine-pitch]
  parameters:
    - {name: mask_bridge_1oz_color, op: ">=", value: 0.10, unit: mm, note: "绿 / 红 / 黄 / 蓝 / 紫"}
    - {name: mask_bridge_1oz_black_white, op: ">=", value: 0.13, unit: mm}
    - {name: mask_bridge_2oz, op: ">=", value: 0.20, unit: mm}
    - {name: mask_opening_to_trace, op: ">=", value: 0.09, unit: mm}
  verify:
    - method: drc
      tool: "KiCad DRC：solder_mask_bridge 违规 + 板级阻焊最小间隙设置"
      check: "Board Setup 的 Solder mask minimum web width 设为 0.10 mm（黑白油 0.13 mm），solder_mask_bridge 违规清零，或有意识地改成整窗开口"
      automatable: full
  sources:
    - {title: "JLCPCB PCB Capabilities", url: "https://jlcpcb.com/capabilities/pcb-capabilities", publisher: JLCPCB, kind: vendor_guide, section: "Solder Mask"}
    - {title: "SLUA271 QFN and SON PCB Attachment", url: "https://www.ti.com/lit/an/slua271d/slua271d.pdf", publisher: "Texas Instruments", kind: app_note, section: "§3.5"}
  confidence: high
  conflicts: "阻焊开口扩张量：JLC 能力页写「Expansion 1:1」，footprint 博客写每边 0.05 mm，TI 对 QFN 写 NSMD 开口比焊盘大 0.1–0.14 mm（总量）。不同封装的量不同，这里只固定「桥宽 ≥ 板厂下限」，扩张量按封装逐个评审。"
  tags: [cat-feeder]

# ───────────────────────── floorplan ─────────────────────────
- id: DFM-FLR-001
  title: 为贴片预留工艺边、工装孔与 MARK 点
  domain: dfm
  stage: floorplan
  severity: should
  rule: 需要贴片的板（尤其 Standard 档）预留 ≥ 5 mm 工艺边（可随成品交付，也可事后去掉）；工艺边上放 2–3 个不金属化的工装孔（对角、尽量远）和 1 mm 直径的 MARK 点，MARK 点圆心距板边 3.85 mm。设计里不满足时 JLC 会自行加，但最好自己放好。
  rationale: 贴片线的导轨夹住板边，靠近边缘的元件会被导轨碰到而偏位或漏贴；工装孔和 MARK 点让贴片机定位。Economic 档文档写不必须，Standard 档必须。
  applies_to: [jlc-smt]
  parameters:
    - {name: process_edge_width, op: ">=", value: 5, unit: mm}
    - {name: fiducial_diameter, op: "==", value: 1.0, unit: mm, note: "铜点"}
    - {name: fiducial_center_to_panel_edge, op: ">=", value: 3.85, unit: mm}
    - {name: tooling_hole_diameter_capability_page, op: "==", value: 2, unit: mm, note: "能力页 / 工艺边页写 2 mm"}
    - {name: tooling_hole_diameter_help_article, op: "==", value: 1.152, unit: mm, note: "「如何添加工装孔」帮助页写 1.152 mm、不金属化、2–3 个、对角"}
  verify:
    - method: geometry_script
      tool: "pcbnew Python（Edge.Cuts + 封装位置）"
      check: "有工艺边时：边宽 ≥ 5 mm；2–3 个 NPTH 工装孔，位置对角；MARK 点圆心到工艺边外沿 ≥ 3.85 mm"
      automatable: partial
    - method: review
      tool: "JLC 下单页的拼板预览"
      check: "预览里工艺边与 MARK 点符合上述数值，没有被系统自动重加"
      automatable: manual
  sources:
    - {title: "How to Add Edge Rails and Fiducials for PCB Assembly Orders", url: "https://jlcpcb.com/help/article/how-to-add-edge-rails-fiducials-for-pcb-assembly-order", publisher: JLCPCB, kind: vendor_guide}
    - {title: "Design Optimization: Specifications for Adding Process Edges and Positioning Holes", url: "https://jlcpcb.com/help/article/specifications-for-adding-process-edges-and-positioning-holes", publisher: JLCPCB, kind: vendor_guide}
    - {title: "How to add tooling holes for PCB assembly order", url: "https://jlcpcb.com/help/article/How-to-add-tooling-holes-for-PCB-assembly-order", publisher: JLCPCB, kind: vendor_guide}
    - {title: "PCB Assembly Capabilities", url: "https://jlcpcb.com/capabilities/pcb-assembly-capabilities", publisher: JLCPCB, kind: vendor_guide, section: "Panelization and Delivery"}
  confidence: medium
  conflicts: "JLC 自己的文档互相矛盾（各帮助页标 2026-09-09 更新）：能力页说 Economic 档不需要边框和 MARK 点；帮助页说标准贴片必须；FAQ 又说不用自己加、JLC 会加；而 V-Cut 博客（页面标 2026-09-08）说客户自己提供 Gerber 拼板时，工装孔和 MARK 点要自己加，JLC 不会补图上没有的数据。工装孔页还写 Economic 档工装孔「是必须的」，不满足时 JLC 默认补加，与能力页对边框 / MARK 点的「不必须」口径不同。工装孔直径一处写 2 mm（能力页、工艺边页）、一处写 1.152 mm（工装孔页）。MARK 点距板边也有 3.85 mm（圆心，工艺边页 / V-Cut 博客）和 3.35 mm（含净空，边框页）两种口径。作者首单实测里，没有 MARK 点的订单无法转为 SMT。取舍：自己放 MARK 点和工艺边（不依赖系统补加），工装孔直径以最新下单页预览为准。"
  tags: [cat-feeder]

- id: DFM-FLR-002
  title: 按元件和板形选 V-cut 还是邮票孔拼板
  domain: dfm
  stage: floorplan
  severity: must
  rule: V-cut 只用于直线分板、板厚 ≥ 0.6 mm、整块拼板 70×70 至 475×475 mm 的场合，连接边宽 ≥ 3 mm（板厚 ≤ 0.8 mm 时 ≥ 5 mm）；有异形边或需要空隙的板用邮票孔：板间距 1.6 或 2 mm、连接桥宽 ≥ 4 mm（带邮票孔 5 mm）、孔径 0.5–0.8 mm、孔间距 0.2–0.3 mm。Economic 贴片要求邮票孔拼板，Standard 才支持 V-cut。
  rationale: V-cut 靠 25° 双面刀槽留约 1/3 板厚的残余，太薄的板无法承受；邮票孔桥宽不足分板时撕裂铜箔和阻焊。
  applies_to: [panelization, jlc-smt]
  parameters:
    - {name: vcut_min_board_thickness, op: ">=", value: 0.6, unit: mm}
    - {name: vcut_panel_min_size, op: ">=", value: 70, unit: mm, note: "两个方向"}
    - {name: vcut_panel_max_size, op: "<=", value: 475, unit: mm, note: "横向和纵向都有 V-cut 时"}
    - {name: vcut_connecting_edge_width, op: ">=", value: 3, unit: mm, note: "板厚 ≤ 0.8 mm 时 5 mm"}
    - {name: vcut_spacing_min, op: ">=", value: 2, unit: mm, note: "两条 V-cut 线之间，推荐 3 mm"}
    - {name: mousebite_panel_spacing, op: range, value: [1.6, 2], unit: mm}
    - {name: mousebite_tab_width, op: ">=", value: 4, unit: mm, note: "带邮票孔时 5 mm"}
    - {name: mousebite_hole_diameter, op: range, value: [0.5, 0.8], unit: mm}
    - {name: mousebite_hole_spacing, op: range, value: [0.2, 0.3], unit: mm}
  verify:
    - method: review
      tool: "JLC 下单页拼板预览 + 自写检查脚本"
      check: "按所选分板方式检查尺寸、板厚、连接边宽、孔参数是否落在上述范围；V-cut 线是否全部为直线并贯穿整块拼板"
      automatable: partial
  sources:
    - {title: "Technical Guidance: V-Cut Panelization Standards", url: "https://jlcpcb.com/blog/v-cut-panelization-standards", publisher: JLCPCB, kind: vendor_guide}
    - {title: "JLCPCB PCB Capabilities", url: "https://jlcpcb.com/capabilities/pcb-capabilities", publisher: JLCPCB, kind: vendor_guide, section: "V-Cut / Mouse Bite Panelization"}
    - {title: "PCB Assembly FAQs", url: "https://jlcpcb.com/help/article/pcb-assembly-faqs", publisher: JLCPCB, kind: vendor_guide, section: "Economic vs. standard assembly"}
  confidence: high

- id: DFM-FLR-003
  title: 高大件和应力敏感件远离分板线
  domain: dfm
  stage: floorplan
  severity: should
  rule: 高大元件和对应力敏感的元件（陶瓷电容、晶振、大体积 QFN）距 V-cut 线至少 2.0 mm（JLC 博客只给了 V-cut 的数值；邮票孔桥处来源没有给数，可参照执行）；铜箔距 V-cut 中心线 ≥ 0.4 mm（推荐 1.0 mm）。
  rationale: 分板和夹持时板材弯曲，应力集中在分板线附近，陶瓷件会裂、焊点会拉伤。
  applies_to: [panelization, ceramic-capacitor, v-cut]
  parameters:
    - {name: tall_or_stress_part_to_vcut, op: ">=", value: 2.0, unit: mm}
    - {name: copper_to_vcut_centerline_min, op: ">=", value: 0.4, unit: mm}
    - {name: copper_to_vcut_centerline_recommended, op: ">=", value: 1.0, unit: mm}
  verify:
    - method: geometry_script
      tool: "pcbnew Python"
      check: "给定 V-cut 线坐标，对所有高度 > 阈值或标记为应力敏感的封装计算本体到线的最小距离 ≥ 2.0 mm；对所有铜对象计算到线的距离 ≥ 0.4 mm"
      automatable: full
  sources:
    - {title: "Technical Guidance: V-Cut Panelization Standards", url: "https://jlcpcb.com/blog/v-cut-panelization-standards", publisher: JLCPCB, kind: vendor_guide, section: "FAQ: component keepout"}
    - {title: "SLUA271 QFN and SON PCB Attachment", url: "https://www.ti.com/lit/an/slua271d/slua271d.pdf", publisher: "Texas Instruments", kind: app_note, section: "§3.7 Board layout considerations"}
  confidence: medium

- id: DFM-FLR-004
  title: 孔、槽与异形开口的制造下限
  domain: dfm
  stage: floorplan
  severity: must
  rule: 非金属化孔 ≥ 0.50 mm；金属化槽宽 2 层板 ≥ 0.5 mm、长度 ≥ 2 倍宽度；非金属化槽宽 ≥ 1.0 mm；铜到铣边 / 铣槽 ≥ 0.2 mm；非金属化槽公差 ±0.2 mm。
  rationale: 低于下限的孔槽钻头 / 铣刀做不出；槽边铜靠得太近会在铣削时露铜或起翘。
  applies_to: [jlc-pcb, mounting-hole, slot, cutout]
  parameters:
    - {name: min_npth_diameter, op: ">=", value: 0.50, unit: mm}
    - {name: min_plated_slot_width_2layer, op: ">=", value: 0.5, unit: mm}
    - {name: plated_slot_length_over_width, op: ">=", value: 2, unit: "x"}
    - {name: min_nonplated_slot_width, op: ">=", value: 1.0, unit: mm}
    - {name: copper_to_routed_slot, op: ">=", value: 0.2, unit: mm}
    - {name: max_drill_diameter, op: "<=", value: 6.3, unit: mm, note: "能力页列出的 2 层钻孔范围上限 0.15–6.3 mm"}
  verify:
    - method: drc
      tool: "KiCad DRC：hole_size、edge_clearance、copper_edge_clearance"
      check: "NPTH hole_size min 0.5 mm，槽用 Edge.Cuts 或 NPTH 长圆孔绘制，槽边铜距离 ≥ 0.2 mm"
      automatable: full
  sources:
    - {title: "JLCPCB PCB Capabilities", url: "https://jlcpcb.com/capabilities/pcb-capabilities", publisher: JLCPCB, kind: vendor_guide, section: "Slots and Holes / Drilling / Board Outline and Routing"}
  confidence: high

- id: DFM-FLR-005
  title: 外壳与安装孔的配合要吃下制造公差
  domain: dfm
  stage: floorplan
  severity: should
  rule: 板与外壳 / 螺柱 / 连接器的配合尺寸要留出 JLC 的公差总和：外形铣边 ±0.2 mm（精密 ±0.1 mm）、V-cut ±0.4 mm、板厚 ±10%（≥ 1.0 mm）、金属化孔径 +0.13 / −0.08 mm、孔位 ±0.075 mm、非金属化槽 ±0.2 mm。
  rationale: 外壳卡位、螺柱孔和连接器开口的间隙小于公差时会装不进或受力；这类问题 DRC 发现不了，只有 3D 配合检查和公差叠加能发现。
  applies_to: [enclosure, mounting-hole, connector]
  parameters:
    - {name: outline_tolerance_routed, op: "==", value: 0.2, unit: mm, note: "常规铣边；精密 ±0.1 mm"}
    - {name: outline_tolerance_vcut, op: "==", value: 0.4, unit: mm}
    - {name: board_thickness_tolerance, op: "==", value: 10, unit: "%", note: "板厚 ≥ 1.0 mm；< 1.0 mm 为 ±0.1 mm"}
    - {name: pth_diameter_tolerance_plus, op: "==", value: 0.13, unit: mm}
    - {name: pth_diameter_tolerance_minus, op: "==", value: 0.08, unit: mm}
    - {name: hole_position_tolerance, op: "==", value: 0.075, unit: mm}
  verify:
    - method: review
      tool: "KiCad 导出 STEP + 外壳 CAD 装配检查"
      check: "把外壳与 PCB 的配合间隙逐项和公差总和比较，最小间隙 ≥ 公差叠加（最坏情况）；带天线的模块还要满足 RF 净空要求"
      automatable: manual
    - method: geometry_script
      tool: "pcbnew Python"
      check: "读取安装孔、边缘连接器位置，按公差上下限生成极限位置，检查与外壳模型（简化为矩形开口）的干涉"
      automatable: partial
  sources:
    - {title: "JLCPCB PCB Capabilities", url: "https://jlcpcb.com/capabilities/pcb-capabilities", publisher: JLCPCB, kind: vendor_guide, section: "Dimension Tolerance / Drilling / Board Thickness"}
  confidence: medium
  tags: [cat-feeder]

- id: DFM-FLR-006
  title: 元件离板边与工艺边保持足够距离
  domain: dfm
  stage: floorplan
  severity: should
  rule: 元件和 SMD 焊盘不要放进贴片线导轨会碰到的边缘带内；没有工艺边的单板，经验上按元件焊盘距板边 ≥ 3 mm 处理，MARK 点区域距板边 ≥ 3.35 mm（含其净空）。
  rationale: 导轨宽度会遮挡或碰到靠边元件，造成偏位、漏贴或返工；JLC 没有公布元件到板边的数值，只给出 5 mm 工艺边和 MARK 点的距离，3 mm 是经验值。
  applies_to: [jlc-smt]
  parameters:
    - {name: component_pad_to_board_edge, op: ">=", value: 3, unit: mm, note: "经验值，JLC 无公开数字；有 5 mm 工艺边时不受此限"}
    - {name: fiducial_clearance_to_board_edge, op: ">=", value: 3.35, unit: mm, note: "含 MARK 点净空区，JLC 官方"}
  verify:
    - method: geometry_script
      tool: "pcbnew Python"
      check: "对所有 SMD 焊盘计算到 Edge.Cuts 的最小距离，小于 3 mm 的列出；MARK 点净空区边到板边 ≥ 3.35 mm"
      automatable: full
  sources:
    - {title: "Design Optimization: Specifications for Adding Process Edges and Positioning Holes", url: "https://jlcpcb.com/help/article/specifications-for-adding-process-edges-and-positioning-holes", publisher: JLCPCB, kind: vendor_guide}
    - {title: "Fiducial Marks in PCB and SMT Assembly", url: "https://jlcpcb.com/blog/fiducial-marks", publisher: JLCPCB, kind: vendor_guide, section: "Edge distance"}
    - {ref: "作者首单 JLC SMT 的实测记录（2026-10-19，未公开笔记）", title: "作者 SMT 经验：焊盘离板边 ≥ 3 mm", publisher: "作者实测", kind: blog}
  confidence: low
  conflicts: "JLC 的能力页（未标日期）和工艺边帮助页（标 2026-09-09）都没有给出元件 / 焊盘到板边的数值；工艺边页只说工艺边不够宽时靠边元件可能撞到导轨。3 mm 不是板厂的规则，而是经验值（有 5 mm 工艺边时可放宽）。"
  tags: [cat-feeder]

