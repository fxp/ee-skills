- id: DFM-PLC-001
  title: 元件间距满足 JLC 最小间距表
  domain: dfm
  stage: placement
  severity: should
  rule: 相邻元件本体 / 焊盘外沿间距不小于 JLC 表：片式件之间 0.15–0.35 mm（0201–0402 之间 0.15，0603–0805 之间 0.18，到 1206 为 0.25，1206–1206 为 0.35）；片式件到 QFN 1.0 mm、到 QFP 0.5 mm、到 SOP 0.4 mm、到 SOT 0.2 mm、到 BGA 1.0 mm；IC 之间 SOP–SOP 0.5、SOT–SOT 0.4、QFN–QFN 1.0、QFP–QFP 1.25、BGA–BGA 2.0 mm。
  rationale: 间距要容纳锡膏印刷与钢网开口分隔、贴片机精度、AOI 检视和手工返修的操作空间。
  applies_to: [jlc-smt]
  parameters:
    - {name: chip_0201_0402_gap, op: ">=", value: 0.15, unit: mm}
    - {name: chip_0603_0805_gap, op: ">=", value: 0.18, unit: mm}
    - {name: chip_to_1206_gap, op: ">=", value: 0.25, unit: mm}
    - {name: chip_1206_to_1206_gap, op: ">=", value: 0.35, unit: mm}
    - {name: chip_to_sot_gap, op: ">=", value: 0.2, unit: mm}
    - {name: chip_to_sop_gap, op: ">=", value: 0.4, unit: mm}
    - {name: chip_to_qfp_gap, op: ">=", value: 0.5, unit: mm}
    - {name: chip_to_qfn_gap, op: ">=", value: 1.0, unit: mm}
    - {name: sot_to_sot_gap, op: ">=", value: 0.4, unit: mm}
    - {name: sop_to_sop_gap, op: ">=", value: 0.5, unit: mm}
    - {name: qfn_to_qfn_gap, op: ">=", value: 1.0, unit: mm}
  verify:
    - method: geometry_script
      tool: "pcbnew Python：按封装名分类，计算相邻封装本体矩形间的最小距离"
      check: "对所有相邻封装对查上表，实际间距 < 表值则失败；封装分类靠封装名 / 焊盘数 / 本体尺寸判定"
      automatable: partial
    - method: review
      tool: "JLC DFM / 下单预览"
      check: "对 JLC 页面最新版表格核对数值（页面表格排版易错位）"
      automatable: manual
  sources:
    - {title: "Minimum Spacing Requirements for SMD Components", url: "https://jlcpcb.com/help/article/minimum-spacing-for-smd-components", publisher: JLCPCB, kind: vendor_guide}
    - {title: "Manufacturing Insights: Reflow Soldering Principles and Precautions", url: "https://jlcpcb.com/help/article/reflow-soldering-principles-and-precautions", publisher: JLCPCB, kind: vendor_guide, section: "Designer precautions: pad spacing"}
  confidence: medium
  conflicts: "该 JLC 页面的表格在抓取后被展平，行列对应关系是推断出来的；JLC 回流原理页另写「焊盘间距至少 0.3 mm 防桥连」，与片式件间 0.15 mm 的数值口径不同（前者是元件间距，后者是焊盘间距建议）。下单前以 JLC 页面实时数值和 DFM 为准。"
  tags: [cat-feeder]

- id: DFM-PLC-002
  title: 封装 courtyard 不得重叠
  domain: dfm
  stage: placement
  severity: must
  rule: 同一面上任意两个封装的 courtyard 不重叠；courtyard 用 IPC-7351 Nominal 的 0.25 mm 外扩（回流量产默认）。
  rationale: courtyard 是装配与返修的最小净空，重叠意味着贴片机吸嘴、AOI 视角或烙铁头无法进入。
  applies_to: [kicad, smd]
  parameters:
    - {name: courtyard_to_courtyard_gap_same_side, op: qualitative, value: null, note: "本库取「不重叠」；Atlas 页写同面 courtyard 之间 ≥ 0.25 mm（Level N），见 conflicts，所以不把 0 当作出处数值"}
  verify:
    - method: drc
      tool: "KiCad DRC：courtyards_overlap，kicad-cli pcb drc"
      check: "courtyards_overlap 与 missing_courtyard 两类违规均为 0"
      automatable: full
  sources:
    - {title: "PCB Land Pattern Design: IPC-7351B Footprint Standards", url: "https://www.atlaspcb.com/blog/pcb-land-pattern-design-ipc-7351b-footprint-standards/", publisher: AtlasPCB, kind: vendor_guide, section: "Courtyard excess; Courtyard Overlap Rules"}
    - {title: "Minimum Spacing Requirements for SMD Components", url: "https://jlcpcb.com/help/article/minimum-spacing-for-smd-components", publisher: JLCPCB, kind: vendor_guide}
  confidence: low
  conflicts: "Atlas 页在「Courtyard Overlap Rules」里写同一面元件 courtyard 之间最小间隙 0.25 mm（Level N），而本规则取「不重叠即可，0.25 mm 外扩已含在 courtyard 内」；该页同一页还把 0.25 mm 写成每边外扩量，两处口径可能混用。没有读到 IPC-7351 原文，所以两种取法都不能算有出处的数值。元件之间的实际间距以 DFM-PLC-001 的 JLC 表为准。"
  tags: [cat-feeder]

- id: DFM-PLC-003
  title: 放置 3 个不对称的全局 MARK 点
  domain: dfm
  stage: placement
  severity: should
  rule: 贴片面放至少 2 个、推荐 3 个全局 MARK 点，按 L 形不对称分布、彼此尽量远；铜点直径约 1.0 mm，阻焊开口 ≥ 2 倍铜点（约 2.0 mm），开口范围内无其它铜、走线、过孔、丝印；MARK 点到板边（含净空）≥ 3.35 mm；双面贴片时两面都要放。
  rationale: 3 点不对称可以让贴片机无歧义地解出位置、旋转和板材涨缩；对称或共线则 180° 反装时无法区分；周围有铜或丝印会因反光混淆视觉相机。
  applies_to: [jlc-smt, fiducial]
  parameters:
    - {name: fiducial_count_min, op: ">=", value: 2, unit: pcs, note: "强烈推荐 3 个"}
    - {name: fiducial_copper_diameter, op: "==", value: 1.0, unit: mm}
    - {name: fiducial_mask_opening_diameter, op: ">=", value: 2.0, unit: mm, note: "至少 2 倍铜点直径"}
    - {name: fiducial_copper_free_diameter, op: ">=", value: 2.0, unit: mm, note: "与阻焊开口同大，内无其它铜 / 走线 / 过孔 / 文字"}
    - {name: fiducial_edge_clearance, op: ">=", value: 3.35, unit: mm, note: "板边到 MARK 点及其净空"}
  verify:
    - method: geometry_script
      tool: "pcbnew Python 读 MARK 点封装"
      check: "数量 ≥ 2（推荐 3）；三点两两距离互不相同（不对称）；每个点的铜径 1.0 mm、阻焊开口 ≥ 2.0 mm；2.0 mm 圆内无其它铜 / 孔 / 丝印；到 Edge.Cuts 距离 ≥ 3.35 mm"
      automatable: full
  sources:
    - {title: "Fiducial Marks in PCB and SMT Assembly", url: "https://jlcpcb.com/blog/fiducial-marks", publisher: JLCPCB, kind: vendor_guide}
    - {title: "How to Add Edge Rails and Fiducials for PCB Assembly Orders", url: "https://jlcpcb.com/help/article/how-to-add-edge-rails-fiducials-for-pcb-assembly-order", publisher: JLCPCB, kind: vendor_guide}
  confidence: high
  conflicts: "JLC 帮助页称 MARK 点「圆心距板边 ≥ 3.85 mm」（面向工艺边 / 拼板），MARK 点博客称「板边到 MARK 点含净空 ≥ 3.35 mm」。两者口径不同，一个量圆心，一个量净空边；对 1.0 mm 铜点 + 2.0 mm 净空，3.35 mm 边距对应圆心约 4.35 mm，比 3.85 mm 严。单板取更严者。"
  tags: [cat-feeder]

- id: DFM-PLC-004
  title: 细间距器件旁加局部 MARK 点
  domain: dfm
  stage: placement
  severity: consider
  rule: 引脚间距 ≤ 0.5 mm 的 QFP / QFN / BGA，在器件焊盘区对角各放 1 个局部 MARK 点（共 2 个），尺寸可沿用全局 MARK 点。
  rationale: 板材翘曲约 100 ppm 就可使远离全局 MARK 点的位置产生约 0.01 mm 量级误差，对细间距足以短路；局部 MARK 点补偿局部偏差。
  applies_to: [qfp, qfn, bga, fine-pitch]
  parameters:
    - {name: local_fiducial_pitch_threshold, op: "<=", value: 0.5, unit: mm, note: "引脚 / 球间距小于等于此值时建议放"}
    - {name: local_fiducial_count, op: "==", value: 2, unit: pcs, note: "每个器件，对角"}
  verify:
    - method: geometry_script
      tool: "pcbnew Python"
      check: "对间距 ≤ 0.5 mm 的封装，检查其对角存在 2 个 MARK 点封装且距封装边 ≤ 约 10 mm"
      automatable: partial
  sources:
    - {title: "Fiducial Marks in PCB and SMT Assembly", url: "https://jlcpcb.com/blog/fiducial-marks", publisher: JLCPCB, kind: vendor_guide, section: "Local fiducials"}
