# 验证工具目录（verifiers）——本机 macOS arm64 / KiCad 10.0.6 / uv Python 3.14，调研日期 2026-10-20。
# 记录格式见 SCHEMA.md「verifiers.yaml」；配套文档 VERIFICATION_TOOLCHAIN.md（命令与实测输出）。
#
# notes 里的标记：
#   VERIFIED  = 在本机真的跑过（命令和结果见 VERIFICATION_TOOLCHAIN.md §2）
#   DOCS      = 读过官方文档（URL 写在 notes 里），没在本机跑
#   UNVERIFIED= 只做了可用性检查（brew info / pip index versions / 网页），没读到足够细节也没跑
# 路径简写：KCLI=/Applications/KiCad/KiCad.app/Contents/MacOS/kicad-cli
#           KPY =/Applications/KiCad/KiCad.app/Contents/Frameworks/Python.framework/Versions/Current/bin/python3
#           NGLIB=/Applications/KiCad/KiCad.app/Contents/PlugIns/sim/libngspice.0.dylib
# invocation 里写的是全路径；跑 KiCad 程序前建议设 KICAD_CONFIG_HOME / KICAD_DOCUMENTS_HOME 指向私有目录（见 TOOLCHAIN §4）。

# ============================================================ KiCad：ERC / DRC / 自定义规则
- id: V-KICAD-ERC
  name: KiCad ERC (kicad-cli sch erc)
  methods: [erc]
  status: bundled
  invocation: |-
    /Applications/KiCad/KiCad.app/Contents/MacOS/kicad-cli sch erc --format json --severity-all --units mm --exit-code-violations -o erc.json cat_feeder_rev_c.kicad_sch
  inputs: [kicad_sch, kicad_pro]
  outputs: [json, report_txt]
  can_check:
    - "pin 未连接 (pin_not_connected)、输入脚无任何输出脚驱动、电源输入脚无电源输出驱动 (power_pin_not_driven)"
    - "引脚类型冲突矩阵（输出对输出、输出对电源等；矩阵存在 .kicad_pro 的 erc.pin_map）"
    - "标签悬空 (label_dangling)、仅连一个引脚的标签、导线未连接、总线/网络冲突、层次标签与 sheet pin 不匹配"
    - "重复位号、未标注 (unannotated)、同一符号不同单元值不一致、未定义 netclass、地脚没接到地网络 (ground pin not connected to ground net)"
    - "符号/封装库链接问题、符号与库副本不一致、封装与 footprint filter 不符 (footprint_filter，默认忽略)"
    - "SPICE 模型问题 (simulation_model_issue)——默认被忽略，要在 .kicad_pro 的 erc.rule_severities 里打开"
  limits:
    - "只做结构与引脚类型检查：不懂元件值、电压/电流额定、去耦是否到位、上拉/下拉是否存在、极性是否接反"
    - "结果依赖 .kicad_pro：没有 .kicad_pro 时用默认严重度；默认忽略 single_global_label、four_way_junction、simulation_model_issue、footprint_filter"
    - "JSON 里 items[].pos 坐标是原理图 mm 坐标的 1/100（实测：label 在 (30.48, 50.8) mm，JSON 写 (0.3048, 0.508)），不要用来定位，用 description/uuid"
    - "不加 --exit-code-violations 时有违规也返回 0；加了返回 5"
  notes: |-
    VERIFIED 2026-10-20：参考板原理图副本 0 violations，0.7 s。反例：在副本里删 3 根 wire 后得 6 个 error（4×pin_not_connected、1×label_dangling、1×power_pin_not_driven），加 --exit-code-violations 返回 5。
    ERC 项目清单来自官方文档 https://docs.kicad.org/10.0/en/eeschema/eeschema.html（List of ERC checks，DOCS）。
    kicad-cli 每次运行会在工程目录写 .kicad_prl。只在副本上跑。

- id: V-KICAD-DRC
  name: KiCad DRC built-in checks (kicad-cli pcb drc)
  methods: [drc]
  status: bundled
  invocation: |-
    /Applications/KiCad/KiCad.app/Contents/MacOS/kicad-cli pcb drc --format json --severity-all --all-track-errors --units mm --exit-code-violations -o drc.json cat_feeder_rev_c.kicad_pcb
  inputs: [kicad_pcb, kicad_pro, kicad_dru]
  outputs: [json, report_txt]
  can_check:
    - "电气类：不同网络铜相碰 (shorting_items)、走线交叉、间距 (clearance)、爬电 (creepage，KiCad 10 新增，需 creepage 约束)、悬空过孔与悬空走线端、未连接 (unconnected_items)、热焊盘辐条不足"
    - "制造类：板边铜距 (copper_edge_clearance)、孔壁间距 (hole_clearance)、孔与孔间距 (hole_to_hole)、孔重合、线宽 (track_width)、转角 (track_angle)、线段长度 (track_segment_length)、环宽 (annular_width)、孔径 (drill_out_of_range)、微孔孔径、铜渣、阻焊桥 (solder_mask_bridge)、铜连接过窄 (connection_width)"
    - "courtyard 重叠 (courtyards_overlap)、无 courtyard (missing_courtyard——默认 ignore，必须在 .kicad_pro 的 rule_severities 里设为 error 才会报)、courtyard/板框畸形、PTH/NPTH 落在 courtyard 内、焊盘无孔"
    - "丝印：silk_overlap、silk_over_copper（被阻焊裁切）、丝印压板边；文字高度/线粗 (text_height / text_thickness)；镜像文字；不允许的对象 (items_not_allowed)"
    - "孤岛铜、不同网络铜区相交、已禁用层上的对象、未解析文本变量、封装库不一致 (lib_footprint_issues / lib_footprint_mismatch)"
    - "原理图一致性：缺封装/多封装/重复封装、焊盘网络与原理图不符、值与字段不一致（需 --schematic-parity，见 V-KICAD-PARITY）"
  limits:
    - "板级阈值（min_clearance、min_track_width、min_via_diameter、min_copper_edge_clearance 等）和 netclass 来自 .kicad_pro；板目录里若没有 .kicad_pro，要把它拷到板旁边，否则 hasNetclass() 恒为假且出现 45 条 lib_footprint_issues"
    - "不带 --refill-zones 时用文件里存的填充，改过几何后填充是旧的；--refill-zones --save-board 会改板文件，只能用于副本"
    - "默认 ignore 的检查：missing_courtyard、track_not_centered_on_via、tuning_profile_track_geometries、footprint_filters_mismatch、footprint_type_mismatch（裸工程时）"
    - "JSON 里的实测值只在 description 字符串中（'actual 2.6300 mm'），没有数值字段，要用正则取"
    - "坐标是 KiCad 板坐标（参考板的原点相对规格坐标偏移 50 mm）"
  notes: |-
    VERIFIED 2026-10-20：参考板副本 + 从 schematic/ 拷来的 .kicad_pro，0.8 s，16 个 warning（6×silk_overlap、10×silk_over_copper），0 error，0 unconnected。
    退出码：默认 0；--exit-code-violations 时有违规返回 5（默认严重度含 warning；--severity-error 只看 error）；板文件打不开返回 3。
    JSON 顶层键：$schema, coordinate_units, date, ignored_checks[{key,description}], included_severities, kicad_version, schematic_parity[], source, unconnected_items[], violations[{description, severity, type, items[{description,pos{x,y},uuid}]}]。
    违规清单与默认严重度来自官方文档 https://docs.kicad.org/10.0/en/pcbnew/pcbnew.html（List of DRC checks，DOCS，逐条读过）。括号里的 JSON type 键只写了本机实测出现过的（clearance, track_width, via_diameter, drill_out_of_range, annular_width, length_out_of_range, skew_out_of_range, too_many_vias, hole_clearance, hole_to_hole, copper_edge_clearance, courtyards_overlap, creepage, track_angle, track_segment_length, connection_width, text_height, text_thickness, items_not_allowed, assertion_failure, silk_overlap, silk_over_copper, shorting_items, solder_mask_bridge, lib_footprint_issues）以及仓库 verify.py 使用的 track_dangling / via_dangling / unconnected_items；其余 type 键未核对。

- id: V-KICAD-DRU
  name: KiCad custom DRC rules (.kicad_dru, rule language v1)
  methods: [drc]
  status: bundled
  invocation: |-
    # 规则文件必须叫 <板文件名>.kicad_dru，放在 .kicad_pcb 与 .kicad_pro 同一目录，然后照常跑 DRC：
    /Applications/KiCad/KiCad.app/Contents/MacOS/kicad-cli pcb drc --format json --severity-all --units mm -o drc.json cat_feeder_rev_c.kicad_pcb
    # 最小规则：板上所有封装 courtyard 到板边 >= 2.5 mm（豁免安装孔 H*）
    (version 1)
    (rule "DFM-PLC-901" (layer "F.Courtyard") (constraint physical_clearance (min 2.5mm)) (condition "B.Layer == 'Edge.Cuts' && A.Type == 'Footprint' && A.Reference != 'H*'"))
  inputs: [kicad_pcb, kicad_pro, kicad_dru]
  outputs: [json]
  can_check:
    - "语法：(rule NAME [(severity error|warning|ignore|exclusion)] [(layer L|outer|inner)] [(condition \"EXPR\")] (constraint TYPE args)...)；(version 1)；规则按文件倒序求值，同一约束类型下最后一条匹配的规则胜出"
    - "约束类型（官方文档 34 个，KiCad 10.0.6 实测全部能加载，除 track_angle 的 'deg' 后缀）：annular_width, assertion, bridged_mask, clearance, connection_width, courtyard_clearance, creepage, diff_pair_gap, diff_pair_uncoupled, disallow, edge_clearance, hole_clearance, hole_size, hole_to_hole, length, min_resolved_spokes, physical_clearance, physical_hole_clearance, silk_clearance, skew, solder_mask_expansion, solder_paste_abs_margin, solder_paste_rel_margin, text_height, text_thickness, thermal_relief_gap, thermal_spoke_width, track_angle, track_segment_length, track_width, via_count, via_dangling, via_diameter, zone_connection"
    - "实测会触发并产生违规的约束 → 违规 type：clearance/physical_clearance → clearance；hole_clearance/physical_hole_clearance → hole_clearance；edge_clearance → copper_edge_clearance；courtyard_clearance → courtyards_overlap；silk_clearance → silk_overlap/silk_over_copper；track_width → track_width；via_diameter → via_diameter；hole_size → drill_out_of_range；annular_width → annular_width；hole_to_hole → hole_to_hole；length → length_out_of_range；skew → skew_out_of_range；via_count → too_many_vias；connection_width → connection_width；creepage → creepage；track_angle → track_angle；track_segment_length → track_segment_length；text_height/text_thickness → 同名；disallow → items_not_allowed；assertion → assertion_failure"
    - "只做加载测试、本板无对象触发：bridged_mask, diff_pair_gap, diff_pair_uncoupled（板上无差分对）, min_resolved_spokes, via_dangling。solder_mask_expansion, solder_paste_*_margin, thermal_relief_gap, thermal_spoke_width, zone_connection 是给填充/出图用的取值，不是检查"
    - "条件里可用：A/B 两个对象（顺序无关）、AB.isCoupledDiffPair()；属性 Type（'Pad','Track','Via','Zone','Footprint','Graphic','Text'...）、Layer、Position_X/Y（可带 mm 后缀，实测可做坐标禁布区）、NetName、NetClass（hasNetclass('X')）、Reference（支持 * ? 通配）、Library_Link、Component_Class（注意：文档里的 Value 属性在 10.0.6 条件里永不匹配，要用 getField('Value')）、Do_not_Populate、Orientation、Pad_Type、Pad_Shape、Pad_Number、Pin_Name、Pin_Type、Fabrication_Property('Heatsink pad','Test point pad','Fiducial, global to board'...)、Hole_Size_X/Y、Size_X/Y、Width、Diameter、Hole、Via_Type、Line_Width、Name(zone)"
    - "函数：intersectsArea / enclosedByArea（规则区或铜区名）、intersectsCourtyard('U1' 或 'R*' 或 '${Class:X}')、memberOfFootprint、memberOfSheet / memberOfSheetOrChildren、hasComponentClass、hasNetclass / hasExactNetclass、inDiffPair('/USB*')、isCoupledDiffPair、isPlated / isMicroVia / isBlindVia / isBuriedVia、existsOnLayer、getField('LCSC')、fromTo('U1-15','R7-2')；insideArea/insideCourtyard/memberOf 已弃用"
    - "典型可落地规则：courtyard/物理间距到板边、netclass 线宽/间距/过孔尺寸/孔径/环宽下限、某网络总长上限 (length)、同组网络长度偏差 (skew)、过孔数上限 (via_count)、禁止在某区域放过孔/封装 (disallow)、按坐标的禁布区、按 Reference/Value/Library_Link 的位号级检查 (assertion)、爬电 (creepage)、测试点间距、热焊盘必须实心连接"
  limits:
    - "语法错误会让整个 .kicad_dru 被静默丢弃：kicad-cli 返回 0、无任何报错、只报内置检查（实测：未知约束名、未知属性、引号嵌套错误、track_angle (min 135deg) 全部如此）。必须放一条金丝雀规则（对每个封装触发的 assertion）并确认它出现在结果里"
    - "同一约束类型下，文件里靠后的、条件命中的规则会完全屏蔽靠前的规则（实测：严规则放前、松规则放后 → 严规则 0 违规）。一条目录规则一次 DRC，或按条件互斥分组"
    - "违规 type 不等于规则名；用 description 里的 \"rule 'NAME'\" 反查，规则名建议直接用目录规则 ID"
    - "physical_clearance 作用在 courtyard 层时，同一个封装会出现多条记录（封装本体 + courtyard 线段，数值差一个线宽，如 2.6000 与 2.6300），要按位号去重取最小值；安装孔 H* 也会命中，需豁免"
    - "track_angle 的参数是纯数字（度）：(min 135) 可用，(min 135deg) 是语法错误；135° 的转角在 min 135 下会因舍入报 'actual 135°'"
    - "DRC 做不了的规则形状见 TOOLCHAIN §2.5：两个指定焊盘之间的欧氏距离上限（只有借 fromTo 路径长度或规则区变通）、回路面积、并行段长度/串扰、返回路径/平面分割、铜面积/密度、缝合过孔间距、网络拓扑先后顺序、需要原理图语义的关联（某 IC 引脚配了多少电容）"
    - "10.0.6 实测的属性怪癖：A.Value 永不匹配（`A.Value == '10k'` 0 命中，`A.getField('Value') == '10k'` 命中 5 个；连 `A.Value == 'MountingHole_2.2mm'` 也是 0）；A.Orientation 与无单位数比较不命中（`== 90` 与 `!= 0` 都是 0 条，`== 90deg` 11 条）——条件里角度必须带 deg 后缀，而 track_angle 的约束参数却不能带；Reference、Library_Link、Pad_Type、Pad_Shape、NetName、Position_X/Y、Hole、Type 工作正常"
    - "对象相关的文本变量（如 ${LAYER}）在规则里不能解析（官方文档）；普通工程文本变量会在求值前被文本替换"
  notes: |-
    VERIFIED 2026-10-20（参考板副本）：courtyard→板边 2.5 mm 规则 0 违规（最小实测 2.63 mm，U1），3.0 mm 规则只报 U1（actual 2.6300），3.15 mm 规则报 U1 与 SW1/SW2/SW3（3.08），与独立几何脚本量得的结果一致。
    另实测 40 余种规则片段（见 TOOLCHAIN §2.4 表），确认语法、屏蔽语义、金丝雀检测。语言参考来自官方文档 https://docs.kicad.org/10.0/en/pcbnew/pcbnew.html#custom-design-rules（DOCS，逐条读过约束、属性、函数三张表）。
    官方文档说 .kicad_dru 应由 Board Setup 的 Custom Rules 页面管理；程序生成是可行的（本次即如此），但没有命令行语法检查工具，所以靠金丝雀。

- id: V-KICAD-DRU-FROMTO
  name: DRC fromTo() path rules (routed length between two named pads)
  methods: [drc]
  status: bundled
  invocation: |-
    # 放进 <板>.kicad_dru，用同样的 kicad-cli pcb drc 运行
    (rule "PWR-PLC-904" (constraint length (max 6mm)) (condition "A.fromTo('C8-1','U1-1')"))
  inputs: [kicad_pcb, kicad_dru]
  outputs: [json]
  can_check:
    - "两个指定焊盘之间“实际走线路径”的长度上下限（只数这两个焊盘间的铜路径，不是整条网络）：去耦电容到芯片电源脚、分流电阻到检测放大器、续流二极管到电机端子的走线长度"
    - "沿某信号路径的线宽 (track_width) 与间距 (clearance)；多路径 skew 约束"
    - "位号/焊盘通配：'U1-*'、'R?-1'、仅位号 'U1'（该封装所有焊盘）；通配大小写不敏感"
  limits:
    - "量的是走线（含过孔、焊盘）铜路径长度，不是欧氏距离；两点之间必须已连通。路径只靠铺铜（如 GND 铜皮）连通时路径不唯一，结果不可靠"
    - "from 焊盘匹配到多个同网络的 to 焊盘时路径无法确定、规则不生效；pattern 要精确到每端一个焊盘"
    - "只有 length / skew / track_width / clearance / diff_pair_gap 等能和它配合"
  notes: |-
    VERIFIED 2026-10-20（参考板副本，min 极小值强制触发以读 actual）：C8-1→U1-1 路径 7.4508 mm（焊盘中心欧氏距离 7.4 mm）；C4-1→U1-1 9.6631 mm（欧氏 7.9）；C1-1→U2-3 2.3092 mm（欧氏 3.1，路径含焊盘内走线）；U3-4→R10-2 1.7585 mm；D1-2→J3-2 3.5000 mm；U1-15→R7-2 11.9752 mm，而整条 IO3 网络 50.3233 mm。
    官方文档 From-To signal path matching 一节（DOCS）。

- id: V-KICAD-DRU-RULEAREA
  name: DRC proximity via helper rule areas + assertion (placement 'within N mm of pin')
  methods: [drc, geometry_script]
  status: bundled
  invocation: |-
    # 1) 用 pcbnew 在板副本里按目标焊盘位置加一个命名规则区（脚本见 TOOLCHAIN 附录 E）
    /Applications/KiCad/KiCad.app/Contents/Frameworks/Python.framework/Versions/Current/bin/python3 -I mk_keepin.py in.kicad_pcb out.kicad_pcb U1 1 8
    # 2) .kicad_dru
    (rule decap_C8_near_U1_1 (condition "A.Type == 'Footprint' && A.Reference == 'C8'") (constraint assertion "A.intersectsArea('near_U1_1')"))
    # 3) kicad-cli pcb drc ... out.kicad_pcb
  inputs: [kicad_pcb, kicad_dru]
  outputs: [json]
  can_check:
    - "“元件必须在某焊盘/某点 R 范围内”这类最大距离规则：规则区（多边形，可近似圆）+ intersectsArea（任意部分在内）或 enclosedByArea（整体在内）"
    - "“元件必须远离某区域”（天线禁布）：规则区 + disallow footprint / track / via"
  limits:
    - "需要先用 pcbnew 往板副本里写规则区（所以实际是 geometry_script + drc 的组合）；区域形状是你定义的多边形，不是真正的圆/欧氏距离"
    - "enclosedByArea 要求整个封装包围盒都在区域内，比焊盘距离严；intersectsArea 只要求碰到"
    - "规则区要设 zone name；SetDoNotAllowTracks / Vias / ZoneFills / Pads / Footprints 五个都设 False，才不会同时变成禁布区"
  notes: |-
    VERIFIED 2026-10-20：以 U1.1 为中心 5 mm 半边长方形，C8（焊盘距 7.4 mm）→ assertion_failure；8 mm 半边长 → intersectsArea 通过，enclosedByArea 仍失败（C8 courtyard 右缘出区）。
    结论：能表达“最大距离”，但直接用 pcbnew 算焊盘间距 (V-PCBNEW-PY) 更简单、更精确；这条路适合想把检查留在 KiCad GUI 里也能看到标记的场景。

- id: V-KICAD-PARITY
  name: KiCad schematic-vs-PCB parity (kicad-cli pcb drc --schematic-parity)
  methods: [netlist_diff]
  status: bundled
  invocation: |-
    # .kicad_sch 必须与 .kicad_pcb 同名同目录（还需 sym-lib-table / fp-lib-table）
    /Applications/KiCad/KiCad.app/Contents/MacOS/kicad-cli pcb drc --schematic-parity --format json --severity-all --units mm -o drc.json cat_feeder_rev_c.kicad_pcb
  inputs: [kicad_pcb, kicad_sch, kicad_pro]
  outputs: [json]
  can_check:
    - "缺封装 (missing_footprint)、多余封装 (extra_footprint)、重复封装"
    - "焊盘网络与原理图不符 (net_conflict)"
    - "值不一致 (footprint_symbol_mismatch：Value)、属性不一致（Exclude from BOM 等）、字段不一致 (footprint_symbol_field_mismatch)"
    - "封装与符号 footprint filter 不符"
  limits:
    - "有噪声：参考板上基线就有 111 条 parity（网络名 PCB 里是 'EN'，原理图里是 '/EN'，每个焊盘一条 net_conflict；Datasheet 字段 '' vs '~'；H1–H4 安装孔 extra_footprint；TP1 的 BOM 属性）。直接用需要先归一化网络名并按 type 过滤，或与基线比差集"
    - "只比对 KiCad 认为是“同一网络”的名字，对重命名网络会误报；不输出 pin 集合级别的差异"
  notes: |-
    VERIFIED 2026-10-20：干净副本 111 条基线；人为改板（删 C12、R1.2 改到 GND、R2 值改 999k）后新增 missing_footprint(C12)、net_conflict(R1.2 GND vs /EN)、footprint_symbol_mismatch(R2 值) 三类，共 112 条，能抓到但需过滤基线噪声。
    作为 netlist_diff 的更稳做法见 V-KICAD-NETLIST（按引脚集合比较，噪声为 0）。

- id: V-KICAD-NETLIST
  name: KiCad netlist export + pin-set netlist diff (kicad-cli sch export netlist)
  methods: [netlist_diff, spice]
  status: bundled
  invocation: |-
    /Applications/KiCad/KiCad.app/Contents/MacOS/kicad-cli sch export netlist --format kicadxml -o net.xml cat_feeder_rev_c.kicad_sch
    # PCB 侧用 pcbnew 导出每个焊盘的网络（TOOLCHAIN 附录 D），再用 netlist_diff.py 比较引脚集合
    /Applications/KiCad/KiCad.app/Contents/Frameworks/Python.framework/Versions/Current/bin/python3 -I pcb_nets.py cat_feeder_rev_c.kicad_pcb pcb_nets.json
    python3 netlist_diff.py net.xml pcb_nets.json
  inputs: [kicad_sch, kicad_pcb]
  outputs: [xml, json]
  can_check:
    - "原理图每个网络的引脚集合 == PCB 同一网络的焊盘集合（按集合比，网络改名不影响，接错才报）"
    - "原理图有、PCB 没有的位号；PCB 多的位号（豁免 H*/FID*）；Value 不一致"
    - "导出格式：kicadxml、kicadsexpr、cadstar、orcadpcb2、spice、spicemodel、pads、allegro；--variant 支持变体"
    - "kicadxml 的 <net class=...> 可读出 netclass 供 hasNetclass 规则用；<comp> 含 value/footprint/fields（可做 BOM 字段检查）"
  limits:
