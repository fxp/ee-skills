- id: V-PY-TLINE-FORMULAS
  name: Python re-implementations of IPC-2221 trace width and microstrip Z0
  methods: [tline_calc]
  status: installed
  invocation: |-
    uv run python -I tl_formulas.py     # 纯 stdlib（math），公式见 VERIFICATION_TOOLCHAIN.md 附录 B
  inputs: [parameters]
  outputs: [python_values]
  can_check:
    - "IPC-2221 线宽：I=1 A、ΔT=10 °C、1 oz 外层 → 0.300 mm；内层 → 0.781 mm；2 A → 0.781 mm 外层；3 A → 1.367 mm 外层"
    - "微带阻抗（Hammerstad-Jensen 1980 准静态；IPC-2141 近似）：h=1.6 mm、εr=4.5、t=35 µm 时 w=3.0 mm → 49.5 Ω (HJ) / 49.0 Ω (IPC-2141)；反解 50 Ω 的线宽 2.945 mm"
    - "对规则：线宽下限 vs 电流（载流）、阻抗控制目标线宽"
  limits:
    - "只有公式实现，未与 KiCad PCB Calculator、场求解器或实测对照；IPC-2221 的曲线对内层/厚铜保守度未评估；没有耦合微带、带状线、共面波导、差分阻抗、损耗、色散"
    - "需要时的现成实现：scikit-rf 的 MLine/CPW 媒质类（见 V-SKRF，未安装）"
  notes: |-
    VERIFIED 2026-10-20：脚本运行，数值如上。公式出处：Hammerstad & Jensen, IEEE MTT-S 1980；IPC-2141 微带近似；IPC-2221（线宽公式 I = k·ΔT^0.44·A^0.725，k=0.048 外层/0.024 内层，A 为 mil²）。均来自文献与 KiCad 文档对 IPC-2221 的引用，未重新读标准原文。

