# ============================================================ pcbnew Python / 仓库已有工具
- id: V-PCBNEW-PY
  name: pcbnew Python in KiCad's bundled interpreter (geometry scripts)
  methods: [geometry_script]
  status: bundled
  invocation: |-
    /Applications/KiCad/KiCad.app/Contents/Frameworks/Python.framework/Versions/Current/bin/python3 -I my_check.py cat_feeder_rev_c.kicad_pcb out.json
  inputs: [kicad_pcb]
  outputs: [json]
  can_check:
    - "焊盘/封装位置、焊盘中心距、焊盘边到边的精确距离（pad.GetEffectiveShape(F_Cu).Collide(other, clearance) 对 clearance 二分，实测 C8.1↔U1.1 边距 6.225 mm，中心距 7.4 mm）"
    - "courtyard 到板边、courtyard 包围盒、板框 bbox、禁布区内元件/走线"
    - "每网络走线总长、线宽最小值、过孔数；铜区填充面积 (ZONE.GetFilledArea)、netclass 列表"
    - "回路面积代理（焊盘中心多边形 shoelace）、噪声源到敏感点距离"
    - "网络 → 焊盘集合（供 netlist_diff）、元件 Value/FPID（供 bom_check）、铜几何导出（供 IR drop 求解）"
  limits:
    - "只能在 KiCad 自带的 Python 3.9.13 里 import pcbnew；uv 的 Python 3.14 里 import 会报 dlopen 错误 (_pcbnew.so 是 cpython-39)，只能子进程 + JSON 交换"
    - "SWIG 绑定官方文档称“不稳定、随版本变”；有说法称计划在 KiCad 11 移除（未在官方 10.0 文档里找到该句，UNVERIFIED），备用方案是自写 s-expression 解析"
    - "PCB_VIA.GetWidth() 不带层参数会向 stderr 打 assert 警告（每次一行），读取通孔直径要传层参数或丢弃 stderr"
    - "必须加 -I（或 -s），否则会混入 ~/Library/Python/3.9/lib/python/site-packages 里的用户包（实测可见 boto3、google-api-* 等）"
    - "pcbnew.SaveBoard 写文件，只对副本使用；GUI 打开同一块板时绝不能写原文件"
  notes: |-
    VERIFIED 2026-10-20：python 3.9.13，pcbnew 10.0.6；$KPY -I -c 'import pcbnew' 成功；一份只读的几何审计脚本在参考板副本上跑通（0.25 s，不改动）。
    官方 API 文档 https://docs.kicad.org/doxygen-python-10.0/namespaces.html 与脚本章节（DOCS）。
    没有 numpy 等第三方包；要数值计算就导出 JSON 给 uv 的 Python 3.14 处理。

- id: V-LIBNGSPICE
  name: KiCad-bundled libngspice 45.2 driven from Python via ctypes (headless)
  methods: [spice, pi_sim, si_sim]
  status: bundled
  invocation: |-
    uv run python -I run_spice.py      # run_spice.py 用 ctypes.CDLL("/Applications/KiCad/KiCad.app/Contents/PlugIns/sim/libngspice.0.dylib")，ngSpice_Init → ngSpice_Circ(网表行数组) → ngSpice_Command("run") → ngGet_Vec_Info("v(out)")
    # 驱动代码约 45 行，见 VERIFICATION_TOOLCHAIN.md 附录 A
  inputs: [spice_netlist]
  outputs: [vectors_in_python]
  can_check:
    - ".tran 瞬态：RC 阶跃（1 kΩ/1 µF，t=τ 处 0.63212 V，误差 1e-6）、电机/LED 驱动、上电时序、过冲（与阈值比较）"
    - ".ac 小信号：滤波器截止频率与相位（159.15 Hz RC：|H|=0.7086，相位 −44.88°）、环路增益（需自行注入）、PDN 阻抗 Z(f)（电流源 1 A AC，读节点电压）"
    - ".noise：热噪声（10 kΩ：12.87 nV/√Hz，与解析 √(4kTR) 相对差 <1e-5）；.op 工作点（分压）；.meas（t63=1.000 ms）；.options temp= 温度扫描（二极管压降 −40/27/85 °C = 0.8007/0.6929/0.5966 V）"
    - "传输线反射：理想 T 线 Z0=50 Ω，负载 100 Ω，终端首次到达 0.6667 V（解析 0.5·(1+Γ)=0.6667）"
    - "XSPICE 代码模型：analog.cm 可加载（codemodel 命令返回 0）；目录里另有 digital.cm / tlines.cm / table.cm / xtradev.cm / xtraevt.cm / spice2poly.cm，仅验证了 analog.cm 加载"
  limits:
    - "kicad-cli 10.0.6 没有仿真子命令（sch 只有 erc / export / upgrade），KiCad 原理图内的仿真器是 GUI 功能；所以走的是“导出 SPICE 网表 → 自己调库”"
    - "需要自己写网表和模型：AMS1117、INA199、MOSFET 的 SPICE 模型本机没有（要用厂商提供的 .lib）；原理图 → 网表的自动流程（Sim.* 字段）未验证"
    - "库是 ngspice-45.2（KLU），不带 PySpice 那类封装；ngspice 无 .step，参数/温度/蒙特卡洛扫描要在 Python 里循环"
    - "ngSpice_Init 是进程级全局状态，同一进程里多个电路顺序跑没问题（本测试即如此），但并行要用多进程"
  notes: |-
    VERIFIED 2026-10-20：uv Python 3.14.6 + ctypes 直接加载，无需额外安装。库同时存在于 Contents/PlugIns/sim/（连带 ngspice/*.cm 代码模型目录）和 Contents/Frameworks/（同样 23460272 字节，rpath 指向 PlugIns/sim）。通用二进制 (arm64+x86_64)。RC 瞬态 526 个点耗时约 2 ms。
    另验证：100 nF/ESR 30 mΩ/ESL 0.7 nH 的 PDN 阻抗最小点 19.05 MHz、30.00 mΩ（解析 f0=19.02 MHz、ESR=30 mΩ）。
    ngspice 手册 https://ngspice.sourceforge.io/ （DOCS，说明 Homebrew 有包；本机未装，也不需要）。

