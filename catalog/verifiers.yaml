    - "--format spice 在 参考板上的输出：R/C 是带值的行（'C4 +3V3 GND 100n'），IC、连接器、开关等是 '__U1' 这类占位行，DNP 件行尾带 'DNP' 记号——不能直接喂 ngspice"
  notes: |-
    VERIFIED 2026-10-20：干净 参考板副本 diff 输出 5 类全空（退出 0）；改板副本（删 C12、R1.2 接 GND、R2=999k）输出 missing_in_pcb=[C12]、value_mismatch=[R2]、EN 与 GND 两个网络的引脚集合不一致（退出 1）。
    kicadxml 约 68 KB。

