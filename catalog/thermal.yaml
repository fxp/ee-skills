# ───────────────────────── plane_pour ─────────────────────────
- id: THM-PLN-001
  title: SOT-223 的散热铜面积要按目标 θJA 来定
  domain: thermal
  stage: plane_pour
  severity: should
  rule: SOT-223（AMS1117 一类）按目标 θJA 给 tab 配铜：以 (Tj,max − Ta,max)/PD 反推所需 θJA，再查铜面积表；不要只靠封装自带的 16 mm² 焊盘：按 Richtek 的 135 °C/W、Tj,max = 125 °C、Ta,max = 70 °C 推算，它最多只能耗散约 0.4 W（由 Richtek 数值推出）。
  rationale: 铜面积从 16 mm² 增加到 2500 mm²，θJA 可从 135 降到 50 °C/W（Richtek 数据）；TI 的 2 oz 测试里 0.0123–1 in² 使 RθJA 从约 110 降到 40 °C/W。
  applies_to: [sot-223, ams1117, ldo, dpak]
  parameters:
    - {name: ams1117_theta_ja_2500_2500_2500, op: "==", value: 55, unit: "°C/W", note: "AMS1117 表 1：顶层 2500 mm² / 背面 2500 mm² / 板 2500 mm²，1/16 英寸 FR-4，1 oz"}
    - {name: ams1117_theta_ja_1000_2500_2500, op: "==", value: 55, unit: "°C/W", note: "顶层 1000 mm²，背面 2500 mm²"}
    - {name: ams1117_theta_ja_225_2500_2500, op: "==", value: 65, unit: "°C/W", note: "顶层 225 mm²，背面 2500 mm²"}
    - {name: ams1117_theta_ja_100_2500_2500, op: "==", value: 80, unit: "°C/W", note: "顶层 100 mm²，背面 2500 mm²"}
    - {name: ams1117_theta_ja_1000_1000_1000, op: "==", value: 60, unit: "°C/W", note: "顶层 1000 mm²，背面 1000 mm²，板 1000 mm²"}
    - {name: ams1117_theta_ja_1000_0_1000, op: "==", value: 65, unit: "°C/W", note: "顶层 1000 mm²，背面 0"}
    - {name: richtek_theta_ja_16mm2, op: "==", value: 135, unit: "°C/W", note: "标准焊盘 16 mm²，2 oz 板"}
    - {name: richtek_theta_ja_100mm2, op: "==", value: 107, unit: "°C/W"}
    - {name: richtek_theta_ja_2500mm2, op: "==", value: 50, unit: "°C/W"}
    - {name: ti_sot223_pad_for_1p3w, op: ">=", value: 0.066, unit: "in2", note: "约 43 mm²，2 oz，约 1.3 W；TI 测试板 4.5 × 5 in"}
  verify:
    - method: geometry_script
      tool: "pcbnew Python：统计与 tab 焊盘直接相连的铜面积（顶层 / 底层，经过孔相连的底层面积另计）"
      check: "取表中与实际 (顶 / 底 / 板面积) 最接近且偏保守的一行的 θJA，代入 THM-ARC-003 的 PD 和 Tj 计算"
      automatable: partial
    - method: bench
      tool: "热电偶 / 热像仪"
      check: "在最大负载实测 tab 温度并与计算对比"
      automatable: manual
  sources:
    - {title: "AMS1117 datasheet", url: "https://www.handsontec.com/dataspecs/AMS1117.pdf", publisher: "Advanced Monolithic Systems", kind: datasheet, section: "Thermal Considerations, Table 1"}
    - {title: "Understanding Thermal Characteristic of SOT-223 Package (AN044)", url: "https://www.richtek.com/Design%20Support/Technical%20Document/AN044?sc_lang=en", publisher: Richtek, kind: app_note}
    - {title: "AN-1028 Maximum Power Enhancement Techniques for Power Packages", url: "https://www.ti.com/lit/pdf/snva036", publisher: "Texas Instruments", kind: app_note, section: "§3 Result, Figure 3–4"}
  confidence: high
  conflicts: "三个来源的测试板不同（AMS：1/16 英寸 FR-4，1 oz；Richtek：表中标 2 oz；TI：4.5×5 in，2 oz），数值不能混用；AMS1117 表是粗略指南，数据手册自己说需要实验确定。"
  tags: [cat-feeder]

- id: THM-PLN-002
  title: 散热铜优先放在元件面，再用过孔连到背面
  domain: thermal
  stage: plane_pour
  severity: should
  rule: 功率封装的散热铜皮优先放在元件面并与焊盘直接相连；要进一步降低热阻时，再用多个过孔把它连到背面铜皮；散热铜不一定要和器件的 tab 在电气上同网络。
  rationale: TI 的 SOT-223 实验中，铜全部放在顶面比放在底面或两面各一半的 RθJA 低 10–15 °C/W；PCB 材料在铜层之间的 L/A 比很小，所以背面或内层的地平面也能有效传热。
  applies_to: [sot-223, dpak, so-8, ldo, mosfet]
  parameters:
    - {name: top_side_copper_benefit, op: range, value: [10, 15], unit: "°C/W", note: "相比铜在底面或两面平分，同一面积"}
  verify:
    - method: geometry_script
      tool: "pcbnew Python"
      check: "功率件焊盘在元件面直接连接的铜面积 ≥ 设计目标，并存在 ≥ 2 个连到背面铜的过孔"
      automatable: partial
  sources:
    - {title: "AN-1028 Maximum Power Enhancement Techniques for Power Packages", url: "https://www.ti.com/lit/pdf/snva036", publisher: "Texas Instruments", kind: app_note, section: "§3 Result"}
    - {title: "AMS1117 datasheet", url: "https://www.handsontec.com/dataspecs/AMS1117.pdf", publisher: "Advanced Monolithic Systems", kind: datasheet, section: "Thermal Considerations"}
  confidence: high
  tags: [cat-feeder]

- id: THM-PLN-003
  title: 别在散热铜皮上垂直于热流切口
  domain: thermal
  stage: plane_pour
  severity: should
  rule: 发热件周围的散热铜皮保持连续；不得不穿过铜皮的走线 / 缝隙尽量沿热量的辐射方向走，不要垂直于热流方向切断铜皮；封装旁的铜皮尽量向外延伸。
  rationale: TI 的热像对比：垂直于热流的宽切口使同样功耗的板子温度高出 5.5 °C，平行于热流的切口只高 1.5 °C；把靠近封装的走线尽量延伸可使热阻再降约 10%（约 2 °C/W）。
  applies_to: [power, zone, exposed-pad]
  parameters:
    - {name: perpendicular_cut_temp_rise, op: "==", value: 5.5, unit: "°C", note: "TI 实验：垂直切口"}
    - {name: parallel_cut_temp_rise, op: "==", value: 1.5, unit: "°C", note: "TI 实验：平行切口"}
  verify:
    - method: geometry_script
      tool: "pcbnew Python"
      check: "以发热件焊盘为中心，统计半径 15 mm 内顶层 / 底层铜皮被走线或槽切断的弧长；切口方向与径向夹角 > 45° 的列出供评审"
      automatable: partial
    - method: bench
      tool: "热像仪"
      check: "对比有 / 无该切口的两版板温度分布"
      automatable: manual
  sources:
    - {title: "AN-2020 Thermal Design By Insight, Not Hindsight", url: "https://www.ti.com/lit/an/snva419c/snva419c.pdf", publisher: "Texas Instruments", kind: app_note, section: "§3.4 Rule 4: Avoid Breaks in the Thermal Path"}
    - {title: "AN-1520 A Guide to Board Layout for Best Thermal Resistance for Exposed Packages", url: "https://www.ti.com/lit/an/snva183b/snva183b.pdf", publisher: "Texas Instruments", kind: app_note, section: "§5.2"}
  confidence: high

# ───────────────────────── manufacturing ─────────────────────────
- id: THM-MFG-001
  title: 裸露焊盘的焊接面积与空洞要有上限并用 X 光验证
  domain: thermal
  stage: manufacturing
  severity: should
  rule: 裸露焊盘的焊接面积不低于焊盘面积的 50%（标准工艺通常 > 80%）；大功率应用中空洞率不超过 50%（25% 以内收益递减）；JLC 对 BGA / QFN / LGA 自动做 X 光并出报告，要查看报告并关注集中在电流 / 受力区域的空洞。
  rationale: 空洞等同于缺少焊接面积：AN-1520 仿真显示焊接覆盖率降到 50 / 20 / 10 / 5% 时 θJA 增大约 4 / 13 / 19 / 34%，10% 左右是拐点；覆盖率大于 50% 时变化不到 5%。
  applies_to: [qfn, son, powerpad, exposed-pad]
  parameters:
    - {name: ep_solder_area_min, op: ">=", value: 50, unit: "%", note: "TI SLMA002：最小焊接面积；标准工艺通常 > 80%"}
    - {name: ep_void_max_high_power, op: "<=", value: 50, unit: "%", note: "TI SLUA271 偏好的上限；JEDEC 高 K 板上 25% 为收益递减点"}
    - {name: ep_void_diminishing_returns, op: "<=", value: 25, unit: "%"}
    - {name: theta_ja_increase_at_50pct_coverage, op: "==", value: 4, unit: "%", note: "AN-1520 仿真，中心集中的焊接区域"}
    - {name: theta_ja_increase_at_10pct_coverage, op: "==", value: 19, unit: "%"}
  verify:
    - method: bench
      tool: "JLC X-Ray Report（订单历史 → 生产进度）或自有 X 光"
      check: "散热焊盘的焊接面积 ≥ 50%，最好 ≥ 75%；单个大空洞（例如 > 25% 焊点面积）或集中在电流路径上的空洞要说明或返工"
      automatable: manual
    - method: thermal_sim
      tool: "THM-ARC-002 计算"
      check: "用 θJA 增加 4–19% 的悲观值重算 Tj，仍然满足限值"
      automatable: full
  sources:
    - {title: "SLMA002 PowerPAD Thermally Enhanced Package", url: "https://www.ti.com/lit/an/slma002h/slma002h.pdf", publisher: "Texas Instruments", kind: app_note, section: "Assembly: solder joint inspection"}
    - {title: "SLUA271 QFN and SON PCB Attachment", url: "https://www.ti.com/lit/an/slua271d/slua271d.pdf", publisher: "Texas Instruments", kind: app_note, section: "§4.4 Exposed-Pad Stencil Design"}
    - {title: "AN-1520 A Guide to Board Layout for Best Thermal Resistance for Exposed Packages", url: "https://www.ti.com/lit/an/snva183b/snva183b.pdf", publisher: "Texas Instruments", kind: app_note, section: "§5.2"}
    - {title: "X-Ray Inspection Report Interpretation Guide", url: "https://jlcpcb.com/help/article/x-ray-inspection-report-interpretation-guide", publisher: JLCPCB, kind: vendor_guide}
    - {title: "PCB Assembly Capabilities", url: "https://jlcpcb.com/capabilities/pcb-assembly-capabilities", publisher: JLCPCB, kind: vendor_guide, section: "Placement, Reflow, and Inspection (X-ray)"}
  confidence: high
  conflicts: "TI 两份文档的空洞要求不同：SLMA002 要求焊接面积 ≥ 50%，SLUA271 要求空洞 ≤ 50%（两者等价），并说在 JEDEC 高 K 板上 25% 为收益递减点。JLC X 光指南只用「大于 25%」举例，并没有给出按封装区分的合格判据。"

# ───────────────────────── verification ─────────────────────────
- id: THM-VER-001
  title: 由外壳温度推结温用 ψJT，不用 θJC
  domain: thermal
  stage: verification
  severity: should
  rule: 想从实测的封装顶面中心温度推算结温时用 Tj = Tc + ψJT × P（塑封件的 ψJT 通常 0.5–2 °C/W），或由板温用 Tj = Tboard + ψJB × P；不要用 Tc + θJC × P，也不要用 θJA = θJC + θCA 的串联。
  rationale: 塑封器件 60–95% 的热量经 PCB 散出而不是顶面，用 θJC（典型 4–15 °C/W）会高估结温；ψJT 是在与实际应用相近的热流分配下测的，更接近真实。
  applies_to: [plastic-package, all-ics]
  parameters:
    - {name: psi_jt_plastic_typical, op: range, value: [0.5, 2], unit: "°C/W"}
    - {name: theta_jc_plastic_typical, op: range, value: [4, 15], unit: "°C/W"}
    - {name: heat_via_pcb_fraction, op: range, value: [60, 95], unit: "%", note: "ψJB 文中为 75–95%"}
  verify:
    - method: bench
      tool: "热电偶 / 热像仪 + 数据手册 ψJT / ψJB"
      check: "测顶面中心温度 Tc，Tj = Tc + ψJT × P；与 THM-ARC-002 的计算结果对比"
      automatable: manual
  sources:
    - {title: "SPRA953 Semiconductor and IC Package Thermal Metrics", url: "https://www.ti.com/lit/an/spra953d/spra953d.pdf", publisher: "Texas Instruments", kind: app_note, section: "§2.2, §3, §5"}
  confidence: high

- id: THM-VER-002
  title: 测外壳温度的方法要避免热电偶散热误差
  domain: thermal
  stage: verification
  severity: should
  rule: 用热电偶测封装顶面温度时，用 36–40 号细线（J 或 K 型），位置在封装表面中心（±1 mm），热导环氧小珠 ≤ 2 × 2 mm，线沿封装对角线走到 PCB 并在板面上贴行至少 25 mm 再抬起，不用胶带直接贴；热像仪必须按表面发射率修正；红外测温枪视场最大约 4 mm 且不适合测 ψJB。
  rationale: 粗线热电偶会把被测点「吸冷」，使环境到表面的温差少测 50% 以上，错误范围 5–50%；发射率未修正的红外读数也不可信。
  applies_to: [thermal-measurement]
  parameters:
    - {name: thermocouple_gauge_max_thickness, op: ">=", value: 36, unit: AWG, note: "36 号或更细（数字更大更细）"}
    - {name: epoxy_bead_max, op: "<=", value: 2, unit: mm, note: "2 × 2 mm 以内"}
    - {name: wire_dress_length_on_pcb, op: ">=", value: 25, unit: mm}
    - {name: center_placement_tolerance, op: "<=", value: 1, unit: mm}
  verify:
    - method: bench
      tool: "细线热电偶 + 热像仪"
      check: "测量方法记录满足上述要求；热像仪读数用已知温度的参考点（如热电偶测值）校准发射率"
      automatable: manual
  sources:
    - {title: "SPRA953 Semiconductor and IC Package Thermal Metrics", url: "https://www.ti.com/lit/an/spra953d/spra953d.pdf", publisher: "Texas Instruments", kind: app_note, section: "§3.1 Case Temperature Measurement; §5.1"}
  confidence: high

- id: THM-VER-003
  title: MOSFET 结温可用体二极管压降法做电学测量
  domain: thermal
  stage: verification
  severity: consider
  rule: 需要验证 MOSFET 实际结温时，可用体二极管压降法：先标定二极管压降随温度的斜率 K（功率 MOSFET 约 2.2 mV/°C），再在功率脉冲结束后约 30 µs 测量体二极管压降（小电流，TI 用 10 mA），由压降变化换算结温。
  rationale: 结点温度无法直接用热电偶测量；体二极管压降是半导体结自身的温度传感器，是 JEDEC/MIL 方法的基础。
  applies_to: [mosfet, ao3400a]
  parameters:
    - {name: body_diode_k_factor, op: "==", value: 2.2, unit: "mV/°C", note: "TI 称大多数功率 MOSFET 约此值；应逐器件标定"}
    - {name: diode_sense_current, op: "==", value: 10, unit: mA, note: "TI 测试用"}
    - {name: measure_delay_after_pulse, op: "==", value: 30, unit: us}
  verify:
    - method: bench
      tool: "可编程电源 + 示波器/数字万用表 + 恒温箱"
      check: "标定 K；加功率脉冲后在 30 µs 内读体二极管压降；ΔVSD / K 得到 ΔTj"
      automatable: manual
  sources:
    - {title: "AN-1028 Maximum Power Enhancement Techniques for Power Packages", url: "https://www.ti.com/lit/pdf/snva036", publisher: "Texas Instruments", kind: app_note, section: "Appendix B Thermal Measurement"}
  confidence: medium
  tags: [cat-feeder]

- id: THM-VER-004
  title: 在最坏工况、盖好外壳后做稳态热测试
  domain: thermal
  stage: verification
  severity: should
  rule: 热验证在最高环境温度（可用恒温箱或加热）、最高输入电压、最大负载（Wi-Fi 峰值 / 电机堵转）、外壳盖好的稳态下进行；记录环境温度的测点位置，并给出每个发热件的实测温度与计算结温的对照。
  rationale: 热相互作用和外壳影响很难纯靠计算得到，AMS1117 数据手册也说明需要实验确定；环境温度测点不同会得到不同的「环境温度」，必须统一。
  applies_to: [thermal-verification, enclosure]
  verify:
    - method: bench
      tool: "热电偶多通道记录仪 + 热像仪"
      check: "稳态（温度变化 < 1 °C / 10 min）后记录发热件温度、局部空气温度；所有器件按 THM-VER-001 换算的 Tj ≤ Tj,max − 余量"
      automatable: manual
  sources:
    - {title: "AMS1117 datasheet", url: "https://www.handsontec.com/dataspecs/AMS1117.pdf", publisher: "Advanced Monolithic Systems", kind: datasheet, section: "Thermal Considerations"}
    - {title: "SPRA953 Semiconductor and IC Package Thermal Metrics", url: "https://www.ti.com/lit/an/spra953d/spra953d.pdf", publisher: "Texas Instruments", kind: app_note, section: "§7 Ambient Air Temperature"}
  confidence: medium
  conflicts: "稳态判据（温度变化 < 1 °C / 10 min）是本库的实用建议，不是来源规定的数值。"
  tags: [cat-feeder]

- id: THM-VER-005
  title: 先用热阻网络手算，再决定是否做 FEM
  domain: thermal
  stage: verification
  severity: consider
  rule: 布局前后都用热阻网络做第一遍估算：把 1 cm 方块的铜横向热阻、FR-4 垂直热阻、过孔热阻和表面对流热阻搭成网络，估算 θCA 和板温；余量不足或几何复杂时再用 FEM。
  rationale: 电阻网络计算快，足以决定板面积、是否需要气流或散热器；TI 推荐先用该模型，再用有限元做细化。
  applies_to: [thermal-sim]
  parameters:
    - {name: theta_cu_1cm_square_1oz, op: "==", value: 71.4, unit: "°C/W", note: "1 cm × 1 cm，1 oz 铜横向，λ = 4 W/(cm·°C)"}
    - {name: theta_sa_1cm_square_natural, op: "==", value: 1000, unit: "°C/W", note: "1 cm² 板面到环境，自然对流 h = 0.001 W/(cm²·°C)"}
    - {name: theta_fr4_1cm_square, op: "==", value: 13.9, unit: "°C/W", note: "1 cm² FR-4 厚 0.032 cm 垂直方向"}
    - {name: theta_via_12mil, op: "==", value: 261, unit: "°C/W", note: "同 THM-RTE-003"}
  verify:
    - method: thermal_sim
      tool: "Python 脚本搭建热阻网络（节点 = 1 cm 方块）"
      check: "输出每个发热件的 θJA,effective 与 Tj；与 THM-ARC-002 要求比较，并与实测 THM-VER-004 校准系数"
      automatable: partial
  sources:
    - {title: "AN-2020 Thermal Design By Insight, Not Hindsight", url: "https://www.ti.com/lit/an/snva419c/snva419c.pdf", publisher: "Texas Instruments", kind: app_note, section: "§1, §2, Table 1"}
  confidence: high
  tags: [cat-feeder]
