# 热设计规则库（面向 2 层板、AMS1117 / SOT-223、N-MOSFET、裸露焊盘封装）。
# 数值来自 TI SPRA953 / AN-2020 / AN-1520 / AN-1028 / SLMA002 / SLUA271、AMS1117 与 AO3400A 数据手册等，均实际读过原文。
# 缺口：LED 降额、电感 / 二极管温升、晶振与精密器件的热梯度、IEC/JEDEC 标准原文（JESD51 系列无公开全文，只能转引 TI 的说明）。

# ───────────────────────── architecture ─────────────────────────
- id: THM-ARC-001
  title: 数据手册的 θJA 只对它的测试板成立
  domain: thermal
  stage: architecture
  severity: must
  rule: 不要把数据手册的 θJA 直接代入自己的板子算结温；每次引用 θJA 都记下它的测试板条件（JESD51 的 1s / 2s2p、尺寸、铜厚、气流），再用实测或建模得到自己板子的有效 θJA（θJA,effective）。
  rationale: θJA 不是封装的固有属性。JEDEC 静止空气下 70–95% 的热量经测试板散出，测试板就是散热器；板子设计对 θJA 的影响强度约 100%，远大于环境温度（7%）和功耗（3%）。
  applies_to: [all-ics, ldo, mosfet]
  parameters:
    - {name: heat_fraction_through_pcb, op: range, value: [70, 95], unit: "%", note: "JEDEC 静止空气测试里经测试板散出的比例"}
    - {name: theta_ja_1s_vs_2s2p_variation, op: "<=", value: 50, unit: "%", note: "同一封装仅因 1s 与 2s2p 测试板不同，θJA 可差到约 50%"}
  verify:
    - method: review
      tool: "BOM 器件热数据表"
      check: "对每个功耗 > 0.1 W 的器件，表中记录 θJA 值及其测试板条件（来自数据手册脚注）；没有条件说明的 θJA 标记为不可信"
      automatable: manual
    - method: thermal_sim
      tool: "热阻网络估算（见 THM-VER-005）或实测"
      check: "得到自己板子的 θJA,effective 并用于 THM-ARC-002 的结温计算"
      automatable: partial
  sources:
    - {title: "SPRA953 Semiconductor and IC Package Thermal Metrics", url: "https://www.ti.com/lit/an/spra953d/spra953d.pdf", publisher: "Texas Instruments", kind: app_note, section: "§1 RθJA, §1.1 Usage, Table 1-1"}
    - {title: "AN-2020 Thermal Design By Insight, Not Hindsight", url: "https://www.ti.com/lit/an/snva419c/snva419c.pdf", publisher: "Texas Instruments", kind: app_note, section: "§2"}
    - {title: "AO3400A 30V N-Channel MOSFET datasheet", url: "https://www.aosmd.com/res/data_sheets/AO3400A.pdf", publisher: "Alpha and Omega Semiconductor", kind: datasheet, section: "Thermal Characteristics, note A"}
    - {title: "JESD51 series (Methods for measuring thermal characteristics of IC packages)", ref: "JEDEC JESD51-1, -2, -5, -6, -7", publisher: JEDEC, kind: standard}
  confidence: high
  tags: [cat-feeder]

- id: THM-ARC-002
  title: 在最高环境温度下算每个发热件的结温
  domain: thermal
  stage: architecture
  severity: must
  rule: 对每个功耗显著的器件按 Tj = Ta,max + P × θJA,effective 计算结温，Ta,max 取外壳内最高环境（不是室温），Tj 必须低于数据手册允许的最高结温并留设计余量；数据手册的额定功率 / 电流是在 25 °C 下给的，要按 Ta,max 降额。热关断阈值只是保护，不是设计余量。
  rationale: 可靠性取决于结温而不是环境温度；功率额定值随环境温度升高而下降。例如 AO3400A 的 PD 在 25 °C 为 1.4 W，70 °C 降为 0.9 W；AMS1117 的结温上限为 125 °C，而热关断在约 165 °C 才触发。
  applies_to: [ldo, mosfet, all-ics]
  parameters:
    - {name: ams1117_tj_max, op: "<=", value: 125, unit: "°C", note: "数据手册：最高结温不得超过 125 °C"}
    - {name: ams1117_thermal_shutdown, op: "==", value: 165, unit: "°C", note: "保护阈值，不作为设计余量"}
    - {name: ao3400a_tj_max, op: "<=", value: 150, unit: "°C"}
    - {name: ao3400a_pd_25c, op: "==", value: 1.4, unit: W, note: "基于 θJA ≤ 10 s 值与 1 in² 2 oz 铜板"}
    - {name: ao3400a_pd_70c, op: "==", value: 0.9, unit: W}
    - {name: tj_design_margin, op: qualitative, value: null, note: "余量取多少没有统一规定；邻近元件的额定温度可能比器件本身更严（见 THM-PLC-001）"}
  verify:
    - method: thermal_sim
      tool: "Python 脚本：器件功耗表 + θJA,effective + Ta,max"
      check: "对每个器件计算 Tj，要求 Tj ≤ Tj,max − 余量；列出余量最小的 3 个器件"
      automatable: full
    - method: bench
      tool: "热电偶 / 热像仪（见 THM-VER-001、THM-VER-002）"
      check: "在 Ta,max 与最大负载下实测外壳温度并换算 Tj，与计算值相差应能解释"
      automatable: manual
  sources:
    - {title: "SPRA953 Semiconductor and IC Package Thermal Metrics", url: "https://www.ti.com/lit/an/spra953d/spra953d.pdf", publisher: "Texas Instruments", kind: app_note, section: "§6, §7 (operating temperature definitions)"}
    - {title: "AMS1117 datasheet", url: "https://www.handsontec.com/dataspecs/AMS1117.pdf", publisher: "Advanced Monolithic Systems", kind: datasheet, section: "Absolute Maximum Ratings; Thermal Considerations"}
    - {title: "AO3400A 30V N-Channel MOSFET datasheet", url: "https://www.aosmd.com/res/data_sheets/AO3400A.pdf", publisher: "Alpha and Omega Semiconductor", kind: datasheet, section: "Absolute Maximum Ratings"}
    - {title: "AN-1028 Maximum Power Enhancement Techniques for Power Packages", url: "https://www.ti.com/lit/pdf/snva036", publisher: "Texas Instruments", kind: app_note, section: "§2 Theory, eq. 1"}
  confidence: high
  tags: [cat-feeder]

- id: THM-ARC-003
  title: 线性稳压器的功耗按最坏输入电压和最大电流算
  domain: thermal
  stage: architecture
  severity: must
  rule: LDO（含 AMS1117）的功耗 PD = (Vin − Vout) × Iout，取最高输入电压与最大负载电流；由 (Tj,max − Ta,max)/PD 得到允许的 θJA，大于板子能实现的 θJA 时，加铜皮、降低输入电压（前级降压 / 压降电阻）或换开关稳压器。
  rationale: LDO 把压差全部变成热。AMS1117 在 SOT-223 上数据手册 θJA 约 90 °C/W（46 到 >90 °C/W，取决于铜皮和安装），结温上限 125 °C，裕量很容易被吃光。
  applies_to: [ldo, ams1117, sot-223]
  parameters:
    - {name: ams1117_theta_jc_tab, op: "==", value: 15, unit: "°C/W", note: "结到散热片（tab）"}
    - {name: ams1117_sot223_theta_ja_datasheet, op: "==", value: 90, unit: "°C/W", note: "带星号：可从 46 变到 >90，取决于铜皮和安装方式"}
    - {name: ams1117_theta_ja_best_case, op: ">=", value: 45, unit: "°C/W", note: "数据手册称总热阻可低至 45 °C/W，需要大的 PCB 并至少一层铜皮散热"}
  verify:
    - method: thermal_sim
      tool: "Python / 表格"
      check: "PD = (Vin_max − Vout) × Iout_max；θJA,needed = (125 − Ta,max)/PD；要求 θJA,needed ≥ 板子 θJA,effective（见 THM-PLN-001 的铜皮面积表）"
      automatable: full
    - method: bench
      tool: "热电偶贴 tab / 热像仪"
      check: "在最高输入电压、最大负载（Wi-Fi 峰值）下实测 tab 温度，再按 Tj = Ttab + PD × 15 °C/W 估算结温"
      automatable: manual
  sources:
    - {title: "AMS1117 datasheet", url: "https://www.handsontec.com/dataspecs/AMS1117.pdf", publisher: "Advanced Monolithic Systems", kind: datasheet, section: "Absolute Maximum Ratings; Thermal Considerations"}
    - {title: "Understanding Thermal Characteristic of SOT-223 Package (AN044)", url: "https://www.richtek.com/Design%20Support/Technical%20Document/AN044?sc_lang=en", publisher: Richtek, kind: app_note}
  confidence: high
  conflicts: "不同厂家的 AMS1117 / 1117 系列数据手册给出的 SOT-223 θJA 差别很大（88、117、136、150 °C/W 都出现过）。以所选料号对应厂家的数据手册为准，并按自己板子的铜皮面积估算；不要用一个通用数字。"
  tags: [cat-feeder]

- id: THM-ARC-004
  title: 2 层板上预期 θJA 比 4 层测试板的数据差
  domain: thermal
  stage: architecture
  severity: should
  rule: 数据手册的 θJA 来自 4 层高 K 板（JEDEC 2s2p / JESD51-7）时，2 层板上的有效 θJA 预期更高；没有 1s 值可用时，计算按 θJA 增大约 30–50% 取悲观值，并用实测修正。
  rationale: TI 称裸露焊盘封装的 θJA 基于带过孔的 4 层高 K 板；JEDEC 1s 与 2s2p 对同一封装可差约 50%，而 4 层内部地平面可把一块设计良好的 2 层板再改善最多约 30%。
  applies_to: [2-layer, qfn, exposed-pad, sot-223]
  parameters:
    - {name: theta_ja_penalty_2layer_vs_2s2p, op: range, value: [1.3, 1.5], unit: "x", note: "由 30% 与 50% 两个来源数字推出，并非原文直接给出的倍数；confidence 因而取 medium"}
  verify:
    - method: thermal_sim
      tool: "热阻网络估算（THM-VER-005）或实测"
      check: "对 2 层板上的主要发热件，用悲观 θJA（数据手册值 × 1.3–1.5）重算 THM-ARC-002，仍满足 Tj 限值，或改用 1s / 实测值"
      automatable: partial
  sources:
    - {title: "SLUA271 QFN and SON PCB Attachment", url: "https://www.ti.com/lit/an/slua271d/slua271d.pdf", publisher: "Texas Instruments", kind: app_note, section: "§3.4"}
    - {title: "SPRA953 Semiconductor and IC Package Thermal Metrics", url: "https://www.ti.com/lit/an/spra953d/spra953d.pdf", publisher: "Texas Instruments", kind: app_note, section: "§1.2 Test Card Impact"}
    - {title: "AN-2020 Thermal Design By Insight, Not Hindsight", url: "https://www.ti.com/lit/an/snva419c/snva419c.pdf", publisher: "Texas Instruments", kind: app_note, section: "§3.1"}
  confidence: medium
  tags: [cat-feeder]

- id: THM-ARC-005
  title: 高海拔使用时放大 θJA
  domain: thermal
  stage: architecture
  severity: consider
  rule: 产品可能在高海拔使用时，把海平面测得 / 给出的 θJA 乘以海拔系数：3000 ft 约 1.1、5000 ft 约 1.14、7000 ft 约 1.17、8350 ft 约 1.2。
  rationale: 空气变稀使对流散热变差；IBM 的研究显示 8000 ft 处器件会比海平面热约 20%。
  applies_to: [altitude]
  parameters:
    - {name: altitude_factor_3000ft, op: "==", value: 1.1, unit: "x"}
    - {name: altitude_factor_5000ft, op: "==", value: 1.14, unit: "x"}
    - {name: altitude_factor_7000ft, op: "==", value: 1.17, unit: "x"}
    - {name: altitude_factor_8350ft, op: "==", value: 1.2, unit: "x"}
  verify:
    - method: thermal_sim
      tool: "热阻网络估算脚本"
      check: "把 θJA,effective 乘上目标海拔系数后重算 Tj，仍满足 THM-ARC-002"
      automatable: full
  sources:
    - {title: "SPRA953 Semiconductor and IC Package Thermal Metrics", url: "https://www.ti.com/lit/an/spra953d/spra953d.pdf", publisher: "Texas Instruments", kind: app_note, section: "§1.5 Altitude, Table 1-2"}
  confidence: high

- id: THM-ARC-006
  title: MOSFET 导通损耗按热态 Rds(on) 算
  domain: thermal
  stage: architecture
  severity: must
  rule: MOSFET 导通损耗 P = I² × Rds(on)，Rds(on) 取工作结温下、与实际栅压对应的最大值（不是 25 °C 典型值）；数据手册给出的热阻（以及与之关联的电流、功耗额定值）基于其测试板，换板后重新核算。
  rationale: Rds(on) 随结温上升（AO3400A VGS = 10 V：25 °C 时典型 18 mΩ、最大 26.5 mΩ，125 °C 时典型 28 mΩ、最大 38 mΩ）；其 θJA 是在 1 in² 2 oz 铜 FR-4 板上测的（稳态典型 100、最大 125 °C/W），功耗额定值由该热阻推出（5.7 A 的连续电流额定值与之关联）。
  applies_to: [mosfet, motor-driver, ao3400a]
  parameters:
    - {name: ao3400a_rds_on_hot_over_cold, op: range, value: [1.43, 1.56], unit: "x", note: "由数据手册 125 °C 与 25 °C 的最大 / 典型值之比推出（38/26.5、28/18）"}
    - {name: ao3400a_rds_on_vgs_2p5v_max, op: "<=", value: 48, unit: mOhm, note: "25 °C，VGS = 2.5 V，ID = 3 A；栅极由 3.3 V 驱动时，按 2.5 V 行取保守值"}
    - {name: ao3400a_theta_ja_steady_max, op: "==", value: 125, unit: "°C/W", note: "稳态最大，1 in² 2 oz 铜 FR-4 板"}
  verify:
    - method: thermal_sim
      tool: "Python 脚本：I²·Rds(on)(Tj) 与 Tj = Ta + P·θJA 迭代"
      check: "例：2 A、热态 Rds(on) 约 48 mΩ × 1.4 ≈ 67 mΩ → P ≈ 0.27 W；θJA 125 °C/W 时温升约 34 °C；叠加 Ta,max 后 Tj < 150 °C 并有余量"
      automatable: full
    - method: bom_check
      tool: "器件数据手册表"
      check: "数据手册热阻所依赖的测试板（铜面积、铜厚）与自己板子对比，不一致时降额"
      automatable: manual
  sources:
    - {title: "AO3400A 30V N-Channel MOSFET datasheet", url: "https://www.aosmd.com/res/data_sheets/AO3400A.pdf", publisher: "Alpha and Omega Semiconductor", kind: datasheet, section: "Electrical Characteristics RDS(ON); Thermal Characteristics notes A, D"}
    - {title: "AN-1028 Maximum Power Enhancement Techniques for Power Packages", url: "https://www.ti.com/lit/pdf/snva036", publisher: "Texas Instruments", kind: app_note, section: "§2, Appendix A"}
  confidence: high
  tags: [cat-feeder]

- id: THM-ARC-007
  title: 电机堵转 / 启动的脉冲要对照 MOSFET SOA
  domain: thermal
  stage: architecture
  severity: consider
  rule: 对电机堵转、启动冲击等脉冲电流，在 MOSFET 的 SOA 曲线上按脉宽和电压核对工作点；注意 SOA 曲线是单脉冲、在其测试板热阻下得到的，重复脉冲或换板要降额。
  rationale: SOA 曲线基于特定板的结到环境热阻和 Tj,max；板子散热更差、脉冲重复时，实际可用区域更小。
  applies_to: [mosfet, motor-driver, ao3400a]
  verify:
    - method: review
      tool: "数据手册 SOA 曲线 + 电机堵转电流测量"
      check: "在示波器上测堵转电流与持续时间，落在 SOA 曲线对应脉宽的下方并有余量；固件应有限流或超时保护"
      automatable: manual
    - method: spice
      tool: "ngspice + 厂商 MOSFET 热子电路模型（如有）"
      check: "堵转瞬态下 Tj 峰值 < Tj,max"
      automatable: partial
  sources:
    - {title: "AO3400A 30V N-Channel MOSFET datasheet", url: "https://www.aosmd.com/res/data_sheets/AO3400A.pdf", publisher: "Alpha and Omega Semiconductor", kind: datasheet, section: "Thermal Characteristics note F (SOA curve)"}
  confidence: low
  conflicts: "本库只读到该数据手册对 SOA 曲线的脚注（单脉冲、基于其热阻测试板），没有找到关于电机类负载 SOA 评估方法的更权威来源，因此 confidence 为 low。"
  tags: [cat-feeder]

- id: THM-ARC-008
  title: 铝电解电容按本体温度算寿命并远离热源
  domain: thermal
  stage: architecture
  severity: should
  rule: 估算电解电容的寿命时用电容本体的实际温度（局部环境温度加纹波电流自热），而不是整机环境温度；工作温度每降低 10 °C，寿命大约翻倍；选额定温度高一档（如 105 °C）的型号，并避免放在 LDO、MOSFET、电感等热源旁。
  rationale: 非固态铝电解电容的电解液蒸发遵循 Arrhenius 规律，寿命强烈依赖芯子温度，纹波电流自热又会进一步抬高芯子温度；「10 °C 法则」是各厂家通用的估算方法。
  applies_to: [electrolytic-capacitor, bulk-capacitor]
  parameters:
    - {name: life_doubling_per_delta_t, op: "==", value: 10, unit: "°C", note: "寿命每降 10 °C 翻倍（10-degree rule）；来自二手资料对各厂家方法的归纳"}
  verify:
    - method: bom_check
      tool: "电容数据手册寿命曲线 / 厂商寿命计算器（如 TDK AlCap）"
      check: "输入局部环境温度、纹波电流与额定纹波比，得到的预期寿命满足产品寿命要求"
      automatable: partial
    - method: bench
      tool: "热电偶贴电容外壳"
      check: "满载稳态时电容外壳温度比额定上限低至少 10–20 °C（具体按寿命目标）"
      automatable: manual
  sources:
    - {title: "Aluminum electrolytic capacitors: General technical information", url: "https://www.tdk-electronics.tdk.com/blob/185386/download/4/pdf-generaltechnicalinformation.pdf", publisher: "TDK Electronics (EPCOS)", kind: vendor_guide, section: "§4 Ripple current / §5 Useful life"}
    - {title: "Electrolytic capacitor (Lifetime and the 10-degree rule)", url: "https://en.wikipedia.org/wiki/Electrolytic_capacitor", publisher: Wikipedia, kind: blog, section: "Lifetime"}
  confidence: medium
  conflicts: "没能读到 Nichicon / Panasonic / Rubycon 等厂家的原版寿命文档（均无法获取），翻倍规则的出处只有 Wikipedia 对各厂家方法的归纳；TDK 文档确认了 Arrhenius 关系和芯子温度决定寿命，但页面里没有直接写出 10 °C 翻倍的数字。"
  tags: [cat-feeder]

# ───────────────────────── library ─────────────────────────
- id: THM-LIB-001
  title: 带裸露焊盘的封装必须有等大的散热焊盘并焊在板上
  domain: thermal
  stage: library
  severity: must
  rule: 所有带裸露散热焊盘（QFN、SON、PowerPAD、模块底部地焊盘）的封装，PCB 上的散热焊盘做成与封装裸露焊盘等大（TQFP 类按数据手册的最大尺寸）；散热焊盘与引脚焊盘间距 ≥ 0.2 mm；该焊盘必须焊接到板上，不能省略。
  rationale: 数据手册的热性能以焊接状态为前提，不焊接则热量排不出去，影响性能和可靠性。
  applies_to: [qfn, son, powerpad, exposed-pad, module]
  parameters:
    - {name: ep_land_to_lead_pad_gap, op: ">=", value: 0.2, unit: mm, note: "TI：经验表明 0.2 mm 对大多数设计足够，防桥连"}
    - {name: chip_ground_pad_min_vias, op: ">=", value: 9, unit: pcs, note: "Espressif 对芯片底部地焊盘的要求（至少 9 个地过孔）；模块的地焊盘以模块规格书为准"}
  verify:
    - method: geometry_script
      tool: "pcbnew Python"
      check: "对每个带 EP 的封装，PCB 上散热焊盘面积与数据手册裸露焊盘面积之比在 0.95–1.0；与最近引脚焊盘间距 ≥ 0.2 mm；该焊盘有网络（通常 GND）且连接到铜皮"
      automatable: partial
  sources:
    - {title: "SLUA271 QFN and SON PCB Attachment", url: "https://www.ti.com/lit/an/slua271d/slua271d.pdf", publisher: "Texas Instruments", kind: app_note, section: "§3.4 Exposed Pad PCB Design"}
    - {title: "SLMA002 PowerPAD Thermally Enhanced Package", url: "https://www.ti.com/lit/an/slma002h/slma002h.pdf", publisher: "Texas Instruments", kind: app_note, section: "§2.4 Thermal Vias; Summary"}
