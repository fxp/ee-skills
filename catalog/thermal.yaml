# ───────────────────────── placement ─────────────────────────
- id: THM-PLC-001
  title: 热源与怕热元件分开放
  domain: thermal
  stage: placement
  severity: should
  rule: 把 LDO、MOSFET、分流电阻、整流 / 续流二极管等发热件与电解电容、晶振、温度传感器、精密基准等怕热元件分开放置，不要相邻堆叠；邻近元件的额定温度要计入允许的局部温度，必要时据此压低发热件的结温目标。
  rationale: 电解电容寿命随温度指数下降；邻近元件的额定温度会限制可接受的结温（TI 的例子：选用 100 °C 额定电容并因其靠近转换器，把结温目标压到 90 °C）；AMS1117 数据手册也指出热阻会受板上其它元件的热相互作用影响。
  applies_to: [electrolytic-capacitor, crystal, temperature-sensor, ldo, mosfet]
  parameters:
    - {name: hot_to_sensitive_distance, op: maximize, value: null, note: "没有找到权威来源给出具体距离；以热仿真 / 实测的局部温度为准"}
  verify:
    - method: geometry_script
      tool: "pcbnew Python"
      check: "给定「发热件」与「怕热件」位号清单，输出每个怕热件到最近发热件的距离，并按距离排序供评审；距离最近的 3 对要有热估算或实测支持"
      automatable: partial
    - method: thermal_sim
      tool: "简易 FEM / 热阻网络"
      check: "估算怕热件处的局部温度，加纹波自热后满足其额定温度与寿命要求"
      automatable: manual
  sources:
    - {title: "AN-2020 Thermal Design By Insight, Not Hindsight", url: "https://www.ti.com/lit/an/snva419c/snva419c.pdf", publisher: "Texas Instruments", kind: app_note, section: "§2.1 Example: Calculating Your Required θJA"}
    - {title: "AMS1117 datasheet", url: "https://www.handsontec.com/dataspecs/AMS1117.pdf", publisher: "Advanced Monolithic Systems", kind: datasheet, section: "Thermal Considerations"}
    - {title: "Aluminum electrolytic capacitors: General technical information", url: "https://www.tdk-electronics.tdk.com/blob/185386/download/4/pdf-generaltechnicalinformation.pdf", publisher: "TDK Electronics (EPCOS)", kind: vendor_guide, section: "§4–5"}
  confidence: medium
  conflicts: "晶振和精密器件需要远离热源的说法流传很广，但本库没找到给出具体距离的一手来源；这里只写方向性规则，具体距离留给仿真或实测。"
  tags: [cat-feeder]

- id: THM-PLC-002
  title: 外壳内的环境温度和空气流动要按实际假设
  domain: thermal
  stage: placement
  severity: should
  rule: 密闭或半密闭外壳里，用靠近发热件的空气温度作为环境温度，而不是室温；经验面积规则（THM-STK-003）假设外壳不阻碍板子两面的自然对流，如果板子贴壁、灌封或被遮挡，不能直接套用。
  rationale: 对流和辐射散热依赖周围空气；不同标准对「环境温度」测点的定义也不同（NEBS 取进风口，AEC 取器件下方，JEDEC 取板前的气流）。有气流时所需板面积可减半，没有时反之。
  applies_to: [enclosure, airflow]
  parameters:
    - {name: airflow_board_area_reduction, op: "<=", value: 50, unit: "%", note: "有气流通常最多可把所需板面积减半"}
  verify:
    - method: bench
      tool: "热电偶放在发热件旁（离板面 ≥ 1 cm）的空气中，外壳盖好"
      check: "满载稳态时记录局部空气温度，作为 Ta,max 的依据并代入 THM-ARC-002"
      automatable: manual
  sources:
    - {title: "AN-2020 Thermal Design By Insight, Not Hindsight", url: "https://www.ti.com/lit/an/snva419c/snva419c.pdf", publisher: "Texas Instruments", kind: app_note, section: "§3.1 Rule 1: Board Size"}
    - {title: "SPRA953 Semiconductor and IC Package Thermal Metrics", url: "https://www.ti.com/lit/an/spra953d/spra953d.pdf", publisher: "Texas Instruments", kind: app_note, section: "§7 Ambient Air Temperature"}
  confidence: medium
  tags: [cat-feeder]

# ───────────────────────── stackup ─────────────────────────
- id: THM-STK-001
  title: 按功耗选铜厚
  domain: thermal
  stage: stackup
  severity: consider
  rule: 对 DC-DC 类功率器件，铜厚至少 1 oz；功耗 > 3 W 用 2 oz；> 6 W 用 4 oz。2 层板上用 2 oz 替代 1 oz 可让 θJA 下降约 25%（同一块 3×3 in 板 28.3 → 21.2 °C/W）。
  rationale: 铜的横向热阻与厚度成反比，更厚的铜把热量更快铺开；JLC 的 2 层板外层可选 1、2、2.5、3.5、4.5 oz，但线宽线距限制随铜厚变大。
  applies_to: [power, 2-layer]
  parameters:
    - {name: copper_min_for_dcdc, op: ">=", value: 1, unit: oz}
    - {name: copper_2oz_for_power_over, op: ">", value: 3, unit: W}
    - {name: copper_4oz_for_power_over, op: ">", value: 6, unit: W}
  verify:
    - method: thermal_sim
      tool: "热阻网络估算（THM-VER-005）"
      check: "比较 1 oz 与 2 oz 时的 θCu 和 θJA,effective，确认选择满足 THM-ARC-002"
      automatable: partial
  sources:
    - {title: "AN-2020 Thermal Design By Insight, Not Hindsight", url: "https://www.ti.com/lit/an/snva419c/snva419c.pdf", publisher: "Texas Instruments", kind: app_note, section: "§3.3 Rule 3: Copper Thickness"}
    - {title: "JLCPCB PCB Capabilities", url: "https://jlcpcb.com/capabilities/pcb-capabilities", publisher: JLCPCB, kind: vendor_guide, section: "Board Thickness and Copper; Traces and Spacing"}
  confidence: high
  conflicts: "AN-2020 的铜厚阈值是针对 DC-DC 转换器写的，LDO 和 MOSFET 直接套用属于类比。猫咪喂食器功率小（<1 W），1 oz 通常足够。"
  tags: [cat-feeder]

- id: THM-STK-002
  title: 需要更低热阻时优先加内层地平面
  domain: thermal
  stage: stackup
  severity: consider
  rule: 2 层板热裕量不足时，改用 4 层板，把裸露焊盘通过过孔连到内层地和底层地；4 层板的内层地平面可让一块设计良好的 2 层板再改善最多约 30%。
  rationale: 内层地平面是大面积横向导热层，缩短到板边的热路径；单靠 2 层板的铜面积很难做到。
  applies_to: [2-layer, 4-layer, exposed-pad]
  parameters:
    - {name: improvement_with_internal_planes, op: "<=", value: 30, unit: "%", note: "「最多约」，来自 TI 对 2 层与 4 层的比较"}
  verify:
    - method: thermal_sim
      tool: "热阻网络估算或 FEM"
      check: "2 层方案 Tj 余量不足 THM-ARC-002 要求时，估算 4 层方案并比较成本"
      automatable: manual
  sources:
    - {title: "AN-2020 Thermal Design By Insight, Not Hindsight", url: "https://www.ti.com/lit/an/snva419c/snva419c.pdf", publisher: "Texas Instruments", kind: app_note, section: "§3.1"}
    - {title: "AN-1520 A Guide to Board Layout for Best Thermal Resistance for Exposed Packages", url: "https://www.ti.com/lit/an/snva183b/snva183b.pdf", publisher: "Texas Instruments", kind: app_note, section: "§6 PCB Design Recommendations"}
  confidence: high
  tags: [cat-feeder]

- id: THM-STK-003
  title: 用板面积规则做第一遍可行性检查
  domain: thermal
  stage: stackup
  severity: consider
  rule: 自然对流、无散热器、两面实铜、热量能传到板边的条件下，每 1 W 耗散约需要 15.29 cm²（2.37 in²）板面积才能让温升限制在 40 °C；已知 θJC 时用 板面积(cm²) ≈ 500 / (θJA − θJC) 估算最小板面积。
  rationale: 这是 TI 从热阻网络推出的经验规则，用于在布局之前判断板子的尺寸和封装能否承受目标功耗。
  applies_to: [power, feasibility]
  parameters:
    - {name: board_area_per_watt_40c_rise, op: ">=", value: 15.29, unit: "cm2/W", note: "两面实铜、自然对流、外壳不阻碍对流"}
    - {name: board_area_coefficient, op: "==", value: 500, unit: "°C·cm2/W", note: "板面积 ≈ 500 /(θJA − θJC)"}
  verify:
    - method: thermal_sim
      tool: "Python 脚本"
      check: "Σ 板上耗散功率 × 15.29 cm²/W 与板面积比较；局部大功耗件用 θJA − θJC 公式估算它需要的铜面积"
      automatable: full
  sources:
    - {title: "AN-2020 Thermal Design By Insight, Not Hindsight", url: "https://www.ti.com/lit/an/snva419c/snva419c.pdf", publisher: "Texas Instruments", kind: app_note, section: "§3.1 Rule 1: Board Size, eq. 9–10"}
  confidence: high
  tags: [cat-feeder]

# ───────────────────────── routing ─────────────────────────
- id: THM-RTE-001
  title: 大电流走线按 IPC-2152 的温升来定宽
  domain: thermal
  stage: routing
  severity: should
  rule: 大电流走线（电机、电源入口）先定温升预算，再按 IPC-2152 的曲线（区分内层 / 外层、考虑相邻铜平面与板厚）确定线宽，而不是只用旧的 IPC-2221 经验图；同一电流下内层要比外层更宽。
  rationale: IPC-2152 专门针对导体载流能力，包含内外层、铜平面距离、板厚、铜厚等修正；仅用旧图容易偏保守或偏乐观。线宽决定铜的 I²R 发热和温升。
  applies_to: [trace, motor-driver, power-input]
  parameters:
    - {name: trace_temp_rise_budget, op: minimize, value: null, unit: "°C", note: "没有统一规定，由产品和邻近元件的额定温度决定"}
  verify:
    - method: tline_calc
      tool: "IPC-2152 计算器 / 载流计算脚本"
      check: "输入电流、铜厚、内 / 外层、温升预算，求最小线宽；板上对应网络的最窄处（含焊盘颈缩、过孔）不得小于该宽度"
      automatable: full
    - method: bench
      tool: "热像仪 / 热电偶"
      check: "满载稳态下走线温升不超过预算"
      automatable: manual
  sources:
    - {title: "IPC-2152 Standard for Determining Current-Carrying Capacity in Printed Board Design (table of contents)", url: "https://www.electronics.org/TOC/IPC-2152.pdf", publisher: IPC, kind: standard, section: "§5 Conductor sizing charts; Appendix A.2 Derating, A.4.6 Copper planes"}
    - {title: "PCB Design Rules and Guidelines: A Complete Best Practices Guide (copper current table, approx. 10 °C rise)", url: "https://jlcpcb.com/blog/pcb-design-rules-best-practices", publisher: JLCPCB, kind: vendor_guide}
  confidence: low
  conflicts: "只读到 IPC-2152 公开的目录页（确认了内外层、铜平面、降额等章节存在），没有读到图表本身；JLC 博客给了约 10 °C 温升的近似表，其数字比 IPC-2221 的图略乐观（例如 5 A、1 oz 外层写约 100 mil），因此不把它们当作参数。线宽要用 IPC-2152 计算器核算。"
  tags: [cat-feeder]

- id: THM-RTE-002
  title: 散热过孔的孔径、间距与数量
  domain: thermal
  stage: routing
  severity: should
  rule: 裸露焊盘下的散热过孔钻孔 ≤ 0.33 mm（13 mil）、以约 1.0–1.2 mm 间距排成阵列并尽量排满；焊盘小、过孔数量受限时，把过孔放在焊盘外围，且不要在小焊盘封装上改用 0.2 mm 的小孔（比 0.33 mm 孔使 θJA 增加约 15–25%）。小芯片 5–9 个过孔通常够用，边际收益递减。
  rationale: 过孔是焊盘热量进入内层 / 底层铜皮的主要路径；孔径小可减少焊料沿孔壁流失，但太小会增加热阻。
  applies_to: [qfn, son, powerpad, exposed-pad]
  parameters:
    - {name: thermal_via_drill_max, op: "<=", value: 0.33, unit: mm, note: "TI SLMA002：0.33 mm 及以下，1 oz 表面铜 + 孔壁电镀时效果好"}
    - {name: thermal_via_drill_start, op: "==", value: 0.3, unit: mm, note: "TI SLUA271：起始值"}
    - {name: thermal_via_pitch, op: range, value: [1.0, 1.2], unit: mm, note: "SLUA271 约 1.0 mm；AN-1520 仿真用 1.2 mm；AN-2020 用 1 mm"}
    - {name: small_die_via_count, op: range, value: [5, 9], unit: pcs, note: "小芯片通常足够"}
    - {name: theta_ja_penalty_0p2mm_via_small_pad, op: range, value: [15, 25], unit: "%", note: "最多 4 个过孔的小焊盘；大焊盘（≥ 9 个）一般 < 10%"}
  verify:
    - method: geometry_script
      tool: "pcbnew Python"
      check: "统计每个裸露焊盘内的过孔数量、钻孔径、最近邻间距；孔径 ≤ 0.33 mm、间距在 1.0–1.2 mm，数量接近焊盘能容纳的最大值；孔径同时不低于板厂过孔下限"
      automatable: full
  sources:
    - {title: "SLMA002 PowerPAD Thermally Enhanced Package", url: "https://www.ti.com/lit/an/slma002h/slma002h.pdf", publisher: "Texas Instruments", kind: app_note, section: "§2.4 Thermal Vias"}
    - {title: "SLUA271 QFN and SON PCB Attachment", url: "https://www.ti.com/lit/an/slua271d/slua271d.pdf", publisher: "Texas Instruments", kind: app_note, section: "§3.4.1"}
    - {title: "AN-1520 A Guide to Board Layout for Best Thermal Resistance for Exposed Packages", url: "https://www.ti.com/lit/an/snva183b/snva183b.pdf", publisher: "Texas Instruments", kind: app_note, section: "§5.2, §6"}
    - {title: "AN-2020 Thermal Design By Insight, Not Hindsight", url: "https://www.ti.com/lit/an/snva419c/snva419c.pdf", publisher: "Texas Instruments", kind: app_note, section: "§3.2 Rule 2: Thermal Vias"}
  confidence: high
  tags: [cat-feeder]

- id: THM-RTE-003
  title: 用过孔阵列的并联热阻核算而不是凭感觉
  domain: thermal
  stage: routing
  severity: consider
  rule: 过孔阵列的热阻按单孔热阻除以数量估算：12 mil（0.3 mm）孔、孔壁 0.5 oz 镀铜、板厚 1.6 mm 约 261 °C/W；孔壁镀到 1 oz 约 140 °C/W；8 mil 完全填铜约 128 °C/W。把该值纳入总热阻，并与热预算比较。
  rationale: 单个过孔热阻很高，数量才是关键；4×4 共 16 个 12 mil 过孔约 16.3 °C/W，填孔可再降一半，但 PCB 成本可能增加到 2–3 倍，而 1 oz 孔壁镀铜只增加约 10–20%。
  applies_to: [thermal-via, exposed-pad]
  parameters:
    - {name: via_theta_12mil_0p5oz, op: "==", value: 261, unit: "°C/W", note: "单孔，板厚 0.165 cm，孔壁 0.00175 cm"}
    - {name: via_theta_12mil_1oz, op: "==", value: 140, unit: "°C/W", note: "单孔"}
    - {name: via_theta_8mil_filled, op: "==", value: 128, unit: "°C/W", note: "单孔，镀满封闭"}
    - {name: jlc_avg_hole_plating, op: "==", value: 18, unit: um, note: "JLC 公布的平均孔铜约等于 0.5 oz 镀铜，因此取 261 °C/W 作基准"}
  verify:
    - method: thermal_sim
      tool: "Python：R_array = R_via / N，再与铜皮横向热阻串联"
      check: "R_array ≤ 热预算中分给过孔的份额；需要时说明为什么不用更多过孔或更厚镀铜"
      automatable: full
  sources:
    - {title: "AN-2020 Thermal Design By Insight, Not Hindsight", url: "https://www.ti.com/lit/an/snva419c/snva419c.pdf", publisher: "Texas Instruments", kind: app_note, section: "§3.2, §3.2.1, Table 1"}
    - {title: "JLCPCB PCB Capabilities", url: "https://jlcpcb.com/capabilities/pcb-capabilities", publisher: JLCPCB, kind: vendor_guide, section: "Drilling: Average hole plating"}
  confidence: high
  tags: [cat-feeder]

- id: THM-RTE-004
  title: 散热过孔的封盖方式要避免焊料流失和空洞
  domain: thermal
  stage: routing
  severity: should
  rule: 散热焊盘上的过孔必须有明确的处理方式：从元件面用阻焊盖住（阻焊盘径 = 孔径 + 0.1 mm 以上），或者塞/填平；不要只从背面盖油，否则空洞增加；使用 OSP 表面处理时 TI 发现不盖油也能得到可重复的结果。把选择写进制造说明。
  rationale: 开口过孔把焊料吸走，使焊盘处缺焊料而出现空洞；背面盖油会困住空气和助焊剂放气；二者都使有效焊接面积下降（见 THM-MFG-001）。
  applies_to: [exposed-pad, thermal-via, qfn, powerpad]
  parameters:
    - {name: via_mask_cap_over_hole, op: ">=", value: 0.1, unit: mm, note: "盖油阻焊直径比孔径大的量（TI 两份文档均提到）"}
  verify:
    - method: review
      tool: "制造说明 + JLC 下单页「过孔覆盖」选项"
      check: "确认散热过孔的覆盖方式与 TI 建议一致；2 层板在 JLC 上若选「盖油」，Gerber 中阻焊层对该孔的盖油环 ≥ 孔径 + 0.1 mm"
      automatable: manual
    - method: geometry_script
      tool: "pcbnew Python"
      check: "对散热焊盘内的过孔，检查其阻焊边距设置为（通过 tented 或负边距）不开窗，或者标记为 filled"
      automatable: partial
  sources:
    - {title: "SLMA002 PowerPAD Thermally Enhanced Package", url: "https://www.ti.com/lit/an/slma002h/slma002h.pdf", publisher: "Texas Instruments", kind: app_note, section: "§2.4 Thermal Vias"}
    - {title: "SLUA271 QFN and SON PCB Attachment", url: "https://www.ti.com/lit/an/slua271d/slua271d.pdf", publisher: "Texas Instruments", kind: app_note, section: "§3.4.1, Figure 3-4"}
    - {title: "Via Covering: Tented, Untented, Plugged, Epoxy-Filled and Copper-epoxy-filled", url: "https://jlcpcb.com/help/article/pcb-via-covering", publisher: JLCPCB, kind: vendor_guide}
  confidence: high
  conflicts: "TI 两份文档都偏好从元件面盖油；SLUA271 补充说 OSP 面不盖油也可重复。JLC 的 2 层板标准服务难以做焊盘内填平盖帽（见 DFM-RTE-002）。取舍：按所选表面处理和板厂能力选择，并用 X 光结果验证。"

- id: THM-RTE-005
  title: 散热过孔要实连到尽可能多的层，不用热焊盘
  domain: thermal
  stage: routing
  severity: must
  rule: 散热焊盘下的过孔与内层 / 底层地平面之间做完整环形连接，不使用热焊盘（花焊盘）；把过孔连到尽可能多的铜层，底层地要尽量完整；封装焊盘本身也要连到顶层的大面积地铜。
  rationale: 热焊盘的目的是增加热阻以便焊接，用在散热路径上会显著抬高热阻；热量必须从过孔进入大面积铜才能铺开。
  applies_to: [exposed-pad, thermal-via]
  verify:
    - method: drc
      tool: "KiCad 自定义规则 zone_connection"
      check: "散热焊盘及其内的过孔 zone_connection = solid，所连的每个铜层都有对应的铜皮覆盖"
      automatable: full
    - method: geometry_script
      tool: "pcbnew Python"
      check: "统计每个散热过孔连接的铜层数，要求 ≥ 2；检查底层 GND 铜皮在散热过孔下方连续"
      automatable: partial
  sources:
    - {title: "SLMA002 PowerPAD Thermally Enhanced Package", url: "https://www.ti.com/lit/an/slma002h/slma002h.pdf", publisher: "Texas Instruments", kind: app_note, section: "§2.4"}
    - {title: "AN-2020 Thermal Design By Insight, Not Hindsight", url: "https://www.ti.com/lit/an/snva419c/snva419c.pdf", publisher: "Texas Instruments", kind: app_note, section: "§3.2"}
    - {title: "AN-1520 A Guide to Board Layout for Best Thermal Resistance for Exposed Packages", url: "https://www.ti.com/lit/an/snva183b/snva183b.pdf", publisher: "Texas Instruments", kind: app_note, section: "§6, §7"}
