# 射频与天线（rf）最佳实践：架构 / 库 环节
# 来源均为实际打开读过的厂商应用笔记 / 数据手册 / 法规原文；数值只在读到原文时写入 parameters。

- id: RF-ARC-001
  title: 用 Friis 公式做链路预算并留衰落余量
  domain: rf
  stage: architecture
  severity: should
  rule: >-
    选定射频方案前先做链路预算：Pr = Pt + Gt - 路径损耗 + Gr，最大路径损耗 = Pt + Gt + Gr - 接收灵敏度 - 衰落余量。
    天线增益取含辐射效率的实测/数据手册值（PCB 与芯片天线常为负 dBi），不要用峰值增益。
  rationale: >-
    Friis 公式是视距链路的基本模型；天线失配是链路预算里最大的损失项之一，增益、效率和余量取得过于乐观会让实际距离远小于预期。
  applies_to: [link_budget, 2.4ghz, ble, wifi]
  parameters:
    - name: fade_margin_consumer
      op: range
      value: [15, 20]
      unit: dB
      note: "Hubble 博客称 10 dB 偏乐观、15-20 dB 适合可穿戴/消费类和多变环境；单一博客来源，仅作起点"
    - name: fspl_at_1m_2p4ghz
      op: "=="
      value: 40
      unit: dB
      note: "自由空间路径损耗约 40 dB + 20*log10(d/1m)（2.4-2.44 GHz；按 20log10(f)+20log10(d)-147.55 自行核算 2.44 GHz 为 40.2 dB）"
  verify:
    - method: review
      tool: "Python/电子表格（Friis 公式）"
      check: >-
        列出 Pt、Gt、Gr（用 VNA/OTA 实测效率换算，而非峰值增益）、接收灵敏度（数据手册，如 nRF52 1 Mbps 约 -96 dBm）、
        衰落余量，算出最大路径损耗 PL_max，再用 d = 10^((PL_max - 40)/20) m 估自由空间距离；该距离须大于需求距离，室内另扣墙体损耗。
      automatable: partial
  sources:
    - title: "AN058 Antenna Selection Guide (SWRA161B)"
      url: "https://www.ti.com/lit/pdf/swra161"
      publisher: "Texas Instruments"
      kind: app_note
      section: "§3.4 Maximum Power Transfer (VSWR), §3.6 Friis Transmission Equation"
    - title: "How to Calculate BLE Link Budget and Range"
      url: "https://hubble.com/community/guides/how-to-calculate-ble-link-budget-and-range/"
      publisher: "Hubble Network"
      kind: blog
  confidence: medium

- id: RF-ARC-002
  title: 按法规限值选功率、天线增益与杂散抑制
  domain: rf
  stage: architecture
  severity: must
  rule: >-
    把目标市场的法规限值当作设计输入：FCC 15.247 数字调制（2400-2483.5 MHz）传导峰值功率 <= 1 W，天线定向增益 <= 6 dBi
    （超出要按超出的 dB 降功率），带外任意 100 kHz 带宽须比带内最高值低 >= 20 dB（用 RMS 平均测功率时为 30 dB）；
    ETSI EN 300 328 要求 e.i.r.p. <= 20 dBm，1-12.75 GHz 杂散 <= -30 dBm/1 MHz。
  rationale: >-
    e.i.r.p. 含天线增益，换更高增益天线或更大功率 PA 会直接越线；谐波和杂散由匹配与滤波决定，必须在选 PA、天线和滤波器之前就确定目标。
  applies_to: [2.4ghz, certification, fcc, etsi]
  parameters:
    - name: fcc_max_conducted_power
      op: "<="
      value: 30
      unit: dBm
      note: "FCC 15.247(b)(3) 数字调制 2400-2483.5 MHz，1 W；前提是天线定向增益 <= 6 dBi（15.247(b)(4)）"
    - name: fcc_max_antenna_gain_without_derating
      op: "<="
      value: 6
      unit: dBi
    - name: fcc_out_of_band_suppression
      op: ">="
      value: 20
      unit: dB
      note: "15.247(d)，100 kHz 带宽相对带内最高值；若按 (b)(3) 用 RMS 平均测功率则为 30 dB"
    - name: etsi_max_eirp
      op: "<="
      value: 20
      unit: dBm
      note: "EN 300 328 V2.2.2 §4.3.1.2.3（FHSS）、§4.3.2.2.3（非 FHSS）"
    - name: etsi_spurious_1_to_12p75ghz
      op: "<="
      value: -30
      unit: dBm
      note: "每 1 MHz 带宽；Table 4（FHSS）/ Table 12（非 FHSS）。传导口按传导测，一体天线设备按 e.i.r.p. 测"
  verify:
    - method: review
      tool: "法规限值对照表"
      check: >-
        用 Pt（传导）+ 天线增益算 e.i.r.p.，对照目标市场限值；检查天线增益是否超过 6 dBi；确认谐波滤波目标与 15.247(d)/EN 300 328 杂散限值相容。
      automatable: partial
    - method: bench
      tool: "频谱仪 + 传导测试口"
      check: "见 RF-VER-005：实测传导功率、二/三次谐波与杂散，留余量后再送认证实验室。"
      automatable: manual
  sources:
    - title: "47 CFR 15.247 Operation within the bands 902-928 MHz, 2400-2483.5 MHz, and 5725-5850 MHz"
      url: "https://www.ecfr.gov/current/title-47/chapter-I/subchapter-A/part-15/subpart-C/subject-group-ECFR2f2e5828339709e/section-15.247"
      publisher: "eCFR / US Government"
      kind: standard
      section: "(b)(3), (b)(4), (d)"
    - title: "ETSI EN 300 328 V2.2.2 Wideband transmission systems; Data transmission equipment operating in the 2,4 GHz band"
      url: "https://www.etsi.org/deliver/etsi_en/300300_300399/300328/02.02.02_60/en_300328v020202p.pdf"
      publisher: "ETSI"
      kind: standard
      section: "§4.3.1.2.3, §4.3.1.10.3 Table 4, §4.3.2.2.3, §4.3.2.9.3 Table 12"
  confidence: high

- id: RF-ARC-003
  title: 优先选预认证射频模组，量大再做分立射频
  domain: rf
  stage: architecture
  severity: should
  rule: >-
    没有射频团队和测试设备时，选带板载天线（或 U.FL）的预认证模组并按集成指南使用；只有体积、成本或性能确有需要才做分立射频，
    此时整个射频部分（器件值、封装、布局、叠层）直接复制厂商参考设计。
  rationale: >-
    模组已完成匹配、滤波和法规测试，主板只需遵守摆放与禁布；分立射频的匹配对寄生参数很敏感，偏离参考设计会让输出功率下降、灵敏度变差、杂散升高。
  applies_to: [wifi, ble, module, discrete_rf]
  verify:
    - method: bom_check
      tool: "BOM 审查"
      check: "射频部分为预认证模组则记录其认证编号/集成指南版本；若为分立射频，逐项核对 RF 器件值、封装与厂商参考设计一致。"
      automatable: partial
    - method: netlist_diff
      tool: "原理图/参考设计网表对比脚本"
      check: "把 RF 匹配/滤波网络的元件类型与值与参考设计网表对比，列出所有差异并逐条给出理由。"
      automatable: partial
  sources:
    - title: "FCC KDB 996369 D01 Module Certification Guide v04r01 / D02 Module Q&A（Laboratory Division Publications Report DR09-45454）"
      url: "https://apps.fcc.gov/eas/comments/GetPublishedDocument.html?id=520&tn=690618"
      publisher: "FCC Office of Engineering and Technology"
      kind: standard
      section: "D01 §8.1.1-8.1.2"
    - title: "PCB Layout Design Guide (EFR32 Wireless Gecko)"
      url: "https://github.com/SiliconLabs/IoT-Developer-Boot-Camp/wiki/PCB-Layout-Design-Guide"
      publisher: "Silicon Labs"
      kind: vendor_guide
      section: "§2.2 Layout of RF section"
    - title: "Impedance Matched RF Front End Differential Balun-Low Pass Filter for CC253X (2450BM15A0002)"
      url: "https://www.johansontechnology.com/docs/2962/2450BM15A0002-App-Note-for-the-CC253X-11_7cXYuOj.pdf"
      publisher: "Johanson Technology"
      kind: app_note
      section: "§3 Layout"
  confidence: medium
  tags: [cat-feeder]

- id: RF-ARC-004
  title: 不要改动预认证模组的天线与匹配配置
  domain: rf
  stage: architecture
  severity: must
  rule: >-
    使用预认证模组的主板必须保持认证时的天线配置：板载 PCB 天线按集成指南保留禁布区，不另加匹配或放大器；
    U.FL 变体只用 50 Ω、增益不高于认证天线的天线；更换天线类型或走线设计需重新认证（FCC 属 C2/C3 许可性变更）。
  rationale: >-
    模组的授权只覆盖认证时测过的天线与走线配置；天线长度、形状和增益变化会改变辐射发射，监管上被视为不同天线类型。
  applies_to: [module, certification, fcc]
  parameters:
    - name: wroom02u_external_antenna_max_gain_non_fcc
      op: "<="
      value: 2.33
      unit: dBi
      note: "ESP32-C3-WROOM-02U 认证用天线增益；换不同类型或增益的天线可能需额外测试"
    - name: wroom02u_external_antenna_max_gain_fcc
      op: "<="
      value: 1.57
      unit: dBi
      note: "FCC 认证用天线增益"
  verify:
    - method: review
      tool: "认证文件核对清单"
      check: >-
        核对：天线型号/增益是否在认证清单内；主板上禁布区、地平面、馈线是否与集成指南一致；模组与天线间的匹配元件料号是否与认证时一致
        （如 Murata MBN52832 要求 L1、C2 用指定料号）。
      automatable: manual
    - method: bom_check
      tool: "BOM 脚本"
      check: "把模组与天线间的匹配元件料号与集成指南/认证列表逐项比对，不一致即失败。"
      automatable: partial
  sources:
    - title: "FCC KDB 996369 D01 v04r01 / D02 Q&A（DR09-45454）"
      url: "https://apps.fcc.gov/eas/comments/GetPublishedDocument.html?id=520&tn=690618"
      publisher: "FCC Office of Engineering and Technology"
      kind: standard
      section: "D01 §8.1.1-8.1.3; D02 Question 11"
    - title: "ESP32-C3-WROOM-02 & WROOM-02U Datasheet v1.7"
      url: "https://www.espressif.com/sites/default/files/documentation/esp32-c3-wroom-02_datasheet_en.pdf"
      publisher: "Espressif Systems"
      kind: datasheet
      section: "§10.2 Dimensions of External Antenna Connector"
    - title: "MBN52832 BLE Module Layout Guide"
      url: "https://www.murata.com/-/media/webrenewal/products/connectivitymodule/asset/pub/rfm/data/mbn52832_antenna_layout_guide.ashx?la=en&cvid=20210615064716000000"
      publisher: "Murata"
      kind: vendor_guide
      section: "On-board antenna connection"
  confidence: high
  tags: [cat-feeder]

- id: RF-ARC-005
  title: 按频段、面积、高度和成本选天线类型
  domain: rf
  stage: architecture
  severity: consider
  rule: >-
    2.4 GHz 空间够就用 PCB 倒 F（IFA/MIFA）天线；面积极小才用陶瓷芯片天线；要最好性能且允许高度时用线天线。
    低于 433 MHz 的 PCB 天线很难做得小又高效，应改用芯片、线或外置天线。
    芯片天线的匹配与性能依赖厂商测试板的地平面尺寸，换板型必须重调。
  rationale: >-
    PCB 天线成本最低、可调长度，但占面积；芯片天线省面积但增加 BOM 和贴装成本，且不能靠改长度调谐，必须带匹配网络；
    频率越低，1/4 波长越长（2.4 GHz 自由空间约 31 mm）。
  applies_to: [antenna_selection, 2.4ghz, sub_ghz]
  parameters:
    - name: quarter_wavelength_2p4ghz_free_space
      op: "=="
      value: 31
      unit: mm
      note: "TI AN058：2.4 GHz λ/4 约 3.1 cm"
    - name: mifa_s11_bandwidth_minus10db
      op: "=="
      value: 230
      unit: MHz
      note: "Infineon AN91445 Table 5：MIFA 7.2x11.1 mm，增益 1.6 dBi；IFA 4x20.5 mm 带宽 220 MHz、1.1 dBi；芯片天线 3.2x1.6 mm 带宽 200 MHz、0.5 dBi；线天线 6x30 mm 带宽 200 MHz、2 dBi"
  verify:
    - method: review
      tool: "天线选型表"
      check: "对照可用面积、高度、成本、带宽（S11 <= -10 dB）和需求距离，选出天线类型并记录选型依据与对应厂商参考设计。"
      automatable: manual
    - method: bench
      tool: "VNA"
      check: "原型上测 S11 与带宽，确认 2.400-2.4835 GHz 满足（见 RF-VER-001）。"
      automatable: manual
  sources:
    - title: "AN91445 Antenna Design and RF Layout Guidelines"
      url: "https://community.infineon.com/gfawx74859/attachments/gfawx74859/cnkbas/2308/1/Infineon-AN91445_Antenna_Design_and_RF_Layout_Guidelines-ApplicationNotes-v09_00-EN.pdf"
      publisher: "Infineon (Cypress)"
      kind: app_note
      section: "§3, §4, §8, §10 Table 5"
    - title: "AN058 Antenna Selection Guide (SWRA161B)"
      url: "https://www.ti.com/lit/pdf/swra161"
      publisher: "Texas Instruments"
      kind: app_note
      section: "§3.3 Table 1 (λ/4 = 3.1 cm at 2.4 GHz); §4 Antenna Types, Table 3; §4.2 Chip Antennas"
  confidence: high

- id: RF-ARC-006
  title: GNSS 无源天线馈线不超过 10 cm，更长用有源天线
  domain: rf
  stage: architecture
  severity: should
  rule: >-
    无源 GNSS 天线必须经不超过 10 cm 的 50 Ω 微带/带状线接到接收机；走线更长或用线缆时改用带 LNA 的有源天线。
    LNA 增益约 15 dB 即足够（线长到 5 m 也够），没必要超过 26 dB；线短而增益 > 35 dB 在部分接收机上会过载。
  rationale: >-
    GNSS 信号极弱，无源馈线的损耗直接加在系统噪声系数上，并更易耦合干扰；有源天线的 LNA 位于线缆之前，线缆损耗不再影响噪声系数。
  applies_to: [gnss, gps, patch_antenna]
  parameters:
    - name: passive_antenna_feed_max_length
      op: "<="
      value: 100
      unit: mm
      note: "u-blox Table 1：无源天线经最长 10 cm 的微带/带状线连接接收机"
    - name: active_antenna_lna_gain_typical
      op: "=="
      value: 15
      unit: dB
      note: "对可兼容无源天线的接收机，15 dB 即使线长到 5 m 也通常足够"
    - name: active_antenna_lna_gain_useful_max
      op: "<="
      value: 26
      unit: dB
      note: "u-blox 接收机 RF 输入处无需超过 26 dB；短线加 > 35 dB 增益可能过载"
  verify:
    - method: geometry_script
      tool: "pcbnew (KiCad bundled Python)"
      check: "取 GNSS 接收机 RF_IN 网络，累加从天线焊盘/连接器到 RF_IN 引脚的走线长度，<= 100 mm；超过则必须改为有源天线并核对偏置与 DC 隔离。"
      automatable: full
    - method: review
      tool: "有源天线偏置检查"
      check: "有源天线供电经射频扼流圈馈入，RF 路径有隔直电容；LNA 增益 + 线缆损耗不使接收机过载。"
      automatable: manual
  sources:
    - title: "GNSS antennas - RF design considerations for u-blox GNSS receivers (UBX-15030289 R03)"
      url: "https://content.u-blox.com/sites/default/files/products/documents/GNSS-Antennas_AppNote_(UBX-15030289).pdf"
      publisher: "u-blox"
      kind: app_note
      section: "§2.4 Active and passive antennas, Table 1"
  confidence: high

- id: RF-LIB-001
  title: 天线/模组封装自带厂商禁布区并保持不改
  domain: rf
  stage: library
  severity: should
  rule: >-
    天线或模组封装使用厂商给出的焊盘和禁布区几何，把禁布区做成封装内的 keepout rule area，在所有铜层上禁铜、禁走线、禁过孔、禁元件，
    使 DRC 能自动检查；不要自行缩小或修改禁布区。
  rationale: >-
    禁布区几何是天线谐振和辐射性能的一部分，必须贯穿多层板所有铜层；偏离厂商定义的几何会使性能变得不可预测且效率降低。
  applies_to: [pcb_antenna, chip_antenna, module]
  verify:
    - method: drc
      tool: "KiCad DRC（rule area: 禁铜/走线/过孔/焊盘/封装，全部铜层）"
      check: "运行 DRC，keepout 类违例数为 0（天线自身焊盘除外）。"
      automatable: full
    - method: geometry_script
      tool: "pcbnew (KiCad bundled Python)"
      check: "读取天线封装内 rule area 的层集合，必须包含全部铜层；并确认其多边形与厂商图纸（含悬出板外的部分）一致。"
      automatable: partial
  sources:
    - title: "Understanding Chip Antennas Handbook"
      url: "https://www.johansontechnology.com/docs/4469/johanson-understanding-chip-antennas-handbook.pdf"
      publisher: "Johanson Technology"
      kind: vendor_guide
      section: "No-Ground or Keep-Out Areas"
    - title: "AN91445 Antenna Design and RF Layout Guidelines"
      url: "https://community.infineon.com/gfawx74859/attachments/gfawx74859/cnkbas/2308/1/Infineon-AN91445_Antenna_Design_and_RF_Layout_Guidelines-ApplicationNotes-v09_00-EN.pdf"
      publisher: "Infineon (Cypress)"
      kind: app_note
      section: "§12"
    - title: "ESP32-C3-WROOM-02 & WROOM-02U Datasheet v1.7"
      url: "https://www.espressif.com/sites/default/files/documentation/esp32-c3-wroom-02_datasheet_en.pdf"
      publisher: "Espressif Systems"
      kind: datasheet
      section: "§3.1 Pin Layout, Note A"
  confidence: high
