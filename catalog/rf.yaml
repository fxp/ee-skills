# ---------------- placement ----------------

- id: RF-PLC-001
  title: 匹配网络紧贴芯片 RF 脚和天线馈点，元件相互靠近
  domain: rf
  stage: placement
  severity: should
  rule: >-
    芯片侧匹配网络靠近芯片 RF 引脚，第一个元件离引脚尽量近，网络内元件相互靠近（相邻元件用焊盘宽度连线）；
    天线侧匹配网络靠近天线馈点。ESP32-C3 芯片要求 CLC 用 0201、按之字形放置，两个电容不朝同一方向。
  rationale: >-
    各自把一端匹配到 50 Ω 后，两个网络之间的 50 Ω 线长不再影响匹配值；元件间距和走线长度引入的寄生电感/电容会使匹配失谐。
  applies_to: [matching_network, rf_ic, antenna_feed]
  parameters:
    - name: first_matching_component_distance_to_rf_pin
      op: minimize
      value: null
      note: "Silicon Labs：第一个元件尽量靠近 RF 引脚，以降低串联寄生电感"
  verify:
    - method: geometry_script
      tool: "pcbnew (KiCad bundled Python)，参见 ee-pcb-verify 的 geometry 检查器"
      check: >-
        对 RF 网络上每个匹配元件，取焊盘中心到 RF 引脚（或天线馈点）的距离，按网络顺序递增；
        第一个元件焊盘间隙为封装允许的最小值；距离与厂商参考设计的对应值对比，偏差由评审确认。
      automatable: partial
    - method: review
      tool: "对照厂商参考布局图"
      check: "确认元件朝向（之字形）、与参考布局一致。"
      automatable: manual
  sources:
    - title: "PCB Layout Design Guide (EFR32 Wireless Gecko)"
      url: "https://github.com/SiliconLabs/IoT-Developer-Boot-Camp/wiki/PCB-Layout-Design-Guide"
      publisher: "Silicon Labs"
      kind: vendor_guide
      section: "§3.1 2.4 GHz matching network"
    - title: "ESP32-C3 PCB Layout Design - RF Matching Network"
      url: "https://docs.espressif.com/projects/esp-hardware-design-guidelines/en/latest/esp32c3/pcb-layout-design.html"
      publisher: "Espressif Systems"
      kind: vendor_guide
      section: "RF / RF Matching Network"
    - title: "AN91445 Antenna Design and RF Layout Guidelines"
      url: "https://community.infineon.com/gfawx74859/attachments/gfawx74859/cnkbas/2308/1/Infineon-AN91445_Antenna_Design_and_RF_Layout_Guidelines-ApplicationNotes-v09_00-EN.pdf"
      publisher: "Infineon (Cypress)"
      kind: app_note
      section: "§14"
    - title: "AN11994 QN908x BLE Antenna Design Guide"
      url: "https://community.nxp.com/pwmxy87654/attachments/pwmxy87654/wireless-connectivity/17607/1/BLE_Antenna_Design_AN11994.pdf"
      publisher: "NXP"
      kind: app_note
      section: "§3.2"
  confidence: high

- id: RF-PLC-002
  title: 射频电源脚去耦：小值最近、同层、各自接地过孔
  domain: rf
  stage: placement
  severity: should
  rule: >-
    去耦电容与 IC 同层，最小值电容离电源脚最近；供电电流先经电容再进引脚，避免电源过孔夹在电容与引脚之间；
    每个去耦电容的接地用独立过孔、不共用；接地脚走线加粗并紧贴过孔。
  rationale: >-
    最小值电容的有效频段最高，必须最先看到引脚；过孔和走线的寄生电感会抵消电容的高频效果。
  applies_to: [rf_ic, lna, pa, decoupling]
  verify:
    - method: geometry_script
      tool: "pcbnew (KiCad bundled Python)"
      check: >-
        对每个射频电源脚找出所有去耦电容：按容值升序，到引脚的距离应不递减；电容与 IC 同层；
        每个电容 GND 焊盘最近的 GND 过孔仅连接 1 个元件焊盘（无共用）。
      automatable: full
  sources:
    - title: "AN91445 Antenna Design and RF Layout Guidelines"
      url: "https://community.infineon.com/gfawx74859/attachments/gfawx74859/cnkbas/2308/1/Infineon-AN91445_Antenna_Design_and_RF_Layout_Guidelines-ApplicationNotes-v09_00-EN.pdf"
      publisher: "Infineon (Cypress)"
      kind: app_note
      section: "§19.1"
    - title: "PCB Layout Design Guide (EFR32 Wireless Gecko)"
      url: "https://github.com/SiliconLabs/IoT-Developer-Boot-Camp/wiki/PCB-Layout-Design-Guide"
      publisher: "Silicon Labs"
      kind: vendor_guide
      section: "§3.4, §3.5"
  confidence: high

# ---------------- routing ----------------

- id: RF-RTE-001
  title: 射频线按 50 Ω 设计，线宽（及间隙）全程恒定
  domain: rf
  stage: routing
  severity: must
  rule: >-
    射频走线位于外层，50 Ω 特性阻抗，线宽恒定（CPWG 时间隙也恒定），不分支；仅天线馈点前极短一段（约 3 mm）可放宽线宽，
    但线宽须与天线馈点一致；约 1 cm 以上的馈线应按传输线（宽度 W）设计（Infineon 的措辞是推荐）。
  rationale: >-
    特性阻抗不连续处会产生反射；传输线越长，对阻抗恒定性的要求越高。
  applies_to: [rf_trace, microstrip, cpwg]
  parameters:
    - name: rf_trace_z0
      op: "=="
      value: 50
      unit: ohm
    - name: short_feed_width_exempt_length
      op: "<="
      value: 3
      unit: mm
      note: "AN91445 §7.2：约 3 mm 的天线馈入线宽度要求可放宽，但须与天线馈点宽度一致"
    - name: long_feed_must_be_transmission_line
      op: ">="
      value: 10
      unit: mm
      note: "AN91445 §7.2：约 1 cm 的馈线推荐用特定宽度 W 的传输线布局"
  verify:
    - method: geometry_script
      tool: "pcbnew (KiCad bundled Python)"
      check: "遍历射频网络的 track 段，线宽集合大小为 1（焊盘过渡除外），等于 tline_calc 的 W；CPWG 时测与同层地铜的间隙恒定。"
      automatable: full
    - method: drc
      tool: "KiCad DRC + .kicad_dru（见 RF-NET-001）"
      check: "track_width 规则违例数为 0。"
      automatable: full
  sources:
    - title: "AN91445 Antenna Design and RF Layout Guidelines"
      url: "https://community.infineon.com/gfawx74859/attachments/gfawx74859/cnkbas/2308/1/Infineon-AN91445_Antenna_Design_and_RF_Layout_Guidelines-ApplicationNotes-v09_00-EN.pdf"
      publisher: "Infineon (Cypress)"
      kind: app_note
      section: "§7.2, §16.3"
    - title: "ESP32-C3 PCB Layout Design - RF Trace"
      url: "https://docs.espressif.com/projects/esp-hardware-design-guidelines/en/latest/esp32c3/pcb-layout-design.html"
      publisher: "Espressif Systems"
      kind: vendor_guide
      section: "RF / RF Trace"
  confidence: high

- id: RF-RTE-002
  title: 射频线尽量短，无短截线、分支和测试点
  domain: rf
  stage: routing
  severity: should
  rule: >-
    射频路径取最短；不留开路短截线、T 型分支或探针测试点；并联元件直接放在射频走线上，不要用长线引出再接，
    除非参考设计明确要求（如 ESP32-C3 芯片侧接地电容上用于抑制二次谐波的 15 mil/100 Ω 短截线，0402 及更大封装不需要）。
  rationale: >-
    走线和基板对信号的衰减与长度成正比；短截线呈电抗性，破坏匹配；参考设计中的短截线是刻意设计，不可随意添加或删除。
  applies_to: [rf_trace, shunt_component, stub]
  parameters:
    - name: esp32_c3_harmonic_stub_length
      op: "=="
      value: 15
      unit: mil
      note: "仅 ESP32-C3 芯片：芯片侧接地电容焊盘上的短截线，宽度使其 Z0 = 100 Ω ±10%，其下方第二层需清空"
  verify:
    - method: geometry_script
      tool: "pcbnew (KiCad bundled Python)"
      check: "RF 网络必须是链状拓扑：每个节点只连接链中相邻两个焊盘和至多一个并联元件；分支长度（非主链 track）为 0；无 TestPoint 封装挂在 RF 网络上。"
      automatable: full
    - method: review
      tool: "对照参考设计"
      check: "参考设计里的刻意短截线保留，其他短截线不得存在。"
      automatable: manual
  sources:
    - title: "AN91445 Antenna Design and RF Layout Guidelines"
      url: "https://community.infineon.com/gfawx74859/attachments/gfawx74859/cnkbas/2308/1/Infineon-AN91445_Antenna_Design_and_RF_Layout_Guidelines-ApplicationNotes-v09_00-EN.pdf"
      publisher: "Infineon (Cypress)"
      kind: app_note
      section: "§14.2, §16.3"
    - title: "ESP32-C3 PCB Layout Design - RF Matching Network / Stub"
      url: "https://docs.espressif.com/projects/esp-hardware-design-guidelines/en/latest/esp32c3/pcb-layout-design.html"
      publisher: "Espressif Systems"
      kind: vendor_guide
      section: "RF"
  confidence: high

- id: RF-RTE-003
  title: 射频线拐弯用圆弧或 135° 折线，不画未切角的直角
  domain: rf
  stage: routing
  severity: should
  rule: >-
    射频线尽量不拐弯；必须拐弯时用圆弧、两个 45°（内角 135°）或按公式切角的直角，保持线宽一致，避免锐角和未切角的 90° 拐角。
  rationale: >-
    拐角处局部线宽变化造成阻抗不连续；圆弧和切角保持有效宽度连续。
  applies_to: [rf_trace]
  parameters:
    - name: rf_bend_interior_angle
      op: ">="
      value: 135
      unit: deg
      note: "Espressif：使用 135° 弯折或圆弧；Nordic 论坛回答建议两个 45° 代替 90°"
    - name: mitre_width_formula
      op: qualitative
      value: null
      note: "AN91445 Fig.51：M = W*(1.04 + 1.3*exp(-1.35*W/H))，W 为线宽、H 为介质厚度"
  verify:
    - method: geometry_script
      tool: "pcbnew (KiCad bundled Python)"
      check: "遍历射频 track 相邻线段，转角 <= 45°（内角 >= 135°）；圆弧段用多段近似，每段转角 <= 45°。"
      automatable: full
  sources:
    - title: "ESP32-C3 PCB Layout Design - RF Trace"
      url: "https://docs.espressif.com/projects/esp-hardware-design-guidelines/en/latest/esp32c3/pcb-layout-design.html"
      publisher: "Espressif Systems"
      kind: vendor_guide
      section: "RF / RF Trace"
    - title: "AN91445 Antenna Design and RF Layout Guidelines"
      url: "https://community.infineon.com/gfawx74859/attachments/gfawx74859/cnkbas/2308/1/Infineon-AN91445_Antenna_Design_and_RF_Layout_Guidelines-ApplicationNotes-v09_00-EN.pdf"
      publisher: "Infineon (Cypress)"
      kind: app_note
      section: "§16.3, Figure 51"
    - title: "nRF52 antenna design review (Nordic DevZone Q&A)"
      url: "https://devzone.nordicsemi.com/f/nordic-q-a/16740/nrf52-antenna-design-review"
      publisher: "Nordic Semiconductor"
      kind: forum
  confidence: high
  conflicts: >-
    流传的「90° 拐角一定有害」没有量化出处；三份来源（Espressif、Infineon、Nordic）都只建议用圆弧/135°/切角，未给出 2.4 GHz 下直角的量化影响。
    取舍：按「避免未切角直角」作为 should，而不是 must。

- id: RF-RTE-004
  title: 射频路径上不打过孔
  domain: rf
  stage: routing
  severity: should
  rule: >-
    射频线全程走在同一外层、不换层；必须换层时，在信号过孔旁成对打接地过孔，并保持换层处参考平面连续。
  rationale: >-
    过孔有显著寄生电感，会形成阻抗不连续并使返回路径受阻，天线端尤其敏感。
  applies_to: [rf_trace]
  parameters:
    - name: vias_in_rf_path
      op: "=="
      value: 0
      unit: count
      note: "Espressif 与 Infineon 均要求射频线不换层；换层时的接地伴随过孔是通用高速做法（Espressif 对 USB 的建议），非射频专有出处"
  verify:
    - method: geometry_script
      tool: "pcbnew (KiCad bundled Python)"
      check: "RF 网络上的 via 数量 == 0。"
      automatable: full
  sources:
    - title: "ESP32-C3 PCB Layout Design - RF Trace"
      url: "https://docs.espressif.com/projects/esp-hardware-design-guidelines/en/latest/esp32c3/pcb-layout-design.html"
      publisher: "Espressif Systems"
      kind: vendor_guide
      section: "RF / RF Trace"
    - title: "AN91445 Antenna Design and RF Layout Guidelines"
      url: "https://community.infineon.com/gfawx74859/attachments/gfawx74859/cnkbas/2308/1/Infineon-AN91445_Antenna_Design_and_RF_Layout_Guidelines-ApplicationNotes-v09_00-EN.pdf"
      publisher: "Infineon (Cypress)"
      kind: app_note
      section: "§20 Vias"
  confidence: high

- id: RF-RTE-005
  title: 射频线下方参考地完整，其他走线不穿越、不并行靠近
  domain: rf
  stage: routing
  severity: must
  rule: >-
    射频线正下方（相邻层）的地平面完整无切割，不允许任何信号线从射频线下方穿过；同层不要有高频或其他信号线紧邻并行；
    射频线两侧的返回路径要宽。
  rationale: >-
    射频返回电流沿线正下方的地平面走；地被打断时电流绕行形成环路，增加电感、破坏匹配并增强泄漏和耦合。
  applies_to: [rf_trace, ground_return]
  parameters:
    - name: other_signals_under_rf_trace
      op: "=="
      value: 0
      unit: count
      note: "相邻层射频线投影下的非地走线数量"
  verify:
    - method: geometry_script
      tool: "pcbnew (KiCad bundled Python)"
      check: >-
        沿射频线以固定步长采样：参考层每个采样点下都有 GND 铜；相邻铜层不存在非 GND 的 track/via/pad 穿过射频线投影；
        同层最近的非 GND 走线间距报告出来评审（无出处数值，常用经验为线宽的 3 倍以上）。
      automatable: partial
    - method: drc
      tool: "KiCad DRC + .kicad_dru"
      check: "自定义 clearance 规则：RF 网络与其他网络（非 GND）的间距 >= 评审确定的值。"
      automatable: partial
  sources:
    - title: "AN91445 Antenna Design and RF Layout Guidelines"
      url: "https://community.infineon.com/gfawx74859/attachments/gfawx74859/cnkbas/2308/1/Infineon-AN91445_Antenna_Design_and_RF_Layout_Guidelines-ApplicationNotes-v09_00-EN.pdf"
      publisher: "Infineon (Cypress)"
      kind: app_note
      section: "§16.3, §18"
    - title: "ESP32-C3 PCB Layout Design - RF Trace"
      url: "https://docs.espressif.com/projects/esp-hardware-design-guidelines/en/latest/esp32c3/pcb-layout-design.html"
      publisher: "Espressif Systems"
      kind: vendor_guide
      section: "RF / RF Trace"
    - title: "General PCB design guidelines for nRF52 series"
      url: "https://devzone.nordicsemi.com/guides/hardware-design-test-and-measuring/b/nrf5x/posts/general-pcb-design-guidelines-for-nrf52-series"
      publisher: "Nordic Semiconductor"
      kind: vendor_guide
      section: "RF trace, Keep-out"
  confidence: high

# ---------------- plane_pour ----------------

- id: RF-PLN-001
  title: 射频区地平面整块不分割，芯片底焊盘多打过孔
  domain: rf
  stage: plane_pour
  severity: must
  rule: >-
    射频 IC、匹配网络与射频走线下方的地平面连续整块（尤其第一内层/底层），不分割、不留孤岛；
    射频 IC 底部接地焊盘用与参考设计相同数量的接地过孔接到地平面（ESP32-C3 芯片至少 9 个）；
    匹配网络地过孔到芯片焊盘的返回路径不得被其他东西挡住。
  rationale: >-
    射频地电流需要低阻抗、无阻挡的回路；分割或孤岛会引入电感和环路，使匹配偏移、杂散增加。
  applies_to: [rf_ic, qfn, ground_plane]
  parameters:
    - name: esp32_c3_chip_epad_ground_vias
      op: ">="
      value: 9
      unit: count
      note: "Espressif：ESP32-C3 芯片底部焊盘至少 9 个接地过孔；其他芯片以其参考设计的过孔数为准（Nordic：中心焊盘过孔数与参考设计一致）"
  verify:
    - method: geometry_script
      tool: "pcbnew (KiCad bundled Python)"
      check: "射频区投影内参考层的 GND zone 填充后无贯穿切口/孤岛；EPAD 过孔数 >= 参考设计数量。"
      automatable: partial
    - method: drc
      tool: "KiCad DRC"
      check: "无未连接的 GND 孤岛；zone 最小宽度、连接性规则不报错。"
      automatable: full
  sources:
    - title: "PCB Layout Design Guide (EFR32 Wireless Gecko)"
      url: "https://github.com/SiliconLabs/IoT-Developer-Boot-Camp/wiki/PCB-Layout-Design-Guide"
      publisher: "Silicon Labs"
      kind: vendor_guide
      section: "§3.1"
    - title: "ESP32-C3 PCB Layout Design - Power Supply"
      url: "https://docs.espressif.com/projects/esp-hardware-design-guidelines/en/latest/esp32c3/pcb-layout-design.html"
      publisher: "Espressif Systems"
      kind: vendor_guide
      section: "Power Supply (four-layer)"
    - title: "AN91445 Antenna Design and RF Layout Guidelines"
      url: "https://community.infineon.com/gfawx74859/attachments/gfawx74859/cnkbas/2308/1/Infineon-AN91445_Antenna_Design_and_RF_Layout_Guidelines-ApplicationNotes-v09_00-EN.pdf"
      publisher: "Infineon (Cypress)"
      kind: app_note
      section: "§18.1, §20"
  confidence: high

- id: RF-PLN-002
  title: 接地缝合过孔间距不超过 λ/20（按介质内波长）
  domain: rf
  stage: plane_pour
  severity: should
  rule: >-
    射频线两侧和射频区的顶层接地铜用接地过孔缝合到内层/底层地，过孔间距不超过工作频率波长的 1/20（FR-4 中 2.4 GHz 约 3 mm）；
    大块地铜上至少每 5 mm 一个过孔。
  rationale: >-
    过孔间距相对波长足够小才像一堵实心墙，抑制 CPWG 中顶层地与底层地之间的平行板模式和泄漏，并降低接地电感。
  applies_to: [via_stitching, cpwg, rf_trace]
  parameters:
    - name: via_pitch_max_fraction_of_wavelength
      op: "<="
      value: 0.05
      unit: wavelength
      note: "Infineon §18.1/§20：不超过 1/20 波长，原文未说明是自由空间还是介质内波长（自由空间 λ/20 在 2.4835 GHz 约 6 mm）；AtlasPCB 的表按介质内波长（εr≈3.4）取 λ/20。本条取更严的介质内波长 λg = c/(f·√εeff)：f=2.4835 GHz、εeff≈3.3 时 λg≈66 mm，1/20 约 3.3 mm；用 εr 4.3 则约 2.9 mm（自行核算）"
    - name: large_ground_area_via_pitch_max
      op: "<="
      value: 5
      unit: mm
      note: "Nordic nRF52 指南：大面积地铜上至少每 5 mm 一个过孔"
  verify:
    - method: geometry_script
      tool: "pcbnew (KiCad bundled Python)"
      check: "沿射频线两侧及射频区边缘的顶层 GND 铜边界，取相邻 GND 过孔间距，最大值 <= 3 mm（保守取 λg/20 向下取整）；大块地铜内部相邻 GND 过孔的中心距 <= 5 mm（Nordic：至少每 5 mm 一个过孔，是间距而非到最近过孔的距离）。"
      automatable: full
    - method: em_sim
      tool: "openEMS 或 2.5D 求解器"
      check: "扫 CPWG 过孔间距，S21 在 2.4 GHz 频段内无谐振陷波。"
      automatable: partial
  sources:
    - title: "AN91445 Antenna Design and RF Layout Guidelines"
      url: "https://community.infineon.com/gfawx74859/attachments/gfawx74859/cnkbas/2308/1/Infineon-AN91445_Antenna_Design_and_RF_Layout_Guidelines-ApplicationNotes-v09_00-EN.pdf"
      publisher: "Infineon (Cypress)"
      kind: app_note
      section: "§18.1, §20"
    - title: "Grounded Coplanar Waveguide (GCPW) PCB Design"
      url: "https://www.atlaspcb.com/blog/gcpw-coplanar-waveguide-pcb-design-rf-mmwave/"
      publisher: "AtlasPCB"
      kind: blog
      section: "Via Spacing Rule"
    - title: "General PCB design guidelines for nRF52 series"
      url: "https://devzone.nordicsemi.com/guides/hardware-design-test-and-measuring/b/nrf5x/posts/general-pcb-design-guidelines-for-nrf52-series"
      publisher: "Nordic Semiconductor"
      kind: vendor_guide
      section: "Ground planes and vias"
  confidence: high
  conflicts: >-
    间距说法不一：Infineon 与 AtlasPCB 用 λ/20，部分文章用 λ/10，Nordic 给 5 mm（约为 2.4 GHz 介质内波长的 1/13）。
    取舍：射频线两侧取 λg/20（约 3 mm），其他大面积地铜取 5 mm；以更严者为准。

- id: RF-PLN-003
  title: 并联接地元件的地脚旁紧贴独立接地过孔
  domain: rf
  stage: plane_pour
  severity: should
  rule: >-
    每个射频并联元件（接地电容等）的接地焊盘旁紧贴一个独立接地过孔，必要时加粗该焊盘附近的连线；不与其他焊盘共用过孔；
    QFN 封装里最靠近射频口的并联电容通过最近 ANT 脚的 VSS 脚接地（Nordic）。
  rationale: >-
    过孔离并联元件越远，就等于串了一段电感，使元件在射频线上呈现的阻抗偏离设计值，造成失配；共用过孔引入公共阻抗耦合。
  applies_to: [shunt_capacitor, matching_network, decoupling]
  parameters:
    - name: via_to_shunt_ground_pad_distance
      op: minimize
      value: null
      note: "Silicon Labs/Nordic 只要求紧贴，无具体数值"
  verify:
    - method: geometry_script
      tool: "pcbnew (KiCad bundled Python)"
      check: "对 RF 网络上每个并联接地焊盘：最近 GND 过孔距离报告并与参考设计对比；该过孔只连接 1 个元件焊盘（无共用）。"
      automatable: partial
  sources:
    - title: "AN91445 Antenna Design and RF Layout Guidelines"
      url: "https://community.infineon.com/gfawx74859/attachments/gfawx74859/cnkbas/2308/1/Infineon-AN91445_Antenna_Design_and_RF_Layout_Guidelines-ApplicationNotes-v09_00-EN.pdf"
      publisher: "Infineon (Cypress)"
      kind: app_note
      section: "§20 Vias"
    - title: "PCB Layout Design Guide (EFR32 Wireless Gecko)"
      url: "https://github.com/SiliconLabs/IoT-Developer-Boot-Camp/wiki/PCB-Layout-Design-Guide"
      publisher: "Silicon Labs"
      kind: vendor_guide
      section: "§3.5"
    - title: "General PCB design guidelines for nRF52 series"
      url: "https://devzone.nordicsemi.com/guides/hardware-design-test-and-measuring/b/nrf5x/posts/general-pcb-design-guidelines-for-nrf52-series"
      publisher: "Nordic Semiconductor"
      kind: vendor_guide
      section: "Matching network, Ground planes and vias"
  confidence: high

- id: RF-PLN-004
  title: 匹配区走线和焊盘到邻近地铜至少 0.5 mm
  domain: rf
  stage: plane_pour
  severity: should
  rule: >-
    匹配网络区域内，走线和焊盘到相邻地铜的间距不小于 0.5 mm，以减小对地寄生电容、避免失谐；
    CPWG 馈线区域则保持由阻抗计算得出的恒定间隙。
  rationale: >-
    间距越小对地电容越大，匹配元件值与实际有效值偏差越大；匹配网络对这些寄生很敏感。
  applies_to: [matching_network, copper_pour]
  parameters:
    - name: matching_area_gnd_clearance
      op: ">="
      value: 0.5
      unit: mm
      note: "Silicon Labs EFR32 指南；单一厂商的数值，其他芯片以其参考设计为准"
  verify:
    - method: drc
      tool: "KiCad DRC + .kicad_dru（限定在匹配区 rule area）"
      check: "(rule rf_match_gnd_clearance (condition \"A.NetClass == 'RF' && B.Type == 'Zone'\") (constraint clearance (min 0.5mm))) 仅对匹配区域生效；CPWG 馈线区另设间隙规则。DRC 违例为 0。"
      automatable: full
  sources:
    - title: "PCB Layout Design Guide (EFR32 Wireless Gecko)"
      url: "https://github.com/SiliconLabs/IoT-Developer-Boot-Camp/wiki/PCB-Layout-Design-Guide"
      publisher: "Silicon Labs"
      kind: vendor_guide
      section: "§3.1, §3.2"
  confidence: medium

- id: RF-PLN-005
  title: 射频路径下的内层：按厂商参考叠层选实心地或整片禁布
  domain: rf
  stage: plane_pour
  severity: should
  rule: >-
    射频线/匹配网络下方的内层要么是完整地平面（该层即线的参考层），要么按厂商要求整片挖空（线以更远的层为参考，用 CPWG 修正线宽）；
    二者不能混用，以所用芯片参考设计的叠层和参考层为准，并据此用对应的阻抗模型计算线宽，同时保证参考层与射频线之间没有其他走线。
  rationale: >-
    内层铜与顶层线之间的距离决定对地寄生电容和特性阻抗；不同芯片的参考设计基于不同的参考层。
  applies_to: [4-layer, matching_network, rf_trace]
  verify:
    - method: geometry_script
      tool: "pcbnew (KiCad bundled Python)"
      check: >-
        方案 A（实心地）：参考层 GND 铜覆盖射频线与匹配网络投影，该层无其他走线；
        方案 B（挖空）：内层在射频线或 RX 匹配网络投影区域无铜（可用 rule area 实现），线宽按更远的参考层重算。
      automatable: partial
    - method: tline_calc
      tool: "KiCad PCB Calculator"
      check: "按所选方案的参考层高度重新计算 50 Ω 线宽，与布局一致。"
      automatable: partial
  sources:
    - title: "General PCB design guidelines for nRF52 series"
      url: "https://devzone.nordicsemi.com/guides/hardware-design-test-and-measuring/b/nrf5x/posts/general-pcb-design-guidelines-for-nrf52-series"
      publisher: "Nordic Semiconductor"
      kind: vendor_guide
      section: "Keep-out"
    - title: "PCB Layout Design Guide (EFR32 Wireless Gecko)"
      url: "https://github.com/SiliconLabs/IoT-Developer-Boot-Camp/wiki/PCB-Layout-Design-Guide"
      publisher: "Silicon Labs"
      kind: vendor_guide
      section: "§3.1 (2.4 GHz), §3.2 (sub-GHz)"
    - title: "ESP32-C3 PCB Layout Design - Stub in a four-layer PCB"
      url: "https://docs.espressif.com/projects/esp-hardware-design-guidelines/en/latest/esp32c3/pcb-layout-design.html"
      publisher: "Espressif Systems"
      kind: vendor_guide
      section: "RF / RF Matching Network"
  confidence: medium
  conflicts: >-
    Silicon Labs（2.4 GHz）与 Espressif（L2 完整地）要求射频区下的第一内层铺连续地；
    Nordic nRF52（多层板射频路径下内层禁布）与 Silicon Labs sub-GHz RX 匹配（内层禁布以降低对地寄生电容）则要求挖空。
    取舍：这是芯片参考设计各自假设的参考层不同，不能凭此推翻任一方；采用所用芯片厂商的方案。

# ---------------- manufacturing ----------------

- id: RF-MFG-001
  title: 下单前锁定叠层与阻抗要求，换板厂须重算射频线宽
  domain: rf
  stage: manufacturing
  severity: should
  rule: >-
    射频线宽依赖板厂叠层：投板前向板厂确认叠层（层间介质厚度、Dk）并写进制造说明；更换板厂或叠层时按新叠层重算射频线宽并改板；
    批量产品要求阻抗测试（JLCPCB 免费标准测试公差 ±20%，精密测试收费）。
  rationale: >-
    同样板厚的不同板厂层间距可以不同，线宽与介质厚度成正比，沿用旧线宽会使阻抗偏离。
  applies_to: [fabrication, impedance_control, jlcpcb]
  parameters:
    - name: jlcpcb_standard_impedance_test_tolerance
      op: "=="
      value: 20
      unit: "%"
      note: "JLCPCB 层压结构页：标准免费阻抗测试公差 ±20%；其层压页面面向 4-32 层多层板，2 层板用厂商叠层 + 计算器核算并实测"
  verify:
    - method: review
      tool: "制造说明（fab notes）核对"
      check: "制造说明写明叠层编号/各层厚度、阻抗控制网络及线宽、公差；与 RF-STK-001 的计算输入一致。"
      automatable: manual
    - method: geometry_script
      tool: "pcbnew (KiCad bundled Python)"
      check: "读取 .kicad_pcb 叠层设置，层厚与 Dk 同板厂叠层表一致；射频线宽等于当前叠层的计算值。"
      automatable: partial
  sources:
    - title: "AN91445 Antenna Design and RF Layout Guidelines"
      url: "https://community.infineon.com/gfawx74859/attachments/gfawx74859/cnkbas/2308/1/Infineon-AN91445_Antenna_Design_and_RF_Layout_Guidelines-ApplicationNotes-v09_00-EN.pdf"
      publisher: "Infineon (Cypress)"
      kind: app_note
      section: "§17.1 Four-Layer PCB"
    - title: "Multi-Layer PCB Standard Laminated Structures"
      url: "https://jlcpcb.com/help/article/multi-layer-pcb-standard-laminated-structures"
      publisher: "JLCPCB"
      kind: vendor_guide
  confidence: high

# ---------------- verification ----------------

- id: RF-VER-001
  title: 天线端回波损耗 S11 <= -10 dB 覆盖整个工作频段
  domain: rf
  stage: verification
  severity: should
  rule: >-
    匹配调好后，从芯片/模组输出口向天线看，S11 在整个工作频段（2.4 GHz ISM 为 2.400-2.4835 GHz，BLE 为 2.402-2.482 GHz）<= -10 dB
    （反射功率 <= 10%，VSWR 约 1.9）；VSWR 1.5（RL 14 dB）算很好，VSWR > 2（RL < 9.5 dB）要重新检查匹配。
  rationale: >-
    回波损耗 > 10 dB 意味着约 90% 的功率进入天线；失配是链路预算中最大的损失来源之一。
  applies_to: [antenna, s11, vna]
  parameters:
    - name: s11_in_band
      op: "<="
      value: -10
      unit: dB
      note: "Infineon §15；TI AN058 示例以 S11 < -10 dB 为要求；Taoglas 以带中心 -10 dB、VSWR < 2:1 为目标"
    - name: vswr_good_match
      op: "<="
      value: 1.5
      unit: ratio
      note: "TI AN058 §3.4：VSWR 1.5（RL 14 dB）算良好匹配"
    - name: vswr_review_threshold
      op: ">"
      value: 2.0
      unit: ratio
      note: "VSWR 2.0 即 RL 9.5 dB，通常用作带宽判据；超过需检查匹配"
  verify:
    - method: bench
      tool: "VNA（一端口校准）+ scikit-rf"
      check: >-
        在连接器参考面做一端口校准，扫 2.3-2.6 GHz，导入 touchstone：
        band = skrf.Network('s11.s1p')['2.4-2.4835ghz']，要求 (band.s_db[:,0,0] <= -10).all()。
      automatable: full
    - method: em_sim
      tool: "openEMS"
      check: "仿真结果同样在 2.400-2.4835 GHz 内 S11 <= -10 dB（见 RF-VER-004）。"
      automatable: partial
  sources:
    - title: "AN91445 Antenna Design and RF Layout Guidelines"
      url: "https://community.infineon.com/gfawx74859/attachments/gfawx74859/cnkbas/2308/1/Infineon-AN91445_Antenna_Design_and_RF_Layout_Guidelines-ApplicationNotes-v09_00-EN.pdf"
      publisher: "Infineon (Cypress)"
      kind: app_note
      section: "§15 Antenna Tuning"
    - title: "AN058 Antenna Selection Guide (SWRA161B)"
      url: "https://www.ti.com/lit/pdf/swra161"
      publisher: "Texas Instruments"
      kind: app_note
      section: "§3.4, §6.2.4"
    - title: "Application Note for PA.25.A Antenna Integration (APN-11-8-002)"
      url: "https://www.taoglas.com/assets/application-notes/APN-11-8-002.C.pdf"
      publisher: "Taoglas"
      kind: app_note
      section: "§4 Bandwidth"
  confidence: high

- id: RF-VER-002
  title: 用 VNA 测天线：校准到参考面，在最终外壳和手持下复测
  domain: rf
  stage: verification
  severity: should
  rule: >-
    测量前做一端口校准并把参考面移到测量点，用短于 5 cm 的半刚性电缆、屏蔽层就近接地；电缆固定走向，必要时加铁氧体；
    放在不致失谐的支撑（木桌/泡沫）上，手离开。先测裸板，再装进最终外壳、手持（或实际放置）复测，并移开芯片侧（拆掉匹配元件）测天线侧。
  rationale: >-
    电缆摆放可使 S11 变化达 3 dB；小地平面板上电缆外皮有电流，使读数不稳；塑料外壳和人手会使谐振频率下移，甚至使带内回损劣于 10 dB。
  applies_to: [vna, antenna_tuning, enclosure]
  parameters:
    - name: calibration_cable_max_length
      op: "<"
      value: 5
      unit: cm
      note: "TI AN-1811：校准用半刚性电缆短于 5 cm，否则电延迟过长"
    - name: cable_placement_induced_s11_variation
      op: "<="
      value: 3
      unit: dB
      note: "Infineon §15.1.1：同轴线摆放可使 S11 变化达 3 dB（说明测量不确定度，不是验收值）"
  verify:
    - method: bench
      tool: "VNA + 半刚性电缆 + 铁氧体"
      check: >-
        按顺序：①校准（开路/短路/负载）；②裸板测 S11；③装入最终外壳复测；④手持复测；
        各状态 2.400-2.4835 GHz 内 S11 均 <= -10 dB，且谐振点偏移在带宽余量之内。
      automatable: manual
  sources:
    - title: "AN058 Antenna Selection Guide (SWRA161B)"
      url: "https://www.ti.com/lit/pdf/swra161"
      publisher: "Texas Instruments"
      kind: app_note
      section: "§6.2.1-6.2.4"
    - title: "AN-1811 Bluetooth Antenna Design (SNOA519B)"
      url: "https://www.ti.com/lit/an/snoa519b/snoa519b.pdf"
      publisher: "Texas Instruments"
      kind: app_note
      section: "§4.1 Network Analyzer Calibration, §4.2 Measurement"
    - title: "AN91445 Antenna Design and RF Layout Guidelines"
      url: "https://community.infineon.com/gfawx74859/attachments/gfawx74859/cnkbas/2308/1/Infineon-AN91445_Antenna_Design_and_RF_Layout_Guidelines-ApplicationNotes-v09_00-EN.pdf"
      publisher: "Infineon (Cypress)"
      kind: app_note
      section: "§15.1"
  confidence: high

- id: RF-VER-003
  title: 板子回来后用 Smith 圆图调 π 匹配网络
  domain: rf
  stage: verification
  severity: should
  rule: >-
    装好 π 预留位后，在 VNA 上测匹配点处的复阻抗，在 Smith 圆图上选拓扑：串联 L 沿恒电阻圆顺时针、串联 C 逆时针，
    并联 L 沿恒电导圆逆时针、并联 C 顺时针；逐元件调到谐振点落在频段中心；再在最终外壳和手持状态下复核；记录最终元件值并写进量产 BOM。
  rationale: >-
    实际元件有寄生电阻和电容，理论值不会精确成立，需要试凑；环境（外壳、手）会改变天线阻抗，必须在使用环境下调。
  applies_to: [pi_network, antenna_tuning, smith_chart]
  verify:
    - method: bench
      tool: "VNA + Smith 圆图 / scikit-rf"
      check: >-
        测量点与元件放置点一致；每次只改一个元件，S11 谐振凹点移向 2.44 GHz 附近并达到 RF-VER-001 的指标；
        BOM 记录最终值，DNP 位与 0 Ω 位在 BOM 中明确。
      automatable: manual
    - method: spice
      tool: "scikit-rf（Smith 圆图/匹配）或 ngspice .ac"
      check: "用测得的复阻抗做匹配仿真，选取初始元件值，减少试凑次数。"
      automatable: partial
  sources:
    - title: "AN91445 Antenna Design and RF Layout Guidelines"
      url: "https://community.infineon.com/gfawx74859/attachments/gfawx74859/cnkbas/2308/1/Infineon-AN91445_Antenna_Design_and_RF_Layout_Guidelines-ApplicationNotes-v09_00-EN.pdf"
      publisher: "Infineon (Cypress)"
      kind: app_note
      section: "§14.1, §14.2, §15, Appendix A"
    - title: "AN-1811 Bluetooth Antenna Design (SNOA519B)"
      url: "https://www.ti.com/lit/an/snoa519b/snoa519b.pdf"
      publisher: "Texas Instruments"
      kind: app_note
      section: "§4.3 Tuning the Impedance, §4.4 PI-Network Matching"
    - title: "Chip Antenna Layout Considerations for BLE, 802.11, and 2.4G Zigbee"
      url: "https://www.johansontechnology.com/tech-notes/chip-antenna-layout-considerations-for-ble-80211-and-24g-zigbee/"
      publisher: "Johanson Technology"
      kind: app_note
  confidence: high

- id: RF-VER-004
  title: 定制 PCB 天线先做电磁仿真再投板
  domain: rf
  stage: verification
  severity: should
  rule: >-
    自行设计或改动 PCB 天线、地平面或禁布区时，先用 3D EM 求解器（如 openEMS）仿真 S11、输入阻抗和方向图，网格取最高频率波长的 1/20 左右，
    再制板实测；直接拷贝厂商参考设计时可省仿真，但仍要实测。
  rationale: >-
    PCB 天线设计并不简单，通常必须用仿真工具才能得到可接受的方案；而地平面、外壳等因素又需要实测修正。
  applies_to: [em_sim, pcb_antenna, openEMS]
  parameters:
    - name: mesh_resolution
      op: "<="
      value: 0.05
      unit: wavelength
      note: "openEMS Simple Patch Antenna 教程取 mesh_res = C0/(f0+fc)/20，即最高频率波长的 1/20；仅为教程设置"
  verify:
    - method: em_sim
      tool: "openEMS + CSXCAD（Python），后处理用 scikit-rf"
      check: >-
        建模基板 εr、铜、地平面尺寸和禁布区，50 Ω 集总端口，扫 2.3-2.6 GHz；S11 = port.uf_ref/port.uf_inc；
        通过：2.400-2.4835 GHz 内 S11 <= -10 dB，并检查方向图/效率。
      automatable: partial
  sources:
    - title: "Simple Patch Antenna - openEMS tutorial"
      url: "https://openems.readthedocs.io/en/latest/python/openEMS/Tutorials/Simple_Patch_Antenna.html"
      publisher: "openEMS"
      kind: tool_doc
    - title: "AN058 Antenna Selection Guide (SWRA161B)"
      url: "https://www.ti.com/lit/pdf/swra161"
      publisher: "Texas Instruments"
      kind: app_note
      section: "§4.1.1 TI Antenna Reference Designs (PCB antenna design usually needs a simulation tool); §8.2 EM Simulation Tools"
    - title: "ESP32-C3 PCB Layout Design - RF Matching Network"
      url: "https://docs.espressif.com/projects/esp-hardware-design-guidelines/en/latest/esp32c3/pcb-layout-design.html"
      publisher: "Espressif Systems"
      kind: vendor_guide
      section: "RF"
  confidence: medium

- id: RF-VER-005
  title: 用传导口预扫发射功率、谐波与杂散
  domain: rf
  stage: verification
  severity: should
  rule: >-
    在传导测试口（U.FL 或临时焊出）用频谱仪测最大发射功率、二/三次谐波和带外杂散，对照目标法规限值留余量后再送认证实验室：
    FCC 15.247(b)(3)/(d)（<= 1 W，带外 >= 20 dBc）与 ETSI EN 300 328（e.i.r.p. <= 20 dBm，1-12.75 GHz 杂散 <= -30 dBm/1 MHz）。
  rationale: >-
    谐波与杂散由匹配和滤波决定，布局偏离参考设计时最容易超标；预扫能在认证前发现问题并便于调匹配网络。
  applies_to: [conducted_test, harmonics, certification]
  parameters:
    - name: fcc_out_of_band_suppression
      op: ">="
      value: 20
      unit: dB
      note: "15.247(d)，100 kHz 带宽相对带内最高值；RMS 平均测功率时为 30 dB"
    - name: etsi_spurious_1_to_12p75ghz
      op: "<="
      value: -30
      unit: dBm
      note: "每 1 MHz 带宽，EN 300 328 Table 4/12"
  verify:
    - method: bench
      tool: "频谱仪 + 传导测试口 + 衰减器"
      check: "按设计的最大功率档发射，测峰值/平均功率、2×/3× 谐波与 30 MHz-12.75 GHz 杂散，扣除线损后均满足限值并留余量。"
      automatable: manual
    - method: emc_precompliance
      tool: "近场探头 + 频谱仪（辐射预扫）"
      check: "整机状态下做辐射预扫，重点看谐波频点与时钟谐波。"
      automatable: manual
  sources:
    - title: "47 CFR 15.247"
      url: "https://www.ecfr.gov/current/title-47/chapter-I/subchapter-A/part-15/subpart-C/subject-group-ECFR2f2e5828339709e/section-15.247"
      publisher: "eCFR / US Government"
      kind: standard
      section: "(b)(3), (d)"
    - title: "ETSI EN 300 328 V2.2.2"
      url: "https://www.etsi.org/deliver/etsi_en/300300_300399/300328/02.02.02_60/en_300328v020202p.pdf"
      publisher: "ETSI"
      kind: standard
      section: "§4.3.1.10.3 Table 4, §4.3.2.9.3 Table 12"
    - title: "AN91445 Antenna Design and RF Layout Guidelines"
      url: "https://community.infineon.com/gfawx74859/attachments/gfawx74859/cnkbas/2308/1/Infineon-AN91445_Antenna_Design_and_RF_Layout_Guidelines-ApplicationNotes-v09_00-EN.pdf"
      publisher: "Infineon (Cypress)"
      kind: app_note
      section: "§22 Design for Testability"
  confidence: high

- id: RF-VER-006
  title: 在最终产品上实测吞吐量与通信距离
  domain: rf
  stage: verification
  severity: should
  rule: >-
    外壳装好后，在代表性环境中测吞吐量/丢包率与最大通信距离，并与链路预算对比；可用 golden board 在校准衰减下测 PER（双向各测一次），
    或在消声室/OTA 测 TRP；任何影响天线环境的结构改动后重测。
  rationale: >-
    天线性能受外壳、手、安装位置等整机因素影响，只有整机实测才能确认射频性能；PER 法在没有 VNA/消声室时也可检验装配正确性。
  applies_to: [range_test, ota, final_product, esp32-c3-wroom-02]
  verify:
    - method: bench
      tool: "路由器/对端设备 + iperf 或 RSSI/PER 统计；golden board"
      check: >-
        固定位置与朝向，记录不同距离的吞吐量/PER/RSSI；与 RF-ARC-001 的预算对比；
        外壳、料盒、猫食机金属部件在位。
      automatable: manual
  sources:
    - title: "ESP32-C3 PCB Layout Design - Positioning a Module on a Base Board"
      url: "https://docs.espressif.com/projects/esp-hardware-design-guidelines/en/latest/esp32c3/pcb-layout-design.html"
      publisher: "Espressif Systems"
      kind: vendor_guide
    - title: "AN91445 Antenna Design and RF Layout Guidelines"
      url: "https://community.infineon.com/gfawx74859/attachments/gfawx74859/cnkbas/2308/1/Infineon-AN91445_Antenna_Design_and_RF_Layout_Guidelines-ApplicationNotes-v09_00-EN.pdf"
      publisher: "Infineon (Cypress)"
      kind: app_note
      section: "§22"
    - title: "AN058 Antenna Selection Guide (SWRA161B)"
      url: "https://www.ti.com/lit/pdf/swra161"
      publisher: "Texas Instruments"
      kind: app_note
      section: "§6.3 Over-The-Air Measurements"
  confidence: high
  tags: [cat-feeder]

- id: RF-VER-007
  title: 用 SPICE/S 参数先仿匹配网络（含元件寄生）
  domain: rf
  stage: verification
  severity: consider
  rule: >-
    布板前用 ngspice（.ac）或 scikit-rf 把匹配网络按元件的 ESL/ESR/SRF/Q 模型仿真，检查 S11/S21（含谐波频点）和 Smith 圆图；
    同时看插入损耗，因为低 Q 元件会让 S11 看着好而能量实际耗在电阻里。
  rationale: >-
    理想元件仿真与实际会偏差很大，用寄生参数估算实际可得电抗，能减少试凑次数并早期发现 SRF 或 Q 不够。
  applies_to: [spice, matching_network, scikit-rf]
  verify:
    - method: spice
      tool: "ngspice .ac（电阻终接做 S 参数提取）或 scikit-rf 级联网络"
      check: "用厂商 S 参数/SPICE 模型替换理想元件，提取 2.4 GHz 附近 S11 与插入损耗，以及谐波频点（如 4.8/7.2 GHz）的 S21，对照 RF-VER-001 与 RF-SCH-005 的目标。"
      automatable: partial
  sources:
    - title: "AN91445 Antenna Design and RF Layout Guidelines"
      url: "https://community.infineon.com/gfawx74859/attachments/gfawx74859/cnkbas/2308/1/Infineon-AN91445_Antenna_Design_and_RF_Layout_Guidelines-ApplicationNotes-v09_00-EN.pdf"
      publisher: "Infineon (Cypress)"
      kind: app_note
      section: "§14.2, §21.2"
    - title: "scikit-rf documentation"
      url: "https://scikit-rf.readthedocs.io/en/latest/"
      publisher: "scikit-rf"
      kind: tool_doc
    - title: "ESP32-C3 Schematic Checklist - RF Tuning"
      url: "https://docs.espressif.com/projects/esp-hardware-design-guidelines/en/latest/esp32c3/schematic-checklist.html"
      publisher: "Espressif Systems"
      kind: vendor_guide
      section: "RF Tuning"
  confidence: medium
