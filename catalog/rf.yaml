# ---------------- stackup ----------------

- id: RF-STK-001
  title: 用板厂实际叠层算 50 Ω 线宽，并接受 Dk 与阻抗公差
  domain: rf
  stage: stackup
  severity: should
  rule: >-
    射频线宽必须用板厂提供的实际叠层（线到参考层的介质厚度、Dk、铜厚、阻焊）计算，换板厂或换叠层即重算；
    FR-4 的 Dk 与阻抗公差不可靠，要靠匹配网络预留位与实测调谐兜底，不要依赖 50 Ω 的绝对精度。
    线到参考层越薄，50 Ω 线越窄；双层 > 0.8 mm 的板线很宽，且宽线易激发寄生模式。
  rationale: >-
    线宽与介质厚度成正比；板厂的 Dk 是按实际工艺推导的值而非树脂原始数据；JLCPCB 免费标准阻抗测试公差为 ±20%。
  applies_to: [microstrip, cpwg, fr4, jlcpcb]
  parameters:
    - name: jlcpcb_prepreg_7628_dk
      op: "=="
      value: 4.4
      unit: dimensionless
      note: "JLCPCB 阻抗页；3313=4.1、1080=3.91、2116=4.16；芯板 4.6；阻焊 3.8（厚度 0.6-1.2 mil）"
    - name: jlcpcb_core_dk
      op: "=="
      value: 4.6
      unit: dimensionless
    - name: fr4_dk_used_in_infineon_table
      op: "=="
      value: 4.3
      unit: dimensionless
      note: "AN91445 Table 2 使用 4.3，另见 JLCPCB 4.4/4.6；不同来源差 5% 以上，印证必须用板厂值"
    - name: jlcpcb_standard_impedance_tolerance
      op: "=="
      value: 20
      unit: "%"
      note: "免费标准阻抗测试公差 ±20%，精密测试收费"
    - name: two_layer_thick_board_threshold
      op: ">"
      value: 0.8
      unit: mm
      note: "AN91445 §17.2：双层板超过 0.8 mm 时射频线显著变宽"
  verify:
    - method: tline_calc
      tool: "KiCad PCB Calculator（TransLine：Microstrip / Coplanar waveguide with ground plane）"
      check: >-
        用板厂 H、εr、铜厚、阻焊输入，求 50 Ω 的 W（和 CPWG 的 G）；与布局线宽一致。
        自行核算（Hammerstad-Jensen，不含阻焊与铜厚修正）：双层 1.6 mm（H≈1.5 mm、εr 4.4）微带约 2.9 mm；
        JLC04161H-7628 四层顶层相对 L2（H=0.2104 mm、εr 4.4）约 0.40 mm；εr ±5% 时 Z0 变化约 ±1.2 Ω。
      automatable: partial
    - method: geometry_script
      tool: "pcbnew (KiCad bundled Python)"
      check: "读取 .kicad_pcb 的叠层设置，介质厚度/Dk 与板厂叠层表一致；RF 线宽等于上一步计算值。"
      automatable: partial
  sources:
    - title: "Controlled Impedance PCB Layer Stackup"
      url: "https://jlcpcb.com/impedance"
      publisher: "JLCPCB"
      kind: vendor_guide
    - title: "Multi-Layer PCB Standard Laminated Structures"
      url: "https://jlcpcb.com/help/article/multi-layer-pcb-standard-laminated-structures"
      publisher: "JLCPCB"
      kind: vendor_guide
      section: "impedance tolerance, key reminders"
    - title: "AN91445 Antenna Design and RF Layout Guidelines"
      url: "https://community.infineon.com/gfawx74859/attachments/gfawx74859/cnkbas/2308/1/Infineon-AN91445_Antenna_Design_and_RF_Layout_Guidelines-ApplicationNotes-v09_00-EN.pdf"
      publisher: "Infineon (Cypress)"
      kind: app_note
      section: "§7.2 Table 2, §17.1, §17.2"
  confidence: high
  conflicts: >-
    Dk 取值：Infineon 表用 4.3，JLCPCB 公布预浸料 4.4、芯板 4.6，通用资料给 4.0-4.8。取舍：只采用拟投板厂公布的值，
    且 JLCPCB 说明其 Dk 是按实际工艺推导的。

- id: RF-STK-002
  title: 50 Ω 馈线优先用带地共面波导（CPWG）
  domain: rf
  stage: stackup
  severity: should
  rule: >-
    介质较厚（如 1.6 mm 双层板）或线上要并联接地元件时，用带底层地的共面波导而非纯微带：线两侧同层铺地、间隙恒定，
    顶层两侧地之间的间距小于介质厚度 H（否则退化为微带），两侧地铜宽度大于该间距，并用接地过孔缝合到底层地。
  rationale: >-
    CPWG 隔离更好、EMI 更低、串扰更小，也便于并联元件接地；同时线宽和间隙两个自由度可补偿叠层厚度偏差，降低对板厚波动的敏感度。
  applies_to: [cpwg, 50ohm, fr4]
  parameters:
    - name: cpwg_ground_to_ground_spacing_over_height
      op: "<"
      value: 1
      unit: ratio
      note: "AN91445 §16.3：顶层两侧地之间的间距须小于介质厚度 H，否则主要表现为微带"
  verify:
    - method: tline_calc
      tool: "KiCad PCB Calculator（Coplanar waveguide with ground plane）或 AppCAD"
      check: "输入板厂叠层，求 50 Ω 的 W、G；检查 (W + 2G) < H。"
      automatable: full
    - method: geometry_script
      tool: "pcbnew (KiCad bundled Python)"
      check: "沿射频线逐段测与同层地铜的间隙：全程恒定（无渐变），两侧地铜宽度均大于 (W + 2G)。"
      automatable: partial
  sources:
    - title: "AN91445 Antenna Design and RF Layout Guidelines"
      url: "https://community.infineon.com/gfawx74859/attachments/gfawx74859/cnkbas/2308/1/Infineon-AN91445_Antenna_Design_and_RF_Layout_Guidelines-ApplicationNotes-v09_00-EN.pdf"
      publisher: "Infineon (Cypress)"
      kind: app_note
      section: "§16.1-16.3"
    - title: "PCB Layout Design Guide (EFR32 Wireless Gecko)"
      url: "https://github.com/SiliconLabs/IoT-Developer-Boot-Camp/wiki/PCB-Layout-Design-Guide"
      publisher: "Silicon Labs"
      kind: vendor_guide
      section: "§3.1, §3.5"
    - title: "KiCad PCB Calculator"
      url: "https://docs.kicad.org/5.1/en/pcb_calculator/pcb_calculator.html"
      publisher: "KiCad"
      kind: tool_doc
      section: "TransLine"
  confidence: high

- id: RF-STK-003
  title: 分立射频优先 4 层；2 层板底层须为整块实心地
  domain: rf
  stage: stackup
  severity: should
  rule: >-
    分立射频 IC 设计优先 4 层：L1 射频与元件，L2 完整地平面（射频区不走线），L3 电源，L4 非射频；
    用 2 层时板尽量薄，射频、元件、电源线都在顶层，底层为整块实心地（至少覆盖整个射频区），底层不放元件、少走线。
  rationale: >-
    射频信号的返回电流在线正下方的地平面里；地平面不完整就绕行成环路，增加电感、破坏匹配并加大泄漏。
  applies_to: [discrete_rf, module_baseboard, 2-layer]
  parameters:
    - name: two_layer_board_max_thickness_preferred
      op: "<="
      value: 0.8
      unit: mm
      note: "AN91445 §17.2：双层板应尽量薄；超过 0.8 mm 线宽显著增大。JLC 常用 1.6 mm 时改用 CPWG（RF-STK-002）"
  verify:
    - method: geometry_script
      tool: "pcbnew (KiCad bundled Python)"
      check: "双层板：沿每段射频线及射频 IC/匹配网络投影采样，底层同位置必须有 GND 铜（无间断、无信号线）；四层板：L2 在射频区无切割、无走线。"
      automatable: full
    - method: review
      tool: "叠层评审"
      check: "确认叠层与厂商参考设计一致（层数、参考层、板厚）。"
      automatable: manual
  sources:
    - title: "AN91445 Antenna Design and RF Layout Guidelines"
      url: "https://community.infineon.com/gfawx74859/attachments/gfawx74859/cnkbas/2308/1/Infineon-AN91445_Antenna_Design_and_RF_Layout_Guidelines-ApplicationNotes-v09_00-EN.pdf"
      publisher: "Infineon (Cypress)"
      kind: app_note
      section: "§17.1, §17.2, §18"
    - title: "ESP32-C3 PCB Layout Design - General Principles of PCB Layout for the Chip"
      url: "https://docs.espressif.com/projects/esp-hardware-design-guidelines/en/latest/esp32c3/pcb-layout-design.html"
      publisher: "Espressif Systems"
      kind: vendor_guide
      section: "General Principles of PCB Layout for the Chip"
  confidence: high
  conflicts: >-
    Infineon 称射频设计强烈推荐 4 层，Espressif 同样首推 4 层但给出可行的 2 层方案（底层整块地、无元件、少走线）。
    取舍：分立射频 IC 首选 4 层；以模组为主且主板无射频走线的 2 层板（如猫食机）可接受，前提是遵守模组禁布与地平面要求。
  tags: [cat-feeder]

# ---------------- floorplan ----------------

- id: RF-FLR-001
  title: 天线放板边或板角，馈点贴近板边，辐射部分悬出板外
  domain: rf
  stage: floorplan
  severity: must
  rule: >-
    带板载 PCB 天线的模组，天线部分放在底板之外（悬出板边），馈点尽量贴近板边；天线无法悬出时馈点仍贴近板边，
    并把底板在天线两侧和下方挖空形成净空；不要把模组放在板中央、四周都挖空。分立 PCB 天线放在板角，与其余电路保持净空。
  rationale: >-
    底板的铜和板材会改变天线的电容负载和辐射；放在板边/角能让辐射区尽量远离底板，并保留馈点附近的地。
  applies_to: [module_antenna, pcb_antenna, esp32-c3-wroom-02]
  parameters:
    - name: module_position
      op: qualitative
      value: null
      note: "边缘或角落；Murata 对其模组称角落最佳、边缘中点不推荐"
  verify:
    - method: geometry_script
      tool: "pcbnew (KiCad bundled Python)，参见 ee-pcb-verify 的 geometry 检查器"
      check: >-
        取模组天线区（keepout rule area）外包框与 Edge.Cuts 比较：天线区至少一边悬出或贴近板边；天线区中心到最近板边的距离小于到板中心的距离；
        天线区其余三侧无底板（cutout）或为 keepout。尺寸以 Espressif 图 "Keepout Zone for ESP32-C3 Module's Antenna" 为准：
        天线区高 6 mm（模组宽 18 mm），其左、右、上方的净空区各 >= 15 mm（图中 Min15；即约 48 x 21 mm 的净空区，其内底板挖空）；
        猫食机板自己的禁布区取值须按此图核对（其仓库契约中的数值未在本库核实）。
      automatable: partial
    - method: review
      tool: "对照 Espressif 模组放置示意图"
      check: "对照 Hardware Design Guidelines 中「Placement of ESP32-C3 Modules on Base Board」图，确认属于推荐位置。"
      automatable: manual
  sources:
    - title: "ESP32-C3 PCB Layout Design - General Principles of PCB Layout for Modules"
      url: "https://docs.espressif.com/projects/esp-hardware-design-guidelines/en/latest/esp32c3/pcb-layout-design.html"
      publisher: "Espressif Systems"
      kind: vendor_guide
      section: "Positioning a Module on a Base Board"
    - title: "MBN52832 BLE Module Layout Guide"
      url: "https://www.murata.com/-/media/webrenewal/products/connectivitymodule/asset/pub/rfm/data/mbn52832_antenna_layout_guide.ashx?la=en&cvid=20210615064716000000"
      publisher: "Murata"
      kind: vendor_guide
      section: "Module location on the PCB"
    - title: "AN91445 Antenna Design and RF Layout Guidelines"
      url: "https://community.infineon.com/gfawx74859/attachments/gfawx74859/cnkbas/2308/1/Infineon-AN91445_Antenna_Design_and_RF_Layout_Guidelines-ApplicationNotes-v09_00-EN.pdf"
      publisher: "Infineon (Cypress)"
      kind: app_note
      section: "§12"
  confidence: high
  tags: [cat-feeder]

- id: RF-FLR-002
  title: 天线禁布区内所有铜层禁铜、禁线、禁件、禁螺丝
  domain: rf
  stage: floorplan
  severity: must
  rule: >-
    厂商图纸规定的天线禁布区内，所有铜层都不得有地、电源、走线、过孔、焊盘、元件、安装螺丝或其他导体；
    禁布区几何必须与天线数据手册一致，不得缩小。
  rationale: >-
    近场内的任何导体都会使天线失谐或吸收辐射；偏离数据手册的禁布区会让性能不可预测、效率降低。
  applies_to: [pcb_antenna, chip_antenna, module_antenna]
  parameters:
    - name: keepout_copper_layers
      op: qualitative
      value: null
      note: "全部铜层，含内层"
    - name: murata_mbn52832_ground_clearance_min
      op: ">="
      value: 3.3
      unit: mm
      note: "仅 Murata MBN52832 模组：地平面到天线区 >= 3.3 mm；其他天线按其数据手册"
  verify:
    - method: drc
      tool: "KiCad DRC（天线封装的 keepout rule area）"
      check: "keepout 违例数为 0。"
      automatable: full
    - method: geometry_script
      tool: "pcbnew (KiCad bundled Python)"
      check: >-
        取禁布区多边形（含悬出板外部分），遍历所有层的 track、via、zone 填充、pad、封装 courtyard，与多边形相交的数量为 0（天线自身焊盘除外）；
        并检查螺丝孔/定位柱坐标。
      automatable: full
  sources:
    - title: "AN91445 Antenna Design and RF Layout Guidelines"
      url: "https://community.infineon.com/gfawx74859/attachments/gfawx74859/cnkbas/2308/1/Infineon-AN91445_Antenna_Design_and_RF_Layout_Guidelines-ApplicationNotes-v09_00-EN.pdf"
      publisher: "Infineon (Cypress)"
      kind: app_note
      section: "§12"
    - title: "Chip Antenna Layout Considerations for BLE, 802.11, and 2.4G Zigbee"
      url: "https://www.johansontechnology.com/tech-notes/chip-antenna-layout-considerations-for-ble-80211-and-24g-zigbee/"
      publisher: "Johanson Technology"
      kind: app_note
    - title: "MBN52832 BLE Module Layout Guide"
      url: "https://www.murata.com/-/media/webrenewal/products/connectivitymodule/asset/pub/rfm/data/mbn52832_antenna_layout_guide.ashx?la=en&cvid=20210615064716000000"
      publisher: "Murata"
      kind: vendor_guide
      section: "On-board antenna instruction"
    - title: "AN11994 QN908x BLE Antenna Design Guide"
      url: "https://community.nxp.com/pwmxy87654/attachments/pwmxy87654/wireless-connectivity/17607/1/BLE_Antenna_Design_AN11994.pdf"
      publisher: "NXP"
      kind: app_note
      section: "§3.2 Placement and PCB layout"
  confidence: high
  tags: [cat-feeder]

- id: RF-FLR-003
  title: 外壳内天线周围留净空，金属件远离天线
  domain: rf
  stage: floorplan
  severity: should
  rule: >-
    产品外壳内，PCB 天线四周各方向至少留 15 mm 净空（Espressif 建议）；塑料外壳、电池、连接器、螺丝、屏蔽罩、电机等越远越好。
    塑料外壳会使谐振频率向低端移约 100-200 MHz，因此必须在最终外壳内复测。
  rationale: >-
    近场内的塑料（Dk 高于空气）增大天线有效电长度，金属则吸收或反射；二者都使天线失谐、效率下降。
  applies_to: [pcb_antenna, enclosure, esp32-c3-wroom-02]
  parameters:
    - name: housing_clearance_all_directions
      op: ">="
      value: 15
      unit: mm
      note: "Espressif：外壳内 PCB 天线各方向至少 15 mm"
    - name: murata_plastic_to_module_distance
      op: ">"
      value: 3
      unit: mm
      note: "Murata MBN52832 模组：塑料/金属离模组 > 3 mm"
    - name: murata_metal_to_antenna_distance
      op: ">="
      value: 5
      unit: mm
      note: "Murata：连接器、电池等金属件离天线区 >= 5 mm"
    - name: taoglas_pa25_metal_clearance
      op: ">="
      value: 20
      unit: mm
      note: "仅 Taoglas PA.25 芯片 PIFA：离金属件 20 mm，离外壳 1-2 mm 合理"
    - name: plastic_resonance_shift
      op: range
      value: [-200, -100]
      unit: MHz
      note: "AN91445 §11.2：塑料外壳使谐振频率下移约 100-200 MHz"
  verify:
    - method: review
      tool: "3D 机壳 STEP + 板 STEP 的距离检查"
      check: "在 MCAD 里测天线禁布区到外壳内壁、金属件（电机、螺丝、料盒、称重传感器）的最小距离，>= 15 mm 或天线厂商值。"
      automatable: partial
    - method: bench
      tool: "VNA"
      check: "装入最终外壳后复测 S11（含手持或实际放置），中心频率偏移不超过带宽余量（见 RF-VER-002）。"
      automatable: manual
  sources:
    - title: "ESP32-C3 PCB Layout Design - Positioning a Module on a Base Board"
      url: "https://docs.espressif.com/projects/esp-hardware-design-guidelines/en/latest/esp32c3/pcb-layout-design.html"
      publisher: "Espressif Systems"
      kind: vendor_guide
    - title: "MBN52832 BLE Module Layout Guide"
      url: "https://www.murata.com/-/media/webrenewal/products/connectivitymodule/asset/pub/rfm/data/mbn52832_antenna_layout_guide.ashx?la=en&cvid=20210615064716000000"
      publisher: "Murata"
      kind: vendor_guide
      section: "Other suggestions"
    - title: "Application Note for PA.25.A Antenna Integration (APN-11-8-002)"
      url: "https://www.taoglas.com/assets/application-notes/APN-11-8-002.C.pdf"
      publisher: "Taoglas"
      kind: app_note
      section: "§10 Electromagnetic environment"
    - title: "AN91445 Antenna Design and RF Layout Guidelines"
      url: "https://community.infineon.com/gfawx74859/attachments/gfawx74859/cnkbas/2308/1/Infineon-AN91445_Antenna_Design_and_RF_Layout_Guidelines-ApplicationNotes-v09_00-EN.pdf"
      publisher: "Infineon (Cypress)"
      kind: app_note
      section: "§11.2, §12"
  confidence: high
  conflicts: >-
    净空数字因天线而异：Espressif 15 mm（板载 PCB 天线）、Murata 金属 >= 5 mm / 塑料 > 3 mm、Taoglas PA.25 金属 >= 20 mm。
    取舍：用所选天线厂商的数值；没有厂商值时，对 ESP32-C3 板载天线取 15 mm。
  tags: [cat-feeder]

- id: RF-FLR-004
  title: 天线远离晶振、高速时钟、开关电源、电机以及 USB/UART
  domain: rf
  stage: floorplan
  severity: should
  rule: >-
    PCB 天线远离高频器件（晶振、DDR、高速时钟）；USB 口、USB 转串口芯片和 UART 线（走线、过孔、测试点、排针）尽量远离天线，
    UART 线周围包地并打地过孔；开关电源电感、电机和显示屏同样要拉开或屏蔽。
  rationale: >-
    数字边沿的谐波可达数 GHz，会耦合进天线抬高接收底噪（desense）；UART 走线穿过射频线或靠近天线会影响接收。
  applies_to: [antenna, uart, usb, clock]
  parameters:
    - name: distance_to_antenna_keepout
      op: maximize
      value: null
      note: "Espressif/u-blox 均无具体数值，只要求尽量远；开关电源与电机属按同一机理的外推（medium）"
  verify:
    - method: geometry_script
      tool: "pcbnew (KiCad bundled Python)"
      check: "列出 UART/USB 连接器与排针、测试点、晶振、DC-DC 电感、电机驱动 MOSFET 到天线禁布区的最近距离；这些元件须位于远离天线的一侧，报告距离供评审。"
      automatable: partial
    - method: emc_precompliance
      tool: "近场探头 + 频谱仪"
      check: "TX 关闭时在天线附近 2.4 GHz 频段扫描噪声，噪声源开关前后底噪差异应可忽略。"
      automatable: manual
    - method: bench
      tool: "接收灵敏度/PER 测试"
      check: "分别在电机、UART、USB 工作与关闭时测 RSSI/误包率，差异应不显著。"
      automatable: manual
  sources:
