- id: RF-FLR-006
  title: 多天线或收发之间拉开距离、正交放置
  domain: rf
  stage: floorplan
  severity: consider
  rule: >-
    同板有多个无线电（BLE + Wi-Fi、GNSS + 蜂窝）时，天线尽量远离；线极化天线使其电正交放置、零点方向共线；
    两射频区之间打接地过孔隔离墙。GNSS 与 GSM 天线之间的隔离应 >= 40 dB，手持设备靠摆位只能做到约 20 dB，需另加 SAW 滤波器。
  rationale: >-
    发射机会以足以阻塞相邻接收机的功率耦合到另一天线，隔离度不足需靠空间、极化和频率分隔补救。
  applies_to: [coexistence, multi_antenna, gnss, ble, wifi]
  parameters:
    - name: gnss_gsm_antenna_isolation
      op: ">="
      value: 40
      unit: dB
      note: "u-blox §5.4.1；手持设备靠摆位约 20 dB 不够"
  verify:
    - method: em_sim
      tool: "openEMS 或 2.5D 求解器"
      check: "两天线端口间 |S21| 在目标频段内满足隔离要求（GNSS-GSM >= 40 dB）。"
      automatable: partial
    - method: bench
      tool: "VNA 双端口"
      check: "实测两天线端口间 S21，在整机状态下满足要求。"
      automatable: manual
  sources:
    - title: "AN91445 Antenna Design and RF Layout Guidelines"
      url: "https://community.infineon.com/gfawx74859/attachments/gfawx74859/cnkbas/2308/1/Infineon-AN91445_Antenna_Design_and_RF_Layout_Guidelines-ApplicationNotes-v09_00-EN.pdf"
      publisher: "Infineon (Cypress)"
      kind: app_note
      section: "§24.1 Spatial Isolation"
    - title: "GNSS antennas - RF design considerations for u-blox GNSS receivers (UBX-15030289 R03)"
      url: "https://content.u-blox.com/sites/default/files/products/documents/GNSS-Antennas_AppNote_(UBX-15030289).pdf"
      publisher: "u-blox"
      kind: app_note
      section: "§5.4.1 Isolation between GNSS and GSM antenna"
