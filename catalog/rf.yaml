- id: RF-FLR-005
  title: 单极类天线按厂商参考板提供足够的地平面
  domain: rf
  stage: floorplan
  severity: should
  rule: >-
    1/4 波长单极、IFA/MIFA、PIFA 和芯片天线都把板子的地当作天线的一部分，地平面尺寸/形状要与厂商参考板一致；
    地平面太小会改变谐振频率和方向图并降低效率；在天线馈点附近的底板上放足够的地铜和密集接地过孔。
  rationale: >-
    更大的地平面增大有效电容并使谐振频率下移；良好的地使回波损耗更接近理论值；地平面形状还改变辐射方向图。
  applies_to: [monopole, mifa, pifa, chip_antenna, esp32-c3-wroom-02]
  parameters:
    - name: murata_host_pcb_length_min
      op: ">"
      value: 40
      unit: mm
      note: "Murata MBN52832：主板长度 > 40 mm 才能得到最佳性能，50x50 mm 以上为佳；仅适用该模组"
  verify:
    - method: geometry_script
      tool: "pcbnew (KiCad bundled Python)"
      check: "计算连通 GND 铜外包尺寸，达到所用天线 / 模组厂商给出的最小地平面尺寸（如 Murata MBN52832：主板长度 > 40 mm，50x50 mm 以上为佳；ESP32-C3 模组按 Espressif「在主板上放置模组」一节的示意）；天线馈点附近的地铜有密集接地过孔。"
      automatable: partial
    - method: em_sim
      tool: "openEMS"
      check: "扫描地平面长度/宽度，观察 S11 谐振频率和效率变化。"
      automatable: partial
  sources:
