- id: RF-SCH-001
  title: 在天线馈点预留 π/T 匹配焊盘
  domain: rf
  stage: schematic
  severity: should
  rule: >-
    天线阻抗未经实测时，在天线馈点前预留三元件 π（或 T）网络：串联位装 0 Ω（或隔直电容），并联位 DNP，以便日后实现任意拓扑；
    匹配网络紧贴馈点，并使用厂商指定的天线到匹配网络的线长。
  rationale: >-
    塑料外壳、地平面尺寸、板材差异和周围元件都会改变天线阻抗，失配是链路预算里最大的损失之一；有 π 位就能事后调谐，没有就只能改板。
  applies_to: [external_antenna, chip_antenna, pcb_antenna, discrete_rf]
  parameters:
    - name: matching_placeholder_positions
      op: "=="
      value: 3
      unit: count
      note: "π：并联-串联-并联；串联位默认 0 Ω，并联位默认不装。带不可访问馈点的板载天线模组不适用"
  verify:
    - method: erc
      tool: "KiCad ERC + 自定义网表脚本"
      check: "在天线馈点网络上存在 3 个相连的占位元件（并联、串联、并联），拓扑为 π；串联位已选 0 Ω 电阻，并联位标记 DNP。"
      automatable: partial
    - method: bench
      tool: "VNA"
      check: "原型阶段用 VNA 测复阻抗后，按 RF-VER-003 填入实际值。"
      automatable: manual
  sources:
    - title: "AN91445 Antenna Design and RF Layout Guidelines"
      url: "https://community.infineon.com/gfawx74859/attachments/gfawx74859/cnkbas/2308/1/Infineon-AN91445_Antenna_Design_and_RF_Layout_Guidelines-ApplicationNotes-v09_00-EN.pdf"
      publisher: "Infineon (Cypress)"
      kind: app_note
      section: "§12, §14.2"
    - title: "AN058 Antenna Selection Guide (SWRA161B)"
      url: "https://www.ti.com/lit/pdf/swra161"
      publisher: "Texas Instruments"
      kind: app_note
      section: "§3.4"
    - title: "AN-1811 Bluetooth Antenna Design (SNOA519B)"
      url: "https://www.ti.com/lit/an/snoa519b/snoa519b.pdf"
      publisher: "Texas Instruments"
      kind: app_note
      section: "§4.4 PI-Network Matching"
  confidence: high

- id: RF-SCH-002
  title: 射频器件用 C0G、高 Q、SRF 不低于 2 倍工作频率
  domain: rf
  stage: schematic
  severity: should
  rule: >-
    匹配网络和晶振负载电容只用 C0G/NP0；匹配电感用高 Q 型；电容和电感的自谐振频率（SRF）都不低于工作频率的 2 倍；
    2.4 GHz 下优先 0402/0201 以减小寄生，并优先采用厂商参考设计列出的料号。
  rationale: >-
    器件在接近 SRF 时电抗已偏离标称值；X7R 等介质随温度和偏压漂移会使匹配随温度变化；低 Q 器件会把射频能量变成热，
    还会让 S11 看起来不错而实际传不过去。
  applies_to: [matching_network, filter, crystal_load, 2.4ghz]
  parameters:
    - name: component_srf_over_operating_frequency
      op: ">="
      value: 2
      unit: ratio
      note: "AN91445 §14.2：电容的串联谐振频率与电感的自谐振频率都至少是工作频率的 2 倍；2.4835 GHz 下即 >= 4.97 GHz"
    - name: matching_cap_dielectric
      op: qualitative
      value: null
      note: "C0G/NP0；去耦电容不需要 C0G，可用 X5R/X7R"
    - name: esp32_c3_chip_matching_package
      op: qualitative
      value: null
      note: "封装为 0201（英制）。Espressif 要求 ESP32-C3 芯片射频匹配元件用 0201 封装（参考料号 GRM0335C1H1RXBA01D、LQP03TN2NXB02D）；JLC 经济档 SMT 下限 0402，用 0201 需标准档"
  verify:
    - method: bom_check
      tool: "BOM 脚本 + 厂商 S 参数/SRF 数据"
      check: >-
        对射频网络上每个 C/L：介质为 C0G/NP0（电容），封装 0402/0201，SRF（取数据手册或厂商模型）>= 2 × f_max（f_max=2.4835 GHz 即 4.97 GHz），
        电感在 2.4 GHz 的 Q 值已核对。
      automatable: partial
    - method: spice
      tool: "ngspice .ac（元件按 ESL/ESR/并联电容建模）或 scikit-rf"
      check: "用元件寄生模型仿真匹配网络，查看 2.4 GHz 附近 S11/插入损耗，确认实际电抗与理想值偏差可接受。"
      automatable: partial
  sources:
    - title: "AN91445 Antenna Design and RF Layout Guidelines"
      url: "https://community.infineon.com/gfawx74859/attachments/gfawx74859/cnkbas/2308/1/Infineon-AN91445_Antenna_Design_and_RF_Layout_Guidelines-ApplicationNotes-v09_00-EN.pdf"
      publisher: "Infineon (Cypress)"
      kind: app_note
      section: "§14.2, §21.1.1, §21.2, §21.2.1"
    - title: "ESP32-C3 Schematic Checklist - RF"
      url: "https://docs.espressif.com/projects/esp-hardware-design-guidelines/en/latest/esp32c3/schematic-checklist.html"
      publisher: "Espressif Systems"
      kind: vendor_guide
      section: "RF Tuning"
  confidence: high

- id: RF-SCH-003
  title: 射频线上可能有直流时串联隔直电容
  domain: rf
  stage: schematic
  severity: should
  rule: >-
    在可能带直流的位置串联隔直电容：射频开关端口（除非数据手册声明端口可带直流）、有源天线偏置馈线、天线连接器。
    已匹配的链路中，隔直电容选 SRF 接近工作频率、ESR 低的型号，使其不改变匹配。
  rationale: >-
    典型射频开关要求每个端口隔直或保证无直流；直流进入开关会偏置内部器件。电容在 SRF 处电抗近似为零，
    因此 SRF 靠近工作频率的隔直电容对匹配影响最小。
  applies_to: [rf_switch, active_antenna, bias_tee]
  parameters:
    - name: dc_block_cap_srf
      op: qualitative
      value: null
      note: "SRF 接近工作频率；u-blox 双天线示例（1.575 GHz）用 47 pF 隔直，27 nH 射频扼流圈 + 100 nF 馈偏置（示例值，非通用）"
  verify:
    - method: erc
      tool: "KiCad ERC + 网表脚本"
      check: "遍历 RF 网络上的开关端口、有源天线偏置点、连接器：每个端口与外部之间存在串联电容，或数据手册标明免隔直（记录在器件属性里）。"
      automatable: partial
    - method: bom_check
      tool: "BOM 脚本"
      check: "隔直电容的 SRF 取自厂商数据，位于 f_op 附近；ESR 低、C0G/NP0。"
      automatable: partial
  sources:
    - title: "AN91445 Antenna Design and RF Layout Guidelines"
      url: "https://community.infineon.com/gfawx74859/attachments/gfawx74859/cnkbas/2308/1/Infineon-AN91445_Antenna_Design_and_RF_Layout_Guidelines-ApplicationNotes-v09_00-EN.pdf"
      publisher: "Infineon (Cypress)"
      kind: app_note
      section: "§21.1.1"
    - title: "GNSS antennas - RF design considerations for u-blox GNSS receivers (UBX-15030289 R03)"
      url: "https://content.u-blox.com/sites/default/files/products/documents/GNSS-Antennas_AppNote_(UBX-15030289).pdf"
      publisher: "u-blox"
      kind: app_note
      section: "§5.5 Dual antenna systems"
    - title: "Application Note 44: Introduction and Operation of the PE42020 True DC RF Switch"
      url: "https://www.psemi.com/pdf/app_notes/an44.pdf"
      publisher: "pSemi"
      kind: app_note
      section: "Safe DC Operating Range"
  confidence: high

- id: RF-SCH-004
  title: 差分射频口经与芯片匹配的巴伦接天线
  domain: rf
  stage: schematic
  severity: should
  rule: >-
    射频芯片差分口（RF_P/RF_N）必须经巴伦转为单端 50 Ω：优先用厂商参考设计的分立网络，或与该芯片匹配的集成巴伦-低通滤波器，并整体复制其布局；
    不能复制时，RF_P、RF_N 到巴伦的走线必须对称、尽量短，宽度与长度尽量与参考设计一致。
  rationale: >-
    巴伦完成平衡/不平衡变换；走线不对称会降低输出功率并使谐波升高，布局对射频性能影响很大。
  applies_to: [balun, differential_rf, ble, 802.15.4]
  verify:
    - method: netlist_diff
      tool: "网表对比脚本（与厂商参考设计）"
      check: "巴伦及其匹配元件的料号、值、连接与参考设计一致。"
      automatable: partial
    - method: geometry_script
      tool: "pcbnew (KiCad bundled Python)"
      check: "测量 RF_P 与 RF_N 两条网络到巴伦焊盘的走线长度与宽度，两者差值 ≈ 0（容许值取参考设计），并与参考设计的长度/宽度比较。"
      automatable: partial
  sources:
    - title: "Impedance Matched RF Front End Differential Balun-Low Pass Filter for CC253X (2450BM15A0002)"
      url: "https://www.johansontechnology.com/docs/2962/2450BM15A0002-App-Note-for-the-CC253X-11_7cXYuOj.pdf"
      publisher: "Johanson Technology"
      kind: app_note
      section: "§3 Layout"
    - title: "AN058 Antenna Selection Guide (SWRA161B)"
      url: "https://www.ti.com/lit/pdf/swra161"
      publisher: "Texas Instruments"
      kind: app_note
      section: "§4 (balun for differential RF ports)"
  confidence: high

- id: RF-SCH-005
  title: 发射链路保留谐波滤波并用 S21/谐波实测验收
  domain: rf
  stage: schematic
  severity: should
  rule: >-
    发射链路里保留匹配网络（如 ESP32-C3 的 CLC、Nordic 的 π 网络）或低通/带通滤波器，用来抑制二、三次谐波，不要为省 BOM 删元件；
    以厂商给的目标验收：ESP32-C3 芯片射频匹配调试时 S21 在 4.8 GHz 和 7.2 GHz 低于 -35 dB。
  rationale: >-
    发射机会产生基波、谐波和杂散；匹配网络除了阻抗变换，还承担谐波抑制，布局失配会令基波功率下降、杂散升高。
    谐波必须满足 FCC 15.247(d) / EN 300 328 杂散限值。
  applies_to: [transmitter, harmonic_filter, esp32-c3_chip]
  parameters:
    - name: s21_at_4p8ghz
      op: "<"
      value: -35
      unit: dB
      note: "Espressif 调试 ESP32-C3 芯片射频匹配（端口 1 在芯片、端口 2 在天线）的目标"
    - name: s21_at_7p2ghz
      op: "<"
      value: -35
      unit: dB
      note: "同上；另 S11 应接近芯片共轭点 35+j0"
  verify:
    - method: bench
      tool: "VNA（S11/S21 测匹配网络两端）+ 频谱仪"
      check: "把 VNA 两端接匹配网络芯片侧和天线侧，S21 在 4.8/7.2 GHz < -35 dB；整机在传导口测二/三次谐波，低于限值并留余量。"
      automatable: manual
    - method: spice
      tool: "ngspice .ac / scikit-rf"
      check: "仿真匹配网络（含元件寄生）的 S21，在 2×、3× 基频处 < -35 dB（仅适用 ESP32-C3；其他芯片用其目标值）。"
      automatable: partial
  sources:
    - title: "ESP32-C3 Schematic Checklist - RF Tuning"
      url: "https://docs.espressif.com/projects/esp-hardware-design-guidelines/en/latest/esp32c3/schematic-checklist.html"
      publisher: "Espressif Systems"
      kind: vendor_guide
      section: "RF Circuit, RF Tuning"
    - title: "PCB Layout Design Guide (EFR32 Wireless Gecko)"
      url: "https://github.com/SiliconLabs/IoT-Developer-Boot-Camp/wiki/PCB-Layout-Design-Guide"
      publisher: "Silicon Labs"
      kind: vendor_guide
      section: "§2.1.1 Function of RF matching and filtering network"
    - title: "AN1406 SKY65111-348LF Amplifier Layout Optimization"
      url: "https://www.skyworksinc.com/-/media/FD49CA4742354582B6E9F1CB74976A01.pdf"
      publisher: "Skyworks"
      kind: app_note
      section: "915 MHz Harmonic Filter"
    - title: "General PCB design guidelines for nRF52 series"
      url: "https://devzone.nordicsemi.com/guides/hardware-design-test-and-measuring/b/nrf5x/posts/general-pcb-design-guidelines-for-nrf52-series"
      publisher: "Nordic Semiconductor"
      kind: vendor_guide
      section: "Matching network"
  confidence: high

- id: RF-SCH-006
  title: 射频电源脚分级去耦并串 LC 隔离
  domain: rf
  stage: schematic
  severity: should
  rule: >-
    射频 IC/LNA/PA 的电源脚做分级去耦：小值（高 SRF）电容负责高频，0.1 µF 左右滤时钟杂散，大电容供发射瞬时电流并滤开关电源的低频干扰；
    射频电源脚前加 LC/CLC 滤波抑制高频谐波回灌（ESP32-C3 的 VDD3P3：10 µF + 0.1 µF，电感额定电流 >= 500 mA）；
    PA 偏置经射频扼流圈馈入，多只旁路电容紧贴扼流圈。
  rationale: >-
    电源噪声会抬高频率合成器相位噪声、使射频输出不稳并造成杂散，接收时增加误包率；发射瞬间的电流尖峰会拉塌电源轨。
  applies_to: [rf_ic, lna, pa, esp32-c3_chip]
  parameters:
    - name: esp32_c3_vdd3p3_bulk_cap
      op: ">="
      value: 10
      unit: uF
      note: "与 0.1 µF 并用；如电源入口靠近 VDD3P3 可与入口 10 µF 合并"
    - name: esp32_c3_vdd3p3_lc_inductor_rated_current
      op: ">="
      value: 500
      unit: mA
      note: "Espressif 建议的 LC 滤波电感额定电流"
    - name: inrush_cap_formula
      op: qualitative
      value: null
      note: "C = I / (dV/dt)；例：20 mA、15 µs、允许跌落 300 mV 需 1 µF（AN91445 §19）"
  verify:
    - method: bom_check
      tool: "BOM + 原理图脚本"
      check: "每个射频电源脚都有对应的 LC/CLC 滤波与规定值的去耦电容；电感额定电流 >= 厂商要求。"
      automatable: partial
    - method: pi_sim
      tool: "ngspice AC（电源路径含电容 ESL/ESR/SRF 模型）"
      check: "在射频电源脚处看阻抗-频率曲线，关注时钟谐波与开关频率附近无反谐振峰，高频段阻抗足够低。"
      automatable: partial
  sources:
    - title: "AN91445 Antenna Design and RF Layout Guidelines"
      url: "https://community.infineon.com/gfawx74859/attachments/gfawx74859/cnkbas/2308/1/Infineon-AN91445_Antenna_Design_and_RF_Layout_Guidelines-ApplicationNotes-v09_00-EN.pdf"
      publisher: "Infineon (Cypress)"
      kind: app_note
      section: "§19 Power Supply Decoupling, §21.1.1"
    - title: "ESP32-C3 Schematic Checklist - Power Supply"
      url: "https://docs.espressif.com/projects/esp-hardware-design-guidelines/en/latest/esp32c3/schematic-checklist.html"
      publisher: "Espressif Systems"
      kind: vendor_guide
      section: "Analog Power Supply"
    - title: "AN1406 SKY65111-348LF Amplifier Layout Optimization"
      url: "https://www.skyworksinc.com/-/media/FD49CA4742354582B6E9F1CB74976A01.pdf"
      publisher: "Skyworks"
      kind: app_note
      section: "VCC1/VCC2/VCC3 pin descriptions"
    - title: "PCB Layout Design Guide (EFR32 Wireless Gecko)"
      url: "https://github.com/SiliconLabs/IoT-Developer-Boot-Camp/wiki/PCB-Layout-Design-Guide"
      publisher: "Silicon Labs"
      kind: vendor_guide
      section: "§2.1.2 Function of VDD filterings"
  confidence: high

- id: RF-SCH-007
  title: 模组 3V3 脚旁放 10 µF + 0.1 µF，扛住发射电流尖峰
  domain: rf
  stage: schematic
  severity: should
  rule: >-
    ESP32-C3-WROOM-02 的 3V3 脚旁放 10 µF（C1）和 0.1 µF（C2），LDO 到模组的路径短而宽；
    Wi-Fi 发射瞬间 3V3 必须保持在 3.0-3.6 V，不得跌出。
  rationale: >-
    发射时的电流尖峰会拉塌电源轨，导致射频性能变差或复位；模组 802.11b 1 Mbps、20.5 dBm 时峰值电流 345 mA（模组数据手册；芯片数据手册的 802.11b 1 Mbps @21 dBm 为 335 mA，见 LPW-ARC-012，选型取模组值）。
  conflicts: "与 PWR-SCH-008 方向相反：模组要 10 uF + 0.1 uF 靠近 3V3 脚，而依赖 ESR 补偿的老式 LDO（如 AMS1117）不希望输出端堆小陶瓷电容。取舍：优先用陶瓷稳定的 LDO（PWR-ARC-004）；若仍用老式 LDO，让模组电容离 LDO 输出足够远或经磁珠隔离，整板装好后做负载阶跃验证（PWR-VER-002）。"
  applies_to: [esp32-c3-wroom-02, ldo_ams1117, wifi_tx]
  parameters:
    - name: module_supply_bulk_cap
      op: ">="
      value: 10
      unit: uF
      note: "Datasheet Figure 9-1 的 C1"
    - name: module_supply_hf_cap
      op: ">="
      value: 0.1
      unit: uF
      note: "Datasheet Figure 9-1 的 C2"
    - name: module_supply_range
      op: range
      value: [3.0, 3.6]
      unit: V
      note: "Datasheet Table 6-2 推荐工作条件，典型 3.3 V"
    - name: wifi_tx_peak_current
      op: "=="
      value: 345
      unit: mA
      note: "Datasheet Table 6-4，802.11b 1 Mbps @20.5 dBm，100% 占空比"
  verify:
    - method: spice
      tool: "ngspice 瞬态（LDO 模型 + 去耦 + 345 mA 阶跃）"
      check: "在模组 3V3 引脚处最小电压 >= 3.0 V（含 LDO 瞬态响应与输出电容 ESR）。"
      automatable: partial
    - method: bench
      tool: "示波器（AC 耦合 + 直流电压同测）"
      check: "Wi-Fi 持续发射时抓模组 3V3 引脚波形，最低电压 >= 3.0 V，无复位。"
      automatable: manual
  sources:
    - title: "ESP32-C3-WROOM-02 & WROOM-02U Datasheet v1.7"
      url: "https://www.espressif.com/sites/default/files/documentation/esp32-c3-wroom-02_datasheet_en.pdf"
      publisher: "Espressif Systems"
      kind: datasheet
      section: "§6.2, §6.4.1 Table 6-4, §9 Figure 9-1"
    - title: "ESP32-C3 Schematic Checklist - Power Supply"
      url: "https://docs.espressif.com/projects/esp-hardware-design-guidelines/en/latest/esp32c3/schematic-checklist.html"
      publisher: "Espressif Systems"
      kind: vendor_guide
      section: "Analog Power Supply"
  confidence: high
  tags: [cat-feeder]

- id: RF-SCH-008
  title: 预留传导测试口，射频线上不加探针测试点
  domain: rf
  stage: schematic
  severity: should
  rule: >-
    分立射频设计在射频链路上预留可选的 U.FL/SMA 或 0 Ω 切换点用于传导功率、杂散和匹配测试，量产可不贴；
    分支处布线要使断开任一支路时另一支路不成为短截线；不要在射频走线上放探针测试点。
  rationale: >-
    射频无法用 ICT 测试；测试点和断开后的分支都是短截线，会影响阻抗匹配。传导测试口可兼用于验证匹配网络。
  applies_to: [discrete_rf, certification]
  verify:
    - method: review
      tool: "原理图评审"
      check: "射频链路上有明确的传导测试位置（连接器或 0 Ω），且标明「断开后另一支路无短截线」；没有测试点封装连在射频网络上。"
      automatable: manual
    - method: geometry_script
      tool: "pcbnew (KiCad bundled Python)"
      check: "RF 网络上不存在 TestPoint 类封装的焊盘；分支段（非链路主线）长度 <= 参考设计允许值。"
      automatable: partial
  sources:
    - title: "AN91445 Antenna Design and RF Layout Guidelines"
      url: "https://community.infineon.com/gfawx74859/attachments/gfawx74859/cnkbas/2308/1/Infineon-AN91445_Antenna_Design_and_RF_Layout_Guidelines-ApplicationNotes-v09_00-EN.pdf"
      publisher: "Infineon (Cypress)"
      kind: app_note
      section: "§16.3, §22 Design for Testability"
    - title: "ESP32-C3 Schematic Checklist - RF"
      url: "https://docs.espressif.com/projects/esp-hardware-design-guidelines/en/latest/esp32c3/schematic-checklist.html"
      publisher: "Espressif Systems"
      kind: vendor_guide
      section: "RF Circuit (RF with no antenna)"
  confidence: high

# ---------------- netlist ----------------

- id: RF-NET-001
  title: 射频网络单独设网络类，线宽恒定、不分支
  domain: rf
  stage: netlist
  severity: should
  rule: >-
    把天线馈线与芯片 RF 引脚到匹配网络的网络设为独立 net class，线宽（CPWG 时还有间隙）取阻抗计算值；
    网络只连接匹配、隔直、滤波元件与天线/连接器，不做 T 型分支；用 .kicad_dru 自定义规则锁定线宽。
  rationale: >-
    特性阻抗必须全程恒定，分支和宽度变化是不连续点；把约束写进设计规则可让 DRC 自动检出。
  applies_to: [rf_trace, 50ohm]
  parameters:
    - name: rf_trace_target_z0
      op: "=="
      value: 50
      unit: ohm
      note: "Espressif、Infineon、Nordic 均要求 50 Ω 射频线"
  verify:
    - method: drc
      tool: "KiCad DRC + .kicad_dru"
      check: >-
        自定义规则：(rule rf_width (condition "A.NetClass == 'RF'") (constraint track_width (min W) (max W)))，W 取 tline_calc 结果；
        另加 clearance 规则锁定 CPWG 间隙。DRC 违例数为 0。
      automatable: full
    - method: netlist_diff
