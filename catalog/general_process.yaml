      tool: "kicad-cli pcb drc --schematic-parity --severity-all --exit-code-violations --format json"
      check: >-
        退出码为 0；JSON 报告中奇偶性类的违规数为 0（JSON 键名随 KiCad 版本核对）。固定 KiCad 主版本，因为不同版本的检查项和默认严重级别会变。
      automatable: full
  sources:
