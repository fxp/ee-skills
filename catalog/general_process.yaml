      url: "https://docs.kicad.org/10.0/en/eeschema/eeschema.html"
      publisher: "KiCad"
      kind: tool_doc
      section: "Electrical rules checking"
    - title: "KiCad ERC Error Reference"
      url: "https://pcbkit.com/tools/kicad-erc-reference/"
      publisher: "pcbkit"
      kind: blog
    - title: "How to run ERC in KiCad from the command line reliably"
      url: "https://www.makeirl.com/blog/run-erc-kicad-command-line"
      publisher: "MakeIRL"
      kind: blog
      section: "PWR_FLAG"
  confidence: high
  applies_to: [erc, power_flag]
