- id: GEN-NET-007
  title: 排查孤立标签、单引脚网络和意外短接
  domain: general
  stage: netlist
  severity: should
  rule: >-
    除测试点和已登记的刻意情形外，每个网络至少连两个引脚；标签只出现一次的全局标签视为拼写错误嫌疑；
    刻意短接两个网络要用 net tie，不要靠导线；DRC 中「元件间缺少连接」与「两网络被短接」必须为 0。
  rationale: >-
    标签拼错会产生没有任何其他引脚的孤立网络，对 ERC 来说「标签只有一个」默认还是被忽略的检查；
    DRC 只能发现铜皮上的缺失连接和短路，发现不了「根本没有被画进网络」的问题。
  verify:
    - method: erc
      tool: "自写脚本：网表中统计每个网络的引脚数 + kicad-cli sch erc"
      check: "引脚数为 1 的网络必须在白名单（测试点、预留）中；ERC 中 label_dangling（Error）、isolated_pin_label（KiCad 10 Warning）、global_label_dangling（KiCad 9 Warning）为 0，并启用 single_global_label。"
      automatable: full
    - method: drc
      tool: "kicad-cli pcb drc --severity-all"
      check: "Missing connection between items（默认 Error）与 Items shorting two nets（默认 Error）为 0；刻意短接处使用 net tie 并且不触发短路违规。"
      automatable: full
  sources:
    - title: "KiCad ERC Error Reference"
      url: "https://pcbkit.com/tools/kicad-erc-reference/"
      publisher: "pcbkit"
      kind: blog
    - title: "KiCad 10 PCB Editor manual — DRC checks（Items shorting two nets 建议用 net tie）"
      url: "https://docs.kicad.org/10.0/en/pcbnew/pcbnew.html"
      publisher: "KiCad"
      kind: tool_doc
      section: "List of DRC checks"
  confidence: high
  applies_to: [netlist, labels]

- id: GEN-NET-008
  title: 引脚 / 门交换只在功能等价的引脚间进行
  domain: general
  stage: netlist
  severity: should
  rule: >-
    引脚交换和门交换只用于功能完全等价的引脚（同一封装里完全相同的逻辑门；MCU 上在 IO MUX 与模拟功能表里都具备所需功能的普通 GPIO），
    不碰 strapping、专用模拟、USB、flash 占用脚；交换后必须同步回原理图，并同步更新固件引脚映射。
  rationale: >-
    KiCad 的交换不检查电气等价性，由设计者负责；交换在 PCB 上立即生效，原理图要等「从 PCB 更新原理图」才改变，
    忘了同步会让原理图、固件与板子三者不一致。
  verify:
    - method: netlist_diff
      tool: "kicad-cli pcb drc --schematic-parity + 固件引脚映射文件比对脚本"
      check: "交换并更新原理图之后，奇偶性检查为 0；固件引脚映射（YAML / 头文件）与网表中 MCU 引脚的网络名逐项一致。"
      automatable: partial
    - method: review
      tool: "评审清单"
      check: "对每次交换的引脚，在数据手册的引脚功能表里确认被交换的两个引脚都具备所需功能，且不在受限引脚清单里。"
      automatable: manual
  sources:
