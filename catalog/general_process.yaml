- id: GEN-NET-005
  title: 原理图与 PCB 奇偶性检查要连警告一起设为门禁
  domain: general
  stage: netlist
  severity: must
  rule: >-
    签核门禁必须运行 kicad-cli pcb drc --schematic-parity --severity-all --exit-code-violations（退出码 0 才通过）；
    不能只数 Error。重复 / 缺失 / 多余封装、焊盘网络不一致、属性不一致都必须为 0。
  rationale: >-
    KiCad 把大多数奇偶性检查的默认严重级别设为 Warning（只有「元件间缺少连接」是 Error，封装过滤器检查默认被忽略），
    只看 Error 数的门禁会放过原理图与 PCB 不一致的板子。CLI 没加 --exit-code-violations 时，有违规也可能返回成功。
  parameters:
