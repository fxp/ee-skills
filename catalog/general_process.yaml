- id: GEN-SCH-013
  title: 可选件和调试件标记 DNP 并保证属性两边一致
  domain: general
  stage: schematic
  severity: should
  rule: >-
    可选电路（预留的上下拉焊盘、0 欧姆跳线、调试接口、保护件）在原理图里照常画出并标 DNP，注明启用条件；
    BOM 导出必须区分 DNP 行；原理图符号的 DNP / 不进 BOM / 不进板属性与 PCB 封装的属性必须一致。
  rationale: >-
    KiCad 的 DNP 元件封装仍会出现在板上，但不贴装；属性两边不一致会让贴片厂把不该贴的件贴上，
    或漏贴必须的件。预留 0 欧姆比把 strapping 引脚硬接更便于后期调整。
  verify:
    - method: bom_check
      tool: "kicad-cli sch export bom --fields Reference,Value,Footprint,${QUANTITY},${DNP}"
      check: "DNP 行有明确的启用条件说明；贴装用的 BOM（--exclude-dnp）不含 DNP 行；设计 BOM 与贴装 BOM 的差集正好等于 DNP 清单。"
      automatable: full
    - method: netlist_diff
      tool: "kicad-cli pcb drc --schematic-parity --severity-all"
      check: "不得出现 Footprint attributes don't match symbol（Value、DNP、Exclude from BOM 不一致，默认 Warning）。"
      automatable: full
  sources:
    - title: "KiCad 10 Schematic Editor manual — DNP and BOM / Variants"
      url: "https://docs.kicad.org/10.0/en/eeschema/eeschema.html"
      publisher: "KiCad"
      kind: tool_doc
      section: "Symbol attributes: Do not populate, Exclude from BOM"
    - title: "KiCad Command-Line Interface — sch export bom"
      url: "https://docs.kicad.org/8.0/en/cli/cli.html"
      publisher: "KiCad"
      kind: tool_doc
    - title: "Schematic Checklist - ESP32-C3（SPI 线串联 0 欧姆预留）"
      url: "https://docs.espressif.com/projects/esp-hardware-design-guidelines/en/latest/esp32c3/schematic-checklist.html"
      publisher: "Espressif"
      kind: vendor_guide
      section: "Flash"
    - title: "pcb-checklist: schematic checklist（用 0 欧姆代替硬接 strapping）"
      url: "https://github.com/azonenberg/pcb-checklist/blob/master/schematic-checklist.md"
      publisher: "Andrew Zonenberg"
      kind: blog
  confidence: high
