- id: GEN-NET-006
  title: 出图前做网表差异对比并附 IPC-D-356
  domain: general
  stage: netlist
  severity: should
  rule: >-
    出图前对比三份网表：原理图导出的网表、PCB 提取的网表、上一个已下单版本的网表，所有差异都要能对应到变更记录；
    出图包里附 IPC-D-356 网表，让板厂能用它核对 Gerber 提取出的连接关系。
  rationale: >-
    Gerber 只有几何，没有连接信息；板厂可以用客户给的网表对照自己从 Gerber 提取的网络，发现开路、短路和输出错误。
    与上一版对比能把非预期改动（例如自动更新带来的）在下单前暴露出来。
  verify:
