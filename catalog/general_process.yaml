- id: GEN-VER-001
  title: ERC 零违规，例外逐条带理由，禁止整类静音
  domain: general
  stage: verification
  severity: must
  rule: >-
    原理图 ERC 在所有严重级别上报告 0 个违规；确属误报的单项用「带注释排除」并写明原因，禁止用「忽略全部」或降低整类严重级别来通过。
    定期用 --severity-exclusions 复查排除项，清理过期例外。
  rationale: >-
    ERC 只有在每条违规都被认真对待时才有意义；整类降级会让新出现的真问题一起沉默，
    而排除缺失电源脚的标记并不会让这些引脚进入网表，板子上仍然是一个没供电的器件。
  parameters:
    - {name: kicad_cli_exit_code_no_violations, op: "==", value: 0, unit: "退出码", note: "kicad-cli sch erc --exit-code-violations"}
  verify:
    - method: erc
      tool: "kicad-cli sch erc --severity-all --exit-code-violations --format json"
      check: "在干净检出、固定 KiCad 主版本下运行，退出码为 0；JSON 报告解析而不是正则匹配文本。"
      automatable: full
