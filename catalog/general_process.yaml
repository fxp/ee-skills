# general / process stages: architecture, library, schematic, netlist, verification
# 来源核对说明见各条 sources；KLC（KiCad Library Conventions）站点对抓取返回 403，相关条目 confidence 取 medium。

# =====================================================================================================
# architecture (ARC)
# =====================================================================================================
- id: GEN-ARC-001
  title: 需求逐条分配到设计元素并指定验证方法
  domain: general
  stage: architecture
  severity: should
  rule: >-
    画原理图之前，把每条需求（功能、电气、机械、环境）编号，并在需求矩阵里写明：来源、分配到的设计元素
    （模块 / 器件 / 网络组）、验证方法（测试、分析、检查、演示之一）和通过判据。没有分配对象或没有验证方法的需求视为未完成。
  rationale: >-
    需求不落到具体元件上，就无法判断某个元件为什么存在、删掉会破坏什么；没有验证方法的需求无法在签核时关闭。
    验证方法分为 test / analysis / inspection / demonstration 四类，是系统工程里通行的分法。
  verify:
    - method: review
      tool: "需求矩阵（requirements.yaml 或表格）+ 自写校验脚本"
      check: >-
        脚本逐条检查：每个需求 ID 的 allocated_to、verify_method、acceptance 非空；allocated_to 引用的位号或功能块在
        网表 / 原理图页名里真实存在；verify_method 属于 {test, analysis, inspection, demonstration}。
        人工评审再确认判据是否可测。
      automatable: partial
  sources:
    - title: "NASA Systems Engineering Handbook (NASA/SP-2016-6105 Rev 2), 验证 / 确认方法与附录中的需求验证矩阵示例"
      url: "https://explorers.larc.nasa.gov/2023ESE/pdf_files/NASA04.%20SysEng%20Handbook%20(NASA_SP-2016-6105%20Rev%202).pdf"
      publisher: "NASA"
      kind: textbook
      section: "Verification / Appendix D（需求验证矩阵样例；章节号未逐页核对）"
    - title: "ISO/IEC/IEEE 29148:2011 Requirements engineering（需求可追溯性）"
      publisher: "ISO/IEC/IEEE"
      kind: standard
      ref: "ISO/IEC/IEEE 29148:2011，traceability 相关条款"
  confidence: medium
  applies_to: [requirements, system]

- id: GEN-ARC-002
  title: 按产品等级对元件电压 / 电流 / 功率降额
  domain: general
  stage: architecture
  severity: should
  rule: >-
    在选型阶段确定降额策略（每类元件的最大应力 / 额定值），并对每个元件用实际最坏工作点的电压、电流、功耗和结温核对。
    NASA 的通用参考值见 parameters；商用产品可以放宽，但放宽要有记录并给出理由。
  rationale: >-
    元件失效率随电应力、热应力降低而下降；把应力限制在额定值的一个固定比例以内，可以免去逐件做可靠性建模，
    同时给容差、浪涌和老化留出余量。
  parameters:
    - {name: capacitor_voltage_stress_max, op: "<=", value: 0.6, unit: "额定电压的比例", note: "NASA GSFC PD-ED-1201 Table 1：电容"}
    - {name: resistor_power_stress_max, op: "<=", value: 0.6, unit: "额定功率的比例", note: "NASA PD-ED-1201：电阻"}
    - {name: semiconductor_power_stress_max, op: "<=", value: 0.5, unit: "额定功率的比例", note: "NASA PD-ED-1201：分立半导体"}
    - {name: semiconductor_voltage_stress_max, op: "<=", value: 0.75, unit: "额定电压的比例", note: "NASA PD-ED-1201：分立半导体"}
    - {name: semiconductor_junction_temp_max, op: "<=", value: 110, unit: "degC", note: "NASA PD-ED-1201：分立半导体"}
    - {name: microcircuit_supply_voltage_stress_max, op: "<=", value: 0.8, unit: "额定电压的比例", note: "NASA PD-ED-1201：集成电路电源电压"}
    - {name: microcircuit_power_stress_max, op: "<=", value: 0.75, unit: "额定功率的比例", note: "NASA PD-ED-1201：集成电路"}
    - {name: microcircuit_junction_temp_max, op: "<=", value: 100, unit: "degC", note: "NASA PD-ED-1201：集成电路"}
    - {name: inductive_device_voltage_stress_max, op: "<=", value: 0.5, unit: "额定电压的比例", note: "NASA PD-ED-1201：电感类器件"}
    - {name: relay_connector_current_stress_max, op: "<=", value: 0.5, unit: "额定电流的比例", note: "NASA PD-ED-1201：继电器与连接器"}
    - {name: inductor_saturation_current_derating, op: range, value: [30, 40], unit: "%", note: "TI SLYP673 幻灯片给出的经验值：Isat 降额 30-40%"}
  verify:
    - method: bom_check
      tool: "BOM + 工作点表的校验脚本"
      check: >-
        对每个元件取仿真 .op / .tran 的最大电压、电流、功耗（或手算），除以数据手册额定值（功率按环境温度折算后的额定值），
        得到应力比；与策略表逐项比较，超限项列出。结温用 Tj = Tamb + P x theta_JA 估算后与 Tj_max 比较。
      automatable: partial
    - method: bench
      tool: "热像仪 / 电流探头 / 示波器"
      check: "最坏负载（电机堵转、Wi-Fi 发射、输入电压上限）下测元件壳温与电压峰值，换算应力比并与策略比较。"
      automatable: manual
  sources:
    - title: "PD-ED-1201 EEE Parts Derating (Preferred Reliability Practices)"
      url: "https://extapps.ksc.nasa.gov/Reliability/Documents/Preferred_Practices/1201.pdf"
      publisher: "NASA GSFC"
      kind: standard
      section: "Table 1 Typical Part Derating Guidelines"
    - title: "How to avoid design problems by using worst case analysis calculations (SLYP673)"
      url: "https://www.ti.com/lit/pdf/slyp673"
      publisher: "Texas Instruments"
      kind: app_note
      section: "inductance rolloff example 幻灯片"
  confidence: high
  conflicts: >-
    NASA 表是飞行项目策略，商用板常取更宽的比例；行业博客给出的数字各不相同（陶瓷电容 50-60%、钽 50% 甚至 30%、
    铝电解 80% 等，未核对到原始标准）；ECSS-Q-ST-30-11C 按器件族另有更细的表格（未逐条核对）。
    取舍：把 NASA 表当作可复现的上限基线，产品等级更低时在项目的降额策略文件里明确写出放宽后的数值，不在单个器件上临时放宽。
  applies_to: [resistor, capacitor, mosfet, ic, inductor, connector]
  tags: [cat-feeder]

- id: GEN-ARC-003
  title: 陶瓷电容按直流偏压后的有效容值取值
  domain: general
  stage: architecture
  severity: should
  rule: >-
    对用于稳压器稳定性、保持时间、滤波或定时的 Class II（X5R / X7R / Y5V）MLCC，以工作偏压、温度和公差下的有效容值参与计算，
    而不是标称值；需要容值稳定的位置优先用 C0G，或加大额定电压 / 封装。
  rationale: >-
    高介电常数 MLCC 的容值随直流偏压下降，Murata 的例子是 6.3 V 100 uF 的 X5R 在 1.8 V 偏压下掉约 10%，Y5V 约掉 40%；
    同样标称、同样尺寸的不同厂商料偏压曲线差别很大，二次供货时尤其要重新核对。
  parameters:
    - {name: murata_example_x5r_loss_at_1v8, op: "==", value: 10, unit: "%", note: "Murata 示例：6.3 V 100 uF X5R 在 1.8 V 直流偏压下的容值下降；仅作量级参考，具体以料号曲线为准"}
    - {name: murata_example_y5v_loss_at_1v8, op: "==", value: 40, unit: "%", note: "同上，Y5V"}
    - {name: x7r_tolerance_bol, op: "==", value: 10, unit: "%", note: "TI SLYP673 示例里 X7R 的初始容差；EOL 21%，温度 15%（示例值，EOL 数据应取自厂商）"}
  verify:
    - method: bom_check
      tool: "厂商偏压曲线工具（Murata SimSurfing、TDK 等）+ 脚本"
      check: >-
        对每个关键 MLCC 取工作偏压下的有效容值，乘以温度与公差余量后，与数据手册要求的最小容值（如 LDO 输出电容）比较，
        不足则换料、加并联或换更大额定电压。
      automatable: partial
    - method: bench
      tool: "LCR 表（带直流偏置）"
      check: "按 Murata 建议，在实际供电线路的直流电压下测电容，对比计算值。"
      automatable: manual
  sources:
    - title: "The voltage characteristics of electrostatic capacitance"
      url: "https://article.murata.com/en-global/article/voltage-characteristics-of-electrostatic-capacitance"
      publisher: "Murata"
      kind: vendor_guide
    - title: "How to avoid design problems by using worst case analysis calculations (SLYP673)"
      url: "https://www.ti.com/lit/pdf/slyp673"
      publisher: "Texas Instruments"
      kind: app_note
      section: "Capacitor Tolerances 幻灯片"
    - title: "pcb-checklist: schematic checklist（Decoupling: Derate ceramic capacitors for their C/V curve）"
      url: "https://github.com/azonenberg/pcb-checklist/blob/master/schematic-checklist.md"
      publisher: "Andrew Zonenberg"
      kind: blog
  confidence: high
  applies_to: [mlcc, ldo, decoupling, filter]
  tags: [cat-feeder]

- id: GEN-ARC-004
  title: 选型时核对生命周期并为关键件备好替代料
  domain: general
  stage: architecture
  severity: should
  rule: >-
    冻结 BOM 之前，确认每个料处于量产状态（不是 NRND / EOL / 停产），所选渠道有足够库存；对关键件（MCU 或模块、稳压器、功率开关、
    模拟前端）至少登记一个引脚和封装兼容的替代料，必要时让封装能兼容替代料。同一料号有多家制造商时，分别核对各家数据手册。
  rationale: >-
    停产或缺货会把一次选型问题变成改板；不同厂商的同名料数据手册要求可能不同（例如稳压器输出电容要求），
    所以替代料不能只看型号相同。生命周期管理有专门的标准框架（IEC 62402）。
  verify:
    - method: bom_check
      tool: "分销商 API（LCSC / JLC 零件库 / Octopart）+ 脚本"
      check: >-
        对 BOM 每行查询生命周期状态和库存，状态不是 Active、库存低于一次订单数量的行输出告警；
        关键件的 AVL（合格供应商列表）里替代料字段为空则失败。
      automatable: partial
    - method: review
      tool: "评审清单"
      check: "逐个关键件，把原料与替代料的数据手册并排比较（电气参数、稳定性条件、引脚、封装），记录结论。"
      automatable: manual
  sources:
    - title: "Schematic Design Review Checklist（BOM and part checks：active production、库存、一个值一个料号）"
      url: "https://resources.altium.com/p/schematic-review-checklist"
      publisher: "Altium"
      kind: vendor_guide
    - title: "IEC 62402 Obsolescence management"
      publisher: "IEC"
      kind: standard
      ref: "IEC 62402（淘汰管理框架；未取得正文，仅据二手资料引用）"
  confidence: medium
  conflicts: >-
    同一型号的二供料数据手册可能不一致。例如 AMS1117 在 UMW 的数据手册里要求 22 uF 钽电容作输出电容以保证稳定性，
    其他厂商版本可能给出不同值（未核对）；因此二供替换必须以实际下单料号的数据手册为准。
  applies_to: [bom, mcu, ldo, mosfet]
  tags: [cat-feeder]

- id: GEN-ARC-005
  title: 封装与器件选择要匹配贴片厂的库和工艺
  domain: general
  stage: architecture
  severity: should
  rule: >-
    选型时只用目标贴片厂有料、能贴装的封装；无源件优先用贴片厂的基础库（Basic）料，尽量减少不同料号的扩展库（Extended）料种数；
    BOM 每一行必须能匹配到厂方料号（LCSC Part #）。
  rationale: >-
    JLC 对每个不同的扩展库料收一次上料费，BOM 里匹配不到库的料不会被贴装；在选型阶段处理比在下单前改封装代价小得多。
  parameters:
    - {name: extended_part_loading_fee, op: "==", value: 3, unit: "USD/料种", note: "JLCPCB PCB Assembly FAQ：每个扩展库料种；Preferred Extended 在 Economic 组装免该费。费用以官网当前页面为准"}
  verify:
    - method: bom_check
      tool: "kicad-cli sch export bom + JLC/LCSC 零件库查询脚本"
      check: >-
        BOM 每个非 DNP 行都必须有 LCSC Part #（格式 Cxxxx）且能在库中匹配；统计 Basic / Preferred / Extended 数量，
        匹配不到的行为失败；输出唯一扩展库料种数及对应费用。
      automatable: full
  sources:
    - title: "PCB Assembly FAQs"
      url: "https://jlcpcb.com/help/article/pcb-assembly-faqs"
      publisher: "JLCPCB"
      kind: vendor_guide
      section: "Basic vs. Extended components"
    - title: "How to generate BOM and Pick and Place file in Sprint-Layout 6（LCSC Part # 写入 Comment，格式 Cxxxx）"
      url: "https://jlcpcb.com/help/article/how-to-generate-bom-and-pick-and-place-file-in-sprint-layout-6"
      publisher: "JLCPCB"
      kind: vendor_guide
  confidence: high
  applies_to: [smt, bom]
  tags: [cat-feeder]

- id: GEN-ARC-006
  title: MCU / 模块选型前做引脚预算并剔除受限引脚
  domain: general
  stage: architecture
  severity: should
  rule: >-
    选 MCU 或模块之前，列出全部需要的外设、信号和 ADC 通道，映射到具体引脚形成引脚分配表；把不能自由使用的引脚（strapping、
    flash / PSRAM 占用、USB、调试口、上电毛刺、受限的 ADC 通道）标出并排除；给调试口和测试点留出空闲引脚；读器件勘误表。
  rationale: >-
    引脚总数不等于可用 GPIO。ESP32-C3 的 GPIO2 / 8 / 9 是 strapping 引脚，部分引脚上电有毛刺，ADC2 在部分版本上不可用；
    在布局之后才发现引脚冲突，只能改板或牺牲功能。
  parameters:
    - {name: esp32c3_strapping_pins, op: qualitative, value: null, note: "GPIO2、GPIO8、GPIO9（数据手册 Table 3-1）"}
    - {name: esp32c3_power_up_low_glitch_duration, op: "==", value: 5, unit: ns, note: "MTCK、MTDO、GPIO10、U0RXD 上电低电平毛刺（数据手册 Table 2-2）"}
    - {name: esp32c3_gpio18_power_up_high_glitch_duration, op: "==", value: 50000, unit: ns, note: "GPIO18 上电高电平毛刺约 50 us（数据手册 Table 2-2）"}
  verify:
    - method: review
      tool: "引脚分配表（YAML / CSV）+ 自写校验脚本"
      check: >-
        脚本读取分配表和器件受限引脚清单（strapping、flash、USB、JTAG、毛刺引脚），任何功能落在受限引脚上必须有书面豁免；
        再与 kicad-cli 导出的网表比对，保证表中引脚和原理图一致。
      automatable: partial
  sources:
    - title: "ESP32-C3 Series Datasheet v2.4"
      url: "https://documentation.espressif.com/esp32-c3_datasheet_en.pdf"
      publisher: "Espressif"
      kind: datasheet
      section: "Table 2-1 Pin Overview、Table 2-2 Power-Up Glitches on Pins、Table 3-1"
    - title: "Schematic Checklist - ESP32-C3（GPIO、ADC 两节）"
      url: "https://docs.espressif.com/projects/esp-hardware-design-guidelines/en/latest/esp32c3/schematic-checklist.html"
      publisher: "Espressif"
      kind: vendor_guide
  confidence: high
  applies_to: [mcu, module, esp32]
  tags: [cat-feeder]

- id: GEN-ARC-007
  title: 按电源轨做功耗预算并计入峰值电流
  domain: general
  stage: architecture
  severity: must
  rule: >-
    为每条电源轨建表：列出各负载的典型电流和峰值电流（如射频发射脉冲、电机启动），求和后加余量，与稳压器限流、输入源能力、
    保险丝 / PPTC 保持电流和连接器额定值比较；线性稳压器还要算耗散 (Vin - Vout) x Iout 和结温。
  rationale: >-
    平均电流很小的无线 MCU 板，峰值电流可能是平均值的几十倍；电源只按平均值选就会在射频发射时掉压重启。
    线性稳压器把压差全部转成热，结温超限会进入热关断。
  parameters:
    - {name: supply_output_current_min, op: ">=", value: 500, unit: mA, note: "Espressif 对 ESP32-C3 单电源 3.3 V 方案的要求（原理图检查表 Power Supply）"}
    - {name: esp32c3_wifi_tx_peak_current, op: "==", value: 335, unit: mA, note: "数据手册 v2.4 Table 5-7，802.11b 1 Mbps @21 dBm，100% 占空比，3.3 V，25 degC"}
  verify:
    - method: bom_check
      tool: "电源预算表 + 脚本"
      check: >-
        每条轨：sum(Ipeak_i) x (1 + 余量比例) <= 稳压器额定输出且 <= 输入源能力；线性稳压器 P = (Vin_max - Vout) x Iout，
        Tj = Tamb_max + P x theta_JA 必须小于 Tj_max（PD(max) = (TJmax - Tamb)/theta_JA）。余量比例由项目策略给定。
      automatable: full
    - method: bench
      tool: "功耗仪 / 示波器 + 电流探头"
      check: "抓取联网、发射和电机启动时刻的输入电流波形，峰值不得超过预算表，电源轨最低电压不得低于器件最小工作电压。"
      automatable: manual
  sources:
    - title: "Schematic Checklist - ESP32-C3"
      url: "https://docs.espressif.com/projects/esp-hardware-design-guidelines/en/latest/esp32c3/schematic-checklist.html"
      publisher: "Espressif"
      kind: vendor_guide
      section: "Power Supply"
    - title: "ESP32-C3 Series Datasheet v2.4"
      url: "https://documentation.espressif.com/esp32-c3_datasheet_en.pdf"
      publisher: "Espressif"
      kind: datasheet
      section: "5.6 Current Consumption, Table 5-7"
    - title: "AMS1117 datasheet (UMW)，最大允许功耗公式"
      url: "https://mm.digikey.com/Volume0/opasdata/d220001/medias/docus/5011/AMS1117.pdf"
      publisher: "UMW"
      kind: datasheet
      section: "Absolute maximum ratings 脚注 1"
    - title: "pcb-checklist: schematic checklist（Power）"
      url: "https://github.com/azonenberg/pcb-checklist/blob/master/schematic-checklist.md"
      publisher: "Andrew Zonenberg"
      kind: blog
  confidence: high
  applies_to: [power_tree, ldo, wireless_mcu]
  tags: [cat-feeder]

- id: GEN-ARC-008
  title: 先定上电时序与复位释放条件
  domain: general
  stage: architecture
  severity: should
  rule: >-
    在架构阶段写明各电源轨的上电 / 掉电顺序和复位释放条件，并满足器件手册的时序（ESP32-C3 的具体数值见 GEN-SCH-007 与 GEN-SCH-006）；
    轨电压上升慢或不稳（电池充电、光伏等）时加电源监控器。
    多电压器件之间若存在反向供电或闩锁风险，要么限定先后顺序，要么用器件手册给出的钳位办法。
  rationale: >-
    一条轨有电、另一条轨还没起来时，芯片内部隔离结构可能正偏产生电流，严重时触发闩锁。
    复位在电源稳定之前释放，芯片会带着未定义的内部状态启动。
  parameters:
    - {name: esp32c3_power_monitor_threshold, op: "==", value: 3.0, unit: V, note: "Espressif 建议的监控器阈值，约 3.0 V，用于慢速 / 不稳定供电"}
  verify:
    - method: spice
      tool: "ngspice / LTspice（电源斜坡 + 复位 RC 的瞬态仿真）"
      check: >-
        用实际电源上升时间（最慢和最快各一个）仿真：CHIP_EN 上升越过 VIL_nRST（0.25 x VDD，数据手册 Figure 2-4 中 tSTBL 的终点）的时刻必须晚于各电源轨达到 2.8 V（Figure 2-4 的标注点）至少 50 us，
        且 EN 随后要升过 VIH_nRST（0.75 x VDD）；掉电再上电的最短间隔下 EN 也必须低于 VIL_nRST 至少 50 us（tRST）。
      automatable: partial
    - method: bench
      tool: "示波器（多通道）"
      check: "同时抓取 5 V、3V3、EN、strapping 引脚，确认顺序和时间间隔满足上述参数，覆盖冷启动、热复位和欠压恢复。"
      automatable: manual
  sources:
    - title: "Power Supply Sequencing Solutions for Dual Supply Voltage DSPs (SLVA073A)"
      url: "https://www.ti.com/lit/an/slva073a/slva073a.pdf"
      publisher: "Texas Instruments"
      kind: app_note
      section: "1.1 Core and I/O Sequencing Requirements"
    - title: "ESP32-C3 Series Datasheet v2.4"
      url: "https://documentation.espressif.com/esp32-c3_datasheet_en.pdf"
      publisher: "Espressif"
      kind: datasheet
      section: "2.5.3 Chip Power-up and Reset, Table 2-11, Table 3-2"
    - title: "Schematic Checklist - ESP32-C3"
      url: "https://docs.espressif.com/projects/esp-hardware-design-guidelines/en/latest/esp32c3/schematic-checklist.html"
      publisher: "Espressif"
      kind: vendor_guide
      section: "Chip Power-up and Reset"
  confidence: high
  applies_to: [mcu, multi_rail, supervisor]
  tags: [cat-feeder]

- id: GEN-ARC-009
  title: 核对每条数字链路的电平兼容与过压
  domain: general
  stage: architecture
  severity: must
  rule: >-
    对每条数字链路（含模块、传感器小板、外部连接器），在最坏电源电压下核对 VOH(min) >= VIH(min)、VOL(max) <= VIL(max)，
    并确认驱动端高电平不会超过接收端的最大输入电压（VDD + 0.3 V 或绝对最大值）。模块用 5 V 供电时其输出可能是 5 V 电平，需要电平转换或改用 3.3 V 供电。
  rationale: >-
    阈值不满足时通信时好时坏，输入超压会通过 ESD 钳位二极管灌电流，累积损伤 IO。模块板上的电平由模块自己的供电轨决定，容易被忽视。
  parameters:
    - {name: esp32c3_vih_min, op: ">=", value: 0.75, unit: "x VDD", note: "数据手册 Table 5-4：高电平输入阈值下限"}
    - {name: esp32c3_vil_max, op: "<=", value: 0.25, unit: "x VDD", note: "Table 5-4：低电平输入阈值上限"}
    - {name: esp32c3_voh_min, op: ">=", value: 0.8, unit: "x VDD", note: "Table 5-4：输出高电平下限"}
    - {name: esp32c3_vol_max, op: "<=", value: 0.1, unit: "x VDD", note: "Table 5-4：输出低电平上限"}
    - {name: esp32c3_vih_abs_max_over_vdd, op: "<=", value: 0.3, unit: V, note: "输入电压上限为 VDD + 0.3 V（Table 5-4 的 VIH 最大值）"}
    - {name: i2c_vih_min, op: ">=", value: 0.7, unit: "x VCC", note: "TI SLVA689A 的 I2C 阈值定义；VIL 最大 0.3 x VCC"}
  verify:
    - method: review
      tool: "链路表（驱动端器件 / 电源轨 / VOH,VOL，接收端器件 / 电源轨 / VIH,VIL）+ 网表脚本"
      check: >-
        脚本从网表取每条信号网络的驱动端与接收端，按各器件所在电源轨的最小 / 最大电压代入阈值公式，
        VOH_min >= VIH_min、VOL_max <= VIL_max 且 V_drive_max <= V_receiver_max_input，任一不满足即失败。
      automatable: partial
    - method: bench
      tool: "示波器"
      check: "在最低和最高电源电压下抓信号电平，高电平 >= VIH_min 加余量，不得超过接收端最大输入电压。"
      automatable: manual
  sources:
    - title: "ESP32-C3 Series Datasheet v2.4"
      url: "https://documentation.espressif.com/esp32-c3_datasheet_en.pdf"
      publisher: "Espressif"
      kind: datasheet
      section: "Table 5-4 DC Characteristics (3.3 V, 25 degC)"
    - title: "I2C Bus Pullup Resistor Calculation (SLVA689A)"
      url: "https://www.ti.com/lit/pdf/slva689"
      publisher: "Texas Instruments"
      kind: app_note
      section: "2 Pullup Resistor Calculation"
  confidence: high
  applies_to: [digital_io, sensor_module, level_shift]
  tags: [cat-feeder]

- id: GEN-ARC-010
  title: 连接器按触点数与温度折算电流并防插错
  domain: general
  stage: architecture
  severity: should
  rule: >-
    选连接器时，用厂家的降额曲线按同时通电的触点数和最高环境温度折算每触点电流；没有曲线时按额定电流的 50% 使用；
    同时选带防呆（极性定位）的型号，并核对线缆是直连还是镜像接线。
  rationale: >-
    连接器发热正比于 I^2R，电流翻倍发热变成四倍；多触点同时通电会互相加热，每触点可用电流比单触点额定值小。
    环境温度升高时接触电阻上升，温升更大。线缆接反在原型阶段很常见。
  parameters:
    - {name: connector_current_stress_max, op: "<=", value: 0.5, unit: "额定电流的比例", note: "NASA PD-ED-1201：继电器与连接器；无降额曲线时的保守默认"}
    - {name: samtec_per_contact_fraction_50pct_energized, op: "==", value: 0.75, unit: "单触点额定电流的比例", note: "Samtec 博客的经验值：50% 触点通电；仅 Samtec 系列，具体以所选系列曲线为准"}
    - {name: samtec_per_contact_fraction_100pct_energized, op: "==", value: 0.6, unit: "单触点额定电流的比例", note: "同上，100% 触点通电"}
    - {name: connector_temp_rise_max, op: "<=", value: 30, unit: K, note: "Wurth 为 UL1059 取的最大温升，各厂商 / 标准取值不同"}
  verify:
    - method: bom_check
      tool: "电源预算表 + 连接器降额数据"
      check: >-
        每个电源连接器：I_per_contact = I_rail_peak / 并联触点数，必须 <= 曲线给出的 (额定电流 x 通电触点折算系数) 在最高环境温度下的值；
        曲线缺失时 I_per_contact <= 0.5 x 额定。
      automatable: partial
    - method: bench
      tool: "热电偶 / 热像仪"
      check: "在最坏电流下测连接器温升，与厂家规定的最大温升（如 30 K）比较。"
      automatable: manual
    - method: review
      tool: "接口表"
      check: "逐个连接器核对引脚定义、是否防呆、对端线缆是直连还是镜像。"
      automatable: manual
  sources:
    - title: "Derating of Connectors (ANE006a)"
      url: "https://www.digikey.com/Site/Global/Layouts/DownloadPdf.ashx?pdfUrl=4032FAAF37CF46A1A3088C1458463D5C"
      publisher: "Wurth Elektronik"
      kind: app_note
      section: "2.1 Temperature rise theory, 3.1 Derating"
    - title: "Connector Voltage and Power Rating 101"
      url: "https://blog.samtec.com/post/connector-voltage-and-power-rating-101/"
      publisher: "Samtec"
      kind: vendor_guide
    - title: "PD-ED-1201 EEE Parts Derating"
      url: "https://extapps.ksc.nasa.gov/Reliability/Documents/Preferred_Practices/1201.pdf"
      publisher: "NASA GSFC"
      kind: standard
      section: "Table 1"
    - title: "pcb-checklist: schematic checklist（Verify pinout of cables to other boards）"
      url: "https://github.com/azonenberg/pcb-checklist/blob/master/schematic-checklist.md"
      publisher: "Andrew Zonenberg"
      kind: blog
  confidence: medium
  conflicts: >-
    NASA 的 50% 是通用上限，Samtec 的触点折算系数和 Wurth 的温升判据是连接器系列相关的方法，数值不能互相替代。
    取舍：有厂商降额曲线时用曲线，没有曲线时用 50% 作为保守默认。
  applies_to: [connector, power_input, motor_output]
  tags: [cat-feeder]

