- id: GEN-VER-006
  title: 把仿真与实测对照并记录模型的适用范围
  domain: general
  stage: verification
  severity: should
  rule: >-
    用作签核依据的仿真，必须有同条件下的实测对照，并记录模型的特性、对照结果和局限；厂商模型在对照前只当作假设。
    差异超出规定范围时修正模型或加大设计余量，不直接采信仿真。
  rationale: >-
    EDN 的案例里，厂商 LDO 模型显示带宽约为实测的两倍、相位裕度超过 30 度，而实测只有约 21.7 度，67.3 kHz；
    只信仿真会误判稳定。分立元件模型也可能有错误（钽电容软件模型的错误、MOSFET 的米勒电荷与手册不符）。
  parameters:
    - {name: example_ldo_bench_phase_margin, op: "==", value: 21.7, unit: deg, note: "EDN/AEi 案例的实测相位裕度（带宽 67.3 kHz）；厂商模型给出超过 30 度。案例值，不是阈值"}
  verify:
    - method: bench
      tool: "示波器 / 网络分析仪 / 阶跃负载"
      check: "按相同的负载、电压、温度条件测量被仿真的指标（输出阶跃响应、带宽、相位裕度或建立时间），与仿真结果并列记录差异。"
      automatable: manual
    - method: spice
      tool: "ngspice / LTspice"
      check: "用实测修正后的模型重跑签核仿真；差异超出项目规定的容忍范围（项目自定）时，模型不得用作签核依据。"
      automatable: partial
  sources:
    - title: "SPICE models need correlation to measurements"
      url: "https://www.edn.com/spice-models-need-correlation-to-measurements/"
      publisher: "EDN"
      kind: blog
  confidence: medium
  applies_to: [simulation, bench_correlation]

- id: GEN-VER-007
  title: 首次上电按步骤逐轨进行并限流
  domain: general
  stage: verification
  severity: should
  rule: >-
    首板上电前先目检并测量每条电源轨对地电阻（接近 0 欧姆就停止）；用限流可调的台式电源，限流设在略高于预期静态电流处，
    电压从零缓升；从输入向内逐轨上电，每个稳压器输出确认无误再启用下一级；上电时用热像仪或手指监测发热。
  rationale: >-
    新板最常见的首次上电故障是短路、反向和焊接桥连；限流把故障限制在不烧毁器件的能量内，逐轨上电让故障定位到一个稳压器范围内。
  parameters:
    - {name: first_power_current_limit_small_board, op: range, value: [50, 100], unit: mA, note: "projects-house 对小型板的建议，略高于预期静态电流；示例板含电机和射频，应按各级预期电流单独设"}
  verify:
    - method: bench
      tool: "限流台式电源、万用表、热像仪"
      check: >-
        步骤清单：1) 目检（放大 10 倍）；2) 各轨对地电阻并记录；3) 限流上电，缓升电压，监测电流；
        4) 出现恒流模式、电流随电压持续上升或发热时停止；5) 逐轨测实际电压并与预期比较；6) 确认上电时序。
        每一步记录实际值。
      automatable: manual
  sources:
    - title: "PCB Bring-Up: Powering On a New Board Without Killing It"
      url: "https://www.projects-house.com/articles/electronics-development/pcb-bring-up-new-board/"
      publisher: "Projects House"
      kind: blog
  confidence: medium
  applies_to: [bring_up, first_article]
  tags: [cat-feeder]

- id: GEN-VER-008
  title: 下单前按固定门禁逐项签核
  domain: general
  stage: verification
  severity: must
  rule: >-
    生成订单（或把文件发给板厂 / 贴片厂）之前，全部门禁必须通过并有记录：ERC 零违规；含奇偶性的 DRC 零违规（所有严重级别）；
    BOM 每个非 DNP 行都能匹配厂方料号；贴装预览已核对旋转与极性；网表差异已审阅且附 IPC-D-356；独立评审完成；
    当前版本已打标签。涉及付款的步骤另需下单人明确同意。
  rationale: >-
    各检查覆盖的范围互不重叠：ERC 不替代 DRC 和奇偶性，DRC 查不出旋转错误，零违规也不验证数据手册限值。
    任何一项缺失，错误都会带到板厂。
  verify:
    - method: erc
      tool: "kicad-cli sch erc --severity-all --exit-code-violations"
      check: "门禁 1：退出码 0。"
      automatable: full
    - method: drc
      tool: "kicad-cli pcb drc --schematic-parity --severity-all --exit-code-violations"
      check: "门禁 2：退出码 0。"
      automatable: full
    - method: bom_check
      tool: "kicad-cli sch export bom + 厂方零件库匹配脚本"
      check: "门禁 3：每个非 DNP 行有 MPN 和 LCSC 号且在库中匹配（见 GEN-ARC-005、GEN-LIB-008）。"
      automatable: full
    - method: review
      tool: "门禁运行器（形如 scripts/preflight.py 的脚本）+ 签核清单"
      check: >-
        门禁 4-7：贴装预览旋转核对记录、网表差异记录（GEN-NET-006）、评审记录（GEN-VER-004）、git 标签存在。
        运行器汇总所有门禁，任一失败则返回非零退出码并阻止后续下单步骤。
      automatable: partial
  sources:
    - title: "How to run ERC in KiCad from the command line reliably"
      url: "https://www.makeirl.com/blog/run-erc-kicad-command-line"
      publisher: "MakeIRL"
      kind: blog
      section: "Limits / CI gating"
    - title: "KiCad Command-Line Interface"
      url: "https://docs.kicad.org/8.0/en/cli/cli.html"
      publisher: "KiCad"
      kind: tool_doc
      section: "sch erc / pcb drc"
    - title: "PCB Assembly FAQs（BOM 中匹配不到库的料不会被贴装）"
      url: "https://jlcpcb.com/help/article/pcb-assembly-faqs"
      publisher: "JLCPCB"
      kind: vendor_guide
    - title: "Do You Need an IPC-D-356 Netlist?"
      url: "https://resources.altium.com/p/do-you-need-ipc-d-356-netlist"
      publisher: "Altium"
      kind: vendor_guide
  confidence: medium
  applies_to: [release, order, gate]
  tags: [cat-feeder]

- id: GEN-VER-009
  title: EDA 文件进版本控制，忽略缓存并给下单版本打标签
  domain: general
  stage: verification
  severity: should
  rule: >-
    项目文件（.kicad_pro、.kicad_sch、.kicad_pcb、项目本地库、库表、被引用的 3D 模型）放进 git；忽略缓存、锁文件、自动备份和可再生输出；
    每个下单版本打标签并保存其出图包的清单（文件名与哈希）；评审用渲染出的图而不是原始 s-expression 差异。
  rationale: >-
    KiCad 的文件是文本，可以进 git，但一个电阻的改动可能触及几百行，原始差异不适合评审；
    备份 zip 每次保存都会重写，是仓库膨胀的主因；没有标签就无法复现某个已下单版本。
  verify:
    - method: review
      tool: "git ls-files 与 .gitignore 检查脚本"
      check: >-
        git ls-files 中不得出现 fp-info-cache、*-backups/、_autosave-*、~*.lck、*.kicad_prl 等；
        项目文件、sym-lib-table、fp-lib-table 和项目库必须已被跟踪；每个已下单版本存在 git 标签，且标签对应的出图包清单文件存在。
      automatable: full
  sources:
    - title: "KiCad.gitignore (github/gitignore)"
      url: "https://github.com/github/gitignore/blob/main/KiCad.gitignore"
      publisher: "GitHub"
      kind: tool_doc
    - title: "Version control for KiCad projects"
      url: "https://boardrepo.com/guides/kicad-version-control"
      publisher: "BoardRepo"
      kind: blog
  confidence: medium
  conflicts: >-
    GitHub 的 KiCad.gitignore 忽略备份、自动保存和 fp-info-cache；BoardRepo 的指南认为自动保存和备份默认应保留，因为它们可能含有主文件里没有的恢复内容。
    取舍：备份 zip 和自动保存不进 git（体积与噪声），恢复靠频繁提交；缓存与锁文件一律忽略。
  applies_to: [version_control, git]
