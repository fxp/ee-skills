- id: GEN-NET-001
  title: 信号网络显式命名并统一命名风格
  domain: general
  stage: netlist
  severity: should
  rule: >-
    信号网络用描述用途的名字，全设计统一一套风格（大小写、分隔符、低有效后缀）；名字只含字母、数字和下划线；
    凡是出现在多页、网络类、测试点或固件引脚映射里的网络必须显式命名，不得依赖 Net-(R1-Pad1) 之类的自动名。
  rationale: >-
    没有标签的网络，KiCad 用所连的符号引脚生成名字，连接的引脚一变名字就变，按名字匹配的网络类、测试点和固件引脚表会失效；
    同一网络上有两个不同的标签时 KiCad 只保留其中一个并给出警告，容易被当成噪声忽略。
  verify:
    - method: erc
      tool: "自写脚本：kicad-cli sch export netlist --format kicadsexpr + kicad-cli sch erc"
      check: >-
        正则检查所有网络名 ^[A-Za-z0-9_+\-/]+$；属于以下集合的网络名不得以 Net-( 开头：网络类模式匹配到的网络、含测试点的网络、
        固件引脚映射中的网络。ERC 的 multiple_net_names 为 0。
      automatable: full
  sources:
    - title: "KiCad 10 Schematic Editor manual — Net name assignment / Labels"
      url: "https://docs.kicad.org/10.0/en/eeschema/eeschema.html"
      publisher: "KiCad"
      kind: tool_doc
    - title: "Creating high quality electronics schematics"
      url: "https://blog.poly.nomial.co.uk/2025-08-10-creating-high-quality-electronics-schematics.html"
      publisher: "Graham Sutherland"
      kind: blog
      section: "Net labels and naming"
    - title: "KiCad ERC Error Reference"
      url: "https://pcbkit.com/tools/kicad-erc-reference/"
      publisher: "pcbkit"
      kind: blog
  confidence: medium
  conflicts: >-
    低有效信号的写法在各资料中并不统一（_N / _B 后缀、前缀 /、前缀 n 等）。取舍：选定一种写进项目约定并全局一致，不强求某一种。
  applies_to: [net_naming]

- id: GEN-NET-002
  title: 网络类承载约束并保证每个网络都有归属
  domain: general
  stage: netlist
  severity: should
  rule: >-
    在原理图 / 板级设置里定义网络类（至少 Default、大电流电源、差分对等），每个类写明线宽、间距、过孔尺寸、差分对宽度和间距；
    按网络名模式或原理图网络类指令把每个网络分配到类；板级设置里的约束是不可被网络类突破的最小值。
  rationale: >-
    约束写在网络类里，布线与 DRC 才能自动执行，不靠人记；未分配的网络落入 Default，大电流网络落入 Default 就会按信号线宽布线。
    网络类里的线宽 / 过孔是首选值而不是上下限，真正的下限在板级设置。
  verify:
    - method: erc
      tool: "kicad-cli sch erc --severity-all"
      check: "undefined_netclass（默认 Error）为 0。"
      automatable: full
    - method: drc
      tool: "解析 .kicad_pro 的 net_settings + kicad-cli pcb drc"
      check: >-
        脚本读出每个网络所属的类，对电源 / 电机大电流网络必须分配到大电流类（线宽满足载流计算）；
        DRC 在对应约束下无线宽 / 间距违规。
      automatable: partial
  sources:
    - title: "KiCad 10 PCB Editor manual — Net Classes"
      url: "https://docs.kicad.org/10.0/en/pcbnew/pcbnew.html"
      publisher: "KiCad"
      kind: tool_doc
      section: "Net Classes"
    - title: "KiCad ERC Error Reference"
      url: "https://pcbkit.com/tools/kicad-erc-reference/"
      publisher: "pcbkit"
      kind: blog
  confidence: high
  applies_to: [netclass, constraints]
  tags: [cat-feeder]

- id: GEN-NET-003
  title: 差分对的两个网络同名并用一致的 _P/_N 后缀
  domain: general
  stage: netlist
  severity: must
  rule: >-
    差分对的两个网络使用相同的基础名和一致的后缀对：_P / _N 或 + / -，不得混用（USB+ 配 USB_N 不构成一对）；
    在原理图里命名，不在 PCB 里改。
  rationale: >-
    KiCad 靠基础名加正负后缀识别差分对，识别不了就无法用差分对布线器，长度和间距规则也无法按对应用。
  verify:
    - method: erc
      tool: "自写脚本：网表中配对检查"
      check: "每个以 _P 或 + 结尾的网络都存在同基础名、同风格的 _N 或 - 网络，反之亦然；同一设计里不出现两种后缀风格混用的配对。"
      automatable: full
    - method: drc
