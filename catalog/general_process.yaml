      tool: "评审清单（版本化，如 docs 下的 schematic_review.md）+ 评审记录"
      check: >-
        清单至少覆盖：每个 IC 引脚与数据手册逐脚核对、勘误、电源轨预算、上电时序、复位与 strapping、去耦、未用引脚、连接器保护、
        降额、BOM 生命周期。每条有「通过 / 不适用 / 发现 + 处理」记录；评审人不是原作者。
      automatable: manual
