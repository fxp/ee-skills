  tags: [cat-feeder]

- id: GEN-SCH-014
  title: 每个对外连接器线路都要有保护决策
  domain: general
  stage: schematic
  severity: should
  rule: >-
    每个引出板外的连接器引脚都有一个明确的保护决策并画在原理图里：电源输入有保险丝 / PPTC、反接保护和 TVS；信号线有 ESD 二极管阵列。
    TVS 的反向工作电压高于线路最大工作电压，钳位电压低于被保护 IC 的绝对最大值；预留不贴的保护焊盘也要画出来。
  rationale: >-
    连接器是 ESD 和浪涌的入口。保护器件在原理图里缺失，到布局阶段才补就没有合适位置；
    TVS 离连接器越近、对地电感越小，钳位效果越好。
  verify:
    - method: erc
      tool: "自写脚本：kicad-cli sch export netlist"
      check: "对每个对外连接器的每个信号 / 电源引脚，网络上存在保护类元件（TVS、ESD 阵列、PPTC / 保险丝）或在白名单里有书面豁免。"
      automatable: partial
    - method: emc_precompliance
      tool: "ESD 枪（IEC 61000-4-2 接触 / 空气放电）"
      check: "对每个对外连接器按产品要求的等级放电，板子不得损坏、不得复位或死机（按产品的判据等级）。"
      automatable: manual
  sources:
    - title: "ESD Protection Layout Guide (SLVA680)"
      url: "https://www.ti.com/lit/pdf/slva680"
      publisher: "Texas Instruments"
      kind: app_note
      section: "TVS placement guidelines"
    - title: "pcb-checklist: schematic checklist（Power: fuse / reverse-protect + TVS）"
      url: "https://github.com/azonenberg/pcb-checklist/blob/master/schematic-checklist.md"
      publisher: "Andrew Zonenberg"
      kind: blog
    - title: "Schematic Checklist - ESP32-C3（电源入口 ESD 二极管 + 10 uF）"
      url: "https://docs.espressif.com/projects/esp-hardware-design-guidelines/en/latest/esp32c3/schematic-checklist.html"
      publisher: "Espressif"
      kind: vendor_guide
      section: "Power Supply"
  confidence: medium
  conflicts: >-
    保险丝与 TVS 的先后顺序在各资料中并不统一（TVS 在保险丝之前能先泄放能量但可能烧保险丝；在之后则保护下游）。
    这里不规定顺序，只要求存在保护决策；顺序与器件选型归 emc_esd 领域的规则。
  applies_to: [connector, power_input, usb, uart]
  tags: [cat-feeder]

- id: GEN-SCH-015
  title: 从数据手册典型电路出发并遵守元件限制说明
  domain: general
  stage: schematic
  severity: must
  rule: >-
    以数据手册的典型应用电路为起点，逐条读「元件限制」类说明（稳压器输出电容类型 / ESR / 最小值、反馈电阻范围、使能时序），
    偏离典型电路处在原理图注明理由。采购料号的数据手册才是准，不同厂商的同名料可能要求不同。
  rationale: >-
    线性稳压器的稳定性依赖输出电容的容值与 ESR，用错类型会振荡；偏离典型电路又未记录，评审和后续维护都无法判断是有意还是失误。
  parameters:
    - {name: ams1117_umw_output_capacitor, op: "==", value: 22, unit: uF, note: "UMW 版 AMS1117 手册：22 uF 钽电容可覆盖所有旁路情况；该手册未给出 ESR 范围。其他厂商版本可能要求不同，以实际料号手册为准"}
  verify:
    - method: review
      tool: "对照表：原理图元件 vs 数据手册 Typical Application / Component Selection"
      check: "每个 IC 列出手册中所有带 must / require / recommended 字样的元件要求，并逐条标记「满足」「偏离（理由）」。"
      automatable: manual
    - method: spice
      tool: "厂商 SPICE 模型（ngspice / LTspice）"
      check: "对稳压器输出网络做 AC 回路增益或负载阶跃仿真，电容使用有效容值（含直流偏压降低）和 ESR；相位裕度或负载阶跃的稳定性满足厂商判据。"
      automatable: partial
    - method: bench
      tool: "示波器"
      check: "负载阶跃和最大 / 最小负载下观察输出，不得有持续振荡。"
      automatable: manual
  sources:
    - title: "AMS1117 1A LDO Voltage Regulator datasheet (UMW)"
      url: "https://mm.digikey.com/Volume0/opasdata/d220001/medias/docus/5011/AMS1117.pdf"
      publisher: "UMW"
      kind: datasheet
      section: "FUNCTION DESCRIPTION"
    - title: "pcb-checklist: schematic checklist（Confirm linear regulators and references are stable with the selected output cap ESR）"
      url: "https://github.com/azonenberg/pcb-checklist/blob/master/schematic-checklist.md"
      publisher: "Andrew Zonenberg"
      kind: blog
      section: "Power"
    - title: "Schematic Design Review Checklist（Power）"
      url: "https://resources.altium.com/p/schematic-review-checklist"
      publisher: "Altium"
      kind: vendor_guide
  confidence: high
  conflicts: >-
    不同厂商的 AMS1117 兼容料数据手册对输出电容要求不一致（有的写 22 uF 钽，有的写 10 uF 钽或 MLCC；后者来自搜索结果摘要，未打开原文）。
    取舍：以实际下单料号对应厂商的手册为准，并避免把 MLCC 直接当作 22 uF 钽的替代，除非该手册明确允许。
  applies_to: [ldo, regulator, datasheet_review]
  tags: [cat-feeder]

- id: GEN-SCH-016
  title: 关键位置标注容差、耐压和取值依据
  domain: general
  stage: schematic
  severity: should
  rule: >-
    决定精度或稳定性的元件（反馈分压、增益电阻、检流电阻、基准、滤波器 RC、LDO 电容）在原理图字段里写明容差、耐压或额定功率、电容介质，
    极性元件标极性；在图上用注释记录取值依据（公式、仿真文件名、各轨最大电流和主要器件耗散）。
  rationale: >-
    容差是误差预算的输入，不写出来就无法复核；取值依据丢失后，后续改版没人知道哪个值能动。
    TI 的最坏情况分析把初始容差、温漂与老化分开累加，说明标称值不是设计值。
  parameters:
    - {name: monte_carlo_runs, op: range, value: [1000, 100000], unit: "次", note: "TI SLYP673：蒙特卡洛分析的典型运行次数"}
    - {name: x7r_tolerance_stack_example, op: qualitative, value: null, note: "TI SLYP673 示例：X7R 初始 10%、温度 15%、寿命末期 21%；EOL 值应取自厂商"}
  verify:
    - method: bom_check
      tool: "kicad-cli sch export bom 带 Tolerance、Voltage、Dielectric 字段"
      check: "项目维护关键位号清单（反馈分压、检流、基准、滤波 RC、稳压器电容）；清单内元件的容差、耐压、介质字段必须非空，且容差不大于误差预算要求。"
      automatable: partial
    - method: spice
      tool: "ngspice / LTspice（STEP + Monte Carlo）"
      check: "对该功能块做极值（EVA）或蒙特卡洛分析：用初始容差、温漂和老化范围，输出误差落在需求给定的范围内。"
      automatable: partial
  sources:
    - title: "Creating high quality electronics schematics"
      url: "https://blog.poly.nomial.co.uk/2025-08-10-creating-high-quality-electronics-schematics.html"
      publisher: "Graham Sutherland"
      kind: blog
      section: "Annotation of values, ratings, and limits"
    - title: "How to avoid design problems by using worst case analysis calculations (SLYP673)"
      url: "https://www.ti.com/lit/pdf/slyp673"
      publisher: "Texas Instruments"
      kind: app_note
      section: "Worst case analysis definition / method types / component tolerances"
    - title: "pcb-checklist: schematic checklist（Specify voltage, power, and tolerance ratings for passives；标记极性元件）"
      url: "https://github.com/azonenberg/pcb-checklist/blob/master/schematic-checklist.md"
      publisher: "Andrew Zonenberg"
      kind: blog
  confidence: medium
  applies_to: [feedback_divider, current_sense, filter, reference]
  tags: [cat-feeder]

- id: GEN-SCH-017
  title: I2C 上拉电阻按上升时间和灌电流计算
  domain: general
  stage: schematic
  severity: should
  rule: >-
    I2C 上拉电阻满足 Rp(min) = (VCC - VOL(max)) / IOL 和 Rp(max) = tr / (0.8473 x Cb)，其中 tr 是所用速率模式的最大上升时间（30% 到 70%），
    Cb 是总线电容；总线电容不得超出规范上限。在速度和功耗之间选值。
  rationale: >-
    上拉太强，器件下拉不到有效低电平；上拉太弱，RC 时间常数使线路在被拉低之前来不及升到高电平。
  parameters:
    - {name: i2c_rise_time_max_standard_mode, op: "<=", value: 1000, unit: ns, note: "SLVA689A Table 2-1；Fast mode 300 ns，Fast mode plus 120 ns"}
    - {name: i2c_rise_time_max_fast_mode, op: "<=", value: 300, unit: ns, note: "SLVA689A Table 2-1"}
    - {name: i2c_bus_capacitance_max_standard_fast, op: "<=", value: 400, unit: pF, note: "SLVA689A Table 2-1；Fast mode plus 为 550 pF"}
    - {name: i2c_vol_max, op: "<=", value: 0.4, unit: V, note: "VCC > 2 V，灌 3 mA 时"}
  verify:
    - method: tline_calc
      tool: "Python 计算脚本"
      check: >-
        输入 VCC、IOL、tr 上限、估算 Cb（元件引脚电容加走线电容）：计算 Rp(min) 和 Rp(max)，所选电阻必须落在区间内。
        例：Cb = 200 pF、VCC = 3.3 V、Fast mode：Rp 在 0.97 到 1.77 kOhm 之间。
      automatable: full
    - method: bench
      tool: "示波器"
      check: "测 SDA / SCL 的 30%-70% 上升时间 <= 所用模式的 tr 上限，低电平 <= VOL(max)。"
      automatable: manual
  sources:
    - title: "I2C Bus Pullup Resistor Calculation (SLVA689A)"
      url: "https://www.ti.com/lit/pdf/slva689"
      publisher: "Texas Instruments"
      kind: app_note
      section: "2 Pullup Resistor Calculation, 4 Example"
  confidence: high
  applies_to: [i2c]

