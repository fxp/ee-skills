- id: GEN-VER-005
  title: 布局前只仿真数据手册答不了的关键块
  domain: general
  stage: verification
  severity: consider
  rule: >-
    布局前对数据手册无法直接回答的块做仿真：上电 / 复位时序（电源斜坡加 RC）、稳压器稳定性与负载阶跃（用有效电容与 ESR）、
    检流放大链的增益 / 限幅 / 滤波、栅极驱动与续流路径、容差最坏情况。数据手册已给出结论的简单电路不必仿真。
  rationale: >-
    仿真的成本在建模和验证模型，只有结果会改变设计决策的块才值得做；
    这些块的错误在板子回来之后很难靠改值修复，且依赖元件的实际行为（偏压降容、ESR、容差）。
  verify:
    - method: spice
      tool: "ngspice（kicad-cli sch export netlist --format spice 或 KiCad 内置仿真器）"
      check: >-
        对每个入选块写一个带判据的仿真网表（例如 EN 越过阈值的时刻、输出过冲 / 欠冲、ADC 输入最大电压、栅极峰值电压），
        批处理运行并检查判据；容差用 STEP 或蒙特卡洛（TI SLYP673 给出的典型运行次数为 1000-100000 次）。
      automatable: partial
  sources:
    - title: "Schematic Design Review Checklist（Power：simulate switch-mode regulators for stability, current capability and voltage regulation）"
      url: "https://resources.altium.com/p/schematic-review-checklist"
      publisher: "Altium"
      kind: vendor_guide
    - title: "How to avoid design problems by using worst case analysis calculations (SLYP673)"
      url: "https://www.ti.com/lit/pdf/slyp673"
      publisher: "Texas Instruments"
      kind: app_note
    - title: "KiCad Command-Line Interface — sch export netlist（spice 格式）"
      url: "https://docs.kicad.org/8.0/en/cli/cli.html"
      publisher: "KiCad"
      kind: tool_doc
  confidence: medium
  applies_to: [simulation, power_up, ldo, current_sense, gate_drive]
