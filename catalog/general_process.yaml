- id: GEN-SCH-012
  title: 全部元件完成标注，位号唯一且稳定
  domain: general
  stage: schematic
  severity: should
  rule: >-
    所有元件都已标注（无 ? 号），位号唯一；一旦 PCB 已开始布局，
    不得随意重新标注，必须重标时通过「从原理图更新 PCB」传递，并检查网表对比。
  rationale: >-
    位号是原理图、BOM、PCB、坐标文件之间的关联键；重复位号或未标注元件会让 BOM 与贴装文件错位，
    重新标注又会让已布局的位号与丝印整体对不上。
  verify:
