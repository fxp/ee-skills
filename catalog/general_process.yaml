- id: GEN-NET-004
  title: 网络只在原理图里改，PCB 变更要反向标注
  domain: general
  stage: netlist
  severity: must
  rule: >-
    连接关系只在原理图中修改，用「从原理图更新 PCB」传递；PCB 侧发生的变更（引脚交换、门交换、位号重排、封装更换）
    必须用「从 PCB 更新原理图」同步回去并审阅预览，再重新做一次正向更新，直到两侧无差异。
  rationale: >-
    正向和反向标注是原理图与 PCB 保持一致的唯一通道；在 PCB 里手改网络会在下次正向更新时被覆盖或产生冲突。
    更新默认按符号的唯一标识（UUID）而不是位号匹配，「按位号重新关联」选项通常应保持关闭。
