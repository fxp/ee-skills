- id: GEN-VER-003
  title: 打开默认被忽略的 ERC 检查
  domain: general
  stage: verification
  severity: should
  rule: >-
    把默认「忽略」的 ERC 检查改成 Warning 或 Error 并纳入门禁：至少包括 single_global_label（全局标签只出现一次）、
    footprint_filter（封装与符号过滤器不符）；四路交叉点 four_way_junction 视图纸风格决定是否开启。
