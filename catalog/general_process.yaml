- id: GEN-SCH-001
  title: 按功能块组织原理图，页间只用层次标签连接
  domain: general
  stage: schematic
  severity: should
  rule: >-
    把原理图分成带标题的功能块（电源输入、每个连接器及其保护、MCU、每个传感器 / 执行器），信号从左到右、电源在上、地在下；
    元件多时拆成层次化多页，页间连接只用层次标签（hierarchical label）与图纸引脚；单页内用网络标签代替长连线。
  rationale: >-
    评审者靠功能块定位问题；跨页用全局标签乱连会让信号走向无法追踪。层次标签和图纸引脚名不一致时 KiCad 会报错，
    便于发现漏接。
  verify:
    - method: erc
      tool: "kicad-cli sch erc --severity-all --exit-code-violations"
      check: "hier_label_mismatch、duplicate_sheet_names（均为默认 Error）和 label_dangling 必须为 0。"
      automatable: full
    - method: review
      tool: "评审清单"
      check: "每页有标题和功能块边框；每个子页的接口在父页可见；没有为省事而用全局标签跨页的信号（电源轨除外）。"
      automatable: manual
  sources:
    - title: "Creating high quality electronics schematics"
      url: "https://blog.poly.nomial.co.uk/2025-08-10-creating-high-quality-electronics-schematics.html"
      publisher: "Graham Sutherland"
      kind: blog
      section: "Hierarchy and sheet organisation"
    - title: "KiCad 10 Schematic Editor manual — Labels"
      url: "https://docs.kicad.org/10.0/en/eeschema/eeschema.html"
      publisher: "KiCad"
      kind: tool_doc
      section: "Labels / hierarchical sheets"
    - title: "KiCad ERC Error Reference"
      url: "https://pcbkit.com/tools/kicad-erc-reference/"
      publisher: "pcbkit"
      kind: blog
  confidence: medium
  applies_to: [schematic, multi_sheet]

- id: GEN-SCH-002
  title: 电源轨用统一的电源符号并规范命名
  domain: general
  stage: schematic
  severity: should
  rule: >-
    每条电源轨使用唯一的电源符号名；名字里体现电压，用 V 代替小数点（3V3、1V8），大小写固定；电源符号朝上、地符号朝下；
    不要对电源网络使用信号标签，也不要让同一条轨出现两种写法。
  rationale: >-
    KiCad 把仅大小写不同的标签当成不同网络，两种写法的电源轨会悄悄断开；网络只能有一个名字，同网络上出现两个不同标签时只保留一个。
    名字里带小数点还可能被部分工具拒绝。
  verify:
    - method: erc
      tool: "kicad-cli sch erc --severity-all --exit-code-violations"
      check: "similar_power、similar_labels、similar_label_and_power、multiple_net_names、same_local_global_label 全部为 0（默认 Warning）。"
      automatable: full
    - method: erc
      tool: "自写脚本：kicad-cli sch export netlist 后用正则检查网络名"
      check: "电源轨网络名匹配 ^[+]?[0-9]+V[0-9]*$|^(VIN|VBUS|VBAT|GND)$ 等项目白名单，含小数点或非白名单的电源轨名失败。"
      automatable: full
  sources:
    - title: "KiCad 10 Schematic Editor manual — Net name assignment / Labels"
      url: "https://docs.kicad.org/10.0/en/eeschema/eeschema.html"
      publisher: "KiCad"
      kind: tool_doc
    - title: "KiCad ERC Error Reference"
      url: "https://pcbkit.com/tools/kicad-erc-reference/"
      publisher: "pcbkit"
      kind: blog
    - title: "Creating high quality electronics schematics"
      url: "https://blog.poly.nomial.co.uk/2025-08-10-creating-high-quality-electronics-schematics.html"
      publisher: "Graham Sutherland"
      kind: blog
      section: "Net labels and naming / Power symbols"
  confidence: medium
  applies_to: [schematic, power_rail]

- id: GEN-SCH-003
  title: 每个电源引脚（对）都画出规定值的去耦电容
  domain: general
  stage: schematic
  severity: should
  rule: >-
    每个 IC 电源脚（或相邻的电源 / 地脚对）在原理图中都有数据手册规定值的去耦电容，靠近该 IC 符号并写明容值、介质和耐压；
    模拟电源脚（AVCC / VDDA / AREF）单独去耦；每个电源轨的入口有大电容；连接器上的电源脚也有去耦。
  rationale: >-
    数字电路在时钟沿上以纳秒级脉冲取电，脉冲电流靠去耦电容就近供给；电容遗漏或值不对，到布局阶段无法弥补。
    原理图里写清每个电容服务哪个引脚，布局时才能按引脚就近放置。
  parameters:
    - {name: esp32c3_vdd3p3_cpu_decoupling, op: "==", value: 0.1, unit: uF, note: "Espressif：VDD3P3_CPU 靠近引脚 0.1 uF"}
    - {name: esp32c3_vdd3p3_bulk, op: ">=", value: 10, unit: uF, note: "Espressif：VDD3P3 轨 10 uF 外加 0.1 uF；主电源入口至少 10 uF 加 ESD 二极管"}
    - {name: esp32c3_vdd_spi_decoupling, op: "==", value: 1, unit: uF, note: "Espressif：VDD_SPI 向外部器件供 3.3 V 时靠近引脚 1 uF"}
    - {name: mcu_analog_supply_decoupling_typ, op: "==", value: 100, unit: nF, note: "Microchip AN2519：AVCC / AREF 的典型去耦值"}
    - {name: tantalum_voltage_rating_margin, op: ">=", value: 20, unit: "%", note: "Altium 检查表：钽电容额定电压至少比最大预期电压高 20%"}
  verify:
    - method: erc
      tool: "自写脚本：kicad-cli sch export netlist --format kicadsexpr"
      check: >-
        对每个 IC 的每个电源脚 / 引脚对：该脚所在网络上存在电容，且其另一端接地网络；容值与 IC 的去耦要求表（YAML）一致；
        电源网络上电容的数量 >= IC 电源引脚对数。
      automatable: partial
    - method: review
      tool: "评审清单"
      check: "对照数据手册 Power Supply / Decoupling 章节逐脚核对，模拟电源、参考电压脚、连接器电源脚是否遗漏。"
      automatable: manual
  sources:
    - title: "Schematic Checklist - ESP32-C3"
      url: "https://docs.espressif.com/projects/esp-hardware-design-guidelines/en/latest/esp32c3/schematic-checklist.html"
      publisher: "Espressif"
      kind: vendor_guide
      section: "Power Supply"
    - title: "AN2519 AVR Microcontroller Hardware Design Considerations"
      url: "https://ww1.microchip.com/downloads/en/Appnotes/AN2519-AVR-Microcontroller-Hardware-Design-Considerations-00002519B.pdf"
      publisher: "Microchip"
      kind: app_note
      section: "2.1 Digital Supply, 2.2 Analog Supply"
    - title: "Schematic Design Review Checklist"
      url: "https://resources.altium.com/p/schematic-review-checklist"
      publisher: "Altium"
      kind: vendor_guide
      section: "Power / Decoupling"
  confidence: high
  conflicts: >-
    Microchip 要求多电源脚器件的每对电源 / 地脚都要有去耦电容；Sutherland 的文章认为同电压的多个脚可以接到同一个电源端口，
    把电容并排画在器件旁边，不必每个电容单独连线，只要用途清楚。
    取舍：原理图层面要求「数量和值可追溯到引脚」，不强制逐脚连线的画法；邻近关系由布局阶段的规则检查。
  applies_to: [mcu, ic, connector]
  tags: [cat-feeder]

- id: GEN-SCH-004
  title: 为每个输入定义确定电平，不允许悬空
  domain: general
  stage: schematic
  severity: must
  rule: >-
    每个输入、使能、模式选择和开漏 / 三态线在所有状态（上电、复位、线缆拔出）下都有确定电平：外部上拉 / 下拉；
    未使用的 CMOS 逻辑输入接电源或地；MCU 内部上下拉只有在该引脚复位状态允许时才可依赖。电阻取值不得使输入跳变时间超出器件限制。
  rationale: >-
    CMOS 输入悬空或缓慢穿越阈值区时，P 管 N 管同时导通，电源电流可达毫安级，还可能引起输出振荡与可靠性问题。
    MCU 复位期间多数 GPIO 只是输入使能、没有上下拉，表现为高阻。
  parameters:
    - {name: bus_pullup_pulldown_resistance, op: range, value: [1000, 10000], unit: ohm, note: "TI SCBA004E 第 5 节：用于保持总线确定状态，通常 1-10 kOhm；还要满足最大输入跳变时间"}
    - {name: esp32c3_internal_pullup_typ, op: "==", value: 45, unit: kohm, note: "数据手册 Table 5-4 的内部弱上拉典型值；复位期间多数 GPIO 无上拉（Table 2-1）"}
    - {name: esp32c3_input_leakage_max, op: "<=", value: 50, unit: nA, note: "Table 5-4 的 IIH / IIL"}
  verify:
    - method: erc
      tool: "KiCad ERC + 自写网表脚本"
      check: >-
        ERC 中 pin_not_driven、pin_not_connected 为 0；脚本另检查：只连接输入类引脚、没有驱动脚也没有电阻上下拉的网络（悬空输入）必须为 0。
      automatable: partial
    - method: bench
      tool: "万用表 / 示波器"
      check: "断开外部连接线后，逐个测量这些输入端的静态电平，必须处于确定的高或低；上电瞬间用示波器看有无中间电平。"
      automatable: manual
  sources:
    - title: "Implications of Slow or Floating CMOS Inputs (SCBA004E)"
      url: "https://www.ti.com/lit/an/scba004e/scba004e.pdf"
      publisher: "Texas Instruments"
      kind: app_note
      section: "1 Characteristics of Slow or Floating CMOS Inputs, 5 Pull-up or Pull-down Resistors"
    - title: "Schematic Checklist - ESP32-C3"
      url: "https://docs.espressif.com/projects/esp-hardware-design-guidelines/en/latest/esp32c3/schematic-checklist.html"
      publisher: "Espressif"
      kind: vendor_guide
      section: "GPIO"
    - title: "ESP32-C3 Series Datasheet v2.4"
      url: "https://documentation.espressif.com/esp32-c3_datasheet_en.pdf"
      publisher: "Espressif"
      kind: datasheet
      section: "Table 2-1, Table 5-4"
    - title: "Schematic Design Review Checklist（Pull-ups and pull-downs）"
      url: "https://resources.altium.com/p/schematic-review-checklist"
      publisher: "Altium"
      kind: vendor_guide
  confidence: high
  applies_to: [digital_io, cmos, mcu]
  tags: [cat-feeder]

- id: GEN-SCH-005
  title: 执行器驱动脚在上电和复位期间必须保持关断
  domain: general
  stage: schematic
  severity: must
  rule: >-
    驱动 MOSFET 栅极、继电器、电机驱动使能的每个 MCU 引脚，必须有外部下拉（或拉向关断态）电阻，使引脚高阻或有毛刺期间栅极电压始终低于 Vgs(th) 最小值；
    优先选没有已知上电毛刺的引脚，固件启动最早期把该引脚设成关断态输出。
  rationale: >-
    ESP32-C3 复位期间大部分 GPIO 只是输入使能、没有上下拉，栅极悬空会随机导通；个别引脚上电还有 5 ns 低电平毛刺，GPIO18 有约 50 us 的高电平毛刺。
    引脚漏电流上限 50 nA，100 kOhm 下拉只产生 5 mV，对栅极阈值没有影响。
  parameters:
    - {name: esp32c3_input_leakage_max, op: "<=", value: 50, unit: nA, note: "数据手册 Table 5-4：IIH / IIL，用来估算下拉电阻的上限"}
    - {name: esp32c3_gpio18_high_glitch, op: "==", value: 50000, unit: ns, note: "Table 2-2：GPIO18 上电高电平毛刺约 50 us，不要用它直接驱动执行器"}
    - {name: esp32c3_low_glitch_pins, op: "==", value: 5, unit: ns, note: "Table 2-2：MTCK、MTDO、GPIO10、U0RXD 上电低电平毛刺"}
  verify:
    - method: erc
      tool: "自写脚本：kicad-cli sch export netlist"
      check: "对每个 MOSFET 栅极（或驱动器使能）网络：必须存在一个电阻接到源极 / 地，阻值 <= 项目设定上限（示例板取 100 kOhm）；栅极网络不得直接连到 GPIO18。"
      automatable: full
    - method: spice
      tool: "ngspice / LTspice"
      check: >-
        栅极 RC（含栅极电容）接高阻 MCU 引脚模型，再注入 50 us 的高电平毛刺：栅极峰值电压必须 < MOSFET 的 Vgs(th) 最小值，并留出余量。
      automatable: partial
    - method: bench
      tool: "示波器 + 电流探头"
      check: "多次冷启动、按复位键、切 EN，监视栅极和电机电流，不得出现非预期的动作或电流。"
      automatable: manual
  sources:
    - title: "ESP32-C3 Series Datasheet v2.4"
      url: "https://documentation.espressif.com/esp32-c3_datasheet_en.pdf"
      publisher: "Espressif"
      kind: datasheet
      section: "Table 2-1 Pin Overview, Table 2-2 Power-Up Glitches on Pins, Table 5-4"
    - title: "Schematic Design Review Checklist（power-up-critical pins such as MOSFET and transistor gates）"
      url: "https://resources.altium.com/p/schematic-review-checklist"
      publisher: "Altium"
      kind: vendor_guide
      section: "Pull-ups and pull-downs"
    - title: "Schematic Checklist - ESP32-C3（GPIO 上电毛刺）"
      url: "https://docs.espressif.com/projects/esp-hardware-design-guidelines/en/latest/esp32c3/schematic-checklist.html"
      publisher: "Espressif"
      kind: vendor_guide
      section: "GPIO"
  confidence: high
  applies_to: [mosfet_gate, motor_driver, relay_driver]
  tags: [cat-feeder]

- id: GEN-SCH-006
  title: strapping / boot 引脚按手册配置且不加冲突负载
  domain: general
  stage: schematic
  severity: must
  rule: >-
    对 MCU 的 strapping 和 boot 引脚，在原理图里写明复位释放时需要的电平，并保证外部电路（上拉、下拉、按键、模块）满足该电平和保持时间，
    不在这些引脚上挂会改变电平或延时的负载。ESP32-C3：GPIO9 加上拉（按键拉低进入下载模式），GPIO2 也建议上拉，GPIO8 在 ROM 打印控制中有作用；GPIO9 不加大电容。
  rationale: >-
    strapping 引脚在复位释放时被锁存，电平错误会让芯片进入下载模式或不同的启动配置；
    GPIO9 加大电容会拖慢上升沿而被误判成低电平。
  parameters:
    - {name: esp32c3_spi_boot_levels, op: qualitative, value: null, note: "GPIO2=1，GPIO8=任意，GPIO9=1（Table 3-3）"}
    - {name: esp32c3_download_boot_levels, op: qualitative, value: null, note: "GPIO2=1，GPIO8=1，GPIO9=0（Table 3-3）"}
    - {name: esp32c3_strapping_setup_time, op: ">=", value: 0, unit: ms, note: "tSU（Table 3-2）"}
    - {name: esp32c3_strapping_hold_time, op: ">=", value: 3, unit: ms, note: "tH：CHIP_EN 变高之后需保持的时间（Table 3-2）"}
  verify:
    - method: erc
      tool: "自写脚本：kicad-cli sch export netlist"
      check: "GPIO2、GPIO8、GPIO9 网络上：存在到 3V3 的上拉电阻（GPIO9、GPIO2 必须），没有对地的大电容，没有其他输出驱动或有源负载。"
      automatable: partial
    - method: bench
      tool: "示波器 + UART 启动日志"
      check: "抓 CHIP_EN 上升沿和 GPIO9 电平，确认 tH >= 3 ms 内电平稳定；不按 BOOT 时串口显示正常启动，按住 BOOT 复位后进入下载模式。"
      automatable: manual
  sources:
    - title: "ESP32-C3 Series Datasheet v2.4"
      url: "https://documentation.espressif.com/esp32-c3_datasheet_en.pdf"
      publisher: "Espressif"
      kind: datasheet
      section: "3 Boot Configurations, Table 3-1, 3-2, 3-3"
    - title: "Schematic Checklist - ESP32-C3"
      url: "https://docs.espressif.com/projects/esp-hardware-design-guidelines/en/latest/esp32c3/schematic-checklist.html"
      publisher: "Espressif"
      kind: vendor_guide
      section: "Strapping Pins"
  confidence: high
  applies_to: [esp32, mcu_boot]
  tags: [cat-feeder]

- id: GEN-SCH-007
  title: 复位 / 使能引脚不得悬空并满足上电时序
  domain: general
  stage: schematic
  severity: must
  rule: >-
    复位 / 使能引脚（ESP32-C3 的 CHIP_EN）必须有确定电平，不得悬空；用 RC 延时使它在电源稳定之后才释放，建议 10 kOhm + 1 uF，
    再按实际电源上升时间调整；上升慢或不稳的供电加监控器；复位走线要短；手动复位键与电容之间加串联电阻限制放电电流。
  rationale: >-
    复位过早释放，芯片会在电压不足时启动；走线长会耦合干扰导致误复位。
    电容直接被开关短路时，放电电流只受接触电阻限制，开关抖动还会产生尖峰。
  parameters:
    - {name: chip_en_pullup_resistance, op: "==", value: 10, unit: kohm, note: "Espressif 建议的起始值，按实际电源时序调整"}
    - {name: chip_en_capacitance, op: "==", value: 1, unit: uF, note: "同上"}
    - {name: esp32c3_rail_stable_before_chip_en, op: ">=", value: 50, unit: us, note: "tSTBL（Table 2-11）"}
    - {name: esp32c3_chip_en_low_to_reset, op: ">=", value: 50, unit: us, note: "tRST（Table 2-11）"}
    - {name: esp32c3_vil_nrst_max, op: "<=", value: 0.25, unit: "x VDD", note: "复位阈值 VIL_nRST（Table 5-4）"}
    - {name: esp32c3_vih_nrst_min, op: ">=", value: 0.75, unit: "x VDD", note: "释放阈值 VIH_nRST（Table 5-4）"}
  verify:
    - method: spice
      tool: "ngspice / LTspice"
      check: >-
        用最慢和最快的电源上升时间仿真 RC 与上拉：EN 上升越过 0.25 x VDD（VIL_nRST，数据手册 Figure 2-4 中 tSTBL 的终点）的时刻晚于各电源轨达到 2.8 V（Figure 2-4 的标注点）至少 50 us，
        且 EN 随后升过 0.75 x VDD（VIH_nRST）；掉电后再上电时 EN 低于 0.25 x VDD 的持续时间 >= 50 us。
      automatable: partial
    - method: erc
      tool: "自写脚本：kicad-cli sch export netlist"
      check: "CHIP_EN 网络上必须同时存在上拉电阻和到地电容；复位按键支路中电容与按键之间有串联电阻。"
      automatable: partial
    - method: bench
      tool: "示波器"
      check: "测量 3V3 与 EN 的时序，并连续做 20 次以上冷启动与掉电重启，不得出现启动失败或需要手动复位。"
      automatable: manual
  sources:
    - title: "Schematic Checklist - ESP32-C3"
      url: "https://docs.espressif.com/projects/esp-hardware-design-guidelines/en/latest/esp32c3/schematic-checklist.html"
      publisher: "Espressif"
      kind: vendor_guide
      section: "Chip Power-up and Reset"
    - title: "ESP32-C3 Series Datasheet v2.4"
      url: "https://documentation.espressif.com/esp32-c3_datasheet_en.pdf"
      publisher: "Espressif"
      kind: datasheet
      section: "2.5.3 Chip Power-up and Reset, Table 2-11, Table 5-4"
    - title: "AN2519 AVR Microcontroller Hardware Design Considerations（外接复位开关需串联电阻）"
      url: "https://ww1.microchip.com/downloads/en/Appnotes/AN2519-AVR-Microcontroller-Hardware-Design-Considerations-00002519B.pdf"
      publisher: "Microchip"
      kind: app_note
      section: "Reset"
  confidence: high
  conflicts: >-
    不同 MCU 的复位网络值不同：Microchip AVR 手册示例是 4.7 kOhm 上拉加 100 nF，ST 对 NRST 的建议也是 100 nF 量级（未取得原文），
    而 ESP32-C3 的 CHIP_EN 建议 10 kOhm 加 1 uF。取舍：按所用器件的手册取值，不套用其他系列的 RC。
  applies_to: [esp32, mcu_reset]
  tags: [cat-feeder]

- id: GEN-SCH-008
  title: 未用引脚按手册处理并显式标注
  domain: general
  stage: schematic
  severity: should
  rule: >-
    每个未用引脚都有明确处理：未用的 CMOS 逻辑输入接电源或地；未用的 XTAL 引脚接地；未用的 MCU GPIO 配成确定状态
    （固件设输出低 / 启用内部上下拉，或预留不贴的外部上下拉焊盘）；数据手册标注 NC 的引脚按手册要求处理；
    完全不连的引脚打 No-Connect 标记，使 ERC 保持干净。
  rationale: >-
    悬空的 CMOS 输入会引起额外电流和振荡；未连接也未打 NC 标记的引脚在 ERC 里是 Error，
    如果被批量静音，真正漏接的引脚也会被一起掩盖。
  verify:
    - method: erc
      tool: "kicad-cli sch erc --severity-all --exit-code-violations"
      check: "pin_not_connected（默认 Error）、no_connect_connected、no_connect_dangling 均为 0；每个 NC 标记都在引脚上。"
      automatable: full
    - method: review
      tool: "未用引脚表"
      check: "逐个未用引脚核对：手册要求（接地 / 接电源 / 悬空 / 配置输出）、实际处理、固件配置三者一致。"
      automatable: manual
  sources:
    - title: "Implications of Slow or Floating CMOS Inputs (SCBA004E)"
      url: "https://www.ti.com/lit/an/scba004e/scba004e.pdf"
      publisher: "Texas Instruments"
      kind: app_note
      section: "5 Pull-up or Pull-down Resistors"
    - title: "AN2519 AVR Microcontroller Hardware Design Considerations"
      url: "https://ww1.microchip.com/downloads/en/Appnotes/AN2519-AVR-Microcontroller-Hardware-Design-Considerations-00002519B.pdf"
      publisher: "Microchip"
      kind: app_note
      section: "6 Unused XTAL Pins"
    - title: "Schematic Checklist - ESP32-C3"
      url: "https://docs.espressif.com/projects/esp-hardware-design-guidelines/en/latest/esp32c3/schematic-checklist.html"
      publisher: "Espressif"
      kind: vendor_guide
      section: "GPIO / Clock Source"
    - title: "KiCad ERC Error Reference"
      url: "https://pcbkit.com/tools/kicad-erc-reference/"
      publisher: "pcbkit"
      kind: blog
  confidence: high
  applies_to: [mcu, logic_ic, module]
  tags: [cat-feeder]

- id: GEN-SCH-009
  title: 晶体负载电容按公式计算并留出杂散电容
  domain: general
  stage: schematic
  severity: should
  rule: >-
    芯片级晶体电路：先从晶体数据手册取 CL，估算总杂散电容 Cs（芯片引脚电容加 PCB），按 CL = C1 x C2 / (C1 + C2) + Cs 计算外部电容，
    对称时 C1 = C2 = 2 x (CL - Cs)；取标准值后复核增益裕度和驱动功率，样板上用实测频偏微调。
  rationale: >-
    振荡频率取决于晶体看到的总负载电容；忽略杂散电容的「两倍 CL」做法会偏大。
    增益裕度不足时可能在实验室起振、在高低温下不起振；驱动功率过大会损坏晶体。
  parameters:
    - {name: stray_capacitance_per_pin_estimate, op: range, value: [2, 5], unit: pF, note: "Microchip AN2519 第 5 节：单脚杂散电容 CS 的估计范围（对称布局），其公式写作 Ce + Ci = 2CL - CS；实际取决于布局与芯片引脚电容"}
    - {name: oscillator_gain_margin_min, op: ">=", value: 5, unit: "倍", note: "ST AN2867 3.4：gm / gm_crit >= 5 才能保证可靠起振"}
    - {name: esp32c3_xtal_frequency_error_after_tuning, op: "<=", value: 10, unit: ppm, note: "Espressif：在 TX tone 模式下测频偏并调整 C1/C2，需在 +-10 ppm 内；40 MHz 晶体精度 +-10 ppm"}
    - {name: esp32c3_xtal_amplitude_min, op: ">", value: 500, unit: mV, note: "Espressif 建议晶体振幅大于 500 mV"}
  verify:
    - method: tline_calc
      tool: "Python 计算脚本"
      check: >-
        输入 CL、Cs、ESR、C0、ppm 预算和 IC 的 gm_crit 参数：输出 C1 = C2、实际 CL、增益裕度 gm / gm_crit（>= 5）、驱动功率 DL（<= 晶体额定）。
        公式：CL = C1*C2/(C1+C2)+Cs；gm_crit = 4*ESR*(2*pi*F)^2*(C0+CL)^2。
      automatable: full
    - method: bench
      tool: "频率计 / 频谱仪（高阻探头）"
      check: "在最终板上测振荡频率或射频输出频偏（ESP32-C3 用 TX tone），偏差在晶体和系统的 ppm 预算内；探头电容会改变负载，按手册方法修正。"
      automatable: manual
  sources:
    - title: "AN2867 Oscillator design guide for STM8AF/AL/S, STM32 MCUs and MPUs (Rev 13)"
      url: "https://ecsxtal.com/store/pdf/stm32-microcontroller-application-note-09232021.pdf"
      publisher: "STMicroelectronics"
      kind: app_note
      section: "3.3 Load capacitance, 3.4 Oscillator transconductance, 3.5 Drive level"
    - title: "AN2519 AVR Microcontroller Hardware Design Considerations"
      url: "https://ww1.microchip.com/downloads/en/Appnotes/AN2519-AVR-Microcontroller-Hardware-Design-Considerations-00002519B.pdf"
      publisher: "Microchip"
      kind: app_note
      section: "5 Using Crystal and Ceramic Resonators, Equation 2"
    - title: "Schematic Checklist - ESP32-C3"
      url: "https://docs.espressif.com/projects/esp-hardware-design-guidelines/en/latest/esp32c3/schematic-checklist.html"
      publisher: "Espressif"
      kind: vendor_guide
      section: "Clock Source"
  confidence: high
  conflicts: >-
    Cs 的定义在资料间不同：ST AN2867 与 Espressif 的 Cs 是整个振荡回路的总杂散电容（公式 CL = C1*C2/(C1+C2) + Cs），
    Microchip AN2519 的 CS 是单脚杂散电容（公式 Ce + Ci = 2CL - CS）。两种写法等价但数值不能混用；
    取舍：沿用所用 MCU 数据手册 / 应用笔记的定义，并在原理图注释里写明 Cs 的取值和定义。
  applies_to: [crystal, chip_down_mcu]

- id: GEN-SCH-010
  title: 为每个可编程器件引出调试 / 烧录接口
  domain: general
  stage: schematic
  severity: should
  rule: >-
    每个可编程器件都要引出烧录和调试接口，信号齐全：Cortex-M 用 Arm 10 针 1.27 mm 接口（VCC 目标参考电压、SWDIO / TMS、SWDCLK / TCK、GND、nRESET，SWO 视需要）；
    ESP32-C3 至少引出 UART0 的 TX / RX、GND、CHIP_EN 和 GPIO9（BOOT）。接口线上加保护，睡眠模式下不要对调试口断电。
  rationale: >-
    没有可达的烧录口，一次固件问题就变成返工；nRESET 缺失时调试器无法做复位后停机，参考电压脚缺失时调试器无法检测目标电压（必需 / 可选的划分是常见做法，Arm 文档只给出接口定义）。
    ESP32 的下载模式靠 GPIO9 与 EN 的组合进入，接口里漏掉其中一个就必须手动短接。
  parameters:
    - {name: cortex_debug_connector_pitch, op: "==", value: 1.27, unit: mm, note: "Arm Cortex Debug Connector（10 针）基于 Samtec 0.05 英寸微型插座"}
    - {name: esp32c3_u0txd_series_resistor, op: "==", value: 499, unit: ohm, note: "Espressif UART 节：U0TXD 串联电阻"}
  verify:
    - method: erc
      tool: "自写脚本：kicad-cli sch export netlist"
      check: "每个可编程器件对应的接口连接器上能追到：烧录所需全部信号（见规则）和 GND；接口网络上有 ESD 保护器件的连接。"
      automatable: partial
    - method: bench
      tool: "烧录器 / esptool"
      check: "新板用该接口完成烧录和读回校验，并能进入下载模式。"
      automatable: manual
  sources:
    - title: "Cortex-M Debug Connectors"
      url: "https://documentation-service.arm.com/static/5fce6c49e167456a35b36af1"
      publisher: "Arm"
      kind: datasheet
      section: "Cortex Debug Connector (10-pin)"
    - title: "Schematic Checklist - ESP32-C3"
      url: "https://docs.espressif.com/projects/esp-hardware-design-guidelines/en/latest/esp32c3/schematic-checklist.html"
      publisher: "Espressif"
      kind: vendor_guide
      section: "UART"
    - title: "pcb-checklist: schematic checklist（Debug header）"
      url: "https://github.com/azonenberg/pcb-checklist/blob/master/schematic-checklist.md"
      publisher: "Andrew Zonenberg"
      kind: blog
  confidence: medium
  applies_to: [programming, debug, swd, uart]
  tags: [cat-feeder]

- id: GEN-SCH-011
  title: 在原理图中为电源轨和关键信号预留测试点
  domain: general
  stage: schematic
  severity: should
  rule: >-
    原理图中为每个电源轨放测试点，至少放两个地测试点（探头接地用），并为复位 / 使能、烧录线、时钟和关键模拟节点放测试点；
    测试点符号带封装，进入 BOM 与布局检查。测试点集中在板的一面。
  rationale: >-
    首板调试靠测试点定位问题；没有测试点时只能飞线或刮绿油。夹具测试时测试点还决定能否使用针床。
  parameters:
    - {name: test_pad_diameter_preferred, op: ">=", value: 1.0, unit: mm, note: "FixturFab：贴片测试焊盘首选；最小 0.8 mm"}
    - {name: test_pad_diameter_min, op: ">=", value: 0.8, unit: mm, note: "FixturFab"}
    - {name: test_point_pitch_preferred, op: ">=", value: 1.9, unit: mm, note: "中心距首选 1.9 mm（75 mil），最小 1.27 mm"}
    - {name: test_point_to_board_edge_preferred, op: ">=", value: 5, unit: mm, note: "FixturFab：首选 5 mm，最小 3.175 mm"}
    - {name: test_point_to_nearest_component_preferred, op: ">=", value: 1.5, unit: mm, note: "FixturFab：首选 1.5 mm，最小 1.0 mm"}
  verify:
    - method: erc
      tool: "自写脚本：kicad-cli sch export netlist"
      check: "网表中每条电源轨网络至少有一个 TP 类元件；GND 网络至少有两个；复位 / 使能 / 烧录信号网络各至少一个。"
      automatable: full
    - method: geometry_script
      tool: "pcbnew Python（参见 ee-pcb-verify 的 geometry 检查器）"
      check: "每个 TP 焊盘直径 >= 0.8 mm（首选 1.0 mm），与最近的其他测试点中心距 >= 1.27 mm（首选 1.9 mm），与板边 >= 3.175 mm（首选 5 mm），与最近元件 >= 1.0 mm（首选 1.5 mm），全部在同一面。夹具数值以实际测试厂要求为准。"
      automatable: full
  sources:
