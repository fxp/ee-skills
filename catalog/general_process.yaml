- id: GEN-VER-002
  title: 按类别理解 ERC 违规，PWR_FLAG 只放在真实电源源头
  domain: general
  stage: verification
  severity: should
  rule: >-
    处理 ERC 违规时先识别类别再动手：连接类（pin_not_connected、wire_dangling）、电气类型类（pin_to_pin、pin_not_driven、power_pin_not_driven）、
    命名类（multiple_net_names、similar_*）、库类（lib_symbol_mismatch）、层次类（hier_label_mismatch）。
    「Input Power pin not driven」用 PWR_FLAG 或输出电源脚消除，但 PWR_FLAG 只放在真实的电源源头（连接器输入、电池端、稳压器输出）。
  rationale: >-
    PWR_FLAG 声明「这个网络有电源」，并不创造电源；散落在每个警告上的 PWR_FLAG 会让真正缺失的供电不再被报告。
    ERC 不能穿过无源器件（保险丝、磁珠、跳线）传播供电，下游侧可能需要单独标注。
  parameters:
    - {name: erc_power_pin_not_driven_default_severity, op: qualitative, value: null, note: "默认 Error；常见于电源来自无源连接器时"}
  verify:
    - method: erc
      tool: "kicad-cli sch erc --severity-all"
      check: "报告中 power_pin_not_driven、pin_to_pin、pin_not_driven 为 0；脚本统计 PWR_FLAG 个数与位置，每个 PWR_FLAG 都必须在电源入口 / 稳压器输出等白名单位置。"
      automatable: partial
    - method: review
      tool: "评审清单"
      check: "对每个 PWR_FLAG 回答：它代表的真实电源是什么？答不出来的删除并修复根因（符号引脚类型或缺失的供电）。"
      automatable: manual
  sources:
