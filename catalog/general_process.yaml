- id: GEN-LIB-005
  title: 自动核对符号引脚与封装焊盘一致
  domain: general
  stage: library
  severity: must
  rule: >-
    对每个库器件自动检查：符号的每个引脚号都能在所选封装里找到同号焊盘（刻意省略的 NC 脚除外），封装里每个有电气意义的焊盘号都对应一个符号引脚；
    重复焊盘号只允许出现在刻意的多焊盘连接（散热焊盘、并联大电流焊盘）。
  rationale: >-
    符号与封装由不同人在不同时间做，引脚号错位是最常见的库缺陷。KiCad 的相关 DRC 项默认只是警告或被忽略，
    只看 DRC 的 error 数会漏掉。
  verify:
    - method: erc
      tool: "自写脚本：kicad-cli sch export netlist --format kicadsexpr + 解析 .kicad_mod"
      check: >-
        遍历网表中每个 (位号, 引脚号)，在对应封装文件里查同号焊盘；再反向查封装里未被引用的焊盘号。
        两个方向的差集都必须为空，或在白名单（NC、散热焊盘）内。
      automatable: full
    - method: netlist_diff
      tool: "kicad-cli pcb drc --schematic-parity --severity-all --exit-code-violations"
      check: >-
        报告中不得出现 Pad net doesn't match schematic（默认 Warning）、Footprint doesn't match symbol's footprint filters（默认 Ignore，
        需手动打开）、Footprint component type doesn't match footprint pads（默认 Ignore，需手动打开）。
      automatable: full
  sources:
    - title: "KiCad 10 PCB Editor manual — List of DRC checks（Schematic parity 表）"
      url: "https://docs.kicad.org/10.0/en/pcbnew/pcbnew.html"
      publisher: "KiCad"
      kind: tool_doc
      section: "Design rules checking / Schematic parity"
  confidence: high
  applies_to: [symbol, footprint]
  tags: [cat-feeder]

- id: GEN-LIB-006
  title: 3D 模型对准焊盘并核对与贴片厂的旋转约定
  domain: general
  stage: library
  severity: should
  rule: >-
    每个非虚拟封装引用一个 STEP 3D 模型，偏移 (0,0,0)、缩放 1、旋转 0，模型已在三维软件中对准封装；
    下单前在贴片厂的贴装预览里逐个核对 1 脚方向和极性，需要时在封装或 CPL 里记录旋转偏移。
  rationale: >-
    KiCad 封装的 0 度方向和贴片厂器件库的约定不一定相同，旋转错误不会触发 DRC，只会造成整批元件贴反。
    模型偏移不为零说明模型和焊盘实际不对齐，3D 干涉检查结果也不可信。
  parameters:
    - {name: model_offset_xyz, op: "==", value: 0, unit: mm, note: "KLC M2.2 / F9.3：模型偏移必须为 (0,0,0)"}
    - {name: model_scale, op: "==", value: 1, unit: "倍", note: "KLC：缩放 1:1:1，STEP 自带绝对尺寸"}
    - {name: model_rotation, op: "==", value: 0, unit: deg, note: "KLC：旋转 0"}
  verify:
    - method: geometry_script
      tool: "解析 .kicad_mod 的 model 块的脚本；kicad-cli pcb export glb/pos"
      check: >-
        所有非虚拟封装都有 model 引用；offset、scale、rotate 均为零 / 1；导出位置文件后，对每个封装检查模型包络中心与焊盘包络中心的偏差。
      automatable: partial
    - method: review
      tool: "贴片厂订单预览（JLCPCB 贴装预览）"
      check: "逐个有极性或 1 脚的器件（IC、二极管、LED、钽电容、连接器）核对预览里的朝向，不一致则调整 CPL 的 Rotation 后重新上传。"
      automatable: manual
  sources:
    - title: "KLC F9.3 Footprint 3D model requirements"
      url: "https://klc.kicad.org/footprint/f9/f9.3/"
      publisher: "KiCad"
      kind: tool_doc
    - title: "KLC M2.2 Model alignment and scaling"
      url: "https://klc.kicad.org/model/m2/m2.2.html"
      publisher: "KiCad"
      kind: tool_doc
    - title: "How to generate BOM and Pick and Place file in Sprint-Layout 6（预览中发现朝向错误，修改 CPL 的 Rotation）"
      url: "https://jlcpcb.com/help/article/how-to-generate-bom-and-pick-and-place-file-in-sprint-layout-6"
      publisher: "JLCPCB"
      kind: vendor_guide
  confidence: medium
  applies_to: [footprint, 3d_model, smt_assembly]
  tags: [cat-feeder]

- id: GEN-LIB-007
  title: 库只有一个来源：项目内库表且纳入版本控制
  domain: general
  stage: library
  severity: should
  rule: >-
    进入板子的符号和封装只来自项目目录内、受版本控制的库，库表用 ${KIPRJMOD} 相对路径引用；不依赖个人全局库表。
    同一个料号和封装只允许有一份权威定义，改库后必须把改动更新到原理图副本和 PCB 并重新跑 ERC / DRC。
  rationale: >-
    KiCad 的原理图里放的是符号的副本，改库不会自动更新副本；项目库表优先于全局库表，
    换一台机器或换一个人打开可能得到不同的符号或封装，导致输出文件不可复现。
  verify:
    - method: erc
      tool: "自写脚本 + kicad-cli sch erc"
      check: >-
        解析项目 sym-lib-table 与 fp-lib-table：每个条目的 URI 必须在项目目录内（${KIPRJMOD} 展开后）且文件已被 git 跟踪；
        ERC 中 lib_symbol_mismatch、lib_symbol_issues、footprint_link_issues 必须为 0。
      automatable: full
    - method: drc
      tool: "kicad-cli pcb drc --schematic-parity --severity-all"
      check: "不得出现 Footprint doesn't match copy in library、Footprint not found in libraries（二者默认都只是 Warning）。"
      automatable: full
  sources:
    - title: "KiCad 10 Schematic Editor manual — Symbol library tables"
      url: "https://docs.kicad.org/10.0/en/eeschema/eeschema.html"
      publisher: "KiCad"
      kind: tool_doc
      section: "Symbols and Symbol Libraries"
    - title: "KiCad 10 PCB Editor manual — DRC 杂项检查（Footprint doesn't match copy in library）"
      url: "https://docs.kicad.org/10.0/en/pcbnew/pcbnew.html"
      publisher: "KiCad"
      kind: tool_doc
      section: "List of DRC checks"
    - title: "Version control for KiCad projects（提交项目本地库与库表）"
      url: "https://boardrepo.com/guides/kicad-version-control"
      publisher: "BoardRepo"
      kind: blog
  confidence: high
  applies_to: [library, version_control]
  tags: [cat-feeder]

- id: GEN-LIB-008
  title: 库器件携带制造商、型号、数据手册和厂方料号
  domain: general
  stage: library
  severity: should
  rule: >-
    每个库器件填写制造商、制造商型号（MPN）、数据手册链接、贴片厂料号（LCSC Part #，格式 Cxxxx）和封装字段；
    同一个值加同一封装只保留一个料号。BOM 导出包含这些字段，字段为空的非 DNP 行视为未完成。
  rationale: >-
    贴片厂按料号匹配 BOM，匹配不到的行不会被贴装；字段缺失还会让生命周期核查和二次采购无法自动化。
  verify:
    - method: bom_check
      tool: "kicad-cli sch export bom --fields Reference,Value,Footprint,${QUANTITY},${DNP},MPN,LCSC"
      check: "导出 CSV 后脚本检查：非 DNP 行的 MPN、LCSC、Datasheet 非空；LCSC 匹配 ^C[0-9]+$；同 (Value, Footprint) 只对应一个 LCSC 号。"
      automatable: full
  sources:
