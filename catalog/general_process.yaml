- id: GEN-VER-004
  title: 布局前由第二人对照数据手册做原理图评审
  domain: general
  stage: verification
  severity: should
  rule: >-
    布局前，由没画这张图的人用版本化的检查清单评审原理图：逐 IC 逐引脚核对数据手册和勘误，电源树、复位 / 启动、去耦、连接器、BOM 与降额；
    记录发现与处理结果并签字。ERC 零违规不等于评审通过。
  rationale: >-
    ERC 只检查连接的电气类型规则，查不出分压比算错、缺上拉、引脚号对错或热设计；
    自检容易重复自己的假设，第二人更容易发现设计假设上的错误。
  verify:
