      check: >-
        分别提取 (位号, 引脚号, 网络名) 三元组的集合，计算三组之间的差集；原理图 vs PCB 差集必须为空；
        当前 vs 上一版的差集必须全部能在变更记录里找到对应条目。
      automatable: full
    - method: review
      tool: "出图包检查清单"
      check: "出图目录含 IPC-D-356 文件；记录它由哪个版本的 EDA 生成；板厂是否使用它由板厂确认（本条未核实 JLCPCB 的做法）。"
