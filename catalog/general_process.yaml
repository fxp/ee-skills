        每个排除项都有非空注释；没有被设为 ignore 的检查项超出项目基线清单；--severity-exclusions 的报告与上次评审保存的例外清单逐项对照。
        （.kicad_pro 内的字段名随 KiCad 版本核对）
      automatable: partial
  sources:
