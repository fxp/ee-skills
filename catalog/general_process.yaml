- id: GEN-LIB-001
  title: 符号的引脚号、名称和电气类型逐脚对照数据手册
  domain: general
  stage: library
  severity: must
  rule: >-
    新建或引入的每个符号，在首次使用前把每个引脚的编号、名称和电气类型（输入 / 输出 / 电源输入 / 无连接）逐脚对照数据手册或厂商引脚表核对，
    即使符号来自可信库或你以前用过。电源输入脚不得隐藏，不接的脚设为 Not Connected 并隐藏。
  rationale: >-
    库错误能通过所有 ERC 和 DRC，直到板子回来才暴露。ERC 的判断依赖符号里正确的电气类型，
    类型填错会让它漏报或误报；隐藏的电源脚会产生看不见的隐式连接。
  verify:
    - method: review
      tool: "两人互查 + 自写脚本（符号引脚表 vs 数据手册引脚表 CSV）"
      check: >-
        脚本解析 .kicad_sym 中每个 pin 的 number、name、electrical type，与从数据手册提取的引脚表逐行比对，
        数量、编号、名称不一致即失败；另检查 power_in 类型的脚没有 hide 属性。
        数据手册引脚表需由第二人确认提取无误。
      automatable: partial
    - method: erc
      tool: "KiCad Symbol Editor 的符号检查器 + ERC"
      check: "符号检查器对该符号无错误；原理图 ERC 在 pin_to_pin、pin_not_driven 类别上无异常。"
      automatable: full
  sources:
    - title: "Schematic Design Review Checklist"
      url: "https://resources.altium.com/p/schematic-review-checklist"
      publisher: "Altium"
      kind: vendor_guide
      section: "Pin verification"
    - title: "pcb-checklist: schematic checklist"
      url: "https://github.com/azonenberg/pcb-checklist/blob/master/schematic-checklist.md"
      publisher: "Andrew Zonenberg"
      kind: blog
      section: "Datasheet verification"
    - title: "KiCad 10 Schematic Editor manual（pin electrical types、symbol checker、ERC）"
      url: "https://docs.kicad.org/10.0/en/eeschema/eeschema.html"
      publisher: "KiCad"
      kind: tool_doc
      section: "Electrical rules checking / Symbol editor"
    - title: "KLC S4.1 General pin requirements / S4.6 Hidden pins"
      url: "https://klc.kicad.org/symbol/s4/s4.6/"
      publisher: "KiCad"
      kind: tool_doc
  confidence: high
  applies_to: [symbol, ic, module, connector]
  tags: [cat-feeder]

- id: GEN-LIB-002
  title: 焊盘图形取自厂商推荐或 IPC-7351 并1:1核对
  domain: general
  stage: library
  severity: must
  rule: >-
    封装焊盘优先采用器件厂商数据手册里的推荐焊盘图形；没有时用 IPC-7351 的生成规则，回流焊量产取 Nominal（N）密度等级，
    手工焊 / 原型取 Most（M），高密度取 Least（L），并把等级写进封装名或描述。新封装必须与数据手册机械图的尺寸做 1:1 对照。
  rationale: >-
    焊盘尺寸决定焊点形态（趾部、跟部、侧向焊脚）与桥连风险。TI 对 0.5 mm 间距的 QFN 要求焊盘宽度缩到 0.28 mm 以下以免桥连，
    说明通用规则不能代替具体封装的推荐值。
  parameters:
    - {name: ipc7351_default_density_level, op: qualitative, value: null, note: "回流焊量产用 Nominal（N）；M 为手工焊 / 原型，L 为高密度"}
    - {name: qfn_pad_width_0p5mm_pitch, op: "<=", value: 0.28, unit: mm, note: "TI SLUA271：0.5 mm 间距 QFN/SON 避免桥连的焊盘宽度，以具体器件手册为准"}
  verify:
    - method: geometry_script
      tool: "解析 .kicad_mod 的 Python 脚本"
      check: >-
        从数据手册推荐焊盘图形整理成 YAML（焊盘中心坐标、尺寸），脚本逐焊盘比对 .kicad_mod，
        中心偏差和尺寸偏差都不得超过项目设定的容差（建议 0.05 mm，属项目选择）；焊盘数不一致即失败。
      automatable: partial
    - method: review
      tool: "1:1 打印纸样 / STEP 叠图"
      check: "把封装按 1:1 打印，放上实物器件，或把 STEP 模型叠在焊盘上，确认引脚落在焊盘中并留有焊脚空间。"
      automatable: manual
  sources:
    - title: "QFN and SON PCB Attachment (SLUA271C)"
      url: "https://www.ti.com/lit/slua271"
      publisher: "Texas Instruments"
      kind: app_note
      section: "3.1 Land Pad Styles, 3.2 Land Pad Design, 3.3 Lead Finger Pad PCB Design"
    - title: "PCB Land Pattern Design — IPC-7351B 密度等级与命名"
      url: "https://www.atlaspcb.com/blog/pcb-land-pattern-design-ipc-7351b-footprint-standards/"
      publisher: "AtlasPCB"
      kind: blog
    - title: "IPC-7351B Generic Requirements for Surface Mount Design and Land Pattern Standard"
      publisher: "IPC"
      kind: standard
      ref: "IPC-7351B（付费标准，未取得正文）"
  confidence: medium
  applies_to: [footprint, smd, qfn]
  tags: [cat-feeder]

- id: GEN-LIB-003
  title: 每个封装画闭合的 courtyard 并满足外扩量
  domain: general
  stage: library
  severity: should
  rule: >-
    每个封装在 F.CrtYd（需要时 B.CrtYd）画闭合的 courtyard，外扩量不小于项目规定值：KLC 默认 0.25 mm，部件任一边小于 1.5 mm 时 0.15 mm，
    连接器、罐形电容、晶体 0.5 mm，BGA 1.0 mm；线宽 0.05 mm，坐标落在 0.01 mm 网格上。
  rationale: >-
    courtyard 是贴片机吸嘴、返修和装配公差需要的最小净空，DRC 靠它检查相邻元件是否重叠。
    没有 courtyard 的封装等于不参与间距检查。
  parameters:
    - {name: courtyard_clearance_default, op: ">=", value: 0.25, unit: mm, note: "KLC F5.3 默认；IPC-7351 的 Nominal 等级同为 0.25 mm"}
    - {name: courtyard_clearance_small_part, op: ">=", value: 0.15, unit: mm, note: "KLC F5.3：部件小于 1.5 mm 时"}
    - {name: courtyard_clearance_connector_canned_cap_crystal, op: ">=", value: 0.5, unit: mm, note: "KLC F5.3；连接器另需加上插拔所需空间"}
    - {name: courtyard_clearance_bga, op: ">=", value: 1.0, unit: mm, note: "KLC F5.3；含 WLCSP 等"}
    - {name: courtyard_line_width, op: "==", value: 0.05, unit: mm, note: "KLC F5.3"}
    - {name: courtyard_grid, op: "==", value: 0.01, unit: mm, note: "KLC F5.3"}
    - {name: ipc7351_courtyard_excess_most_nominal_least, op: range, value: [0.1, 0.5], unit: mm, note: "IPC-7351B 按密度等级：Most 0.5、Nominal 0.25、Least 0.1（每边）"}
  verify:
    - method: drc
      tool: "KiCad DRC（kicad-cli pcb drc --severity-all）"
      check: "DRC 不得有 courtyard 重叠违规；重叠被 DRC 作为违规报告，不要在 DRC 设置里把该项设为忽略。"
      automatable: full
    - method: geometry_script
      tool: "解析 .kicad_mod 的脚本"
      check: >-
        对每个封装，计算焊盘与 F.Fab 本体外框的包络，courtyard 外框到包络的最小距离必须 >= 对应分类的外扩量；
        缺少 F.CrtYd 图形的封装直接失败。
      automatable: full
  sources:
    - title: "KLC F5.3 Courtyard layer requirements"
      url: "https://klc.kicad.org/footprint/f5/f5.3.html"
      publisher: "KiCad"
      kind: tool_doc
    - title: "KiCad 10 PCB Editor manual（Footprint properties：courtyard 重叠产生 DRC 违规）"
      url: "https://docs.kicad.org/10.0/en/pcbnew/pcbnew.html"
      publisher: "KiCad"
      kind: tool_doc
      section: "Footprint properties"
    - title: "PCB Land Pattern Design — IPC-7351B"
      url: "https://www.atlaspcb.com/blog/pcb-land-pattern-design-ipc-7351b-footprint-standards/"
      publisher: "AtlasPCB"
      kind: blog
  confidence: medium
  conflicts: >-
    IPC 体系内数值不统一：PCB Libraries 论坛转引的 IPC-7352 表按焊盘边 / 本体边分列（SMD：焊盘边 0.50 / 0.25 / 0.20 mm，本体边 1.00 / 0.50 / 0.25 mm），
    同一帖子里另一位用户说 IPC-7352 只给每个等级一个值；该厂商自己的偏好又是 0.10 / 0.20 / 0.40 mm；
    各来源对 A/B/C 与 M/N/L 的对应也不一致。取舍：以 KiCad KLC 的 0.25 mm 默认值作为可复现基线，
    项目有更紧凑的需求时在项目策略里明确放宽并让贴片厂确认。
  applies_to: [footprint, courtyard]

- id: GEN-LIB-004
  title: 带散热焊盘的封装补全焊盘编号、过孔与钢网开窗
  domain: general
  stage: library
  severity: should
  rule: >-
    带裸露焊盘 / 散热片的封装（QFN、SON、SOT-223 的散热片、模块底部地焊盘）在符号里有对应编号的引脚，在封装里有同编号的焊盘，
    尺寸与器件裸露焊盘一致；散热过孔与焊盘同编号；锡膏开窗做成约 50-70% 覆盖的分块，而不是 1:1 全开。
  rationale: >-
    裸露焊盘既是散热路径也是机械固定。1:1 开窗焊料体积过大会让器件浮起造成开路；过孔会吸走焊料，需要控制孔径和是否塞孔。
    焊盘编号缺失会让这块铜在网表里没有网络，ERC 和 DRC 都不报。
  parameters:
    - {name: thermal_pad_pcb_size_vs_package, op: "==", value: 1, unit: "x 器件裸露焊盘", note: "SLUA271 3.4：PCB 散热焊盘尺寸与器件裸露焊盘相等"}
    - {name: thermal_pad_to_lead_pad_clearance_min, op: ">=", value: 0.2, unit: mm, note: "SLUA271 3.4：防桥连的最小间隙，对多数设计足够"}
    - {name: thermal_via_pitch, op: "==", value: 1.0, unit: mm, note: "SLUA271 3.4.1：热要求高时过孔间距约 1.0 mm"}
    - {name: thermal_via_drill_start, op: "==", value: 0.3, unit: mm, note: "SLUA271：起始孔径；更小孔径焊料流失风险更小。KLC F4.4 给 0.2-0.3 mm"}
    - {name: exposed_pad_paste_coverage, op: range, value: [50, 70], unit: "%", note: "SLUA271C 4.4：锡膏覆盖约为焊盘面积的 50-70%"}
    - {name: thermal_pad_voiding_max, op: "<=", value: 50, unit: "%", note: "SLUA271C 4.4：大功率应用回流后空洞率，需 X 光确认"}
    - {name: klc_back_copper_pad_margin_min, op: ">=", value: 0.5, unit: mm, note: "KLC F4.4：热过孔连到背面铜焊盘时，背面焊盘需包住过孔并留的边距"}
  verify:
    - method: geometry_script
      tool: "解析 .kicad_mod 与 .kicad_sym 的脚本"
      check: >-
        对含裸露焊盘的器件：符号中存在对应编号的引脚（如 EP / 末位编号）；封装中该编号的焊盘尺寸与数据手册一致；
        锡膏层开口总面积 / 铜焊盘面积 在 [0.5, 0.7]；过孔孔径 0.2-0.3 mm 且与焊盘同编号。
      automatable: partial
    - method: bench
      tool: "X 光"
      check: "首件回流后拍散热焊盘，空洞面积占比 <= 50%（大功率应用）。"
      automatable: manual
  sources:
